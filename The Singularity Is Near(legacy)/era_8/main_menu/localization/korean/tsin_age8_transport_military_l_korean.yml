l_korean:
 tsin_dreadnoughts_advance: "노급 전함"
 tsin_dreadnoughts_advance_desc: "중포와 장갑을 집중한 석탄 연료 전함을 설계합니다. 기존 전노급 전함도 계속 운용할 수 있습니다."
 tsin_oil_fired_battleships_advance: "중유 연료 주력함"
 tsin_oil_fired_battleships_advance_desc: "석유 공급을 전제로 속력과 선체를 강화한 전함입니다. 별도의 건조·유지 재화를 소비합니다."
 tsin_motor_transport_advance: "자동차 운송"
 tsin_motor_transport_advance_desc: "엔진·석유·고무를 소비하는 자동차 물류 거점으로 도시 유통과 식량 저장을 지원합니다."
 tsin_motor_supply_columns_advance: "자동차 보급대"
 tsin_motor_supply_columns_advance_desc: "도로 운송과 철도 동원을 연계하여 기존 육군의 이동을 개선합니다."
 tsin_powered_flight_advance: "동력 비행"
 tsin_powered_flight_advance_desc: "산업 재화를 소비하며 육군의 지휘·연락을 지원하는 수도 항공 시설을 개발합니다."
 tsin_aerial_observation_advance: "항공 관측 교리"
 tsin_aerial_observation_advance_desc: "항공 관측 보고를 참모부 계획과 기존 지상전의 지휘에 통합합니다."
 n_tsin_dreadnought: "노급 전함"
 n_tsin_dreadnought_desc: "석탄 연료를 사용하는 중포 중심 전함입니다."
 n_tsin_oil_fired_dreadnought: "중유 연료 노급 전함"
 n_tsin_oil_fired_dreadnought_desc: "석유 공급을 필요로 하는 고속 주력함입니다."
 tsin_motor_transport_depot: "자동차 물류 거점"
 tsin_motor_transport_depot_desc: "엔진·석유·고무를 소비하는 도시 물류 거점입니다. 식량 저장량과 이주 유인을 늘립니다."
 tsin_capital_airfield: "수도 항공 시설"
 tsin_capital_airfield_desc: "수도에 건설하는 단일 항공 시설이 육군의 연락을 지원합니다. 산업 시설 그림과 지상군 지원 방식으로 표현합니다."
 tsin_motor_depot_maintenance: "자동차 물류 운영"
 tsin_motor_depot_maintenance_desc: "엔진·연료·고무를 공급하여 물류 거점을 운영합니다."
 tsin_airfield_maintenance: "항공 지상 지원"
 tsin_airfield_maintenance_desc: "항공 엔진·연료·정비 재화를 공급합니다."
 tsin_dreadnought_construction: "노급 전함 건조"
