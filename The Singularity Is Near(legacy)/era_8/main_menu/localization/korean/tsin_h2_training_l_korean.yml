l_korean:
 tsin_modern_field_drill_advance: "현대식 야전 훈련"
 tsin_modern_field_drill_advance_desc: "실탄과 차량을 쓰는 합동 훈련입니다. 군대에 현대식 야전 훈련 명령을 해금합니다."
 tsin_armored_cars_advance: "장갑차 정찰"
 tsin_armored_cars_advance_desc: "장갑차가 경기병의 정찰 역할을 대신합니다."
 tsin_tank_warfare_advance: "전차전"
 tsin_tank_warfare_advance_desc: "전차 대대가 중기병을 대신하는 돌파 병종이 됩니다. 석유와 기갑 차량 비축을 소비합니다."
 tsin_airborne_infantry_advance: "산악·공정 보병"
 tsin_airborne_infantry_advance_desc: "산악전과 공중 강하를 훈련한 정예 경보병입니다."
 tsin_mechanized_infantry_advance: "기계화 보병"
 tsin_mechanized_infantry_advance_desc: "트럭과 반궤도 차량에 탑승하는 중보병입니다. 연료가 필요합니다."
 tsin_self_propelled_artillery_advance: "자주포"
 tsin_self_propelled_artillery_advance_desc: "궤도 차체에 포를 얹어 기갑 부대와 함께 이동합니다."
 tsin_motor_supply_column_advance: "차량화 수송대"
 tsin_motor_supply_column_advance_desc: "트럭 수송대가 마차 수송대를 대신합니다. 연료와 고무가 필요합니다."
 a_tsin_armored_car_recon: "장갑차 정찰대"
 a_tsin_armored_car_recon_desc: "경기병 범주의 고속 정찰 부대입니다."
 a_tsin_tank_battalion: "전차 대대"
 a_tsin_tank_battalion_desc: "중기병 범주의 돌파 부대입니다. 석유와 화포가 필요합니다."
 a_tsin_mountain_paratroopers: "산악·공정 보병"
 a_tsin_mountain_paratroopers_desc: "주도권이 높은 정예 경보병입니다."
 a_tsin_mechanized_infantry: "기계화 보병"
 a_tsin_mechanized_infantry_desc: "차량화된 중보병입니다. 총기와 석유가 필요합니다."
 a_tsin_self_propelled_battery: "자주포 포대"
 a_tsin_self_propelled_battery_desc: "기동력을 갖춘 강력한 포병입니다."
 a_tsin_motor_supply_column: "차량화 수송대"
 a_tsin_motor_supply_column_desc: "석유와 고무가 필요한 보조 트럭 수송대입니다."
 tsin_modern_field_drill: "현대식 야전 훈련"
 tsin_modern_field_drill_desc: "합동 훈련으로 일반 훈련보다 훨씬 빨리 경험을 쌓지만 유지비가 크고 사기가 떨어집니다. 전투·이동·공성이 시작되면 끝납니다."
 tsin_modern_field_drill_cta: "클릭하여 현대식 야전 훈련을 시작합니다."
