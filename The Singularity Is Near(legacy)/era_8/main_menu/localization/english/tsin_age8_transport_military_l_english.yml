l_english:
 tsin_dreadnoughts_advance: "All-big-gun battleships"
 tsin_dreadnoughts_advance_desc: "Concentrate heavy guns and armor in a new coal-fired battleship design. Existing pre-dreadnoughts remain available."
 tsin_oil_fired_battleships_advance: "Oil-fired capital ships"
 tsin_oil_fired_battleships_advance_desc: "An oil-fired design trades access to petroleum for speed and greater hull strength. It has its own construction and maintenance demands."
 tsin_motor_transport_advance: "Motor transport"
 tsin_motor_transport_advance_desc: "Establish motor depots supported by engines, oil and rubber for urban distribution and food storage."
 tsin_motor_supply_columns_advance: "Motor supply columns"
 tsin_motor_supply_columns_advance_desc: "Coordinate road transport with railway mobilization to improve the movement of existing armies."
 tsin_powered_flight_advance: "Powered flight"
 tsin_powered_flight_advance_desc: "Develop a capital aviation facility that consumes industrial supplies and assists army coordination."
 tsin_aerial_observation_advance: "Aerial observation doctrine"
 tsin_aerial_observation_advance_desc: "Integrate aerial reports into staff planning and the coordination of existing ground battles."
