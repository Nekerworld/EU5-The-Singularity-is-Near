 STATIC_MODIFIER_DESC_tsin_air_superiority_bonus: "Friendly fighters control the sky above this army."
 STATIC_MODIFIER_NAME_tsin_air_inferiority_penalty: "Enemy air superiority"
 STATIC_MODIFIER_DESC_tsin_air_inferiority_penalty: "Enemy fighters control the sky above this army."
