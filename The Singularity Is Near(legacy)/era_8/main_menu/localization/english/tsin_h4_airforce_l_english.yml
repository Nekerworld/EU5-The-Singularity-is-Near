l_english:
 tsin_aircraft_industry_advance: "Aircraft industry"
 tsin_aircraft_industry_advance_desc: "Series production of airframes and engines. Unlocks the aircraft works; its output fills the national aircraft pool."
 tsin_regional_airbase_advance: "Regional airbases"
 tsin_regional_airbase_advance_desc: "Airbases outside the capital raise the number of aircraft the country can keep."
 tsin_anti_aircraft_advance: "Anti-aircraft artillery"
 tsin_anti_aircraft_advance_desc: "Guns and searchlights protect a location: attackers lose aircraft and do less damage."
 tsin_air_operations_advance: "Air operations"
 tsin_air_operations_advance_desc: "Joint air-ground planning. Allows assigning air superiority, close support, strategic bombing and air supply to provinces."
 tsin_airbase: "Regional airbase"
 tsin_airbase_desc: "Each level adds room for 12 aircraft and fuel storage. Needs engines, oil, rubber and tools."
 tsin_airbase_maintenance: "Regional airbase service"
 tsin_airbase_maintenance_desc: "Regional airbase upkeep."
 tsin_anti_air_battery: "Anti-aircraft battery"
 tsin_anti_air_battery_desc: "Enemy aircraft over this location suffer extra losses and deal less damage. Needs cannons, explosives, steel and tools."
 tsin_anti_air_battery_maintenance: "Anti-aircraft battery service"
 tsin_anti_air_battery_maintenance_desc: "Anti-aircraft battery upkeep."
 tsin_air_target_superiority: "Assign air mission: Air superiority"
 tsin_air_target_superiority_desc: "Choose a friendly province for the air superiority mission. Runs monthly while at war, using the matching aircraft stockpile."
 tsin_air_target_cas: "Assign air mission: Close air support"
 tsin_air_target_cas_desc: "Choose an enemy-held province for the close air support mission. Runs monthly while at war, using the matching aircraft stockpile."
 tsin_air_target_bombing: "Assign air mission: Strategic bombing"
 tsin_air_target_bombing_desc: "Choose an enemy-held province for the strategic bombing mission. Runs monthly while at war, using the matching aircraft stockpile."
 tsin_air_target_supply: "Assign air mission: Air supply"
 tsin_air_target_supply_desc: "Choose a friendly province for the air supply mission. Runs monthly while at war, using the matching aircraft stockpile."
 tsin_air_recall: "Recall all air missions"
 tsin_air_recall_desc: "Clears every assigned air mission target."
