l_english:
 tsin_modern_field_drill_advance: "Modern field drill"
 tsin_modern_field_drill_advance_desc: "Combined-arms exercises with live ammunition. Unlocks the Modern Field Drill order for armies."
 tsin_armored_cars_advance: "Armored cars"
 tsin_armored_cars_advance_desc: "Armored cars take over the reconnaissance role of light cavalry."
 tsin_tank_warfare_advance: "Tank warfare"
 tsin_tank_warfare_advance_desc: "Tank battalions replace heavy cavalry as the shock arm. They burn oil and consume armored vehicle stocks."
 tsin_airborne_infantry_advance: "Mountain and airborne infantry"
 tsin_airborne_infantry_advance_desc: "Elite light infantry trained for mountains and air landings."
 tsin_mechanized_infantry_advance: "Mechanized infantry"
 tsin_mechanized_infantry_advance_desc: "Heavy infantry carried by trucks and half-tracks. Needs fuel."
 tsin_self_propelled_artillery_advance: "Self-propelled artillery"
 tsin_self_propelled_artillery_advance_desc: "Guns mounted on tracked chassis keep pace with the armored columns."
 tsin_motor_supply_column_advance: "Motor transport companies"
 tsin_motor_supply_column_advance_desc: "Truck companies replace wagon trains. They need fuel and rubber."
 a_tsin_armored_car_recon: "Armored car recon"
 a_tsin_armored_car_recon_desc: "Fast reconnaissance unit in the light cavalry category."
 a_tsin_tank_battalion: "Tank battalion"
 a_tsin_tank_battalion_desc: "Shock unit in the heavy cavalry category. Needs oil and cannons."
 a_tsin_mountain_paratroopers: "Mountain and airborne infantry"
 a_tsin_mountain_paratroopers_desc: "Elite light infantry with high initiative."
 a_tsin_mechanized_infantry: "Mechanized infantry"
 a_tsin_mechanized_infantry_desc: "Motorized heavy infantry. Needs firearms and oil."
 a_tsin_self_propelled_battery: "Self-propelled battery"
 a_tsin_self_propelled_battery_desc: "Mobile artillery with a stronger barrage."
 a_tsin_motor_supply_column: "Motor supply column"
 a_tsin_motor_supply_column_desc: "Auxiliary truck column that needs oil and rubber."
 tsin_modern_field_drill: "Modern Field Drill"
 tsin_modern_field_drill_desc: "Combined-arms exercises raise experience far faster than drilling, at the price of heavy upkeep and lower morale. Ends when the army fights, moves or besieges."
 tsin_modern_field_drill_cta: "Click to start the modern field drill."
