 # Modern Times events tsin_working_class.20-.80
 tsin_working_class.20.title: "컨베이어 벨트"
 tsin_working_class.20.desc: "능률 기사들이 시간 측정표를 들고 공장을 돕니다. 벨트를 조금만 더 빨리 돌리면 같은 인원으로 하루 산출이 한 할은 늘어난다는 계산입니다. 벨트 옆의 직공들은 이미 나사 하나 조이는 데 손목이 저립니다."
 tsin_working_class.20.a: "벨트 속도를 올린다."
 tsin_working_class.20.b: "사람은 나사가 아니다."
 tsin_working_class.30.title: "급식 기계"
 tsin_working_class.30.desc: "한 발명가가 놀라운 장치를 들고 왔습니다. 직공이 자리를 뜨지 않고도 점심을 먹게 해 주는 기계로, 수프를 떠 넣고 옥수수를 돌리고 입까지 닦아 줍니다. 점심시간을 없애면 공장은 쉬지 않고 돌아갈 것이라고 합니다."
 tsin_working_class.30.a: "국영 공장에 사들인다."
 tsin_working_class.30.b: "점심은 시간 낭비가 아니다."
 tsin_working_class.40.title: "신경 쇠약"
 tsin_working_class.40.desc: "하루 열두 시간 같은 나사를 조이던 직공이 벨트가 멈춘 뒤에도 손을 멈추지 못했습니다. 그는 거리로 나가 단추와 코를 나사처럼 조이려 들다가 붙잡혔습니다. 공장 의사들은 이것을 새로운 병이라고 부릅니다."
 tsin_working_class.40.a: "공장 의사를 둔다."
 tsin_working_class.40.b: "정신 병원으로 보낸다."
 tsin_working_class.50.title: "붉은 깃발"
 tsin_working_class.50.desc: "트럭에서 떨어진 경고용 붉은 깃발을 한 실업자가 주워 들고 돌려주려고 흔들었습니다. 마침 모퉁이를 돌아 나온 시위대가 그 뒤를 따랐고, 경찰은 그를 행진의 주모자로 체포했습니다. 신문은 벌써 그의 얼굴을 1면에 실었습니다."
 tsin_working_class.50.a: "주모자로 재판에 넘긴다."
 tsin_working_class.50.b: "가엾은 사람을 풀어 준다."
 tsin_working_class.60.title: "감옥이 더 배부르다"
 tsin_working_class.60.desc: "불황이 길어지자 석방을 앞둔 죄수들이 감옥에 더 머물게 해 달라고 청원합니다. 감방에는 난로와 하루 세 끼가 있지만 공장 문밖에는 아무것도 없다는 것입니다. 구빈 위원회는 이것이 나라의 수치라고 말합니다."
 tsin_working_class.60.a: "구빈 기금을 연다."
 tsin_working_class.60.b: "구호가 아니라 구빈원이다."
 tsin_working_class.70.title: "밤의 백화점"
 tsin_working_class.70.desc: "새 백화점의 야간 경비원이 문 닫은 매장에서 롤러스케이트를 타며 꿈을 꾼다는 이야기가 퍼졌습니다. 낮에는 점원들이 평생 살 수 없는 물건을 팔고, 밤에는 그 물건들 사이에서 잠시 주인이 됩니다. 상인들은 외상 판매로 그 꿈을 팔자고 합니다."
 tsin_working_class.70.a: "외상으로 팔고 밤늦게까지 연다."
 tsin_working_class.70.b: "일요일에는 가게를 닫는다."
 tsin_working_class.80.title: "떠나는 길"
 tsin_working_class.80.desc: "새벽녘, 공장 도시를 떠나는 두 사람이 먼지 낀 길 위에 보였습니다. 직장도 집도 잃었지만 서로를 보고 웃으며 걸어갑니다. 해마다 더 많은 노동자가 굴뚝을 등지고 어디론가 떠납니다."
 tsin_working_class.80.a: "실업자를 위한 개척 정착지에 돈을 댄다."
 tsin_working_class.80.b: "떠나게 둔다."
