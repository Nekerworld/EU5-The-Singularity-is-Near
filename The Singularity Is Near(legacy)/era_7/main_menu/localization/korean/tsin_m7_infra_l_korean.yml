l_korean:

 tsin_waterworks: "상하수도"
 tsin_waterworks_desc: "증기 펌프가 깨끗한 물을 집집마다 보내고 하수를 도시 밖으로 빼냅니다. $aqueduct_system$를 대신하며, 어느 도시에나 지을 수 있습니다([tsin_infrastructure_concept|e])."
 tsin_waterworks_slot_0: "상하수도"
 tsin_waterworks_maintenance: "양수장 운영"
 tsin_steam_port: "증기선 항만"
 tsin_steam_port_desc: "석탄 부두와 철제 선거, 증기 기중기를 갖춘 근대 항만입니다. $naval_base$를 대신하며, 군함 건조와 함께 정기 항로와 이민선이 이곳을 드나듭니다([tsin_infrastructure_concept|e])."
 tsin_steam_port_slot_0: "증기선 항만"
 tsin_steam_port_maintenance: "항만 운영"
 tsin_prefecture: "도청"
 tsin_prefecture_desc: "중앙에서 임명한 지사가 상설 관료와 함께 지방을 다스리는 관청입니다. $provincial_chancery$을 대신하며, 전문 관료제를 갖춘 나라라면 어디에나 세울 수 있습니다([tsin_infrastructure_concept|e])."
 tsin_prefecture_slot_0: "도청"
 tsin_public_school: "공립 중등학교"
 tsin_public_school_desc: "국가가 세운 중등학교가 [literacy|e]을 넘어 숙련 노동과 행정에 필요한 교육을 맡습니다. 과정이 높을수록 [tsin_education_ladder_concept|e]의 중등교육 정원이 늘어납니다."
 tsin_public_school_slot_0: "공립 중등학교"
 tsin_public_school_basic: "보통 과정"
 tsin_public_school_vocational: "실업 과정"
 tsin_public_school_comprehensive: "종합 과정"
 tsin_electric_lighting_gas: "가스등 운영"
 tsin_railway_station_telegraph: "전신 신호"
 tsin_gas_lighting_advance: "가스 조명"
 tsin_gas_lighting_advance_desc: "석탄을 구워 얻은 가스가 관을 따라 흘러 거리의 등을 밝힙니다. 도시에 $tsin_electric_lighting$을 설치할 수 있게 됩니다([tsin_infrastructure_concept|e])."
 TSIN_BUILDING_LEVEL_STEEL_ROLLING_STOCK: "$tsin_steel_rolling_stock_advance$"
 TSIN_BUILDING_LEVEL_VOCATIONAL_EDUCATION: "$tsin_vocational_education_advance$"
 TSIN_BUILDING_LEVEL_PUBLIC_WORKS: "$tsin_public_works$"
 TSIN_BUILDING_LEVEL_NATIONAL_EDUCATION: "$tsin_national_education$"
