 STATIC_MODIFIER_NAME_tsin_darwin_debate: "진화론 논쟁"
 STATIC_MODIFIER_NAME_tsin_submarine_cable: "국영 해저 전신"
 STATIC_MODIFIER_NAME_tsin_private_cable: "민간 해저 전신"
 STATIC_MODIFIER_NAME_tsin_olympic_games: "올림픽 개최국"
 tsin_culture.10.title: "종의 기원"
 tsin_culture.10.desc: "한 박물학자가 모든 생물이 자연 선택으로 오랜 시간에 걸쳐 변해 왔다는 책을 펴냈습니다. 초판은 하루 만에 팔렸고, 강단과 설교단이 모두 들끓고 있습니다."
 tsin_culture.10.a: "과학은 증거를 따라야 한다."
 tsin_culture.10.b: "교회가 그 책을 단죄한다."
 tsin_culture.20.title: "문화 투쟁"
 tsin_culture.20.desc: "공의회가 교황 무류성을 교리로 선포했습니다. 자유주의자들은 외국 군주에게 충성하는 성직자가 학교와 결혼을 쥐고 있다며 국가의 권한을 되찾으라고 요구합니다."
 tsin_culture.20.a: "교회의 힘을 꺾고 정교를 분리한다."
 tsin_culture.20.b: "교회와 정교 협약을 맺는다."
 tsin_culture.20.c: "다툼에 끼어들지 않는다."
 tsin_culture.30.title: "해저 전신"
 tsin_culture.30.desc: "구타페르카로 감싼 구리선이 바다 밑을 건너 대륙과 대륙을 잇게 되었습니다. 몇 주 걸리던 소식이 이제 몇 분 만에 도착합니다."
 tsin_culture.30.a: "국가가 전신선을 놓는다."
 tsin_culture.30.b: "전신 회사에 맡긴다."
 tsin_culture.40.title: "근대 올림픽"
 tsin_culture.40.desc: "고대 올림피아의 경기를 되살리자는 국제 위원회가 다음 대회를 열 도시를 찾고 있습니다. 세계의 선수들이 우리 수도의 경기장에 모일 수 있습니다."
 tsin_culture.40.a: "대회를 개최한다."
 tsin_culture.40.b: "다른 나라에 양보한다."
 tsin_build_suez_canal_industrial: "수에즈 운하 건설 (산업 공법)"
 tsin_build_suez_canal_industrial.title: "수에즈 운하 건설 (산업 공법)"
 tsin_build_suez_canal_industrial.desc: "다이너마이트와 증기 굴착기로 지중해와 홍해를 잇는 운하를 팝니다. 기존 공법보다 비용이 40% 적게 듭니다([tsin_railways_concept|e])."
 tsin_build_suez_canal_industrial.a: "공사를 시작한다."
 tsin_build_panama_canal_industrial: "파나마 운하 건설 (산업 공법)"
 tsin_build_panama_canal_industrial.title: "파나마 운하 건설 (산업 공법)"
 tsin_build_panama_canal_industrial.desc: "다이너마이트와 증기 굴착기로 두 대양을 잇는 운하를 팝니다. 기존 공법보다 비용이 40% 적게 듭니다([tsin_railways_concept|e])."
 tsin_build_panama_canal_industrial.a: "공사를 시작한다."
