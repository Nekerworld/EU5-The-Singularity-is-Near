l_korean:
 tsin_serfdom.1.title: "농노 해방령"
 tsin_serfdom.1.desc: "산업과 법률의 압력이 커지면서, 왕실이 농노제를 끝낼 기회를 맞았습니다. 역사적으로는 1861년 러시아 해방령 같은 군주 주도의 해방과 비슷한 상황입니다. 귀족의 반발을 각오해야 합니다."
 tsin_serfdom.1.a: "토지를 주고 상환금으로 보상한다"
 tsin_serfdom.1.b: "토지 없이 해방한다"
 tsin_serfdom.1.c: "상환금 없는 완전 해방"
 tsin_serfdom.2.title: "의회 농노 해방 법안"
 tsin_serfdom.2.desc: "의회가 농노제 종결을 표결에 올렸습니다. 시민과 평민의 지지가 귀족의 저항을 누르고 있습니다."
 tsin_serfdom.2.a: "상환금 해방안을 통과시킨다"
 tsin_serfdom.2.b: "완전 해방안을 통과시킨다"
 tsin_serfdom.2.c: "토지 없는 해방안을 통과시킨다"
 tsin_serfdom.3.title: "농노제 종결의 압력"
 tsin_serfdom.3.desc: "산업화·패전·근대화 실패의 여파로 농노제를 더 이상 유지하기 어렵습니다. 국가 형태와 무관하게 해방이 논의됩니다."
 tsin_serfdom.3.a: "완전 해방을 선포한다"
 tsin_serfdom.3.b: "상환금 해방을 선포한다"
 tsin_serfdom.3.c: "토지 없는 해방을 선포한다"
 STATIC_MODIFIER_NAME_tsin_land_reform_redeemed: "토지개혁 (상환금 해방)"
 STATIC_MODIFIER_NAME_tsin_land_reform_landless: "토지개혁 (무토지 해방)"
 STATIC_MODIFIER_NAME_tsin_land_reform_full: "토지개혁 (완전 해방)"
