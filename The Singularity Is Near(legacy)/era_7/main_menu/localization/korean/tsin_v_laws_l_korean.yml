l_korean:

 tsin_women_rights_law: "여성의 권리"
 tsin_women_rights_law_desc: "여성의 재산, 일자리, 투표권을 어디까지 인정할지 정합니다. 앞 단계 정책이 시행 중이고 [tsin_movements_concept|e]의 여성 참정권이 충분히 강해야 다음 단계가 열리며, [tsin_bills_concept|e]으로만 바꿀 수 있습니다. 참정권 단계에서만 여성이 내각에 앉을 수 있습니다."
 tsin_women_rights_law_CATEGORY: "SOCIOECONOMIC_LAW_CATEGORY"
 tsin_women_no_rights_policy: "여성의 권리 없음"
 tsin_women_no_rights_policy_desc: "가문과 관습이 여성의 지위를 정합니다. 성직자와 귀족이 만족하고 사회는 전통 쪽으로 기웁니다."
 tsin_women_property_policy: "여성의 재산권"
 tsin_women_property_policy_desc: "여성이 자기 이름으로 재산과 상속권을 가집니다. 시민과 평민이 만족하고 도시로의 이주가 조금 늘지만 귀족과 성직자는 불만을 품습니다. 여성 참정권 운동 20 이상이 필요하며, 시행 중에는 운동이 해마다 1 줄어듭니다."
 tsin_women_labor_policy: "여성 노동"
 tsin_women_labor_policy_desc: "여성이 공장과 사무실에서 일할 수 있습니다. 생산 효율이 오르고 성직자는 불만을 품습니다. 앞 단계, 공장법 이상의 노동법, 여성 참정권 운동 35 이상이 필요하며, 시행 중에는 운동이 해마다 1 줄어듭니다."
 tsin_women_suffrage_policy: "여성 참정권"
 tsin_women_suffrage_policy_desc: "여성이 투표하고 내각에 앉을 수 있습니다. 평민이 만족하고 사회가 인도주의 쪽으로 움직이지만 성직자와 귀족이 크게 불만을 품습니다. 앞 단계와 여성 참정권 운동 50 이상이 필요하며, 시행 중에는 운동이 해마다 3 줄어듭니다."

 tsin_naval_ideology_law: "해군 이념"
 tsin_naval_ideology_law_desc: "함대를 무엇을 위해 키울지 정합니다. 바닐라 해상 법과 별개로 병행되며, 군사 법이므로 의회 법안 없이 바로 시행합니다. 항구가 있는 나라만 쓸 수 있고, 각 이념은 해당 발전이 필요합니다."
 tsin_naval_ideology_law_CATEGORY: "MILITARY_LAW_CATEGORY"
 tsin_naval_coastal_defense_policy: "연안 방어"
 tsin_naval_coastal_defense_policy_desc: "항구 요새와 해안 경비로 충분하다고 봅니다. 자국 해안에서 해전이 조금 유리해집니다."
 tsin_naval_jeune_ecole_policy: "청년학파"
 tsin_naval_jeune_ecole_policy_desc: "작고 빠른 함정으로 통상을 파괴하고 해안을 봉쇄합니다. 경함선 유지비가 줄고 봉쇄와 나포가 강해지지만 귀족은 대형 함선을 아쉬워합니다. 어뢰 또는 방호 순양함 발전이 필요합니다."
 tsin_naval_gunboat_diplomacy_policy: "포함 외교"
 tsin_naval_gunboat_diplomacy_policy_desc: "해외에서 깃발을 보여 조약항을 열고 교역을 지킵니다. 교역 범위, 해양 상업 세력, 위신이 늘지만 평민은 부담을 느낍니다. 증기 우편선 외교 발전이 필요합니다."
 tsin_naval_blue_water_policy: "대양 함대"
 tsin_naval_blue_water_policy_desc: "주력함으로 결전을 노리는 원양 해군입니다. 함대 규모와 해군 전통이 늘지만 유지 효율이 떨어지고 평민이 불만을 품습니다. 철갑함과 해군 포술 발전이 모두 필요합니다."

 tsin_police_law: "치안"
 tsin_police_law_desc: "도시와 나라의 질서를 누가 어떻게 지킬지 정합니다. 집회의 자유는 [ShowLawName('tsin_assembly_law')]이 따로 정합니다. [ShowAdvanceName('tsin_modern_police')]으로 열리며, [tsin_bills_concept|e]으로만 바꿀 수 있습니다."
 tsin_police_law_CATEGORY: "ADMINISTRATIVE_LAW_CATEGORY"
 tsin_police_night_watch_policy: "야경과 민병"
 tsin_police_night_watch_policy_desc: "마을 야경꾼과 민병이 질서를 지킵니다. 귀족이 만족합니다."
 tsin_police_city_police_policy: "도시 경찰"
 tsin_police_city_police_policy_desc: "도시마다 제복 경찰을 둡니다. 분리주의가 줄고 도시민이 만족하지만 세금 효율이 조금 떨어집니다."
 tsin_police_national_police_policy: "국가 경찰"
 tsin_police_national_police_policy_desc: "중앙이 지휘하는 전국 경찰입니다. 분리주의가 더 줄고 왕실이 강해지지만 세금 효율이 떨어지고 평민이 불안해합니다. 대중 통신 발전이 필요합니다."
 tsin_police_political_police_policy: "정치 경찰"
 tsin_police_political_police_policy_desc: "불온한 사상과 인물을 감시하는 비밀 경찰입니다. 분리주의가 크게 줄고 왕실이 강해지지만 도시민과 평민이 불만을 품고 절대주의로 기웁니다. 국세 조사 발전이 필요합니다."

 tsin_public_health_law: "공중 보건"
 tsin_public_health_law_desc: "도시의 위생과 전염병 대응을 누가 맡을지 정합니다. [ShowAdvanceName('tsin_modern_sewerage_advance')]으로 열리며, [tsin_bills_concept|e]으로만 바꿀 수 있습니다. 이 법은 질병 저항을 건드리지 않아 콜레라 대응 판정에 영향을 주지 않습니다."
 tsin_public_health_law_CATEGORY: "SOCIOECONOMIC_LAW_CATEGORY"
 tsin_health_laissez_faire_policy: "방임"
 tsin_health_laissez_faire_policy_desc: "위생은 도시와 시장에 맡깁니다. 도시민이 만족합니다."
 tsin_health_quarantine_policy: "위생과 검역"
 tsin_health_quarantine_policy_desc: "항구와 도시에 위생 감독과 검역을 둡니다. 기대 수명이 늘지만 도시민은 교역 지장을 싫어하고 세금 효율이 조금 떨어집니다."
 tsin_health_board_policy: "보건청"
 tsin_health_board_policy_desc: "국가가 보건청을 두어 의료와 위생을 맡습니다. 기대 수명이 크게 늘고 평민이 만족하지만 세금 효율이 떨어지며 공동체 가치관으로 기웁니다. 방부 수술 발전이 필요합니다."
