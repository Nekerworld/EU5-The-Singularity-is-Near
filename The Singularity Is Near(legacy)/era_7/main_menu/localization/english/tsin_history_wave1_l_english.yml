l_english:
 tsin_history_wave1.1.title: "Payment before delivery"
 tsin_history_wave1.1.desc: "A uniform prepaid postage scheme promises simpler accounts and letters affordable beyond wealthy households. Britain introduced adhesive postage stamps in 1840; our officials now propose a local scheme."
 tsin_history_wave1.1.a: "Fund a limited postal trial."
 tsin_history_wave1.1.b: "Keep the existing arrangements."
 tsin_history_wave1.2.title: "A sack of prepaid letters"
 tsin_history_wave1.2.desc: "The trial has brought more letters, but clerks disagree over recording prepaid mail. A common ledger would cost time and training."
 tsin_history_wave1.2.a: "Train the postal clerks."
 tsin_history_wave1.2.b: "End the trial here."
 tsin_history_wave1.3.title: "The imitation stamp"
 tsin_history_wave1.3.desc: "An imitation stamp has reached the sorting office. The question is whether to standardize marks and publish guidance or quietly leave verification to each clerk."
 tsin_history_wave1.3.a: "Publish common verification rules."
 tsin_history_wave1.3.b: "Leave verification to the offices."
 tsin_history_wave1.4.title: "The postal trial is assessed"
 tsin_history_wave1.4.desc: "The offices have submitted their experience. A lasting service needs reliable accounting, not merely a ceremonial first stamp."
 tsin_history_wave1.4.a: "Adopt the tested administrative standard."
 tsin_history_wave1.4.b: "Retain a small local service."
 tsin_history_wave1.5.title: "Purple from the laboratory"
 tsin_history_wave1.5.desc: "Perkin obtained a purple synthetic dye in 1856. Our manufacturers, already familiar with synthetic dyes, seek support to turn laboratory samples into consistent commercial batches."
 tsin_history_wave1.5.a: "Pay for a supervised trial."
 tsin_history_wave1.5.b: "Let the firms proceed without state support."
 tsin_history_wave1.6.title: "The fading sample"
 tsin_history_wave1.6.desc: "One batch fades more quickly than another. The process works, but purchasers want repeatable specifications."
 tsin_history_wave1.6.a: "Commission independent tests."
 tsin_history_wave1.6.b: "Close the public trial."
 tsin_history_wave1.7.title: "The dyers petition"
 tsin_history_wave1.7.desc: "Established dyers fear losing their customers. Manufacturers ask for exclusive privileges, while merchants prefer specifications any supplier can meet."
 tsin_history_wave1.7.a: "Publish open specifications."
 tsin_history_wave1.7.b: "Leave individual contracts to merchants."
 tsin_history_wave1.8.title: "A reliable commercial colour"
 tsin_history_wave1.8.desc: "The trial is complete. Consistency, safety and honest labelling have proved more useful than promises of miraculous colour."
 tsin_history_wave1.8.a: "Keep the verification programme."
 tsin_history_wave1.8.b: "End the programme after publishing its findings."
 tsin_history_wave1.9.title: "Rivets at the pocket"
 tsin_history_wave1.9.desc: "The 1873 patent for riveted work trousers provides a practical example for our clothing workshops. Buyers want pockets that survive demanding work."
 tsin_history_wave1.9.a: "Test a public procurement batch."
 tsin_history_wave1.9.b: "Leave orders entirely to private buyers."
 tsin_history_wave1.10.title: "A tender for work clothes"
 tsin_history_wave1.10.desc: "Suppliers offer different fabrics and fastenings. The cheapest bid is not necessarily the most durable."
 tsin_history_wave1.10.a: "Require practical durability tests."
 tsin_history_wave1.10.b: "End the procurement trial."
 tsin_history_wave1.11.title: "The workshop contract"
 tsin_history_wave1.11.desc: "The selected workshops request predictable inspection and payment schedules. Officials can standardize the terms without prescribing every private sale."
 tsin_history_wave1.11.a: "Standardize public contract terms."
 tsin_history_wave1.11.b: "Negotiate each order separately."
 tsin_history_wave1.12.title: "The repaired pocket"
 tsin_history_wave1.12.desc: "Users have returned their reports and damaged samples. The mundane details of seams and repairs have improved the next tender."
 tsin_history_wave1.12.a: "Use the findings in future procurement."
 tsin_history_wave1.12.b: "Archive the report without a general standard."
 tsin_history_wave1.13.title: "Pictures that move"
 tsin_history_wave1.13.desc: "Commercial Lumière screenings began in 1895. An exhibitor proposes a local programme, provided a suitable urban hall can be hired."
 tsin_history_wave1.13.a: "Sponsor a small public demonstration."
 tsin_history_wave1.13.b: "Allow a private demonstration only."
 tsin_history_wave1.14.title: "A hall full of spectators"
 tsin_history_wave1.14.desc: "The novelty has attracted a crowd. Officials must settle access and basic operating rules before the next programme."
 tsin_history_wave1.14.a: "Agree on capacity and exits."
 tsin_history_wave1.14.b: "End the public sponsorship."
 tsin_history_wave1.15.title: "The programme submitted for review"
 tsin_history_wave1.15.desc: "The exhibitor asks which subjects may be shown. A narrow public-safety review and broad political censorship would have different consequences."
 tsin_history_wave1.15.a: "Limit review to clear operating rules."
 tsin_history_wave1.15.b: "Leave approval to individual officials."
 tsin_history_wave1.16.title: "A place among urban entertainments"
 tsin_history_wave1.16.desc: "The trial has ended. Moving pictures have found an audience, although no one can promise the fortunes of this new trade."
 tsin_history_wave1.16.a: "Publish the trial results and common rules."
 tsin_history_wave1.16.b: "Close the public programme."
 tsin_history_wave1.17.title: "A crack in the great bell"
 tsin_history_wave1.17.desc: "London's great bell was recast in 1858 and later cracked. Our urban clock keepers bring a more local problem: a damaged bell and a disputed maintenance contract."
 tsin_history_wave1.17.a: "Fund a limited independent review."
 tsin_history_wave1.17.b: "Leave it to private initiative."
 tsin_history_wave1.18.title: "The alleged petrified giant"
 tsin_history_wave1.18.desc: "The Cardiff Giant hoax of 1869 showed the market for spectacular discoveries. An exhibitor now asks our authorities to endorse an alleged ancient giant before independent examination."
 tsin_history_wave1.18.a: "Fund a limited independent review."
 tsin_history_wave1.18.b: "Leave it to private initiative."
 tsin_history_wave1.19.title: "Letters carried by pigeons"
 tsin_history_wave1.19.desc: "During the 1870–1871 Siege of Paris, pigeon post carried reduced photographic messages. Our wartime couriers propose a small experiment rather than a replacement for all communications."
 tsin_history_wave1.19.a: "Fund a limited independent review."
 tsin_history_wave1.19.b: "Leave it to private initiative."
 tsin_history_wave1.20.title: "The motor carriage and the speed limit"
 tsin_history_wave1.20.desc: "A British speeding conviction in 1896 illustrates the difficulty of applying old road rules to motor traffic. Our officials seek a clearer procedure for local complaints."
 tsin_history_wave1.20.a: "Fund a limited independent review."
 tsin_history_wave1.20.b: "Leave it to private initiative."
 tsin_history_wave1.21.title: "A demonstration without pain"
 tsin_history_wave1.21.desc: "The public ether demonstration of 1846 changed surgical discussion. Physicians already studying modern medicine ask for a supervised demonstration and transparent reporting here."
 tsin_history_wave1.21.a: "Fund a limited independent review."
 tsin_history_wave1.21.b: "Leave it to private initiative."
 tsin_history_wave1.22.title: "The sky and the telegraph"
 tsin_history_wave1.22.desc: "Reports of the great 1859 aurora and disturbed telegraph equipment have reached the operators. They propose recording the anomaly and inspecting equipment; they do not yet claim a complete explanation."
 tsin_history_wave1.22.a: "Fund a limited independent review."
 tsin_history_wave1.22.b: "Leave it to private initiative."
 tsin_history_wave1.23.title: "A voice from a machine"
 tsin_history_wave1.23.desc: "The phonograph was demonstrated in the late 1870s. An exhibitor familiar with electrical communications proposes showing recorded sound to scholars and townspeople."
 tsin_history_wave1.23.a: "Fund a limited independent review."
 tsin_history_wave1.23.b: "Leave it to private initiative."
 tsin_history_wave1.24.title: "A report from the rabies laboratory"
 tsin_history_wave1.24.desc: "News of the 1885 rabies treatment has reached our medical community. Physicians request translated reports and independent review rather than declaring every experimental treatment proven."
 tsin_history_wave1.24.a: "Fund a limited independent review."
 tsin_history_wave1.24.b: "Leave it to private initiative."
 tsin_historical_events: "TSIN additional historical events"
 tsin_historical_events_desc: "Additional historical waves with bounded yearly draws. Player countries receive up to three additional events, or six under Dense. Original TSIN flavour remains separate."
 tsin_historical_events_normal: "Standard additional wave"
 tsin_historical_events_normal_desc: "At most three additional player events per year across both waves; one for AI countries. Existing TSIN flavour remains separate."
 tsin_historical_events_dense: "Dense additional wave"
 tsin_historical_events_dense_desc: "At most six additional player draws per year, two for AI countries. A chain cannot advance twice in one year."
 tsin_historical_events_off: "Disabled"
 tsin_historical_events_off_desc: "Do not draw first-wave historical events. Past choices are retained."
 STATIC_MODIFIER_NAME_tsin_history_verified_practice: "Verified public practices"
 STATIC_MODIFIER_DESC_tsin_history_verified_practice: "A modest temporary benefit from independent verification and common public procedures. Refreshes rather than stacks."
