l_english:
 tsin_history2.1.title: "The factory fine book"
 tsin_history2.1.desc: "Workers at a chemical workplace accuse the proprietor of arbitrary fines and unsafe handling. Their representatives have brought a book of deductions to the authorities."
 tsin_history2.1.a: "Audit the wage and safety books."
 tsin_history2.1.b: "Let the proprietor answer first."
 tsin_history2.2.title: "The printed accusation"
 tsin_history2.2.desc: "A newspaper has printed the accusations. The editor asks whether the authorities will release their findings or leave the public with competing rumors."
 tsin_history2.2.a: "Publish the verified findings."
 tsin_history2.2.b: "Keep the inquiry behind closed doors."
 tsin_history2.3.title: "Workers at the gate"
 tsin_history2.3.desc: "Workers have gathered at the factory gate and elected representatives. A local agreement could end the stoppage before it spreads."
 tsin_history2.3.a: "Pay for a binding local settlement."
 tsin_history2.3.b: "Hear a fuller list of demands."
 tsin_history2.4.title: "Three demands, three costs"
 tsin_history2.4.desc: "The delegates distinguish fines, dismissals and protective equipment. Each demand has a different cost and a different group of supporters."
 tsin_history2.4.a: "Prioritize safety equipment."
 tsin_history2.4.b: "Negotiate the fine schedule first."
 tsin_history2.5.title: "The proprietor replies"
 tsin_history2.5.desc: "The proprietor requests time to implement the agreement. Inspectors must decide whether this is a practical schedule or an attempt to postpone the work."
 tsin_history2.5.a: "Finance a short independent inspection."
 tsin_history2.5.b: "Accept a written implementation calendar."
 tsin_history2.6.title: "A promise inspected"
 tsin_history2.6.desc: "The representatives have returned to inspect the promised changes. Some equipment has arrived, but the remaining work needs a final decision."
 tsin_history2.6.a: "Fund the final corrective work."
 tsin_history2.6.b: "Close the case without more public money."
 tsin_history2.7.title: "A precedent for negotiation"
 tsin_history2.7.desc: "The settlement is complete. Officials propose retaining the procedures so that the next dispute can reach a negotiating table sooner."
 tsin_history2.7.a: "Record the negotiated procedures."
 tsin_history2.7.b: "Let each workplace decide next time."
 tsin_history2.11.title: "New uniforms, old accounts"
 tsin_history2.11.desc: "Newly organized units receive attention while older formations complain that their needs have been overlooked. The strained budget has made every allocation contentious."
 tsin_history2.11.a: "Inspect the allocation accounts."
 tsin_history2.11.b: "Ask the existing units for a report."
 tsin_history2.12.title: "The disputed ration"
 tsin_history2.12.desc: "Officers disagree over a disputed distribution of rations. Some blame the budget; others demand an inquiry into the officials who signed the accounts."
 tsin_history2.12.a: "Pay for a targeted reconciliation."
 tsin_history2.12.b: "Continue the audit before paying."
 tsin_history2.13.title: "The missing signature"
 tsin_history2.13.desc: "A crucial order lacks the responsible signature. The question of money has become a question of accountability in military administration."
 tsin_history2.13.a: "Appoint an independent auditor."
 tsin_history2.13.b: "Demand an explanation from the command."
 tsin_history2.14.title: "A gathering of old units"
 tsin_history2.14.desc: "Representatives of older units have gathered to demand a hearing. A funded timetable may still settle their petition before confrontation hardens."
 tsin_history2.14.a: "Settle the petition with a funded schedule."
 tsin_history2.14.b: "Hold another hearing."
 tsin_history2.15.title: "The capital hears the complaint"
 tsin_history2.15.desc: "The complaint has reached the capital. Civilian officials and the military council disagree over who should negotiate a settlement."
 tsin_history2.15.a: "Fund civilian mediation."
 tsin_history2.15.b: "Keep responsibility with the military council."
 tsin_history2.16.title: "Revising military administration"
 tsin_history2.16.desc: "The inquiry recommends a clear distribution process and a record of responsibility. Adopting it would make the next reform easier to administer."
 tsin_history2.16.a: "Adopt the audited procedures."
 tsin_history2.16.b: "End the inquiry without reform."
 tsin_history2.21.title: "After the foul summer"
 tsin_history2.21.desc: "The foul summer has passed, but municipal officials still owe an account of what was promised. Engineers ask to survey the drainage routes before work continues."
 tsin_history2.21.a: "Order a drainage survey."
 tsin_history2.21.b: "Request the municipal accounts."
 tsin_history2.22.title: "A curtain is not a sewer"
 tsin_history2.22.desc: "Curtains treated with lime have provided temporary relief. Engineers insist that a durable water system requires more than a tolerable smell."
 tsin_history2.22.a: "Fund an engineering inspection."
 tsin_history2.22.b: "Review the temporary measures."
 tsin_history2.23.title: "The sanitation appropriation"
 tsin_history2.23.desc: "The proposed works require land, labor and upkeep. The treasury wants a limited appropriation with accounts that can be inspected."
 tsin_history2.23.a: "Approve a limited review budget."
 tsin_history2.23.b: "Reduce the scheme and continue."
 tsin_history2.24.title: "The route beneath the streets"
 tsin_history2.24.desc: "Engineers compare underground routes with compensation claims above ground. A transparent survey could reduce later disputes."
 tsin_history2.24.a: "Fund transparent route assessment."
 tsin_history2.24.b: "Keep the route within public streets."
 tsin_history2.25.title: "Delays and inspection books"
 tsin_history2.25.desc: "The inspection books mix completed work with delayed contracts. The council must decide whether to pay for another review or wait for the works to catch up."
 tsin_history2.25.a: "Pay for a final independent inspection."
 tsin_history2.25.b: "Wait for the existing construction program."
 tsin_history2.26.title: "Separating clean and dirty water"
 tsin_history2.26.desc: "Officials prepare instructions for separating clean water from sewage. Engineers will certify the system once the surveyed city waterworks are in service."
 tsin_history2.26.a: "Publish the operating instructions."
 tsin_history2.26.b: "Leave instructions to local officers."
 tsin_history2.27.title: "Waterworks in service"
 tsin_history2.27.desc: "The surveyed city waterworks are in service and the review can finally close. The remaining question is whether the operating procedures should become a common standard."
 tsin_history2.27.a: "Certify the operating procedures."
 tsin_history2.27.b: "Finish without a national certificate."
 tsin_history2.31.title: "Livestock across a boundary"
 tsin_history2.31.desc: "A quarrel over livestock has reached officials on both sides of the frontier. The damage is small, but each side gives a different account of the boundary."
 tsin_history2.31.a: "Hear the damage claim."
 tsin_history2.31.b: "Let local officials compare accounts."
 tsin_history2.32.title: "A demand for compensation"
 tsin_history2.32.desc: "The neighboring government asks for compensation. Our local officers want the damage recorded before any agreement is signed."
 tsin_history2.32.a: "Seek a documented settlement."
 tsin_history2.32.b: "Ask for proof of the loss."
 tsin_history2.33.title: "Two accounts of jurisdiction"
 tsin_history2.33.desc: "Both governments cite different rules of jurisdiction. A joint review of the facts might settle the claim without settling every question of sovereignty."
 tsin_history2.33.a: "Pay for a joint factual review."
 tsin_history2.33.b: "Exchange written accounts."
 tsin_history2.34.title: "Orders to remain calm"
 tsin_history2.34.desc: "The dispatches have become sharper. Officials on the ground ask for clear instructions before the dispute grows beyond their control."
 tsin_history2.34.a: "Maintain a civilian channel."
 tsin_history2.34.b: "Continue through official dispatches."
 tsin_history2.35.title: "A neutral account of the facts"
 tsin_history2.35.desc: "The mediators distinguish the material loss from the disputed boundary. They propose a small payment while ordinary diplomacy handles the larger question."
 tsin_history2.35.a: "Prepare a cash settlement."
 tsin_history2.35.b: "Close the mediation without agreement."
 tsin_history2.36.title: "The small settlement"
 tsin_history2.36.desc: "The neighboring government is ready to receive the agreed compensation. Paying would close this material claim while leaving the border where it stands."
 tsin_history2.36.a: "Pay the recorded neighbor."
 tsin_history2.36.b: "Decline the cash settlement."
 tsin_history2.41.title: "A crowded subscription list"
 tsin_history2.41.desc: "New companies and weakening business conditions have drawn attention to the subscription lists. Investors ask what stands behind the promoters promises."
 tsin_history2.41.a: "Commission a disclosure review."
 tsin_history2.41.b: "Request the issuers own reports."
 tsin_history2.42.title: "Orders and actual business"
 tsin_history2.42.desc: "The issuers report a large volume of orders. Reviewers want to distinguish completed business from contracts that may never be fulfilled."
 tsin_history2.42.a: "Fund independent comparison."
 tsin_history2.42.b: "Publish the available reports."
 tsin_history2.43.title: "Doubts about the accounts"
 tsin_history2.43.desc: "Questions about the accounts have spread beyond the original subscribers. A careful inquiry may prevent rumor from replacing reliable information."
 tsin_history2.43.a: "Review the cash and debt records."
 tsin_history2.43.b: "Keep the inquiry with the firms."
 tsin_history2.44.title: "Creditors at the table"
 tsin_history2.44.desc: "Bankers and bondholders have agreed to meet. Their contracts differ, and so do their claims on the companies remaining cash."
 tsin_history2.44.a: "Finance an orderly consultation."
 tsin_history2.44.b: "Let the contracts run their course."
 tsin_history2.45.title: "The risk report"
 tsin_history2.45.desc: "The report compares repeated signs of excessive entry and oversupply. Publishing its evidence could help investors distinguish temporary weakness from persistent distress."
 tsin_history2.45.a: "Publish the recorded evidence."
 tsin_history2.45.b: "Restrict publication to the reviewers."
 tsin_history2.46.title: "Different industries, different losses"
 tsin_history2.46.desc: "Agriculture and industry describe different losses. Officials must decide whether a common report is enough or a more detailed assessment is worth its cost."
 tsin_history2.46.a: "Fund sector-specific assessment."
 tsin_history2.46.b: "Leave adjustment to existing policies."
 tsin_history2.47.title: "A recovery report"
 tsin_history2.47.desc: "The special commission is ready to close. Its disclosure procedures may prove useful in the next cycle, even if recovery remains uneven."
 tsin_history2.47.a: "Retain the disclosure procedures."
 tsin_history2.47.b: "End the special commission."
 tsin_history2.51.title: "A delegation with a purpose"
 tsin_history2.51.desc: "Officials propose sending a delegation to study an industrial state. The mission needs a budget and a government willing to receive its members."
 tsin_history2.51.a: "Fund the request and delegation."
 tsin_history2.51.b: "Postpone the mission."
 tsin_history2.52.title: "A visit is accepted"
 tsin_history2.52.desc: "The host government has accepted a limited visit. Delegates now need an itinerary that can be completed within their means."
 tsin_history2.52.a: "Set a limited inspection itinerary."
 tsin_history2.52.b: "Withdraw the delegation."
 tsin_history2.53.title: "The industrial report"
 tsin_history2.53.desc: "The delegates compare the hosts industrial institutions with conditions at home. Translating and checking their notes will determine how much the cabinet can use."
 tsin_history2.53.a: "Finance translation of the report."
 tsin_history2.53.b: "Summarize the available notes."
 tsin_history2.54.title: "Schooling and skilled work"
 tsin_history2.54.desc: "The discussion turns to education and skilled work. The delegates disagree over which practices could be adapted without rebuilding the entire domestic system."
 tsin_history2.54.a: "Fund an educational memorandum."
 tsin_history2.54.b: "Keep the comparison advisory."
 tsin_history2.55.title: "The military memorandum"
 tsin_history2.55.desc: "The military memorandum describes how responsibilities are divided. The cabinet must decide which observations deserve a place in its report."
 tsin_history2.55.a: "Record the relevant organization."
 tsin_history2.55.b: "Leave military practice unchanged."
 tsin_history2.56.title: "The cost of staying abroad"
 tsin_history2.56.desc: "The last visits would extend the delegations stay. More information may be useful, but lodging, translation and transport continue to cost money."
 tsin_history2.56.a: "Pay for the final visits."
 tsin_history2.56.b: "Finish the itinerary early."
 tsin_history2.57.title: "Reports on the cabinet table"
 tsin_history2.57.desc: "The reports are on the cabinet table. Officials ask for an implementation review before attempting to transplant foreign practices."
 tsin_history2.57.a: "Commission an implementation review."
 tsin_history2.57.b: "Keep the reports in the archive."
 tsin_history2.58.title: "Putting lessons to use"
 tsin_history2.58.desc: "The mission has returned with a body of checked reports. Applying its lessons now depends on the willingness of domestic officials to use them."
 tsin_history2.58.a: "Apply the reviewed methods."
 tsin_history2.58.b: "Close the mission without adoption."
 tsin_history2.99.title: "A visiting delegation"
 tsin_history2.99.desc: "Another government asks to inspect our industrial institutions. We may welcome the delegation or decline its proposed itinerary."
 tsin_history2.99.a: "Admit a limited delegation."
 tsin_history2.99.b: "Decline this visit."
 tsin_history2.100.title: "The visit is suspended"
 tsin_history2.100.desc: "The planned visit cannot proceed. The delegation will return before committing further funds."
 tsin_history2.100.a: "Bring the delegation home."
