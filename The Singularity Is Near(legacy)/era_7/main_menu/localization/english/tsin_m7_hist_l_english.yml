l_english:

 # National unification
 tsin_national_unification: "National Unification"
 tsin_national_unification_desc: "A [culture_group|e] is divided among several independent states. The largest of them, carried by its national movement, may lead the unification. Smaller states join by plebiscite or are brought in by a war of unification.\n\nSee also: [tsin_national_unification_concept|e]"
 tsin_national_unification_nations_made: "Nations Are Made"
 tsin_national_unification_age_passes: "The Age of Unification Passes"
 tsin_national_unification_unifier_tt: "This [country|e] leads a national unification."
 tsin_national_unification_unified_tt: "This [country|e] has completed its national unification."
 tsin_national_unification_kin_tt: "This [country|e] is a target of a unification movement."
 tsin_national_unification_unified_legend: "Unified Nation"
 tsin_national_unification_unifier_legend: "Leading Unification"
 tsin_national_unification_kin_legend: "Independent State of the Same Culture Group"
 hint_tsin_national_unification: "[GetSituationByKey('tsin_national_unification').GetNameWithNoTooltip]"
 hint_tsin_national_unification_hint_text: "[GetSituationByKey('tsin_national_unification').GetName] begins after 1848 in countries with a strong national movement. If two or more other independent states share your culture group and you are the largest, you can lead the unification.\n\n#T Recommended actions:#!\n@arrow_bonus_tier_3! As the champion you offer plebiscites to smaller states each year and gain the $cb_tsin_national_unification$ casus belli.\n@arrow_bonus_tier_2! Unification is proclaimed when no independent state of the culture group is left. If you meet the vanilla formable country conditions, you can form it then."
 hint_tsin_national_unification_diplomatic: "\"Every nation has the right to form one state.\""
 hint_tsin_national_unification_administrative: "\"We have made Italy; now we must make Italians.\""
 hint_tsin_national_unification_military: "\"The great questions of the day will not be settled by speeches and majority decisions, but by iron and blood.\""
 cb_tsin_national_unification: "National Unification"
 cb_tsin_national_unification_desc: "Our nation is divided under other rulers!"
 STATIC_MODIFIER_NAME_tsin_unification_drive: "Unification Movement"
 STATIC_MODIFIER_NAME_tsin_national_unity: "National Unity"
 tsin_unification.1.title: "The National Question"
 tsin_unification.1.desc: "People who speak the same language and sing the same songs are split among several states. Newspapers, choirs and gymnastic clubs call for one fatherland, and they look to our [country|e] to lead."
 tsin_unification.1.a: "Lead the national cause."
 tsin_unification.1.a.tt: "Each year we may offer plebiscites to smaller independent states of our culture group, and we can use the $cb_tsin_national_unification$ casus belli against them."
 tsin_unification.1.b: "This is not the time."
 tsin_unification.10.title: "A Plebiscite"
 tsin_unification.10.desc: "Nationalists in [tsin_plebiscite_target.GetName] demand a plebiscite on union with us. If we make the offer officially, their government will find it hard to refuse."
 tsin_unification.10.a: "Offer the plebiscite."
 tsin_unification.11.title: "A Plebiscite on Union"
 tsin_unification.11.desc: "[tsin_unifier.GetName] proposes a plebiscite on joining one nation state. Unification banners hang in the streets, but the court and officials fear losing our independence."
 tsin_unification.11.a: "Join the nation."
 tsin_unification.11.b: "Keep our independence."
 tsin_unification.12.title: "The Plebiscite Passes"
 tsin_unification.12.desc: "The plebiscite passes by an overwhelming majority. Another brother state joins the fatherland."
 tsin_unification.12.a: "The nation grows whole."
 tsin_unification.13.title: "The Plebiscite Is Refused"
 tsin_unification.13.desc: "Their government has refused the plebiscite. What remains is to wait for better terms, or to unify by the sword."
 tsin_unification.13.a: "One day we will be one."
 tsin_unification.13.a.tt: "We cannot offer that state another plebiscite for 10 years, but the $cb_tsin_national_unification$ casus belli remains."
 tsin_unification.20.title: "Unification Proclaimed"
 tsin_unification.20.desc: "No independent state of our culture group remains outside. A single nation state is proclaimed in the palace of the capital, and bells ring across the land."
 tsin_unification.20.a: "One nation, one state!"
 tsin_unification.20.a.tt: "If we meet the conditions of a vanilla formable country, we can now form it."
 # Defensive modernization
 tsin_defensive_modernization: "Defensive Modernization"
 tsin_defensive_modernization_desc: "Countries that opened their ports under foreign guns import foreign institutions and machines to survive. They pass through a modernizing edict, a conservative reaction, and then success or failure.\n\nSee also: [tsin_defensive_modernization_concept|e]"
 tsin_defensive_modernization_settled: "Modernization Decided"
 tsin_defensive_modernization_age_passes: "The Age of Open Ports Passes"
 tsin_defensive_modernization_modernized_tt: "This [country|e] has modernized successfully."
 tsin_defensive_modernization_failed_tt: "This [country|e] failed to modernize."
 tsin_defensive_modernization_reforming_tt: "This [country|e] is carrying out modernizing reforms."
 tsin_defensive_modernization_pressured_tt: "This [country|e] is under pressure to open its ports."
 tsin_defensive_modernization_modernized_legend: "Modernized"
 tsin_defensive_modernization_reforming_legend: "Reforming"
 tsin_defensive_modernization_pressured_legend: "Under Opening Pressure"
 tsin_defensive_modernization_failed_legend: "Modernization Failed"
 hint_tsin_defensive_modernization: "[GetSituationByKey('tsin_defensive_modernization').GetNameWithNoTooltip]"
 hint_tsin_defensive_modernization_hint_text: "[GetSituationByKey('tsin_defensive_modernization').GetName] opens for countries that opened their ports through a treaty port peace or the gunboat event.\n\n#T Recommended actions:#!\n@arrow_bonus_tier_3! A modernizing edict brings a conservative reaction a few years later. Crushing it or buying it off keeps the reforms going.\n@arrow_bonus_tier_2! Modernization is complete once you own at least one factory and your [stability|e] is 0 or more. Refusing the edict twice, or yielding to the reaction, ends in failure."
 hint_tsin_defensive_modernization_diplomatic: "\"Knowledge shall be sought throughout the world.\""
 hint_tsin_defensive_modernization_administrative: "\"Chinese learning as the substance, Western learning for practical use.\""
 hint_tsin_defensive_modernization_military: "\"Rich country, strong army.\""
 STATIC_MODIFIER_NAME_tsin_modernization_new_army: "New Model Army"
 STATIC_MODIFIER_NAME_tsin_modernized_state: "Modernized State"
 STATIC_MODIFIER_NAME_tsin_failed_modernization: "Failed Modernization"
 tsin_modernization.10.title: "The Conservative Reaction"
 tsin_modernization.10.desc: "Old warriors and officials who lost their stipends and privileges to the edict have risen. They call for driving out the foreigners and restoring the old ways."
 tsin_modernization.10.a: "Crush them with the new army."
 tsin_modernization.10.b: "Buy them off with offices and pensions."
 tsin_modernization.10.c: "Yield to the reaction."
 tsin_modernization.20.title: "The Reforms Take Root"
 tsin_modernization.20.desc: "Smoke rises from factory chimneys, and the new schools and army have taken hold. A country that once bowed before gunboats now means to stand beside the powers."
 tsin_modernization.20.a: "Civilization and enlightenment!"
 tsin_modernization.30.title: "The Reforms Collapse"
 tsin_modernization.30.desc: "The reforming ministers have fallen and the edict is a dead letter. The court has returned to the old order, but the foreign merchants and gunboats have not left."
 tsin_modernization.30.a: "Keep the old ways."
 tsin_modernization.30.a.tt: "The modernizing edict will not return for 20 years."
 # Secession crisis
 tsin_secession_crisis: "The Secession Crisis"
 tsin_secession_crisis_desc: "The republic is split in two over slavery. Abolitionists in the free regions and planters in the slave regions will no longer compromise. The crisis lasts at least three years, and without a compromise the slave regions declare secession.\n\nSee also: [tsin_secession_crisis_concept|e]"
 tsin_secessionist_rebels: "Secessionists"
 STATIC_MODIFIER_NAME_tsin_rotten_compromise: "Rotten Compromise"
 STATIC_MODIFIER_NAME_tsin_reconstruction: "Reconstruction"
 tsin_secession.1.title: "A House Divided"
 tsin_secession.1.desc: "\"A house divided against itself cannot stand.\" Debates in the legislature turn into brawls, and newspapers call each other traitors. The planters of the slave regions threaten to leave the republic."
 tsin_secession.1.a: "The republic is one."
 tsin_secession.1.a.tt: "If no compromise is reached within three years, the slave regions will declare secession."
 tsin_secession.2.title: "Bleeding Frontier"
 tsin_secession.2.desc: "Armed settlers raid each other over whether a new territory will allow slavery."
 tsin_secession.2.a: "Send federal troops to keep order."
 tsin_secession.2.b: "Let the settlers decide."
 tsin_secession.3.title: "A Grand Compromise"
 tsin_secession.3.desc: "Senior legislators propose a compromise that divides the new territories and tightens the return of fugitive slaves. Accepting it postpones the split, but slavery remains."
 tsin_secession.3.a: "Accept the compromise."
 tsin_secession.3.b: "No more compromises with slavery."
 tsin_secession.10.title: "Secession"
 tsin_secession.10.desc: "One after another, the legislatures of the slave regions declare that they have left the republic and raise a new flag over the harbour forts. We must decide now whether to preserve the union."
 tsin_secession.10.a: "Preserve the union by force."
 tsin_secession.10.a.tt: "The [population|e] of the slave regions joins the secessionist rebellion. Once the rebels are gone, the union is restored."
 tsin_secession.10.b: "Strike one last compromise."
 tsin_secession.20.title: "The Union Restored"
 tsin_secession.20.desc: "The last secessionist army has surrendered. The battlefields have become cemeteries, and we must now decide how to bind the country together again."
 tsin_secession.20.a: "Emancipation and reconstruction."
 tsin_secession.20.b: "Restore the old order to heal the wounds."
 # Millenarian rebellion
 tsin_millenarian_rebellion: "The Millenarian Rebellion"
 tsin_millenarian_rebellion_desc: "Famine, foreign pressure and heterodox preaching shake a stagnant agrarian empire. A prophet who calls himself a son of heaven leads hundreds of thousands of peasants to build a heavenly kingdom on earth. It lasts at least three years and ends only when the [rebels|e] are destroyed.\n\nSee also: [tsin_millenarian_rebellion_concept|e]"
 tsin_millenarian_rebels: "Millenarian Rebels"
 STATIC_MODIFIER_NAME_tsin_suppression_campaign: "Suppression Campaign"
 STATIC_MODIFIER_NAME_tsin_gentry_armies: "Gentry Armies"
 STATIC_MODIFIER_NAME_tsin_ever_victorious_army: "Ever Victorious Army"
 STATIC_MODIFIER_NAME_tsin_rebellion_devastation: "Devastation of the Rebellion"
 tsin_millenarian.1.title: "The Heavenly Kingdom"
 tsin_millenarian.1.desc: "A failed examination candidate claims to have received a heavenly mandate in a vision. His followers smash idols and divide the land, and starving peasants flock to his banner by the tens of thousands."
 tsin_millenarian.1.tt: "The [population|e] of several provinces joins the millenarian rebels."
 tsin_millenarian.1.a: "Crush the heretics with the imperial army."
 tsin_millenarian.1.b: "Let the provincial gentry raise their own armies."
 tsin_millenarian.2.title: "The Heavenly Capital"
 tsin_millenarian.2.desc: "The rebels have taken a great city and set up their own court and offices. The taxes of whole provinces no longer reach us, and the treasury is running dry."
 tsin_millenarian.2.a: "Raise new war taxes."
 tsin_millenarian.2.b: "Pardon those who lay down their arms."
 tsin_millenarian.3.title: "Foreign-Officered Troops"
 tsin_millenarian.3.desc: "Foreign merchants in the ports offer a mercenary corps with modern rifles and foreign officers. The price is high, and the court's dignity is at stake."
 tsin_millenarian.3.a: "Hire them."
 tsin_millenarian.3.b: "No foreigners in our army."
 tsin_millenarian.4.title: "Famine Behind the Lines"
 tsin_millenarian.4.desc: "Both armies have seized the grain, and famine has struck the provinces where they fight."
 tsin_millenarian.4.a: "Open the granaries."
 tsin_millenarian.4.b: "The army eats first."
 tsin_millenarian.10.title: "After the Rebellion"
 tsin_millenarian.10.desc: "The rebellion is over, but countless villages are gone and the fields are overgrown. The empire has survived, but it is not what it was."
 tsin_millenarian.10.a: "Rebuild from the ruins."
 # Millenarian rebellion
