l_english:

 # Infrastructure, finance, city life and late invention events
 tsin_economy.90.title: "The Gauge War"
 tsin_economy.90.desc: "Every railway company has laid its track to its own width. Where two lines meet, every crate must be unloaded and carried to another train. The merchants complain that they pay the porters more than the freight."
 tsin_economy.90.a: "One standard gauge by law."
 tsin_economy.90.b: "Let the companies settle it."
 tsin_economy.100.title: "The Gasworks Explosion"
 tsin_economy.100.desc: "At midnight a gasholder at the city gasworks burst and a whole quarter burned. The gas lamps that lit the streets have become the citizens' fear. The council argues that the city should run the gasworks itself."
 tsin_economy.100.a: "The city buys the gasworks."
 tsin_economy.100.b: "A safety code for the private companies."
 tsin_economy.110.title: "Coaling Stations"
 tsin_economy.110.desc: "A steamer does not wait for the wind, but without coal it cannot move at all. Only with depots of coal along the routes can regular lines reach the far seas."
 tsin_economy.110.a: "Build coaling stations along the routes."
 tsin_economy.110.b: "Subsidize the mail steamers instead."
 tsin_economy.120.title: "The Vanishing Company"
 tsin_economy.120.desc: "A promoter who floated a limited company has vanished with his shareholders' money. The company had no works and no mine, only a splendid prospectus. The investors demand that the state look into company books."
 tsin_economy.120.a: "A companies registry and public accounts."
 tsin_economy.120.b: "Let the buyer beware."
 tsin_economy.130.title: "Run on the Bank"
 tsin_economy.130.desc: "A rumour that a commercial bank is unsound has depositors queuing at its doors from dawn. If the vaults run dry the bank closes, and the mills that keep their money there cannot pay wages."
 tsin_economy.130.a: "Lend to the bank as a last resort."
 tsin_economy.130.b: "Let it fail."
 tsin_society.130.title: "The Great Stink"
 tsin_society.130.desc: "In the summer heat the river through the capital stinks so foully that parliament cannot sit. The members debate the sewer budget behind curtains soaked in lime. Those who think smell carries disease and those who blame the water now reach the same conclusion."
 tsin_society.130.a: "Intercepting sewers along the embankment."
 tsin_society.130.b: "Soak the curtains in lime and wait for rain."
 tsin_society.140.title: "The Lungs of the City"
 tsin_society.140.desc: "In a city crowded with chimneys and tenements, the last open ground remains. The reformers want a park where working families can breathe on Sunday; the builders want more tenements."
 tsin_society.140.a: "Lay out a people's park."
 tsin_society.140.b: "Sell the land to the builders."
 tsin_society.150.title: "Night Schools for Working Men"
 tsin_society.150.desc: "After the shift, factory hands gather under the lamps to learn letters and figures. A skilled man earns more, and the works gain too. The parish offers to do the teaching."
 tsin_society.150.a: "State evening classes."
 tsin_society.150.b: "Leave it to the parish."
 tsin_society.160.title: "The Census Asks Too Much"
 tsin_society.160.desc: "The new census form asks not only names and ages but language, faith and trade. The statisticians say that is what it takes to know the country; the opposition protests that the state is coming into the home."
 tsin_society.160.a: "Ask about language, faith and trade."
 tsin_society.160.b: "Count heads, nothing more."
 tsin_society.170.title: "Anti-Vaccination Riots"
 tsin_society.170.desc: "Compulsory vaccination of children has brought protesters into the streets. The state has no right to put a lancet to a child's arm, they cry. The doctors say the return of smallpox would be worse."
 tsin_society.170.a: "Vaccination stays compulsory."
 tsin_society.170.b: "A conscience clause for objectors."
 tsin_invention.80.title: "Vulcanized Rubber"
 tsin_invention.80.desc: "Raw rubber heated with sulphur no longer melts in summer or cracks in winter. Drive belts, steam hoses and waterproof boots can all be made of the new material."
 tsin_invention.80.a: "License the patent to the rubber works."
 tsin_invention.80.b: "Belts and hoses for the state works."
 tsin_invention.90.title: "The Internal Combustion Engine"
 tsin_invention.90.desc: "An engine that burns its fuel inside the cylinder, with no boiler and no coal heap, has been demonstrated. Small and light, it could drive not only works but carriages and boats."
 tsin_invention.90.a: "License the engine to private works."
 tsin_invention.90.b: "A state motor laboratory."
 tsin_invention.100.title: "Wireless Telegraphy"
 tsin_invention.100.desc: "A device that sends signals through the air, without wires, has carried Morse code across the water. Ships at sea can now talk to the land."
 tsin_invention.100.a: "Wireless for the merchant lines."
 tsin_invention.100.b: "Wireless for the fleet."
