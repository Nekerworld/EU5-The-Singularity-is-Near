 # tsin_civic events (docs/replaced_buildings.md)
 tsin_civic.10.title: "The Humboldtian Reform"
 tsin_civic.10.desc: "The professors of our new research universities want to break with the old lecture halls. Research and teaching should live under one roof, and students should make knowledge themselves in the laboratory and the seminar. The question is who decides what is taught."
 tsin_civic.10.a: "Freedom to teach and to learn"
 tsin_civic.10.b: "The ministry sets the curriculum"
 tsin_civic.20.title: "An Explosion in the Laboratory"
 tsin_civic.20.desc: "An explosion in the university chemistry laboratory in [tsin_civic_location.GetName] has injured two assistants. The neighbours want to know what is being brewed in the middle of town."
 tsin_civic.20.a: "Pay for new safety rules"
 tsin_civic.20.b: "Science has its price"
 tsin_civic.30.title: "Students on the Barricades"
 tsin_civic.30.desc: "The students of [tsin_civic_location.GetName] have left the lecture halls for the streets. Their demands grow by the hour: a constitution, a free press, exemption from conscription. Several professors have taken their side."
 tsin_civic.30.a: "Close the university for a term"
 tsin_civic.30.b: "Hear the students out"
 tsin_civic.40.title: "Women at the Lecture Hall Door"
 tsin_civic.40.desc: "A group of women has petitioned to attend lectures in medicine and the natural sciences. The faculty is split, and the church warns that the order of the family is at stake."
 tsin_civic.40.a: "Open the universities to women"
 tsin_civic.40.b: "Separate colleges, separate degrees"
 tsin_civic.50.title: "An International Prize"
 tsin_civic.50.desc: "One of our professors has received a great prize from a foreign academy. The newspapers call it a national triumph. The professor says he would rather have an institute than the prize money."
 tsin_civic.50.a: "Celebrate national science"
 tsin_civic.50.b: "Fund an institute in the laureate's name"
 tsin_civic.60.title: "A Regular Steamship Line"
 tsin_civic.60.desc: "A steamship line with fixed sailing dates is opening at the steam port of [tsin_civic_location.GetName]. The shipping company offers to add routes if we pay a mail subsidy."
 tsin_civic.60.a: "A mail subsidy for the line"
 tsin_civic.60.b: "Leave it to the shipping companies"
 tsin_civic.70.title: "The Dockers Strike"
 tsin_civic.70.desc: "The dockers of [tsin_civic_location.GetName] have downed tools for a penny more an hour. The cargo ships are queuing offshore."
 tsin_civic.70.a: "A penny more an hour"
 tsin_civic.70.b: "Bring in strikebreakers"
 tsin_civic.80.title: "The Emigrant Ships"
 tsin_civic.80.desc: "Families looking for a new life overseas crowd the quays of [tsin_civic_location.GetName]. Steamships have cut a voyage of months to a few weeks."
 tsin_civic.80.a: "Assisted passage to our colonies"
 tsin_civic.80.b: "Let them go where they will"
 tsin_civic.90.title: "The Great Stink"
 tsin_civic.90.desc: "The summer heat has turned the river of our capital into an open sewer. Members of the assembly sit behind curtains soaked in lime. Engineers have brought plans for intercepting sewers along the river."
 tsin_civic.90.a: "Build the intercepting sewers now"
 tsin_civic.90.b: "Wait for the rain"
 tsin_civic.100.title: "The Pump Handle"
 tsin_civic.100.desc: "A physician has marked the homes of the dead on a map and found them clustered around a single well. He claims the disease travels in water, not in bad air. The board of health is not yet convinced."
 tsin_civic.100.a: "Water carries the disease: filter and chlorinate"
 tsin_civic.100.b: "Bad air, as the board of health says"
 tsin_civic.110.title: "Home Rule for the Towns"
 tsin_civic.110.desc: "In the towns with a prefecture, citizens are demanding elected councils. The prefects sent from the capital warn that this would break up the administration of the state."
 tsin_civic.110.a: "Elected town councils"
 tsin_civic.110.b: "The prefect answers to the ministry"
 tsin_civic.120.title: "The First Unattended Process"
 tsin_civic.120.desc: "A mill in [tsin_civic_location.GetName] has shown a process that runs all day with hardly a hand on it. The guests were amazed; the workers outside ask whether they are next."
 tsin_civic.120.a: "Show it to the world"
 tsin_civic.120.b: "Promise the workers no one will be dismissed"
