l_english:

 tsin_waterworks: "Waterworks"
 tsin_waterworks_desc: "Steam pumps send clean water to every house and carry sewage out of the city. Replaces the $aqueduct_system$ and can be built in any town ([tsin_infrastructure_concept|e])."
 tsin_waterworks_slot_0: "Waterworks"
 tsin_waterworks_maintenance: "Pumping Station Operation"
 tsin_steam_port: "Steam Port"
 tsin_steam_port_desc: "A modern port with coaling wharves, iron dry docks and steam cranes. Replaces the $naval_base$; besides building warships, it receives liners and emigrant ships ([tsin_infrastructure_concept|e])."
 tsin_steam_port_slot_0: "Steam Port"
 tsin_steam_port_maintenance: "Port Operation"
 tsin_prefecture: "Prefecture"
 tsin_prefecture_desc: "An office where a centrally appointed prefect governs the province with permanent officials. Replaces the $provincial_chancery$ and can be built by any state with a professional bureaucracy ([tsin_infrastructure_concept|e])."
 tsin_prefecture_slot_0: "Prefecture"
 tsin_public_school: "Public Secondary School"
 tsin_public_school_desc: "State secondary schools go beyond [literacy|e] to teach what skilled labor and administration need. Higher courses add more secondary education capacity to the [tsin_education_ladder_concept|e]."
 tsin_public_school_slot_0: "Public Secondary School"
 tsin_public_school_basic: "General Course"
 tsin_public_school_vocational: "Vocational Course"
 tsin_public_school_comprehensive: "Comprehensive Course"
 tsin_electric_lighting_gas: "Gaslight Operation"
 tsin_railway_station_telegraph: "Telegraph Signalling"
 tsin_gas_lighting_advance: "Gas Lighting"
 tsin_gas_lighting_advance_desc: "Gas made by baking coal flows through pipes to light the street lamps. Allows building $tsin_electric_lighting$ in towns and cities ([tsin_infrastructure_concept|e])."
 TSIN_BUILDING_LEVEL_STEEL_ROLLING_STOCK: "$tsin_steel_rolling_stock_advance$"
 TSIN_BUILDING_LEVEL_VOCATIONAL_EDUCATION: "$tsin_vocational_education_advance$"
 TSIN_BUILDING_LEVEL_PUBLIC_WORKS: "$tsin_public_works$"
 TSIN_BUILDING_LEVEL_NATIONAL_EDUCATION: "$tsin_national_education$"
