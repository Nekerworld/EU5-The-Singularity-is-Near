l_english:

 tsin_women_rights_law: "Women's Rights"
 tsin_women_rights_law_desc: "Decides how far women's property, employment and vote are recognised. Each stage opens only while the previous policy is in force and the women's suffrage movement ([tsin_movements_concept|e]) is strong enough, and policies change only through [tsin_bills_concept|e]. Only the suffrage stage lets women sit in the cabinet."
 tsin_women_rights_law_CATEGORY: "SOCIOECONOMIC_LAW_CATEGORY"
 tsin_women_no_rights_policy: "No Women's Rights"
 tsin_women_no_rights_policy_desc: "Family and custom decide the standing of women. Clergy and nobles are content and society leans traditional."
 tsin_women_property_policy: "Women's Property Rights"
 tsin_women_property_policy_desc: "Women hold property and inherit in their own name. Burghers and peasants are pleased and migration to cities rises slightly, but nobles and clergy resent it. Needs a women's suffrage movement of 20; while in force the movement falls by 1 a year."
 tsin_women_labor_policy: "Women's Labor"
 tsin_women_labor_policy_desc: "Women may work in factories and offices. Production efficiency rises and the clergy are displeased. Needs the previous stage, factory acts or better under the labor law, and a women's suffrage movement of 35; while in force the movement falls by 1 a year."
 tsin_women_suffrage_policy: "Women's Suffrage"
 tsin_women_suffrage_policy_desc: "Women vote and may sit in the cabinet. Peasants are pleased and society moves toward humanism, but clergy and nobles are deeply displeased. Needs the previous stage and a women's suffrage movement of 50; while in force the movement falls by 3 a year."

 tsin_naval_ideology_law: "Naval Ideology"
 tsin_naval_ideology_law_desc: "Decides what the fleet is built for. It runs alongside the vanilla maritime laws and, being a military law, is enacted directly without a bill. Only countries with ports can use it, and each ideology needs its own advance."
 tsin_naval_ideology_law_CATEGORY: "MILITARY_LAW_CATEGORY"
 tsin_naval_coastal_defense_policy: "Coastal Defense"
 tsin_naval_coastal_defense_policy_desc: "Harbour forts and coast guard are deemed enough. Naval combat near our own coast is slightly easier."
 tsin_naval_jeune_ecole_policy: "Jeune École"
 tsin_naval_jeune_ecole_policy_desc: "Small fast ships raid commerce and blockade the coast. Light ships are cheaper to keep and blockades and captures improve, but nobles miss the great ships. Needs the Torpedo or Protected Cruiser advance."
 tsin_naval_gunboat_diplomacy_policy: "Gunboat Diplomacy"
 tsin_naval_gunboat_diplomacy_policy_desc: "Showing the flag overseas opens treaty ports and protects trade. Trade range, maritime merchant power and prestige grow, but peasants feel the burden. Needs the Steam Packet Diplomacy advance."
 tsin_naval_blue_water_policy: "Blue Water Navy"
 tsin_naval_blue_water_policy_desc: "A battle fleet of capital ships for ocean-going decisive battle. Fleet size and navy tradition grow, but upkeep efficiency falls and peasants are displeased. Needs both the Ironclad and Naval Gunnery advances."

 tsin_police_law: "Policing"
 tsin_police_law_desc: "Decides who keeps order in towns and the realm. The right of assembly is decided separately by [ShowLawName('tsin_assembly_law')]. Opened by [ShowAdvanceName('tsin_modern_police')]; policies change only through [tsin_bills_concept|e]."
 tsin_police_law_CATEGORY: "ADMINISTRATIVE_LAW_CATEGORY"
 tsin_police_night_watch_policy: "Night Watch and Militia"
 tsin_police_night_watch_policy_desc: "Town watchmen and militia keep order. Nobles are content."
 tsin_police_city_police_policy: "City Police"
 tsin_police_city_police_policy_desc: "Each city keeps a uniformed police. Separatism falls and burghers are content, but tax efficiency dips slightly."
 tsin_police_national_police_policy: "National Police"
 tsin_police_national_police_policy_desc: "A centrally commanded national police. Separatism falls further and the crown grows stronger, but tax efficiency falls and peasants are uneasy. Needs the Mass Communication advance."
 tsin_police_political_police_policy: "Political Police"
 tsin_police_political_police_policy_desc: "A secret police watching subversive ideas and people. Separatism falls sharply and the crown grows strong, but burghers and peasants are displeased and society leans absolutist. Needs the National Census advance."

 tsin_public_health_law: "Public Health"
 tsin_public_health_law_desc: "Decides who handles urban hygiene and epidemic response. Opened by [ShowAdvanceName('tsin_modern_sewerage_advance')]; policies change only through [tsin_bills_concept|e]. It does not touch disease resistance, so it does not affect the cholera response check."
 tsin_public_health_law_CATEGORY: "SOCIOECONOMIC_LAW_CATEGORY"
 tsin_health_laissez_faire_policy: "Laissez-faire"
 tsin_health_laissez_faire_policy_desc: "Hygiene is left to towns and the market. Burghers are content."
 tsin_health_quarantine_policy: "Sanitation and Quarantine"
 tsin_health_quarantine_policy_desc: "Ports and cities get sanitary inspection and quarantine. Life expectancy rises, but burghers dislike the disruption to trade and tax efficiency dips slightly."
 tsin_health_board_policy: "Public Health Board"
 tsin_health_board_policy_desc: "The state keeps a health board for medicine and hygiene. Life expectancy rises substantially and peasants are pleased, but tax efficiency falls and society leans communal. Needs the Antiseptic Surgery advance."
