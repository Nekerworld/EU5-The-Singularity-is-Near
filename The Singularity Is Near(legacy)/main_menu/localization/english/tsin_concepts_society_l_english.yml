l_english:
 game_concept_tsin_industrial_society_concept: "Industrial Society"
 game_concept_tsin_industrial_society_concept_desc: "Factories and railways change how people live. In the Age of Industry towns fill with [ShowPopTypeName('laborers')] and [ShowPopTypeName('burghers')], schooling goes beyond reading and writing, and ordinary people organize to demand a say in how they work and how they are governed. Well-handled, this society is skilled, healthy and loyal; neglected, it is crowded, angry and radical.\n\nMovements, labor and housing work from the start of the age. The [tsin_education_ladder_concept|e] starts once we embrace [ShowInstitutionName('tsin_mass_society')].\n\n#T Living and Working#!\n$BULLET$[tsin_urbanization_concept|e]: how much of our population lives an urban life.\n$BULLET$[tsin_housing_concept|e]: crowded cities and workers' housing.\n$BULLET$[tsin_labor_conditions_concept|e]: how bearable work is in each factory town.\n$BULLET$[tsin_labor_grievance_concept|e]: the anger of our factory workers, strikes and socialist cells.\n$BULLET$[tsin_public_health_concept|e]: epidemics, sanitation and life expectancy.\n\n#T Learning#!\n$BULLET$[tsin_education_ladder_concept|e]: literacy, secondary and higher education.\n$BULLET$[tsin_schools_and_universities_concept|e]: the buildings that feed the ladder.\n\n#T Politics of the Street#!\n$BULLET$[tsin_movements_concept|e]: liberals, nationalists, unions, socialists, suffragists and abolitionists.\n$BULLET$[tsin_estate_privileges_concept|e]: what the [estates|e] ask for in this age.\n\n#T Reference#!\n$BULLET$[tsin_society_advances_concept|e]: the advances that open all of this.\n$BULLET$[tsin_working_class_events_concept|e]: the events these conditions bring.\n$BULLET$[tsin_social_modifiers_concept|e]: the modifiers we may receive.\n\nUseful map modes: $mapmode_tsin_urbanization_name$, $mapmode_tsin_housing_name$, $mapmode_tsin_labor_conditions_name$, $mapmode_tsin_labor_unrest_name$, $mapmode_tsin_radicalism_name$ and $mapmode_tsin_education_name$."
 game_concept_tsin_movements_concept: "Political Movements"
 game_concept_tsin_movements_concept_desc: "In this age ideas spread faster than armies. From the Age of Industry every country tracks the strength of six political movements on a scale from 0 to 100: Abolitionism, Liberalism, Nationalism, the Labour Movement, Socialism and Women's Suffrage. Strong movements cost us the goodwill of the [estates|e] and pull our [societal_values|e] their way, so it pays to know what feeds them.\n\n#T How They Grow#!\nEach year every movement changes by its own growth:\n$BULLET$Abolitionism exists only while slavery is legal. It grows with [ShowInstitutionName('tsin_mass_society')], [ShowAdvanceName('tsin_mass_communication_advance')], [ShowPolicyName('free_press')] and humanist values, and more slowly where slaves are over a tenth of the population.\n$BULLET$Liberalism grows with [ShowInstitutionName('tsin_mass_society')], [ShowPolicyName('free_press')], liberal values and [ShowPolicyName('tsin_assembly_banned_policy')]. [ShowPolicyName('tsin_free_association_policy')] satisfies it.\n$BULLET$Nationalism grows with [ShowAdvanceName('tsin_mass_communication_advance')] and belligerent values, and much faster in [subjects|e].\n$BULLET$The Labour Movement grows with [ShowAdvanceName('tsin_labor_movement_advance')], factories, [tsin_labor_grievance_concept|e] and [ShowPolicyName('tsin_unregulated_labor_policy')]. [ShowPolicyName('tsin_factory_acts_policy')] and, even more, [ShowPolicyName('tsin_labor_protection_policy')] satisfy it.\n$BULLET$Socialism fades on its own unless fed by a Labour Movement of 50 or more, labor grievance of 50 or more, socialist cells, communalist values, unregulated labour or banned assemblies. [ShowPolicyName('tsin_social_insurance_policy')] satisfies it.\n$BULLET$Women's Suffrage grows with [ShowAdvanceName('tsin_universal_education_advance')], [ShowAdvanceName('tsin_mass_communication_advance')] and humanist values. No law of this age satisfies it.\nBanning assemblies drives the Labour Movement and Women's Suffrage underground, which slows them, but feeds Liberalism and Socialism.\n\n#T Agitation#!\nA movement at 60 or more agitates and gives us a [country_modifier|e] until it falls below 50:\n$BULLET$[ShowModifier('tsin_liberalism_agitation')]: unhappy [ShowEstateTypeName('burghers_estate')], drift towards liberalism.\n$BULLET$[ShowModifier('tsin_nationalism_agitation')]: more manpower, drift towards belligerence.\n$BULLET$[ShowModifier('tsin_labor_unionism_agitation')]: unhappy [ShowEstateTypeName('peasants_estate')], lower [production_efficiency|e].\n$BULLET$[ShowModifier('tsin_socialism_agitation')]: unhappy commoners and burghers, drift towards communalism.\n$BULLET$[ShowModifier('tsin_womens_suffrage_agitation')]: unhappy burghers, drift towards humanism.\n\n#T Meeting Their Demands#!\nStrong movements put [parliament_agendas|e] forward: [ShowParliamentAgendaTypeName('pa_tsin_abolish_slavery')] (abolitionism 50), [ShowParliamentAgendaTypeName('pa_tsin_freedom_of_association')] (liberalism 50) and [ShowParliamentAgendaTypeName('pa_tsin_social_insurance')] (socialism 40 or Labour Movement 60). Accepting the last two tables a [tsin_bills_concept|e] for the policy and lowers the movement by 20. Movements also trigger [tsin_working_class_events_concept|e] such as the People's Charter, strikes and votes for women.\n\n#T Where to See It#!\nThe strongest movement is our radicalism. The $mapmode_tsin_radicalism_name$ map mode weighs it by each [location|e]'s discontent, and the $mapmode_tsin_labor_unrest_name$ map mode shows the Labour Movement and labor grievance in its tooltip. A hint appears when radicalism reaches 60."
 game_concept_tsin_labor_conditions_concept: "Labor Conditions"
 game_concept_tsin_labor_conditions_concept_desc: "Labor conditions measure how bearable work is in a factory [location|e], from 0 (dreadful) to 1 (good). Only locations with factory jobs have them. Poor conditions raise our [tsin_labor_grievance_concept|e], and very poor ones breed socialist cells.\n\nEvery year each factory location starts at 0.5 and adds:\n$BULLET$[ShowLawName('tsin_labor_law')]: [ShowPolicyName('tsin_unregulated_labor_policy')] -0.15, [ShowPolicyName('tsin_factory_acts_policy')] +0.1, [ShowPolicyName('tsin_labor_protection_policy')] +0.25.\n$BULLET$[ShowLawName('tsin_welfare_law')]: [ShowPolicyName('tsin_social_insurance_policy')] +0.1, [ShowPolicyName('tsin_poor_law_policy')] +0.05.\n$BULLET$Crowding: up to -0.2 once the population exceeds 80% of the [population_capacity|e] ([tsin_housing_concept|e]).\n$BULLET$[ShowBuildingTypeName('tsin_model_dwellings')] in the location: +0.1.\n$BULLET$Skilled workers: up to +0.09 from our secondary education ([tsin_education_ladder_concept|e]).\n$BULLET$A recent factory accident (5 years) or a strike broken by force (10 years): -0.1 each.\n$BULLET$The [average_satisfaction|e] of the people living there: from -0.1 to +0.1.\n\nThe country's labor conditions are the average of its factory locations, weighted by their jobs; a country without factories counts as 0.5. The $mapmode_tsin_labor_conditions_name$ map mode shows each factory location, and its tooltip also gives the share of local laborers working in factories."
 game_concept_tsin_labor_grievance_concept: "Labor Grievance"
 game_concept_tsin_labor_grievance_concept_desc: "Labor grievance is the anger of our factory workers, from 0 to 100. It only matters in industrial countries: poor [tsin_labor_conditions_concept|e] count in proportion to the share of our population working in factories, in full once that share reaches a tenth.\n\n#T How It Moves#!\nEach year grievance closes a quarter of the gap to its target. The target is (1 - labor conditions) × 100, scaled by the factory share, then:\n$BULLET$+10 during the panic or slump of [ShowSituationName('tsin_long_depression')].\n$BULLET$-5 with [ShowPolicyName('tsin_free_association_policy')], -10 with [ShowEstatePrivilegeName('tsin_union_recognition')], -5 with [ShowModifier('tsin_ten_hour_day')] and -3 with [ShowPolicyName('tsin_antitrust_policy')].\nMany event choices and agendas also add or remove grievance at once.\n\n#T What It Causes#!\n$BULLET$It feeds the Labour Movement, and from 50 Socialism ([tsin_movements_concept|e]).\n$BULLET$From 30 the [ShowEstateTypeName('peasants_estate')] can put [ShowParliamentAgendaTypeName('pa_tsin_factory_inspection')] before [parliament|e] (-10 grievance, a 10-year modifier). From 40, once unions are recognized, they can demand [ShowParliamentAgendaTypeName('pa_tsin_ten_hour_day')] (-15 grievance, a permanent modifier that costs [production_efficiency|e]).\n$BULLET$Together with the Labour Movement it makes labor and welfare [tsin_bills_concept|e] likelier to pass.\n$BULLET$It unlocks [tsin_working_class_events_concept|e]: nervous breakdowns (30), May Day marches and workers leaving for the frontier (50), anarchist attacks (60).\n$BULLET$At 60 or more it weighs on our companies' share prices ([tsin_stock_index_concept|e]).\n\n#T Strikes and Socialist Cells#!\nWhen the Labour Movement reaches 40, a strike can break out in a factory town. Recognizing the union or offering arbitration calms the Labour Movement; breaking the strike by force strengthens the Labour Movement and Socialism and worsens local labor conditions for 10 years.\nFrom 1885 a factory location with many factory jobs and labor conditions below 0.35 has a 10% chance each year to form a socialist cell. A cell has a 5% chance each year to spread to another factory city of the same [market|e] with conditions below 0.5. Every three cells add 1 to the yearly growth of Socialism (at most 2), and a cell can trigger the \"Socialist Reading Circle\" event, where it can be raided.\n\nThe $mapmode_tsin_labor_unrest_name$ map mode marks recent strikes and street fighting and shows grievance in its tooltip. A hint appears when grievance reaches 50."
 game_concept_tsin_housing_concept: "Housing and Crowding"
 game_concept_tsin_housing_concept_desc: "Factory towns grow faster than their houses. A [location|e] is crowded when its [population|e] exceeds 80% of its [population_capacity|e]. Crowding lowers [tsin_labor_conditions_concept|e] by up to 0.2, crowded towns and cities without [ShowBuildingTypeName('tsin_waterworks')] are where [ShowDisasterName('tsin_cholera')] strikes ([tsin_public_health_concept|e]), and crowded locations with a $tsin_steam_port$ can send out emigrant ships.\n\n#T Buildings#!\n$BULLET$[ShowBuildingTypeName('tsin_tenement')] (from [ShowAdvanceName('tsin_urban_planning_advance')]): each level gives +4% population capacity and +0.03 [migration_attraction|e], but -0.02 [disease_resistance|e]. Upkeep: lumber and stone.\n$BULLET$[ShowBuildingTypeName('tsin_model_dwellings')] (from [ShowAdvanceName('tsin_housing_reform_advance')]): replaces the tenements. Each level gives +5% population capacity, +0.03 migration attraction, +0.03 disease resistance and -0.02 [unrest|e], and the location's factories get +0.1 labor conditions. Upkeep: masonry, lumber and tools.\nBoth are built in towns, cities and megalopolises and employ a few [ShowPopTypeName('laborers')]. Maximum level: 1, +1 in a city, +2 in a megalopolis, +1 with [ShowAdvanceName('tsin_modern_sewerage_advance')] and +1 with [ShowAdvanceName('tsin_public_works')].\n\n#T Other Help#!\n$BULLET$[ShowAdvanceName('tsin_urban_planning_advance')]: +10% population capacity everywhere.\n$BULLET$The [cabinet_action|e] [ShowCabinetActionName('tsin_urban_renewal')]: more population capacity and less unrest in a chosen [province|e].\n\nThe $mapmode_tsin_housing_name$ map mode shows model dwellings, tenements, crowding and overcrowded locations; its tooltip gives the population over capacity."
 game_concept_tsin_urbanization_concept: "Urbanization"
 game_concept_tsin_urbanization_concept_desc: "Urbanization is the share of [ShowPopTypeName('burghers')] and [ShowPopTypeName('laborers')] in a [location|e]'s population. It is not a separate value but a picture of how far industry has drawn people off the land. Urban [pops|e] fill the factories and schools, and they are the ones who join [tsin_movements_concept|e].\n\nWhat drives it:\n$BULLET$[promotion|e] of peasants as new jobs appear. [ShowAdvanceName('tsin_labor_movement_advance')] and secondary education ([tsin_education_ladder_concept|e]) speed it up.\n$BULLET$[migration|e] towards towns: [ShowAdvanceName('tsin_urban_planning_advance')] (+0.25 non-rural migration attraction and +10% [population_capacity|e]), [ShowPolicyName('tsin_redemption_payments_policy')] (+0.1) and [ShowPolicyName('tsin_full_emancipation_policy')] (+0.25) of [ShowLawName('tsin_land_reform_law')], and workers' housing ([tsin_housing_concept|e]).\n$BULLET$Factories that create jobs ([tsin_industrial_economy_concept|e]).\n\nThe $mapmode_tsin_urbanization_name$ map mode shows the share in each location, at full colour from 50%; cities and megalopolises always show the top colour. Remember that more factory workers also means more [tsin_labor_grievance_concept|e] if their conditions are poor."
 game_concept_tsin_education_ladder_concept: "Education Ladder"
 game_concept_tsin_education_ladder_concept_desc: "In this age nearly everyone learns to read, so literacy alone no longer tells countries apart. Once $tsin_mass_society$ is embraced, education is measured on three rungs, starting from the educated elite we already have (secondary at 15% of literacy, higher at 20% of secondary).\n$BULLET$Primary: vanilla [literacy|e], unchanged.\n$BULLET$Secondary education (0-90): from $tsin_public_school$ capacity, our education policy and our factory share.\n$BULLET$Higher education (0-60): from $tsin_research_university$ and $university$ capacity.\n\n#T Targets#!\nThe secondary target is school capacity relative to our population, +5 with [ShowPolicyName('secular_education')], +2 with [ShowPolicyName('basic_religious_education')] or [ShowPolicyName('scottish_presbyterian_education')], -5 with [ShowPolicyName('uneducated_masses_education')], plus 20 × our factory share. The higher target is university capacity relative to our population, +1.5 with [ShowGovernmentReformName('tsin_national_laboratory')].\nNo rung can outgrow the one below (secondary ≤ literacy × 0.9, higher ≤ secondary × 0.6). Each year a rate closes 10% of the gap to its target, by at most 3 points for secondary and 2 for higher.\n\n#T Effects#!\nEach rung gives one [country_modifier|e] by stage:\n$BULLET$Secondary 10 / 25 / 45 / 70: production efficiency +1 / +2 / +3.5 / +5%, construction efficiency +2 / +4 / +6 / +8% and faster [promotion|e].\n$BULLET$Higher 2 / 6 / 15 / 30: research speed +2 / +4 / +7 / +10% and institution growth +5 / +10 / +15 / +20%.\nSecondary education also improves factory [tsin_labor_conditions_concept|e] (up to +0.09), and from the second higher stage our scientists can come up with extra inventions.\n\nAn Education Report event tells us whenever a stage changes. The $mapmode_tsin_education_name$ map mode shades countries by higher education and shows all three rates in its tooltip. See [tsin_schools_and_universities_concept|e] for the buildings."
 game_concept_tsin_schools_and_universities_concept: "Schools and Universities"
 game_concept_tsin_schools_and_universities_concept_desc: "Two buildings supply the capacity of the [tsin_education_ladder_concept|e]. Only their levels count, measured against our whole population, so a large country needs many of them.\n\n#T $tsin_public_school$#!\nUnlocked by [ShowAdvanceName('tsin_universal_education_advance')]. A new building for towns, cities and megalopolises, staffed by [ShowPopTypeName('burghers')]. It raises local maximum [literacy|e], literacy growth and [promotion|e]; its upkeep is paper and books.\n$BULLET$Maximum level: 1, +1 in a city, +2 in a megalopolis, +1 with [ShowAdvanceName('tsin_vocational_education_advance')] and +1 with [ShowAdvanceName('tsin_national_education')].\n$BULLET$Courses: $tsin_public_school_basic$, then $tsin_public_school_vocational$ (from [ShowAdvanceName('tsin_vocational_education_advance')], also uses tools) and $tsin_public_school_comprehensive$ (from [ShowAdvanceName('tsin_engineering_education_advance')], also uses glass). Each of these two advances lets every school level teach 50% more pupils.\n\n#T $tsin_research_university$#!\nUnlocked by [ShowAdvanceName('tsin_humboldt_university_advance')]. It replaces the vanilla $university$ and keeps its effects: local institution growth, literacy for burghers and nobles, and cultural influence. It needs a [core|e] location and cannot be built while a privilege blocks university construction.\n$BULLET$Maximum level: 1, +1 with [ShowAdvanceName('tsin_experimental_science_advance')] and +1 with [ShowAdvanceName('tsin_engineering_education_advance')].\n$BULLET$Methods: $tsin_research_university_lectures$, $tsin_research_university_laboratory$ and $tsin_research_university_institute$, which uses [ShowGoodsName('tsin_electricity')]. Each of the same two advances lets every university level teach 50% more students.\n\nOld universities still count towards higher education. [ShowAdvanceName('tsin_experimental_science_advance')] also allows the [government_reform|e] [ShowGovernmentReformName('tsin_national_laboratory')]: research speed and institution growth, a higher education target 1.5 points higher, and somewhat less clergy satisfaction."
 game_concept_tsin_public_health_concept: "Public Health"
 game_concept_tsin_public_health_concept_desc: "Crowded industrial cities breed [diseases|e]. Public health is not a single value but the set of tools that raise [disease_resistance|e] and life expectancy and keep epidemics short.\n\n#T Threats#!\n$BULLET$[ShowDisasterName('tsin_cholera')] (1830-1875): a [disaster|e] that can start when at least two crowded towns or cities lack [ShowBuildingTypeName('tsin_waterworks')]. Each outbreak kills part of such a city, a limited number of times. It ends when enough progress builds up, and $tsin_waterworks$ in the capital and higher disease resistance make that faster.\n$BULLET$Typhus or influenza in the country can bring the \"Epidemic in the Slums\" event: sanitary reform or quarantine.\n$BULLET$Crowding ([tsin_housing_concept|e]): $tsin_tenement$ lower disease resistance, $tsin_model_dwellings$ raise it.\n\n#T Tools#!\n$BULLET$The [cabinet_action|e] [ShowCabinetActionName('tsin_public_health_campaign')] (from [ShowAdvanceName('tsin_anesthesia_advance')]): +0.1 disease resistance, +1 life expectancy and slightly faster population growth for the whole country while it runs.\n$BULLET$The cabinet action [ShowCabinetActionName('tsin_urban_renewal')] (from [ShowAdvanceName('tsin_urban_planning_advance')]): in a chosen [province|e], +5% [population_capacity|e], -0.5 [unrest|e], +0.1 disease resistance and +15% construction speed. It can run in several provinces at once.\n$BULLET$Advances: [ShowAdvanceName('tsin_modern_sewerage_advance')], [ShowAdvanceName('tsin_anesthesia_advance')], [ShowAdvanceName('tsin_antiseptic_surgery_advance')], [ShowAdvanceName('tsin_vaccination_campaigns_advance')], [ShowAdvanceName('tsin_housing_reform_advance')] and [ShowAdvanceName('tsin_social_insurance_advance')] add disease resistance or life expectancy.\n$BULLET$Policies and privileges: [ShowPolicyName('tsin_poor_law_policy')] (+1) and [ShowPolicyName('tsin_social_insurance_policy')] (+2) life expectancy; [ShowEstatePrivilegeName('tsin_mutual_aid_societies')] (+1).\n$BULLET$Events such as \"The Great Stink\", \"The Pump Handle\", \"The Lungs of the City\" and \"Anti-Vaccination Riots\" can leave lasting health modifiers ([tsin_social_modifiers_concept|e])."
 game_concept_tsin_estate_privileges_concept: "Industrial Age Privileges and Demands"
 game_concept_tsin_estate_privileges_concept_desc: "From the Age of Industry each [estate|e] can be granted a new [estate_privilege|e]. Like other privileges, each raises the satisfaction and power of its estate in return for its effect.\n$BULLET$[ShowEstatePrivilegeName('tsin_chambers_of_commerce')] ([ShowEstateTypeName('burghers_estate')]): +10% [ShowModifierTypeName('global_mills_build_buildings_efficiency')], drift towards plutocracy.\n$BULLET$[ShowEstatePrivilegeName('tsin_officer_corps_monopoly')] ([ShowEstateTypeName('nobles_estate')]): +5% land morale, drift towards aristocracy.\n$BULLET$[ShowEstatePrivilegeName('tsin_church_school_network')] ([ShowEstateTypeName('clergy_estate')]): faster [literacy|e] growth, drift towards spiritualism. Not available under [ShowPolicyName('tsin_separation_of_church_and_state_policy')].\n$BULLET$[ShowEstatePrivilegeName('tsin_mutual_aid_societies')] ([ShowEstateTypeName('peasants_estate')], needs [ShowAdvanceName('tsin_labor_movement_advance')]): +1 life expectancy, drift towards communalism.\n$BULLET$[ShowEstatePrivilegeName('tsin_union_recognition')] ([ShowEstateTypeName('peasants_estate')], needs the same advance and [ShowEstatePrivilegeName('tsin_mutual_aid_societies')]): -2% [production_efficiency|e] and drift towards communalism, but -10 to the [tsin_labor_grievance_concept|e] target, and the commoners can then demand the ten-hour day.\n\n#T Estate Demands#!\nThe estates also bring new [parliament_agendas|e]. Many of them table a [tsin_bills_concept|e] for a policy instead of enacting it at once.\n$BULLET$[ShowEstateTypeName('peasants_estate')]: [ShowParliamentAgendaTypeName('pa_tsin_factory_acts')] (under unregulated labour), [ShowParliamentAgendaTypeName('pa_tsin_social_insurance')], [ShowParliamentAgendaTypeName('pa_tsin_factory_inspection')] and [ShowParliamentAgendaTypeName('pa_tsin_ten_hour_day')].\n$BULLET$[ShowEstateTypeName('burghers_estate')]: [ShowParliamentAgendaTypeName('pa_tsin_freedom_of_association')], [ShowParliamentAgendaTypeName('pa_tsin_railway_charters')] and [ShowParliamentAgendaTypeName('pa_tsin_repeal_corn_laws')].\n$BULLET$[ShowEstateTypeName('nobles_estate')]: [ShowParliamentAgendaTypeName('pa_tsin_restore_landlord_rights')] and [ShowParliamentAgendaTypeName('pa_tsin_protect_grain')].\n$BULLET$[ShowEstateTypeName('clergy_estate')]: [ShowParliamentAgendaTypeName('pa_tsin_restore_concordat')] and [ShowParliamentAgendaTypeName('pa_tsin_abolish_slavery')]."
 game_concept_tsin_society_advances_concept: "Mass Society Advances"
 game_concept_tsin_society_advances_concept_desc: "The [advances|e] of the mass society branch follow [ShowAdvanceName('tsin_mass_society_advance')]. They mostly unlock [laws|e], buildings and [cabinet_actions|e]; which policy we then enact is left to us, our [parliament|e] and the [estates|e].\n\n#T Cities#!\n$BULLET$[ShowAdvanceName('tsin_urban_planning_advance')]: +10% [population_capacity|e], migration to towns, $tsin_tenement$ and [ShowCabinetActionName('tsin_urban_renewal')].\n$BULLET$[ShowAdvanceName('tsin_modern_sewerage_advance')]: [disease_resistance|e], life expectancy, $tsin_waterworks$ and one more housing level.\n$BULLET$[ShowAdvanceName('tsin_gas_lighting_advance')]: $tsin_electric_lighting$.\n$BULLET$[ShowAdvanceName('tsin_mass_consumption_advance')]: more demand for furniture and paper, happier burghers.\n$BULLET$[ShowAdvanceName('tsin_housing_reform_advance')]: life expectancy and $tsin_model_dwellings$.\n\n#T Education#!\n$BULLET$[ShowAdvanceName('tsin_universal_education_advance')]: higher maximum [literacy|e], faster literacy, $tsin_public_school$ and [ShowLawName('tsin_church_state_law')].\n$BULLET$[ShowAdvanceName('tsin_vocational_education_advance')]: literacy for laborers, production efficiency, the vocational course and one more school level.\n$BULLET$[ShowAdvanceName('tsin_humboldt_university_advance')]: $tsin_research_university$.\n$BULLET$[ShowAdvanceName('tsin_experimental_science_advance')]: research speed, laboratories and [ShowGovernmentReformName('tsin_national_laboratory')].\n$BULLET$[ShowAdvanceName('tsin_engineering_education_advance')]: production efficiency, engineering institutes and the comprehensive course.\n\n#T Labour and Opinion#!\n$BULLET$[ShowAdvanceName('tsin_mass_communication_advance')]: literacy, cabinet efficiency and [ShowLawName('tsin_assembly_law')].\n$BULLET$[ShowAdvanceName('tsin_labor_movement_advance')]: [promotion|e] speed, [ShowLawName('tsin_labor_law')] and the commoners' new privileges.\n$BULLET$[ShowAdvanceName('tsin_social_insurance_advance')]: life expectancy, happier commoners and [ShowLawName('tsin_welfare_law')].\n\n#T The Nation#!\n$BULLET$[ShowAdvanceName('tsin_nation_state_advance')]: faster integration.\n$BULLET$[ShowAdvanceName('tsin_mass_politics_advance')]: one more government reform slot and [ShowLawName('tsin_trust_law')].\n$BULLET$[ShowAdvanceName('tsin_citizenship_advance')]: cabinet efficiency.\n$BULLET$[ShowAdvanceName('tsin_popular_press_advance')]: cultural influence.\n$BULLET$[ShowAdvanceName('tsin_national_census_advance')]: tax income."
 game_concept_tsin_working_class_events_concept: "Social Events"
 game_concept_tsin_working_class_events_concept_desc: "Industrial society brings its own [events|e]. Most are flavor events: each country gets only a few of them a year (3 by default, set by the game rule $rule_tsin_flavor_event_frequency$), and most fire once per country or rest for years afterwards. Our choices in them move [tsin_movements_concept|e], [tsin_labor_grievance_concept|e] and [tsin_labor_conditions_concept|e], or give [tsin_social_modifiers_concept|e].\n\n#T Society and Movements#!\n\"The People's Charter\" (liberalism 40, with a parliament), \"The Strike\" (Labour Movement 40), \"A Public Education Act\", \"Social Insurance\" (socialism 30), \"Children in the Mills\" (unregulated labour), \"Epidemic in the Slums\", \"Votes for Women\" (suffrage 50), \"A Factory Accident\", \"A Socialist Reading Circle\", \"A May Day Demonstration\" (from 1886), \"The International Workingmen's Association\" (once in the world), \"An Anarchist Assassination\" and \"A Commune in the Capital\" after a lost war.\n\n#T City Life#!\nOnce each, after the matching advance: \"The Great Stink\", \"The Lungs of the City\", \"Night Schools for Working Men\", \"The Census Asks Too Much\" and \"Anti-Vaccination Riots\".\n\n#T Modern Times#!\nOnly in countries with factories: \"The Factory Clock\" (after standard time), \"The Assembly Line\", \"The Feeding Machine\", \"Nervous Breakdown\" (grievance 30), \"The Red Flag\" (socialism 10), \"Better Fed in Jail\" (during [ShowSituationName('tsin_long_depression')]), \"The Department Store at Night\" and \"The Road Out\" (grievance 50).\n\n#T Civic Life#!\nAround the new upgrade buildings: research universities (reform, laboratory explosions, students on the barricades, women students, an international prize), steam ports (steamship lines, dock strikes, emigrant ships), waterworks (the Great Stink, the pump handle), prefectures (home rule for the towns) and the first automated mill.\n\n#T The Great Hunger#!\nWhere most people are peasants, a crop blight can start the [disaster|e] [ShowDisasterName('tsin_great_hunger')] if the commoners are unhappy; so can starving provinces. Its events (famine, emigrant ships, evictions and food riots) do not count against the flavor event limit."
 game_concept_tsin_social_modifiers_concept: "Social Modifiers"
 game_concept_tsin_social_modifiers_concept_desc: "These [modifiers|e] come from the systems and events of [tsin_industrial_society_concept|e]. Hover over a name to see its effects.\n\n#T Systems#!\n$BULLET$Education stages ([tsin_education_ladder_concept|e]): [ShowModifier('tsin_secondary_education_1')] to IV and [ShowModifier('tsin_higher_education_1')] to IV.\n$BULLET$Agitation ([tsin_movements_concept|e]): [ShowModifier('tsin_liberalism_agitation')], [ShowModifier('tsin_nationalism_agitation')], [ShowModifier('tsin_labor_unionism_agitation')], [ShowModifier('tsin_socialism_agitation')], [ShowModifier('tsin_womens_suffrage_agitation')].\n$BULLET$Labor agendas ([tsin_labor_grievance_concept|e]): [ShowModifier('tsin_factory_inspection_agenda')] (10 years), [ShowModifier('tsin_ten_hour_day')] (permanent).\n$BULLET$Abolition: [ShowModifier('tsin_abolitionists_suppressed')], [ShowModifier('tsin_emancipation_shock')], [ShowModifier('tsin_apprenticeship_system')].\n\n#T Society Events#!\n[ShowModifier('tsin_strike_broken')], [ShowModifier('tsin_state_schools')], [ShowModifier('tsin_sanitary_reform')], [ShowModifier('tsin_quarantine')], [ShowModifier('tsin_anti_anarchist_laws')], and in the capital [ShowModifier('tsin_bloody_week')] or [ShowModifier('tsin_municipal_commune')].\n\n#T City Life#!\n[ShowModifier('tsin_intercepting_sewers')], [ShowModifier('tsin_public_parks')], [ShowModifier('tsin_night_schools')], [ShowModifier('tsin_detailed_census')], [ShowModifier('tsin_compulsory_vaccination')], [ShowModifier('tsin_voluntary_vaccination')].\n\n#T Modern Times#!\n[ShowModifier('tsin_sealed_factory_clocks')], [ShowModifier('tsin_stolen_minutes')], [ShowModifier('tsin_assembly_line_speedup')], [ShowModifier('tsin_feeding_machine')], [ShowModifier('tsin_factory_doctors')], [ShowModifier('tsin_poor_relief')], [ShowModifier('tsin_workhouses')], [ShowModifier('tsin_consumer_credit')].\n\n#T Civic Life#!\n[ShowModifier('tsin_humboldt_reform')], [ShowModifier('tsin_state_curriculum')], [ShowModifier('tsin_laboratory_safety')], [ShowModifier('tsin_laboratory_fear')], [ShowModifier('tsin_women_students')], [ShowModifier('tsin_research_institute')], [ShowModifier('tsin_steamship_line')], [ShowModifier('tsin_dock_strike')], [ShowModifier('tsin_assisted_passage')], [ShowModifier('tsin_emigrant_port')], [ShowModifier('tsin_great_stink')], [ShowModifier('tsin_water_theory')], [ShowModifier('tsin_municipal_self_government')], [ShowModifier('tsin_prefectoral_centralism')], [ShowModifier('tsin_automation_showcase')].\n\n#T The Great Hunger#!\n[ShowModifier('tsin_crop_blight')], [ShowModifier('tsin_famine_relief')], [ShowModifier('tsin_food_exports_continue')], [ShowModifier('tsin_mass_emigration')], [ShowModifier('tsin_agricultural_reform')].\n\nA recent factory accident, a strike broken by force, a recent strike and a socialist cell are hidden marks on a [location|e], not modifiers. Accidents and broken strikes show as worse labor conditions in the $mapmode_tsin_labor_conditions_name$ map mode, and recent strikes are marked in the $mapmode_tsin_labor_unrest_name$ map mode."
