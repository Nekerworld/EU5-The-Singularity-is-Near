 STATIC_MODIFIER_DESC_tsin_local_bubble_crash: "Financial contraction caused by observed market stress."
 STATIC_MODIFIER_NAME_tsin_systemic_depression: "Systemic depression"
 STATIC_MODIFIER_DESC_tsin_systemic_depression: "Financial contraction caused by observed market stress."
 STATIC_MODIFIER_NAME_tsin_systemic_trade_slump: "Global trade slump"
 STATIC_MODIFIER_DESC_tsin_systemic_trade_slump: "Financial contraction caused by observed market stress."
 tsin_global_depression: "Global Depression"
 tsin_global_depression_desc: "A sustained surplus of goods, depressed prices and financial contraction in several independent markets have transmitted a global crisis."
 tsin_global_depression_recovery: "Market recovery"
 tsin_global_depression_timeout: "The contraction recedes"
 TSIN_SYSTEMIC_GUIDE: "Requires 1900+, at least eight industrial financial economies; five stressed countries in at least three markets; four bad quarterly samples with two oversupplied, deeply discounted goods each. Minimum two years, maximum six, and a 25-year start cooldown."
 tsin_finance.1.title: "Local company bubble bursts"
 tsin_finance.1.desc: "Company entry persistently exceeded its business base, or four successive quarterly observations showed severe excess supply and depressed prices. Weak private firms consolidate and valuations fall. This event does not transmit a global crisis by itself."
 tsin_finance.1.a: "Let the market consolidate."
