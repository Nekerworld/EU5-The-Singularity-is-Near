l_english:
 tsin_company_regime_law: "Company and capital-market regime"
 tsin_company_regime_law_desc: "Controls company entry and private investment; industrial investment policy remains separate."
 tsin_company_regime_law_CATEGORY: "Socioeconomic"
 tsin_traditionalism_policy: "Traditionalism"
 tsin_traditionalism_policy_desc: "Public founding and expansion are allowed; base company capacity 2, plus industrial-era additions."
 tsin_mercantilism_policy: "Mercantilism"
 tsin_mercantilism_policy_desc: "Public founding and expansion are allowed; base company capacity 3, plus industrial-era additions."
 tsin_interventionism_policy: "Interventionism"
 tsin_interventionism_policy_desc: "Public founding and expansion are allowed; base company capacity 5, plus industrial-era additions."
 tsin_laissez_faire_policy: "Laissez-faire"
 tsin_laissez_faire_policy_desc: "Private firms use burgher capital and enter autonomously. There is no policy firm cap; persistent over-entry can create a bubble."
 tsin_state_capitalism_policy: "State capitalism"
 tsin_state_capitalism_policy_desc: "Public founding and expansion are allowed; base company capacity 7, plus industrial-era additions."
