l_english:
 tsin_envx.1.title: "The river turned black"
 tsin_envx.1.desc: "Pollution continues after the earlier petition and riverside residents protest again. Temporary purification lowers the water risk but does not replace treatment works."
 tsin_envx.1.a: "Spend 300 gold on purification"
 tsin_envx.1.b: "Take no action this time"
 tsin_envx.2.title: "Mine dust"
 tsin_envx.2.desc: "Residents near the mines complain of dust and pit discharge. Dust suppression lowers exposure but does not reduce mine output."
 tsin_envx.2.a: "Spend 200 gold on dust suppression"
 tsin_envx.2.b: "Wait and see"
 tsin_envx.3.title: "Metro ventilation"
 tsin_envx.3.desc: "Steam metro smoke hangs over the platforms and nearby streets. Ventilation equipment can reduce exposure."
 tsin_envx.3.a: "Spend 250 gold on ventilation"
 tsin_envx.3.b: "Keep service unchanged"
 tsin_envx.4.title: "Industrial smog"
 tsin_envx.4.desc: "High smoke levels have persisted for years. The game has no weather data, so sustained high exposure stands in for smog. An air alert reduces emissions for a while."
 tsin_envx.4.a: "Spend 150 gold on an air alert and smog control"
 tsin_envx.4.b: "Issue no alert"
 tsin_envx.5.title: "Industrial hygiene commission"
 tsin_envx.5.desc: "A commission of doctors and officials proposes inspecting drinking water and drains in the factory districts. Inspections lower water risk for three years but do not replace sewerage."
 tsin_envx.5.a: "Spend 120 gold on the commission"
 tsin_envx.5.b: "Send no commission"
 tsin_envx.6.title: "Filter running costs"
 tsin_envx.6.desc: "Installed filters need running costs again. Paying keeps them for five more years; stopping removes them and emissions return to their previous level."
 tsin_envx.6.a: "Pay 80 gold and keep the filters for five years"
 tsin_envx.6.b: "Remove the filters"
 tsin_envx.7.title: "Relocation debate"
 tsin_envx.7.desc: "A debate over moving the worst polluting works out of town. Buildings cannot move in this game, so the response is a conversion grant instead."
 tsin_envx.7.a: "Grant 400 gold for conversion"
 tsin_envx.7.b: "Leave the debate unresolved"
 tsin_envx.8.title: "Clearer skies"
 tsin_envx.8.desc: "After long years of smoke the city sky has cleared. Citizens celebrate the clean-up."
 tsin_envx.8.a: "Hold a celebration (+5 prestige)"
 tsin_envx.8.b: "Remember the past"
