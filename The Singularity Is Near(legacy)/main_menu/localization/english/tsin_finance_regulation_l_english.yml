 tsin_disclosure_audited_policy: "Audited public accounts"
 tsin_disclosure_audited_policy_desc: "New credit, bond issues and equity require a paid annual corporate audit. Existing claims continue to be serviced."
 tsin_finance_regulation.1.title: "Deposit-bank capital shortfall"
 tsin_finance_regulation.1.desc: "Recorded bank assets are below deposit and reserve-facility liabilities. This is a capital shortfall, not merely a cash shortage. Fiscal support pays the actual shortfall plus one transaction lot; it creates neither state equity nor a repayment claim. Wind-down stops new loans and deposits while preserving assets, debts and withdrawal claims. This event does not start a global depression."
 tsin_finance_regulation.1.a: "Pay a fiscal loss-covering grant"
 tsin_finance_regulation.1.b: "Wind down new business; preserve existing claims"
 tsin_finance_regulation.1.c: "Continue observing without additional action"
