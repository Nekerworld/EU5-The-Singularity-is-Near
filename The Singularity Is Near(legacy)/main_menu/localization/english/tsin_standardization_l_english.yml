 tsin_standardization: "International standardization"
 tsin_standardization_desc: "Industrial states discuss measures, rail, parts and electrical compatibility. Domestic standards can be retained separately."
 tsin_standards_host: "Host international standards conference"
 tsin_standards_host_desc: "Requires at least three industrial states meeting education and market-access criteria. The host needs engineering education, 10% factory share, 20% secondary education and peace. Costs 500 gold; conference lasts three years, followed by a 25-year global cooldown."
 tsin_standards_agreement: "Sectoral conventions agreed"
 tsin_standards_no_agreement: "Conference closed without agreement"
 tsin_standards_participants_legend: "Countries choosing standards"
 TSIN_STANDARDS_HELP: "0=undecided, 1=common, 2=dual/compatible, 3=domestic. Choices are independent. Closing the conference does not replace the world’s facilities."
