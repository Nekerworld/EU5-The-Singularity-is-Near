l_english:
 tsin_engines: "Engines"
 tsin_engines_desc: "Steam engines and their parts are the beating heart of the [tsin_industrial_economy_concept|e], driving factories, steamers and locomotives. Fitting machined copper parts onto an iron or steel frame takes skilled machine works to do."

 MODIFIER_TYPE_NAME_can_extract_tsin_engines: "Can Extract Engines"
 MODIFIER_TYPE_DESC_can_extract_tsin_engines: "This allows the extraction of [ShowGoodsName('tsin_engines')] by allowing an [rgo|e] in a [location|e]."
 MODIFIER_TYPE_NAME_ban_exports_of_tsin_engines: "Ban Exports of $tsin_engines$"
 MODIFIER_TYPE_DESC_ban_exports_of_tsin_engines: "This blocks the [export|e] of [ShowGoodsName('tsin_engines')] from all [markets|e] that a [country|e] owns."
 MODIFIER_TYPE_NAME_ban_imports_of_tsin_engines: "Ban Imports of $tsin_engines$"
 MODIFIER_TYPE_DESC_ban_imports_of_tsin_engines: "This blocks the [import|e] of [ShowGoodsName('tsin_engines')] to all [markets|e] that a [country|e] owns."
 MODIFIER_TYPE_NAME_local_tsin_engines_output_modifier: "Local $tsin_engines$ Output"
 MODIFIER_TYPE_DESC_local_tsin_engines_output_modifier: "This modifies the [output|e] of [ShowGoodsName('tsin_engines')] in this [location|e]."
 MODIFIER_TYPE_NAME_local_tsin_engines_establishment_speed: "Local $tsin_engines$ Establishment Speed"
 MODIFIER_TYPE_DESC_local_tsin_engines_establishment_speed: "How quickly newly constructed [buildings|e] producing [ShowGoodsName('tsin_engines')] in this [location|e] reach their full [production_efficiency|e]."
 MODIFIER_TYPE_NAME_global_tsin_engines_output_modifier: "$tsin_engines$ Output"
 MODIFIER_TYPE_DESC_global_tsin_engines_output_modifier: "This modifies the [output|e] of [ShowGoodsName('tsin_engines')] in the entire [country|e]."
 MODIFIER_TYPE_NAME_global_tsin_engines_establishment_speed: "$tsin_engines$ Establishment Speed"
 MODIFIER_TYPE_DESC_global_tsin_engines_establishment_speed: "How quickly newly constructed [buildings|e] producing [ShowGoodsName('tsin_engines')] in the entire [country|e] reach their full [production_efficiency|e]."
 MODIFIER_TYPE_NAME_global_tsin_engines_pop_demand: "National [ShowGoodsNameWithNoTooltip('tsin_engines')] Demand"
 MODIFIER_TYPE_DESC_global_tsin_engines_pop_demand: "This modifies the [pop_needs|e] of the [ShowGoodsName('tsin_engines')] [produced_good|e]."
 MODIFIER_TYPE_NAME_tsin_engines_impacts_inflation: "Engines Impact Inflation"
 MODIFIER_TYPE_DESC_tsin_engines_impacts_inflation: "This determines how the production of [ShowGoodsName('tsin_engines')] impacts [inflation|e] in the [country|e]."
 MODIFIER_TYPE_NAME_tsin_engines_used_for_minting: "Engines Used for Coins"
 MODIFIER_TYPE_DESC_tsin_engines_used_for_minting: "This determines if [ShowGoodsName('tsin_engines')] is used for coins in the [country|e]."

 tsin_machine_works: "Machine Works"
 tsin_machine_works_desc: "Among the lathes and steam hammers of the $tsin_machine_works$, workers build iron and steel frames and fit copper parts to assemble $tsin_engines$ ([tsin_new_goods_concept|e])."
 tsin_machine_works_slot_0: "Frame Method"
 tsin_machine_works_slot_1: "Fittings Method"
 tsin_machine_works_iron_frame: "Cast Iron Frames"
 tsin_machine_works_steel_frame: "Steel Frames"
 tsin_machine_works_copper_fittings: "Copper Fittings"
 tsin_machine_works_glass_gauges: "Glass Gauges"

 tsin_mechanized_textile_mill: "Mechanized Textile Mill"
 tsin_mechanized_textile_mill_desc: "With steam-driven power looms replacing the waterwheel, far fewer workers can weave far more $cloth$. Built by refitting an existing $textile_mill$ ([tsin_building_upgrades_concept|e])."
 tsin_mechanized_textile_mill_slot_0: "Fiber Method"
 tsin_mechanized_textile_mill_slot_1: "Power Method"
 tsin_mechanized_cotton: "Cotton Power Looms"
 tsin_mechanized_wool: "Wool Power Looms"
 tsin_mechanized_fiber_crops: "Fiber Crop Power Looms"
 tsin_mechanized_steam_power: "Steam Power"
 tsin_mechanized_water_power: "Water Power"

 STATIC_MODIFIER_NAME_tsin_factory_safety_rules: "Factory Safety Rules"
 STATIC_MODIFIER_NAME_tsin_factory_accident_unrest: "Aftermath of a Factory Accident"
 STATIC_MODIFIER_NAME_tsin_raw_material_shortage: "Raw Material Shortage"
 STATIC_MODIFIER_NAME_tsin_substitute_materials: "Substitute Materials Trials"
 STATIC_MODIFIER_NAME_tsin_technical_schools: "Technical Schools"
 STATIC_MODIFIER_NAME_tsin_foreign_engineers: "Foreign Engineers"
 STATIC_MODIFIER_NAME_tsin_skill_shortage: "Skilled Labour Shortage"
 STATIC_MODIFIER_NAME_tsin_factory_expansion: "State Factory Expansion"
 STATIC_MODIFIER_NAME_tsin_private_factory_expansion: "Private Factory Expansion"

 tsin_economy.10.title: "Factory Accident"
 tsin_economy.10.desc: "A boiler has burst in a factory in [SCOPE.sLocation('tsin_factory_location').GetName], killing and maiming several workers. Families and fellow workers have gathered at the gates demanding answers."
 tsin_economy.10.a: "Compensate the families."
 tsin_economy.10.b: "Impose safety rules on the works."
 tsin_economy.10.c: "The machines do not stop."
 tsin_economy.20.title: "Raw Material Shortage"
 tsin_economy.20.desc: "The materials our factories depend on have run short on the market. Warehouses are emptying, and factory owners ask the government for help before they must cut output or rely on costly imports."
 tsin_economy.20.a: "Buy abroad at any price."
 tsin_economy.20.b: "Cut production until supply recovers."
 tsin_economy.20.c: "Let them try substitute materials."
 tsin_economy.30.title: "Shortage of Skilled Workers"
 tsin_economy.30.desc: "New factories keep opening, but workers who can run and repair the machines are desperately scarce. Owners poach each other's mechanics and wages climb."
 tsin_economy.30.a: "Found technical schools."
 tsin_economy.30.b: "Hire foreign engineers."
 tsin_economy.30.c: "Make do with apprentices."
 tsin_economy.40.title: "Factory Expansion Proposal"
 tsin_economy.40.desc: "Factory owners in [SCOPE.sLocation('tsin_factory_location').GetName] have brought plans to enlarge their works. State money would speed things along, but the burghers would welcome being left to fund it themselves."
 tsin_economy.40.a: "Invest from the treasury."
 tsin_economy.40.b: "Leave it to private capital."
 tsin_economy.40.c: "Not now."

 tsin_debug_build_factories_decision.title: "(TSIN Debug) Build Test Factories"
 tsin_debug_build_factories_decision.desc: "Instantly builds a $tsin_machine_works$ and a $textile_mill$ in the capital."
 tsin_debug_build_factories_decision.a: "Build"
 tsin_debug_upgrade_textile_decision.title: "(TSIN Debug) Mechanize Textile Mill"
 tsin_debug_upgrade_textile_decision.desc: "Instantly builds a $tsin_mechanized_textile_mill$ in the capital, testing the upgrade path from a $textile_mill$."
 tsin_debug_upgrade_textile_decision.a: "Mechanize"
 tsin_debug_engines_shortage_decision.title: "(TSIN Debug) Engine Shortage"
 tsin_debug_engines_shortage_decision.desc: "Sharply reduces $tsin_engines$ supply in the capital's market."
 tsin_debug_engines_shortage_decision.a: "Reduce supply"
 tsin_debug_engines_glut_decision.title: "(TSIN Debug) Engine Glut"
 tsin_debug_engines_glut_decision.desc: "Floods the capital's market with $tsin_engines$."
 tsin_debug_engines_glut_decision.a: "Add supply"
 tsin_debug_economy_events_a_decision.title: "(TSIN Debug) Economy Events 1"
 tsin_debug_economy_events_a_decision.desc: "Fires the factory accident and raw material shortage events."
 tsin_debug_economy_events_a_decision.a: "Fire"
 tsin_debug_economy_events_b_decision.title: "(TSIN Debug) Economy Events 2"
 tsin_debug_economy_events_b_decision.desc: "Fires the skilled worker shortage and factory expansion events."
 tsin_debug_economy_events_b_decision.a: "Fire"

 mapmode_tsin_industrialization_name: "Industrialization"
 MAPMODE_TSIN_INDUSTRIALIZATION: "#T $mapmode_tsin_industrialization_name$#!\n$mapmode_common_start$ the share of each [location|e]'s population that its factory-tier [buildings|e] can employ. 25% or more shows the strongest colour."
 LEGEND_KEY_TSIN_INDUSTRIAL_SHARE_HIGH: "Factory jobs 25%+"
 LEGEND_KEY_TSIN_INDUSTRIAL_SHARE_LOW: "Few factory jobs"
 LEGEND_KEY_TSIN_NO_FACTORIES: "No factories"
 TSIN_INDUSTRIALIZATION_MAPMODE_TT: "Factory jobs in [ROOT.GetLocation.GetName] equal [ROOT.ScriptValue('tsin_location_industrial_share')|%0] of the population. (Factory-tier [buildings|e]: [ROOT.ScriptValue('tsin_location_mill_levels')|Y0] levels)"
 TSIN_INDUSTRIALIZATION_NONE_MAPMODE_TT: "[ROOT.GetLocation.GetName] has no factory-tier [buildings|e]."

 tsin_machinery: "Machinery"
 tsin_machinery_desc: "The manufacture of steam engines and their parts, on which [tsin_factories_concept|e], steamers and [tsin_railways_concept|e] all depend."

 tsin_machine_works_advance: "Machine Works"
 tsin_machine_works_advance_desc: "$tsin_machine_works_desc$"
 tsin_steel_frame_engines_advance: "Steel-Framed Engines"
 tsin_steel_frame_engines_advance_desc: "Framing engines in steel rather than cast iron makes them lighter, sturdier and able to bear higher pressures. Unlocks the $tsin_machine_works_steel_frame$ method in the $tsin_machine_works$."
 tsin_mechanized_textile_mill_advance: "Mechanized Textile Mill"
 tsin_mechanized_textile_mill_advance_desc: "$tsin_mechanized_textile_mill_desc$"
