l_english:

 # 0.7 map modes
 mapmode_tsin_automation_name: "Automation"
 MAPMODE_TSIN_AUTOMATION: "#T $mapmode_tsin_automation_name$#!\n$mapmode_common_start$ [locations|e] by the share of their factory levels that are automated upgrades."
 TSIN_AUTOMATION_MAPMODE_TT: "Factory levels [ROOT.ScriptValue('tsin_location_mill_levels')|0], automated [ROOT.ScriptValue('tsin_location_automated_mill_levels')|0] ([ROOT.ScriptValue('tsin_location_automation_share')|%0])"
 LEGEND_KEY_TSIN_AUTOMATED: "Automated factories"
 LEGEND_KEY_TSIN_MANUAL_FACTORIES: "Factories without automation"
 mapmode_tsin_industrial_siting_name: "Industrial Siting"
 MAPMODE_TSIN_INDUSTRIAL_SITING: "#T $mapmode_tsin_industrial_siting_name$#!\n$mapmode_common_start$ [locations|e] by how good a site they are for factories: market access, coal or iron, a railway station and city rank."
 TSIN_INDUSTRIAL_SITING_MAPMODE_TT: "Factory site score [ROOT.ScriptValue('tsin_location_siting_score')|%0]"
 LEGEND_KEY_TSIN_GOOD_SITE: "Good site"
 LEGEND_KEY_TSIN_POOR_SITE: "Poor site"
 mapmode_tsin_infrastructure_name: "Modern Infrastructure"
 MAPMODE_TSIN_INFRASTRUCTURE: "#T $mapmode_tsin_infrastructure_name$#!\n$mapmode_common_start$ [locations|e] by how many of railway station, waterworks, steam port, city lighting and prefecture they have."
 TSIN_INFRASTRUCTURE_MAPMODE_TT: "Modern infrastructure [ROOT.ScriptValue('tsin_location_infrastructure_count')|0]/5"
 LEGEND_KEY_TSIN_FULL_INFRASTRUCTURE: "Full infrastructure"
 LEGEND_KEY_TSIN_SOME_INFRASTRUCTURE: "Some infrastructure"
 LEGEND_KEY_TSIN_NO_INFRASTRUCTURE: "No modern infrastructure"
 mapmode_tsin_labor_conditions_name: "Labor Conditions"
 MAPMODE_TSIN_LABOR_CONDITIONS: "#T $mapmode_tsin_labor_conditions_name$#!\n$mapmode_common_start$ factory [locations|e] by their labor conditions (labor law, crowding, housing, accidents, skills)."
 TSIN_LABOR_CONDITIONS_MAPMODE_TT: "Labor conditions [ROOT.ScriptValue('tsin_location_labor_conditions')|2], factory worker share [ROOT.ScriptValue('tsin_location_factory_worker_share')|%0]"
 LEGEND_KEY_TSIN_GOOD_CONDITIONS: "Good conditions"
 LEGEND_KEY_TSIN_POOR_CONDITIONS: "Poor conditions"
 LEGEND_KEY_TSIN_DREADFUL_CONDITIONS: "Dreadful conditions (below 0.3)"
 mapmode_tsin_housing_name: "Housing"
 MAPMODE_TSIN_HOUSING: "#T $mapmode_tsin_housing_name$#!\n$mapmode_common_start$ [locations|e] by crowding and worker housing."
 TSIN_HOUSING_MAPMODE_TT: "Population over capacity [ROOT.ScriptValue('tsin_location_crowding')|%0]"
 LEGEND_KEY_TSIN_MODEL_DWELLINGS: "$tsin_model_dwellings$"
 LEGEND_KEY_TSIN_TENEMENT: "$tsin_tenement$"
 LEGEND_KEY_TSIN_CROWDING: "Crowding"
 LEGEND_KEY_TSIN_OVERCROWDED: "Overcrowded (above 80% of capacity)"
 mapmode_tsin_gdp_per_capita_name: "Estimated GDP per Capita"
 MAPMODE_TSIN_GDP_PER_CAPITA: "#T $mapmode_tsin_gdp_per_capita_name$#!\n$mapmode_common_start$ [locations|e] by their owner's estimated GDP per capita against last year's highest in the world."
 TSIN_GDP_PER_CAPITA_MAPMODE_TT: "Owner's estimated GDP per capita [ROOT.ScriptValue('tsin_location_gdp_per_capita')|2] ([ROOT.ScriptValue('tsin_location_gdp_pc_factor')|%0] of the world's highest)"
 LEGEND_KEY_TSIN_HIGH_GDP_PER_CAPITA: "High"
 LEGEND_KEY_TSIN_LOW_GDP_PER_CAPITA: "Low"
 LEGEND_KEY_TSIN_NO_GDP_ESTIMATE: "No estimate"
 mapmode_tsin_corporations_name: "Corporations"
 MAPMODE_TSIN_CORPORATIONS: "#T $mapmode_tsin_corporations_name$#!\n$mapmode_common_start$ [locations|e] by the headquarters and works of their owner's companies."
 TSIN_CORPORATIONS_MAPMODE_TT: "Building levels of the owner's companies [ROOT.ScriptValue('tsin_location_owner_company_levels')|0]"
 LEGEND_KEY_TSIN_COMPANY_HQ: "Company headquarters"
 LEGEND_KEY_TSIN_COMPANY_WORKS: "Company works"
 LEGEND_KEY_TSIN_NO_COMPANY: "No company"
 mapmode_tsin_agriculture_name: "Agricultural Revolution"
 MAPMODE_TSIN_AGRICULTURE: "#T $mapmode_tsin_agriculture_name$#!\n$mapmode_common_start$ [locations|e] by their owner's agricultural revolution stage and their market's food surplus."
 TSIN_AGRICULTURE_MAPMODE_TT: "Agricultural stage [ROOT.ScriptValue('tsin_location_owner_agriculture_stage')|0]/7, market food balance per pop [ROOT.ScriptValue('tsin_location_market_food_per_pop')|2]"
 LEGEND_KEY_TSIN_MECHANIZED_FARM: "$tsin_mechanized_farm$"
 LEGEND_KEY_TSIN_AGRICULTURE_ADVANCED: "Advanced agriculture"
 LEGEND_KEY_TSIN_AGRICULTURE_TRADITIONAL: "Traditional agriculture"
 LEGEND_KEY_TSIN_FOOD_DEFICIT: "Market food deficit"
