l_english:
 tsin_oil_storage: "Oil reserve tanks"
 tsin_oil_storage_maintenance: "Oil reserve tanks maintenance"
 tsin_oil_storage_desc: "Zero jobs. Capacity 100 per level; physical transactions up to 10 per month. Configure a good and automation in TSIN management. No commodity production method duplicates reserves."
