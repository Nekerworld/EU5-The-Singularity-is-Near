l_english:
 TSIN_NEWS_LINE_0_31: "#T [ROOT.ScriptValue('tsin_news_0_year')|0].[ROOT.ScriptValue('tsin_news_0_month')|0] — Chemical works spill#!\nA long-neglected chemical works has reported a spill. Safety work and soil remediation are under consideration."
 TSIN_NEWS_LINE_0_22: "#T [ROOT.ScriptValue('tsin_news_0_year')|0].[ROOT.ScriptValue('tsin_news_0_month')|0] — Petition over polluted water#!\nResidents have petitioned over persistent water pollution. The authorities are considering temporary purification and long-term investment."
 TSIN_NEWS_LINE_0_10: "#T [ROOT.ScriptValue('tsin_news_0_year')|0].[ROOT.ScriptValue('tsin_news_0_month')|0] — Participation in international standards#!\nThe government has chosen a standard in one field of measures, railways, industrial parts or electrical equipment. Independent choices in other fields remain possible."
 TSIN_NEWS_LINE_0_20: "#T [ROOT.ScriptValue('tsin_news_0_year')|0].[ROOT.ScriptValue('tsin_news_0_month')|0] — Petition beneath the chimneys#!\nResidents of an industrial town have petitioned the authorities after years of smoke exposure. Debate continues over support for emission filters."
 TSIN_NEWS_LINE_0_21: "#T [ROOT.ScriptValue('tsin_news_0_year')|0].[ROOT.ScriptValue('tsin_news_0_month')|0] — Cholera outbreak reported#!\nA city has reported a cholera outbreak. Public health authorities are responding to infection and sanitation needs."
 TSIN_NEWS_LINE_0_30: "#T [ROOT.ScriptValue('tsin_news_0_year')|0].[ROOT.ScriptValue('tsin_news_0_month')|0] — District maintenance support paid#!\nThe treasury has funded maintenance in an industrial district. Keeping equipment in working order is distinct from investing in newer technology."
 TSIN_NEWS_LINE_0_40: "#T [ROOT.ScriptValue('tsin_news_0_year')|0].[ROOT.ScriptValue('tsin_news_0_month')|0] — Corporate interest arrears persist#!\nInterest arrears on corporate credit or bonds have continued for at least half a year. Financial institutions are watching liquidity and repayment capacity."
