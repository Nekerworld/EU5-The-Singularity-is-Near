 MAPMODE_TSIN_INDUSTRIALIZATION: "#T $mapmode_tsin_industrialization_name$#!\n공장 단계 [buildings|e]이 고용할 수 있는 인원이 각 [location|e] 인구에서 차지하는 비중에 따라 [locations|e]을 색상으로 표시합니다. 25% 이상이면 가장 진한 색입니다."
 LEGEND_KEY_TSIN_INDUSTRIAL_SHARE_HIGH: "공장 일자리 25% 이상"
 LEGEND_KEY_TSIN_INDUSTRIAL_SHARE_LOW: "공장 일자리 소수"
 LEGEND_KEY_TSIN_NO_FACTORIES: "공장 없음"
 TSIN_INDUSTRIALIZATION_MAPMODE_TT: "[ROOT.GetLocation.GetName]의 공장 일자리는 인구의 [ROOT.ScriptValue('tsin_location_industrial_share')|%0]입니다. (공장 단계 [buildings|e] 레벨 [ROOT.ScriptValue('tsin_location_mill_levels')|Y0])"
 TSIN_INDUSTRIALIZATION_NONE_MAPMODE_TT: "[ROOT.GetLocation.GetName]에는 공장 단계 [buildings|e]이 없습니다."

 tsin_machinery: "기계 공업"
 tsin_machinery_desc: "증기기관과 그 부품을 만드는 공업입니다. [tsin_factories_concept|e], 기선, [tsin_railways_concept|e]가 모두 이 산업의 생산물에 기대고 있습니다."

 tsin_machine_works_advance: "기계 공장"
 tsin_machine_works_advance_desc: "$tsin_machine_works_desc$"
 tsin_steel_frame_engines_advance: "강철 틀 기관"
 tsin_steel_frame_engines_advance_desc: "주철 대신 강철로 기관의 틀을 짜면 더 높은 압력을 견디는 가볍고 튼튼한 기관을 만들 수 있습니다. $tsin_machine_works$에서 $tsin_machine_works_steel_frame$ 방식을 쓸 수 있게 됩니다."
 tsin_mechanized_textile_mill_advance: "기계화 방직 공장"
 tsin_mechanized_textile_mill_advance_desc: "$tsin_mechanized_textile_mill_desc$"
