l_korean:
 tsin_engines: "기관"
 tsin_engines_desc: "증기기관과 그 부품은 공장, 기선, 기관차를 움직이는 [tsin_industrial_economy_concept|e]의 심장입니다. 철이나 강철 틀에 정밀하게 깎은 구리 부속을 맞추어야 하므로, 숙련된 기계 공장만이 이를 만들어 낼 수 있습니다."

 MODIFIER_TYPE_NAME_can_extract_tsin_engines: "기관 생산 가능"
 MODIFIER_TYPE_DESC_can_extract_tsin_engines: "[location|e]에서 [rgo|e]를 통해 [ShowGoodsName('tsin_engines')]을 획득할 수 있게 됩니다."
 MODIFIER_TYPE_NAME_ban_exports_of_tsin_engines: "$tsin_engines$ 수출 금지"
 MODIFIER_TYPE_DESC_ban_exports_of_tsin_engines: "[country|e] 소유의 모든 [markets|e]에서 [ShowGoodsName('tsin_engines')] [export|e]을 막습니다."
 MODIFIER_TYPE_NAME_ban_imports_of_tsin_engines: "$tsin_engines$ 수입 금지"
 MODIFIER_TYPE_DESC_ban_imports_of_tsin_engines: "[country|e] 소유의 모든 [markets|e]에서 [ShowGoodsName('tsin_engines')] [import|e]을 막습니다."
 MODIFIER_TYPE_NAME_local_tsin_engines_output_modifier: "현지 $tsin_engines$ 생산량"
 MODIFIER_TYPE_DESC_local_tsin_engines_output_modifier: "이 [location|e]의 [ShowGoodsName('tsin_engines')] [output|e]을 조정합니다."
 MODIFIER_TYPE_NAME_local_tsin_engines_establishment_speed: "현지 $tsin_engines$ 생산 건물 정착 속도"
 MODIFIER_TYPE_DESC_local_tsin_engines_establishment_speed: "이 [location|e]에 새로 건설된 [ShowGoodsName('tsin_engines')] 생산 [buildings|e]이 최대 [production_efficiency|e]에 도달하는 속도입니다."
 MODIFIER_TYPE_NAME_global_tsin_engines_output_modifier: "$tsin_engines$ 생산량"
 MODIFIER_TYPE_DESC_global_tsin_engines_output_modifier: "[country|e] 전체의 [ShowGoodsName('tsin_engines')] [output|e]을 조정합니다."
 MODIFIER_TYPE_NAME_global_tsin_engines_establishment_speed: "$tsin_engines$ 생산 건물 정착 속도"
 MODIFIER_TYPE_DESC_global_tsin_engines_establishment_speed: "[country|e] 전체에서 새로 건설된 [ShowGoodsName('tsin_engines')] 생산 [buildings|e]이 최대 [production_efficiency|e]에 도달하는 속도입니다."
 MODIFIER_TYPE_NAME_global_tsin_engines_pop_demand: "전역 [ShowGoodsNameWithNoTooltip('tsin_engines')] 수요"
 MODIFIER_TYPE_DESC_global_tsin_engines_pop_demand: "[ShowGoodsName('tsin_engines')] [produced_good|e]에 대한 [pop_needs|e]를 조정합니다."
 MODIFIER_TYPE_NAME_tsin_engines_impacts_inflation: "기관 인플레이션 영향치"
 MODIFIER_TYPE_DESC_tsin_engines_impacts_inflation: "[ShowGoodsName('tsin_engines')] 생산이 [country|e]의 [inflation|e]에 기여하는 정도를 결정합니다."
 MODIFIER_TYPE_NAME_tsin_engines_used_for_minting: "기관을 화폐로 사용"
 MODIFIER_TYPE_DESC_tsin_engines_used_for_minting: "[ShowGoodsName('tsin_engines')]이 해당 [country|e] 내에서 화폐로 사용되는지를 결정합니다."

 tsin_machine_works: "기계 공장"
 tsin_machine_works_desc: "선반과 증기 해머가 늘어선 $tsin_machine_works$에서는 노동자들이 철과 강철로 틀을 짜고 구리 부속을 맞추어 $tsin_engines$([tsin_new_goods_concept|e])을 조립합니다."
