 tsin_mechanized_textile_mill: "기계화 방직 공장"
 tsin_mechanized_textile_mill_desc: "증기 동력 역직기가 물레방아를 대신하면서, 더 적은 노동자로 훨씬 많은 $cloth$을 짜낼 수 있게 되었습니다. 기존 $textile_mill$을 개축하여 세웁니다([tsin_building_upgrades_concept|e])."
