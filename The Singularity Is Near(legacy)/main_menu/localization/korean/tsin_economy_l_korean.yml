 # 경제 이벤트
 tsin_economy.10.title: "공장 사고"
 tsin_economy.10.desc: "[SCOPE.sLocation('tsin_factory_location').GetName]의 공장에서 보일러가 터져 노동자 여럿이 죽거나 다쳤습니다. 공장 문 앞에는 유족과 동료들이 모여 대답을 요구하고 있습니다."
 tsin_economy.10.a: "유족에게 보상금을 지급한다."
 tsin_economy.10.b: "공장에 안전 규정을 강제한다."
 tsin_economy.10.c: "기계는 멈추지 않는다."
 tsin_economy.20.title: "원료 부족"
 tsin_economy.20.desc: "공장들이 쓰는 원료가 시장에서 바닥났습니다. 창고는 비어 가고, 공장주들은 생산을 줄이거나 값비싼 수입품에 기대야 할 처지라며 정부의 도움을 청합니다."
 tsin_economy.20.a: "값이 얼마든 해외에서 사들인다."
 tsin_economy.20.b: "공급이 회복될 때까지 생산을 줄인다."
 tsin_economy.20.c: "대체 원료를 시험해 보게 한다."
 tsin_economy.30.title: "숙련공 부족"
 tsin_economy.30.desc: "새 공장은 계속 들어서지만, 기계를 다루고 고칠 줄 아는 노동자는 턱없이 모자랍니다. 공장주들은 숙련공을 서로 빼 가느라 임금만 올리고 있습니다."
 tsin_economy.30.a: "기술 학교를 세운다."
 tsin_economy.30.b: "외국인 기술자를 초빙한다."
 tsin_economy.30.c: "도제 제도로 버틴다."
 tsin_economy.40.title: "공장 확장 제안"
 tsin_economy.40.desc: "[SCOPE.sLocation('tsin_factory_location').GetName]의 공장주들이 설비를 늘릴 계획을 들고 왔습니다. 국가가 자금을 대면 일이 빨라지겠지만, 민간 자본에 맡겨도 시민들은 반길 것입니다."
 tsin_economy.40.a: "국고에서 투자한다."
 tsin_economy.40.b: "민간 자본에 맡긴다."
 tsin_economy.40.c: "지금은 때가 아니다."

 # 개발용 결단
 tsin_debug_build_factories_decision.title: "(TSIN 디버그) 시험 공장 건설"
 tsin_debug_build_factories_decision.desc: "수도에 $tsin_machine_works$와 $textile_mill$을 즉시 세웁니다."
 tsin_debug_build_factories_decision.a: "건설"
 tsin_debug_upgrade_textile_decision.title: "(TSIN 디버그) 방직소 기계화"
 tsin_debug_upgrade_textile_decision.desc: "수도에 $tsin_mechanized_textile_mill$을 즉시 세웁니다. $textile_mill$이 있으면 개축 경로를 확인합니다."
 tsin_debug_upgrade_textile_decision.a: "기계화"
 tsin_debug_engines_shortage_decision.title: "(TSIN 디버그) 기관 품귀"
 tsin_debug_engines_shortage_decision.desc: "수도 시장의 $tsin_engines$ 공급을 크게 줄입니다."
 tsin_debug_engines_shortage_decision.a: "공급 감소"
 tsin_debug_engines_glut_decision.title: "(TSIN 디버그) 기관 과잉"
 tsin_debug_engines_glut_decision.desc: "수도 시장에 $tsin_engines$을 대량으로 풉니다."
 tsin_debug_engines_glut_decision.a: "공급 증가"
 tsin_debug_economy_events_a_decision.title: "(TSIN 디버그) 경제 이벤트 1"
 tsin_debug_economy_events_a_decision.desc: "공장 사고, 원료 부족 이벤트를 띄웁니다."
 tsin_debug_economy_events_a_decision.a: "실행"
 tsin_debug_economy_events_b_decision.title: "(TSIN 디버그) 경제 이벤트 2"
 tsin_debug_economy_events_b_decision.desc: "숙련공 부족, 공장 확장 제안 이벤트를 띄웁니다."
 tsin_debug_economy_events_b_decision.a: "실행"

 # 지도 모드
