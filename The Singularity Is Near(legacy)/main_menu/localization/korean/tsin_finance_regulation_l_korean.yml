 tsin_bank_supervision_law: "은행 감독"
 tsin_bank_supervision_law_desc: "은행 감독 제도를 정합니다."
 tsin_bank_customary_policy: "관행적 은행 감독"
 tsin_bank_customary_policy_desc: "신규 대출에 기존 20% 현금 준비 기준을 유지합니다."
 tsin_bank_free_policy: "자유 은행업"
 tsin_bank_free_policy_desc: "신규 대출 시 예금의 10% 현금 준비를 남깁니다."
 tsin_bank_prudential_policy: "건전성 감독"
 tsin_bank_prudential_policy_desc: "신규 대출에 예금 준비 30%와 유료 연간 감사를 요구합니다."
 tsin_bank_strict_policy: "엄격한 은행 감독"
 tsin_bank_strict_policy_desc: "신규 대출에 예금 준비 40%와 유료 연간 감사를 요구합니다."
 tsin_corporate_disclosure_law: "기업 정보 공개"
 tsin_corporate_disclosure_law_desc: "기업 정보 공개 제도를 정합니다."
 tsin_disclosure_customary_policy: "자율 공시"
 tsin_disclosure_customary_policy_desc: "신규 금융에 추가 감사 조건을 두지 않습니다."
 tsin_disclosure_audited_policy: "감사받은 의무 공시"
 tsin_disclosure_audited_policy_desc: "신규 신용·회사채·증자에 유료 연간 감사를 요구합니다. 기존 채권의 지급은 계속됩니다."
 tsin_finance_regulation.1.title: "예금 은행의 자본 결손"
 tsin_finance_regulation.1.desc: "은행의 장부 자산이 예금·준비금 대출 채무보다 적습니다. 단순 현금 부족과 다른 자본 결손입니다. 국고 보조금은 현재 결손과 거래 단위 한 번을 실제 국고에서 지급하며 국가 지분이나 상환 채권을 만들지 않습니다. 영업 정리는 신규 대출·예금을 중단하지만 기존 자산·채무·인출 청구권을 보존합니다. 이 사건만으로 세계 공황은 시작하지 않습니다."
 tsin_finance_regulation.1.a: "국고에서 결손 보조금을 지급한다"
 tsin_finance_regulation.1.b: "신규 영업을 중지하고 기존 채권을 정리한다"
 tsin_finance_regulation.1.c: "추가 조치 없이 장부를 계속 관찰한다"
 TSIN_BANK_AUDIT_VALID: "은행 감사: 유효 (유료 감사 후 12개월)"
 TSIN_BANK_AUDIT_MISSING: "은행 감사: 미완료 또는 만료"
 TSIN_FIRM_AUDIT_VALID: "기업 감사: 유효 (유료 감사 후 12개월)"
 TSIN_FIRM_AUDIT_MISSING: "기업 감사: 미완료 또는 만료"
