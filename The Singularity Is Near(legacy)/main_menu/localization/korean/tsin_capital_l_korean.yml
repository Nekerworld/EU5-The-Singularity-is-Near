 tsin_global_depression: "세계 대공황"
 tsin_global_depression_desc: "여러 독립 시장에서 지속된 상품 과잉공급·가격 폭락·금융 수축이 세계 위기로 전염되었습니다."
 tsin_global_depression_recovery: "시장 회복"
 tsin_global_depression_timeout: "침체의 소멸"
 TSIN_SYSTEMIC_GUIDE: "1900년 이후 산업·금융 국가 8곳 이상 중 5곳 이상, 독립 시장 3곳 이상이 필요합니다. 각 국가에서 수요 대비 공급 150%·기준가 65% 이하인 상품 2종 이상이 4분기 지속되어야 합니다. 최소 2년·최대 6년, 시작 간격은 최소 25년입니다."
 tsin_finance.1.title: "기업 버블의 국지적 붕괴"
 tsin_finance.1.desc: "기업 수가 영업 기반을 지속적으로 초과했거나 심한 과잉공급과 저가가 네 차례 연속 분기 관측되었습니다. 취약한 민간 기업이 정리되고 기업 가치가 재평가됩니다. 이 사건만으로 세계 위기가 전파되지는 않습니다."
 tsin_finance.1.a: "시장의 정리를 지켜본다."
