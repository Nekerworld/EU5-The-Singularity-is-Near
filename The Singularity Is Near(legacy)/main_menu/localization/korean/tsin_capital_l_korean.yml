l_korean:
 tsin_company_regime_law: "기업·자본시장 체제"
 tsin_company_regime_law_desc: "기업 진입과 민간 투자를 정합니다. 기존 산업 투자법은 별도로 유지됩니다."
 tsin_company_regime_law_CATEGORY: "사회경제"
 tsin_traditionalism_policy: "전통주의"
 tsin_traditionalism_policy_desc: "국가의 기업 설립·확장이 가능합니다. 기본 기업 한도 2개에 산업 시대의 추가 한도를 더합니다."
 tsin_mercantilism_policy: "중상주의"
 tsin_mercantilism_policy_desc: "국가의 기업 설립·확장이 가능합니다. 기본 기업 한도 3개에 산업 시대의 추가 한도를 더합니다."
 tsin_interventionism_policy: "간섭주의"
 tsin_interventionism_policy_desc: "국가의 기업 설립·확장이 가능합니다. 기본 기업 한도 5개에 산업 시대의 추가 한도를 더합니다."
 tsin_laissez_faire_policy: "자유방임주의"
 tsin_laissez_faire_policy_desc: "시민 계층의 자금으로 민간 기업이 자율적으로 진입합니다. 정책상 기업 수 상한은 없으며, 영업 기반을 지속적으로 넘는 과잉 진입은 버블을 일으킬 수 있습니다."
 tsin_state_capitalism_policy: "국가자본주의"
 tsin_state_capitalism_policy_desc: "국가의 기업 설립·확장이 가능합니다. 기본 기업 한도 7개에 산업 시대의 추가 한도를 더합니다."
 STATIC_MODIFIER_NAME_tsin_company_merchant_house: "무역 상단"
 STATIC_MODIFIER_DESC_tsin_company_merchant_house: "상단·기업 조직을 공용 자본시장 체계로 나타냅니다. 일반 업종에는 여러 민간 기업이 속할 수 있으며 역사적 고유 기업은 국가마다 하나입니다."
 tsin_found_merchant_house_company_decision.title: "무역 상단 설립·확장"
 tsin_found_merchant_house_company_decision.desc: "상단·기업 조직을 공용 자본시장 체계로 나타냅니다. 일반 업종에는 여러 민간 기업이 속할 수 있으며 역사적 고유 기업은 국가마다 하나입니다. 자유방임 이외의 체제에서 기업 한도와 비용 조건을 충족해야 합니다."
