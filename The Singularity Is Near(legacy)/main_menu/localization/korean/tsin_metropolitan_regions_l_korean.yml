 tsin_metro_bulk_3: "도시권 일괄 사업 3단계"
 tsin_metro_create_desc: "중심도시 10만 이상. 같은 국가의 도로 연결 지점만 최대 24곳까지 묶습니다. 지방 선택 시 조건에 맞는 지점만 편입됩니다. 연결은 분기별 또는 수동으로 재검사하며 실제 인구·식량·노동력을 공유하지 않습니다. 중심은 역할 하나를 고를 수 있고(시설 조건 필요), 역할 보너스는 중심 지점에만 적용됩니다. 일괄 사업은 지점마다 소유·기술·단계·자금을 다시 검사하고, 조건을 못 맞춘 지점은 건너뜁니다."
