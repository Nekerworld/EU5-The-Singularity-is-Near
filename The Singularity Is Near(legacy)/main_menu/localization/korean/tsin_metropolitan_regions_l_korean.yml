l_korean:
 tsin_metro_create: "도시권 중심 지정"
 tsin_metro_expand: "도시권에 지방 편입"
 tsin_metro_leave: "지점을 도시권에서 제외"
 tsin_metro_review: "도시권 연결 재검사"
