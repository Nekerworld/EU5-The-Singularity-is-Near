l_korean:
 game_concept_tsin_mass_politics_concept: "대중 정치와 금융"
 game_concept_tsin_mass_politics_concept_desc: "$age_format_age_7_industrialization$에는 정치가 궁정을 벗어납니다. [country|e]가 [ShowInstitutionName('tsin_mass_society')] 제도를 수용하면 [estates|e]과 대중의 [tsin_movements_concept|e], [parliament|e]가 시대의 큰 문제를 두고 맞서고, 기업과 증권 거래소는 독자적인 세력이 됩니다.\n\n법과 정부:\n$BULLET$[tsin_social_laws_concept|e]: 노동, 복지, 조세, 결사, 토지, 교회, 산업, 트러스트, 화폐, 노예무역에 관한 새 [laws|e] 11개입니다.\n$BULLET$[tsin_bills_concept|e]: 의회가 있으면 이 법률은 법안으로만 바뀝니다.\n$BULLET$[tsin_bill_readings_concept|e]: 법안 심의의 성패를 가르는 요인, 논쟁 이벤트, 입법 회기입니다.\n$BULLET$[tsin_industrial_agendas_concept|e]: 계층이 의회에서 내거는 요구입니다.\n$BULLET$[tsin_abolition_concept|e]: 노예무역 금지에서 노예 해방까지입니다.\n$BULLET$[tsin_government_reforms_concept|e]: 이 시대의 [government_reforms|e] 6개입니다.\n\n돈과 기업:\n$BULLET$[tsin_gold_standard_concept|e]: 안정된 화폐와 디플레이션 사이의 선택입니다.\n$BULLET$[tsin_corporations_concept|e]: [decision|e]으로 세우는 거대 기업입니다.\n$BULLET$[tsin_company_charters_concept|e]: 독점, 투자, 산업 확장, 식민 특허장입니다.\n$BULLET$[tsin_chairman_concept|e]: 기업을 이끄는 인물과 그의 야심입니다.\n$BULLET$[tsin_trusts_concept|e]: 거대 결합을 묵인할지 해체할지 정합니다.\n$BULLET$[tsin_stock_index_concept|e]: 주가, 투기 과열, 폭락입니다.\n$BULLET$[tsin_estimated_gdp_concept|e]: 경제의 크기와 성장입니다."
 game_concept_tsin_social_laws_concept: "산업 시대의 법률"
 game_concept_tsin_social_laws_concept_desc: "산업 시대에는 사회경제 [laws|e] 11개가 더해집니다. 법률마다 이 시대의 [advance|e]으로 열리며, [policy|e]마다 만족하는 [estates|e]과 불만을 품는 계층이 있습니다. 대부분의 정책은 [societal_values|e]도 천천히 움직이고, 일부 정책은 발전이 더 필요합니다. 필요한 발전은 정책 툴팁에 나옵니다.\n\n$BULLET$[ShowLawName('tsin_labor_law')]([ShowAdvanceName('tsin_labor_movement_advance')]): $tsin_unregulated_labor_policy$ 정책은 [production_efficiency|e]을 높입니다. $tsin_factory_acts_policy$ 정책과 $tsin_labor_protection_policy$ 정책은 노동자를 보호하고 $peasants_estate$ 계층을 만족시키지만 효율이 조금 떨어집니다.\n$BULLET$[ShowLawName('tsin_welfare_law')]([ShowAdvanceName('tsin_social_insurance_advance')]): $tsin_charity_relief_policy$, $tsin_poor_law_policy$, $tsin_social_insurance_policy$ 가운데 고릅니다. 세금으로 구호하면 세금 효율이 내려가지만 기대 수명이 늘어납니다.\n$BULLET$[ShowLawName('tsin_taxation_law')]([ShowAdvanceName('tsin_mass_society_advance')]): $tsin_indirect_taxation_policy$, $tsin_income_tax_policy$, $tsin_progressive_taxation_policy$ 가운데 고릅니다. 직접세는 세금 효율을 높이지만 $burghers_estate$ 계층이 싫어합니다.\n$BULLET$[ShowLawName('tsin_assembly_law')]([ShowAdvanceName('tsin_mass_communication_advance')]): $tsin_assembly_banned_policy$ 정책은 $crown_estate$ 계층을 강하게 하고, $tsin_free_association_policy$ 정책은 왕족을 약하게 하며 평민과 도시민을 만족시킵니다.\n$BULLET$[ShowLawName('tsin_land_reform_law')]([ShowAdvanceName('tsin_mass_society_advance')]): $tsin_serfdom_retained_policy$ 정책은 $nobles_estate$ 계층을 만족시킵니다. $tsin_redemption_payments_policy$ 정책과 $tsin_full_emancipation_policy$ 정책은 농민을 풀어 도시로 이끌고, 완전 해방은 귀족의 [estate_power|e]을 깎습니다.\n$BULLET$[ShowLawName('tsin_church_state_law')]([ShowAdvanceName('tsin_universal_education_advance')]): $tsin_established_church_policy$, $tsin_concordat_policy$, $tsin_separation_of_church_and_state_policy$ 가운데 고릅니다. 뒤의 두 정책은 [literacy|e]을 높이고, 정교 분리는 성직자의 힘을 깎습니다.\n$BULLET$[ShowLawName('tsin_frontier_land_law')]([ShowAdvanceName('tsin_railway_network_advance')]): $tsin_crown_land_sales_policy$ 정책은 귀족을, $tsin_homestead_policy$ 정책은 평민을 만족시키고 이주민을 끌어들입니다([tsin_frontier_concept|e]).\n$BULLET$[ShowLawName('tsin_industrial_investment_law')]([ShowAdvanceName('tsin_industrial_capitalism_advance')]): 공장을 누가 짓는지 정합니다. [tsin_industrial_investment_concept|e] 항목을 보십시오.\n$BULLET$[ShowLawName('tsin_trust_law')]([ShowAdvanceName('tsin_mass_politics_advance')]): [tsin_trusts_concept|e] 항목을 보십시오.\n$BULLET$[ShowLawName('tsin_monetary_standard_law')]([ShowAdvanceName('the_gold_standard')]): [tsin_gold_standard_concept|e] 항목을 보십시오.\n$BULLET$[ShowLawName('tsin_slave_trade_law')]([ShowAdvanceName('tsin_steam_age_advance')]): [tsin_abolition_concept|e] 항목을 보십시오.\n\n[ShowInstitutionName('tsin_mass_society')] 제도를 수용하고 [parliament|e]가 있는 나라에서는 이 11개 법률과 [ShowLawName('press_law')], [ShowLawName('education_masses_law')], [ShowLawName('immigration_law')], [ShowLawName('slavery_laws')]을 [tsin_bills_concept|e]으로만 바꿀 수 있습니다."
 game_concept_tsin_bills_concept: "법안"
 game_concept_tsin_bills_concept_desc: "법안은 근대 [parliament|e]가 법을 바꾸는 방법입니다. [country|e]가 $tsin_mass_society$ 제도를 수용하고 의회를 두고 있는 동안에는 [tsin_social_laws_concept|e]과 $press_law$, $education_masses_law$, $immigration_law$, $slavery_laws$의 [policies|e]을 법률 화면에서 바로 정할 수 없습니다. 정책 툴팁에 의회에서 법안으로 통과되어야 한다고 나옵니다.\n\n정책을 바꾸려면 [decision|e] \"$tsin_propose_bill_decision$\"을 쓰고, 법 분야를 고른 뒤 지금 시행할 수 있는 정책 하나를 고릅니다. 의회에는 한 번에 법안 하나만 걸 수 있습니다.\n\n법안은 3개월마다 심의를 거치며, 심의마다 성공하거나 정체합니다. 성공이 3번 쌓이면 법안이 통과되어 정책이 곧바로 시행되고, 정체가 3번 쌓이면 법안이 폐기됩니다. 심의의 성패를 가르는 요인은 [tsin_bill_readings_concept|e] 항목에 있습니다. 결단 \"$tsin_withdraw_bill_decision$\"로 언제든 법안을 거둬들일 수 있으며, 이 결단에서 지금의 성공 확률도 볼 수 있습니다. 법안을 철회하거나 법안이 폐기되면 2년 동안 새 법안을 낼 수 없습니다.\n\n법안은 내각 밖에서도 나옵니다. 일부 [events|e]와 계층의 요구([tsin_industrial_agendas_concept|e])는 논쟁에서 유리한 상태로 법안을 상정하며, 이미 걸려 있던 법안을 대신합니다.\n\n게임 규칙 \"$rule_tsin_bill_system$\"을 끄거나 의회가 없으면 원래 게임처럼 정책을 바로 바꿉니다."
 game_concept_tsin_bill_readings_concept: "법안 심의와 논쟁"
 game_concept_tsin_bill_readings_concept_desc: "[tsin_bills_concept|e]의 심의는 매번 성공 확률로 판정합니다. 확률은 35%에서 시작하며 언제나 5%에서 85% 사이에 머뭅니다.\n$BULLET$법안의 [policy|e]을 선호하는 [estate|e]마다 그 [estate_power|e]의 40%를 더합니다. 같은 [law|e]의 다른 정책을 선호하는 계층마다 그 행사력의 30%를 뺍니다.\n$BULLET$대중의 압력([tsin_movements_concept|e])은 개혁 법안을 돕습니다. 노동 불만과 노동조합 운동은 노동·복지·결사 개혁을(최대 +20%), 노예제 폐지 운동은 노예무역 금지와 노예제 폐지를(최대 +20%), 자유주의 운동은 그 밖의 개혁을(최대 +15%) 밀어 줍니다. 반대 방향의 법안은 이 도움을 받지 못합니다.\n$BULLET$공화정은 +5%입니다.\n$BULLET$[legislative_efficiency|e]의 절반을 더합니다.\n$BULLET$논쟁 결과로 -30%에서 +30%까지 더합니다.\n\n통과도 폐기도 되지 않은 심의 뒤에는 25% 확률로 논쟁 [event|e]가 일어납니다.\n$BULLET$위원회 수정안: 받아들이거나(+15%, [political_influence|e] 소모) 거부합니다(-5%).\n$BULLET$당론 강행: 의원들을 단속하거나(+20%, [stability|e] 감소) 자유 투표에 맡깁니다.\n$BULLET$여론전: 돈을 들여 선전하거나(+10%, [gold|e] 소모) 거리 정치에서 물러섭니다.\n$BULLET$철회 요구: 법안을 철회하거나(안정도가 조금 오르지만 2년 동안 법안을 낼 수 없음) 유지합니다(-10%).\n\n법안이 걸린 채 의회가 열리면 [parliament_issue|e] \"$tsin_legislative_session$\"을 고를 수 있습니다. 이 쟁점이 통과되면 법안은 심의 성공 1회와 논쟁 +10%를 얻고, 실패하면 논쟁 -10%를 받습니다."
 game_concept_tsin_industrial_agendas_concept: "산업 시대의 의회 안건"
 game_concept_tsin_industrial_agendas_concept_desc: "산업 시대에는 [estates|e]이 [parliament|e]에 새 요구를 [parliament_agenda|e]으로 내겁니다. \"법안\"이라고 적힌 안건은 법을 바로 바꾸지 않고, 논쟁 +25%를 안고 [tsin_bills_concept|e]을 상정합니다.\n\n$BULLET$$pa_tsin_repeal_corn_laws$($burghers_estate$): 곡물 관세를 없애 최대 관세를 낮추고 사람들을 도시로 끌어들입니다. 도시민은 만족하고 귀족은 불만을 품습니다.\n$BULLET$$pa_tsin_protect_grain$($nobles_estate$): 그 반대입니다.\n$BULLET$$pa_tsin_abolish_slavery$($clergy_estate$, 노예제 폐지 운동 50 이상): 노예제 폐지 법안입니다. [tsin_abolition_concept|e] 항목을 보십시오.\n$BULLET$$pa_tsin_factory_acts$($peasants_estate$, $tsin_unregulated_labor_policy$ 정책일 때): $tsin_factory_acts_policy$ 법안입니다.\n$BULLET$$pa_tsin_restore_landlord_rights$($nobles_estate$, $tsin_redemption_payments_policy$ 정책일 때): $tsin_serfdom_retained_policy$ 법안입니다.\n$BULLET$$pa_tsin_restore_concordat$($clergy_estate$, $tsin_separation_of_church_and_state_policy$ 정책일 때): $tsin_concordat_policy$ 법안입니다.\n$BULLET$$pa_tsin_freedom_of_association$($burghers_estate$, 자유주의 운동 50 이상): $tsin_free_association_policy$ 법안입니다. 자유주의 운동이 20 줄어듭니다.\n$BULLET$$pa_tsin_social_insurance$($peasants_estate$, 사회주의나 노동조합 운동이 강할 때): $tsin_social_insurance_policy$ 법안입니다. 사회주의 운동이 20 줄어듭니다.\n$BULLET$$pa_tsin_railway_charters$($burghers_estate$): 10년 동안 철도 건설비가 내려갑니다. $tsin_railway_nationalization$ 개혁 아래에서는 나오지 않습니다.\n$BULLET$$pa_tsin_factory_inspection$($peasants_estate$, 노동 불만 30 이상): 노동 불만이 10 줄어듭니다.\n$BULLET$$pa_tsin_ten_hour_day$($peasants_estate$, $tsin_union_recognition$ 특권과 노동 불만 40 이상): 노동 불만이 15 줄어들고, 노동자는 더 오래 살지만 생산은 줄어듭니다.\n\n이 요구 뒤에 있는 운동과 노동 불만은 [tsin_movements_concept|e] 항목과 [tsin_labor_conditions_concept|e] 항목을 보십시오."
 game_concept_tsin_abolition_concept: "노예제 폐지"
 game_concept_tsin_abolition_concept_desc: "산업 시대에 노예제([slavery|e])는 두 단계로 끝납니다. 먼저 무역을, 다음으로 노예제 자체를 없앱니다.\n$BULLET$[ShowLawName('tsin_slave_trade_law')]: [ShowAdvanceName('tsin_steam_age_advance')] 발전으로 열립니다. $tsin_slave_trade_suppressed_policy$ 정책은 노예 수출입을 막지만, 이미 노예인 사람은 그대로 남습니다. 노예제가 폐지되면 이 법률은 사라집니다.\n$BULLET$원래 게임의 [ShowLawName('slavery_laws')]: $slavery_outlawed$ 정책이 노예제 자체를 끝냅니다.\n의회가 있는 대중사회에서는 두 단계 모두 [tsin_bills_concept|e]으로 이루어집니다.\n\n노예제 폐지 운동(0~100)은 [tsin_movements_concept|e] 가운데 하나로, 노예제가 남아 있는 동안 해마다 자랍니다. 대중사회, 대중 통신, 자유 언론, 노예무역 금지, 인도주의 쪽 [societal_values|e]이 성장을 빠르게 하고, 노예가 인구의 10%를 넘거나 폐지론자를 탄압하면 느려집니다. 운동이 강할수록 폐지 법안의 성공 확률이 오릅니다.\n$BULLET$40에 이르면 폐지론자의 청원이 들어옵니다. 청원인을 맞이하거나(운동 +10), 노예무역 금지 법안을 내거나, 선동가를 침묵시킵니다(운동 -20, $STATIC_MODIFIER_NAME_tsin_abolitionists_suppressed$, [stability|e] 감소).\n$BULLET$50에 이르면 성직자 계층이 [parliament|e]에 $pa_tsin_abolish_slavery$ 안건을 낼 수 있습니다. 노예 지역과 자유 지역으로 갈린 노예제 공화국에는 [tsin_secession_crisis_concept|e]가 닥칠 수 있습니다.\n\n노예제를 폐지해도 노예를 실제로 풀어 주는 일이 남습니다. 노예 해방 이벤트에서 방법을 고릅니다. 즉시 해방하면 모든 노예 [pop|e]이 농민이 되지만 $STATIC_MODIFIER_NAME_tsin_emancipation_shock$로 한동안 생산이 줄고, 소유주에게 보상하면 [gold|e]가 들며, 6년의 $STATIC_MODIFIER_NAME_tsin_apprenticeship_system$을 거친 뒤 해방할 수도 있습니다. 노예무역을 금지했는데 해안에 노예 요새가 남아 있으면 이를 처리할지 묻는 이벤트가 나옵니다."
 game_concept_tsin_government_reforms_concept: "산업 시대의 정부 개혁"
 game_concept_tsin_government_reforms_concept_desc: "산업 시대에는 [government_reforms|e] 6개가 더해집니다. 이전 시대의 개혁처럼 현재 [age|e]의 열에 나오며, 대부분 [advance|e]이 필요합니다.\n\n$BULLET$$tsin_factory_inspectorate$([ShowAdvanceName('tsin_labor_movement_advance')]): 평민을 만족시키고 노동자의 [literacy|e]을 높이지만 [production_efficiency|e]이 조금 떨어집니다.\n$BULLET$$tsin_civil_service_examinations$([ShowAdvanceName('tsin_universal_education_advance')]): [cabinet|e] 효율과 [control|e]가 오르고, 귀족이 싫어합니다.\n$BULLET$$tsin_universal_conscription$: [manpower|e]이 늘고 보충이 빨라지며, 평민이 싫어합니다.\n$BULLET$$tsin_railway_nationalization$([ShowAdvanceName('tsin_railway_network_advance')]): 철도가 싸집니다. 도시민이 싫어하며 철도 회사 특허를 더는 요구하지 않습니다.\n$BULLET$$tsin_national_statistics_bureau$([ShowAdvanceName('tsin_statistical_bureau')]): 정책 변경이 싸지고, 내각 효율과 지배가 오르며, 경제 보고서가 자세해집니다([tsin_estimated_gdp_concept|e]).\n$BULLET$$tsin_national_laboratory$([ShowAdvanceName('tsin_experimental_science_advance')]): 연구와 제도 확산이 빨라지고 고등교육 목표가 오릅니다([tsin_education_ladder_concept|e]). 성직자가 싫어합니다.\n\n대부분의 개혁은 [societal_values|e]도 움직입니다. 공장 감독관은 공동체주의 쪽으로, 공무원 시험제와 철도 국유화는 중앙 집권 쪽으로, 국민 개병제는 양 쪽으로 움직입니다."
 game_concept_tsin_gold_standard_concept: "금본위제"
 game_concept_tsin_gold_standard_concept_desc: "[ShowAdvanceName('the_gold_standard')] [advance|e]을 연구하면 [ShowLawName('tsin_monetary_standard_law')] 법률로 화폐를 무엇에 묶을지 정합니다.\n$BULLET$$tsin_bimetallism_policy$(처음 정책): 매달 [inflation|e]이 조금 오르고, $peasants_estate$ 계층이 만족합니다.\n$BULLET$$tsin_gold_standard_policy$: 인플레이션이 매달 내려가고 대출 [interest|e]가 낮아지며 금 생산이 25% 늘어납니다. $burghers_estate$ 계층은 만족하지만 평민은 불만을 품습니다.\n\n금본위제 나라는 주가가 덜 흔들립니다. 분기마다 크게 움직이는 일이 드물어집니다([tsin_stock_index_concept|e]). 대가는 디플레이션입니다. [ShowSituationName('tsin_long_depression')]이 시작되면 금본위제 나라는 5년 동안 $STATIC_MODIFIER_NAME_tsin_gold_standard_deflation$을 받아 [production_efficiency|e]이 떨어지고 평민의 불만이 커집니다.\n\n의회가 있는 대중사회에서는 화폐 본위도 [tsin_bills_concept|e]으로만 바꿀 수 있으며, 분야 \"조세, 화폐, 결사\"에 들어 있습니다."
 game_concept_tsin_corporations_concept: "기업"
 game_concept_tsin_corporations_concept_desc: "기업은 [country|e]가 [decision|e]으로 세우는 거대 산업 회사입니다. 기업마다 해당 업종의 생산을 영구히 높이지만, [buildings|e] 유지비가 조금 오릅니다.\n$BULLET$제철([ShowAdvanceName('tsin_bessemer_process_advance')]): [ShowGoodsName('steel')], [ShowGoodsName('iron')]\n$BULLET$기계([ShowAdvanceName('tsin_machine_works_advance')]): [ShowGoodsName('tsin_engines')], [ShowGoodsName('tools')]\n$BULLET$방직([ShowAdvanceName('tsin_mechanized_textile_mill_advance')]): [ShowGoodsName('cloth')]\n$BULLET$화학([ShowAdvanceName('tsin_improved_fertilizer_advance')]): [ShowGoodsName('tsin_fertilizer')], [ShowGoodsName('tsin_explosives')]\n$BULLET$철도([ShowAdvanceName('tsin_railway_network_advance')]): 철도 건설비 감소, 도로 건설 시간 단축\n$BULLET$농기계([ShowAdvanceName('tsin_mechanical_reaper_advance')]): [ShowGoodsName('tsin_farm_machinery')], 약간의 [ShowGoodsName('wheat')]\n\n기업을 세우려면 [gold|e]가 들고, 동시에 둘 수 있는 기업 수는 적습니다. 기본 1개에 [ShowAdvanceName('tsin_stock_exchange_advance')] 발전, 혼합 투자나 민간 기업 주도 정책, 산업 확장 특허장이 각각 1개씩 더하고, 독점 금지법은 1개를 빼며, 1개 아래로는 줄지 않습니다. 설립 결단에 한도가 나옵니다.\n\n새 기업의 본사는 회사 건물이 가장 많은 [location|e]이 되고, 주가는 100에서 시작합니다. 첫 기업을 세우면 주식시장이 열려 주가([tsin_stock_index_concept|e]), [tsin_company_charters_concept|e], [tsin_chairman_concept|e]이 생깁니다. 결단 \"산업 회사 해산\"은 모든 기업을 없애며, 보너스와 유지비, 특허장도 함께 사라집니다.\n\n$mapmode_tsin_corporations_name$ 지도 모드는 본사와 기업 공장을 보여 줍니다."
 game_concept_tsin_company_charters_concept: "기업 특허장"
 game_concept_tsin_company_charters_concept_desc: "특허장은 국가가 [decision|e]으로 [tsin_corporations_concept|e]에 내주는 특권입니다. 특허장마다 [gold|e]가 들고, 회수할 때까지 유지됩니다. 독점·투자·산업 확장 특허장은 주식시장이 있어야 하며, 이 셋은 동시에 1개, [ShowAdvanceName('tsin_stock_exchange_advance')] 발전이 있으면 2개까지 둘 수 있습니다.\n$BULLET$독점 특허장: [production_efficiency|e]과 도시민의 힘이 오르고 주가가 10% 뜁니다. 평민의 만족은 떨어집니다. $tsin_antitrust_policy$ 아래에서는 쓸 수 없습니다.\n$BULLET$투자 특허장: 공장 건설이 빨라지고 대출 [interest|e]가 내려가며 주가가 오를 확률이 높아집니다.\n$BULLET$산업 확장 특허장(증권 거래소 필요): 기업을 1개 더 둘 수 있고 도시민의 힘이 오르지만, [buildings|e] 유지비가 조금 오릅니다.\n$BULLET$식민 특허 회사: [ShowSituationName('tsin_scramble_for_colonies')]에 참여하는 나라가 한도와 따로 쓸 수 있습니다. [colonial_charter|e] 비용과 식민지 유지비가 줄고 식민 이주가 늘지만, [stability|e]가 떨어집니다.\n\n결단 \"기업 특허장 회수\"는 독점·투자·산업 확장 특허장을 거둬들이며, 주가가 5% 내립니다. 기업을 해산하면 모든 특허장이 사라집니다."
 game_concept_tsin_chairman_concept: "기업 회장"
 game_concept_tsin_chairman_concept_desc: "[tsin_corporations_concept|e]이 있는 동안 이사회는 회장을 둡니다. 회장은 $burghers_estate$ 계층의 [character|e]입니다. 회장이 없거나 죽으면 이사회가 새 회장을 고르며, 그 선택을 인정하거나(도시민 만족) 국가 감독관을 앉힐 수 있습니다(안정도가 오르지만 도시민이 불만을 품고 주가가 5% 내림).\n\n회장의 [adm|e]은 시장을 움직입니다. 70 이상이면 주가가 오를 확률이, 50 미만이면 내릴 확률이 높아집니다([tsin_stock_index_concept|e]).\n\n회장은 해마다 다음 [events|e] 가운데 하나를 일으킬 수 있습니다.\n$BULLET$작위 요구(한 번): 작위를 주면 [prestige|e]이 오르고 도시민은 만족하지만 귀족은 싫어합니다. 거절할 수도 있습니다.\n$BULLET$기업의 차관: 지금 금화를 얻지만 $STATIC_MODIFIER_NAME_tsin_corporate_loan$으로 10년 동안 이자가 오릅니다.\n$BULLET$대학 강좌 기부(대학 필요): 20년 동안 $STATIC_MODIFIER_NAME_tsin_corporate_endowment$을 받아 도시민의 힘과 생산 효율이 오릅니다. 대신 그의 재산에 세금을 매길 수도 있습니다.\n$BULLET$뇌물 추문(주가 10% 하락): 기소하면 이사회가 새 회장을 고르고, 덮으면 5년 동안 $STATIC_MODIFIER_NAME_tsin_corporate_cover_up$을 받아 주가도 끌려 내려갑니다.\n$BULLET$의회 진출([parliament|e] 필요, 한 번): 20년 동안 $STATIC_MODIFIER_NAME_tsin_corporate_lobby$를 받거나, 기업을 정치에서 떼어 놓습니다."
 game_concept_tsin_trusts_concept: "트러스트와 독점 금지"
 game_concept_tsin_trusts_concept_desc: "거대 [tsin_corporations_concept|e] 몇 곳이 가격을 담합하고 경쟁자를 사들이면 트러스트가 됩니다. [ShowAdvanceName('tsin_mass_politics_advance')] 발전으로 열리는 [ShowLawName('tsin_trust_law')] 법률이 국가의 태도를 정합니다.\n$BULLET$$tsin_trusts_tolerated_policy$: [production_efficiency|e]이 조금 오르고 $burghers_estate$ 계층이 만족합니다.\n$BULLET$$tsin_antitrust_policy$: 평민은 만족하고 도시민은 불만을 품습니다. 둘 수 있는 기업이 1개 줄고, 노동 불만 목표가 3 내려가며([tsin_labor_conditions_concept|e]), 독점 특허장을 내줄 수 없습니다([tsin_company_charters_concept|e]).\n\n1880년부터 기업이 2개 이상이고 독점 금지법이 없는 나라에는 15년에 한 번까지 트러스트 문제 이벤트가 나옵니다. 트러스트를 해체하면 논쟁에서 유리한 독점 금지 법안이 상정되고([tsin_bills_concept|e]), 5년 동안 $STATIC_MODIFIER_NAME_tsin_trust_busting$을 받으며 노동 불만이 5 줄어듭니다. 기업 편을 들면 도시민은 만족하지만 노동 불만이 5, 사회주의 운동이 3 오릅니다."
 game_concept_tsin_stock_index_concept: "주가 종합지수"
 game_concept_tsin_stock_index_concept_desc: "[tsin_corporations_concept|e]마다 주가가 있습니다. 주가는 100에서 시작해 분기마다 움직이며, 10과 1000 사이에 머뭅니다. 오를지 내릴지는 먼저 수도 [market|e]에서 그 기업 [goods|e]의 [market_price|e]으로 정해집니다. 평소 가격보다 훨씬 비싸면 오르기 쉽고, 훨씬 싸면 내리기 쉽습니다.\n$BULLET$내림 요인: 금융 공황, [ShowSituationName('tsin_long_depression')], 최근의 폭락, 노동 불만 60 이상, 기업 비리 은폐, 행정 능력이 낮은 회장\n$BULLET$오름 요인: 고등교육률 20 이상, 투기 과열, 투자 특허장, 유능한 [tsin_chairman_concept|e]\n한 번에 3%에서 15%까지 움직이며, [tsin_gold_standard_concept|e] 아래에서는 크게 움직이는 일이 드뭅니다.\n\n종합지수는 기업 규모로 가중한 주가 평균이며, 최근 2년 평균과 비교됩니다.\n$BULLET$평균의 1.5배를 넘으면 투기 과열 이벤트가 나옵니다. 시장을 그대로 두면 2년 동안 $STATIC_MODIFIER_NAME_tsin_speculative_boom$을 받아 공장 건설이 빨라지고 [interest|e]가 내리며 주가가 오르기 쉬워집니다. 할인율을 올리면 주가가 10% 내리고 [stability|e]가 오릅니다.\n$BULLET$평균의 60% 아래로 떨어지거나 투기 과열 중에 운이 나쁘면 증시가 폭락합니다. 주가가 30% 내리고 3년 동안 $STATIC_MODIFIER_NAME_tsin_stock_crash$이 붙습니다. 은행을 구제하거나([gold|e] 소모), 약한 회사를 망하게 두거나(금융 공황), 거래소를 1년 동안 닫을(주가 정지) 수 있습니다. 어느 나라에서든 폭락이 일어나면 장기 불황이 일찍 올 수 있습니다.\n\n결단 \"증권 보고서\"는 기업별 주가, 종합지수와 2년 평균, 세계 지수(모든 나라 지수의 평균), 기업 가치 합계를 보여 줍니다."
 game_concept_tsin_estimated_gdp_concept: "추정 GDP"
 game_concept_tsin_estimated_gdp_concept_desc: "게임에는 GDP가 없으므로, 모드가 해마다 모든 [country|e]의 GDP를 추정합니다. 도시와 마을의 [tax_base|e], 교역·세금 [income|e], 인구의 자급 생산을 더하고, 중등·고등교육률에서 나오는 생산성 배율을 곱합니다([tsin_education_ladder_concept|e]). 두카트로 나타낸 대략적인 값이므로 나라끼리 비교하거나 추세를 볼 때 씁니다. 1인당 GDP와 지난해 대비 성장률도 함께 기록합니다.\n\n볼 수 있는 곳:\n$BULLET$$mapmode_tsin_gdp_per_capita_name$ 지도 모드는 나라마다 1인당 GDP를 지난해 세계 최고값과 견주어 칠합니다.\n$BULLET$[decision|e] \"경제 통계 보고\"는 첫 연간 추정 뒤에 쓸 수 있으며, GDP, 1인당 GDP, 성장률, 공장 노동자 비중, [tsin_stock_index_concept|e]를 보고합니다.\n$BULLET$$tsin_national_statistics_bureau$ 개혁([tsin_government_reforms_concept|e])이 있으면 보고서가 자세해져 인구, 생산성 배율, 교육 3단계, 노동 불만, 주가 지수 2년 평균, 세계 지수, 기업 가치가 더해집니다.\n$BULLET$게임 규칙 \"$rule_tsin_economy_log$\"을 켜면 플레이어, [great_powers|e], 주식시장이 있는 나라, 통계국을 둔 나라가 해마다 통계를 게임 로그에 남기며, tools/econ_report.py로 그래프를 그릴 수 있습니다."
