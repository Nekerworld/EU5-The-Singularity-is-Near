 TSIN_WCS_TITLE: "세계 기업 통계"
 TSIN_WCS_HELP: "조사 버튼만 세계 자료를 갱신합니다. 필터·정렬·페이지는 저장된 결과만 읽습니다. 기업 수는 선택한 유형, 현금은 국가 기업의 운영 자금(은행·연금 제외), 평가 지표는 국가 기업 부문 전체입니다. 평가 지표는 주가×영업 기반의 추정 단위이며 두캇이나 실제 시가총액이 아닙니다. 0년/—는 자료 없음입니다."
 tsin_survey_world_companies: "세계 기업 자료 조사"
 tsin_survey_world_companies_desc: "실재하는 기업 보유국의 기업 유형·수·기업 부문 현금과 마지막 평가 자료를 한 번 수집합니다. 자동 재조사는 하지 않습니다."
 TSIN_WCS_DATE: "조사: [GetPlayer.MakeScope.GetVariable('tsin_wcs_survey_year').GetValue|0].[GetPlayer.MakeScope.GetVariable('tsin_wcs_survey_month').GetValue|0]"
