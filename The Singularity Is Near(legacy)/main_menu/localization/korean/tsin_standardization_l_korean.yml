 tsin_standardization: "국제 표준화 논의"
 tsin_standardization_desc: "산업국들이 도량형·철도·부품·전기 설비의 호환을 논의합니다. 분야별 독자 규격도 유지할 수 있습니다."
 tsin_standards_host: "국제 표준화 회의 개최"
 tsin_standards_host_desc: "산업·교육·시장 접근 조건을 갖춘 3개국 이상이 필요합니다. 주최국은 공학 교육·공장 비중 10%·중등교육 20%를 갖추고 평화 상태여야 합니다. 비용 500두캇, 회의 3년, 세계 개최 간격 25년입니다."
 tsin_standards_agreement: "분야별 협약 성립"
 tsin_standards_no_agreement: "합의 없는 폐회"
 tsin_standards_participants_legend: "규격 선택 참가국"
 TSIN_STANDARDS_HELP: "0=미선택, 1=공통, 2=병용·호환, 3=독자 규격. 한 분야 선택은 다른 분야를 강제하지 않습니다. 회의 폐막도 세계 시설의 일괄 교체를 뜻하지 않습니다."
