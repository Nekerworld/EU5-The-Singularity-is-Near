l_korean:
 tsin_standards_measure_1: "도량형 — 공통 단위"
 tsin_standards_measure_1_desc: "이 분야만 선택하며 다른 규격은 바꾸지 않습니다. 선택 후 5년간 재변경할 수 없습니다. 기존 시설을 즉시 개궤·재건하거나 네이티브 운행을 금지하지 않습니다. 전기 효과는 설비 규격화의 생산 보정이며 별도 전력망 연결이 아닙니다."
