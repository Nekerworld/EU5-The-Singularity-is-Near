 TSIN_STATS_GDP_HELP: "TSIN이 계산한 연간 산출 추정치이며 국고 수입과 다릅니다. K=천, M=백만, B=십억, T=조. 막대 길이는 기록된 최댓값을 기준으로 비교합니다."
 TSIN_STATS_HISTORY_HELP: "최근 10개 연간 관측치를 오래된 순서로 표시합니다. 이번 수정 이후부터 기록하며 과거 값을 복원하지 않습니다. 기존 세이브는 다음 월간 갱신에 첫 표본을 기록합니다."
 TSIN_STATS_PANEL_HELP: "교육·산업·GDP·사회 통계는 연간 갱신됩니다. 교육률과 공장 일자리 비중은 %, 노동 불만은 0~100입니다. 인구당 GDP는 기존 모드의 인구 단위 공식을 따릅니다. 아직 집계되지 않은 값은 —로 표시합니다."
