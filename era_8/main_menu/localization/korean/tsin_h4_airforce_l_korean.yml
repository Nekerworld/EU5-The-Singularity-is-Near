l_korean:
 tsin_aircraft_industry_advance: "항공기 산업"
 tsin_aircraft_industry_advance_desc: "기체와 엔진의 양산 체제입니다. 항공기 공장을 해금하며 산출은 국가 항공기 풀에 쌓입니다."
 tsin_regional_airbase_advance: "지역 비행장"
 tsin_regional_airbase_advance_desc: "수도 밖의 비행장으로 보유할 수 있는 항공기 수를 늘립니다."
 tsin_anti_aircraft_advance: "대공포"
 tsin_anti_aircraft_advance_desc: "대공포와 탐조등이 지역을 지킵니다. 공격 항공기는 손실이 늘고 피해가 줄어듭니다."
 tsin_air_operations_advance: "항공 작전"
 tsin_air_operations_advance_desc: "공지 합동 계획입니다. 제공권·근접지원·전략 폭격·공수 보급 임무를 지방에 배정할 수 있습니다."
 tsin_airbase: "지역 비행장"
 tsin_airbase_desc: "단계마다 항공기 12대의 수용 한도와 연료 저장고가 늘어납니다. 엔진·석유·고무·도구가 필요합니다."
 tsin_airbase_maintenance: "지역 비행장 운영"
 tsin_airbase_maintenance_desc: "지역 비행장 유지입니다."
 tsin_anti_air_battery: "대공포대"
 tsin_anti_air_battery_desc: "이 지역 상공의 적 항공기는 손실이 늘고 피해가 줄어듭니다. 화포·폭약·강철·도구가 필요합니다."
 tsin_anti_air_battery_maintenance: "대공포대 운영"
 tsin_anti_air_battery_maintenance_desc: "대공포대 유지입니다."
 tsin_air_target_superiority: "항공 임무 지정: 제공권"
 tsin_air_target_superiority_desc: "아군 지방을 골라 제공권 임무를 배정합니다. 전시에 매월 해당 항공기 비축으로 수행합니다."
 tsin_air_target_cas: "항공 임무 지정: 근접항공지원"
 tsin_air_target_cas_desc: "적이 점령한 지방을 골라 근접항공지원 임무를 배정합니다. 전시에 매월 해당 항공기 비축으로 수행합니다."
 tsin_air_target_bombing: "항공 임무 지정: 전략 폭격"
 tsin_air_target_bombing_desc: "적이 점령한 지방을 골라 전략 폭격 임무를 배정합니다. 전시에 매월 해당 항공기 비축으로 수행합니다."
 tsin_air_target_supply: "항공 임무 지정: 공수 보급"
 tsin_air_target_supply_desc: "아군 지방을 골라 공수 보급 임무를 배정합니다. 전시에 매월 해당 항공기 비축으로 수행합니다."
 tsin_air_recall: "항공 임무 전체 회수"
 tsin_air_recall_desc: "배정한 모든 항공 임무 목표를 지웁니다."
 STATIC_MODIFIER_NAME_tsin_air_superiority_bonus: "제공권 우세"
 STATIC_MODIFIER_DESC_tsin_air_superiority_bonus: "아군 전투기가 이 군대 상공을 장악했습니다."
 STATIC_MODIFIER_NAME_tsin_air_inferiority_penalty: "제공권 열세"
 STATIC_MODIFIER_DESC_tsin_air_inferiority_penalty: "적 전투기가 이 군대 상공을 장악했습니다."
