l_korean:
 tsin_mass_production_arms_advance: "군수 대량생산"
 tsin_mass_production_arms_advance_desc: "표준 부품과 조립 라인으로 소화기·지원 화포 공장을 세웁니다. 전시에는 국가 장비 비축이 중요해집니다."
 tsin_armored_vehicle_industry_advance: "기갑 차량 산업"
 tsin_armored_vehicle_industry_advance_desc: "엔진·강철·석유 공급을 묶어 기갑 차량 공장을 세웁니다."
 tsin_small_arms_works: "소화기 공장"
 tsin_small_arms_works_desc: "소총·기관총·탄약을 대량 생산합니다. 매월 단계마다 국가 소화기 비축이 늘고 시장에 총기를 공급합니다."
 tsin_support_artillery_works: "지원 화포 공장"
 tsin_support_artillery_works_desc: "곡사포·박격포·로켓을 생산합니다. 매월 단계마다 국가 지원 화포 비축이 늘고 시장에 화포를 공급합니다."
 tsin_armored_vehicle_works: "기갑 차량 공장"
 tsin_armored_vehicle_works_desc: "전차·장갑차·트럭을 만듭니다. 매월 단계마다 국가 기갑 차량 비축이 늘고 석유를 소비합니다."
 tsin_aircraft_works: "항공기 공장"
 tsin_aircraft_works_desc: "기체와 엔진을 조립합니다. 매월 단계마다 국가 항공기 풀이 늘고 전투기·근접지원기·폭격기·수송기로 나뉩니다."
 STATIC_MODIFIER_NAME_tsin_eq_shortage_small_arms: "소화기 부족"
 STATIC_MODIFIER_DESC_tsin_eq_shortage_small_arms: "소화기 비축이 바닥났습니다. 보병의 전투력과 보충 속도가 떨어집니다."
 STATIC_MODIFIER_NAME_tsin_eq_shortage_support_artillery: "지원 화포 부족"
 STATIC_MODIFIER_DESC_tsin_eq_shortage_support_artillery: "지원 화포 비축이 바닥났습니다. 포탄과 교체 포신이 모자랍니다."
 STATIC_MODIFIER_NAME_tsin_eq_shortage_armored_vehicles: "기갑 차량 부족"
 STATIC_MODIFIER_DESC_tsin_eq_shortage_armored_vehicles: "기갑 차량 비축이 바닥났습니다. 예비 부품과 보충 차량이 없습니다."
 tsin_small_arms_works_rifle_line: "소총 라인"
