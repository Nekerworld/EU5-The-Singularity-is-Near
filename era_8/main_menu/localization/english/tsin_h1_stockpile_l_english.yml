l_english:
 tsin_mass_production_arms_advance: "Mass-production armament"
 tsin_mass_production_arms_advance_desc: "Standardized parts and assembly lines allow small arms and support artillery works. National equipment stockpiles start to matter in wartime."
 tsin_armored_vehicle_industry_advance: "Armored vehicle industry"
 tsin_armored_vehicle_industry_advance_desc: "Engine, steel and oil supplies are organized into an armored vehicle works."
 tsin_small_arms_works: "Small arms works"
 tsin_small_arms_works_desc: "Mass-produces rifles, machine guns and ammunition. Each level adds to the national small arms stockpile every month and sells firearms on the market."
 tsin_support_artillery_works: "Support artillery works"
 tsin_support_artillery_works_desc: "Produces howitzers, mortars and rockets. Each level adds to the national support artillery stockpile every month and sells cannons on the market."
 tsin_armored_vehicle_works: "Armored vehicle works"
 tsin_armored_vehicle_works_desc: "Builds tanks, armored cars and trucks. Each level adds to the national armored vehicle stockpile every month and burns oil."
 tsin_aircraft_works: "Aircraft works"
 tsin_aircraft_works_desc: "Assembles airframes and engines. Each level adds to the national aircraft pool every month, which is then split into fighters, close support, bombers and transports."
 STATIC_MODIFIER_NAME_tsin_eq_shortage_small_arms: "Small arms shortage"
 STATIC_MODIFIER_DESC_tsin_eq_shortage_small_arms: "The small arms stockpile is exhausted. Infantry fight and reinforce poorly."
 STATIC_MODIFIER_NAME_tsin_eq_shortage_support_artillery: "Support artillery shortage"
 STATIC_MODIFIER_DESC_tsin_eq_shortage_support_artillery: "The support artillery stockpile is exhausted. Guns lack shells and replacement barrels."
 STATIC_MODIFIER_NAME_tsin_eq_shortage_armored_vehicles: "Armored vehicle shortage"
 STATIC_MODIFIER_DESC_tsin_eq_shortage_armored_vehicles: "The armored vehicle stockpile is exhausted. Spare parts and replacements are missing."
