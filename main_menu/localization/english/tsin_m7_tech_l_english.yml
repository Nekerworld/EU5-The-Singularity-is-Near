l_english:

 tsin_system.4.title: "Specializations in the Age of Industry"
 tsin_system.4.desc: "In the Age of Industry every specialization's [advances|e] can be researched.\n\nThe advances of the specialization chosen at the start of the age are open at once. The other two open when the paired [institution|e] is embraced:\n- Administrative: embrace $tsin_mass_society$\n- Diplomatic: embrace $tsin_industrial_capitalism$\n- Military: embrace $tsin_electrification$\n\nMilitary advances and new units are open to every country regardless of specialization."
 tsin_system.4.a: "Understood."
 tsin_professional_bureaucracy_advance: "Professional Bureaucracy"
 tsin_professional_bureaucracy_advance_desc: "A permanent civil service, recruited by examination and promoted by seniority, takes over the business of the state."
 tsin_ministerial_government_advance: "Ministerial Government"
 tsin_ministerial_government_advance_desc: "A modern government of ministries, each answerable through its minister, can rule a larger realm."
 tsin_municipal_charters_advance: "Municipal Charters"
 tsin_municipal_charters_advance_desc: "Elected councils run their own streets, lighting and markets."
 tsin_steam_construction_advance: "Steam Construction"
 tsin_steam_construction_advance_desc: "Steam cranes and steam hammers change the pace of every building site."
 tsin_macadam_roads_advance: "Macadam Roads"
 tsin_macadam_roads_advance_desc: "Roads of compacted broken stone, laid in layers, hold up in any weather."
 tsin_anesthesia_advance: "Anesthesia"
 tsin_anesthesia_advance_desc: "Ether and chloroform let surgeons operate without haste."
 tsin_antiseptic_surgery_advance: "Antiseptic Surgery"
 tsin_antiseptic_surgery_advance_desc: "Washing hands and instruments in carbolic acid cuts deaths from post-operative infection."
 tsin_vaccination_campaigns_advance: "Vaccination Campaigns"
 tsin_vaccination_campaigns_advance_desc: "The state makes smallpox vaccination of children compulsory."
 tsin_quinine_prophylaxis_advance: "Quinine Prophylaxis"
 tsin_quinine_prophylaxis_advance_desc: "A daily dose of quinine shields soldiers and settlers from tropical malaria."
 tsin_steam_packet_diplomacy_advance: "Steam Packet Diplomacy"
 tsin_steam_packet_diplomacy_advance_desc: "Scheduled steam packets carry dispatches in weeks rather than months."
 tsin_gunboat_diplomacy_advance: "Gunboat Diplomacy"
 tsin_gunboat_diplomacy_advance_desc: "A single gunboat off a harbor works faster than a long negotiation."
 tsin_concert_of_powers_advance: "Concert of Powers"
 tsin_concert_of_powers_advance_desc: "The powers settle disputes in regular congresses and avoid a general war."
 tsin_international_law_advance: "International Law"
 tsin_international_law_advance_desc: "Treaties and custom are codified, and peace terms become easier to argue."
 tsin_informal_empire_advance: "Informal Empire"
 tsin_informal_empire_advance_desc: "Loans and commercial treaties bind other states without raising a flag."
 tsin_intelligence_service_advance: "Intelligence Service"
 tsin_intelligence_service_advance_desc: "A permanent intelligence bureau reads the wires and the papers and runs agents abroad."
 tsin_colonial_frontier_advance: "Colonial Frontier"
 tsin_colonial_frontier_advance_desc: "Steamships and quinine carry colonization deep into the interior."
 tsin_steam_merchant_marine_advance: "Steam Merchant Marine"
 tsin_steam_merchant_marine_advance_desc: "Scheduled steam freighters cross the sea regardless of the wind."
 tsin_limited_liability_advance: "Limited Liability"
 tsin_limited_liability_advance_desc: "Capping investors' losses at their stake pours money into factories and railways."
 tsin_commercial_banking_advance: "Commercial Banking"
 tsin_commercial_banking_advance_desc: "Banks that gather deposits and lend them to industry steady the currency."
 tsin_deep_coal_mining_advance: "Deep Coal Mining"
 tsin_deep_coal_mining_advance_desc: "Steam pumps and ventilation shafts reach deeper seams. The $tsin_blasting_works$ can be built to level 2 and use steam pumping."
 tsin_iron_ore_beneficiation_advance: "Iron Ore Beneficiation"
 tsin_iron_ore_beneficiation_advance_desc: "Crushing and sorting lean ore makes it fit for the furnace."
 tsin_synthetic_dyes_advance: "Synthetic Dyes"
 tsin_synthetic_dyes_advance_desc: "A mauve drawn from coal tar ends the age of plant dyes."
 tsin_vulcanization_advance: "Vulcanization"
 tsin_vulcanization_advance_desc: "Rubber cured with sulfur neither melts in summer nor cracks in winter."
 tsin_oil_refining_advance: "Oil Refining"
 tsin_oil_refining_advance_desc: "Distilling kerosene and lubricants turns petroleum into an industry."
 tsin_nation_state_advance: "The Nation State"
 tsin_nation_state_advance_desc: "One language, one school system and one flag bind the provinces into a nation."
 tsin_mass_politics_advance: "Mass Politics"
 tsin_mass_politics_advance_desc: "Parties, rallies and newspapers make politics the business of the many."
 tsin_citizenship_advance: "Citizenship"
 tsin_citizenship_advance_desc: "The state is made of citizens with rights and duties, not subjects."
 tsin_popular_press_advance: "The Popular Press"
 tsin_popular_press_advance_desc: "Penny papers selling in the hundreds of thousands shape opinion."
 tsin_national_census_advance: "National Census"
 tsin_national_census_advance_desc: "A state that counts every household also taxes it accurately."
 tsin_electrochemistry_advance: "Electrochemistry"
 tsin_electrochemistry_advance_desc: "Cheap current electrolyzes aluminium and chemical feedstocks."
 tsin_internal_combustion_advance: "Internal Combustion"
 tsin_internal_combustion_advance_desc: "A small engine that burns its fuel inside the cylinder goes where steam cannot."
 tsin_wireless_telegraphy_advance: "Wireless Telegraphy"
 tsin_wireless_telegraphy_advance_desc: "Radio waves reach fleets at sea without a cable."
 tsin_modern_tactics_advance: "Modern Tactics"
 tsin_modern_tactics_advance_desc: "Open order and fire from cover replace the dense column."
 tsin_railway_mobilization_advance: "Railway Mobilization"
 tsin_railway_mobilization_advance_desc: "Military trains on a timetable move army corps to the frontier in days."
 tsin_field_fortification_advance: "Field Fortification"
 tsin_field_fortification_advance_desc: "With rifles reaching farther, soldiers take up the spade and dig in."
 tsin_conscription_reserves_advance: "Conscript Reserves"
 tsin_conscription_reserves_advance_desc: "Men who finish their service stay on the reserve rolls and return in war."
 tsin_siege_engineering_advance: "Siege Engineering"
 tsin_siege_engineering_advance_desc: "Heavy guns brought by rail and trained sappers reduce fortresses methodically."
 tsin_assault_doctrine_advance: "Assault Doctrine"
 tsin_assault_doctrine_advance_desc: "Trained storming parties go in on the heels of the barrage."
 tsin_rifled_siege_guns_advance: "Rifled Siege Guns"
 tsin_rifled_siege_guns_advance_desc: "Rifled shells breach old walls in hours."
 tsin_naval_gunnery_advance: "Naval Gunnery"
 tsin_naval_gunnery_advance_desc: "Fire control and careful laying decide gunnery duels at long range."
 tsin_steam_repair_advance: "Steam Repair"
 tsin_steam_repair_advance_desc: "Shipboard workshops and repair ships mend the fleet at sea."
 tsin_military_medicine_advance: "Military Medicine"
 tsin_military_medicine_advance_desc: "Field hospitals and stretcher bearers save the wounded."
 tsin_lancers_advance: "Lancers"
 tsin_lancers_advance_desc: "Cavalry takes up the lance again and remains the shock arm. Allows recruiting $a_tsin_lancers$."
 tsin_railway_supply_corps_advance: "Railway Supply Corps"
 tsin_railway_supply_corps_advance_desc: "A specialist corps that lays and runs the lines keeps the army fed. Allows recruiting $a_tsin_railway_supply_corps$."
 tsin_maxim_gun_advance: "The Maxim Gun"
 tsin_maxim_gun_advance_desc: "A gun that reloads itself from its own recoil gives one crew the fire of a company. Allows recruiting $a_tsin_machine_gun_detachment$."
 tsin_smokeless_powder_advance: "Smokeless Powder"
 tsin_smokeless_powder_advance_desc: "Smokeless powder and the bolt-action rifle make the battlefield empty. Allows recruiting $a_tsin_bolt_action_infantry$."
 tsin_jaeger_advance: "Jägers"
 tsin_jaeger_advance_desc: "Elite light infantry drawn from hunters and highlanders fight with the ground. Allows recruiting $a_tsin_jaegers$."
 tsin_quick_firing_artillery_advance: "Quick-Firing Artillery"
 tsin_quick_firing_artillery_advance_desc: "A recoil mechanism keeps the gun on target between shots. Allows recruiting $a_tsin_quick_firing_battery$."
 tsin_steam_transport_advance: "Steam Transports"
 tsin_steam_transport_advance_desc: "Steam transports carry armies overseas without waiting for the wind. Allows building $n_tsin_steam_transport$."
 tsin_protected_cruiser_advance: "Protected Cruisers"
 tsin_protected_cruiser_advance_desc: "Fast cruisers with an armored deck over their engines rule the sea lanes. Allows building $n_tsin_protected_cruiser$."
 tsin_destroyer_advance: "Destroyers"
 tsin_destroyer_advance_desc: "Ships built to hunt torpedo boats carry torpedoes of their own. Allows building $n_tsin_destroyer$."
 tsin_pre_dreadnought_advance: "Pre-Dreadnought Battleships"
 tsin_pre_dreadnought_advance_desc: "Steel-armored battleships with turreted guns become the measure of a great navy. Allows building $n_tsin_pre_dreadnought$."
 a_tsin_lancers: "Lancers"
 a_tsin_lancers_desc: "Lancers with lance and sabre still pursue and charge in the age of the rifle."
 a_tsin_railway_supply_corps: "Railway Supply Corps"
 a_tsin_railway_supply_corps_desc: "Repairs track and runs trains to keep the army supplied."
 a_tsin_machine_gun_detachment: "Machine Gun Detachment"
 a_tsin_machine_gun_detachment_desc: "A few men with a machine gun put out the fire of a battalion."
 a_tsin_bolt_action_infantry: "Bolt-Action Infantry"
 a_tsin_bolt_action_infantry_desc: "Armed with smokeless bolt-action rifles, the backbone of the armies of the fin de siècle."
 a_tsin_jaegers: "Jägers"
 a_tsin_jaegers_desc: "Elite light infantry that break enemy flanks with cover and marksmanship."
 a_tsin_quick_firing_battery: "Quick-Firing Battery"
 a_tsin_quick_firing_battery_desc: "Fires ten rounds a minute and eats explosive shells."
 n_tsin_steam_transport: "Steam Transport"
 n_tsin_steam_transport_desc: "Burns coal to carry troops and horses overseas."
 n_tsin_protected_cruiser: "Protected Cruiser"
 n_tsin_protected_cruiser_desc: "Fast and long-ranged, its engines under an armored deck."
 n_tsin_destroyer: "Destroyer"
 n_tsin_destroyer_desc: "Screens the fleet from torpedo boats and launches torpedoes itself."
 n_tsin_pre_dreadnought: "Pre-Dreadnought"
 n_tsin_pre_dreadnought_desc: "Steel-armored with heavy turrets, the capital ship of the 1890s."
 tsin_constitutional_monarchy_advance: "Constitutional Monarchy"
 tsin_constitutional_monarchy_advance_desc: "The monarch reigns under a constitution and the cabinet answers to parliament."
 tsin_merit_civil_service_advance: "Merit Civil Service"
 tsin_merit_civil_service_advance_desc: "Officials are chosen by examination and merit instead of patronage."
 tsin_ultramontanism_advance: "Ultramontanism"
 tsin_ultramontanism_advance_desc: "Religious authority gathers across borders to a single center."
 tsin_steppe_modernization_advance: "Steppe Modernization"
 tsin_steppe_modernization_advance_desc: "Nomad rulers adopt rifles and the telegraph to hold the confederation together."
 tsin_social_catholicism_advance: "Social Catholicism"
 tsin_social_catholicism_advance_desc: "The Church speaks for a just wage and the workers' right to associate."
 tsin_catholic_revival_advance: "Catholic Revival"
 tsin_catholic_revival_advance_desc: "Pilgrimages, new orders and popular devotion revive the Church."
 tsin_social_gospel_advance: "The Social Gospel"
 tsin_social_gospel_advance_desc: "Churches open schools and dispensaries in the slums."
 tsin_higher_criticism_advance: "Higher Criticism"
 tsin_higher_criticism_advance_desc: "Reading scripture as a historical text stirs the universities."
 tsin_slavophile_revival_advance: "Slavophile Revival"
 tsin_slavophile_revival_advance_desc: "Orthodox tradition is rediscovered as the root of national culture."
 tsin_synodal_reform_advance: "Synodal Reform"
 tsin_synodal_reform_advance_desc: "Parish schools multiply and the training of clergy is reformed."
 tsin_islamic_modernism_advance: "Islamic Modernism"
 tsin_islamic_modernism_advance_desc: "Scholars argue that reason and science do not stand against the faith."
 tsin_pan_islamism_advance: "Pan-Islamism"
 tsin_pan_islamism_advance_desc: "A call for the unity of the Muslim world against imperialism."
 tsin_buddhist_revival_advance: "Buddhist Revival"
 tsin_buddhist_revival_advance_desc: "Temple schools and printed scripture open Buddhism to the people again."
 tsin_hindu_reform_movement_advance: "Hindu Reform Movement"
 tsin_hindu_reform_movement_advance_desc: "Reform societies lead changes in education and social custom."
 tsin_jewish_reform_movement_advance: "Jewish Reform Movement"
 tsin_jewish_reform_movement_advance_desc: "The learning of the Haskalah links the synagogue and the university."
 tsin_state_shinto_advance: "State Shinto"
 tsin_state_shinto_advance_desc: "The state makes shrine rites a ceremony of national unity."
 tsin_miaphysite_schools_advance: "Church School Revival"
 tsin_miaphysite_schools_advance_desc: "The ancient church opens schools and teaches the faithful to read."
 tsin_public_health_campaign: "Public Health Campaign"
 tsin_public_health_campaign_desc: "The cabinet sends sanitary inspectors to check wells, drains and vaccination. The AI favors it during a cholera pandemic."
 tsin_urban_renewal: "Urban Renewal"
 tsin_urban_renewal_desc: "Clears the slums of the chosen [province|e] for broad boulevards and sewers."
 tsin_public_health_campaign_action: "Public Health Campaign"
 tsin_public_health_campaign_active: "Running a Public Health Campaign"
 tsin_urban_renewal_action: "Urban Renewal in [SCOPE.sProvince('target').GetNameWithNoTooltip]"
 tsin_urban_renewal_select_province: "Select the [province|e] to renew:"
 tsin_urban_renewal_active: "Renewing [SCOPE.sProvince('target').GetNameWithHighlightOnly]"
 tsin_urban_renewal_no_provinces: "$no_valid_provinces$"
