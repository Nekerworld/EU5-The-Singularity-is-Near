l_english:
 game_concept_tsin_singularity_concept: "The Singularity is Near"
 game_concept_tsin_singularity_concept_desc: "The Singularity is Near carries the game past 1836 into a seventh [age|e], the $age_format_age_7_industrialization$, which begins in 1837. Without the mod the game ends on the last day of 1836; with it the game goes on until the end of 2337. Every system the mod adds has its own entry, and all of them can be reached from here.\n\nWhat changes in 1837:\n$BULLET$[tsin_age_of_industry_concept|e]: a new age with its own modifiers, pop demands and building prices.\n$BULLET$[tsin_industrial_institutions_concept|e]: three new [institutions|e], [ShowInstitutionName('tsin_industrial_capitalism')], [ShowInstitutionName('tsin_mass_society')] and [ShowInstitutionName('tsin_electrification')].\n$BULLET$[tsin_age7_advances_concept|e]: about 160 new [advances|e], and all three age focuses can be researched.\n$BULLET$[tsin_age7_military_concept|e]: reservists, rifles, ironclads and 17 new unit types.\n$BULLET$[tsin_time_compression_concept|e] and the [tsin_population_governor_concept|e]: more happens in each year, while world population is held to a historical curve.\n\nThe four areas of the mod:\n$BULLET$[tsin_industrial_economy_concept|e]: industrial goods, factories, electric power, automation, investment and the agricultural revolution.\n$BULLET$[tsin_industrial_society_concept|e]: political movements, the education ladder, labor conditions and life in the growing cities.\n$BULLET$[tsin_mass_politics_concept|e]: bills in parliament, corporations, the stock index and estimated GDP.\n$BULLET$[tsin_industrial_world_concept|e]: the situations of the age, the great powers and treaty ports.\n\nFirst steps:\n$BULLET$Read the notices at the start of the age. They tell you which focus advances are open now and which open later.\n$BULLET$Research [ShowAdvanceName('tsin_steam_age_advance')] first. It is the root of the whole tree and open to every country.\n$BULLET$Open the $mapmode_tsin_industrial_institutions_name$ map mode to see where the new institutions have appeared, and embrace them as early as you can.\n$BULLET$Research [ShowAdvanceName('tsin_reserve_system_advance')] so that your [levies|e] keep up with your neighbors.\n$BULLET$Build industry. [ShowAdvanceName('tsin_machine_works_advance')] unlocks the first factory of the age, and many old buildings can be upgraded ([tsin_replaced_buildings_concept|e]).\n$BULLET$Watch your country's [modifiers|e] for $STATIC_MODIFIER_NAME_tsin_industrial_acceleration_1$ and its higher tiers, which show how far industrialization has sped you up.\n\nAlso useful: [tsin_age6_continuity_concept|e] explains which content of the $age_format_age_6_revolutions$ carries on, [tsin_replaced_buildings_concept|e] lists which old buildings give way to new ones, [tsin_flavor_events_concept|e] describes the events of the mod, and [tsin_game_rules_concept|e] lists the options you can set when starting a game. The age also brings new [works_of_art|e] ($tsin_romantic_painting$, $tsin_photograph$, $tsin_opera$, $tsin_realist_novel$; see [tsin_culture_science_concept|e]) and three [expeditions|e]: $tsin_source_of_the_nile_expedition$, $tsin_northwest_passage_expedition$ and $tsin_polar_expedition$ ([tsin_expeditions_concept|e]). [tsin_map_modes_concept|e] and [tsin_hints_concept|e] help you find your way."

 game_concept_tsin_age_of_industry_concept: "Age of Industry"
 game_concept_tsin_age_of_industry_concept_desc: "The $age_format_age_7_industrialization$ is the seventh and last [age|e]. It begins in 1837, right after the $age_format_age_6_revolutions$, and no age follows it: the game stays in this age until 31 December 2337. Most of its historical content takes place between 1837 and 1900; after that its systems keep running.\n\nCompared with the Age of Revolutions, this age:\n$BULLET$speeds up change: research and construction +10%, pop [promotion|e] +20%, [migration|e] +25% and institution growth +20%, and population grows slightly faster (see [tsin_time_compression_concept|e]);\n$BULLET$doubles the expected army size and makes [mercenaries|e] scarcer;\n$BULLET$lets [goods|e] prices climb higher before they reach their cap;\n$BULLET$spreads exploration faster and lets burghers trade over longer distances;\n$BULLET$lowers [subject_loyalty|e] and raises the [antagonism|e] caused by different cultures and [societal_values|e];\n$BULLET$changes pop demand: more sugar, tea and coffee, a little less liquor than before, and new demand for coal, cloth and glass;\n$BULLET$has its own building price categories, $p_building_age_7_industrialization$ and $p_expensive_building_age_7_industrialization$.\n\n[hegemons|e] and [victory_cards|e] carry on as in the previous age, and building railroads now also takes coal and tools.\n\nWhen the age begins, the usual age event lets you choose your focus. The mod adds two notices: one introduces the new [institutions|e] ([tsin_industrial_institutions_concept|e]), the other explains which focus advances are open ([tsin_age7_advances_concept|e]). If the mod is added to a save that is already in this age, it sets itself up quietly within a year."

 game_concept_tsin_industrial_institutions_concept: "Industrial Institutions"
 game_concept_tsin_industrial_institutions_concept_desc: "The $age_format_age_7_industrialization$ has three [institutions|e] of its own. Like the vanilla ones, each appears in one [location|e], spreads across the map through neighbors, trade and [markets|e], and can be [embraced|e] once enough of a country's population lives where it is present. Embracing one opens its branch of [advances|e] and much of the mod's content, and gives one point of industrial acceleration ([tsin_time_compression_concept|e]).\n\n[ShowInstitutionName('tsin_industrial_capitalism')] can appear from 1840, in a location that already has [ShowInstitutionName('industrialization')], a textile, iron or steel mill, more than 20 [ShowPopTypeName('laborers')] and over 150 building levels, owned by a country leaning towards [ShowSocietyDirectionName('capital_economy')]. Its birthplace gains production efficiency and builds faster. Embracing it unlocks [ShowAdvanceName('tsin_industrial_capitalism_advance')], which brings the $tsin_industrial_investment_law$ law and the $tsin_encourage_industry$ cabinet action. It also opens the diplomatic focus advances, lets the country found a $tsin_customs_union$, and draws it into [ShowSituationName('tsin_long_depression')] and, for kingdoms and empires, [ShowSituationName('tsin_scramble_for_colonies')].\n\n[ShowInstitutionName('tsin_mass_society')] can appear from 1845, in a city that already has [ShowInstitutionName('enlightenment')], with literacy above 40 and more than 30 laborers. Its birthplace gains maximum literacy and faster promotion. Embracing it unlocks [ShowAdvanceName('tsin_mass_society_advance')], which brings the $tsin_taxation_law$ and $tsin_land_reform_law$ laws. It also opens the administrative focus advances, starts the [tsin_education_ladder_concept|e], makes [tsin_movements_concept|e] grow faster and, in countries with a parliament, sends policy changes through [tsin_bills_concept|e].\n\n[ShowInstitutionName('tsin_electrification')] can appear from 1870, in a location that has [ShowInstitutionName('tsin_industrial_capitalism')], a university, literacy above 50 and over 200 building levels, owned by a country leaning towards [ShowSocietyDirectionName('innovative')] that has researched [ShowAdvanceName('tsin_machine_tools_advance')]. Its birthplace builds much faster and grows in prosperity. Embracing it unlocks [ShowAdvanceName('tsin_electrification_advance')] (production efficiency, lower building upkeep) and opens the military focus advances. See also [tsin_electric_power_concept|e].\n\nThe vanilla institution spawn game rule still applies: with historical spawns the three appear in [ShowLocationName('manchester')], [ShowLocationName('paris')] and [ShowLocationName('berlin')] (Berlin not before 1875), and with random spawns in a random city that already has the preceding institution. The game rule $rule_tsin_electrification_timing$ can lift the 1870 limit ([tsin_game_rules_concept|e]).\n\nA notice tells you when each institution appears. The $mapmode_tsin_industrial_institutions_name$ map mode colors every location by the most advanced of the three present there. If an institution is slow to reach you, [ShowCabinetActionName('study_institutions')] helps as in vanilla."

 game_concept_tsin_age7_advances_concept: "Advances of the Age of Industry"
 game_concept_tsin_age7_advances_concept_desc: "The $age_format_age_7_industrialization$ has its own tree of about 160 [advances|e], researched like vanilla advances. No age follows it, so this is the last tree of the game.\n\nThe tree is built like the vanilla ones:\n$BULLET$The free tree starts at [ShowAdvanceName('tsin_steam_age_advance')], open to every country from 1837. It holds general advances for administration, construction, medicine and diplomacy, the first factory and upgrade unlocks, the start of the agricultural revolution, fort and supply limits, and the military tree.\n$BULLET$Each [institution|e] of the age has a branch whose root can only be researched after embracing it: [ShowAdvanceName('tsin_industrial_capitalism_advance')] (steel, machine tools, railways, chemicals, finance, automation), [ShowAdvanceName('tsin_mass_society_advance')] (cities, sanitation, schools and universities, labor, mass politics) and [ShowAdvanceName('tsin_electrification_advance')] (power stations, electric motors, telegraph and telephone, internal combustion). See [tsin_industrial_institutions_concept|e].\n$BULLET$30 focus advances, 10 each for administration, diplomacy and the military. Unlike in earlier ages, all three sets can be researched: the focus chosen at the start of the age is open at once, and the others open when you embrace the paired institution (administrative with [ShowInstitutionName('tsin_mass_society')], diplomatic with [ShowInstitutionName('tsin_industrial_capitalism')], military with [ShowInstitutionName('tsin_electrification')]). A notice at the start of the age repeats this.\n$BULLET$4 government type advances (monarchy, republic, theocracy and steppe horde) and 13 religious advances, shown only to countries of that government type or religion.\n\nMilitary advances and new units do not depend on the age focus; every country can research them ([tsin_age7_military_concept|e]).\n\nLate inventions such as quick-firing guns, pre-dreadnoughts or nitrogen fixation have no year condition. They sit behind long chains and require steel or electricity advances from other branches, so they come late on their own, and many need more than one institution. Even leading countries are not expected to finish the tree by 1900. Research is faster in this age, and faster still for industrialized countries ([tsin_time_compression_concept|e])."

 game_concept_tsin_age7_military_concept: "Industrial Warfare"
 game_concept_tsin_age7_military_concept_desc: "Armies of the $age_format_age_7_industrialization$ are raised by rail and armed by factories. The age doubles the expected army size, makes [mercenaries|e] scarcer, and adds a military tree of 29 [advances|e] with 17 new [unit_types|e]. Military advances do not depend on the age focus: every country can research them.\n\nThe tree starts at [ShowAdvanceName('tsin_reserve_system_advance')], right after [ShowAdvanceName('tsin_steam_age_advance')]. It unlocks two new [levies|e], which replace those of the previous age because a levy always uses the strongest type available:\n$BULLET$[ShowUnitDefinitionName('a_tsin_reservists')]: infantry raised from [ShowPopTypeName('peasants')], [ShowPopTypeName('laborers')], [ShowPopTypeName('soldiers')] and [ShowPopTypeName('burghers')].\n$BULLET$[ShowUnitDefinitionName('a_tsin_mounted_constabulary')]: cavalry raised from [ShowPopTypeName('nobles')], taking 25% less damage to their strength.\n\nLand units, with the advance that unlocks them:\n$BULLET$[ShowUnitDefinitionName('a_tsin_line_riflemen')] ([ShowAdvanceName('tsin_percussion_cap_advance')]): heavy infantry, the core of the army.\n$BULLET$[ShowUnitDefinitionName('a_tsin_rifle_skirmishers')] ([ShowAdvanceName('tsin_rifling_advance')]): light infantry with better initiative and flanking.\n$BULLET$[ShowUnitDefinitionName('a_tsin_breech_loading_battery')] ([ShowAdvanceName('tsin_breech_loading_artillery_advance')]): artillery with a heavier barrage, fed with steel and explosive shells.\n$BULLET$[ShowUnitDefinitionName('a_tsin_mounted_rifles')] ([ShowAdvanceName('tsin_repeating_rifle_advance')]): fast light cavalry.\n$BULLET$[ShowUnitDefinitionName('a_tsin_lancers')] ([ShowAdvanceName('tsin_lancers_advance')]): heavy cavalry.\n$BULLET$[ShowUnitDefinitionName('a_tsin_railway_supply_corps')] ([ShowAdvanceName('tsin_railway_supply_corps_advance')]): auxiliary that needs engines and burns coal.\n$BULLET$[ShowUnitDefinitionName('a_tsin_machine_gun_detachment')] ([ShowAdvanceName('tsin_maxim_gun_advance')]): auxiliary with far more combat power than other auxiliaries.\n$BULLET$[ShowUnitDefinitionName('a_tsin_bolt_action_infantry')] ([ShowAdvanceName('tsin_smokeless_powder_advance')]): late heavy infantry that uses explosives.\n$BULLET$[ShowUnitDefinitionName('a_tsin_jaegers')] ([ShowAdvanceName('tsin_jaeger_advance')]): late elite light infantry.\n$BULLET$[ShowUnitDefinitionName('a_tsin_quick_firing_battery')] ([ShowAdvanceName('tsin_quick_firing_artillery_advance')]): the strongest artillery of the age.\n\nShips:\n$BULLET$[ShowUnitDefinitionName('n_tsin_ironclad')] ([ShowAdvanceName('tsin_ironclad_advance')]): armored steam heavy ship that burns coal.\n$BULLET$[ShowUnitDefinitionName('n_tsin_monitor')] ([ShowAdvanceName('tsin_monitor_advance')]): slow turret ship of the galley category, strong in coastal waters.\n$BULLET$[ShowUnitDefinitionName('n_tsin_torpedo_boat')] ([ShowAdvanceName('tsin_torpedo_advance')]): fast light ship that uses explosives.\n$BULLET$[ShowUnitDefinitionName('n_tsin_steam_transport')] ([ShowAdvanceName('tsin_steam_transport_advance')]): coal-fired transport.\n$BULLET$[ShowUnitDefinitionName('n_tsin_protected_cruiser')] ([ShowAdvanceName('tsin_protected_cruiser_advance')]): fast light ship with a large hull.\n$BULLET$[ShowUnitDefinitionName('n_tsin_destroyer')] ([ShowAdvanceName('tsin_destroyer_advance')]): the fastest light ship.\n$BULLET$[ShowUnitDefinitionName('n_tsin_pre_dreadnought')] ([ShowAdvanceName('tsin_pre_dreadnought_advance')]): the strongest heavy ship of the age; building one takes electricity.\n\nThe late units also need steel and dynamite advances from the [ShowInstitutionName('tsin_industrial_capitalism')] branch, so they arrive late in the age. The other military advances improve tactics, discipline, manpower, sieges and assaults, movement and recruitment by rail, naval morale, repair at sea and casualties.\n\nModern units create [goods_demand|e] for industrial [goods|e]: [ShowGoodsName('steel')], [ShowGoodsName('tsin_engines')], [ShowGoodsName('tsin_explosives')], [ShowGoodsName('coal')] and, for pre-dreadnoughts, [ShowGoodsName('tsin_electricity')]. A country without its own steel and engine industry has to buy them on the [market|e]. Until you research the new units, the units of the previous age stay available."

 game_concept_tsin_age6_continuity_concept: "Legacy of the Age of Revolutions"
 game_concept_tsin_age6_continuity_concept_desc: "Much vanilla content is written for the $age_format_age_6_revolutions$, the last age of the base game, and would switch off in any later age. The mod keeps it running in the $age_format_age_7_industrialization$:\n$BULLET$[casus_belli|e]: [ShowCasusBelliName('cb_imperialism')] and [ShowCasusBelliName('cb_nationalist')].\n$BULLET$[disasters|e]: [ShowDisasterName('revolution_disaster')], [ShowDisasterName('revolutionary_chaos')], [ShowDisasterName('aspiration_for_liberty')], [ShowDisasterName('court_and_country')] and [ShowDisasterName('decline_of_empire')].\n$BULLET$[situations|e]: [ShowSituationName('the_revolution')] and [ShowSituationName('colonial_revolution')]. A revolution that began before 1837 goes on.\n$BULLET$[laws|e] whose policies depend on the age, such as [ShowLawName('recruitment_law')], [ShowLawName('battle_leadership_law')], [ShowLawName('distribution_of_power_law')], [ShowLawName('legitimization_of_power_law')] and [ShowLawName('royal_court_customs_law')]: their Age of Revolutions policies stay available.\n$BULLET$[parliament_issues|e] and [parliament_agendas|e] of the estates, such as $grant_city_rights$ and the issues that expand buildings.\n$BULLET$[decisions|e], [formable_countries|e] such as [ShowFormableCountryName('GER_f')] and [ShowFormableCountryName('ITA_f')], and peace terms that need the Age of Revolutions or later.\n$BULLET$[works_of_art|e] such as symphonies, events about societal values and parliaments, and late portraits and coats of arms.\n$BULLET$[hegemons|e] and [victory_cards|e].\n\nContent meant only for early ages, such as medieval parliament issues, stays switched off. The units of the Age of Revolutions remain available until you research their successors ([tsin_age7_military_concept|e]), and old buildings can be upgraded ([tsin_replaced_buildings_concept|e]).\n\nThe mod does this by redefining each affected vanilla object. If another mod changes the same object, whichever is loaded last wins; if that is the other mod, the object behaves as in vanilla and may switch off in 1837."

 game_concept_tsin_replaced_buildings_concept: "Replaced Buildings"
 game_concept_tsin_replaced_buildings_concept_desc: "Several buildings of the $age_format_age_7_industrialization$ replace older [buildings|e]. This entry lists which advance unlocks each replacement and how vanilla content treats it; what the new buildings produce is explained in [tsin_building_upgrades_concept|e]. Once the unlocking [advance|e] is researched, the old building can be upgraded where it stands, and the new one takes its place in the [location|e]. The vanilla alert for buildings that can be upgraded lists them.\n$BULLET$[ShowBuildingTypeName('university')] to [ShowBuildingTypeName('tsin_research_university')] ([ShowAdvanceName('tsin_humboldt_university_advance')])\n$BULLET$[ShowBuildingTypeName('naval_base')] to [ShowBuildingTypeName('tsin_steam_port')] ([ShowAdvanceName('tsin_steam_merchant_marine_advance')])\n$BULLET$[ShowBuildingTypeName('aqueduct_system')] to [ShowBuildingTypeName('tsin_waterworks')] ([ShowAdvanceName('tsin_modern_sewerage_advance')])\n$BULLET$[ShowBuildingTypeName('provincial_chancery')] to [ShowBuildingTypeName('tsin_prefecture')] ([ShowAdvanceName('tsin_professional_bureaucracy_advance')])\n$BULLET$[ShowBuildingTypeName('textile_mill')] to [ShowBuildingTypeName('tsin_mechanized_textile_mill')] ([ShowAdvanceName('tsin_mechanized_textile_mill_advance')])\n$BULLET$[ShowBuildingTypeName('lumber_mill')] to [ShowBuildingTypeName('tsin_steam_sawmill')] ([ShowAdvanceName('tsin_steam_sawmill_advance')])\n$BULLET$[ShowBuildingTypeName('iron_mill')] to [ShowBuildingTypeName('tsin_automated_iron_mill')] and [ShowBuildingTypeName('furniture_mill')] to [ShowBuildingTypeName('tsin_automated_furniture_mill')] ([ShowAdvanceName('tsin_interchangeable_parts_advance')])\n$BULLET$[ShowBuildingTypeName('glass_mill')] to [ShowBuildingTypeName('tsin_automated_glass_mill')] and [ShowBuildingTypeName('paper_mill')] to [ShowBuildingTypeName('tsin_automated_paper_mill')] ([ShowAdvanceName('tsin_continuous_process_advance')])\n$BULLET$[ShowBuildingTypeName('printing_mill')] to [ShowBuildingTypeName('tsin_automated_printing_mill')] ([ShowAdvanceName('tsin_rotary_press_advance')])\n$BULLET$[ShowBuildingTypeName('fine_cloth_mill')] to [ShowBuildingTypeName('tsin_automated_fine_cloth_mill')] ([ShowAdvanceName('tsin_power_jacquard_advance')])\n\nThree buildings of the mod are upgraded the same way: [ShowBuildingTypeName('tsin_tenement')] to [ShowBuildingTypeName('tsin_model_dwellings')], [ShowBuildingTypeName('tsin_fertilized_fields')] to [ShowBuildingTypeName('tsin_mechanized_farm')], and [ShowBuildingTypeName('tsin_fertilizer_plant')] to [ShowBuildingTypeName('tsin_nitrogen_fixation_plant')]. The automated mills are explained in [tsin_automation_concept|e].\n\nUpgrading costs you nothing elsewhere: vanilla checks that ask for the old building also accept its upgrade. This covers port facilities and the ships that need them, the [ShowLawName('education_elites_law')] law, the [ShowEstatePrivilegeName('clergy_lecture_oaths')] privilege, the parliament issues that sponsor universities and expand ports, the progress and literacy missions, and a few religious orders and town rights. Some vanilla events still look only for the old building and skip upgraded locations; new events about research universities, steam ports, waterworks, prefectures and automated factories take their place ([tsin_flavor_events_concept|e])."

 game_concept_tsin_game_rules_concept: "Industrial Age Game Rules"
 game_concept_tsin_game_rules_concept_desc: "The mod adds six game rules, set on the game rules screen when you start a new game. The defaults suit a normal game.\n$BULLET$$rule_tsin_flavor_event_frequency$: $setting_tsin_flavor_events_normal$ (default, at most 3 flavor events per country per year), $setting_tsin_flavor_events_low$ (1), $setting_tsin_flavor_events_high$ (5) or $setting_tsin_flavor_events_off$ (none). See [tsin_flavor_events_concept|e].\n$BULLET$$rule_tsin_electrification_timing$: $setting_tsin_electrification_historical$ (default; [ShowInstitutionName('tsin_electrification')] cannot appear before 1870, or before 1875 in Berlin with historical spawns) or $setting_tsin_electrification_free$ (no date limit; it appears as soon as a location meets the conditions). See [tsin_industrial_institutions_concept|e].\n$BULLET$$rule_tsin_population_governor$: $setting_tsin_population_governor_on$ (default) or $setting_tsin_population_governor_off$. Off removes the brakes of the [tsin_population_governor_concept|e]; it is meant for testing, and population can grow to absurd levels.\n$BULLET$$rule_tsin_bill_system$: $setting_tsin_bill_system_on$ (default) or $setting_tsin_bill_system_off$. Off lets policies change at once, as in vanilla, instead of through [tsin_bills_concept|e].\n$BULLET$$rule_tsin_economy_log$: $setting_tsin_economy_log_off$ (default) or $setting_tsin_economy_log_on$. On writes the [tsin_estimated_gdp_concept|e] and other indicators of players, great powers and countries with a stock market to the game log once a year.\n$BULLET$$rule_tsin_observer_log$: $setting_tsin_observer_log_off$ (default) or $setting_tsin_observer_log_on$. On writes world statistics to the game log once a year, for balance testing only.\n\nThe vanilla institution spawn rule also decides where the three new institutions appear. Decisions whose names start with TSIN DEBUG are developer tools and are only visible in debug mode."

 game_concept_tsin_time_compression_concept: "Time Compression"
 game_concept_tsin_time_compression_concept_desc: "Days are no longer than before, but far more happens in a year of the $age_format_age_7_industrialization$. The age itself speeds up research and construction by 10%, pop [promotion|e] by 20%, [migration|e] by 25% and institution growth by 20%.\n\nIndustrializing countries go faster still. Once a year each country counts its industrial acceleration points:\n$BULLET$1 point for each embraced [institution|e] of the age ([tsin_industrial_institutions_concept|e]);\n$BULLET$1 point if factory jobs reach 8% of the population, and 1 more at 20%;\n$BULLET$1 point after taking the [decision|e] [ShowDecisionName('tsin_standard_time_decision')]. It appears with [ShowAdvanceName('tsin_railway_network_advance')] and needs [ShowAdvanceName('tsin_telegraph_telephone_advance')], 3 locations with a [ShowBuildingTypeName('tsin_railway_station')] and secondary education of at least 10.\n\n2, 3 and 5 points give the modifiers:\n$BULLET$$STATIC_MODIFIER_NAME_tsin_industrial_acceleration_1$: research and construction +5%, promotion +10%.\n$BULLET$$STATIC_MODIFIER_NAME_tsin_industrial_acceleration_2$: research and construction +10%, promotion +20%, [production_efficiency|e] +3%.\n$BULLET$$STATIC_MODIFIER_NAME_tsin_industrial_acceleration_3$: research and construction +15%, promotion +30%, production efficiency +5%.\n\nA country with tier II or III also gets $STATIC_MODIFIER_NAME_tsin_industrial_population_boom$, a little extra [population_growth|e], as long as the [tsin_population_governor_concept|e] is not braking the world. The tiers are recalculated every year; you find them among your country's [modifiers|e]."

 game_concept_tsin_population_governor_concept: "Population Governor"
 game_concept_tsin_population_governor_concept_desc: "So that the faster industrial world does not grow to absurd sizes, world population is checked once a year against a historical target. The base is the world population when the $age_format_age_7_industrialization$ began. The target is 1.6 times that figure in 1900, 2.4 times in 1950, 5.5 times in 2000 and at most 7 times from 2100 on.\n\nWhen the world is above the target, the governor brakes:\n$BULLET$$STATIC_MODIFIER_NAME_tsin_population_brake_1$ (world at the target or above) and $STATIC_MODIFIER_NAME_tsin_population_brake_2$ (10% above): lower [population_growth|e] and higher [food_consumption|e], and the moderate one also lowers [population_capacity|e]. They only hit countries whose population grew by more than 1% in the past year.\n$BULLET$$STATIC_MODIFIER_NAME_tsin_population_brake_3$ (25% above, or 7 times the base): a stronger brake on every country.\n\nTwo more limits work country by country:\n$BULLET$$STATIC_MODIFIER_NAME_tsin_population_pressure$: a country whose population grew by more than 3% in a year grows more slowly and sends out more migrants for the next year.\n$BULLET$$STATIC_MODIFIER_NAME_tsin_demographic_transition_1$ and $STATIC_MODIFIER_NAME_tsin_demographic_transition_2$: literate, urban countries have fewer births. The first needs average [literacy|e] of 50 and a quarter of the population in towns and cities, the second literacy of 75 and 40%.\n\n[ShowDisasterName('tsin_cholera')] and [ShowSituationName('tsin_great_migration')] also relieve population pressure. The governor can be switched off with the game rule $rule_tsin_population_governor$ ([tsin_game_rules_concept|e])."
