 TSIN_UI_GUIDE: "Read-only cached statistics. Use the linked native views for actions and their normal costs and requirements."
 TSIN_UI_SOCIETY_HELP: "Education approaches its targets annually. Targets are constrained by literacy, lower education, capacity and policy. Movement values use a 0–100 scale."
 TSIN_UI_ECONOMY_HELP: "Annual output and industry aggregates. Inspect individual goods and construction in the economy screen; the dashboard does not scan all locations on hover."
 TSIN_UI_FINANCE_HELP: "Company totals are annual snapshots. Existing stock prices update quarterly. Founding, charters and dissolution retain their existing decisions and costs."
 TSIN_UI_RESEARCH_HELP: "Institution acceptance opens a technology root; it does not grant the technology. Native technologies show prerequisites and individual unlocks. Academic exchange adds cumulative 2/5/9/15% from the cached education tiers, then multiplies by 1.2 (free press), 0.5 (state press only) or 0.75 (censored). Maximum 18%. No new research slots or world technology rotation. The education source year shows when that cache was measured."
 TSIN_UI_HISTORY_NOTE: "Oldest observation first; shared scale. Only recorded observations are shown, with no reconstructed past. K=1,000 · M=1,000,000 · B=1,000,000,000 · T=1,000,000,000,000."
