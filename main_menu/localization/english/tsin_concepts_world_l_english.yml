l_english:
 game_concept_tsin_industrial_world_concept: "The Industrial World"
 game_concept_tsin_industrial_world_concept_desc: "The [ShowAgeName('age_7_industrialization')] is not only about factories. Financial crises, revolutions, national unification, colonial empires, epidemics and mass migration reshape the world. None of this content is tied to country tags: every [situation|e], [disaster|e] and event looks at the state of a [country|e] (its institutions, movements, population, ports and factories), so it can happen to anyone who reaches that state.\n\n#T Situations and disasters#!\n$BULLET$[tsin_industrial_age_situations|e]: eight [situations|e] that involve many countries at once.\n$BULLET$[tsin_industrial_disasters_concept|e]: four [disasters|e] that strike a single country.\n\n#T Goals and diplomacy#!\n$BULLET$[tsin_industrial_missions_concept|e]: two [mission|e] packs for industrializing and modernizing countries.\n$BULLET$[tsin_expeditions_concept|e]: the source of the Nile, the Northwest Passage and the North Pole.\n$BULLET$[tsin_great_power_politics_concept|e]: congresses, the Geneva Convention, the naval race and the dual monarchy.\n$BULLET$[tsin_treaty_port_concept|e]: a [peace_treaty|e] term that forces a backward country to open a port.\n\n#T Society and culture#!\n$BULLET$[tsin_frontier_concept|e]: gold rushes and the homestead frontier.\n$BULLET$[tsin_culture_science_concept|e]: new works of art, inventions, science and canals.\n$BULLET$[tsin_late_century_concept|e]: anarchists, the First International and the commune.\n$BULLET$[tsin_flavor_events_concept|e]: the event families of the mod and how often they fire.\n\n#T Finding your way#!\n$BULLET$[tsin_map_modes_concept|e]: what each new map mode shows.\n$BULLET$[tsin_hints_concept|e]: the hints that appear when something needs your attention.\n\nThe content of the previous age does not switch off: [ShowSituationName('the_revolution')], [ShowSituationName('colonial_revolution')], the revolutionary [disasters|e], the imperialism and nationalist [casus_belli|e] and the [formable|e] countries all stay available."

 game_concept_tsin_treaty_port_concept: "Treaty Port"
 game_concept_tsin_treaty_port_concept_desc: "A treaty port is a harbour that a defeated [country|e] must open to the trade of the winner. It is a term of the [peace_treaty|e] [ShowPeaceTreatyTypeName('tsin_open_treaty_port')], available in the [ShowAgeName('age_7_industrialization')] only to a winner that has researched more [advances|e] than the loser.\n\nThe winner picks one port [location|e] of the loser that is not its [capital|e], not a rural settlement and not already a treaty port. The term costs more war score for valuable ports and causes [antagonism|e]. For 30 years:\n$BULLET$The port gains [ShowModifier('tsin_treaty_port')]: more [market_access|e] and [migration_attraction|e], but less [control|e] and more [unrest|e].\n$BULLET$The loser suffers [ShowModifier('tsin_unequal_treaty')].\n$BULLET$The winner gains [ShowModifier('tsin_treaty_port_concessions')].\n\nA country forced to open a port comes under opening pressure. This starts [tsin_defensive_modernization_concept|e], unlocks the [ShowMissionName('tsin_modernization')] [mission|e] pack, whose final task revises the unequal treaty, and adds to the pressure behind the [tsin_millenarian_rebellion_concept|e]. The same pressure comes from accepting the gunboats in the harbour event."

 game_concept_tsin_industrial_age_situations: "Situations of the Age of Industry"
 game_concept_tsin_industrial_age_situations_desc: "Eight [situations|e] belong to the [ShowAgeName('age_7_industrialization')]. They start when the world reaches a certain state, not on a fixed date. Seven of them happen at most once per game; the World Exhibition can be held again and again. While a situation runs, its panel and its map mode show who takes part, and a hint suggests what to do.\n$BULLET$[tsin_defensive_modernization_concept|e]: from 1840, countries forced to open their ports try to modernize.\n$BULLET$[tsin_great_migration_concept|e]: from 1845, crowded and hungry countries send emigrants to the Americas and Oceania.\n$BULLET$[tsin_national_unification_concept|e]: from 1848, the largest state of a divided culture group leads its unification.\n$BULLET$[tsin_springtime_of_nations_concept|e]: a revolutionary wave in countries with strong liberal, nationalist or socialist movements.\n$BULLET$[tsin_world_exhibition_concept|e]: a technology leader hosts an exhibition by [decision|e], and the others learn from it.\n$BULLET$[tsin_long_depression_concept|e]: from 1865, a financial panic and slump in the industrial countries.\n$BULLET$[tsin_scramble_for_colonies_concept|e]: from 1870, the industrial powers race for the remaining lands.\n$BULLET$[tsin_grain_invasion_concept|e]: from 1873, cheap overseas grain ruins the old farming countries."

 game_concept_tsin_long_depression_concept: "The Long Depression"
 game_concept_tsin_long_depression_concept_desc: "[ShowSituationName('tsin_long_depression')] is a worldwide economic crisis of the industrial countries. It can start from 1865 (from 1850 if the stock market has crashed recently, see [tsin_stock_index_concept|e]) once 6 or more countries have embraced [ShowInstitutionName('tsin_industrial_capitalism')]. It happens once per game.\n\n#T Phases#!\n$BULLET$Every country that has embraced the [institution|e] takes part. The first two years are a panic: [ShowModifier('tsin_depression_panic')]. Countries on the gold standard also suffer [ShowModifier('tsin_gold_standard_deflation')] for 5 years. At the start each country chooses to rescue the banks, let them fail or print money.\n$BULLET$After two years the panic becomes a slump: [ShowModifier('tsin_depression_slump')].\n$BULLET$Every month bank failures can strike. During the slump a recovery policy event lets us escape early: raise tariffs or pay for public works. Either removes the slump and gives [ShowModifier('tsin_depression_recovered')].\n\n#T End#!\nAfter 8 years the depression ends as soon as no country is left in the slump; after 20 years it ends in any case, and all its modifiers are removed. The [tsin_grain_invasion_concept|e] hits harder while the depression lasts.\n\nThe situation map mode shows countries in panic, in the slump and recovered."

 game_concept_tsin_grain_invasion_concept: "The Grain Invasion"
 game_concept_tsin_grain_invasion_concept_desc: "[ShowSituationName('tsin_grain_invasion')]: railways and steamships bring cheap New World grain to the old farming countries. It can start from 1873 once 3 or more countries have [ShowAdvanceName('tsin_steam_merchant_marine_advance')]. It happens once per game.\n\nAt the start every country with [ShowAdvanceName('tsin_railway_network_advance')] falls into [ShowModifier('tsin_grain_invasion_crisis')], unless factory jobs already make up 20% or more of its population.\n\nEach month a country in crisis may get the farm policy event, twice as often during the [tsin_long_depression_concept|e]. Choosing a policy ends the crisis for that country:\n$BULLET$Protective tariffs: [ShowModifier('tsin_grain_tariffs')], pleasing the landowners.\n$BULLET$Cheap bread for the cities: [ShowModifier('tsin_cheap_bread')].\n$BULLET$Farm modernization: [ShowModifier('tsin_farm_modernization')], only with [ShowAdvanceName('tsin_steam_threshing_advance')].\n\nThe situation ends after 5 years once no country is left in crisis, or after 15 years. Countries still in crisis then lose the modifier. See also [tsin_agricultural_revolution_concept|e]."

 game_concept_tsin_great_migration_concept: "The Great Migration"
 game_concept_tsin_great_migration_concept_desc: "[ShowSituationName('tsin_great_migration')]: millions cross the ocean by steamship. It can start from 1845 once 2 or more countries are under population pressure, and happens once per game.\n\nOnce a year the senders and receivers are decided again:\n$BULLET$#T Senders:#! independent countries with 3 or more crowded [locations|e] (population above 80% of [population_capacity|e]), or suffering [tsin_great_hunger_concept|e], [tsin_cholera_concept|e] or the grain crisis of [tsin_grain_invasion_concept|e]. They get [ShowModifier('tsin_emigration_wave')] and an event about the emigrant ships.\n$BULLET$#T Receivers:#! countries whose [capital|e] lies in the Americas or Oceania and that are not senders. They get [ShowModifier('tsin_immigrant_nation')] and choose whether to open the door.\n\nThe people themselves move through vanilla [migration|e]. Easing crowding with $tsin_waterworks$ and worker housing stops the exodus; the migration is also one of the outlets of the [tsin_population_governor_concept|e].\n\nThe situation ends after 10 years once no sender is left, or after 40 years."

 game_concept_tsin_springtime_of_nations_concept: "Springtime of Nations"
 game_concept_tsin_springtime_of_nations_concept_desc: "[ShowSituationName('tsin_springtime_of_nations')] is a short revolutionary wave like that of 1848. It can start in the [ShowAgeName('age_7_industrialization')] when 3 or more countries have a strong movement (Liberalism or Nationalism 50 or more, or Socialism 40 or more, see [tsin_movements_concept|e]) and [ShowSituationName('the_revolution')] is not running. It happens once per game.\n\nEach of those countries gets [ShowModifier('tsin_springtime_barricades')] and must choose at once:\n$BULLET$Grant a constitution: Liberalism and Nationalism fall sharply and [ShowModifier('tsin_springtime_constitution')], but the nobles are angered.\n$BULLET$Restore order by force: [ShowModifier('tsin_springtime_reaction')], the nobles are pleased, [stability|e] suffers.\n$BULLET$Wait and see.\nWhile the wave lasts, street fighting can break out in the capital: negotiate (gold, Liberalism falls) or crush it (stability, Liberalism rises).\n\nAfter 3 years the wave subsides. The closing event follows the first choice: a constitution calms Liberalism further, repression makes Liberalism and Socialism come back stronger.\n\nThe situation map mode shows countries in revolution and countries with strong movements."

 game_concept_tsin_national_unification_concept: "National Unification"
 game_concept_tsin_national_unification_concept_desc: "[ShowSituationName('tsin_national_unification')] unites nations that are split among several states, as Italy and Germany were. It works with [culture_groups|e], not country tags. It can start from 1848 once an independent country has Nationalism 30 or more ([tsin_movements_concept|e]), and happens once per game.\n\n#T The champion#!\nEvery year an independent country at peace with Nationalism 30 or more is checked. If at least 2 other independent countries share its [culture_group|e] and none of them is larger or already a champion, it is asked to lead the national cause. Accepting gives [ShowModifier('tsin_unification_drive')] and the [ShowCasusBelliName('cb_tsin_national_unification')] [casus_belli|e] against independent kin states. Declining blocks the offer for 10 years.\n\n#T Plebiscites and wars#!\nEach year the champion has a 15% chance to offer a plebiscite to a smaller kin state that is not a [great_power|e]. If it accepts, it is annexed peacefully; if it refuses, it cannot be asked again for 10 years. The rest must be won by war.\n\n#T Proclamation#!\nWhen no independent state of the culture group is left, unification is proclaimed: [ShowModifier('tsin_national_unity')] for 20 years and [stability|e]. If the country meets the conditions of a vanilla [formable|e] country such as Germany or Italy, it can then form it.\n\nThe situation ends after 1871 once a unified nation exists and no champion is left, or in 1900."

 game_concept_tsin_defensive_modernization_concept: "Defensive Modernization"
 game_concept_tsin_defensive_modernization_concept_desc: "[ShowSituationName('tsin_defensive_modernization')] covers reforms like the Tanzimat, the Meiji Restoration and the Self-Strengthening Movement. It concerns countries under opening pressure: those forced to open a [tsin_treaty_port_concept|e], or that negotiated an opening in the gunboats in the harbour event. It can start from 1840 once such a country exists, and happens once per game.\n\nPressured countries go through stages. The events come from a yearly roll and do not count against the flavor event budget.\n$BULLET$#T 1. Modernizing edict:#! reorganize the whole state, or self-strengthening (foreign machines, our own institutions). Refusing brings the edict back after 10 years; a second refusal means failure.\n$BULLET$#T 2. Conservative reaction,#! some years later: crush it with the new army ([ShowModifier('tsin_modernization_new_army')]), buy it off with offices and pensions, or yield, which means failure.\n$BULLET$#T 3. Success#! comes once the waiting time is over, we own at least one factory and [stability|e] is 0 or more: [ShowModifier('tsin_modernized_state')] for 30 years.\n$BULLET$#T Failure:#! [ShowModifier('tsin_failed_modernization')] for 15 years; a new edict becomes possible after 20 years.\n\nThe [ShowMissionName('tsin_modernization')] [mission|e] pack follows the same path and revises the unequal treaty ([tsin_industrial_missions_concept|e]).\n\nThe situation ends after 1880 once no country is still reforming, or in 1900."

 game_concept_tsin_scramble_for_colonies_concept: "The Scramble for Colonies"
 game_concept_tsin_scramble_for_colonies_concept_desc: "[ShowSituationName('tsin_scramble_for_colonies')]: armed with steamships and railways, the industrial powers race for the lands that still have no owner. It can start from 1870 once 4 or more independent countries of kingdom or empire rank (or the emperor) have embraced [ShowInstitutionName('tsin_industrial_capitalism')]. It happens once per game and lasts 30 years.\n\nEvery such country takes part and gets [ShowModifier('tsin_scramble_colonial_drive')]. Participants expand in two ways: [colonization|e] of unclaimed land, and the [ShowCasusBelliName('cb_imperialism')] [casus_belli|e], which stays available in this age.\n\nAfter 10 years a colonial conference lets each participant either accept spheres of influence ([ShowModifier('tsin_scramble_spheres')]) or press every claim ([ShowModifier('tsin_scramble_rivalry')]). Colonial resistance can break out at any time: send a punitive expedition for gold, or pull the settlers back and slow colonial migration.\n\nAfter 30 years the partition is complete and the colonial drive ends. The situation map mode shows the participants and the land still unclaimed."

 game_concept_tsin_world_exhibition_concept: "World Exhibition"
 game_concept_tsin_world_exhibition_concept_desc: "A [ShowSituationName('tsin_world_exhibition')] gathers the machines and inventions of the world in one hall, and spreads them. It is the only situation of the age that is started by a [decision|e] and can happen many times.\n\n#T Hosting#!\nThe decision [ShowDecisionName('tsin_hold_world_exhibition_decision')] needs peace, a [capital|e] of city or megalopolis rank, a place among the technology leaders (fewer than 8 countries have researched more [advances|e]) and a large sum of gold. The host gets [ShowModifier('tsin_exhibition_hosting')] and the exhibition opens the following month.\n\n#T Opening#!\nEvery country with fewer researched advances than the host gains [ShowModifier('tsin_exhibition_visitors')] for 6 years: technology spreads from the leaders to the rest. The host chooses the theme of the exhibition: a machine hall, a palace of science or national glory.\n\n#T Closing#!\nAfter one year the exhibition closes and the host gains a large amount of [prestige|e]. For the next 5 years no exhibition can be held; then another leader may host the next one."

 game_concept_tsin_industrial_disasters_concept: "Disasters of the Age of Industry"
 game_concept_tsin_industrial_disasters_concept_desc: "The [ShowAgeName('age_7_industrialization')] brings four new [disasters|e]. Like vanilla disasters, each strikes a single [country|e], lasts until its end condition is met and fires its own events. None needs a country tag, and none can start while the country already has another disaster.\n$BULLET$[tsin_cholera_concept|e]: crowded cities without waterworks, 1830 to 1875.\n$BULLET$[tsin_great_hunger_concept|e]: crop blight and famine in peasant countries.\n$BULLET$[tsin_millenarian_rebellion_concept|e]: a vast peasant revolt in a large agrarian empire without factories.\n$BULLET$[tsin_secession_crisis_concept|e]: a slaveholding republic splits in two.\n\nThe vanilla disasters of the previous age also continue in this age: [ShowDisasterName('revolution_disaster')], [ShowDisasterName('revolutionary_chaos')], [ShowDisasterName('aspiration_for_liberty')], [ShowDisasterName('court_and_country')] and [ShowDisasterName('decline_of_empire')]."

 game_concept_tsin_cholera_concept: "Cholera Pandemic"
 game_concept_tsin_cholera_concept_desc: "[ShowDisasterName('tsin_cholera')] spreads along steamship and railway routes. It can strike between 1830 and 1875 a country that owns 2 or more crowded towns or cities (population above 80% of [population_capacity|e]) without [ShowBuildingTypeName('tsin_waterworks')]. After a pandemic the country is safe for 20 years.\n\n#T Effects#!\nPopulation growth and city prosperity fall and people migrate more. Outbreak events strike the largest crowded city without waterworks and kill 3% of its people (half as many with emergency hospitals), at most 6 times per pandemic.\n\n#T Ending it#!\nThe pandemic ends when its progress reaches 60. Progress grows by 1 each month, 1 more with waterworks in the [capital|e], and 1 more while disease resistance is 10% or higher, for example from quarantine or the [ShowCabinetActionName('tsin_public_health_campaign')] [cabinet_action|e]. Without help it lasts 5 years, with everything about 20 months.\n\nAt the start we can quarantine the ports ([ShowModifier('tsin_cholera_quarantine')]) or keep trade going, which prolongs the pandemic. A physician tracing deaths to one water pump can shorten it and bring [ShowModifier('tsin_sanitary_science')]. At the end, building sewers brings [ShowModifier('tsin_sewer_movement')]. Cholera also makes a country a sender of [tsin_great_migration_concept|e]."

 game_concept_tsin_great_hunger_concept: "The Great Hunger"
 game_concept_tsin_great_hunger_concept_desc: "[ShowDisasterName('tsin_great_hunger')] is a famine like the Irish one of the 1840s.\n\n#T How it starts#!\nEach year a country whose population is more than 60% peasants has a small chance to suffer a crop blight: [ShowModifier('tsin_crop_blight')] for 3 years, once per country. The famine itself can start in the [ShowAgeName('age_7_industrialization')], at peace, when peasant [estate_satisfaction|e] is below 50% and the country has the blight or 3 or more locations in starving provinces. It happens once per country.\n\n#T Effects#!\nPeasant satisfaction falls, migration speeds up, colonial migration grows and the country attracts fewer migrants: people leave through vanilla [migration|e], and the country becomes a sender of [tsin_great_migration_concept|e].\n\nAt the start we choose to buy grain abroad (gold), keep exporting food (Nationalism rises) or give the hungry public works. Emigrant ships, evictions and food riots follow.\n\n#T End#!\nThe famine ends once 4 years have passed and the blight is over. Afterwards we can restore [stability|e] or pay for an agricultural reform."

 game_concept_tsin_millenarian_rebellion_concept: "The Millenarian Rebellion"
 game_concept_tsin_millenarian_rebellion_concept_desc: "[ShowDisasterName('tsin_millenarian_rebellion')] is a great religious peasant revolt like the Taiping or Mahdist uprisings.\n\n#T How it starts#!\nIt can strike once per country in the [ShowAgeName('age_7_industrialization')], with no other disaster or [civil_war|e], if the country is large (at least 3% of the world population of 1837), owns no factory at all, and has a pressure score of 2 or more. One point each for: a crop blight, opening pressure from a forced port ([tsin_treaty_port_concept|e]), peasant satisfaction below 40%, negative [stability|e], and 20 or more locations whose main religion differs from the [state_religion|e].\n\n#T The rising#!\nThe pops of up to 8 populous, discontented provinces away from the capital join the millenarian [rebels|e]. We answer with an imperial campaign (gold, [ShowModifier('tsin_suppression_campaign')]) or let the gentry raise militias ([ShowModifier('tsin_gentry_armies')] for 15 years). While it lasts, pops join rebels more easily, rebels grow faster, [war_exhaustion|e] rises and the peasants are less satisfied. Events about the heavenly capital, foreign-officered armies and famine behind the lines follow.\n\n#T End#!\nIt ends after at least 3 years, once every millenarian rebel is destroyed, and leaves [ShowModifier('tsin_rebellion_devastation')] for 15 years. A single factory keeps it from starting."

 game_concept_tsin_secession_crisis_concept: "The Secession Crisis"
 game_concept_tsin_secession_crisis_concept_desc: "[ShowDisasterName('tsin_secession_crisis')] is a slide toward civil war like that of the United States in 1861.\n\n#T How it starts#!\nIt can strike once per country: a republic in the [ShowAgeName('age_7_industrialization')] where [slavery|e] still exists and Abolitionism is 50 or more ([tsin_movements_concept|e]), at peace and with no other disaster. The country must be a house divided: 8 or more locations where slaves are at least 20% of the people, and 8 or more locations with no slaves.\n\n#T The crisis#!\nFor at least 3 years, bloodshed on the border and the offer of a great compromise can come. Accepting the compromise ends the disaster: Abolitionism falls by 30 and [ShowModifier('tsin_rotten_compromise')] lasts 20 years. Refusing it means it will not be offered again.\n\n#T Secession#!\nIf there is no compromise after 3 years, the slave regions secede. Preserve the union by force, and the pops of the slave regions (except the capital) rise as secessionist [rebels|e]; or strike a last compromise, losing [stability|e] with a rotten compromise for 30 years. During the disaster pops join rebels more easily and [war_exhaustion|e] rises.\n\n#T Reunion#!\nOnce the rebels are beaten, choose emancipation and reconstruction (slavery is outlawed, [ShowModifier('tsin_reconstruction')] for 15 years) or restore the old order (stability, Abolitionism falls)."

 game_concept_tsin_industrial_missions_concept: "Missions of the Age of Industry"
 game_concept_tsin_industrial_missions_concept_desc: "The age adds two [mission|e] packs. They are chosen like vanilla missions, need no country tag, cannot be repeated and reward each [task|e] with a timed modifier.\n\n#T [ShowMissionName('tsin_industrialization')]#!\nFor countries in the [ShowAgeName('age_7_industrialization')] with at least one town or city.\n$BULLET$[ShowMissionTaskName('tsin_mission_first_factories')]: 3 locations with factories.\n$BULLET$Then [ShowMissionTaskName('tsin_mission_machine_works')] (a $tsin_machine_works$), [ShowMissionTaskName('tsin_mission_urban_growth')] (4 towns or cities) and [ShowMissionTaskName('tsin_mission_rail_link')] (a railroad to the capital), followed by [ShowMissionTaskName('tsin_mission_railway_boom')] (3 $tsin_railway_station$s).\n$BULLET$Final task [ShowMissionTaskName('tsin_mission_industrial_nation')]: 8 locations with factories, with a long-lasting reward.\n$BULLET$Side tasks: [ShowMissionTaskName('tsin_mission_automation')], [ShowMissionTaskName('tsin_mission_housing_relief')], [ShowMissionTaskName('tsin_mission_pass_bill')] ([tsin_bills_concept|e]), [ShowMissionTaskName('tsin_mission_stock_index')] ([tsin_stock_index_concept|e]) and [ShowMissionTaskName('tsin_mission_mechanized_farms')]. They are not needed for the final task.\n\n#T [ShowMissionName('tsin_modernization')]#!\nFor countries forced to open a [tsin_treaty_port_concept|e], or still without a single factory after 1850.\n$BULLET$[ShowMissionTaskName('tsin_mission_foreign_advisors')], then [ShowMissionTaskName('tsin_mission_army_reform')], [ShowMissionTaskName('tsin_mission_modern_schools')] and [ShowMissionTaskName('tsin_mission_state_arsenal')], then [ShowMissionTaskName('tsin_mission_modern_communications')].\n$BULLET$Final task [ShowMissionTaskName('tsin_mission_treaty_revision')]: 3 locations with factories and peace. It removes [ShowModifier('tsin_unequal_treaty')].\n\nThe vanilla packs [ShowMissionName('generic_capital_economy')] and [ShowMissionName('progress_and_literacy')] also stay available in this age."

 game_concept_tsin_expeditions_concept: "Expeditions of the Age of Industry"
 game_concept_tsin_expeditions_concept_desc: "Three exploration [expeditions|e] answer the last great questions of geography. Each is led by an [explorer|e], costs gold and needs peace.\n$BULLET$#T $tsin_source_of_the_nile_expedition$:#! overland from the East African coast past the great lakes. The first country in the world to reach Buganda finds the source of the Nile and chooses between [prestige|e] and a geographical society ([ShowModifier('tsin_expedition_geographical_society')]). Every completed journey gives prestige and [ShowModifier('tsin_expedition_geographic_fame')]. Once the source is found, no one can start it again.\n$BULLET$#T $tsin_northwest_passage_expedition$:#! by sea from a town or city port to the edge of the Arctic ice. There is a 35% chance to find the passage (prestige and geographic fame); otherwise the ice turns the ship back with a little prestige. It can be tried again until someone finds the passage.\n$BULLET$#T $tsin_polar_expedition$:#! from 1870, with [ShowAdvanceName('tsin_ironclad_advance')], by sea to the pack ice of the Barents Sea. There is a 30% chance to reach the pole. It can be tried again until someone succeeds.\n\nAn expedition that fails on the way costs prestige. The vanilla relic expedition also stays available in this age."

 game_concept_tsin_great_power_politics_concept: "The Concert of the Powers"
 game_concept_tsin_great_power_politics_concept_desc: "In this age the [great_powers|e] settle their affairs in congresses and treaties. These events come from a yearly roll for great powers at peace and do not count against the flavor event budget. No country tags are used.\n$BULLET$#T Congress of the powers:#! after a major war ([war_exhaustion|e] 2 or more), at most once every 15 years in the world. A balance of power lowers war exhaustion, gives [prestige|e] and mutual [opinion|e] with every other great power ($tsin_congress_concert_opinion$, +25). Dictating the terms gives more prestige, but the other great powers think less of us ($tsin_congress_dictated_opinion$, -25).\n$BULLET$#T Geneva Convention:#! from 1860, once per country. Signing gives [ShowModifier('tsin_geneva_convention')] for good and raises Liberalism; refusing costs prestige.\n$BULLET$#T Naval arms race:#! from 1880, for powers with a port, at most every 10 years. Building costs gold and gives [ShowModifier('tsin_naval_race')] for 10 years, but the other great powers resent it ($tsin_naval_rivalry_opinion$, -15). Refusing costs prestige.\n$BULLET$#T [ShowDecisionName('tsin_dual_monarchy_decision')]:#! a [decision|e] for monarchies where 30% or more of the people are not of a primary or [accepted_culture|e]. It needs peace, Nationalism 30 or more and [stability|e] of 0 or more. The culture of the most populous minority location becomes accepted, Nationalism falls by 25, the nobles are pleased and the country gets [ShowModifier('tsin_dual_monarchy')] for good. It can be taken once.\n$BULLET$#T [tsin_treaty_port_concept|e]:#! a technologically advanced winner can force a defeated country to open a port; this causes [antagonism|e].\n\nThese opinions fade over the years. Members of the same customs union also like each other ($io_opinion_tsin_customs_union$)."

 game_concept_tsin_frontier_concept: "Gold Rushes and the Frontier"
 game_concept_tsin_frontier_concept_desc: "Gold rushes like those of California, Australia, South Africa and the Klondike, and homestead laws, fill empty land with settlers. The events come from a yearly roll and do not count against the flavor event budget.\n\n#T Gold rush#!\n$BULLET$#T Gold in the Creek:#! if we own a location whose [raw_material|e] is gold and whose population is below half of its capacity, gold may be found there (at most every 15 years). Open the field to all: [ShowModifier('tsin_gold_rush_boom')] for 10 years, drawing migrants and market access. Or sell licences: [ShowModifier('tsin_gold_rush_licensed')] and gold at once.\n$BULLET$#T The Boomtown:#! during an open rush, incorporate the boomtown (gold, [ShowModifier('tsin_boomtown')] for 20 years) or leave it self-governing (pleases the peasants).\n$BULLET$#T Gold Floods the Market:#! mint the gold (gold now, but [ShowModifier('tsin_gold_inflation')] for 5 years) or keep it as a reserve for a later gold standard.\n\n#T Frontier land#!\nThe law [ShowLawName('tsin_frontier_land_law')], unlocked by [ShowAdvanceName('tsin_railway_network_advance')], decides how empty land is handed out. [ShowPolicyName('tsin_crown_land_sales_policy')] pleases the nobles. [ShowPolicyName('tsin_homestead_policy')] pleases the peasants, and every year each core [location|e] with population below 30% of its capacity becomes a homestead frontier ([ShowModifier('tsin_homestead_frontier')]) that draws settlers."

 game_concept_tsin_culture_science_concept: "Culture and Science"
 game_concept_tsin_culture_science_concept_desc: "The age of steam is also an age of novels, operas, photographs and great discoveries.\n\n#T Works of art#!\nFour new kinds of [works_of_art|e] can be created in the [ShowAgeName('age_7_industrialization')]: [ShowWorkOfArtTypeName('tsin_romantic_painting')] and [ShowWorkOfArtTypeName('tsin_photograph')] by painters, [ShowWorkOfArtTypeName('tsin_opera')] by composers and [ShowWorkOfArtTypeName('tsin_realist_novel')] by writers. Romantic paintings add most to [cultural_tradition|e], operas and realist novels spread the most [cultural_influence|e], and photographs are worth the least. The vanilla motet and symphony continue. Art events present Romanticism, Realism and Photography.\n\n#T Inventions#!\nTen invention events each come once per country after the matching [advance|e]: the Bessemer converter, dynamite, refrigerated ships, the dynamo, the telephone, the incandescent lamp, electric light in the capital, vulcanized rubber, the internal combustion engine and wireless telegraphy. Each asks how to use the invention, for example by the state or by private companies. Countries with a strong higher education ([tsin_education_ladder_concept|e]) roll for them a second time each year.\n\n#T Science and society#!\nRare events without the flavor event budget: On the Origin of Species (from 1859, with [ShowInstitutionName('tsin_mass_society')]), the culture struggle between church and state (from 1870, Catholic countries), the submarine telegraph cable (from 1858, with the telegraph and a port) and the modern Olympic Games (from 1896, once every 4 years in the world).\n\n#T Exhibitions and canals#!\nTechnology leaders can host a [tsin_world_exhibition_concept|e]. With dynamite and steam construction, [ShowDecisionName('tsin_build_suez_canal_industrial')] and [ShowDecisionName('tsin_build_panama_canal_industrial')] build the canals for 40% less than the vanilla decisions."

 game_concept_tsin_late_century_concept: "Seeds of the Next Age"
 game_concept_tsin_late_century_concept_desc: "Late in the century, a few rare events foreshadow the conflicts of the coming age. They count against the flavor event budget.\n$BULLET$#T The International Workingmen's Association:#! from 1864, once in the whole world, in a country with Socialism 30 or more and at least one factory. Ban it (Socialism still grows a little) or tolerate it as a debating club (Socialism and the labour movement grow more).\n$BULLET$#T An anarchist assassination:#! from 1881, in a country with labor grievance 60 or more ([tsin_labor_conditions_concept|e]), at most every 20 years. Pass emergency laws ([ShowModifier('tsin_anti_anarchist_laws')] for 10 years, Socialism falls but grievance rises) or mourn without changing the law ([stability|e] falls, Liberalism rises).\n$BULLET$#T A commune in the capital:#! from 1860, in a country at peace but exhausted by war ([war_exhaustion|e] 5 or more), with Socialism 40 or more and a city as [capital|e]; once per country. Storm the barricades ([ShowModifier('tsin_bloody_week')] in the capital for 10 years, Socialism falls, grievance rises sharply) or grant the city self-government ([ShowModifier('tsin_municipal_commune')], Socialism and Liberalism rise, stability falls). The commune never becomes a new government.\n\nThe movements behind these events are explained in [tsin_movements_concept|e]."

 game_concept_tsin_map_modes_concept: "Map Modes of the Age of Industry"
 game_concept_tsin_map_modes_concept_desc: "The mod adds 19 map modes, listed after the vanilla map modes of the same group. Stronger colours always mean more.\n$BULLET$#T $mapmode_tsin_industrial_institutions_name$:#! the most advanced institution of the age present in each location: $tsin_electrification$, $tsin_mass_society$, $tsin_industrial_capitalism$ or none.\n$BULLET$#T $mapmode_tsin_industrialization_name$:#! the share of the population that factory buildings can employ; 25% or more is the strongest colour.\n$BULLET$#T $mapmode_tsin_industrial_investment_name$:#! who financed the industry: foreign capital, foreign-owned buildings, state-led or domestic industry ([tsin_industrial_investment_concept|e]).\n$BULLET$#T $mapmode_tsin_urbanization_name$:#! the share of burghers and laborers (50% or more is strongest); cities and megalopolises are marked.\n$BULLET$#T $mapmode_tsin_labor_unrest_name$:#! strikes broken by force, recent strikes, and factory locations shaded by the owner's labour movement.\n$BULLET$#T $mapmode_tsin_radicalism_name$:#! the owner's strongest movement times local discontent ([tsin_movements_concept|e]).\n$BULLET$#T $mapmode_tsin_electrification_name$:#! whether electricity supply in the market covers demand: supplied, shortage or not connected ([tsin_electric_power_concept|e]).\n$BULLET$#T $mapmode_tsin_education_name$:#! the owner's higher education rate, with research universities highlighted ([tsin_education_ladder_concept|e]).\n$BULLET$#T $mapmode_tsin_automation_name$:#! the share of automated factory levels ([tsin_automation_concept|e]).\n$BULLET$#T $mapmode_tsin_industrial_siting_name$:#! how good a site is for factories: market access, coal or iron, a railway station and city rank.\n$BULLET$#T $mapmode_tsin_infrastructure_name$:#! how many of railway station, waterworks, steam port, city lighting and prefecture a location has.\n$BULLET$#T $mapmode_tsin_labor_conditions_name$:#! labor conditions of factory locations; below 0.3 is dreadful ([tsin_labor_conditions_concept|e]).\n$BULLET$#T $mapmode_tsin_housing_name$:#! model dwellings, tenements, crowding and overcrowding (above 80% of capacity).\n$BULLET$#T $mapmode_tsin_gdp_per_capita_name$:#! the owner's estimated GDP per head against last year's world highest ([tsin_estimated_gdp_concept|e]).\n$BULLET$#T $mapmode_tsin_corporations_name$:#! company headquarters and works ([tsin_corporations_concept|e]).\n$BULLET$#T $mapmode_tsin_agriculture_name$:#! mechanized farms, the agricultural stage and market food deficits ([tsin_agricultural_revolution_concept|e]).\n$BULLET$#T $mapmode_tsin_pollution_name$:#! annual industrial pollution estimates. Unmeasured locations are grey.\n$BULLET$#T $mapmode_tsin_water_pollution_name$:#! annual urban and mine water-risk index, not a real concentration unit. Unmeasured rural areas are not classified as clean.\n$BULLET$#T $mapmode_tsin_power_access_name$:#! local distribution equipment coverage, separate from market supply adequacy. Unknown locations are grey.\n\nEvery [situation|e] of the age also colours the map in its own situation map mode, explained in its entry."

 game_concept_tsin_hints_concept: "Hints of the Age of Industry"
 game_concept_tsin_hints_concept_desc: "Like vanilla hints, the mod's hints appear in the hint list while their condition holds and disappear afterwards. Each explains what is happening and suggests what to do.\n$BULLET$One hint for each of the eight [tsin_industrial_age_situations|e], shown while the situation runs.\n$BULLET$[tsin_electric_power_concept|e]: we know how to build power stations but have none yet.\n$BULLET$[tsin_treaty_port_concept|e]: we suffer [ShowModifier('tsin_unequal_treaty')].\n$BULLET$[tsin_movements_concept|e]: our strongest movement has reached 60 and agitates.\n$BULLET$[tsin_labor_conditions_concept|e]: our labor grievance is above 50.\n$BULLET$[tsin_bills_concept|e]: laws now change through bills, and we have not passed one yet.\n$BULLET$[tsin_stock_index_concept|e]: our stock market has crashed."

 game_concept_tsin_flavor_events_concept: "Events of the Age of Industry"
 game_concept_tsin_flavor_events_concept_desc: "The mod adds many [events|e]. Like the rest of its content they depend on the state of a country (its institutions, advances, buildings, laws, movements and literacy), never on its tag or a fixed date.\n\n#T Flavor events#!\nThese come from yearly rolls and share a budget: each country receives at most a set number per year. The game rule $rule_tsin_flavor_event_frequency$ sets it: Normal 3, Low 1, High 5, or Off.\n$BULLET$Economy: factory accidents, raw material shortages, financial panics, railway mania, industrial espionage, the rubber boom, the corn laws.\n$BULLET$Inventions and the agricultural revolution: one event per key advance.\n$BULLET$Society and the working class: chartism, strikes, schools, social insurance, child labour, suffrage, city life.\n$BULLET$Civic life, companies, military technology, art, gunboats in the harbour and the emancipation of the serfs.\n\n#T Events outside the budget#!\nEvents of [situations|e], [disasters|e] and [expeditions|e], the stages of [tsin_defensive_modernization_concept|e] and [tsin_national_unification_concept|e], [tsin_great_power_politics_concept|e], [tsin_frontier_concept|e], the science events of [tsin_culture_science_concept|e], the abolition of slavery and system notices always fire, even when flavor events are off."
