l_english:
 game_concept_tsin_mass_politics_concept: "Mass Politics and Finance"
 game_concept_tsin_mass_politics_concept_desc: "In the [ShowAgeName('age_7_industrialization')] politics leaves the court. Once a [country|e] embraces [ShowInstitutionName('tsin_mass_society')], the [estates|e], the popular [tsin_movements_concept|e] and [parliament|e] fight over the great questions of the age, while companies and stock exchanges become a power of their own.\n\nLaw and government:\n$BULLET$[tsin_social_laws_concept|e]: eleven new [laws|e] on labour, welfare, taxes, association, land, church, industry, trusts, money and the slave trade.\n$BULLET$[tsin_bills_concept|e]: with a parliament, these laws change only through bills.\n$BULLET$[tsin_bill_readings_concept|e]: what decides each reading of a bill, the debate events and the legislative session.\n$BULLET$[tsin_industrial_agendas_concept|e]: what the estates demand in parliament.\n$BULLET$[tsin_abolition_concept|e]: from the slave trade to emancipation.\n$BULLET$[tsin_government_reforms_concept|e]: six [government_reforms|e] of the age.\n\nMoney and business:\n$BULLET$[tsin_gold_standard_concept|e]: steady money against deflation.\n$BULLET$[tsin_corporations_concept|e]: great companies founded by [decision|e].\n$BULLET$[tsin_company_charters_concept|e]: monopoly, investment, expansion and colonial charters.\n$BULLET$[tsin_chairman_concept|e]: the man who runs our companies, and his ambitions.\n$BULLET$[tsin_trusts_concept|e]: tolerate the combines or break them up.\n$BULLET$[tsin_stock_index_concept|e]: share prices, booms and crashes.\n$BULLET$[tsin_estimated_gdp_concept|e]: the size and growth of the economy."
 game_concept_tsin_social_laws_concept: "Industrial Age Laws"
 game_concept_tsin_social_laws_concept_desc: "The Age of Industry adds eleven socioeconomic [laws|e]. Each is opened by an [advance|e] of the age, and each [policy|e] pleases some [estates|e] and angers others. Most policies also move [societal_values|e] slowly, and a few need a further advance, shown in their tooltip.\n\n$BULLET$[ShowLawName('tsin_labor_law')] ([ShowAdvanceName('tsin_labor_movement_advance')]): $tsin_unregulated_labor_policy$ raises [production_efficiency|e]; $tsin_factory_acts_policy$ and $tsin_labor_protection_policy$ protect workers and please the $peasants_estate$ at some cost in efficiency.\n$BULLET$[ShowLawName('tsin_welfare_law')] ([ShowAdvanceName('tsin_social_insurance_advance')]): $tsin_charity_relief_policy$, $tsin_poor_law_policy$ or $tsin_social_insurance_policy$. Relief paid by taxes lowers tax efficiency but lengthens lives.\n$BULLET$[ShowLawName('tsin_taxation_law')] ([ShowAdvanceName('tsin_mass_society_advance')]): $tsin_indirect_taxation_policy$, $tsin_income_tax_policy$ or $tsin_progressive_taxation_policy$. Direct taxes raise tax efficiency but anger the $burghers_estate$.\n$BULLET$[ShowLawName('tsin_assembly_law')] ([ShowAdvanceName('tsin_mass_communication_advance')]): $tsin_assembly_banned_policy$ strengthens the $crown_estate$; $tsin_free_association_policy$ weakens it and pleases commoners and burghers.\n$BULLET$[ShowLawName('tsin_land_reform_law')] ([ShowAdvanceName('tsin_mass_society_advance')]): $tsin_serfdom_retained_policy$ pleases the $nobles_estate$; $tsin_redemption_payments_policy$ and $tsin_full_emancipation_policy$ free the peasants and draw them to the towns, and full emancipation cuts noble [estate_power|e].\n$BULLET$[ShowLawName('tsin_church_state_law')] ([ShowAdvanceName('tsin_universal_education_advance')]): $tsin_established_church_policy$, $tsin_concordat_policy$ or $tsin_separation_of_church_and_state_policy$. The last two raise [literacy|e]; separation cuts clergy power.\n$BULLET$[ShowLawName('tsin_frontier_land_law')] ([ShowAdvanceName('tsin_railway_network_advance')]): $tsin_crown_land_sales_policy$ pleases the nobility; $tsin_homestead_policy$ pleases commoners and draws settlers ([tsin_frontier_concept|e]).\n$BULLET$[ShowLawName('tsin_industrial_investment_law')] ([ShowAdvanceName('tsin_industrial_capitalism_advance')]): who builds the factories, see [tsin_industrial_investment_concept|e].\n$BULLET$[ShowLawName('tsin_trust_law')] ([ShowAdvanceName('tsin_mass_politics_advance')]): see [tsin_trusts_concept|e].\n$BULLET$[ShowLawName('tsin_monetary_standard_law')] ([ShowAdvanceName('the_gold_standard')]): see [tsin_gold_standard_concept|e].\n$BULLET$[ShowLawName('tsin_slave_trade_law')] ([ShowAdvanceName('tsin_steam_age_advance')]): see [tsin_abolition_concept|e].\n\nIn a country with [ShowInstitutionName('tsin_mass_society')] and a [parliament|e], all eleven, together with [ShowLawName('press_law')], [ShowLawName('education_masses_law')], [ShowLawName('immigration_law')] and [ShowLawName('slavery_laws')], change only through [tsin_bills_concept|e]."
 game_concept_tsin_bills_concept: "Bills"
 game_concept_tsin_bills_concept_desc: "A bill is how a modern [parliament|e] changes the law. While a [country|e] has embraced [ShowInstitutionName('tsin_mass_society')] and has a parliament, the [policies|e] of the [tsin_social_laws_concept|e] and of [ShowLawName('press_law')], [ShowLawName('education_masses_law')], [ShowLawName('immigration_law')] and [ShowLawName('slavery_laws')] cannot be set in the law panel; their tooltip says the policy must pass parliament as a bill.\n\nTo change one, take the [decision|e] \"$tsin_propose_bill_decision$\", choose a field of law and then one of the policies we could enact now. Only one bill can be before parliament at a time.\n\nEvery three months the bill has a reading that either succeeds or stalls. Three successes pass it and the policy takes effect at once; three stalls kill it. What decides each reading is explained in [tsin_bill_readings_concept|e]. The \"$tsin_withdraw_bill_decision$\" decision drops the bill at any time and shows its current chance. After a bill is withdrawn or killed, no new bill can be tabled for two years.\n\nBills also come from outside the cabinet: some [events|e] and estate demands ([tsin_industrial_agendas_concept|e]) table a bill with a head start in the debates, replacing any bill already before parliament.\n\nWith the game rule \"$rule_tsin_bill_system$\" off, or without a parliament, policies change at once as in the base game."
 game_concept_tsin_bill_readings_concept: "Readings and Debates"
 game_concept_tsin_bill_readings_concept_desc: "Each reading of one of our [tsin_bills_concept|e] is a roll against its success chance. The chance starts at 35% and always stays between 5% and 85%:\n$BULLET$Each [estate|e] that prefers the bill's [policy|e] adds 40% of its [estate_power|e]; each estate that prefers another policy of the same [law|e] subtracts 30% of its power.\n$BULLET$Popular pressure helps reform bills ([tsin_movements_concept|e]): labour grievance and unionism push labour, welfare and association reforms (up to +20%), abolitionism pushes ending the slave trade or slavery (up to +20%), and liberalism pushes the other reforms (up to +15%). Bills that go the other way get no such help.\n$BULLET$Republics get +5%.\n$BULLET$Half of our [legislative_efficiency|e] is added.\n$BULLET$The debates add between -30% and +30%.\n\nAfter a reading that neither passes nor kills the bill, there is a 25% chance of a debate [event|e]:\n$BULLET$The Committee's Amendments: accept them (+15%, costs [political_influence|e]) or refuse (-5%).\n$BULLET$Whipping the Vote: whip the members (+20%, costs [stability|e]) or allow a free vote.\n$BULLET$Taking It to the Country: pay for a press campaign (+10%, costs [gold|e]) or stay out of the street.\n$BULLET$The Opposition Demands Withdrawal: withdraw the bill (a little stability, but two years without bills) or keep it (-10%).\n\nWhen parliament sits while a bill is before it, the [parliament_issue|e] \"$tsin_legislative_session$\" can be chosen. If its debate passes, the bill gains one successful reading and +10% in the debates; if it fails, -10%."
 game_concept_tsin_industrial_agendas_concept: "Industrial Age Agendas"
 game_concept_tsin_industrial_agendas_concept_desc: "In the Age of Industry the [estates|e] bring new demands to [parliament|e] as [parliament_agenda|e]. Agendas marked \"bill\" do not change the law at once: they table one of our [tsin_bills_concept|e] with a head start of +25% in the debates.\n\n$BULLET$$pa_tsin_repeal_corn_laws$ ($burghers_estate$): grain duties go, lowering the maximum tariff and drawing people to the towns; pleases burghers, angers the nobility.\n$BULLET$$pa_tsin_protect_grain$ ($nobles_estate$): the reverse.\n$BULLET$$pa_tsin_abolish_slavery$ ($clergy_estate$, abolitionism 50 or more): bill to outlaw slavery, see [tsin_abolition_concept|e].\n$BULLET$$pa_tsin_factory_acts$ ($peasants_estate$, under $tsin_unregulated_labor_policy$): bill for $tsin_factory_acts_policy$.\n$BULLET$$pa_tsin_restore_landlord_rights$ ($nobles_estate$, under $tsin_redemption_payments_policy$): bill for $tsin_serfdom_retained_policy$.\n$BULLET$$pa_tsin_restore_concordat$ ($clergy_estate$, under $tsin_separation_of_church_and_state_policy$): bill for $tsin_concordat_policy$.\n$BULLET$$pa_tsin_freedom_of_association$ ($burghers_estate$, liberalism 50 or more): bill for $tsin_free_association_policy$; liberalism falls by 20.\n$BULLET$$pa_tsin_social_insurance$ ($peasants_estate$, strong socialism or unionism): bill for $tsin_social_insurance_policy$; socialism falls by 20.\n$BULLET$$pa_tsin_railway_charters$ ($burghers_estate$): cheaper railways for ten years. Never asked under $tsin_railway_nationalization$.\n$BULLET$$pa_tsin_factory_inspection$ ($peasants_estate$, labour grievance 30 or more): grievance falls by 10.\n$BULLET$$pa_tsin_ten_hour_day$ ($peasants_estate$, with the $tsin_union_recognition$ privilege and grievance 40 or more): grievance falls by 15; workers live longer but produce less.\n\nSee [tsin_movements_concept|e] and [tsin_labor_conditions_concept|e] for the movements and the grievance behind these demands."
 game_concept_tsin_abolition_concept: "Abolition"
 game_concept_tsin_abolition_concept_desc: "In the Age of Industry [slavery|e] ends in two steps: first the trade, then slavery itself.\n$BULLET$[ShowLawName('tsin_slave_trade_law')], opened by [ShowAdvanceName('tsin_steam_age_advance')]: $tsin_slave_trade_suppressed_policy$ bans the import and export of slaves, but those already enslaved stay so. The law disappears once slavery is outlawed.\n$BULLET$The base game's [ShowLawName('slavery_laws')]: its $slavery_outlawed$ policy ends slavery itself.\nIn a parliamentary mass society both steps are [tsin_bills_concept|e].\n\nThe abolitionist movement (0-100), one of the [tsin_movements_concept|e], grows every year while we keep slavery: faster with mass society, mass communication, a free press, a suppressed slave trade and humanist [societal_values|e]; slower where slaves are more than a tenth of the population or the abolitionists are suppressed. It raises the chance of abolition bills.\n$BULLET$At 40, the Abolitionist Petition arrives: receive the petitioners (movement +10), table a bill to suppress the slave trade, or silence the agitators (movement -20, $STATIC_MODIFIER_NAME_tsin_abolitionists_suppressed$, less [stability|e]).\n$BULLET$At 50, the clergy may demand $pa_tsin_abolish_slavery$ in [parliament|e]. A slaveholding republic split between slave and free regions risks the [tsin_secession_crisis_concept|e].\n\nWhen slavery is outlawed, the slaves still have to be freed. The Emancipation event decides how: at once (every slave [pop|e] becomes peasants, but $STATIC_MODIFIER_NAME_tsin_emancipation_shock$ lowers production for a while), by compensating the owners (costs [gold|e]), or after a six-year $STATIC_MODIFIER_NAME_tsin_apprenticeship_system$. A country that has banned the trade but still has slave forts on its coast is asked to deal with them."
 game_concept_tsin_government_reforms_concept: "Industrial Age Reforms"
 game_concept_tsin_government_reforms_concept_desc: "The Age of Industry adds six [government_reforms|e]. They appear in the column of the current [age|e], like the reforms of earlier ages, and most need an [advance|e].\n\n$BULLET$$tsin_factory_inspectorate$ ([ShowAdvanceName('tsin_labor_movement_advance')]): pleases the commoners and raises laborer [literacy|e], for a slight loss of [production_efficiency|e].\n$BULLET$$tsin_civil_service_examinations$ ([ShowAdvanceName('tsin_universal_education_advance')]): better [cabinet|e] efficiency and [control|e]; the nobility dislike it.\n$BULLET$$tsin_universal_conscription$: more [manpower|e] and faster reinforcement; the commoners dislike it.\n$BULLET$$tsin_railway_nationalization$ ([ShowAdvanceName('tsin_railway_network_advance')]): cheaper railways; the burghers dislike it and stop asking for railway charters.\n$BULLET$$tsin_national_statistics_bureau$ ([ShowAdvanceName('tsin_statistical_bureau')]): cheaper policy changes, better cabinet efficiency and control, and a detailed economic report ([tsin_estimated_gdp_concept|e]).\n$BULLET$$tsin_national_laboratory$ ([ShowAdvanceName('tsin_experimental_science_advance')]): faster research and institution growth and a higher target for higher education ([tsin_education_ladder_concept|e]); the clergy dislike it.\n\nMost of them also push [societal_values|e]: the inspectorate towards communalism, the examinations and nationalization towards centralization, conscription towards quantity."
 game_concept_tsin_gold_standard_concept: "Gold Standard"
 game_concept_tsin_gold_standard_concept_desc: "Once the [advance|e] [ShowAdvanceName('the_gold_standard')] is researched, the [ShowLawName('tsin_monetary_standard_law')] law decides what backs our money.\n$BULLET$$tsin_bimetallism_policy$, the starting policy: slight monthly [inflation|e]; pleases the $peasants_estate$.\n$BULLET$$tsin_gold_standard_policy$: inflation falls each month, loan [interest|e] is lower and gold output rises by 25%; pleases the $burghers_estate$ but angers the commoners.\n\nOn the gold standard, share prices swing less: large quarterly moves become rarer ([tsin_stock_index_concept|e]). The price is deflation: when [ShowSituationName('tsin_long_depression')] begins, gold-standard countries suffer $STATIC_MODIFIER_NAME_tsin_gold_standard_deflation$ for five years, with lower [production_efficiency|e] and angrier commoners.\n\nIn a parliamentary mass society the standard changes only through [tsin_bills_concept|e], in the field \"Taxation, money and association\"."
 game_concept_tsin_corporations_concept: "Corporations"
 game_concept_tsin_corporations_concept_desc: "Corporations are great industrial companies that a [country|e] founds by [decision|e]. Each permanently raises the output of its trade, at the cost of slightly higher [buildings|e] upkeep:\n$BULLET$Steel ([ShowAdvanceName('tsin_bessemer_process_advance')]): [ShowGoodsName('steel')] and [ShowGoodsName('iron')].\n$BULLET$Machinery ([ShowAdvanceName('tsin_machine_works_advance')]): [ShowGoodsName('tsin_engines')] and [ShowGoodsName('tools')].\n$BULLET$Textile ([ShowAdvanceName('tsin_mechanized_textile_mill_advance')]): [ShowGoodsName('cloth')].\n$BULLET$Chemical ([ShowAdvanceName('tsin_improved_fertilizer_advance')]): [ShowGoodsName('tsin_fertilizer')] and [ShowGoodsName('tsin_explosives')].\n$BULLET$Railway ([ShowAdvanceName('tsin_railway_network_advance')]): cheaper railways and faster road building.\n$BULLET$Farm machinery ([ShowAdvanceName('tsin_mechanical_reaper_advance')]): [ShowGoodsName('tsin_farm_machinery')] and a little [ShowGoodsName('wheat')].\n\nFounding costs [gold|e], and only a few companies can be held at once: one, plus one with [ShowAdvanceName('tsin_stock_exchange_advance')], one under the mixed or private investment policy and one with the expansion charter, minus one under the antitrust law, never fewer than one. Each founding decision shows the limit.\n\nA new company's headquarters is the [location|e] with most of its works, and its shares start at 100. The first company opens a stock market, which brings share prices ([tsin_stock_index_concept|e]), [tsin_company_charters_concept|e] and a [tsin_chairman_concept|e]. The decision \"Dissolve Industrial Companies\" removes all companies together with their bonuses, upkeep and charters.\n\nThe $mapmode_tsin_corporations_name$ map mode shows our headquarters and company works."
 game_concept_tsin_company_charters_concept: "Company Charters"
 game_concept_tsin_company_charters_concept_desc: "Charters are privileges the state grants its [tsin_corporations_concept|e] by [decision|e]. Each costs [gold|e] and lasts until it is revoked. The monopoly, investment and expansion charters need a stock market, and only one of them can be held at a time, two with [ShowAdvanceName('tsin_stock_exchange_advance')].\n$BULLET$Monopoly Charter: more [production_efficiency|e] and burgher power, and share prices jump by 10%; the commoners are less satisfied. Not allowed under $tsin_antitrust_policy$.\n$BULLET$Investment Charter: faster factory building, lower loan [interest|e], and share prices are more likely to rise.\n$BULLET$Industrial Expansion Charter (needs the stock exchange): one more company is allowed and burgher power grows, but [buildings|e] upkeep rises slightly.\n$BULLET$Colonial Charter Company: for countries taking part in [ShowSituationName('tsin_scramble_for_colonies')], outside the limit. Cheaper [colonial_charter|e], cheaper colonial upkeep and more colonial migrants, but it costs [stability|e].\n\n\"Revoke Company Charters\" takes back the monopoly, investment and expansion charters, and share prices fall by 5%. Dissolving the companies takes back every charter."
 game_concept_tsin_chairman_concept: "Company Chairman"
 game_concept_tsin_chairman_concept_desc: "As long as we have [tsin_corporations_concept|e], their boards are led by a chairman, a $burghers_estate$ [character|e]. When there is none, or he dies, the boards choose a new one: confirm their choice (pleases the burghers) or seat a state commissioner (more [stability|e], but the burghers are displeased and shares fall by 5%).\n\nHis [adm|e] moves the market: 70 or more makes share prices more likely to rise, below 50 more likely to fall ([tsin_stock_index_concept|e]).\n\nEach year the chairman may cause one of these [events|e]:\n$BULLET$The Chairman Wants a Title (once): ennoble him, which brings [prestige|e] and pleases the burghers but not the nobility, or refuse.\n$BULLET$A Loan from the Company: gold now, but $STATIC_MODIFIER_NAME_tsin_corporate_loan$ raises interest for ten years.\n$BULLET$An Endowed Chair (needs a university): $STATIC_MODIFIER_NAME_tsin_corporate_endowment$ for twenty years, with more burgher power and production efficiency, or tax his fortune instead.\n$BULLET$A Bribery Scandal (shares fall by 10%): prosecute him, so the boards choose a new chairman, or hush it up with $STATIC_MODIFIER_NAME_tsin_corporate_cover_up$ for five years, which also drags shares down.\n$BULLET$The Chairman Runs for Parliament (needs a [parliament|e], once): $STATIC_MODIFIER_NAME_tsin_corporate_lobby$ for twenty years, or keep business out of politics."
 game_concept_tsin_trusts_concept: "Trusts and Antitrust"
 game_concept_tsin_trusts_concept_desc: "When a few great [tsin_corporations_concept|e] fix prices and buy up their rivals, they become trusts. The [ShowLawName('tsin_trust_law')] law, opened by [ShowAdvanceName('tsin_mass_politics_advance')], decides how the state treats them:\n$BULLET$$tsin_trusts_tolerated_policy$: a small [production_efficiency|e] bonus; pleases the $burghers_estate$.\n$BULLET$$tsin_antitrust_policy$: pleases the commoners and angers the burghers. One fewer company is allowed, the labour grievance target falls by 3 ([tsin_labor_conditions_concept|e]), and no monopoly charter can be granted ([tsin_company_charters_concept|e]).\n\nFrom 1880, a country with at least two companies and no antitrust law may face the Trust Question, at most once in fifteen years. Breaking up the trusts tables an antitrust bill with a head start ([tsin_bills_concept|e]), brings $STATIC_MODIFIER_NAME_tsin_trust_busting$ for five years and lowers labour grievance by 5. Siding with the companies pleases the burghers but raises grievance by 5 and socialism by 3."
 game_concept_tsin_stock_index_concept: "Stock Index"
 game_concept_tsin_stock_index_concept_desc: "Each of our [tsin_corporations_concept|e] has a share price that starts at 100 and moves once a quarter, between 10 and 1000. Whether it rises depends first on the [market_price|e] of the company's [goods|e] in our capital's [market|e]: well above the usual price makes a rise likely, well below makes a fall likely.\n$BULLET$Down: financial panic, [ShowSituationName('tsin_long_depression')], a recent crash, labour grievance of 60 or more, a corporate cover-up, a chairman with poor administration.\n$BULLET$Up: higher education of 20 or more, a speculative boom, the investment charter, an able [tsin_chairman_concept|e].\nEach move is between 3% and 15%; on the [tsin_gold_standard_concept|e] large moves are rarer.\n\nThe national index is the mean of our share prices weighted by the size of each company, and it is compared with its mean over the last two years:\n$BULLET$Above 1.5 times that mean: Speculative Fever. Let the market run ($STATIC_MODIFIER_NAME_tsin_speculative_boom$ for two years: faster factory building, lower [interest|e], rising shares) or raise the discount rate (shares fall by 10%, more [stability|e]).\n$BULLET$Below 60% of the mean, or by chance during a boom: the Market Crashes. Shares fall by 30% and $STATIC_MODIFIER_NAME_tsin_stock_crash$ lasts three years. Rescue the banks (costs [gold|e]), let the weak houses fail (financial panic), or close the exchange for a year (prices stand still). A crash anywhere can bring the Long Depression on early.\n\nThe \"Stock Report\" decision lists every share price, our index and its two-year mean, the world index (the mean of every national index) and the total value of our companies."
 game_concept_tsin_estimated_gdp_concept: "Estimated GDP"
 game_concept_tsin_estimated_gdp_concept_desc: "The game has no GDP, so the mod estimates one for every [country|e] each year: the [tax_base|e] of its cities and towns, its trade and tax [income|e] and the subsistence output of its population, multiplied by a productivity factor from secondary and higher education ([tsin_education_ladder_concept|e]). It is only a rough figure in ducats, made for comparing countries and following trends. GDP per capita and growth over the last year are recorded with it.\n\nWhere to see it:\n$BULLET$The $mapmode_tsin_gdp_per_capita_name$ map mode colours each country by its GDP per capita against last year's highest in the world.\n$BULLET$The \"Economic Statistics Report\" [decision|e], available after the first yearly estimate, reports GDP, GDP per capita, growth, the share of factory workers and the [tsin_stock_index_concept|e].\n$BULLET$With the $tsin_national_statistics_bureau$ reform ([tsin_government_reforms_concept|e]) the report becomes detailed: population, the productivity factor, the three education rates, labour grievance, the two-year mean of the stock index, the world index and the value of our companies.\n$BULLET$With the game rule \"$rule_tsin_economy_log$\" on, players, [great_powers|e], countries with a stock market and countries with the bureau write their statistics to the game log once a year, for charting with tools/econ_report.py."
