l_english:

 tsin_urban_planning_advance: "Urban Planning"
 tsin_urban_planning_advance_desc: "Broad boulevards, parks and regular blocks replace old walls and alleys, and cities can take in many more people."
 tsin_modern_sewerage_advance: "Modern Sewerage"
 tsin_modern_sewerage_advance_desc: "Brick sewers carry waste out of the city, and cholera and typhoid have become noticeably rarer."
 tsin_mass_consumption_advance: "Mass Consumption"
 tsin_mass_consumption_advance_desc: "With department stores, advertising and fixed prices, furniture, newspapers and magazines have become part of everyday middle-class life."
 tsin_universal_education_advance: "Universal Education"
 tsin_universal_education_advance_desc: "The state builds a school in every village and teaches children to read and count."
 tsin_vocational_education_advance: "Vocational Education"
 tsin_vocational_education_advance_desc: "Trade and technical schools train workers who know how to handle machines."
 tsin_mass_communication_advance: "Mass Communication"
 tsin_mass_communication_advance_desc: "Cheap newspapers and the telegraph spread the news across the whole country within a day."
 tsin_labor_movement_advance: "Labour Movement"
 tsin_labor_movement_advance_desc: "Workers form friendly societies and trade unions and begin to bargain with employers over wages and hours."
 tsin_social_insurance_advance: "Social Insurance"
 tsin_social_insurance_advance_desc: "Insurance against sickness, accidents and old age makes workers' lives less precarious."

 tsin_labor_law: "Labour Law"
 tsin_labor_law_desc: "This determines how the age, working hours and safety of factory workers are regulated."
 tsin_labor_law_CATEGORY: "SOCIOECONOMIC_LAW_CATEGORY"
 tsin_unregulated_labor_policy: "Unregulated Labour"
 tsin_unregulated_labor_policy_desc: "Terms of work are left to employers and workers. Factories run cheaply, but workers grow resentful."
 tsin_factory_acts_policy: "Factory Acts"
 tsin_factory_acts_policy_desc: "Child labour is restricted and the working day is capped."
 tsin_labor_protection_policy: "Labour Protection"
 tsin_labor_protection_policy_desc: "Factory inspectors enforce safety and trade unions may bargain. Requires [ShowAdvanceName('tsin_social_insurance_advance')]."
 tsin_welfare_law: "Welfare Law"
 tsin_welfare_law_desc: "This determines who cares for the poor and the sick."
 tsin_welfare_law_CATEGORY: "SOCIOECONOMIC_LAW_CATEGORY"
 tsin_charity_relief_policy: "Charitable Relief"
 tsin_charity_relief_policy_desc: "Relief is left to the church and charities."
 tsin_poor_law_policy: "Poor Law"
 tsin_poor_law_policy_desc: "Parishes and workhouses provide minimal relief paid for by taxes."
 tsin_social_insurance_policy: "Social Insurance"
 tsin_social_insurance_policy_desc: "The state runs sickness, accident and old-age insurance."
 tsin_taxation_law: "Direct Taxation"
 tsin_taxation_law_desc: "This determines whether the state relies on indirect taxes or taxes incomes directly."
 tsin_taxation_law_CATEGORY: "SOCIOECONOMIC_LAW_CATEGORY"
 tsin_indirect_taxation_policy: "Indirect Taxation"
 tsin_indirect_taxation_policy_desc: "Customs and excise duties provide most of the revenue."
 tsin_income_tax_policy: "Income Tax"
 tsin_income_tax_policy_desc: "A flat income tax is levied above a threshold."
 tsin_progressive_taxation_policy: "Progressive Taxation"
 tsin_progressive_taxation_policy_desc: "Higher incomes pay higher rates. Requires [ShowAdvanceName('tsin_mass_communication_advance')]."
 tsin_assembly_law: "Association and Assembly"
 tsin_assembly_law_desc: "This determines whether citizens may form clubs, associations and parties."
 tsin_assembly_law_CATEGORY: "SOCIOECONOMIC_LAW_CATEGORY"
 tsin_assembly_banned_policy: "Assemblies Banned"
 tsin_assembly_banned_policy_desc: "All unlicensed gatherings are forbidden."
 tsin_licensed_associations_policy: "Licensed Associations"
 tsin_licensed_associations_policy_desc: "Only associations licensed by the police may operate."
 tsin_free_association_policy: "Freedom of Association"
 tsin_free_association_policy_desc: "Anyone may form associations and parties. Requires [ShowAdvanceName('tsin_labor_movement_advance')]."
 tsin_land_reform_law: "Land Reform"
 tsin_land_reform_law_desc: "This determines whether serfdom is kept or the peasants are freed."
 tsin_land_reform_law_CATEGORY: "SOCIOECONOMIC_LAW_CATEGORY"
 tsin_serfdom_retained_policy: "Serfdom Retained"
 tsin_serfdom_retained_policy_desc: "Peasants remain bound to their lord's land and owe labour services."
 tsin_redemption_payments_policy: "Emancipation with Redemption"
 tsin_redemption_payments_policy_desc: "Peasants are freed but must pay for their land over many years."
 tsin_full_emancipation_policy: "Full Emancipation"
 tsin_full_emancipation_policy_desc: "Peasants gain freedom and land without compensation. The nobility's power is sharply reduced."
 tsin_church_state_law: "Church and State"
 tsin_church_state_law_desc: "This determines the relationship between the state and the church."
 tsin_church_state_law_CATEGORY: "SOCIOECONOMIC_LAW_CATEGORY"
 tsin_established_church_policy: "Established Church"
 tsin_established_church_policy_desc: "The established church runs schools and marriages under state protection."
 tsin_concordat_policy: "Concordat"
 tsin_concordat_policy_desc: "State and church divide their powers by treaty."
 tsin_separation_of_church_and_state_policy: "Separation of Church and State"
 tsin_separation_of_church_and_state_policy_desc: "The state is neutral in religion and education is secularised."

 tsin_slave_trade_law: "Slave Trade"
 tsin_slave_trade_law_desc: "This determines whether the buying and selling of slaves is allowed, separately from slavery itself. The law disappears once slavery is outlawed."
 tsin_slave_trade_law_CATEGORY: "SOCIOECONOMIC_LAW_CATEGORY"
 tsin_slave_trade_tolerated_policy: "Slave Trade Tolerated"
 tsin_slave_trade_tolerated_policy_desc: "The slave trade is treated like any other trade."
 tsin_slave_trade_suppressed_policy: "Slave Trade Suppressed"
 tsin_slave_trade_suppressed_policy_desc: "The import and export of slaves is banned and the navy hunts slave ships. Existing slaves remain enslaved."
 pa_tsin_abolish_slavery: "Abolish Slavery"
 pa_tsin_abolish_slavery_simple: "Abolish Slavery"
 pa_tsin_abolish_slavery_desc: "Outlaw the ownership of slaves. Only proposed when the abolitionist movement is strong."
 STATIC_MODIFIER_NAME_tsin_abolitionists_suppressed: "Abolitionists Suppressed"
 STATIC_MODIFIER_NAME_tsin_emancipation_shock: "Shock of Emancipation"
 STATIC_MODIFIER_NAME_tsin_apprenticeship_system: "Apprenticeship Period"
 tsin_abolition.emancipate_tt: "Every slave pop in our country becomes peasants."
 tsin_abolition.1.title: "The Abolitionist Petition"
 tsin_abolition.1.desc: "A petition signed by tens of thousands has arrived. Demands to end the slave trade and slavery itself are spreading through the churches and the newspapers."
 tsin_abolition.1.a: "Receive the petitioners."
 tsin_abolition.1.b: "Order the navy to stop the slave ships."
 tsin_abolition.1.c: "Silence the agitators."
 tsin_abolition.2.title: "Emancipation"
 tsin_abolition.2.desc: "Slavery has been outlawed, yet slaves still remain on the plantations and in the great houses. We must decide how to free them."
 tsin_abolition.2.a: "Free them at once."
 tsin_abolition.2.b: "Compensate the owners and free them."
 tsin_abolition.2.c: "Begin with an apprenticeship period."
 tsin_abolition.2.c.tt: "In six years every slave pop becomes peasants."
 tsin_abolition.3.title: "The Apprenticeship Ends"
 tsin_abolition.3.desc: "The promised apprenticeship is over. From today, every remaining slave is free."
 tsin_abolition.3.a: "A day of freedom."
 tsin_abolition.4.title: "Slave Forts on Our Coast"
 tsin_abolition.4.desc: "Although we have banned the slave trade, foreign merchants' slave forts still stand on our coast."
 tsin_abolition.4.a: "Deal with the forts."
 tsin_abolition.4.b: "Look the other way."
 tsin_factory_inspectorate: "Factory Inspectorate"
 tsin_factory_inspectorate_desc: "State inspectors check working hours and safety in the factories. Owners complain, but workers feel the protection of the law for the first time."
 tsin_civil_service_examinations: "Civil Service Examinations"
 tsin_civil_service_examinations_desc: "Office is now won by examination rather than by family. Administration grows more capable, but the nobility loses an old privilege."
 tsin_universal_conscription: "Universal Conscription"
 tsin_universal_conscription_desc: "Every adult man serves in the army for a set term and then remains in the reserve."
 tsin_railway_nationalization: "Railway Nationalization"
 tsin_railway_nationalization_desc: "The state owns and operates the trunk lines. Private railway companies do not welcome the decision."
 tsin_chambers_of_commerce: "Chambers of Commerce"
 tsin_chambers_of_commerce_desc: "Merchants and manufacturers advise the government through legally recognized chambers and coordinate the founding of factories."
 tsin_officer_corps_monopoly: "Officer Corps Monopoly"
 tsin_officer_corps_monopoly_desc: "High command is open only to sons of noble families."
 tsin_church_school_network: "Church School Network"
 tsin_church_school_network_desc: "Primary education is left to the church. This privilege does not appear under separation of church and state."
 tsin_mutual_aid_societies: "Mutual Aid Societies"
 tsin_mutual_aid_societies_desc: "The state recognizes societies in which workers pool dues to protect themselves against sickness and accidents."
 pa_tsin_factory_acts: "Pass the Factory Acts"
 pa_tsin_factory_acts_simple: "Pass the Factory Acts"
 pa_tsin_factory_acts_desc: "Replace the unregulated labor policy with the factory acts policy."
 pa_tsin_restore_landlord_rights: "Restore Landlord Rights"
 pa_tsin_restore_landlord_rights_simple: "Restore Landlord Rights"
 pa_tsin_restore_landlord_rights_desc: "Undo redemption payments and return to the serfdom retained policy."
 pa_tsin_railway_charters: "Railway Company Charters"
 pa_tsin_railway_charters_simple: "Railway Company Charters"
 pa_tsin_railway_charters_desc: "Grant private railway companies construction charters for ten years. Not proposed if the railways have been nationalized."
 pa_tsin_restore_concordat: "Restore the Concordat"
 pa_tsin_restore_concordat_simple: "Restore the Concordat"
 pa_tsin_restore_concordat_desc: "Undo the separation of church and state and return to the concordat policy."
 STATIC_MODIFIER_NAME_tsin_railway_charters_granted: "Railway Company Charters"
 STATIC_MODIFIER_NAME_tsin_liberalism_agitation: "Liberal Agitation"
 STATIC_MODIFIER_NAME_tsin_nationalism_agitation: "Nationalist Fervor"
 STATIC_MODIFIER_NAME_tsin_labor_unionism_agitation: "Labor Agitation"
 STATIC_MODIFIER_NAME_tsin_socialism_agitation: "Socialist Agitation"
 STATIC_MODIFIER_NAME_tsin_womens_suffrage_agitation: "Women's Suffrage Campaign"
 pa_tsin_freedom_of_association: "Freedom of Association"
 pa_tsin_freedom_of_association_simple: "Freedom of Association"
 pa_tsin_freedom_of_association_desc: "Enact the free association policy as the liberals demand. The liberal movement cools down."
 pa_tsin_social_insurance: "Introduce Social Insurance"
 pa_tsin_social_insurance_simple: "Introduce Social Insurance"
 pa_tsin_social_insurance_desc: "Enact the social insurance policy as the workers demand. The socialist movement cools down."
 tsin_springtime_of_nations: "Springtime of Nations"
 tsin_springtime_of_nations_desc: "Liberals, nationalists and socialists have raised barricades in many capitals at once. Each government must decide whether to grant a constitution or restore order by force. The wave subsides after three years."
 tsin_springtime_of_nations_wave_spent: "The Wave Subsides"
 tsin_springtime_of_nations_affected_tt: "The owner of this [location|e] is in revolution."
 LEGEND_KEY_TSIN_SPRINGTIME_AFFECTED: "Country in revolution"
 LEGEND_KEY_TSIN_SPRINGTIME_RESTLESS: "Country with strong movements"
 hint_tsin_springtime_of_nations: "[GetSituationByKey('tsin_springtime_of_nations').GetNameWithNoTooltip]"
 hint_tsin_springtime_of_nations_hint_text: "The [GetSituationByKey('tsin_springtime_of_nations').GetName] has begun. Barricades have gone up in countries with strong liberal, nationalist or socialist movements.\n\n#T Suggested actions:#!\n@arrow_bonus_tier_3! Granting a constitution calms the movements but angers the nobility.\n@arrow_bonus_tier_2! Repression protects the crown, but the movements return stronger once the wave is over."
 hint_tsin_springtime_of_nations_diplomatic: "\"A revolution next door does not stop at the border.\""
 hint_tsin_springtime_of_nations_administrative: "\"A concession is rarely the last one.\""
 hint_tsin_springtime_of_nations_military: "\"Soldiers may refuse to fire on their fellow citizens.\""
 STATIC_MODIFIER_NAME_tsin_springtime_barricades: "Barricades"
 STATIC_MODIFIER_NAME_tsin_springtime_constitution: "March Constitution"
 STATIC_MODIFIER_NAME_tsin_springtime_reaction: "Reaction"
 tsin_springtime.1.title: "The Barricades"
 tsin_springtime.1.desc: "Barricades have gone up in every street of the capital. The crowds demand a constitution, a free press and national rights. The same is happening in the neighboring countries."
 tsin_springtime.1.a: "Grant a constitution."
 tsin_springtime.1.b: "Restore order by force."
 tsin_springtime.1.c: "Wait and see."
 tsin_springtime.2.title: "Street Fighting in the Capital"
 tsin_springtime.2.desc: "Citizens' committees hold several districts of the capital. They want to negotiate, but the officers are waiting for orders to attack."
 tsin_springtime.2.a: "Negotiate with the committees."
 tsin_springtime.2.b: "Send in the troops."
 tsin_springtime.10.title: "The End of the Spring"
 tsin_springtime.10.desc: "The revolutionary wave has subsided. The barricades are gone, but the promises and the wounds of those days remain."
 tsin_springtime.10.a: "The constitution stands."
 tsin_springtime.10.b: "Order is restored, but the grudges remain."
 tsin_springtime.10.c: "The storm has passed."
 tsin_great_hunger: "The Great Hunger"
 tsin_great_hunger_desc: "Blight has swept the fields and starving peasants are leaving their villages. In every port, people queue for the emigrant ships. The famine lasts at least four years and ends only once the blight is gone."
 STATIC_MODIFIER_NAME_tsin_crop_blight: "Crop Blight"
 STATIC_MODIFIER_NAME_tsin_famine_relief: "Famine Relief"
 STATIC_MODIFIER_NAME_tsin_food_exports_continue: "Food Exports Continue"
 STATIC_MODIFIER_NAME_tsin_mass_emigration: "Mass Emigration"
 STATIC_MODIFIER_NAME_tsin_agricultural_reform: "Agricultural Reform"
 tsin_hunger.1.title: "Blight in the Fields"
 tsin_hunger.1.desc: "The leaves of the staple crop are blackening and the harvest is rotting in the ground. The peasants say this year's yield will not reach half of the usual."
 tsin_hunger.1.a: "Heaven is indifferent."
 tsin_hunger.2.title: "Famine"
 tsin_hunger.2.desc: "Failed harvests have spread hunger across the countryside. Even so, landlords and merchants keep selling grain abroad."
 tsin_hunger.2.a: "Buy grain abroad."
 tsin_hunger.2.b: "The market must not be disturbed."
 tsin_hunger.2.c: "Give the hungry public works."
 tsin_hunger.3.title: "The Emigrant Ships"
 tsin_hunger.3.desc: "Countless families are selling the last of their belongings to buy passage across the sea."
 tsin_hunger.3.a: "Let them go."
 tsin_hunger.3.b: "Pay their passage to our colonies."
 tsin_hunger.4.title: "Evictions and Food Riots"
 tsin_hunger.4.desc: "Tenants who cannot pay rent are being evicted. An angry crowd has stormed a grain store."
 tsin_hunger.4.a: "Side with the tenants."
 tsin_hunger.4.b: "Uphold the landlords' rights."
 tsin_hunger.10.title: "After the Hunger"
 tsin_hunger.10.desc: "The famine is over, but the villages stand empty. Those who remain will remember it for a long time."
 tsin_hunger.10.a: "Never again."
 tsin_hunger.10.b: "Reform agriculture."
 STATIC_MODIFIER_NAME_tsin_strike_broken: "Strike Broken"
 STATIC_MODIFIER_NAME_tsin_state_schools: "State Schools"
 STATIC_MODIFIER_NAME_tsin_sanitary_reform: "Sanitary Reform"
 STATIC_MODIFIER_NAME_tsin_quarantine: "Quarantine"
 tsin_society.10.title: "The People's Charter"
 tsin_society.10.desc: "Millions have signed a petition demanding a vote for every adult man, the secret ballot and annual elections. The cart carrying it has stopped in front of the parliament."
 tsin_society.10.a: "Let parliament debate it."
 tsin_society.10.b: "Reject the petition."
 tsin_society.10.c: "Arrest the organizers."
 tsin_society.20.title: "The Strike"
 tsin_society.20.desc: "Factory workers in [tsin_strike_location.GetName] have laid down their tools, demanding higher wages and shorter hours. The owners call for the government to intervene."
 tsin_society.20.a: "Recognize the union."
 tsin_society.20.b: "Break the strike."
 tsin_society.20.c: "Offer arbitration."
 tsin_society.30.title: "A Public Education Act"
 tsin_society.30.desc: "More and more voices say that every child must learn to read. We must decide whether the state builds the schools or leaves them to the church as before."
 tsin_society.30.a: "A state school in every parish."
 tsin_society.30.b: "Leave it to the churches."
 tsin_society.40.title: "Social Insurance"
 tsin_society.40.desc: "The chancellor argues that the state must insure workers against sickness and old age before the socialists win them over."
 tsin_society.40.a: "Take the wind out of the socialists' sails."
 tsin_society.40.b: "Charity is enough."
 tsin_society.50.title: "Children in the Mills"
 tsin_society.50.desc: "An inspector's report finds eight-year-olds working twelve-hour days in the spinning mills. The newspapers are racing to print it."
 tsin_society.50.a: "Pass a factory act."
 tsin_society.50.b: "The mills need hands."
 tsin_society.60.title: "Epidemic in the Slums"
 tsin_society.60.desc: "Disease is spreading through crowded tenements and fouled wells. The doctors say we need sewers and clean water."
 tsin_society.60.a: "Build sewers and waterworks."
 tsin_society.60.b: "Quarantine the districts."
 tsin_society.60.c: "It is the miasma."
 tsin_society.70.title: "Votes for Women"
 tsin_society.70.desc: "Suffragists are marching through the streets. They demand the right to vote, at least in local elections."
 tsin_society.70.a: "Grant votes in local elections."
 tsin_society.70.b: "Not in our lifetime."
