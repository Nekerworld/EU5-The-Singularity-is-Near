l_english:

 tsin_frontier_land_law: "Frontier Land"
 tsin_frontier_land_law_desc: "This determines who receives the empty land of the country. Selling crown land helps landlords and the treasury; homesteads help settlers."
 tsin_frontier_land_law_CATEGORY: "SOCIOECONOMIC_LAW_CATEGORY"
 tsin_crown_land_sales_policy: "Crown Land Sales"
 tsin_crown_land_sales_policy_desc: "Empty land is auctioned off, mostly to great landowners and speculators."
 tsin_homestead_policy: "Homestead Act"
 tsin_homestead_policy_desc: "Settlers who farm a plot for a few years receive it free. Thinly settled core [locations|e] attract migrants."
 STATIC_MODIFIER_NAME_tsin_homestead_frontier: "Homestead Frontier"
 STATIC_MODIFIER_NAME_tsin_gold_rush_boom: "Gold Rush"
 STATIC_MODIFIER_NAME_tsin_gold_rush_licensed: "Licensed Diggings"
 STATIC_MODIFIER_NAME_tsin_boomtown: "Boomtown"
 STATIC_MODIFIER_NAME_tsin_gold_inflation: "Gold Inflation"
 tsin_frontier.10.title: "Gold in the Creek"
 tsin_frontier.10.desc: "A sawmill hand at [tsin_gold_field.GetName] has fished glittering flakes out of the creek. Within weeks the rumour has reached every port, and ships and wagons are full of people seeking gold."
 tsin_frontier.10.a: "Let the prospectors come."
 tsin_frontier.10.b: "Licence the diggings to the crown."
 tsin_frontier.20.title: "The Boomtown"
 tsin_frontier.20.desc: "The tent camp at [tsin_gold_field.GetName] now has saloons, banks and a newspaper. But the law is still in the hands of gunmen and vigilantes."
 tsin_frontier.20.a: "Incorporate the town with courts and a mint."
 tsin_frontier.20.b: "Let the miners keep their own law."
 tsin_frontier.30.title: "Gold Floods the Market"
 tsin_frontier.30.desc: "Newly mined gold is pouring in and prices are rising. Merchants welcome it, but those who live on fixed wages and rents are feeling the pinch."
 tsin_frontier.30.a: "Mint it all."
 tsin_frontier.30.b: "Keep it in the vaults as reserves."
 tsin_frontier.30.b.tt: "Gold reserves help in adopting the gold standard."
