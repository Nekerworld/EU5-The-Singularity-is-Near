l_english:

 tsin_electricity: "Electricity"
 MODIFIER_TYPE_NAME_can_extract_tsin_electricity: "Can Extract Electricity"
 MODIFIER_TYPE_DESC_can_extract_tsin_electricity: "This allows the extraction of [ShowGoodsName('tsin_electricity')] by allowing an [rgo|e] in a [location|e]."
 MODIFIER_TYPE_NAME_ban_exports_of_tsin_electricity: "Ban Exports of $tsin_electricity$"
 MODIFIER_TYPE_DESC_ban_exports_of_tsin_electricity: "This blocks the [export|e] of [ShowGoodsName('tsin_electricity')] from all [markets|e] that a [country|e] owns."
 MODIFIER_TYPE_NAME_ban_imports_of_tsin_electricity: "Ban Imports of $tsin_electricity$"
 MODIFIER_TYPE_DESC_ban_imports_of_tsin_electricity: "This blocks the [import|e] of [ShowGoodsName('tsin_electricity')] to all [markets|e] that a [country|e] owns."
 MODIFIER_TYPE_NAME_local_tsin_electricity_output_modifier: "Local $tsin_electricity$ Output"
 MODIFIER_TYPE_DESC_local_tsin_electricity_output_modifier: "This modifies the [output|e] of [ShowGoodsName('tsin_electricity')] in this [location|e]."
 MODIFIER_TYPE_NAME_local_tsin_electricity_establishment_speed: "Local $tsin_electricity$ Establishment Speed"
 MODIFIER_TYPE_DESC_local_tsin_electricity_establishment_speed: "How quickly newly constructed [buildings|e] producing [ShowGoodsName('tsin_electricity')] in this [location|e] reach their full [production_efficiency|e]."
 MODIFIER_TYPE_NAME_global_tsin_electricity_output_modifier: "$tsin_electricity$ Output"
 MODIFIER_TYPE_DESC_global_tsin_electricity_output_modifier: "This modifies the [output|e] of [ShowGoodsName('tsin_electricity')] in the entire [country|e]."
 MODIFIER_TYPE_NAME_global_tsin_electricity_establishment_speed: "$tsin_electricity$ Establishment Speed"
 MODIFIER_TYPE_DESC_global_tsin_electricity_establishment_speed: "How quickly newly constructed [buildings|e] producing [ShowGoodsName('tsin_electricity')] in the entire [country|e] reach their full [production_efficiency|e]."
 MODIFIER_TYPE_NAME_global_tsin_electricity_pop_demand: "National [ShowGoodsNameWithNoTooltip('tsin_electricity')] Demand"
 MODIFIER_TYPE_DESC_global_tsin_electricity_pop_demand: "This modifies the [pop_needs|e] of the [ShowGoodsName('tsin_electricity')] [produced_good|e]."
 MODIFIER_TYPE_NAME_tsin_electricity_impacts_inflation: "Electricity Impact Inflation"
 MODIFIER_TYPE_DESC_tsin_electricity_impacts_inflation: "This determines how the production of [ShowGoodsName('tsin_electricity')] impacts [inflation|e] in the [country|e]."
 MODIFIER_TYPE_NAME_tsin_electricity_used_for_minting: "Electricity Used for Coins"
 MODIFIER_TYPE_DESC_tsin_electricity_used_for_minting: "This determines if [ShowGoodsName('tsin_electricity')] is used for coins in the [country|e]."
 tsin_electricity_desc: "Generated by dynamos and carried along wires, electricity drives factory motors and lights the streets. It is hard to send far, so most of it is used in the market that produces it."

 tsin_practical_electrical_engineering_advance: "Practical Electrical Engineering"
 tsin_practical_electrical_engineering_advance_desc: "Electricity has left the laboratory and become something engineers can calculate. Once current and resistance are understood, a copper wire opens a whole new industry."
 tsin_dynamo_advance: "The Dynamo"
 tsin_dynamo_advance_desc: "Turning a coil between magnets makes a current flow. Allows building the $tsin_power_station$, which turns the rotation of an engine into electricity."
 tsin_central_power_station_advance: "Central Power Stations"
 tsin_central_power_station_advance_desc: "Instead of a small generator in every factory, one large station supplies a whole city. Unlocks hydro and oil generation."
 tsin_distribution_grid_advance: "Distribution Grids"
 tsin_distribution_grid_advance_desc: "Transformers and power lines tie stations, factories and streets into one network. The same stations deliver more usable power."
 tsin_electric_motor_advance: "Electric Motors"
 tsin_electric_motor_advance_desc: "Instead of a steam engine driving belts and shafts, each machine gets its own small motor. The $tsin_mechanized_textile_mill$ can run on electricity."
 tsin_electric_lighting_advance: "Electric Lighting"
 tsin_electric_lighting_advance_desc: "Lamps brighter and safer than gaslight illuminate streets and factories. Allows building $tsin_electric_lighting$ in towns and cities."
 tsin_telegraph_telephone_advance: "Telegraph and Telephone"
 tsin_telegraph_telephone_advance_desc: "News that took days now arrives in minutes. Governments reach their provinces more closely, and merchants and diplomats learn of distant events at once."
 tsin_industrial_electrification_advance: "Industrial Electrification"
 tsin_industrial_electrification_advance_desc: "Electricity is now the standard power of the factory. Electrolysis opens a new way to make chemical feedstock, and industry as a whole becomes more efficient."

 tsin_power_station: "Power Station"
 tsin_power_station_desc: "The $tsin_power_station$ drives dynamos with coal, water or oil to make $tsin_electricity$. Power is hard to send far, so it is mostly used in the same market."
 tsin_power_station_slot_0: "Generation"
 tsin_power_station_coal: "Coal-Fired"
 tsin_power_station_hydro: "Hydroelectric"
 tsin_power_station_oil: "Oil-Fired"
 tsin_electric_lighting: "Electric Lighting Network"
 tsin_electric_lighting_desc: "$tsin_electric_lighting$ lights streets and homes, shortening the night and making the city a better place to live. It consumes $tsin_electricity$ continuously."
 tsin_electric_lighting_slot_0: "Upkeep"
 tsin_electric_lighting_maintenance: "Network Operation"
 tsin_mechanized_electric_drive: "Electric Drive"
 tsin_fertilizer_electrochemical: "Electrochemical Fertilizer"

 mapmode_tsin_electrification_name: "Electric Power"
 MAPMODE_TSIN_ELECTRIFICATION: "#T $mapmode_tsin_electrification_name$#!\nShows whether $tsin_electricity$ supply in the [market|e] of each [locations|e] covers demand. Shortages are paler, and markets with no electricity at all are shown as unconnected."
 TSIN_ELECTRIFICATION_MAPMODE_TT: "Market power in [ROOT.GetLocation.GetName]: supply [ROOT.ScriptValue('tsin_location_power_supply')|1], demand [ROOT.ScriptValue('tsin_location_power_demand')|1], covered [ROOT.ScriptValue('tsin_location_power_ratio')|%0]."
 LEGEND_KEY_TSIN_POWER_SUPPLIED: "Power Supplied"
 LEGEND_KEY_TSIN_POWER_SHORTAGE: "Power Shortage"
 LEGEND_KEY_TSIN_POWER_NONE: "Not Connected"

 STATIC_MODIFIER_NAME_tsin_invention_electrical_firms: "Private Electrical Firms"
 STATIC_MODIFIER_NAME_tsin_invention_state_power_works: "State Power Works"
 STATIC_MODIFIER_NAME_tsin_invention_state_telephone: "State Telephone Network"
 STATIC_MODIFIER_NAME_tsin_invention_telephone_companies: "Private Telephone Companies"
 STATIC_MODIFIER_NAME_tsin_invention_night_shifts: "Night Shifts Under Electric Light"
 STATIC_MODIFIER_NAME_tsin_invention_lit_reading_rooms: "Lit Reading Rooms"
 STATIC_MODIFIER_NAME_tsin_capital_municipal_lights: "Municipal Lighting"
 STATIC_MODIFIER_NAME_tsin_capital_lighting_franchise: "Private Lighting Franchise"

 tsin_invention.40.title: "The Dynamo"
 tsin_invention.40.desc: "A dynamo coupled to a steam engine by our engineers has produced a steady current, enough to light a whole factory. We must decide who will grow this new industry."
 tsin_invention.40.a: "Charter private electrical firms."
 tsin_invention.40.b: "Start state power works."
 tsin_invention.50.title: "The Telephone"
 tsin_invention.50.desc: "A human voice can be heard clearly at the far end of a wire. Applications to open exchanges in every city are arriving."
 tsin_invention.50.a: "Place the exchanges under the state post office."
 tsin_invention.50.b: "License private telephone companies."
 tsin_invention.60.title: "The Incandescent Lamp"
 tsin_invention.60.desc: "A thin filament in a glass bulb gives a light brighter and cleaner than gas. We must decide where to use it first."
 tsin_invention.60.a: "Light the factories and run the machines at night."
 tsin_invention.60.b: "Light schools, libraries and reading rooms."
 tsin_invention.70.title: "Electric Light in the Capital"
 tsin_invention.70.desc: "A proposal to light the main streets of [SCOPE.sLocation('tsin_lit_capital').GetName] with electric lamps has reached the city council. The gas company objects, and the electrical firms compete for the concession."
 tsin_invention.70.a: "The city will run its own power and lighting."
 tsin_invention.70.b: "Grant a private lighting franchise."
 tsin_invention.70.c: "Keep the gas lamps for now."
