 tsin_automated_fine_cloth_mill_slot_0: "Power Method"
 tsin_automated_fine_cloth_mill_steam: "Steam Power"
 tsin_automated_fine_cloth_mill_electric: "Electric Drive"
 tsin_interchangeable_parts_advance: "Interchangeable Parts"
