l_english:

 TSIN_BUILDING_LEVEL_AUTOMATION_MARKET_ACCESS: "Low [market_access|e] for automated plant"
 tsin_automated_iron_mill: "Automated Tool Works"
 tsin_automated_iron_mill_desc: "Machine tools turn out standard parts, so fewer workers make more $tools$. Built by refitting an existing $iron_mill$."
 tsin_automated_iron_mill_slot_0: "Power Method"
 tsin_automated_iron_mill_steam: "Steam Power"
 tsin_automated_iron_mill_electric: "Electric Drive"
 tsin_automated_glass_mill: "Automated Glassworks"
 tsin_automated_glass_mill_desc: "Continuous tank furnaces and mechanical rollers draw plate $glass$ without pause. Built by refitting an existing $glass_mill$."
 tsin_automated_glass_mill_slot_0: "Power Method"
 tsin_automated_glass_mill_steam: "Steam Power"
 tsin_automated_glass_mill_electric: "Electric Drive"
 tsin_automated_paper_mill: "Continuous Paper Mill"
 tsin_automated_paper_mill_desc: "Fourdrinier machines turn wood pulp into an endless web of $paper$. Built by refitting an existing $paper_mill$."
 tsin_automated_paper_mill_slot_0: "Power Method"
 tsin_automated_paper_mill_steam: "Steam Power"
 tsin_automated_paper_mill_electric: "Electric Drive"
 tsin_automated_furniture_mill: "Mechanized Furniture Factory"
 tsin_automated_furniture_mill_desc: "Steam saws and lathes turn out the same chair by the thousand. Built by refitting an existing $furniture_mill$."
 tsin_automated_furniture_mill_slot_0: "Power Method"
 tsin_automated_furniture_mill_steam: "Steam Power"
 tsin_automated_furniture_mill_electric: "Electric Drive"
 tsin_automated_printing_mill: "Rotary Press Works"
