 TSIN_OPS_GOOD_TSIN_EXPLOSIVES: "Explosives: [GetPlayer.MakeScope.GetVariable('tsin_ops_tsin_explosives_markets').GetValue|0] markets; highest [GetPlayer.MakeScope.GetVariable('tsin_ops_tsin_explosives_ratio').GetValue|0%] of benchmark (price [GetPlayer.MakeScope.GetVariable('tsin_ops_tsin_explosives_price').GetValue|2])."
 TSIN_OPS_GOOD_TSIN_OIL: "Oil: [GetPlayer.MakeScope.GetVariable('tsin_ops_tsin_oil_markets').GetValue|0] markets; highest [GetPlayer.MakeScope.GetVariable('tsin_ops_tsin_oil_ratio').GetValue|0%] of benchmark (price [GetPlayer.MakeScope.GetVariable('tsin_ops_tsin_oil_price').GetValue|2])."
 TSIN_OPS_GOOD_TSIN_RUBBER: "Rubber: [GetPlayer.MakeScope.GetVariable('tsin_ops_tsin_rubber_markets').GetValue|0] markets; highest [GetPlayer.MakeScope.GetVariable('tsin_ops_tsin_rubber_ratio').GetValue|0%] of benchmark (price [GetPlayer.MakeScope.GetVariable('tsin_ops_tsin_rubber_price').GetValue|2])."
