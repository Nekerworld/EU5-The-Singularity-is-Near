 TSIN_OPS_TITLE: "Operational situation"
 TSIN_OPS_EMPTY: "No enabled operational warning is active."
 TSIN_OPS_REFRESH: "Refresh details"
 TSIN_OPS_RESTORE: "Restore hidden types"
 TSIN_OPS_HIDE: "Hide this warning type for this session"
 TSIN_OPS_VIEW: "Inspect"
 TSIN_OPS_MARKET: "Open highest-price market"
 TSIN_OPS_NOT_READY: "Detailed checks have not run yet."
 TSIN_OPS_DATE: "Detailed snapshot: [GetPlayer.MakeScope.GetVariable('tsin_ops_year').GetValue|0]-[GetPlayer.MakeScope.GetVariable('tsin_ops_month').GetValue|0]"
 TSIN_OPS_HELP: "Count = visible warning types. Native checks are live; details update every 3 months. Manual refresh: once per game day. Right-click hides a type for this session. Ribbons are unchanged."
 TSIN_OPS_ATTENTION: "Attention"
 TSIN_OPS_CRITICAL: "Urgent"
 TSIN_OPS_RULE_INPUTS: "Buildings lack inputs"
 TSIN_OPS_DETAIL_INPUTS: "The native game reports missing building inputs. Inspect the production filters and goods supply."
 TSIN_OPS_RULE_ARMY_FOOD: "Army food is low"
 TSIN_OPS_DETAIL_ARMY_FOOD: "The native army food warning is active. Inspect army food, supply limits and replenishment; this is not a newly simulated ammunition system."
 TSIN_OPS_RULE_NAVAL_LOSS: "Fleets suffer attrition"
 TSIN_OPS_DETAIL_NAVAL_LOSS: "The native naval attrition warning is active. Inspect fleet location, range and repair access."
 TSIN_OPS_RULE_FOOD: "Food shortage or starving provinces"
 TSIN_OPS_DETAIL_FOOD: "Native starvation/low-food-stockpile warning. Inspect the affected markets and provincial food balance. No famine disaster entry is duplicated here."
 TSIN_OPS_RULE_BANK_WITHDRAWALS: "Unsettled deposit withdrawals"
 TSIN_OPS_DETAIL_BANK_WITHDRAWALS: "Bank cash cannot cover current withdrawal requests. Reserve liquidity is repayable; recapitalization requires treasury cash."
 TSIN_OPS_RULE_BANK_CAPITAL: "Bank has negative net worth"
 TSIN_OPS_DETAIL_BANK_CAPITAL: "Bank loan and foreign-claim assets plus cash are below depositor and reserve-facility liabilities. Liquidity alone does not restore capital."
 TSIN_OPS_RULE_PRICES: "Expensive strategic goods"
 TSIN_OPS_DETAIL_PRICES: "[GetPlayer.MakeScope.GetVariable('tsin_ops_expensive_count').GetValue|0] market/good pairs exceed 150% of the configured benchmark with positive market demand. A shared-market price warning is not proof of a domestic input shortage."
 TSIN_OPS_RULE_POWER: "Electricity supply imbalance"
 TSIN_OPS_DETAIL_POWER: "[GetPlayer.MakeScope.GetVariable('tsin_ops_power_markets').GetValue|0] relevant markets supply less than 90% of electricity demand. Check trade and inventory as well as generation."
 TSIN_OPS_RULE_LOSS: "Unprofitable buildings"
 TSIN_OPS_DETAIL_LOSS: "Native unprofitable-building alert or repeated negative-profit samples. Newly constructed and intentionally subsidized facilities may need time."
 TSIN_OPS_RULE_EMPLOYMENT: "Unfilled jobs"
 TSIN_OPS_DETAIL_EMPLOYMENT: "Native hiring warning or local buildings below 50% of effective worker capacity. Compare available workers, wages and profitability."
 TSIN_OPS_RULE_ACCESS: "Industrial market access is low"
 TSIN_OPS_DETAIL_ACCESS: "[GetPlayer.MakeScope.GetVariable('tsin_ops_poor_access').GetValue|0] industrial locations have market access below 75%. Inspect roads, railways, control and trade disruptions."
 TSIN_OPS_RULE_RESERVE: "Low reinforcement reserves"
 TSIN_OPS_DETAIL_RESERVE: "Available manpower is below 10% of maximum while an army exists. This signals limited reserves, not proof that a particular army cannot reinforce."
 TSIN_OPS_RULE_MAINTENANCE: "Military maintenance is reduced"
 TSIN_OPS_DETAIL_MAINTENANCE: "Native army/navy maintenance warning. Reduced maintenance may be intentional in peacetime."
 TSIN_OPS_RULE_CROWDING: "Locations near population capacity"
 TSIN_OPS_DETAIL_CROWDING: "[GetPlayer.MakeScope.GetVariable('tsin_ops_overcrowded').GetValue|0] owned locations exceed 90% of population capacity. This is an early warning, not a claim that all have exceeded capacity."
 TSIN_OPS_RULE_EDUCATION: "Education coverage is under downward pressure"
 TSIN_OPS_DETAIL_EDUCATION: "A cached secondary/higher target is more than one point below current coverage while its literacy/lower-education cap is not binding. Review capacity and policy."
 TSIN_OPS_RULE_SUBSIDY: "Subsidized losses recur"
 TSIN_OPS_DETAIL_SUBSIDY: "[GetPlayer.MakeScope.GetVariable('tsin_ops_subsidized_loss_count').GetValue|0] subsidized buildings with negative profit were found in the latest sample and losses appeared in two successive checks. This is not the exact national subsidy bill; inspect the economy screen for actual expenditure."
 TSIN_OPS_RULE_BUDGET: "Persistent deficit or borrowing pressure"
 TSIN_OPS_DETAIL_BUDGET: "Latest monthly balance: [GetPlayer.MakeScope.GetVariable('tsin_ops_balance').GetValue|0]; loans: [GetPlayer.MakeScope.GetVariable('tsin_ops_loans').GetValue|0]. Warning after two negative samples or at least three loans with a deficit."
 TSIN_OPS_RULE_STOCKS: "Stock index fell sharply"
 TSIN_OPS_DETAIL_STOCKS: "Current index is below 60% of the existing recent-history mean, matching the mod’s crash comparison. Inspect the finance tab."
 TSIN_OPS_RULE_COMPANY_INTEREST: "Company credit arrears"
 TSIN_OPS_DETAIL_COMPANY_INTEREST: "Company cash has missed facility interest for at least three months. Check cash funding and principal repayment."
 TSIN_OPS_RULE_BOND_INTEREST: "Company bond arrears"
 TSIN_OPS_DETAIL_BOND_INTEREST: "Private bond interest has been missed for three months. A haircut reduces private creditor claims and is not a cash bailout."
 TSIN_OPS_RULE_FOREIGN_CREDIT: "Foreign borrower delinquency"
 TSIN_OPS_DETAIL_FOREIGN_CREDIT: "The overseas borrower missed contractual interest for four quarterly reviews. Its exchange rate also changes the reference value of the claim."
 TSIN_OPS_RULE_PENSION_FUNDING: "Pension funding shortfall"
 TSIN_OPS_DETAIL_PENSION_FUNDING: "Scheduled pay-as-you-go treasury contributions could not be funded. Existing fund cash may still cover benefits; no treasury overdraft is created."
 TSIN_OPS_GOOD_COAL: "Coal: [GetPlayer.MakeScope.GetVariable('tsin_ops_coal_markets').GetValue|0] markets; highest [GetPlayer.MakeScope.GetVariable('tsin_ops_coal_ratio').GetValue|0%] of benchmark (price [GetPlayer.MakeScope.GetVariable('tsin_ops_coal_price').GetValue|2])."
