 tsin_fertilizer_desc: "Made by processing saltpeter and alum, or fish waste and animal by-products, fertilizer restores the strength of tired soil. Farms that want more grain from the same fields buy it."
 tsin_explosives_desc: "From black powder to nitroglycerin, explosives break mine rock and cut the way for railways. They are dangerous to handle, but industrial engineering and mining cannot advance without them."

 tsin_fertilizer_plant: "Fertilizer Plant"
 tsin_fertilizer_plant_desc: "A $tsin_fertilizer_plant$ grinds and treats minerals, fish or animal by-products into $tsin_fertilizer$."
 tsin_fertilizer_plant_slot_0: "Feedstock"
 tsin_fertilizer_mineral: "Mineral Fertilizer"
 tsin_fertilizer_organic: "Organic Fertilizer"
 tsin_explosives_plant: "Explosives Plant"
 tsin_explosives_plant_desc: "An $tsin_explosives_plant$ turns saltpeter into $tsin_explosives$. A single accident can level the whole plant."
 tsin_explosives_plant_slot_0: "Mixture"
 tsin_explosives_black_powder: "Black Powder"
 tsin_explosives_nitroglycerin: "Nitroglycerin"
 tsin_fertilized_fields: "Fertilized Fields"
 tsin_fertilized_fields_desc: "Fields kept fertile by spreading $tsin_fertilizer$. Grain output and food increase."
 tsin_fertilized_fields_slot_0: "Upkeep"
 tsin_fertilized_fields_maintenance: "Fertilizing"
 tsin_blasting_works: "Blasting Works"
 tsin_blasting_works_desc: "A mine that uses $tsin_explosives$ to break rock and reach deeper seams. Mineral output increases."
 tsin_blasting_works_slot_0: "Upkeep"
 tsin_blasting_works_maintenance: "Blasting"

 tsin_bessemer_process_advance: "Converter Steelmaking"
 tsin_bessemer_process_advance_desc: "Blowing air through molten pig iron burns away its impurities, turning hours of steelmaking into minutes. Steel is no longer a precious material."
 tsin_open_hearth_advance: "Open Hearth Furnace"
 tsin_open_hearth_advance_desc: "By recovering waste heat, the open hearth melts even scrap and turns out large batches of steel of even quality."
 tsin_machine_tools_advance: "Machine Tools"
 tsin_machine_tools_advance_desc: "Precise lathes and planers let machines build machines. Interchangeable parts speed up the making of $tsin_engines$ and tools."
 tsin_shift_work_advance: "Shift Work"
 tsin_shift_work_advance_desc: "Factory machines do not stop at night. Shift work raises output, but the workers' grievances pile up with it."
 tsin_steel_rolling_stock_advance: "Steel Rails and Rolling Stock"
 tsin_steel_rolling_stock_advance_desc: "Steel rails and wheels outlast iron and carry heavier loads. Railways and roads cost less and take less time to build."
 tsin_railway_network_advance: "Railway Network"
 tsin_railway_network_advance_desc: "Railways spreading out from the capital bind provincial towns together. Allows a $tsin_railway_station$ in towns joined to the capital by railroad."
 tsin_railway_station: "Railway Station"
 tsin_railway_station_desc: "Where locomotives take on coal and water and load their freight, a $tsin_railway_station$ ties this town to a wider market. It needs a railroad to the capital and is removed if the link is lost."
 tsin_railway_station_slot_0: "Upkeep"
 tsin_railway_station_maintenance: "Station Operation"

 tsin_improved_fertilizer_advance: "Improved Fertilizer"
 tsin_improved_fertilizer_advance_desc: "Agricultural chemistry has revealed what crops need. Allows $tsin_fertilizer_plant$ and $tsin_fertilized_fields$."
 tsin_dynamite_advance: "Dynamite"
 tsin_dynamite_advance_desc: "Dynamite tames nitroglycerin and transforms mines and building sites. Allows $tsin_explosives_plant$ and $tsin_blasting_works$."
 tsin_stock_exchange_advance: "Stock Exchange"
 tsin_stock_exchange_advance_desc: "A stock exchange where shares and bonds change hands every day gathers scattered capital and sends it to factories and railways."
