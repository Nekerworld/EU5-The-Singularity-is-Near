l_english:
 tsin_engines: "Engines"
 tsin_engines_desc: "Steam engines and their parts are the beating heart of the industrial age, driving factories, steamers and locomotives. Fitting machined copper parts onto an iron or steel frame takes skilled machine works to do."

 MODIFIER_TYPE_NAME_can_extract_tsin_engines: "Can Extract Engines"
 MODIFIER_TYPE_DESC_can_extract_tsin_engines: "This allows the extraction of [ShowGoodsName('tsin_engines')] by allowing an [rgo|e] in a [location|e]."
 MODIFIER_TYPE_NAME_ban_exports_of_tsin_engines: "Ban Exports of $tsin_engines$"
