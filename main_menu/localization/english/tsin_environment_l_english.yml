l_english:
 tsin_water_treatment_works: "Wastewater treatment works"
 tsin_water_treatment_works_desc: "Reduces estimated industrial/mine water pollution in proportion to effective staffing. Up to 30% per fully operating level, 60% maximum. Does not remove smoke; existing pollution clears gradually at annual reviews."
 tsin_water_treatment_steam: "Steam-pump treatment"
 tsin_water_treatment_electric: "Electric-pump treatment"
 tsin_environment_inspectorate: "Environmental inspectorate"
 tsin_environment_inspectorate_desc: "Enforces environmental law in proportion to staffing and inputs. Law alone does not reduce emissions without inspectors. Maximum reduction: inspections 10% air / 5% water; standards 20% air / 10% water."
 tsin_environment_inspectorate_maintenance: "Inspectorate maintenance"
 tsin_environment_law: "Environmental supervision and emissions"
 tsin_environment_law_desc: "Controls enforcement through staffed inspectorates and environmental investment. Enactment neither retrofits every facility nor erases accumulated pollution."
 tsin_environment_unregulated_policy: "Unregulated disposal"
 tsin_environment_unregulated_policy_desc: "No regulatory inspectorate effect. Treatment facilities and separate filter support remain available."
 tsin_environment_inspections_policy: "Pollution inspections"
 tsin_environment_inspections_policy_desc: "Staffed inspectorates support up to 10% air and 5% water source reductions."
 tsin_environment_standards_policy: "Emission standards and supervision"
 tsin_environment_standards_policy_desc: "Staffed inspectorates support up to 20% air and 10% water source reductions."
 AUTO_MODIFIER_NAME_tsin_water_pollution_health: "Water pollution exposure"
 mapmode_tsin_water_pollution_name: "Water pollution"
 MAPMODE_TSIN_WATER_POLLUTION: "Annual urban/mine water-risk index, not a real concentration unit. Unmeasured rural areas are not classified as clean."
 LEGEND_TSIN_WATER_HIGH: "High water risk"
 LEGEND_TSIN_WATER_LOW: "Low water risk"
 LEGEND_TSIN_WATER_UNKNOWN: "Unmeasured"
 tsin_environment.1.title: "A petition over polluted water"
 tsin_environment.1.desc: "Complaints about polluted water have continued for years. Temporary purification services can be procured, while lasting improvement requires treatment works and local supervision."
 tsin_environment.1.a: "Procure purification services for 250 gold"
 tsin_environment.1.b: "Allocate no additional funding"
