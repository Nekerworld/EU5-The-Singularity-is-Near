l_english:

 # probabilistic legislation (docs/legislation.md)
 rule_tsin_bill_system: "Probabilistic Legislation"
 setting_tsin_bill_system_on: "On"
 setting_tsin_bill_system_on_desc: "Countries that have embraced mass society and have a parliament can change the policies of the industrial-age laws and of the press, popular education, immigration and slavery laws only through [tsin_bills_concept|e]. A bill is read every three months: three successful readings enact it, three failed readings kill it."
 setting_tsin_bill_system_off: "Off"
 setting_tsin_bill_system_off_desc: "Policies change at once, as in vanilla."
 tsin_policy_needs_bill_tt: "This policy must pass [parliament|e] as a bill ([tsin_bills_concept|e], decision \"$tsin_propose_bill_decision$\")."
 tsin_propose_bill_decision: "Table a Bill"
 tsin_propose_bill_decision.title: "Table a Bill"
 tsin_propose_bill_decision.desc: "The government lays a bill before [parliament|e] ([tsin_bills_concept|e]). It is read every three months; the chance of each reading depends on the support of the [estates|e], the popular [tsin_movements_concept|e], the form of government, [legislative_efficiency|e] and the debates ([tsin_bill_readings_concept|e])."
 tsin_propose_bill_decision.a: "Choose the bill"
 tsin_withdraw_bill_decision: "Withdraw the Bill"
 tsin_withdraw_bill_decision.title: "Withdraw the Bill"
 tsin_withdraw_bill_decision.desc: "Withdraw the bill before [parliament|e] ([tsin_bills_concept|e]). No new bill can be tabled for two years. The chance of the next reading ([tsin_bill_readings_concept|e]) is now [ROOT.ScriptValue('tsin_bill_success_percent')|0]%."
 tsin_withdraw_bill_decision.a: "Withdraw it"
 tsin_withdraw_bill_decision.tt: "The bill is dropped and no new bill can be tabled for two years."
 tsin_bill_factor_base: "Base"
 tsin_bill_factor_support_nobles_estate: "Nobles support it"
 tsin_bill_factor_support_clergy_estate: "Clergy support it"
 tsin_bill_factor_support_burghers_estate: "Burghers support it"
 tsin_bill_factor_support_peasants_estate: "Commoners support it"
 tsin_bill_factor_support_crown_estate: "The crown supports it"
 tsin_bill_factor_oppose_nobles_estate: "Nobles oppose it"
 tsin_bill_factor_oppose_clergy_estate: "Clergy oppose it"
 tsin_bill_factor_oppose_burghers_estate: "Burghers oppose it"
 tsin_bill_factor_oppose_peasants_estate: "Commoners oppose it"
 tsin_bill_factor_oppose_crown_estate: "The crown opposes it"
 tsin_bill_factor_labor: "Labour grievance and unionism"
 tsin_bill_factor_abolition: "Abolitionism"
 tsin_bill_factor_liberalism: "Liberalism"
 tsin_bill_factor_social: "Social movements (socialism, women's suffrage)"
 tsin_bill_factor_republic: "Republic"
 tsin_bill_factor_legislative_efficiency: "Legislative efficiency"
 tsin_bill_factor_debate: "Debates"
 tsin_legislation.2.title: "The Bill Passes"
 tsin_legislation.2.desc: "After its third reading, parliament has passed the bill on '[tsin_bill.GetName]'. The policy takes effect from today."
 tsin_legislation.2.a: "Promulgate it"
 tsin_legislation.3.title: "The Bill Is Lost"
 tsin_legislation.3.desc: "The bill on '[tsin_bill.GetName]' has been blocked for the third time. The government has dropped it and will not be able to table a new bill for two years."
 tsin_legislation.3.a: "Until the next session"
 tsin_legislation.10.title: "The Committee's Amendments"
 tsin_legislation.10.desc: "The committee on the bill on '[tsin_bill.GetName]' will support it if we accept its amendments. The bill loses some of its edge but gains votes."
 tsin_legislation.10.a: "Accept the amendments"
 tsin_legislation.10.b: "Not a comma will be changed"
 tsin_legislation.20.title: "Whipping the Vote"
 tsin_legislation.20.desc: "The vote on the bill on '[tsin_bill.GetName]' is close. The chief whip proposes that members who do not vote with the government lose their seats at the next election."
 tsin_legislation.20.a: "Every member votes with the government"
 tsin_legislation.20.b: "Let the members vote their conscience"
 tsin_legislation.30.title: "Taking It to the Country"
 tsin_legislation.30.desc: "The bill on '[tsin_bill.GetName]' is being argued outside parliament too. If friendly newspapers and public meetings move opinion, the wavering members will follow."
 tsin_legislation.30.a: "Pamphlets, meetings and friendly newspapers"
 tsin_legislation.30.b: "Parliament is no place for the street"
 tsin_legislation.40.title: "The Opposition Demands Withdrawal"
 tsin_legislation.40.desc: "The opposition is obstructing parliament until the bill on '[tsin_bill.GetName]' is withdrawn. Withdrawing it would calm things down, but no new bill could be tabled for two years."
 tsin_legislation.40.a: "Withdraw the bill"
 tsin_legislation.40.b: "The bill stays on the order paper"
 tsin_legislation.100.title: "Tabling a Bill"
 tsin_legislation.100.desc: "The cabinet is discussing the bill for the next session. Which field of law shall we change?"
 tsin_legislation.100.c110: "Labour and welfare"
 tsin_legislation.100.c120: "Taxation, money and association"
 tsin_legislation.100.c130: "Land and church"
 tsin_legislation.100.c140: "Industry, companies and environment"
 tsin_legislation.100.c150: "Slavery"
 tsin_legislation.100.c160: "Press and immigration"
 tsin_legislation.100.c170: "Popular education"
 tsin_legislation.100.z: "Not this session"
 tsin_legislation.110.title: "A Labour and Welfare Bill"
 tsin_legislation.110.desc: "Working hours, factory safety, poor relief or social insurance: what shall the bill be?"
 tsin_legislation.110.z: "Choose another field"
 tsin_legislation.120.title: "A Taxation, Money and Association Bill"
 tsin_legislation.120.desc: "The bill will decide whom we tax, what backs our money and how freely the people may associate."
 tsin_legislation.120.z: "Choose another field"
 tsin_legislation.130.title: "A Land and Church Bill"
 tsin_legislation.130.desc: "The bill will settle the freedom of the serfs, the disposal of public land, or the relation between church and state."
 tsin_legislation.130.z: "Choose another field"
 tsin_legislation.140.title: "An Industry, Company and Environment Bill"
 tsin_legislation.140.desc: "The bill sets the direction of industrial investment, company regulation and environmental supervision."
 tsin_legislation.140.z: "Choose another field"
 tsin_legislation.150.title: "A Slavery Bill"
 tsin_legislation.150.desc: "Parliament divides once more over the slave trade and slavery itself."
 tsin_legislation.150.z: "Choose another field"
 tsin_legislation.160.title: "A Press and Immigration Bill"
 tsin_legislation.160.desc: "The bill will decide how free the newspapers are and how open the borders."
 tsin_legislation.160.z: "Choose another field"
 tsin_legislation.170.title: "A Popular Education Bill"
 tsin_legislation.170.desc: "Who shall teach the people: the church, the guilds, or the state?"
 tsin_legislation.170.z: "Choose another field"
 tsin_legislative_session: "A Legislative Session"
 tsin_legislative_session_desc: "This session is devoted to the bill before [parliament|e] ([tsin_bills_concept|e]). If it passes, the bill counts one more successful reading and gains ground in the debates ([tsin_bill_readings_concept|e]); if it fails, the bill is set back."
