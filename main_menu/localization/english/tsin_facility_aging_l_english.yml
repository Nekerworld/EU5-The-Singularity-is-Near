 tsin_facility_budget_on: "Enable district maintenance support"
 tsin_facility_budget_on_desc: "At 5–7-year inspections, pay bundle scale × elapsed years × 0.25 gold to restore condition. If unaffordable, do not pay and wear advances. Off by default for players; AI supports maintenance only with at least four times the cost in cash. Separate government engineering support, not a replacement for native building upkeep. Does not modernize technology."
 tsin_facility_budget_off: "Disable district maintenance support"
 tsin_facility_budget_off_desc: "At 5–7-year inspections, pay bundle scale × elapsed years × 0.25 gold to restore condition. If unaffordable, do not pay and wear advances. Off by default for players; AI supports maintenance only with at least four times the cost in cash. Separate government engineering support, not a replacement for native building upkeep. Does not modernize technology."
 tsin_facility_inspect: "Inspect district facilities"
 tsin_facility_inspect_desc: "Choose a registered industrial province to copy its last inspection into TSIN economic reports. Viewing does not advance wear, repair, modernize or spend money."
