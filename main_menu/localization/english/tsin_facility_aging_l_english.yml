 AUTO_MODIFIER_NAME_tsin_facility_industry_wear: "Industry wear"
 AUTO_MODIFIER_NAME_tsin_facility_industry_gap: "Industry obsolescence"
 tsin_facility_repair_industry: "Repair industry facilities"
 tsin_facility_repair_industry_desc: "Choose a registered province. Cost 100 gold × max(bundle scale/25, 1). Repair restores condition only; modernization refreshes age and technology baseline for this bundle, without resetting other bundles. Maintenance spending is a government subsidy, not building upkeep. Age alone causes no output loss; only wear and technology gap apply supported modifiers. During a chemical spill shutdown, the industry bundle does not stack its penalty. Only supported modifier keys are used; total location output is not cut directly."
 tsin_facility_modernize_industry: "Modernize industry facilities"
 tsin_facility_modernize_industry_desc: "Choose a registered province. Cost 300 gold × max(bundle scale/25, 1). Repair restores condition only; modernization refreshes age and technology baseline for this bundle, without resetting other bundles. Maintenance spending is a government subsidy, not building upkeep. Age alone causes no output loss; only wear and technology gap apply supported modifiers. During a chemical spill shutdown, the industry bundle does not stack its penalty. Only supported modifier keys are used; total location output is not cut directly."
