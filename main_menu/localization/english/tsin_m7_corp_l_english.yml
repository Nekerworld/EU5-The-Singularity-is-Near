l_english:

 tsin_grant_colonial_charter_decision.title: "Charter a Colonial Company"
 tsin_grant_colonial_charter_decision.desc: "Grant one of our companies a charter to govern and trade in new colonies. Only countries taking part in the scramble for colonies can use it."
 tsin_grant_colonial_charter_decision.a: "Grant the charter."
 tsin_grant_colonial_charter_decision.tt: "The company's private troops and overseers treat the natives harshly. Dissolving the companies also revokes the charter."
 STATIC_MODIFIER_NAME_tsin_charter_colonial_company: "Colonial Charter Company"
 STATIC_MODIFIER_NAME_tsin_trust_busting: "Trust Busting"
 tsin_trust_law: "Trusts"
 tsin_trust_law_desc: "This determines whether great companies may fix prices and buy up their competitors."
 tsin_trust_law_CATEGORY: "SOCIOECONOMIC_LAW_CATEGORY"
 tsin_trusts_tolerated_policy: "Trusts Tolerated"
 tsin_trusts_tolerated_policy_desc: "Combinations and price-fixing among companies are not regulated."
 tsin_antitrust_policy: "Antitrust Act"
 tsin_antitrust_policy_desc: "Price-fixing and combinations in restraint of trade are outlawed. One fewer company is allowed, and the labor grievance target falls by 3."
 tsin_economy.160.title: "The Trust Question"
 tsin_economy.160.desc: "The great steel, railway and oil companies fix prices and buy up their rivals one by one. Farmers and small traders demand that the octopus-like trusts be broken up."
 tsin_economy.160.a: "Break up the trusts."
 tsin_economy.160.b: "What is good for the companies is good for the country."
