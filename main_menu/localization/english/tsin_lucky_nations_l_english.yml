l_english:
 tsin_lucky_nations: "TSIN historical lucky nations"
 tsin_lucky_nations_desc: "Russian pilot. Human ownership or control of any required city blocks scripted formation. Assisted mode never transfers land. Saved HEX actors are left to HEX before 1700."
 tsin_lucky_nations_assisted: "Assisted formation"
 tsin_lucky_nations_assisted_desc: "Support an eligible Russian AI; form Russia once it owns the four native core cities. No scripted land transfers. This is also the legacy-save default."
 tsin_lucky_nations_force: "Assistance and territorial fallback"
 tsin_lucky_nations_force_desc: "After 1700, permit protected, peacetime transfer of the four core cities for a Russian AI. Capitals, human realms, occupied land and transfers that remove an AI owner are excluded."
 tsin_lucky_nations_off: "Disabled"
 tsin_lucky_nations_off_desc: "No support or scripted Russian formation; existing TSIN support is removed on review."
 tsin_lucky_russia.1.title: "The Russian consolidation"
 tsin_lucky_russia.1.desc: "A delayed consolidation is being resolved under the historical progression rules. Human ownership and control, wars, capitals and surviving owners are checked again before any transfer."
 tsin_lucky_russia.1.a: "A new Russian state."
 tsin_lucky_russia_formed_log: "TSIN_LUCKY_RUSSIA formed by [ROOT.GetCountry.GetName]"
 STATIC_MODIFIER_NAME_tsin_lucky_russia_support: "Russian consolidation support"
 STATIC_MODIFIER_DESC_tsin_lucky_russia_support: "Temporary support for delayed Russian consolidation. Ends at formation, human conflict, protected human city control or the end of the pilot period."
 STATIC_MODIFIER_NAME_tsin_lucky_russia_support_strong: "Intensified Russian consolidation support"
 STATIC_MODIFIER_DESC_tsin_lucky_russia_support_strong: "Stronger temporary support after fifteen assisted annual reviews. Not permanent national luck."
