l_english:

 # Cholera pandemic (in_game/common/disasters/tsin_cholera.txt)
 tsin_cholera: "Cholera Pandemic"
 tsin_cholera_desc: "Cholera from Asia spreads around the world by steamship and railway. Crowded cities without sewers fall first. Waterworks in the capital and a public health campaign end it sooner."
 STATIC_MODIFIER_NAME_tsin_cholera_quarantine: "Port Quarantine"
 STATIC_MODIFIER_NAME_tsin_sanitary_science: "Sanitary Science"
 STATIC_MODIFIER_NAME_tsin_sewer_movement: "Sewer Movement"
 tsin_cholera.1.title: "Cholera Has Come"
 tsin_cholera.1.desc: "In our port cities the sick collapse overnight. It is a terrible disease of violent purging and dehydration that turns the skin blue. Physicians blame bad air, and merchants beg us not to stop trade with quarantines."
 tsin_cholera.1.a: "Quarantine the ports."
 tsin_cholera.1.b: "Trade must go on."
 tsin_cholera.2.title: "Cholera in [tsin_cholera_city.GetName]"
 tsin_cholera.2.desc: "Cholera has spread through the packed tenements and the filth-choked alleys. [tsin_cholera_city.GetName] is running out of graves."
 tsin_cholera.2.a: "Bury the dead."
 tsin_cholera.2.b: "Open emergency hospitals."
 tsin_cholera.3.title: "The Pump Handle"
 tsin_cholera.3.desc: "A physician has marked the homes of the dead on a map and found them clustered around a single well pump. The disease, he says, travels not through bad air but through foul water. He asks us to remove the pump handle."
 tsin_cholera.3.a: "Remove the pump handle."
 tsin_cholera.3.b: "It is the miasma, everyone knows it."
 tsin_cholera.10.title: "The Pandemic Passes"
 tsin_cholera.10.desc: "Cholera has finally retreated. The survivors demand clean water and sewers."
 tsin_cholera.10.a: "Build sewers so it never returns."
 tsin_cholera.10.b: "Give thanks and move on."
