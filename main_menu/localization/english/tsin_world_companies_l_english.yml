 TSIN_WCS_TITLE: "World company statistics"
 TSIN_WCS_HELP: "Only Survey refreshes world data. Filters, sorting and pages use the snapshot. Firm counts follow the filter; cash is national operating-company cash (excluding bank and pension funds); valuation covers the national corporate sector. Valuation is a stock-price × business-base proxy, not gold or actual market capitalization. Year 0 / — means unavailable."
 tsin_survey_world_companies: "Survey world companies"
 tsin_survey_world_companies_desc: "Request one snapshot of real company-owning countries, company types/counts, corporate-sector cash and last valuation cache. No automatic resurvey."
 TSIN_WCS_DATE: "Survey: [GetPlayer.MakeScope.GetVariable('tsin_wcs_survey_year').GetValue|0].[GetPlayer.MakeScope.GetVariable('tsin_wcs_survey_month').GetValue|0]"
