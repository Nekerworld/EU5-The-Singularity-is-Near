 tsin_metro_create_desc: "Core population 100,000. Up to 24 same-country connected locations. Province selection adds eligible locations only. Connections are reviewed quarterly or manually. Does not transfer population, food or labor. A core may pick one role (facility condition needed); role bonuses apply to the core only. Bulk projects recheck owner, technology, stage and cash per site and skip any site that fails."
