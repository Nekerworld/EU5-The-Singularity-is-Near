 tsin_culture.10.title: "On the Origin of Species"
 tsin_culture.10.desc: "A naturalist has published a book arguing that all living things have changed over long ages through natural selection. The first printing sold out in a day, and lecture halls and pulpits alike are in uproar."
 tsin_culture.10.a: "Science must follow the evidence."
 tsin_culture.10.b: "The church condemns the book."
 tsin_culture.20.title: "The Culture Struggle"
 tsin_culture.20.desc: "A church council has proclaimed papal infallibility as dogma. Liberals demand that the state take back its authority from a clergy that answers to a foreign sovereign and still controls schools and marriage."
 tsin_culture.20.a: "Break the church's power and separate church and state."
 tsin_culture.20.b: "Seek a concordat with the church."
 tsin_culture.20.c: "Stay out of the quarrel."
 tsin_culture.30.title: "The Submarine Cable"
 tsin_culture.30.desc: "Copper wire sheathed in gutta-percha now crosses the sea floor from continent to continent. News that once took weeks now arrives in minutes."
 tsin_culture.30.a: "The state lays the cable."
 tsin_culture.30.b: "Leave it to the cable companies."
 tsin_culture.40.title: "The Modern Olympic Games"
 tsin_culture.40.desc: "An international committee that wants to revive the games of ancient Olympia is looking for a city to host the next games. Athletes from around the world could gather in the stadium of our capital."
 tsin_culture.40.a: "Host the games."
 tsin_culture.40.b: "Let another country host."
 tsin_build_suez_canal_industrial: "Build the Suez Canal (Industrial Methods)"
 tsin_build_suez_canal_industrial.title: "Build the Suez Canal (Industrial Methods)"
 tsin_build_suez_canal_industrial.desc: "Dig a canal joining the Mediterranean and the Red Sea with dynamite and steam excavators. It costs 40% less than the old methods."
 tsin_build_suez_canal_industrial.a: "Begin construction."
 tsin_build_panama_canal_industrial: "Build the Panama Canal (Industrial Methods)"
 tsin_build_panama_canal_industrial.title: "Build the Panama Canal (Industrial Methods)"
 tsin_build_panama_canal_industrial.desc: "Dig a canal joining the two oceans with dynamite and steam excavators. It costs 40% less than the old methods."
 tsin_build_panama_canal_industrial.a: "Begin construction."
