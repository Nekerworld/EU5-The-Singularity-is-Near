l_english:

 tsin_percussion_cap_advance: "Percussion Cap Rifles"
 tsin_percussion_cap_advance_desc: "A rifle fired by a percussion cap instead of a flint misfires far less, even in rain. Line infantry re-arm as $a_tsin_line_riflemen$."
 tsin_rifling_advance: "Rifling"
 tsin_rifling_advance_desc: "Spiral grooves cut inside the barrel spin the bullet, greatly increasing range and accuracy. Allows recruiting $a_tsin_rifle_skirmishers$, who fight in open order."
 tsin_breech_loading_artillery_advance: "Breech-Loading Artillery"
 tsin_breech_loading_artillery_advance_desc: "Steel guns loaded from the rear fire faster and further. Allows raising the $a_tsin_breech_loading_battery$."
 tsin_repeating_rifle_advance: "Repeating Rifles"
 tsin_repeating_rifle_advance_desc: "A magazine holds several rounds, so the rifle fires again and again without reloading. Introduces $a_tsin_mounted_rifles$, who ride to battle and fight on foot."
 tsin_hand_cranked_machine_gun_advance: "Hand-Cranked Machine Guns"
 tsin_hand_cranked_machine_gun_advance_desc: "Turning a crank fires several barrels in turn. Charging defended infantry becomes ever more costly."
 tsin_general_staff_advance: "General Staff"
 tsin_general_staff_advance_desc: "A professional corps of officers who work with railway timetables, telegraphs and maps plans mobilisation and campaigns in advance. Armies fight in better order and are replenished faster."
 tsin_ironclad_advance: "Ironclads"
 tsin_ironclad_advance_desc: "Wooden ships of the line are obsolete before steam-driven warships clad in iron plate. Allows building the $n_tsin_ironclad$."
 tsin_monitor_advance: "Monitors"
 tsin_monitor_advance_desc: "A coastal warship with a revolving turret on a low hull. It struggles on the open sea but excels at defending harbours and coasts. Allows building the $n_tsin_monitor$."
 tsin_torpedo_advance: "Torpedoes"
 tsin_torpedo_advance_desc: "A self-propelled underwater explosive lets even a small boat sink a great warship. Allows building the fast $n_tsin_torpedo_boat$."

 a_tsin_line_riflemen: "Line Riflemen"
 a_tsin_line_riflemen_desc: "Armed with percussion rifles, $a_tsin_line_riflemen$ are the core of the industrial army. They consume factory-made rifles and ammunition in bulk."
 a_tsin_rifle_skirmishers: "Rifle Skirmishers"
 a_tsin_rifle_skirmishers_desc: "With rifled guns, $a_tsin_rifle_skirmishers$ spread out, take cover, and unsettle enemy formations from a distance."
 a_tsin_breech_loading_battery: "Breech-Loading Battery"
 a_tsin_breech_loading_battery_desc: "Armed with steel breech-loaders, a $a_tsin_breech_loading_battery$ pours out explosive shells at a rapid rate. It consumes steel and explosives."
 a_tsin_mounted_rifles: "Mounted Rifles"
 a_tsin_mounted_rifles_desc: "$a_tsin_mounted_rifles$ move quickly on horseback and dismount to fight with repeating rifles."
 n_tsin_ironclad: "Ironclad"
 n_tsin_ironclad_desc: "With steam engines and iron armour, the $n_tsin_ironclad$ shrugs off the fire of wooden warships. It consumes a great deal of steel, engines and coal."
 n_tsin_monitor: "Monitor"
 n_tsin_monitor_desc: "Carrying a revolving turret, the $n_tsin_monitor$ brings heavy firepower to coastal waters. It is slow and vulnerable on the open sea."
 n_tsin_torpedo_boat: "Torpedo Boat"
 n_tsin_torpedo_boat_desc: "Small and fast, the $n_tsin_torpedo_boat$ threatens large warships with torpedoes. It consumes explosives."

 STATIC_MODIFIER_NAME_tsin_military_full_rearmament: "Full Rearmament"
 STATIC_MODIFIER_NAME_tsin_military_converted_muskets: "Converted Muskets"
 STATIC_MODIFIER_NAME_tsin_military_ironclad_programme: "Ironclad Programme"
 STATIC_MODIFIER_NAME_tsin_military_coastal_defence: "Coastal Defence First"
 STATIC_MODIFIER_NAME_tsin_military_patriotic_press: "Patriotic Press"

 tsin_military.10.title: "Breech-Loading Rifles"
 tsin_military.10.desc: "A rifle loaded from the rear while lying prone fires several times faster than a soldier standing with a ramrod. The generals demand that the whole army be re-armed, but the arsenals are still full of serviceable muskets."
 tsin_military.10.a: "Re-arm the whole army at once."
 tsin_military.10.b: "Convert the muskets in the arsenals to breech-loaders."
 tsin_military.10.c: "The old drill has won every war so far."
 tsin_military.20.title: "The First Ironclads"
 tsin_military.20.desc: "Word has reached the admiralty that a steam-driven warship clad in iron shrugged off the shot of wooden ships of the line. Our fleet became obsolete overnight."
 tsin_military.20.a: "Hurry an ironclad building programme."
 tsin_military.20.b: "Defend the coasts and harbours first."
 tsin_military.20.c: "Let other navies make the costly mistakes."
 tsin_military.30.title: "War Correspondents"
 tsin_military.30.desc: "Thanks to the telegraph, news from the front appears in the next morning's papers. The correspondents report not only cheering victories but also the horrors of the field hospitals. The government must decide how to handle the reports."
 tsin_military.30.a: "Censor the dispatches."
 tsin_military.30.b: "Give the news first to the patriotic papers."
 tsin_military.30.c: "Let the correspondents report freely."

 tsin_romantic_painting: "Romantic Painting"
 tsin_romantic_painting_desc: "A painting of stormy seas, ruins and national legend. It places feeling and the sublime above reason."
 tsin_romantic_painting_name: "$ADJECTIVE|U$ $FIRST_NOUN|U$"
 tsin_photograph: "Photograph"
 tsin_photograph_desc: "A single moment kept exactly as it was by light and chemicals. Portraits, landscapes and battlefields are recorded as they are for the first time."
 tsin_photograph_name: "$ADJECTIVE|U$ $FIRST_NOUN|U$"
 tsin_opera: "Opera"
 tsin_opera_desc: "Drama set to music, joining song, orchestra and stage. The operas of this age sing of national heroes and tragic love."
 tsin_opera_name: "$ADJECTIVE|U$ $FIRST_NOUN|U$"
 tsin_realist_novel: "Realist Novel"
 tsin_realist_novel_desc: "A novel that depicts factories, slums and ordinary lives without ornament. Readers laugh and weep as they face the contradictions of society."
 tsin_realist_novel_name: "$ADJECTIVE|U$ $FIRST_NOUN|U$"

 STATIC_MODIFIER_NAME_tsin_art_national_romanticism: "National Romanticism"
 STATIC_MODIFIER_NAME_tsin_art_realist_letters: "Realist Letters"
 STATIC_MODIFIER_NAME_tsin_art_photographic_survey: "Photographic Survey"

 tsin_art.10.title: "Romanticism"
 tsin_art.10.desc: "Young poets and painters have cast off the rules of the classics to sing of national legend, wild nature and violent passion. Salons and theatres are seething with the new wave."
 tsin_art.10.a: "Patronise the poets of the nation."
 tsin_art.10.b: "Keep to classical dignity."
 tsin_art.20.title: "Realism"
 tsin_art.20.desc: "A serialised novel depicting the lives of factory workers and the slums has set the city talking. The clergy call it indecent and demand that it be banned."
 tsin_art.20.a: "Let the novels speak of the slums."
 tsin_art.20.b: "Ban the book as an offence to public morals."
 tsin_art.30.title: "Photography"
 tsin_art.30.desc: "Pictures drawn by light on silvered plates have reached the capital. People queue outside portrait studios, and officials wonder whether the technique could serve surveying and record keeping."
 tsin_art.30.a: "Survey and record the whole realm in photographs."
 tsin_art.30.b: "Leave it to the portrait studios."

 tsin_source_of_the_nile_expedition: "Search for the Source of the Nile"
 tsin_source_of_the_nile_expedition_desc: "Send an expedition inland from the East African coast, past the great lakes, to settle the oldest question in geography: where does the Nile begin?"
 tsin_source_of_the_nile_expedition_historical_info: "Ancient geographers placed the source of the Nile in the 'Mountains of the Moon', and for two thousand years no one could prove them right or wrong. In the mid-19th century, expeditions setting out from the Zanzibar coast reached the great lakes of the interior, and a bitter public dispute followed over which lake, if any, fed the river."
 tsin_source_of_the_nile_expedition_outcome_overview: "$BULLET$The first country in the world to reach [ShowLocationName('buganda')] finds the source of the Nile and chooses between:\n$BULLET_WITH_TAB$#G +15#! [prestige|e].\n$BULLET_WITH_TAB$#G +10#! [prestige|e] and the [ShowModifier('tsin_expedition_geographical_society')] [modifier|e].\n$BULLET$Reaching [ShowLocationName('gondokoro')] completes the expedition and grants #G +10#! [prestige|e] and the [ShowModifier('tsin_expedition_geographic_fame')] [modifier|e].\n$BULLET$A failed expedition costs #R -5#! [prestige|e]."

 tsin_northwest_passage_expedition: "Search for the Northwest Passage"
 tsin_northwest_passage_expedition_desc: "Send a ship to the edge of the Arctic ice to look for a sea route between the Atlantic and the Pacific north of the American continent."
 tsin_northwest_passage_expedition_historical_info: "Navigators had sought a northern sea route to Asia since the 16th century. In the 19th century the search became a matter of national pride, and whole expeditions vanished in the ice. The passage proved to exist, but it was too frozen to be of any use to trade."
 tsin_northwest_passage_expedition_outcome_overview: "$BULLET$When the ship reaches the ice edge, there is a #Y 35%#! chance that the passage is found:\n$BULLET_WITH_TAB$#G +15#! [prestige|e] and the [ShowModifier('tsin_expedition_geographic_fame')] [modifier|e].\n$BULLET$Otherwise the ice turns the ship back with #G +5#! [prestige|e], and the expedition can be sent again.\n$BULLET$Once any country finds the passage, no one can launch this expedition again.\n$BULLET$A failed expedition costs #R -5#! [prestige|e]."

 tsin_polar_expedition: "Push for the North Pole"
 tsin_polar_expedition_desc: "Send a steam-powered, iron-reinforced ship north of the Arctic Circle to force its way through the pack ice toward the pole."
 tsin_polar_expedition_historical_info: "In the late 19th century, expeditions tried to reach the North Pole by ship, by sledge and even by balloon. Some deliberately froze their ships into the ice and let the drift carry them north. For decades, the pack ice defeated every attempt."
 tsin_polar_expedition_outcome_overview: "$BULLET$When the ship reaches the pack ice, there is a #Y 30%#! chance that the pole is reached:\n$BULLET_WITH_TAB$#G +15#! [prestige|e] and the [ShowModifier('tsin_expedition_geographic_fame')] [modifier|e].\n$BULLET$Otherwise the ice turns the ship back with #G +5#! [prestige|e], and the expedition can be sent again.\n$BULLET$Once any country reaches the pole, no one can launch this expedition again.\n$BULLET$A failed expedition costs #R -5#! [prestige|e]."

 STATIC_MODIFIER_NAME_tsin_expedition_geographic_fame: "Geographic Fame"
 STATIC_MODIFIER_NAME_tsin_expedition_geographical_society: "Royal Geographical Society"

 tsin_expedition.1.title: "The Source of the Nile"
 tsin_expedition.1.desc: "Our expedition has reached a vast inland lake from which a great river flows north. The explorer is certain that this is the source of the Nile, which has eluded geographers since antiquity."
 tsin_expedition.1.a: "Name the lake after our sovereign."
 tsin_expedition.1.b: "Present the findings to the geographical society."
 tsin_expedition.10.title: "The Northwest Passage"
 tsin_expedition.10.desc: "Our ship has threaded its way between the Arctic islands and found open water leading west. The passage between the two oceans exists after all."
 tsin_expedition.10.a: "Chart it for the whole world to see."
 tsin_expedition.11.title: "Turned Back by the Ice"
 tsin_expedition.11.desc: "The ice closed around the ship before it could find a way west. The captain turned back before the ship was crushed, bringing home only charts of the ice edge."
 tsin_expedition.11.a: "We will try again."
 tsin_expedition.20.title: "The Pole Is Reached"
 tsin_expedition.20.desc: "After months of drifting with the ice and marching across it, our explorers have planted the flag at the top of the world."
 tsin_expedition.20.a: "A triumph for the nation!"
 tsin_expedition.21.title: "The Pack Ice Wins"
 tsin_expedition.21.desc: "The pack ice proved impassable even for an iron-reinforced hull. The ship has returned, but the pole remains out of reach."
 tsin_expedition.21.a: "The ice will not hold forever."

 tsin_open_treaty_port: "Open a Treaty Port"
 tsin_open_treaty_port_desc: "One of their harbour towns shall be opened to our merchants, under terms they had no say in."
