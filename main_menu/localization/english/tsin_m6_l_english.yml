l_english:

 tsin_percussion_cap_advance: "Percussion Cap Rifles"
 tsin_percussion_cap_advance_desc: "A rifle fired by a percussion cap instead of a flint misfires far less, even in rain. Line infantry re-arm as $a_tsin_line_riflemen$."
 tsin_rifling_advance: "Rifling"
 tsin_rifling_advance_desc: "Spiral grooves cut inside the barrel spin the bullet, greatly increasing range and accuracy. Allows recruiting $a_tsin_rifle_skirmishers$, who fight in open order."
 tsin_breech_loading_artillery_advance: "Breech-Loading Artillery"
 tsin_breech_loading_artillery_advance_desc: "Steel guns loaded from the rear fire faster and further. Allows raising the $a_tsin_breech_loading_battery$."
 tsin_repeating_rifle_advance: "Repeating Rifles"
 tsin_repeating_rifle_advance_desc: "A magazine holds several rounds, so the rifle fires again and again without reloading. Introduces $a_tsin_mounted_rifles$, who ride to battle and fight on foot."
 tsin_hand_cranked_machine_gun_advance: "Hand-Cranked Machine Guns"
 tsin_hand_cranked_machine_gun_advance_desc: "Turning a crank fires several barrels in turn. Charging defended infantry becomes ever more costly."
 tsin_general_staff_advance: "General Staff"
 tsin_general_staff_advance_desc: "A professional corps of officers who work with railway timetables, telegraphs and maps plans mobilisation and campaigns in advance. Armies fight in better order and are replenished faster."
 tsin_ironclad_advance: "Ironclads"
 tsin_ironclad_advance_desc: "Wooden ships of the line are obsolete before steam-driven warships clad in iron plate. Allows building the $n_tsin_ironclad$."
 tsin_monitor_advance: "Monitors"
 tsin_monitor_advance_desc: "A coastal warship with a revolving turret on a low hull. It struggles on the open sea but excels at defending harbours and coasts. Allows building the $n_tsin_monitor$."
 tsin_torpedo_advance: "Torpedoes"
 tsin_torpedo_advance_desc: "A self-propelled underwater explosive lets even a small boat sink a great warship. Allows building the fast $n_tsin_torpedo_boat$."

 a_tsin_line_riflemen: "Line Riflemen"
 a_tsin_line_riflemen_desc: "Armed with percussion rifles, $a_tsin_line_riflemen$ are the core of the industrial army. They consume factory-made rifles and ammunition in bulk."
 a_tsin_rifle_skirmishers: "Rifle Skirmishers"
 a_tsin_rifle_skirmishers_desc: "With rifled guns, $a_tsin_rifle_skirmishers$ spread out, take cover, and unsettle enemy formations from a distance."
 a_tsin_breech_loading_battery: "Breech-Loading Battery"
 a_tsin_breech_loading_battery_desc: "Armed with steel breech-loaders, a $a_tsin_breech_loading_battery$ pours out explosive shells at a rapid rate. It consumes steel and explosives."
 a_tsin_mounted_rifles: "Mounted Rifles"
 a_tsin_mounted_rifles_desc: "$a_tsin_mounted_rifles$ move quickly on horseback and dismount to fight with repeating rifles."
 n_tsin_ironclad: "Ironclad"
 n_tsin_ironclad_desc: "With steam engines and iron armour, the $n_tsin_ironclad$ shrugs off the fire of wooden warships. It consumes a great deal of steel, engines and coal."
 n_tsin_monitor: "Monitor"
 n_tsin_monitor_desc: "Carrying a revolving turret, the $n_tsin_monitor$ brings heavy firepower to coastal waters. It is slow and vulnerable on the open sea."
 n_tsin_torpedo_boat: "Torpedo Boat"
 n_tsin_torpedo_boat_desc: "Small and fast, the $n_tsin_torpedo_boat$ threatens large warships with torpedoes. It consumes explosives."

 STATIC_MODIFIER_NAME_tsin_military_full_rearmament: "Full Rearmament"
 STATIC_MODIFIER_NAME_tsin_military_converted_muskets: "Converted Muskets"
 STATIC_MODIFIER_NAME_tsin_military_ironclad_programme: "Ironclad Programme"
 STATIC_MODIFIER_NAME_tsin_military_coastal_defence: "Coastal Defence First"
 STATIC_MODIFIER_NAME_tsin_military_patriotic_press: "Patriotic Press"

 tsin_military.10.title: "Breech-Loading Rifles"
 tsin_military.10.desc: "A rifle loaded from the rear while lying prone fires several times faster than a soldier standing with a ramrod. The generals demand that the whole army be re-armed, but the arsenals are still full of serviceable muskets."
 tsin_military.10.a: "Re-arm the whole army at once."
 tsin_military.10.b: "Convert the muskets in the arsenals to breech-loaders."
 tsin_military.10.c: "The old drill has won every war so far."
 tsin_military.20.title: "The First Ironclads"
 tsin_military.20.desc: "Word has reached the admiralty that a steam-driven warship clad in iron shrugged off the shot of wooden ships of the line. Our fleet became obsolete overnight."
 tsin_military.20.a: "Hurry an ironclad building programme."
 tsin_military.20.b: "Defend the coasts and harbours first."
 tsin_military.20.c: "Let other navies make the costly mistakes."
 tsin_military.30.title: "War Correspondents"
 tsin_military.30.desc: "Thanks to the telegraph, news from the front appears in the next morning's papers. The correspondents report not only cheering victories but also the horrors of the field hospitals. The government must decide how to handle the reports."
 tsin_military.30.a: "Censor the dispatches."
 tsin_military.30.b: "Give the news first to the patriotic papers."
 tsin_military.30.c: "Let the correspondents report freely."
