 STATIC_MODIFIER_NAME_tsin_mission_modern_communications: "Railways and Telegraphs"
 STATIC_MODIFIER_NAME_tsin_mission_treaty_revision: "Treaties Revised"

 tsin_flavor.10.title: "Gunboats in the Harbour"
 tsin_flavor.10.desc: "Steam-powered warships flying a foreign flag have anchored off our harbour. Their envoy politely asks that our ports be opened to his merchants. Nobody mistakes the guns trained on the town for politeness."
 tsin_flavor.10.a: "Open the ports, on terms we can still negotiate."
 tsin_flavor.10.b: "Our harbours will stay closed."
 tsin_flavor.20.title: "Emancipation of the Serfs"
 tsin_flavor.20.desc: "Half of our people are still bound to the land of their lords. Reformers warn that a country of serfs cannot fill factories or field modern armies; the landowners warn that freedom will bring ruin and revolt."
 tsin_flavor.20.a: "Free them with land, paid for by redemption dues."
 tsin_flavor.20.b: "Free them, but the land stays with the lords."
 tsin_flavor.20.c: "The old order has served us well."
 tsin_flavor.30.title: "A Modernizing Edict"
 tsin_flavor.30.desc: "Humbled by the foreigners, the court is debating how far reform should go. Some want to remake the state from top to bottom; others want only foreign guns and machines, leaving everything else as it was."
 tsin_flavor.30.a: "Proclaim the reorganization of the whole state."
 tsin_flavor.30.b: "Foreign machines, our own institutions."
 tsin_flavor.30.c: "We will not abandon the ways of our ancestors."

