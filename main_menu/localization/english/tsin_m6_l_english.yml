 tsin_modernization: "Modernizing Reforms"
 tsin_modernization_DESCRIPTION: "Foreign gunboats and unequal treaties have shown how far we have fallen behind. Only by learning the methods of the industrial powers can we stand against them."
 tsin_modernization_CRITERIA_DESCRIPTION: "With a modern army, schools, factories and railways, we have revised the unequal treaties."
 tsin_modernization_BUTTON_TOOLTIP: "Learn from the foreigners in order to resist them."
 tsin_modernization_BUTTON_DETAILS: "$tsin_modernization_BUTTON_TOOLTIP$"
 tsin_mission_foreign_advisors: "Foreign Advisors"
 tsin_mission_foreign_advisors_desc: "Research [ShowAdvanceName('tsin_steam_age_advance')]."
 tsin_mission_army_reform: "Army Reform"
 tsin_mission_army_reform_desc: "Research [ShowAdvanceName('tsin_percussion_cap_advance')]."
 tsin_mission_state_arsenal: "The State Arsenal"
 tsin_mission_state_arsenal_desc: "Have at least one [location|e] with factory-tier [buildings|e]."
 tsin_mission_modern_schools: "Modern Schools"
 tsin_mission_modern_schools_desc: "Research [ShowAdvanceName('tsin_mass_society_advance')]."
 tsin_mission_modern_communications: "Railways and Telegraphs"
 tsin_mission_modern_communications_desc: "Join another [location|e] to the capital by railroad."
 tsin_mission_treaty_revision: "Treaty Revision"
 tsin_mission_treaty_revision_desc: "Have at least 3 [locations|e] with factory-tier [buildings|e] and be at peace. Removes [ShowModifier('tsin_unequal_treaty')]."
