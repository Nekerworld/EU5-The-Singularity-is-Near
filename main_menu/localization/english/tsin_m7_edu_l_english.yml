l_english:

 tsin_research_university: "Research University"
 tsin_research_university_desc: "The lecture hall becomes a research institution with laboratories and institutes. Replaces the $university$, keeps all its effects, and adds higher education capacity to the [tsin_education_ladder_concept|e] with every level."
 tsin_research_university_slot_0: "Research University"
 tsin_research_university_lectures: "Lecture Halls"
 tsin_research_university_laboratory: "Laboratories"
 tsin_research_university_institute: "Engineering Institutes"
 tsin_humboldt_university_advance: "Humboldtian University Reform"
 tsin_humboldt_university_advance_desc: "Professors teach and research at once, and students enjoy the freedom to learn. Unlocks the $tsin_research_university$."
 tsin_experimental_science_advance: "Experimental Science"
 tsin_experimental_science_advance_desc: "University laboratories pour out new discoveries in chemistry and physics. Opens the laboratory tier and the second level of the $tsin_research_university$."
 tsin_engineering_education_advance: "Engineering Education"
 tsin_engineering_education_advance_desc: "Technical universities and schools train engineers who design machines and power systems. Opens the engineering institute tier and third level of the $tsin_research_university$ and the comprehensive course of the $tsin_public_school$."
 TSIN_BUILDING_LEVEL_EXPERIMENTAL_SCIENCE: "$tsin_experimental_science_advance$"
 TSIN_BUILDING_LEVEL_ENGINEERING_EDUCATION: "$tsin_engineering_education_advance$"
 STATIC_MODIFIER_NAME_tsin_secondary_education_1: "Secondary Education I"
 STATIC_MODIFIER_NAME_tsin_secondary_education_2: "Secondary Education II"
 STATIC_MODIFIER_NAME_tsin_secondary_education_3: "Secondary Education III"
 STATIC_MODIFIER_NAME_tsin_secondary_education_4: "Secondary Education IV"
 STATIC_MODIFIER_NAME_tsin_higher_education_1: "Higher Education I"
 STATIC_MODIFIER_NAME_tsin_higher_education_2: "Higher Education II"
 STATIC_MODIFIER_NAME_tsin_higher_education_3: "Higher Education III"
 STATIC_MODIFIER_NAME_tsin_higher_education_4: "Higher Education IV"
 tsin_system.20.title: "Education Report"
 tsin_system.20.desc: "The ministry of education reports on the state of national schooling.\n\n$BULLET$Literacy: [ROOT.ScriptValue('tsin_country_literacy')|0]\n$BULLET$Secondary education: [ROOT.ScriptValue('tsin_country_secondary_education')|1] (target [ROOT.ScriptValue('tsin_country_secondary_education_target')|1])\n$BULLET$Higher education: [ROOT.ScriptValue('tsin_country_higher_education')|1] (target [ROOT.ScriptValue('tsin_country_higher_education_target')|1])\n$BULLET$$tsin_public_school$ levels: [ROOT.ScriptValue('tsin_country_school_levels')|0]\n$BULLET$University levels: [ROOT.ScriptValue('tsin_country_university_levels')|0]\n\nSecondary education cannot exceed 90% of literacy, nor higher education 60% of secondary. Targets come from school and university capacity, and the rates close 10% of the gap each year."
 tsin_system.20.a: "We must do more for education."
 mapmode_tsin_education_name: "Education Ladder"
 MAPMODE_TSIN_EDUCATION: "#T $mapmode_tsin_education_name$#!\n$mapmode_common_start$ [locations|e] by their owner's higher education rate. Locations with a $tsin_research_university$ are highlighted."
 TSIN_EDUCATION_MAPMODE_TT: "Literacy [ROOT.ScriptValue('tsin_location_owner_literacy')|0], secondary education [ROOT.ScriptValue('tsin_location_owner_secondary_education')|1], higher education [ROOT.ScriptValue('tsin_location_owner_higher_education')|1]"
 LEGEND_KEY_TSIN_RESEARCH_UNIVERSITY: "$tsin_research_university$"
 LEGEND_KEY_TSIN_HIGHER_EDUCATION: "Higher education (darker is higher)"
 LEGEND_KEY_TSIN_NO_EDUCATION_LADDER: "Education ladder not started"
