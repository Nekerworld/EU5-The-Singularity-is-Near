 TSIN_LEDGER_BANK_NOTE: "Deposit banking is opt-in. Deposits debit burgher cash and create bank liabilities. Withdrawals retain unpaid claims; reserve lending must be repaid. Overseas contracts retain separate rates, maturity and currency principal. New contracts fix the current facility rate; 60-month credit adds 2pp. Issuance has a 12-month cooldown. Principal is denominated in borrower currency: devaluation reduces its reference value. No native foreign-exchange settlement or sovereign-loan replacement is implied."
