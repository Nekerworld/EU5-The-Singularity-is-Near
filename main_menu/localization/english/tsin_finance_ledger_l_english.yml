 TSIN_LEDGER_ENTITY_NOTE: "Pilot legal entities hold newly paid-in cash under permanent IDs. They do not receive arbitrary shares of legacy pooled assets or debts and are excluded from the old firm-type counts. One active pilot bank and company can be chartered per country; inherited entities are preserved. Inspection is a dated snapshot. Equity subscription creates ownership; a paid public contract creates revenue, not government equity. Liquidation distributes available cash pro rata, writes off unpaid claims once and closes the company. These pilots are financial accounts, not autonomous production or full corporate simulation."
