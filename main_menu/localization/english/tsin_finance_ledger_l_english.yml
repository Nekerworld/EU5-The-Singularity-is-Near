 TSIN_LEDGER_AUDIT_NOTE: "Prudential/strict supervision requires a paid bank audit for new lending. Mandatory disclosure requires a paid corporate audit for new loans, bonds and equity. Audits last 12 months; bank cash pays 1% of bank assets and company cash pays 1% of one transaction lot (minimum 0.01). Existing interest, repayment, withdrawal and winding-down remain available. Government loss support is a grant, not a loan or ownership stake."
