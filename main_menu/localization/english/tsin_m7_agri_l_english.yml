l_english:

 tsin_farm_machinery: "Farm Machinery"
 tsin_farm_machinery_desc: "Reapers, threshers and steam ploughs are made only by the [ShowBuildingTypeName('tsin_farm_machinery_works')] and bought only by the [ShowBuildingTypeName('tsin_mechanized_farm')], which wears them out as upkeep ([tsin_agricultural_revolution_concept|e])."
 MODIFIER_TYPE_NAME_can_extract_tsin_farm_machinery: "Can Extract Farm Machinery"
 MODIFIER_TYPE_DESC_can_extract_tsin_farm_machinery: "This allows the extraction of [ShowGoodsName('tsin_farm_machinery')] by allowing an [rgo|e] in a [location|e]."
 MODIFIER_TYPE_NAME_ban_exports_of_tsin_farm_machinery: "Ban Exports of $tsin_farm_machinery$"
 MODIFIER_TYPE_DESC_ban_exports_of_tsin_farm_machinery: "This blocks the [export|e] of [ShowGoodsName('tsin_farm_machinery')] from all [markets|e] that a [country|e] owns."
 MODIFIER_TYPE_NAME_ban_imports_of_tsin_farm_machinery: "Ban Imports of $tsin_farm_machinery$"
 MODIFIER_TYPE_DESC_ban_imports_of_tsin_farm_machinery: "This blocks the [import|e] of [ShowGoodsName('tsin_farm_machinery')] to all [markets|e] that a [country|e] owns."
 MODIFIER_TYPE_NAME_local_tsin_farm_machinery_output_modifier: "Local $tsin_farm_machinery$ Output"
 MODIFIER_TYPE_DESC_local_tsin_farm_machinery_output_modifier: "This modifies the [output|e] of [ShowGoodsName('tsin_farm_machinery')] in this [location|e]."
 MODIFIER_TYPE_NAME_local_tsin_farm_machinery_establishment_speed: "Local $tsin_farm_machinery$ Establishment Speed"
 MODIFIER_TYPE_DESC_local_tsin_farm_machinery_establishment_speed: "How quickly newly constructed [buildings|e] producing [ShowGoodsName('tsin_farm_machinery')] in this [location|e] reach their full [production_efficiency|e]."
 MODIFIER_TYPE_NAME_global_tsin_farm_machinery_output_modifier: "$tsin_farm_machinery$ Output"
 MODIFIER_TYPE_DESC_global_tsin_farm_machinery_output_modifier: "This modifies the [output|e] of [ShowGoodsName('tsin_farm_machinery')] in the entire [country|e]."
 MODIFIER_TYPE_NAME_global_tsin_farm_machinery_establishment_speed: "$tsin_farm_machinery$ Establishment Speed"
 MODIFIER_TYPE_DESC_global_tsin_farm_machinery_establishment_speed: "How quickly newly constructed [buildings|e] producing [ShowGoodsName('tsin_farm_machinery')] in the entire [country|e] reach their full [production_efficiency|e]."
 MODIFIER_TYPE_NAME_global_tsin_farm_machinery_pop_demand: "National [ShowGoodsNameWithNoTooltip('tsin_farm_machinery')] Demand"
 MODIFIER_TYPE_DESC_global_tsin_farm_machinery_pop_demand: "This modifies the [pop_needs|e] of the [ShowGoodsName('tsin_farm_machinery')] [produced_good|e]."
 MODIFIER_TYPE_NAME_tsin_farm_machinery_impacts_inflation: "Farm Machinery Impact Inflation"
 MODIFIER_TYPE_DESC_tsin_farm_machinery_impacts_inflation: "This determines how the production of [ShowGoodsName('tsin_farm_machinery')] impacts [inflation|e] in the [country|e]."
 MODIFIER_TYPE_NAME_tsin_farm_machinery_used_for_minting: "Farm Machinery Used for Coins"
 MODIFIER_TYPE_DESC_tsin_farm_machinery_used_for_minting: "This determines if [ShowGoodsName('tsin_farm_machinery')] is used for coins in the [country|e]."
 TSIN_BUILDING_LEVEL_INTENSIVE_FARMING: "$tsin_intensive_farming_advance$"
 TSIN_BUILDING_LEVEL_NITROGEN_FIXATION: "$tsin_nitrogen_fixation_advance$"
 tsin_farm_machinery_works: "Farm Machinery Works"
 tsin_farm_machinery_works_desc: "Builds reapers, threshers and ploughs, supplying the countryside with $tsin_farm_machinery$. The $tsin_mechanized_farm$ cannot run without it ([tsin_agricultural_revolution_concept|e])."
 tsin_farm_machinery_works_slot_0: "Construction Method"
 tsin_farm_machinery_works_iron: "Iron Implements"
 tsin_farm_machinery_works_steel: "Steel Machinery"
 tsin_farm_machinery_works_steam_traction: "Steam Traction Engines"
 tsin_mechanized_farm: "Mechanized Farm"
 tsin_mechanized_farm_desc: "Reapers, steam threshers and chemical fertilizer reap several times the grain from the same land. Each level consumes $tsin_fertilizer$ and $tsin_farm_machinery$. Built by refitting existing $tsin_fertilized_fields$ ([tsin_agricultural_revolution_concept|e])."
 tsin_mechanized_farm_slot_0: "Upkeep"
 tsin_mechanized_farm_maintenance: "Fertilizer and Machinery"
 tsin_nitrogen_fixation_plant: "Nitrogen Fixation Plant"
 tsin_nitrogen_fixation_plant_desc: "Captures nitrogen from the air to make $tsin_fertilizer$ without saltpeter mines. Built by refitting an existing $tsin_fertilizer_plant$ ([tsin_chemical_industry_concept|e])."
 tsin_nitrogen_fixation_plant_slot_0: "Synthesis Method"
 tsin_nitrogen_fixation_cyanamide: "Cyanamide Process"
 tsin_nitrogen_fixation_ammonia: "Ammonia Synthesis"
 tsin_agricultural_chemistry_advance: "Agricultural Chemistry"
 tsin_agricultural_chemistry_advance_desc: "Once chemists show what plants take from the soil, farmers manure by calculation rather than by habit."
 tsin_mechanical_reaper_advance: "The Mechanical Reaper"
 tsin_mechanical_reaper_advance_desc: "One horse-drawn reaper does the work of ten hands. Allows building the $tsin_farm_machinery_works$."
 tsin_canning_advance: "Canning"
 tsin_canning_advance_desc: "Food sealed in tin keeps for years."
 tsin_steam_threshing_advance: "Steam Threshing"
 tsin_steam_threshing_advance_desc: "Steam threshers finish in days what took all winter. Allows refitting into the $tsin_mechanized_farm$ and steel machinery in farm machinery works."
 tsin_refrigerated_transport_advance: "Refrigerated Transport"
 tsin_refrigerated_transport_advance_desc: "Refrigerated wagons and ships carry meat and grain fresh to the other side of the world."
 tsin_intensive_farming_advance: "Intensive Farming"
 tsin_intensive_farming_advance_desc: "Rotation, drainage and steam traction work the same land harder for larger yields. The $tsin_mechanized_farm$ can be built to level 2."
 tsin_nitrogen_fixation_advance: "Nitrogen Fixation"
 tsin_nitrogen_fixation_advance_desc: "Drawing nitrogen from the air ends the dependence on Chilean saltpeter. Allows the $tsin_nitrogen_fixation_plant$, and the $tsin_mechanized_farm$ can be built to level 3."
 tsin_ammonia_synthesis_advance: "Ammonia Synthesis"
 tsin_ammonia_synthesis_advance_desc: "High-pressure catalytic reactors bind nitrogen and hydrogen into ammonia, and fertilizer to feed the world pours out of the factory."
 tsin_agriculture.10.title: "The Guano Boom"
 tsin_agriculture.10.desc: "Seabird droppings shipped from Pacific islands are sold as a miracle fertilizer. It is dear, but farmers who try it swear their harvests have doubled."
 tsin_agriculture.10.a: "Buy it by the shipload."
 tsin_agriculture.10.b: "Look for saltpeter at home."
 tsin_agriculture.20.title: "A Reaper Demonstration"
 tsin_agriculture.20.desc: "A foreign engineer cuts a field of wheat in minutes with a horse-drawn reaper. The landowners watching are amazed; the farmhands exchange uneasy looks."
 tsin_agriculture.20.a: "License a domestic maker."
 tsin_agriculture.20.b: "Buy reapers for the great estates."
 tsin_agriculture.30.title: "An Agricultural Society"
 tsin_agriculture.30.desc: "A petition asks for an agricultural society to study new methods and hold shows. The question is who should run it."
 tsin_agriculture.30.a: "Grant a royal charter to the landowners."
 tsin_agriculture.30.b: "Support the village cooperatives."
 tsin_agriculture.40.title: "New Breeds and Varieties"
 tsin_agriculture.40.desc: "Breeders have produced fatter cattle and disease-resistant wheat. Both programs want support."
 tsin_agriculture.40.a: "Improve the herds."
 tsin_agriculture.40.b: "Improve the grain."
 tsin_agriculture.50.title: "The First Refrigerated Railcar"
 tsin_agriculture.50.desc: "A railcar packed with ice has brought meat from a distant ranch to the city market without spoiling. The city butchers' guild protests."
 tsin_agriculture.50.a: "Let the far countryside feed the cities."
 tsin_agriculture.50.b: "Protect the local butchers."
 tsin_agriculture.60.title: "The Rural Exodus"
 tsin_agriculture.60.desc: "With machines doing the work, the young leave the villages for the factory towns. Landowners complain that they cannot find hands."
 tsin_agriculture.60.a: "Let them go to the factories."
 tsin_agriculture.60.b: "Tie them to the land."
 tsin_agriculture.70.title: "Bread from the Air"
 tsin_agriculture.70.desc: "Chemists have succeeded in capturing nitrogen from the air. The same process makes both fertilizer and the stuff of explosives."
 tsin_agriculture.70.a: "Fertilizer for the fields."
 tsin_agriculture.70.b: "Nitrates for the arsenals."
 tsin_agriculture.80.title: "A Flood of Cheap Grain"
 tsin_agriculture.80.desc: "Wheat from the New World pours into our ports by rail and steamship. Bread is cheaper, but grain prices collapse and farms close one after another."
 tsin_agriculture.80.a: "What is to be done?"
 tsin_agriculture.81.title: "The Farm Question"
 tsin_agriculture.81.desc: "Parliament demands an answer to the grain crisis. Landowners want tariffs, townsfolk want cheap bread, reformers want modern farms."
 tsin_agriculture.81.a: "Impose protective grain tariffs."
 tsin_agriculture.81.b: "Cheap bread for the cities."
 tsin_agriculture.81.c: "Modernize the farms."
 tsin_agriculture.90.title: "The Grain Crisis Passes"
 tsin_agriculture.90.desc: "A new balance has settled on the world grain market. The farms that survived are larger and more mechanized."
 tsin_agriculture.90.a: "The land endures."
