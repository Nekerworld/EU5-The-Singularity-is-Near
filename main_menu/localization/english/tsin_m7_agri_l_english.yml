 tsin_grain_invasion: "The Grain Invasion"
 tsin_grain_invasion_desc: "Railways and steamships carry cheap New World grain to the markets of the Old World. Bread is cheaper, but the farms and landowners that grow grain are going under. Each country in crisis gets out by choosing [tariffs|e], cheap bread or farm modernization.\n\nSee also: [tsin_grain_invasion_concept|e]"
 tsin_grain_invasion_adjusted: "A New Balance"
 tsin_grain_invasion_runs_its_course: "The Crisis Runs Its Course"
 tsin_grain_invasion_crisis_tt: "This [country|e] is in a grain crisis."
 tsin_grain_invasion_policy_tt: "This [country|e] has settled its grain policy."
 tsin_grain_invasion_open_market_legend: "Cheap Bread or Farm Modernization"
 hint_tsin_grain_invasion: "[GetSituationByKey('tsin_grain_invasion').GetNameWithNoTooltip]"
 hint_tsin_grain_invasion_hint_text: "[GetSituationByKey('tsin_grain_invasion').GetName] has hit the farming countries with railways. Countries where factory workers are 20% or more of the population are spared.\n\n#T Recommended actions:#!\n@arrow_bonus_tier_3! Choosing a policy in the farm question event ends the crisis. With $tsin_steam_threshing_advance$ you can choose farm modernization.\n@arrow_bonus_tier_2! During [GetSituationByKey('tsin_long_depression').GetName] the policy event comes twice as often."
 hint_tsin_grain_invasion_diplomatic: "\"When bread is cheap, the town laughs and the village weeps.\""
 hint_tsin_grain_invasion_administrative: "\"Tariffs save the landlord; machines save the farm.\""
 hint_tsin_grain_invasion_military: "\"When the farm boys leave, so do the regiments.\""
