 # System events
 tsin_system.2.title: "The Age of Industry"
 tsin_system.2.desc: "The world has entered the [ShowAgeName('age_7_industrialization')]. Three new [tsin_industrial_institutions_concept|e] will emerge over the coming decades: $tsin_industrial_capitalism$, $tsin_mass_society$ and $tsin_electrification$. Each opens new [advances|e] once embraced.\n\nThis age has no fixed end: the game continues until the year 2337. The encyclopedia entry [tsin_singularity_concept|e] explains everything the age adds."
 tsin_system.2.a: "Full steam ahead."
 tsin_system.10.title: "$tsin_industrial_capitalism$ Emerges"
 tsin_system.10.desc: "Word reaches us of factories financed by shareholders rather than single masters, and of profits ploughed back into ever larger mills. A new [institution|e], $tsin_industrial_capitalism$, has appeared in the world."
 tsin_system.10.a: "Where capital goes, so must we."
 tsin_system.11.title: "$tsin_mass_society$ Emerges"
 tsin_system.11.desc: "Cheap newspapers, crowded cities and schoolrooms full of children are reshaping how people think about their rulers. A new [institution|e], $tsin_mass_society$, has appeared in the world."
 tsin_system.11.a: "The public has found its voice."
 tsin_system.12.title: "$tsin_electrification$ Emerges"
 tsin_system.12.desc: "Engineers abroad have begun lighting streets and driving machines with current carried along copper wire. A new [institution|e], $tsin_electrification$, has appeared in the world."
 tsin_system.12.a: "Let there be light."
