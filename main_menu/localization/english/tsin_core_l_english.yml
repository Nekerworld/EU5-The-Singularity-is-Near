 # Levy units
 a_tsin_reservists: "Reservists"
 a_tsin_reservists_desc: "Former conscripts who return to civilian life after their service but can be recalled by rail and telegraph within days. $a_tsin_reservists$ are drilled, equipped from state arsenals, and far more reliable than raw [levies|e]."
 a_tsin_mounted_constabulary: "Mounted Constabulary"
 a_tsin_mounted_constabulary_desc: "Gentlemen volunteers and rural police on horseback. The $a_tsin_mounted_constabulary$ keep order in the countryside and scout ahead of the reserve armies in wartime."

