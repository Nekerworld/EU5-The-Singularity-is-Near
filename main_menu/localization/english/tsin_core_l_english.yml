l_english:
 # Age
 age_7_industrialization: "Industry"
 age_7_industrialization_desc: "Coal, iron and steam have broken the old limits of muscle and water. Factories gather the rural poor into roaring cities, railways bind distant markets together, and the wealth of nations is now measured in tons of steel. Those who master the new machines will command the century; those who do not will be made to serve them."
 age_format_age_7_industrialization: "Age of $age_7_industrialization$"
 current_age_at_least_7_tt: "Current [age|e] is at least [ShowAgeName('age_7_industrialization')] or later"

 # Institutions
 tsin_industrial_capitalism: "Industrial Capitalism"
 tsin_industrial_capitalism_desc: "Joint-stock companies, factory owners and banks now pool capital on a scale no guild or merchant house could imagine. Profit is reinvested in machines rather than land, and the owners of industry begin to rival the old nobility in wealth and influence."
 tsin_mass_society: "Mass Society"
 tsin_mass_society_desc: "Cheap newspapers, public schools and crowded city streets have created something new: a public that reads, argues and organizes. Rulers can no longer ignore the opinions of millions who now know what happens in the capital the very next morning."
 tsin_electrification: "Electrification"
 tsin_electrification_desc: "Dynamos and copper wire carry power from the generating station to the factory floor and the city street. Light no longer depends on the sun or the candle, and machines no longer need to stand beside the boiler that drives them."

 # Advances
 tsin_steam_age_advance: "The Steam Age"
 tsin_steam_age_advance_desc: "Steam engines have left the mines and mills and spread to every corner of economic life. Cleaner water, better food supply and the first public health measures let cities grow without consuming their own people."
 tsin_industrial_capitalism_advance: "Industrial Capitalism"
 tsin_industrial_capitalism_advance_desc: "By embracing the joint-stock company and the factory system, we let capital flow to wherever it earns the most, and our mills multiply accordingly."
 tsin_mass_society_advance: "Mass Society"
 tsin_mass_society_advance_desc: "Public schooling, the penny press and growing cities draw ordinary people into the life of the nation, for better and for worse."
 tsin_electrification_advance: "Electrification"
 tsin_electrification_advance_desc: "Electric power lets our workshops run longer and more precisely, and the upkeep of our industry falls as old machinery is replaced."

 # Common unlocks
 tsin_reserve_system_advance: "Reserve System"
 tsin_reserve_system_advance_desc: "Short active service followed by years in the reserve gives us a trained army many times larger than the one we pay for in peacetime."
 tsin_fort_limit_7_advance: "Polygonal Fortresses"
 tsin_fort_limit_7_advance_desc: "Low, detached forts with deep ditches replace the old star fortress, letting us defend more ground with fewer works."
 tsin_supply_limit_7_advance: "Canned Provisions"
 tsin_supply_limit_7_advance_desc: "Food sealed in tins keeps for months, so armies can gather where the countryside alone could never feed them."

 # Choice advances - administrative
 tsin_civil_service_exams: "Civil Service Examinations"
 tsin_civil_service_exams_desc: "Appointment by examination rather than patronage gives us clerks who can actually count."
 tsin_statistical_bureau: "Statistical Bureau"
 tsin_statistical_bureau_desc: "Regular censuses and published tables tell the state what it owns and who lives there."
 tsin_income_tax: "Income Tax"
 tsin_income_tax_desc: "Taxing earnings instead of land reaches the new wealth of mills and offices."
 tsin_central_banking: "Central Banking"
 tsin_central_banking_desc: "A bank of issue that lends to the state and steadies the money market lowers the cost of our debts."
 tsin_public_works: "Public Works Department"
 tsin_public_works_desc: "Engineers on the state payroll plan and supervise construction across the realm."
 tsin_scientific_agriculture: "Scientific Agriculture"
 tsin_scientific_agriculture_desc: "Crop rotation, drainage and fertilizer let fewer acres feed more mouths."
 tsin_mining_engineering: "Mining Engineering"
 tsin_mining_engineering_desc: "Schools of mines and steam pumps make deeper and cheaper shafts possible."
 tsin_national_education: "National Education"
 tsin_national_education_desc: "A school in every parish teaches reading, arithmetic and loyalty to the nation."
 tsin_modern_police: "Modern Police"
 tsin_modern_police_desc: "Uniformed constables replace the watchman and the garrison in keeping public order."
 tsin_parliamentary_procedure: "Parliamentary Procedure"
 tsin_parliamentary_procedure_desc: "Standing orders, committees and recorded votes let assemblies pass laws without endless quarrels."

 # Choice advances - diplomatic
 tsin_telegraph_diplomacy: "Telegraph Diplomacy"
 tsin_telegraph_diplomacy_desc: "Instructions that once took weeks to reach an embassy now arrive within hours."
 tsin_consular_service: "Consular Service"
 tsin_consular_service_desc: "Consuls in every major port look after our merchants and report on foreign markets."
 tsin_free_trade_doctrine: "Free Trade Doctrine"
 tsin_free_trade_doctrine_desc: "Lower barriers and reciprocal treaties widen the field for our traders."
 tsin_steamship_lines: "Steamship Lines"
 tsin_steamship_lines_desc: "Scheduled steamers run regardless of the wind, carrying our goods to distant markets."
 tsin_trading_houses: "Trading Houses"
 tsin_trading_houses_desc: "Great merchant firms with branches abroad concentrate trade in our hands."
 tsin_protectorates: "Protectorates"
 tsin_protectorates_desc: "Residents and advisors at foreign courts keep our dependents in line without open rule."
 tsin_colonial_office: "Colonial Office"
 tsin_colonial_office_desc: "A dedicated ministry organizes settlement, shipping and land grants for emigrants."
 tsin_great_power_diplomacy: "Great Power Diplomacy"
 tsin_great_power_diplomacy_desc: "Congresses of the powers settle questions that once needed a war, and our word carries weight in them."
 tsin_coaling_stations: "Coaling Stations"
 tsin_coaling_stations_desc: "A chain of coaling ports lets our steam squadrons stay at sea far from home."
 tsin_ironclad_yards: "Ironclad Shipyards"
 tsin_ironclad_yards_desc: "Iron frames, steam hammers and dry docks speed up the building of warships."

 # Choice advances - military
 tsin_general_staff: "General Staff"
 tsin_general_staff_desc: "A permanent planning staff prepares campaigns, railway timetables and maps long before war begins."
 tsin_breech_loading_rifles: "Breech-Loading Rifles"
 tsin_breech_loading_rifles_desc: "Soldiers who can reload lying down fire faster and survive longer."
 tsin_rifled_artillery: "Rifled Artillery"
 tsin_rifled_artillery_desc: "Spiral grooves give shells range and accuracy that smoothbores never had."
 tsin_military_railways: "Military Railways"
 tsin_military_railways_desc: "Recruits reach their depots by train instead of on foot."
 tsin_field_medicine: "Field Medicine"
 tsin_field_medicine_desc: "Ambulances, field hospitals and clean water cut the losses to disease on campaign."
 tsin_mass_mobilization: "Mass Mobilization"
 tsin_mass_mobilization_desc: "Registers of every fit man of military age let us call up far more of the population."
 tsin_officer_schools: "Officer Schools"
 tsin_officer_schools_desc: "Staff colleges train commanders by the hundred rather than by birth."
 tsin_canned_rations: "Field Rations"
 tsin_canned_rations_desc: "Regular hot meals and preserved food help resting troops recover their spirit."
 tsin_steam_navy_doctrine: "Steam Navy Doctrine"
 tsin_steam_navy_doctrine_desc: "Crews trained for steam and shell trust their ships and their tactics."
 tsin_coastal_batteries: "Coastal Batteries"
 tsin_coastal_batteries_desc: "Heavy guns in casemates guard our harbors and the garrisons that man them."

