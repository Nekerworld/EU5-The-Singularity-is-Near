 tsin_tenement_maintenance: "Tenement Upkeep"
 tsin_model_dwellings: "Model Dwellings"
 tsin_model_dwellings_desc: "Workers' housing with light, ventilation and running water. Replaces $tsin_tenement$ and improves [tsin_labor_conditions_concept|e] at the local factories."
 tsin_model_dwellings_slot_0: "Model Dwelling Block"
 tsin_model_dwellings_maintenance: "Model Dwelling Upkeep"
 tsin_housing_reform_advance: "Housing Reform"
 tsin_housing_reform_advance_desc: "Philanthropic housing companies and sanitary reformers set out to give workers bright, clean homes. Unlocks $tsin_model_dwellings$."
