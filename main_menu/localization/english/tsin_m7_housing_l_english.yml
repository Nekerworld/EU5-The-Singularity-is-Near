l_english:

 tsin_tenement: "Workers' Tenements"
 tsin_tenement_desc: "Cheap, densely packed tenements for factory hands. They let a crowded city ([tsin_housing_concept|e]) hold more people, but the cramped, damp rooms breed [diseases|e]."
