l_english:
 game_concept_tsin_industrial_economy_concept: "Industrial Economy"
 game_concept_tsin_industrial_economy_concept_desc: "The Age of $age_format_age_7_industrialization$ turns workshops into factories. Its new [goods|e] and [buildings|e] form one connected chain: coal, iron and steel feed the [ShowBuildingTypeName('tsin_machine_works')], whose [ShowGoodsName('tsin_engines')] are needed by almost every new building, by Age VII ships and by the construction of new factories. Railways widen the [market|e], chemistry and machines push farms and mines past their old limits, and electricity finally replaces steam.\n\nThe parts of the industrial economy:\n$BULLET$[tsin_new_goods_concept|e]: seven new goods, from engines to electricity.\n$BULLET$[tsin_factories_concept|e]: the new factories and their [production_methods|e].\n$BULLET$[tsin_building_upgrades_concept|e]: refitting old buildings into modern ones.\n$BULLET$[tsin_chemical_industry_concept|e]: fertilizer and explosives for farms and mines.\n$BULLET$[tsin_extraction_tiers_concept|e]: deeper mines and steam sawmills.\n$BULLET$[tsin_agricultural_revolution_concept|e]: mechanized farms and more food.\n$BULLET$[tsin_automation_concept|e]: automated mills that need large markets.\n$BULLET$[tsin_electric_power_concept|e]: power stations and electric production methods.\n$BULLET$[tsin_railways_concept|e]: railway stations, [market_access|e], standard time and canals.\n$BULLET$[tsin_infrastructure_concept|e]: waterworks, steam ports, prefectures and city lighting.\n$BULLET$[tsin_oil_prospecting_concept|e]: where oil and rubber come from.\n$BULLET$[tsin_industrial_investment_concept|e]: who pays for the factories.\n$BULLET$[tsin_customs_union_concept|e]: tariff-free trade between industrial countries.\n\nWhere to start: research the [advances|e] of the age, build a [ShowBuildingTypeName('tsin_machine_works')] in a town with good market access, connect your towns to the [capital|e] by [ShowRoadTypeName('railroad')] and build railway stations, then refit your old mills as new advances arrive. The first factories come with [ShowAdvanceName('tsin_machine_works_advance')] at the very start of the age; most others follow the [institutions|e] [ShowInstitutionName('tsin_industrial_capitalism')] and, later, [ShowInstitutionName('tsin_electrification')], whose advances open once you have [embraced|e] them.\n\nMap modes: $mapmode_tsin_industrialization_name$ (factory jobs), $mapmode_tsin_industrial_siting_name$ (good factory sites), $mapmode_tsin_automation_name$, $mapmode_tsin_electrification_name$, $mapmode_tsin_infrastructure_name$, $mapmode_tsin_agriculture_name$ and $mapmode_tsin_industrial_investment_name$."
 game_concept_tsin_new_goods_concept: "Industrial Goods"
 game_concept_tsin_new_goods_concept_desc: "The age adds seven [goods|e]. None of them is bought by [pops|e]: they are inputs that the new [buildings|e] consume, so their demand grows as you industrialize.\n\n$BULLET$[ShowGoodsName('tsin_engines')] (base price 6): made only by the [ShowBuildingTypeName('tsin_machine_works')]. Needed by most Age VII buildings, by the construction of Age VII factories and by the building and repair of Age VII ships. The [industry_promotion|e] $tsin_machinery$ raises its output.\n$BULLET$[ShowGoodsName('tsin_fertilizer')] (2.5): made by the [ShowBuildingTypeName('tsin_fertilizer_plant')] and the [ShowBuildingTypeName('tsin_nitrogen_fixation_plant')]; used by [ShowBuildingTypeName('tsin_fertilized_fields')] and [ShowBuildingTypeName('tsin_mechanized_farm')].\n$BULLET$[ShowGoodsName('tsin_explosives')] (5): made by the [ShowBuildingTypeName('tsin_explosives_plant')]; used by the [ShowBuildingTypeName('tsin_blasting_works')] of mines.\n$BULLET$[ShowGoodsName('tsin_farm_machinery')] (5): made by the [ShowBuildingTypeName('tsin_farm_machinery_works')]; used by mechanized farms.\n$BULLET$[ShowGoodsName('tsin_electricity')] (3): made by the [ShowBuildingTypeName('tsin_power_station')]. Its transport cost is very high, so it is mostly used in the [market|e] that makes it. See [tsin_electric_power_concept|e].\n$BULLET$[ShowGoodsName('tsin_rubber')] (4): a gathered [raw_material|e] of tropical jungle; drive belts for the [ShowBuildingTypeName('tsin_mechanized_textile_mill')].\n$BULLET$[ShowGoodsName('tsin_oil')] (4): a mined [raw_material|e]; lubricant for machine works and fuel for oil-fired power stations.\n\nNo [location|e] starts with rubber or oil; see [tsin_oil_prospecting_concept|e].\n\nWhen a good is scarce its [market_price|e] rises and the production that depends on it falls, so build the makers in the same market as the users."
 game_concept_tsin_factories_concept: "Industrial Factories"
 game_concept_tsin_factories_concept_desc: "Age VII factories are town and city [buildings|e] that turn raw goods into the new [goods|e]. Like vanilla factories they have [production_methods|e]: the basic method is always available and better ones are unlocked by [advances|e]. Inputs are priced so that the output is worth about a third more than the inputs, as in vanilla factories. Building a new factory also needs steel and [ShowGoodsName('tsin_engines')] besides tools and masonry.\n\nNew factories:\n$BULLET$[ShowBuildingTypeName('tsin_machine_works')] ([ShowAdvanceName('tsin_machine_works_advance')]): iron (or steel, after [ShowAdvanceName('tsin_steel_frame_engines_advance')]) with coal and tools makes engines. A second slot adds copper fittings, glass gauges or oil lubrication.\n$BULLET$[ShowBuildingTypeName('tsin_fertilizer_plant')] and [ShowBuildingTypeName('tsin_explosives_plant')]: see [tsin_chemical_industry_concept|e].\n$BULLET$[ShowBuildingTypeName('tsin_farm_machinery_works')]: iron, then steel, then steam traction machinery for farms.\n$BULLET$[ShowBuildingTypeName('tsin_power_station')]: coal, hydro or oil-fired electricity; see [tsin_electric_power_concept|e].\n\nRefitted factories (see [tsin_building_upgrades_concept|e]):\n$BULLET$[ShowBuildingTypeName('tsin_mechanized_textile_mill')] ([ShowAdvanceName('tsin_mechanized_textile_mill_advance')]): cloth from cotton, wool or fiber crops, with a second slot for steam power, rubber belts, water power or electric drive.\n$BULLET$[ShowBuildingTypeName('tsin_nitrogen_fixation_plant')]: fertilizer from coal, electricity and stone.\n$BULLET$Six automated mills; see [tsin_automation_concept|e].\n\nRefitted factories employ about 40% fewer workers per level than vanilla factories. [estates|e] can build all of these factories with their own money ([tsin_industrial_investment_concept|e]).\n\nHelp from the state: the [cabinet_action|e] [ShowCabinetActionName('tsin_encourage_industry')] makes factories in one [province|e] 25% more efficient to build and raises their [production_efficiency|e]; several provinces can be encouraged at once. [ShowAdvanceName('tsin_industrial_capitalism_advance')] itself makes factories 25% more efficient to build and raises production efficiency, and [ShowAdvanceName('tsin_shift_work_advance')] raises production efficiency further but displeases the peasants. The [industry_promotion|e] $tsin_machinery$ promotes engine output.\n\nThe $mapmode_tsin_industrialization_name$ map mode shows what share of each location's population factory jobs could employ, and $mapmode_tsin_industrial_siting_name$ rates sites by market access, coal or iron, a railway station and city rank."
 game_concept_tsin_building_upgrades_concept: "Building Upgrades"
 game_concept_tsin_building_upgrades_concept_desc: "Many Age VII buildings are not new slots but upgrades of older [buildings|e]. Once the unlocking [advance|e] is researched, an existing building can be refitted in place and keeps its location; the upgrade usually needs fewer workers and uses Age VII goods such as engines or electricity.\n\nUpgrades of the industrial economy:\n$BULLET$[ShowBuildingTypeName('textile_mill')] → [ShowBuildingTypeName('tsin_mechanized_textile_mill')]\n$BULLET$[ShowBuildingTypeName('lumber_mill')] → [ShowBuildingTypeName('tsin_steam_sawmill')]\n$BULLET$[ShowBuildingTypeName('iron_mill')], [ShowBuildingTypeName('glass_mill')], [ShowBuildingTypeName('paper_mill')], [ShowBuildingTypeName('furniture_mill')], [ShowBuildingTypeName('printing_mill')] and [ShowBuildingTypeName('fine_cloth_mill')] → the six automated mills ([tsin_automation_concept|e])\n$BULLET$[ShowBuildingTypeName('tsin_fertilized_fields')] → [ShowBuildingTypeName('tsin_mechanized_farm')]\n$BULLET$[ShowBuildingTypeName('tsin_fertilizer_plant')] → [ShowBuildingTypeName('tsin_nitrogen_fixation_plant')]\n$BULLET$[ShowBuildingTypeName('aqueduct_system')] → [ShowBuildingTypeName('tsin_waterworks')]\n$BULLET$[ShowBuildingTypeName('naval_base')] → [ShowBuildingTypeName('tsin_steam_port')]\n$BULLET$[ShowBuildingTypeName('provincial_chancery')] → [ShowBuildingTypeName('tsin_prefecture')]\n\nThe [ShowBuildingTypeName('tsin_research_university')] (from the university) and [ShowBuildingTypeName('tsin_model_dwellings')] (from workers' tenements) belong to the [tsin_industrial_society_concept|e].\n\nThe main vanilla laws, privileges, missions and unit requirements that ask for the old building also accept its upgrade, so refitting does not lock you out of them. A few vanilla events still look only for the old building; the mod adds its own events for the new ones. The waterworks does not keep the special bonuses of the famous aqueducts of a few capitals."
 game_concept_tsin_chemical_industry_concept: "Chemical Industry"
 game_concept_tsin_chemical_industry_concept_desc: "Chemistry lets farms and mines grow beyond their old limits. Two factories make the new goods and two rural [buildings|e] consume them. [ShowAdvanceName('tsin_improved_fertilizer_advance')] unlocks the fertilizer pair and [ShowAdvanceName('tsin_dynamite_advance')] the explosives pair.\n\n$BULLET$[ShowBuildingTypeName('tsin_fertilizer_plant')]: makes [ShowGoodsName('tsin_fertilizer')] from saltpeter, alum and coal (mineral) or from fish, livestock and coal (organic). [ShowAdvanceName('tsin_industrial_electrification_advance')] adds an electrochemical method that uses electricity.\n$BULLET$[ShowBuildingTypeName('tsin_explosives_plant')]: makes [ShowGoodsName('tsin_explosives')] from saltpeter, coal and lumber (black powder, less profitable) or from saltpeter, livestock and alum (nitroglycerin).\n$BULLET$[ShowBuildingTypeName('tsin_fertilized_fields')]: one level in a rural [location|e] producing wheat, maize, rice, millet, legumes or potatoes. +15% raw good [output|e] and more food.\n$BULLET$[ShowBuildingTypeName('tsin_blasting_works')]: in mines of coal, iron, copper, tin, lead, stone, marble, alum, saltpeter, silver, gold, gems, mercury or salt. +15% raw good output. See [tsin_extraction_tiers_concept|e].\n\nThe two rural buildings work like the vanilla windmill: they produce nothing themselves, but their [building_maintenance|e] uses fertilizer or explosives (plus a little tools) and their modifier raises the output of the [rgo|e].\n\nLater, the [ShowBuildingTypeName('tsin_nitrogen_fixation_plant')] replaces the fertilizer plant and makes fertilizer from coal, electricity and stone instead of saltpeter, and fertilized fields can be refitted into mechanized farms ([tsin_agricultural_revolution_concept|e]). [ShowAdvanceName('tsin_electrochemistry_advance')] raises alum and saltpeter output."
 game_concept_tsin_extraction_tiers_concept: "Mining and Forestry"
 game_concept_tsin_extraction_tiers_concept_desc: "Mines and forests modernize in stages, each unlocked by an [advance|e].\n\n$BULLET$[ShowAdvanceName('tsin_dynamite_advance')]: unlocks the [ShowBuildingTypeName('tsin_blasting_works')] (one level, +15% raw good [output|e]) and makes expanding mining [rgo|e] 20% cheaper.\n$BULLET$[ShowAdvanceName('tsin_deep_coal_mining_advance')]: coal output +15% and maximum RGO size +5%. The blasting works can be built to level 2 and gains a steam pumping method that needs less explosives, plus some coal and a few engines.\n$BULLET$[ShowAdvanceName('tsin_iron_ore_beneficiation_advance')]: iron output +15% and maximum RGO size +5%.\n$BULLET$[ShowBuildingTypeName('tsin_steam_sawmill')] ([ShowAdvanceName('tsin_steam_sawmill_advance')]): refits the [ShowBuildingTypeName('lumber_mill')]. Steam saws turn tools, coal and a few engines into more lumber with fewer workers; [ShowAdvanceName('tsin_electric_motor_advance')] adds electric saws that use electricity instead of coal and make more still.\n\nOther output bonuses of the age: [ShowAdvanceName('tsin_bessemer_process_advance')] and [ShowAdvanceName('tsin_open_hearth_advance')] (steel and iron), [ShowAdvanceName('tsin_synthetic_dyes_advance')] (dyes), [ShowAdvanceName('tsin_practical_electrical_engineering_advance')] (copper), [ShowAdvanceName('tsin_electrochemistry_advance')] (alum and saltpeter), [ShowAdvanceName('tsin_vulcanization_advance')] (rubber) and [ShowAdvanceName('tsin_oil_refining_advance')] (oil).\n\nRubber and oil fields themselves are described in [tsin_oil_prospecting_concept|e]."
 game_concept_tsin_railways_concept: "Railways"
 game_concept_tsin_railways_concept_desc: "Railways are the backbone of the industrial economy. The track is the vanilla $railroad$ [road|e] of the previous age; this age adds railway stations that turn track into [market_access|e], and makes railroads cheaper to lay.\n\n$BULLET$[ShowBuildingTypeName('tsin_railway_station')] ([ShowAdvanceName('tsin_railway_network_advance')]): can be built in the [capital|e] and in any town or city joined to the capital by an unbroken railroad. Each level gives +7.5% local market access; a second level comes with [ShowAdvanceName('tsin_steel_rolling_stock_advance')]. Upkeep is coal, tools and engines; [ShowAdvanceName('tsin_telegraph_telephone_advance')] adds a telegraph method that saves coal and engines for a little electricity. If the link to the capital is cut, the station is removed, but not while you are at war.\n$BULLET$Laying railroads now also needs coal and tools besides lumber, masonry, sand and steel, and their upkeep uses a little coal.\n$BULLET$Cheaper railroads: railway network -10%, steel rolling stock -20% and faster road building, and the [cabinet_action|e] [ShowCabinetActionName('tsin_promote_railway_construction')] -25% cost and -15% road building time. [ShowAdvanceName('tsin_macadam_roads_advance')] makes modern roads 20% cheaper and faster to build.\n\nWhy it matters: market access raises the output of buildings, and above 0.75 it lifts the extra level cap of [tsin_automation_concept|e]. The $mapmode_tsin_industrial_siting_name$ map mode counts stations as a factor.\n\n[ShowDecisionName('tsin_standard_time_decision')]: with 3 railway stations, [ShowAdvanceName('tsin_telegraph_telephone_advance')] and secondary education of 10 or more ([tsin_education_ladder_concept|e]), pay [gold|e] to set one railway time for the whole country. It gives a permanent +2% [production_efficiency|e] and +3% [cabinet_efficiency|e] and an industrial acceleration point ([tsin_time_compression_concept|e]), angers the peasants a little and makes the Factory Clock event possible.\n\nIndustrial canals: with [ShowAdvanceName('tsin_dynamite_advance')] and [ShowAdvanceName('tsin_steam_construction_advance')], [ShowDecisionName('tsin_build_suez_canal_industrial')] and [ShowDecisionName('tsin_build_panama_canal_industrial')] appear beside the vanilla canal [decisions|e]. They need the same land and canal advances but cost 120,000 gold instead of 200,000.\n\nEvents such as Railway Mania and the Gauge War follow the spread of the network."
 game_concept_tsin_infrastructure_concept: "Modern Infrastructure"
 game_concept_tsin_infrastructure_concept_desc: "Modern infrastructure upgrades the public works of towns and cities. These [buildings|e] use coal, tools and engines for upkeep, so they need a working industry behind them.\n\n$BULLET$[ShowBuildingTypeName('tsin_waterworks')] ([ShowAdvanceName('tsin_modern_sewerage_advance')]): refits the [ShowBuildingTypeName('aqueduct_system')] or is built new in any town. Better [disease_resistance|e], +5% [population_capacity|e], more food and [prosperity|e].\n$BULLET$[ShowBuildingTypeName('tsin_steam_port')] ([ShowAdvanceName('tsin_steam_merchant_marine_advance')]): refits the [ShowBuildingTypeName('naval_base')] in a port. Builds up to 14 ships at once, more [sailors|e], faster repair, +5% [market_access|e] and more [migration_attraction|e]. Its upkeep also needs steel.\n$BULLET$[ShowBuildingTypeName('tsin_prefecture')] ([ShowAdvanceName('tsin_professional_bureaucracy_advance')]): refits the [ShowBuildingTypeName('provincial_chancery')] in [core|e] locations of any state, without the government reform the chancery needs. Higher [literacy|e] cap for burghers and nobles, more [control|e], and pops are less ready to join rebels.\n$BULLET$[ShowBuildingTypeName('tsin_electric_lighting')] ([ShowAdvanceName('tsin_gas_lighting_advance')]): one level per town or city. It starts on coal gas; [ShowAdvanceName('tsin_electric_lighting_advance')] lets it run on electricity. Less [unrest|e], higher literacy cap and more migration attraction.\n$BULLET$[ShowBuildingTypeName('tsin_railway_station')]: see [tsin_railways_concept|e].\n\nThe waterworks, steam port and lighting network can only be built by the state, not by [estates|e]. Each of these buildings has its own events, such as the Great Stink or new liner routes.\n\nThe $mapmode_tsin_infrastructure_name$ map mode colours locations by how many of the five they have."
 game_concept_tsin_oil_prospecting_concept: "Oil and Rubber"
 game_concept_tsin_oil_prospecting_concept_desc: "No [location|e] starts with [ShowGoodsName('tsin_rubber')] or [ShowGoodsName('tsin_oil')]; both appear during the age.\n\nOil: [ShowAdvanceName('tsin_machine_tools_advance')] allows oil to be extracted and makes the [decision|e] [ShowDecisionName('tsin_prospect_for_oil')] available if you own a rural location in the [ShowScriptedGeographyName('tsin_potential_oil')]. Like the vanilla coal prospecting it costs [political_influence|e] and turns one of those locations, the one whose current [raw_material|e] is cheapest, into an oil field that starts small. You can take it again for more fields. The oil-bearing lands are the historical fields of the 19th century: Absheron around Baku, the Terek and Kuban, Wallachia, Galicia, Pennsylvania, Kanawha, Sumatra, Burma and Borneo.\n\nRubber: [ShowAdvanceName('tsin_industrial_capitalism_advance')] allows rubber to be gathered. From 1870, a country with that advance that owns rural tropical jungle may get the Rubber Boom event, once:\n$BULLET$Concessions to rubber companies turn up to three locations into rubber and raise rubber output by 25% for a long time, but bring [unrest|e] and falling [control|e] there.\n$BULLET$State plantations turn one location, for [gold|e].\n$BULLET$Or the forests are left alone.\n\nUses: oil lubricates the [ShowBuildingTypeName('tsin_machine_works')] and fuels the oil-fired method of the [ShowBuildingTypeName('tsin_power_station')]; rubber makes drive belts for the [ShowBuildingTypeName('tsin_mechanized_textile_mill')]. [ShowAdvanceName('tsin_oil_refining_advance')] and [ShowAdvanceName('tsin_vulcanization_advance')] raise their output by 20%."
 game_concept_tsin_customs_union_concept: "Customs Union"
 game_concept_tsin_customs_union_concept_desc: "The [ShowInternationalOrganizationType('tsin_customs_union')] is an [international_organization|e] of industrial countries whose members do not charge each other [import_tariffs|e]. Markets cannot be merged, so the union gives every pair of members a [tariff_exemption|e] in both directions.\n\nFounding: in the Age of $age_format_age_7_industrialization$, an independent country with its own [market|e] that has [embraced|e] [ShowInstitutionName('tsin_industrial_capitalism')] can create one. Other countries can join if they are not a [subject|e] or rebels, are not in another customs union, and are not [rivals|e], enemies or treaty-blockers of any member.\n\nFor members:\n$BULLET$Tariff exemptions with every other member.\n$BULLET$-5% maximum tariff and +5% [merchant_power|e]; the leader gets +10% merchant power. The leader is chosen by score every 10 years.\n$BULLET$Members think better of each other ([opinion|e]).\n$BULLET$It costs [diplomatic_capacity|e]: 0.25 for each member.\n\nMembers who go to war with each other are expelled, a member who becomes a subject or a rival of another member leaves, and the union dissolves when fewer than two members remain. Leaving removes all tariff exemptions with the remaining members, including any agreed separately before joining."
 game_concept_tsin_electric_power_concept: "Electric Power"
 game_concept_tsin_electric_power_concept_desc: "$tsin_electricity$ is a [goods|e] like any other: a $tsin_power_station$ makes it, it is sold in the [market|e], and electric [production_methods|e] buy it. Its transport cost is very high, so power is mostly used in the market that makes it.\n\nElectricity needs the [institution|e] [ShowInstitutionName('tsin_electrification')], which under the default game rule cannot appear before 1870. Its [advances|e]:\n$BULLET$[ShowAdvanceName('tsin_dynamo_advance')]: unlocks the coal-fired power station.\n$BULLET$[ShowAdvanceName('tsin_central_power_station_advance')]: hydro and oil-fired methods, +10% electricity output.\n$BULLET$[ShowAdvanceName('tsin_distribution_grid_advance')]: +15% electricity output.\n$BULLET$[ShowAdvanceName('tsin_electric_motor_advance')], [ShowAdvanceName('tsin_electric_lighting_advance')], [ShowAdvanceName('tsin_telegraph_telephone_advance')] and [ShowAdvanceName('tsin_industrial_electrification_advance')]: unlock the electric methods below.\n\nPower station methods: coal (coal, engines, tools), hydro (engines, copper, tools; no fuel but lower output) and oil (oil, engines, tools).\n\nElectricity is used by:\n$BULLET$The electric drive of the [ShowBuildingTypeName('tsin_mechanized_textile_mill')] and of the six automated mills ([tsin_automation_concept|e]).\n$BULLET$The electric saws of the [ShowBuildingTypeName('tsin_steam_sawmill')].\n$BULLET$The electrochemical method of the [ShowBuildingTypeName('tsin_fertilizer_plant')] and both methods of the [ShowBuildingTypeName('tsin_nitrogen_fixation_plant')].\n$BULLET$The electric method of the [ShowBuildingTypeName('tsin_electric_lighting')] and the telegraph method of the [ShowBuildingTypeName('tsin_railway_station')].\n\nWhen a market lacks power, these buildings produce less, so build power stations before switching methods. The $mapmode_tsin_electrification_name$ map mode shows whether supply covers demand in each market, and a hint reminds you once you can build your first power station."
 game_concept_tsin_industrial_investment_concept: "Industrial Investment"
 game_concept_tsin_industrial_investment_concept_desc: "In this age factories are built not only by the state but also by the [estates|e] with their own money. Estates can build every Age VII factory and the railway station; the waterworks, steam port and lighting network are left to the state.\n\nThe [ShowLawName('tsin_industrial_investment_law')], unlocked by [ShowAdvanceName('tsin_industrial_capitalism_advance')], decides who leads:\n$BULLET$[ShowPolicyName('tsin_state_industry_policy')]: the state builds factories 10% more efficiently, but estate construction costs 10% more (25% for expensive buildings). Slowly moves society towards absolutism. Favoured by the crown.\n$BULLET$[ShowPolicyName('tsin_mixed_investment_policy')]: factories are built 5% more efficiently and the burghers may build roads. Favoured by the crown and the burghers.\n$BULLET$[ShowPolicyName('tsin_private_enterprise_policy')]: estate construction costs 15% less, and the burghers may build roads and [rgo|e]. Moves society towards a capital economy. Requires the capitalist [employment_system|e]. Favoured by the burghers.\n\nThe mixed and private policies also raise the number of [tsin_corporations_concept|e] you may hold by one. Once the bill system is active, changing the policy needs a [tsin_bills_concept|e].\n\nOther ways to speed up industry: the [cabinet_action|e] [ShowCabinetActionName('tsin_encourage_industry')] (per [province|e]: factories 25% more efficient to build, higher [production_efficiency|e]), and [ShowAdvanceName('tsin_stock_exchange_advance')] and [ShowAdvanceName('tsin_limited_liability_advance')] (factories built more efficiently everywhere). [ShowAdvanceName('tsin_commercial_banking_advance')] lowers inflation and, like the stock exchange, lets you issue more bonds.\n\nThe $mapmode_tsin_industrial_investment_name$ map mode shows foreign-owned buildings and each country's investment policy."
 game_concept_tsin_agricultural_revolution_concept: "Agricultural Revolution"
 game_concept_tsin_agricultural_revolution_concept_desc: "The agricultural revolution turns food surplus into population growth. It is a branch of eight [advances|e] that starts from [ShowAdvanceName('tsin_steam_age_advance')]:\n$BULLET$[ShowAdvanceName('tsin_agricultural_chemistry_advance')]: more [monthly_food|e].\n$BULLET$[ShowAdvanceName('tsin_mechanical_reaper_advance')]: unlocks the [ShowBuildingTypeName('tsin_farm_machinery_works')].\n$BULLET$[ShowAdvanceName('tsin_canning_advance')]: less [food_decay|e].\n$BULLET$[ShowAdvanceName('tsin_steam_threshing_advance')]: unlocks the [ShowBuildingTypeName('tsin_mechanized_farm')] and steel farm machinery.\n$BULLET$[ShowAdvanceName('tsin_refrigerated_transport_advance')]: +15% [food_capacity|e] and less food decay.\n$BULLET$[ShowAdvanceName('tsin_intensive_farming_advance')]: mechanized farms to level 2, steam traction machinery, more food.\n$BULLET$[ShowAdvanceName('tsin_nitrogen_fixation_advance')]: unlocks the [ShowBuildingTypeName('tsin_nitrogen_fixation_plant')] and mechanized farms to level 3.\n$BULLET$[ShowAdvanceName('tsin_ammonia_synthesis_advance')]: the ammonia synthesis method and +10% fertilizer output.\n\nThe mechanized farm is refitted from [ShowBuildingTypeName('tsin_fertilized_fields')] on wheat, maize, rice, millet, legume and potato land. Each level adds +20% raw good [output|e] and more food, and needs fertilizer, farm machinery and a little tools as [building_maintenance|e]. Three levels give about four times the bonus of fertilized fields, so a farming country needs fertilizer plants and farm machinery works to match.\n\nSurplus food raises [population_growth|e] by the vanilla rules, and the [tsin_population_governor_concept|e] keeps the boom in check. From 1873, cheap overseas grain can start [ShowSituationName('tsin_grain_invasion')] in countries with railways but few factory workers ([tsin_industrial_age_situations|e]). Events such as the Guano Boom, the Rural Exodus and Bread from the Air accompany the stages.\n\nThe $mapmode_tsin_agriculture_name$ map mode shows each owner's stage and the market's food surplus."
 game_concept_tsin_automation_concept: "Automation"
 game_concept_tsin_automation_concept_desc: "Automation refits six vanilla mills into automated works. Each makes the same single good as before with fewer workers and less raw material per unit, but also needs engines or electricity.\n\n$BULLET$[ShowBuildingTypeName('tsin_automated_iron_mill')] (tools) and [ShowBuildingTypeName('tsin_automated_furniture_mill')] (furniture): [ShowAdvanceName('tsin_interchangeable_parts_advance')].\n$BULLET$[ShowBuildingTypeName('tsin_automated_paper_mill')] (paper) and [ShowBuildingTypeName('tsin_automated_glass_mill')] (glass): [ShowAdvanceName('tsin_continuous_process_advance')].\n$BULLET$[ShowBuildingTypeName('tsin_automated_printing_mill')] (books): [ShowAdvanceName('tsin_rotary_press_advance')].\n$BULLET$[ShowBuildingTypeName('tsin_automated_fine_cloth_mill')] (fine cloth): [ShowAdvanceName('tsin_power_jacquard_advance')].\n\nEvery automated mill has two [production_methods|e]: Steam Power (engines and coal) and, after [ShowAdvanceName('tsin_electric_motor_advance')], Electric Drive (electricity and a few engines), which produces about a sixth more.\n\nAutomated works need a large market. Like vanilla factories, their maximum level shrinks below 0.75 [market_access|e], and for automated works the cut is applied a second time: at 0.5 market access a vanilla factory keeps 75% of its level cap, an automated one only about 56%. Railway stations ([tsin_railways_concept|e]) are the usual way to lift market access above 0.75.\n\nThe $mapmode_tsin_automation_name$ map mode shows the automated share of factory levels; it also counts the [ShowBuildingTypeName('tsin_mechanized_textile_mill')] and the [ShowBuildingTypeName('tsin_nitrogen_fixation_plant')]."
