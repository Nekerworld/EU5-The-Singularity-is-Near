 tsin_nations.1.desc: "The historical progression rules offer a delayed formation. Protected human realms, peace, capitals and the continued existence of transferring owners are rechecked before changing any core city. This grants core cities only, never the full historical empire."
 tsin_nations.1.a: "A new political settlement."
