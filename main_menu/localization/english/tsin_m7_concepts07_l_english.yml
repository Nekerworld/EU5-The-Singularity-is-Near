l_english:

 # 0.7 encyclopedia concepts and hints
 game_concept_tsin_time_compression_concept: "Time Compression"
 game_concept_tsin_time_compression_concept_desc: "Days are no longer than before, but far more happens in a year of the industrial age. In the [ShowAgeName('age_7_industrialization')], research, construction, promotion, migration and institution spread all speed up.\n\nIndustrializing countries gain industrial acceleration tiers. Points come from each embraced institution of the age, factory job shares above 8% and 20%, and adopting standard time; 2, 3 and 5 points give tiers 1 to 3. Each tier speeds research, construction and promotion further.\n\nThe [tsin_population_governor_concept|e] holds population back in proportion."
 game_concept_tsin_population_governor_concept: "Population Governor"
 game_concept_tsin_population_governor_concept_desc: "To keep fast growth from bursting the world, world population is compared once a year with the first year of the age. The target multiplier is ×1.6 in 1900, ×2.4 in 1950 and ×5.5 in 2000.\n\nWhen the world exceeds the target, every country gets a brake of tier 1 to 3: slower growth and higher food consumption. A country that grows by more than 3% in a year is braked on its own. Literate, urban countries have fewer births (the demographic transition).\n\nThe cholera pandemic and the great migration are outlets for population pressure."
 game_concept_tsin_agricultural_revolution_concept: "Agricultural Revolution"
 game_concept_tsin_agricultural_revolution_concept_desc: "Seven advances form the agricultural stage: agricultural chemistry, the mechanical reaper, canning, steam threshing, refrigerated transport, intensive farming and nitrogen fixation. Each brings more food and less spoilage.\n\nFertilized fields can be rebuilt as $tsin_mechanized_farm$. Mechanized farms consume fertilizer and farm machinery but greatly raise raw material and food output.\n\nSurplus food turns into population growth by the vanilla rules. In the 1870s, cheap grain from the new world may set off the grain invasion."
 game_concept_tsin_automation_concept: "Automation"
 game_concept_tsin_automation_concept_desc: "Factories can be rebuilt as automated upgrades. Automated works produce more with fewer workers, but consume engines and tools and need a large market.\n\nBelow 0.75 [market_access|e], the maximum level of automated works is cut a second time. Raising market access with railway stations is the precondition of automation.\n\nThe automation map mode shows the automated share of factory levels."
 game_concept_tsin_labor_conditions_concept: "Labor Conditions"
 game_concept_tsin_labor_conditions_concept_desc: "Every factory [location|e] has labor conditions from 0 to 1, set by labor law, social insurance, crowding, model dwellings, recent accidents and broken strikes, skills (secondary education) and the satisfaction of the common folk.\n\nThe country's labor grievance (0 to 100) follows the factory worker share and poor conditions each year. High grievance brings strikes, May Day marches and socialist cells, and makes labor bills easier to pass."
 game_concept_tsin_bills_concept: "Bills"
 game_concept_tsin_bills_concept_desc: "Countries that embrace $tsin_mass_society$ and have a parliament change law policies only through bills. A proposed bill is read every three months; three successful readings pass it, three stalled readings kill it.\n\nThe chance of success depends on estate power and preferences, related political movements, the type of parliament and the outcome of debates. Debate events offer concessions, forcing the bill, press campaigns or withdrawal.\n\nWith the game rule off, policies change at once."
 game_concept_tsin_corporations_concept: "Corporations"
 game_concept_tsin_corporations_concept_desc: "With the right advances and works, decisions found companies: steel, machinery, textiles, chemicals, railways and farm machinery. Each has a headquarters [location|e], a share price and a chairman.\n\nCharters (monopoly, investment, expansion, colonial company) grant privileges. Chairmen bring loans, endowments, scandals and political ambitions.\n\nThe corporations map mode shows headquarters and company works."
 game_concept_tsin_stock_index_concept: "Stock Index"
 game_concept_tsin_stock_index_concept_desc: "Share prices move randomly every quarter. Panics, depressions and labor grievance drag them down; higher education, booms, investment charters and able chairmen lift them. The gold standard of $tsin_monetary_standard_law$ narrows the swings.\n\nThe index is the mean of share prices weighted by company building levels. An index above 1.5 times its recent mean brings a speculative boom; the end of a boom, or a fall below 60% of the mean, brings a crash. A crash can bring on the Long Depression early.\n\nThe \"Stock Report\" decision shows the index."
 game_concept_tsin_estimated_gdp_concept: "Estimated GDP"
 game_concept_tsin_estimated_gdp_concept_desc: "The game has no GDP, so it is estimated each year: urban tax base, trade and tax income and the subsistence output of the population, multiplied by productivity from secondary and higher education.\n\nPer-capita GDP and growth are recorded with it. The GDP per capita map mode compares each country with last year's highest. With the game rule on, economic statistics go to the game log every year for charting with an external tool."
 hint_tsin_labor_grievance: "[tsin_labor_conditions_concept|e]"
 hint_tsin_labor_grievance_hint_text: "Labor grievance is above 50. Labor law, social insurance and model dwellings improve factory conditions."
 hint_tsin_labor_grievance_diplomatic: "\"A hungry worker knows no frontier.\""
 hint_tsin_labor_grievance_administrative: "\"One factory inspector costs less than ten policemen.\""
 hint_tsin_labor_grievance_military: "\"Break a strike with rifles and the next one comes with barricades.\""
 hint_tsin_first_bill: "[tsin_bills_concept|e]"
 hint_tsin_first_bill_hint_text: "Law policies now change only through bills in parliament. Propose a bill by decision and gather the support of estates and movements."
 hint_tsin_first_bill_diplomatic: "\"A law is the outcome of a negotiation.\""
 hint_tsin_first_bill_administrative: "\"Three readings make a law.\""
 hint_tsin_first_bill_military: "\"Parliament, like a siege, is lost by haste.\""
 hint_tsin_stock_crash: "[tsin_stock_index_concept|e]"
 hint_tsin_stock_crash_hint_text: "The stock market has crashed. Prices will recover, but for some years after a crash the Long Depression starts more easily."
 hint_tsin_stock_crash_diplomatic: "\"When London sneezes, the world catches cold.\""
 hint_tsin_stock_crash_administrative: "\"Saving the bankers is not the same as saving the banks.\""
 hint_tsin_stock_crash_military: "\"War bonds do not sell in a falling market.\""
