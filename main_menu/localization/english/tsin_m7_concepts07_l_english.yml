l_english:

 # 0.7 encyclopedia concepts and hints
 hint_tsin_labor_grievance: "[tsin_labor_grievance_concept|e]"
 hint_tsin_labor_grievance_hint_text: "Labor grievance is above 50. Labor law, social insurance and model dwellings improve factory conditions."
 hint_tsin_labor_grievance_diplomatic: "\"A hungry worker knows no frontier.\""
 hint_tsin_labor_grievance_administrative: "\"One factory inspector costs less than ten policemen.\""
 hint_tsin_labor_grievance_military: "\"Break a strike with rifles and the next one comes with barricades.\""
 hint_tsin_first_bill: "[tsin_bills_concept|e]"
 hint_tsin_first_bill_hint_text: "Law policies now change only through bills in parliament. Propose a bill by decision and gather the support of estates and movements."
 hint_tsin_first_bill_diplomatic: "\"A law is the outcome of a negotiation.\""
 hint_tsin_first_bill_administrative: "\"Three readings make a law.\""
 hint_tsin_first_bill_military: "\"Parliament, like a siege, is lost by haste.\""
 hint_tsin_stock_crash: "[tsin_stock_index_concept|e]"
 hint_tsin_stock_crash_hint_text: "The stock market has crashed. Prices will recover, but for some years after a crash the Long Depression starts more easily."
 hint_tsin_stock_crash_diplomatic: "\"When London sneezes, the world catches cold.\""
 hint_tsin_stock_crash_administrative: "\"Saving the bankers is not the same as saving the banks.\""
 hint_tsin_stock_crash_military: "\"War bonds do not sell in a falling market.\""
