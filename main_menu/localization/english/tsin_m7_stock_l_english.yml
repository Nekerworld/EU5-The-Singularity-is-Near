l_english:

 # Stock market, charters, chairman (docs/corporations.md)
 tsin_found_farm_machinery_company_decision.title: "Found a Farm Machinery Company"
 tsin_found_farm_machinery_company_decision.desc: "Found a company that mass-produces reapers and threshers. Farm machinery output rises and wheat harvests a little, but [buildings|e] upkeep rises slightly. Limit: [ROOT.ScriptValue('tsin_company_limit')|0], held: [ROOT.ScriptValue('tsin_company_count')|0]."
 tsin_found_farm_machinery_company_decision.a: "Found the company."
 STATIC_MODIFIER_NAME_tsin_company_farm_machinery: "Farm Machinery Company"
 tsin_charter_monopoly_decision.title: "Monopoly Charter"
 tsin_charter_monopoly_decision.desc: "Grant our companies a monopoly of the home market. [production_efficiency|e] and burgher power rise and stocks ([tsin_stock_index_concept|e]) jump 10%, but the peasants resent the high prices. Not available under the Antitrust Act. Charter limit ([tsin_company_charters_concept|e]): [ROOT.ScriptValue('tsin_charter_limit')|0], held: [ROOT.ScriptValue('tsin_charter_count')|0]."
 tsin_charter_monopoly_decision.a: "Grant the monopoly."
 tsin_charter_investment_decision.title: "Investment Charter"
 tsin_charter_investment_decision.desc: "Allow our companies to issue bonds with a state guarantee. Factories are built faster, [interest|e] falls, and stocks ([tsin_stock_index_concept|e]) are more likely to rise. Charter limit ([tsin_company_charters_concept|e]): [ROOT.ScriptValue('tsin_charter_limit')|0], held: [ROOT.ScriptValue('tsin_charter_count')|0]."
 tsin_charter_investment_decision.a: "Allow the bonds."
 tsin_charter_expansion_decision.title: "Industrial Expansion Charter"
 tsin_charter_expansion_decision.desc: "Allow our companies to branch into new trades. One more company ([tsin_corporations_concept|e]) is allowed and burgher power rises, but [buildings|e] upkeep rises slightly. Needs the stock exchange. Charter limit ([tsin_company_charters_concept|e]): [ROOT.ScriptValue('tsin_charter_limit')|0], held: [ROOT.ScriptValue('tsin_charter_count')|0]."
 tsin_charter_expansion_decision.a: "Allow the expansion."
 tsin_revoke_charters_decision.title: "Revoke Company Charters"
 tsin_revoke_charters_decision.desc: "Revoke the monopoly, investment and expansion charters ([tsin_company_charters_concept|e]). Stocks ([tsin_stock_index_concept|e]) fall 5%. Dissolving the companies also revokes the charters."
 tsin_revoke_charters_decision.a: "Revoke them."
 tsin_stock_report_decision.title: "Stock Report"
 tsin_stock_report_decision.desc: "Receive a report on our companies' stocks and the national index ([tsin_stock_index_concept|e]) from the stock exchange."
 tsin_stock_report_decision.a: "Open the report."
 STATIC_MODIFIER_NAME_tsin_charter_monopoly: "Monopoly Charter"
 STATIC_MODIFIER_NAME_tsin_charter_investment: "Investment Charter"
 STATIC_MODIFIER_NAME_tsin_charter_expansion: "Industrial Expansion Charter"
 STATIC_MODIFIER_NAME_tsin_speculative_boom: "Speculative Boom"
 STATIC_MODIFIER_NAME_tsin_stock_crash: "Stock Market Crash"
 STATIC_MODIFIER_NAME_tsin_corporate_loan: "Corporate Loan"
 STATIC_MODIFIER_NAME_tsin_corporate_endowment: "Corporate Endowment"
 STATIC_MODIFIER_NAME_tsin_corporate_cover_up: "Corporate Cover-up"
 STATIC_MODIFIER_NAME_tsin_corporate_lobby: "Corporate Lobby"
 tsin_economy.140.title: "Speculative Fever"
 tsin_economy.140.desc: "The stock exchange is in a fever. The national index stands more than 50% above its two-year average, and maids and coachmen queue to buy shares. Cool-headed bankers whisper about when the bubble will burst."
 tsin_economy.140.a: "Let the market run."
 tsin_economy.140.b: "Raise the discount rate."
 tsin_economy.150.title: "The Market Crashes"
 tsin_economy.150.desc: "Overnight, the stock market has collapsed. Panicked investors crowd the exchange and the banks, no longer trusting one another, call in their loans. If the panic spreads abroad, a long depression may come early."
 tsin_economy.150.a: "Rescue the banks."
 tsin_economy.150.b: "Let the weak houses fail."
 tsin_economy.150.c: "Close the exchange for a year."
 tsin_corporate.10.title: "A New Chairman"
 tsin_corporate.10.desc: "The boards of our companies have chosen [tsin_chairman.GetName] as their new chairman. His decisions over factories, railways and banks will now move both the stock price and the nation's fortunes."
 tsin_corporate.10.a: "Confirm the board's choice."
 tsin_corporate.10.b: "Seat a state commissioner on the board."
 tsin_corporate.20.title: "The Chairman Wants a Title"
 tsin_corporate.20.desc: "[tsin_chairman.GetName] has everything money can buy. Now he wants a noble title. The old families sneer at a tradesman joining their ranks."
 tsin_corporate.20.a: "Ennoble him."
 tsin_corporate.20.b: "Titles are not for sale."
 tsin_corporate.30.title: "A Loan from the Company"
 tsin_corporate.30.desc: "[tsin_chairman.GetName] offers the treasury a large loan. The interest is not small, and everyone knows the government will owe the company."
 tsin_corporate.30.a: "Accept the loan."
 tsin_corporate.30.b: "The treasury needs no favors."
 tsin_corporate.40.title: "An Endowed Chair"
 tsin_corporate.40.desc: "[tsin_chairman.GetName] has offered to fund chairs of engineering and chemistry at the university, provided they bear his name."
 tsin_corporate.40.a: "Name the chairs after him."
 tsin_corporate.40.b: "Tax the fortune instead."
 tsin_corporate.50.title: "A Bribery Scandal"
 tsin_corporate.50.desc: "The newspapers reveal that [tsin_chairman.GetName] bribed officials for railway routes and government contracts. Stocks have fallen 10%, and deputies demand an inquiry."
 tsin_corporate.50.a: "Prosecute him. The board must choose a new chairman."
 tsin_corporate.50.b: "Hush it up."
 tsin_corporate.60.title: "The Chairman Runs for Parliament"
 tsin_corporate.60.desc: "[tsin_chairman.GetName] is standing for parliament. With his money the seat is all but won, and the voice of business will grow in the chamber."
 tsin_corporate.60.a: "Welcome business into politics."
 tsin_corporate.60.b: "Keep the boardroom out of the chamber."
 tsin_corporate.100.title: "Stock Report"
 tsin_corporate.100.desc: "The stock exchange has filed its quarterly report.\n\n$BULLET$Steel company: [ROOT.ScriptValue('tsin_stock_price_steel')|0]\n$BULLET$Machinery company: [ROOT.ScriptValue('tsin_stock_price_machinery')|0]\n$BULLET$Textile company: [ROOT.ScriptValue('tsin_stock_price_textile')|0]\n$BULLET$Chemical company: [ROOT.ScriptValue('tsin_stock_price_chemical')|0]\n$BULLET$Railway company: [ROOT.ScriptValue('tsin_stock_price_railway')|0]\n$BULLET$Farm machinery company: [ROOT.ScriptValue('tsin_stock_price_farm_machinery')|0]\n\nNational index: [ROOT.ScriptValue('tsin_stock_index_report')|0] (two-year mean [ROOT.ScriptValue('tsin_stock_index_history_mean')|0])\nWorld index: [ROOT.ScriptValue('tsin_world_stock_index_report')|0]\nTotal company value: [ROOT.ScriptValue('tsin_company_total_value')|0]\n\nStocks start at 100 and move every quarter. 0 means the company does not exist. When the market price of a company's goods rises, its stock is more likely to rise."
 tsin_corporate.100.a: "Noted."
