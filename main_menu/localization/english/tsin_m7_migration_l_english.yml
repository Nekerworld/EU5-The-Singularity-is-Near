l_english:

 # The Great Migration (in_game/common/situations/tsin_great_migration.txt)
 tsin_great_migration: "The Great Migration"
 tsin_great_migration_desc: "Fleeing crowded cities, hungry villages, epidemics and the grain crisis, millions cross the ocean by steamship. The countries that send them ease their population pressure; the countries of the Americas and Oceania gain new hands."
 tsin_great_migration_closes: "The Gates Close"
 tsin_great_migration_ebbs: "The Tide Ebbs"
 tsin_great_migration_sender_tt: "Emigrants are leaving this [country|e] for overseas."
 tsin_great_migration_receiver_tt: "Immigrants are arriving in this [country|e]."
 hint_tsin_great_migration: "[GetSituationByKey('tsin_great_migration').GetNameWithNoTooltip]"
 hint_tsin_great_migration_hint_text: "During [GetSituationByKey('tsin_great_migration').GetName] the sending and receiving countries are decided once a year.\n\n#T Senders:#! independent countries with 3 or more crowded cities or towns, or suffering the Great Hunger, cholera or the grain crisis.\n#T Receivers:#! countries whose capital is in the Americas or Oceania and that are not senders.\n\n#T Recommended actions:#!\n@arrow_bonus_tier_3! Waterworks and housing ease crowding and stop the exodus.\n@arrow_bonus_tier_2! Receivers can open the door and grow quickly."
 hint_tsin_great_migration_diplomatic: "\"Homesickness is the disease of the old country; opportunity is the cure of the new.\""
 hint_tsin_great_migration_administrative: "\"The money the leavers send home feeds those who stay.\""
 hint_tsin_great_migration_military: "\"Every emigrant ship carries tomorrow's soldiers.\""
 STATIC_MODIFIER_NAME_tsin_emigration_wave: "Emigration Wave"
 STATIC_MODIFIER_NAME_tsin_immigrant_nation: "Nation of Immigrants"
 STATIC_MODIFIER_NAME_tsin_emigrant_remittances: "Emigrant Remittances"
 STATIC_MODIFIER_NAME_tsin_emigration_restricted: "Emigration Restricted"
 STATIC_MODIFIER_NAME_tsin_open_door: "Open Door"
 STATIC_MODIFIER_NAME_tsin_nativist_laws: "Nativist Laws"
 tsin_migration.1.title: "The Emigrant Ships"
 tsin_migration.1.desc: "In every port, families with their bundles queue for steamship tickets. The villages are emptying, but many wait for the money that will come back from across the sea."
 tsin_migration.1.a: "Let them go, and wait for the money."
 tsin_migration.1.b: "Our people are needed here."
 tsin_migration.2.title: "The Huddled Masses"
 tsin_migration.2.desc: "With every ship, people speaking strange tongues come ashore. Factories and farms welcome the hands, but native workers fear for their wages."
 tsin_migration.2.a: "Open the door."
 tsin_migration.2.b: "Natives first."
