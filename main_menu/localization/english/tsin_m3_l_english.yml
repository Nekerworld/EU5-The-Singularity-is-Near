l_english:
 tsin_industrial_investment_law: "Industrial Investment"
 tsin_industrial_investment_law_desc: "This determines who builds and funds new factories and railways."
 tsin_industrial_investment_law_CATEGORY: "SOCIOECONOMIC_LAW_CATEGORY"
 tsin_state_industry_policy: "State-Led Industrialization"
 tsin_state_industry_policy_desc: "The state founds factories itself and allocates capital. Government projects go faster, but buildings raised by the estates cost more."
 tsin_mixed_investment_policy: "Mixed Investment"
 tsin_mixed_investment_policy_desc: "The state and private capital invest in industry together. Burghers may also build roads."
 tsin_private_enterprise_policy: "Private Enterprise"
 tsin_private_enterprise_policy_desc: "Industrial investment is left to private capital. Estate construction costs less, and burghers may build roads and raw material buildings. Requires the capitalist [employment_system|e]."

 tsin_encourage_industry: "Encourage Industry"
 tsin_encourage_industry_desc: "Grants factory building subsidies and tax relief in the selected [province|e]. Factories are built faster and [production_efficiency|e] rises."
 tsin_encourage_industry_action: "Encourage Industry in [SCOPE.sProvince('target').GetNameWithNoTooltip]"
 tsin_encourage_industry_select_province: "Select the [province|e] in which to encourage industry:"
 tsin_encourage_industry_active: "Encouraging Industry in [SCOPE.sProvince('target').GetNameWithHighlightOnly]"
 tsin_encourage_industry_no_provinces: "$no_valid_provinces$"
 tsin_promote_railway_construction: "Promote Railway Construction"
 tsin_promote_railway_construction_desc: "The cabinet grants railway companies rights of way and subsidies, speeding up railway and road construction."
 tsin_promote_railway_construction_action: "Promote Railway Construction"
 tsin_promote_railway_construction_active: "Promoting Railway Construction"

 STATIC_MODIFIER_NAME_tsin_company_steel: "Steel Company"
 STATIC_MODIFIER_NAME_tsin_company_machinery: "Machinery Company"
 STATIC_MODIFIER_NAME_tsin_company_textile: "Textile Company"
 STATIC_MODIFIER_NAME_tsin_company_chemical: "Chemical Company"
 STATIC_MODIFIER_NAME_tsin_company_railway: "Railway Company"
 tsin_found_steel_company_decision.title: "Found a Steel Company"
 tsin_found_steel_company_decision.desc: "Found a great steel company joining steelworks and mines. Steel and iron output rise, but running the company raises [buildings|e] upkeep. We may hold [ROOT.ScriptValue('tsin_company_limit')|0] companies and currently hold [ROOT.ScriptValue('tsin_company_count')|0]."
 tsin_found_steel_company_decision.a: "Found the company."
 tsin_found_machinery_company_decision.title: "Found a Machinery Company"
 tsin_found_machinery_company_decision.desc: "Found a company specialising in engines and tools. [buildings|e] upkeep rises slightly. Limit: [ROOT.ScriptValue('tsin_company_limit')|0], held: [ROOT.ScriptValue('tsin_company_count')|0]."
 tsin_found_machinery_company_decision.a: "Found the company."
 tsin_found_textile_company_decision.title: "Found a Textile Company"
 tsin_found_textile_company_decision.desc: "Found a textile company owning many mills. [buildings|e] upkeep rises slightly. Limit: [ROOT.ScriptValue('tsin_company_limit')|0], held: [ROOT.ScriptValue('tsin_company_count')|0]."
 tsin_found_textile_company_decision.a: "Found the company."
 tsin_found_chemical_company_decision.title: "Found a Chemical Company"
 tsin_found_chemical_company_decision.desc: "Found a company making fertilizer and explosives. [buildings|e] upkeep rises slightly. Limit: [ROOT.ScriptValue('tsin_company_limit')|0], held: [ROOT.ScriptValue('tsin_company_count')|0]."
 tsin_found_chemical_company_decision.a: "Found the company."
 tsin_found_railway_company_decision.title: "Found a Railway Company"
 tsin_found_railway_company_decision.desc: "Found a company that builds and runs railways. [buildings|e] upkeep rises slightly. Limit: [ROOT.ScriptValue('tsin_company_limit')|0], held: [ROOT.ScriptValue('tsin_company_count')|0]."
 tsin_found_railway_company_decision.a: "Found the company."
 tsin_dissolve_companies_decision.title: "Dissolve Industrial Companies"
 tsin_dissolve_companies_decision.desc: "Dissolve all our industrial companies. Their output bonuses and upkeep disappear together."
 tsin_dissolve_companies_decision.a: "Dissolve them all."

 pa_tsin_repeal_corn_laws: "Repeal the Corn Laws"
 pa_tsin_repeal_corn_laws_simple: "Repeal the Corn Laws"
 pa_tsin_repeal_corn_laws_desc: "Abolish the grain duties to cheapen bread and ease the wage burden of factory workers. The landowners will resist."
 pa_tsin_protect_grain: "Grain Tariff Protection"
 pa_tsin_protect_grain_simple: "Protect Domestic Grain"
 pa_tsin_protect_grain_desc: "Levy duties on cheap foreign grain to shield domestic landowners and farming. Bread in the towns becomes dearer."
 STATIC_MODIFIER_NAME_tsin_corn_laws_protection: "Grain Tariff Protection"
 STATIC_MODIFIER_NAME_tsin_corn_laws_repealed: "Corn Laws Repealed"
 STATIC_MODIFIER_NAME_tsin_bread_riots: "Bread Riots"
 STATIC_MODIFIER_NAME_tsin_landowner_compensation: "Landowner Compensation"

 tsin_corn_laws.1.title: "The Free Trade League"
 tsin_corn_laws.1.desc: "Mill owners and merchants have banded together to demand the end of the grain duties. Touring speakers and cheap pamphlets cry for 'cheap bread', while the landowners warn that it will ruin the countryside."
 tsin_corn_laws.1.a: "Back the league."
 tsin_corn_laws.1.b: "Ban the meetings."
 tsin_corn_laws.1.c: "Let the debate run its course."
 tsin_corn_laws.2.title: "The Grain Duties Fall"
 tsin_corn_laws.2.desc: "Parliament has abolished the grain duties. Foreign grain floods into the ports and bread grows cheaper, but landowners who lived off their estates are furious."
 tsin_corn_laws.2.a: "Compensate the landowners."
 tsin_corn_laws.2.b: "The market will decide."
 tsin_corn_laws.3.title: "Bread Riots"
 tsin_corn_laws.3.desc: "With a poor harvest on top of the grain duties, the price of bread has soared, and hungry crowds are storming bakeries and granaries."
 tsin_corn_laws.3.a: "Buy grain abroad."
 tsin_corn_laws.3.b: "Restore order."
 tsin_corn_laws.3.c: "Suspend the grain duties."
