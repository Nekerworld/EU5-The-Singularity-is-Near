l_english:
 tsin_industrial_investment_law: "Industrial Investment"
 tsin_industrial_investment_law_desc: "This determines who builds and funds new factories and railways."
 tsin_industrial_investment_law_CATEGORY: "SOCIOECONOMIC_LAW_CATEGORY"
 tsin_state_industry_policy: "State-Led Industrialization"
 tsin_state_industry_policy_desc: "The state founds factories itself and allocates capital. Government projects go faster, but buildings raised by the estates cost more."
 tsin_mixed_investment_policy: "Mixed Investment"
 tsin_mixed_investment_policy_desc: "The state and private capital invest in industry together. Burghers may also build roads."
 tsin_private_enterprise_policy: "Private Enterprise"
 tsin_private_enterprise_policy_desc: "Industrial investment is left to private capital. Estate construction costs less, and burghers may build roads and raw material buildings. Requires the capitalist [employment_system|e]."

 tsin_encourage_industry: "Encourage Industry"
 tsin_encourage_industry_desc: "Grants factory building subsidies and tax relief in the selected [province|e]. Factories are built faster and [production_efficiency|e] rises."
 tsin_encourage_industry_action: "Encourage Industry in [SCOPE.sProvince('target').GetNameWithNoTooltip]"
 tsin_encourage_industry_select_province: "Select the [province|e] in which to encourage industry:"
 tsin_encourage_industry_active: "Encouraging Industry in [SCOPE.sProvince('target').GetNameWithHighlightOnly]"
 tsin_encourage_industry_no_provinces: "$no_valid_provinces$"
 tsin_promote_railway_construction: "Promote Railway Construction"
 tsin_promote_railway_construction_desc: "The cabinet grants railway companies rights of way and subsidies, speeding up railway and road construction."
 tsin_promote_railway_construction_action: "Promote Railway Construction"
 tsin_promote_railway_construction_active: "Promoting Railway Construction"

 STATIC_MODIFIER_NAME_tsin_company_steel: "Steel Company"
 STATIC_MODIFIER_NAME_tsin_company_machinery: "Machinery Company"
 STATIC_MODIFIER_NAME_tsin_company_textile: "Textile Company"
 STATIC_MODIFIER_NAME_tsin_company_chemical: "Chemical Company"
 STATIC_MODIFIER_NAME_tsin_company_railway: "Railway Company"
 tsin_found_steel_company_decision.title: "Found a Steel Company"
 tsin_found_steel_company_decision.desc: "Found a great steel company joining steelworks and mines. Steel and iron output rise, but running the company raises [buildings|e] upkeep. We may hold [ROOT.ScriptValue('tsin_company_limit')|0] companies and currently hold [ROOT.ScriptValue('tsin_company_count')|0]."
 tsin_found_steel_company_decision.a: "Found the company."
 tsin_found_machinery_company_decision.title: "Found a Machinery Company"
 tsin_found_machinery_company_decision.desc: "Found a company specialising in engines and tools. [buildings|e] upkeep rises slightly. Limit: [ROOT.ScriptValue('tsin_company_limit')|0], held: [ROOT.ScriptValue('tsin_company_count')|0]."
 tsin_found_machinery_company_decision.a: "Found the company."
 tsin_found_textile_company_decision.title: "Found a Textile Company"
 tsin_found_textile_company_decision.desc: "Found a textile company owning many mills. [buildings|e] upkeep rises slightly. Limit: [ROOT.ScriptValue('tsin_company_limit')|0], held: [ROOT.ScriptValue('tsin_company_count')|0]."
 tsin_found_textile_company_decision.a: "Found the company."
 tsin_found_chemical_company_decision.title: "Found a Chemical Company"
 tsin_found_chemical_company_decision.desc: "Found a company making fertilizer and explosives. [buildings|e] upkeep rises slightly. Limit: [ROOT.ScriptValue('tsin_company_limit')|0], held: [ROOT.ScriptValue('tsin_company_count')|0]."
 tsin_found_chemical_company_decision.a: "Found the company."
 tsin_found_railway_company_decision.title: "Found a Railway Company"
 tsin_found_railway_company_decision.desc: "Found a company that builds and runs railways. [buildings|e] upkeep rises slightly. Limit: [ROOT.ScriptValue('tsin_company_limit')|0], held: [ROOT.ScriptValue('tsin_company_count')|0]."
 tsin_found_railway_company_decision.a: "Found the company."
 tsin_dissolve_companies_decision.title: "Dissolve Industrial Companies"
 tsin_dissolve_companies_decision.desc: "Dissolve all our industrial companies. Their output bonuses and upkeep disappear together."
 tsin_dissolve_companies_decision.a: "Dissolve them all."

 pa_tsin_repeal_corn_laws: "Repeal the Corn Laws"
 pa_tsin_repeal_corn_laws_simple: "Repeal the Corn Laws"
 pa_tsin_repeal_corn_laws_desc: "Abolish the grain duties to cheapen bread and ease the wage burden of factory workers. The landowners will resist."
 pa_tsin_protect_grain: "Grain Tariff Protection"
 pa_tsin_protect_grain_simple: "Protect Domestic Grain"
 pa_tsin_protect_grain_desc: "Levy duties on cheap foreign grain to shield domestic landowners and farming. Bread in the towns becomes dearer."
 STATIC_MODIFIER_NAME_tsin_corn_laws_protection: "Grain Tariff Protection"
 STATIC_MODIFIER_NAME_tsin_corn_laws_repealed: "Corn Laws Repealed"
 STATIC_MODIFIER_NAME_tsin_bread_riots: "Bread Riots"
 STATIC_MODIFIER_NAME_tsin_landowner_compensation: "Landowner Compensation"

 tsin_corn_laws.1.title: "The Free Trade League"
 tsin_corn_laws.1.desc: "Mill owners and merchants have banded together to demand the end of the grain duties. Touring speakers and cheap pamphlets cry for 'cheap bread', while the landowners warn that it will ruin the countryside."
 tsin_corn_laws.1.a: "Back the league."
 tsin_corn_laws.1.b: "Ban the meetings."
 tsin_corn_laws.1.c: "Let the debate run its course."
 tsin_corn_laws.2.title: "The Grain Duties Fall"
 tsin_corn_laws.2.desc: "Parliament has abolished the grain duties. Foreign grain floods into the ports and bread grows cheaper, but landowners who lived off their estates are furious."
 tsin_corn_laws.2.a: "Compensate the landowners."
 tsin_corn_laws.2.b: "The market will decide."
 tsin_corn_laws.3.title: "Bread Riots"
 tsin_corn_laws.3.desc: "With a poor harvest on top of the grain duties, the price of bread has soared, and hungry crowds are storming bakeries and granaries."
 tsin_corn_laws.3.a: "Buy grain abroad."
 tsin_corn_laws.3.b: "Restore order."
 tsin_corn_laws.3.c: "Suspend the grain duties."

 tsin_industrialization: "Towards an Industrial Nation"
 tsin_industrialization_DESCRIPTION: "To keep pace in the age of steam and steel, our rural economy must become one of factories and railways."
 tsin_industrialization_CRITERIA_DESCRIPTION: "We have become an industrial nation of factories, cities and railways."
 tsin_industrialization_BUTTON_TOOLTIP: "From farm to factory, from village to city. The railway will bind it all together."
 tsin_industrialization_BUTTON_DETAILS: "$tsin_industrialization_BUTTON_TOOLTIP$"
 tsin_mission_first_factories: "From Farm to Factory"
 tsin_mission_first_factories_desc: "Have at least 3 [locations|e] with factory-tier [buildings|e]."
 tsin_mission_machine_works: "Machines that Make Machines"
 tsin_mission_machine_works_desc: "Build at least one $tsin_machine_works$."
 tsin_mission_urban_growth: "Growing Cities"
 tsin_mission_urban_growth_desc: "Have at least 4 town or city [locations|e]."
 tsin_mission_rail_link: "The First Railway"
 tsin_mission_rail_link_desc: "Join another [location|e] to the capital by railroad."
 tsin_mission_railway_boom: "Railway Boom"
 tsin_mission_railway_boom_desc: "Build at least 3 $tsin_railway_station$s."
 tsin_mission_industrial_nation: "Industrial Nation"
 tsin_mission_industrial_nation_desc: "Have at least 8 [locations|e] with factory-tier [buildings|e]."
 STATIC_MODIFIER_NAME_tsin_mission_factory_boom: "Factory Boom"
 STATIC_MODIFIER_NAME_tsin_mission_machinery: "Fostered Machine Industry"
 STATIC_MODIFIER_NAME_tsin_mission_urban_growth: "Growing Cities"
 STATIC_MODIFIER_NAME_tsin_mission_rail_link: "The First Railway"
 STATIC_MODIFIER_NAME_tsin_mission_railway_boom: "Railway Boom"
 STATIC_MODIFIER_NAME_tsin_mission_industrial_nation: "Industrial Nation"

 tsin_long_depression: "The Long Depression"
 tsin_long_depression_desc: "A stock market crash has brought down banks and railway companies one after another. The industrial nations have sunk into a long depression in which investment stops and jobs vanish. Each country may escape early through tariffs or public works; otherwise the depression may last for nearly twenty years."
 tsin_long_depression_recovery: "Recovery"
 tsin_long_depression_runs_its_course: "The Long Slump Ends"
 tsin_long_depression_panic_tt: "This [country|e] is in a financial panic."
 tsin_long_depression_slump_tt: "This [country|e] is in a slump."
 tsin_long_depression_recovered_tt: "This [country|e] has recovered from the depression."
 hint_tsin_long_depression: "[GetSituationByKey('tsin_long_depression').GetNameWithNoTooltip]"
 hint_tsin_long_depression_hint_text: "[GetSituationByKey('tsin_long_depression').GetName] has struck the industrial nations. The first two years are a panic, followed by a slump.\n\n#T Recommended Actions:#!\n@arrow_bonus_tier_3! During the slump, a recovery policy event lets us escape early through higher tariffs or public works.\n@arrow_bonus_tier_2! Once every country has recovered, the situation ends early after eight years."
 hint_tsin_long_depression_diplomatic: "\"When money stops moving, so do the factories.\""
 hint_tsin_long_depression_administrative: "\"A panic passes by itself; a slump must be ended by policy.\""
 hint_tsin_long_depression_military: "\"Hungry workers do not make good soldiers.\""
 STATIC_MODIFIER_NAME_tsin_depression_panic: "Financial Panic"
 STATIC_MODIFIER_NAME_tsin_depression_slump: "Slump"
 STATIC_MODIFIER_NAME_tsin_depression_recovered: "Recovered from the Depression"
 STATIC_MODIFIER_NAME_tsin_bank_rescue: "Bank Rescue"
 STATIC_MODIFIER_NAME_tsin_protectionist_recovery: "Protective Tariffs"
 tsin_depression.1.title: "Panic"
 tsin_depression.1.desc: "A crash on the stock exchange has wiped out fortunes in a single day. Depositors queue outside the banks, and railway companies are suspending payments."
 tsin_depression.1.a: "Rescue the banks."
 tsin_depression.1.b: "Let them fail."
 tsin_depression.1.c: "Print money."
 tsin_depression.2.title: "A Bank Fails"
 tsin_depression.2.desc: "Another bank has closed its doors. Depositors who lost their life savings are pleading with the government for help."
 tsin_depression.2.a: "Cover the depositors."
 tsin_depression.2.b: "The loss is theirs to bear."
 tsin_depression.3.title: "A Recovery Policy"
 tsin_depression.3.desc: "Our ministers have proposed ways out of the slump. Some would shield domestic industry with tariffs on foreign goods, others would have the state create jobs through public works."
 tsin_depression.3.a: "Raise tariffs."
 tsin_depression.3.b: "Start public works."
 tsin_depression.3.c: "Wait it out."
 tsin_depression.10.title: "The Depression Ends"
 tsin_depression.10.desc: "The long depression is finally over. Smoke rises again from the factory chimneys, and investors are returning."
 tsin_depression.10.a: "At last."

 tsin_scramble_for_colonies: "The Scramble for Colonies"
 tsin_scramble_for_colonies_desc: "Armed with steamships, railways and machine guns, the industrial powers are racing to seize the lands that still have no master. At a colonial conference in ten years, each power will choose between dividing spheres of influence and open rivalry."
 tsin_scramble_for_colonies_partition_complete: "Partition Complete"
 tsin_scramble_for_colonies_participant_tt: "The owner of this [location|e] takes part in the scramble."
 tsin_scramble_for_colonies_unclaimed_tt: "This [location|e] has no owner yet."
 LEGEND_KEY_TSIN_SCRAMBLE_PARTICIPANT: "Scramble participant"
 LEGEND_KEY_TSIN_SCRAMBLE_UNCLAIMED: "Unclaimed land"
 hint_tsin_scramble_for_colonies: "[GetSituationByKey('tsin_scramble_for_colonies').GetNameWithNoTooltip]"
 hint_tsin_scramble_for_colonies_hint_text: "[GetSituationByKey('tsin_scramble_for_colonies').GetName] has begun. Participants gain colonial range and migration.\n\n#T Recommended Actions:#!\n@arrow_bonus_tier_3! Colonize unclaimed land quickly.\n@arrow_bonus_tier_2! The imperialism [casus_belli|e] can also target the lands of weaker states."
 hint_tsin_scramble_for_colonies_diplomatic: "\"The blank spaces on the map will not stay blank for long.\""
 hint_tsin_scramble_for_colonies_administrative: "\"Colonies are harder to govern than to gain.\""
 hint_tsin_scramble_for_colonies_military: "\"The farther an expedition goes, the harder it is to supply.\""
 STATIC_MODIFIER_NAME_tsin_scramble_colonial_drive: "Colonial Scramble"
 STATIC_MODIFIER_NAME_tsin_scramble_spheres: "Agreed Spheres of Influence"
 STATIC_MODIFIER_NAME_tsin_scramble_rivalry: "Colonial Rivalry"
 STATIC_MODIFIER_NAME_tsin_colonial_resistance: "Colonial Resistance"
 tsin_scramble.1.title: "The Scramble for Colonies"
 tsin_scramble.1.desc: "The powers are sending explorers and soldiers towards the remaining lands. We cannot fall behind in this race."
 tsin_scramble.1.a: "Let us plant our flag."
 tsin_scramble.2.title: "The Colonial Conference"
 tsin_scramble.2.desc: "Envoys of the powers have gathered to decide how the remaining lands will be divided. Recognising spheres of influence would reduce clashes, but it would also fix our share."
 tsin_scramble.2.a: "Accept the spheres of influence."
 tsin_scramble.2.b: "Press every claim."
 tsin_scramble.3.title: "Resistance in the Colonies"
 tsin_scramble.3.desc: "The people of a new colony have taken up arms and attacked settlers and trading posts."
 tsin_scramble.3.a: "Send a punitive expedition."
 tsin_scramble.3.b: "Pull the settlers back."
 tsin_scramble.10.title: "The Partition Ends"
 tsin_scramble.10.desc: "The blank spaces on the map have all but vanished. From now on, the powers will compete over lands already divided."
 tsin_scramble.10.a: "A new era begins."

 STATIC_MODIFIER_NAME_tsin_invention_bessemer_licenses: "Bessemer Licences"
 STATIC_MODIFIER_NAME_tsin_invention_bessemer_state_works: "State Converter Works"
 STATIC_MODIFIER_NAME_tsin_invention_dynamite_mines: "Dynamite Mining"
 STATIC_MODIFIER_NAME_tsin_invention_dynamite_tunnels: "Railway Tunnel Blasting"
 STATIC_MODIFIER_NAME_tsin_invention_refrigerated_meat: "Chilled Meat Trade"
 STATIC_MODIFIER_NAME_tsin_invention_cold_storage_fleets: "Cold-Storage Fleets"
 tsin_invention.10.title: "The Bessemer Converter"
 tsin_invention.10.desc: "A converter that blows air through molten pig iron and turns it into steel in minutes has been proven in our own ironworks. We must decide who will work it."
 tsin_invention.10.a: "Sell licences to private ironmasters."
 tsin_invention.10.b: "Build state works for rails and guns."
 tsin_invention.20.title: "Dynamite"
 tsin_invention.20.desc: "Nitroglycerin soaked into diatomaceous earth has given us an explosive that can be handled safely. Mine owners and railway engineers both want it."
 tsin_invention.20.a: "Open new mines."
 tsin_invention.20.b: "Blast tunnels and cuttings for the railways."
 tsin_invention.20.c: "Restrict it for fear of accidents."
 tsin_invention.30.title: "Refrigerated Ships"
 tsin_invention.30.desc: "Ships carrying ice and refrigerating machinery can now bring meat and fish to distant ports without spoiling."
 tsin_invention.30.a: "Export chilled meat from the pastures."
 tsin_invention.30.b: "Fit out cold-storage fishing fleets."
 tsin_invention.30.c: "Leave it to the shipping lines."

 STATIC_MODIFIER_NAME_tsin_financial_panic: "Financial Panic"
 STATIC_MODIFIER_NAME_tsin_railway_mania: "Railway Mania"
 STATIC_MODIFIER_NAME_tsin_railway_chartered: "Chartered Railways"
 STATIC_MODIFIER_NAME_tsin_railway_crash: "Railway Share Crash"
 STATIC_MODIFIER_NAME_tsin_stolen_designs: "Stolen Designs"
 STATIC_MODIFIER_NAME_tsin_foreign_engineers: "Foreign Engineers"
 tsin_economy.50.title: "Financial Panic"
 tsin_economy.50.desc: "A great discount house has stopped payment, and depositors are crowding the bank counters. Prices on the stock exchange collapsed within a single day."
 tsin_economy.50.a: "Rescue the banks from the treasury."
 tsin_economy.50.b: "Suspend gold convertibility."
 tsin_economy.50.c: "Let the weak houses fail."
 tsin_economy.60.title: "Railway Mania"
 tsin_economy.60.desc: "Shares in new railway companies sell out the moment they are issued. Even people who do not know where the lines will run are pouring in their savings."
 tsin_economy.60.a: "Let the share prices soar."
 tsin_economy.60.a.tt: "When the mania ends, the bubble may burst."
 tsin_economy.60.b: "Require charters and capital reserves."
 tsin_economy.61.title: "The Railway Bubble Bursts"
 tsin_economy.61.desc: "The promised dividends never came, and railway shares have collapsed together. Half-built lines and bankrupt companies are all that remain."
 tsin_economy.61.a: "Take over the bankrupt lines."
 tsin_economy.61.b: "Let the investors bear the loss."
 tsin_economy.70.title: "Industrial Espionage"
 tsin_economy.70.desc: "The machine-tool works of [SCOPE.sCountry('tsin_espionage_target').GetName] are far ahead of ours. Someone has offered us a way to obtain their drawings."
 tsin_economy.70.a: "Pay agents to copy the drawings."
 tsin_economy.70.b: "Hire their emigrant engineers."
 tsin_economy.70.c: "We will build our own."

 tsin_machine_works_oil_lubrication: "Oil Lubrication"
 tsin_mechanized_rubber_belts: "Rubber Drive Belts"
 tsin_prospect_for_oil.title: "Prospect for Oil"
 tsin_prospect_for_oil.desc: "The black oil that seeps from the ground has long been known, but steam drills can now reach deep enough to yield kerosene and lubricants in quantity. Let us spend [political_influence|e] surveying promising ground."
 tsin_prospect_for_oil.a: "Begin drilling."
 tsin_prospect_for_oil_effect_tt: "[tsin_oil_prospect_location.GetName] will now produce [ShowGoodsName('tsin_oil')], instead of [tsin_oil_prospect_location.GetRawMaterial.GetName]"
 STATIC_MODIFIER_NAME_tsin_rubber_concessions: "Rubber Company Concessions"
 STATIC_MODIFIER_NAME_tsin_rubber_concession_terror: "Forced Rubber Collection"
 tsin_economy.80.title: "The Rubber Boom"
 tsin_economy.80.desc: "Now that vulcanised rubber is used for belts, hoses and waterproof cloth, its price is soaring. Companies eager for the rubber trees of our tropical forests are asking for concessions."
 tsin_economy.80.a: "Grant concessions to the rubber companies."
 tsin_economy.80.b: "Plant rubber under state supervision."
 tsin_economy.80.c: "Leave the forests alone."
 tsin_economy.80.convert_tt: "The raw material of [THIS.GetLocation.GetName] becomes [ShowGoodsName('tsin_rubber')]."

