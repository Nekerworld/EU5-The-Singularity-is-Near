 tsin_powers.10.title: "열강 회의"
 tsin_powers.10.desc: "긴 전쟁이 끝나고 열강의 외교관들이 우리 수도에 모였습니다. 국경과 해협, 작은 나라들의 운명이 회의장 탁자 위에 놓여 있습니다."
 tsin_powers.10.a: "세력 균형: 함께 문제를 매듭짓는다."
 tsin_powers.10.b: "우리가 조건을 정한다."
 tsin_powers.20.title: "제네바 협약"
 tsin_powers.20.desc: "전쟁터의 참상을 목격한 한 상인이 부상병을 적과 아군 구별 없이 돌보자는 국제 협약을 제안했습니다. 흰 바탕에 붉은 십자가 그려진 깃발 아래 의무병은 공격받지 않게 됩니다."
 tsin_powers.20.a: "협약에 서명한다."
 tsin_powers.20.b: "전쟁에 규칙은 없다."
 tsin_powers.30.title: "해군 군비 경쟁"
 tsin_powers.30.desc: "경쟁국이 더 크고 빠른 강철 전함을 진수했습니다. 신문은 우리 함대가 이미 낡았다고 떠들고, 해군 제독들은 새 전함 건조 예산을 요구합니다."
 tsin_powers.30.a: "새 전함을 건조한다."
 tsin_powers.30.b: "우리의 힘은 육지에 있다."
 tsin_dual_monarchy_decision: "이중 제국 타협"
 tsin_dual_monarchy_decision.title: "이중 제국 타협"
 tsin_dual_monarchy_decision.desc: "가장 큰 소수 민족에게 자체 의회와 정부를 허락하고, 군주와 외교·군사만 함께 나눕니다. 그 민족의 문화는 수용 문화가 됩니다."
 tsin_dual_monarchy_decision.a: "두 왕관, 하나의 군주."
