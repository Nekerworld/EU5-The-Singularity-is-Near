l_korean:
 game_concept_tsin_industrial_society_concept: "산업 사회"
 game_concept_tsin_industrial_society_concept_desc: "공장과 철도는 사람들의 삶을 바꿉니다. 산업 시대에는 도시가 [ShowPopTypeName('laborers')]와 [ShowPopTypeName('burghers')]으로 채워지고, 교육은 읽고 쓰기를 넘어서며, 평범한 사람들이 조직을 만들어 일하는 방식과 다스려지는 방식에 목소리를 내기 시작합니다. 잘 다스린 산업 사회는 숙련되고 건강하며 충성스럽지만, 방치한 산업 사회는 붐비고 성나 있으며 급진적입니다.\n\n정치 운동, 노동, 주거는 시대가 시작될 때부터 작동합니다. [tsin_education_ladder_concept|e]는 [ShowInstitutionName('tsin_mass_society')] 제도를 받아들인 뒤에 시작됩니다.\n\n#T 삶과 일#!\n$BULLET$[tsin_urbanization_concept|e]: 인구 가운데 얼마나 많은 사람이 도시의 삶을 사는지.\n$BULLET$[tsin_housing_concept|e]: 붐비는 도시와 노동자 주택.\n$BULLET$[tsin_labor_conditions_concept|e]: 공장 도시마다 일이 얼마나 견딜 만한지.\n$BULLET$[tsin_labor_grievance_concept|e]: 공장 노동자의 분노, 파업, 사회주의 세포.\n$BULLET$[tsin_public_health_concept|e]: 전염병, 위생, 기대 수명.\n\n#T 배움#!\n$BULLET$[tsin_education_ladder_concept|e]: 문해력, 중등교육, 고등교육.\n$BULLET$[tsin_schools_and_universities_concept|e]: 교육 단계를 채우는 건물.\n\n#T 거리의 정치#!\n$BULLET$[tsin_movements_concept|e]: 자유주의자, 민족주의자, 노동조합, 사회주의자, 여성 참정권 운동가, 노예제 폐지론자.\n$BULLET$[tsin_estate_privileges_concept|e]: 이 시대에 [estates|e]이 요구하는 것.\n\n#T 참고#!\n$BULLET$[tsin_society_advances_concept|e]: 이 모든 것을 여는 발전.\n$BULLET$[tsin_working_class_events_concept|e]: 이런 조건이 불러오는 이벤트.\n$BULLET$[tsin_social_modifiers_concept|e]: 우리가 받을 수 있는 보정치.\n\n함께 볼 지도 모드: $mapmode_tsin_urbanization_name$, $mapmode_tsin_housing_name$, $mapmode_tsin_labor_conditions_name$, $mapmode_tsin_labor_unrest_name$, $mapmode_tsin_radicalism_name$, $mapmode_tsin_education_name$."
 game_concept_tsin_movements_concept: "정치 운동"
 game_concept_tsin_movements_concept_desc: "이 시대에는 사상이 군대보다 빨리 퍼집니다. 산업 시대부터 모든 나라는 여섯 정치 운동의 세기를 0~100으로 기록합니다. 노예제 폐지 운동, 자유주의, 민족주의, 노동 운동, 사회주의, 여성 참정권입니다. 강한 운동은 [estates|e]의 호감을 깎고 [societal_values|e]을 자기 쪽으로 끌어당기므로, 무엇이 운동을 키우는지 알아 두는 것이 좋습니다.\n\n#T 운동이 자라는 방식#!\n운동은 해마다 각자의 증가량만큼 변합니다.\n$BULLET$노예제 폐지 운동은 노예제가 합법인 동안에만 있습니다. [ShowInstitutionName('tsin_mass_society')], [ShowAdvanceName('tsin_mass_communication_advance')], [ShowPolicyName('free_press')], 인도주의 가치관으로 자라고, 노예가 인구의 10분의 1을 넘으면 느려집니다.\n$BULLET$자유주의는 [ShowInstitutionName('tsin_mass_society')], [ShowPolicyName('free_press')], 자유주의 가치관, [ShowPolicyName('tsin_assembly_banned_policy')]으로 자랍니다. [ShowPolicyName('tsin_free_association_policy')] 정책이 요구를 채웁니다.\n$BULLET$민족주의는 [ShowAdvanceName('tsin_mass_communication_advance')]와 호전적 가치관으로 자라고, [subjects|e]에서는 훨씬 빨리 자랍니다.\n$BULLET$노동 운동은 [ShowAdvanceName('tsin_labor_movement_advance')] 발전, 공장, [tsin_labor_grievance_concept|e], [ShowPolicyName('tsin_unregulated_labor_policy')]으로 자랍니다. [ShowPolicyName('tsin_factory_acts_policy')], 그보다 더 [ShowPolicyName('tsin_labor_protection_policy')] 정책이 요구를 채웁니다.\n$BULLET$사회주의는 그대로 두면 사그라듭니다. 50 이상의 노동 운동, 50 이상의 노동 불만, 사회주의 세포, 공동체 가치관, 규제 없는 노동, 집회 금지가 사회주의를 키웁니다. [ShowPolicyName('tsin_social_insurance_policy')] 정책이 요구를 채웁니다.\n$BULLET$여성 참정권은 [ShowAdvanceName('tsin_universal_education_advance')], [ShowAdvanceName('tsin_mass_communication_advance')], 인도주의 가치관으로 자랍니다. 이 시대에는 요구를 채우는 법률이 없습니다.\n집회를 금지하면 노동 운동과 여성 참정권은 지하로 숨어 느려지지만, 자유주의와 사회주의는 오히려 자랍니다.\n\n#T 선동#!\n60 이상이 된 운동은 선동을 시작해 50 아래로 떨어질 때까지 [country_modifier|e]를 줍니다.\n$BULLET$[ShowModifier('tsin_liberalism_agitation')]: [ShowEstateTypeName('burghers_estate')] 만족도 하락, 자유주의 쪽으로 이동.\n$BULLET$[ShowModifier('tsin_nationalism_agitation')]: 인력 증가, 호전 쪽으로 이동.\n$BULLET$[ShowModifier('tsin_labor_unionism_agitation')]: [ShowEstateTypeName('peasants_estate')] 만족도 하락, [production_efficiency|e] 하락.\n$BULLET$[ShowModifier('tsin_socialism_agitation')]: 평민과 도시민 만족도 하락, 공동체 쪽으로 이동.\n$BULLET$[ShowModifier('tsin_womens_suffrage_agitation')]: 도시민 만족도 하락, 인도주의 쪽으로 이동.\n\n#T 요구 들어주기#!\n강한 운동은 [parliament_agendas|e]을 내놓습니다. [ShowParliamentAgendaTypeName('pa_tsin_abolish_slavery')](노예제 폐지 운동 50), [ShowParliamentAgendaTypeName('pa_tsin_freedom_of_association')](자유주의 50), [ShowParliamentAgendaTypeName('pa_tsin_social_insurance')](사회주의 40 또는 노동 운동 60)입니다. 뒤의 둘을 받아들이면 해당 정책의 [tsin_bills_concept|e]이 상정되고 운동이 20 줄어듭니다. 운동은 인민헌장, 파업, 여성 투표권 같은 [tsin_working_class_events_concept|e]도 일으킵니다.\n\n#T 확인하는 곳#!\n가장 강한 운동의 세기가 그 나라의 급진성입니다. $mapmode_tsin_radicalism_name$ 지도 모드는 급진성에 [location|e]마다의 불만을 곱해 보여 주고, $mapmode_tsin_labor_unrest_name$ 지도 모드의 툴팁은 노동 운동과 노동 불만을 보여 줍니다. 급진성이 60에 이르면 힌트가 나타납니다."
 game_concept_tsin_labor_conditions_concept: "노동 조건"
 game_concept_tsin_labor_conditions_concept_desc: "노동 조건은 공장이 있는 [location|e]에서 일이 얼마나 견딜 만한지를 0(참혹함)부터 1(좋음)까지로 나타냅니다. 공장 일자리가 있는 지점에만 있습니다. 노동 조건이 나쁘면 [tsin_labor_grievance_concept|e]이 오르고, 아주 나쁘면 사회주의 세포가 생깁니다.\n\n해마다 공장 지점마다 0.5에서 시작해 다음을 더합니다.\n$BULLET$[ShowLawName('tsin_labor_law')]: [ShowPolicyName('tsin_unregulated_labor_policy')] -0.15, [ShowPolicyName('tsin_factory_acts_policy')] +0.1, [ShowPolicyName('tsin_labor_protection_policy')] +0.25.\n$BULLET$[ShowLawName('tsin_welfare_law')]: [ShowPolicyName('tsin_social_insurance_policy')] +0.1, [ShowPolicyName('tsin_poor_law_policy')] +0.05.\n$BULLET$과밀: 인구가 [population_capacity|e]의 80%를 넘으면 최대 -0.2([tsin_housing_concept|e]).\n$BULLET$지점의 [ShowBuildingTypeName('tsin_model_dwellings')]: +0.1.\n$BULLET$숙련 노동자: 중등교육률에 따라 최대 +0.09([tsin_education_ladder_concept|e]).\n$BULLET$최근의 공장 사고(5년), 무력으로 진압한 파업(10년): 각각 -0.1.\n$BULLET$그곳 주민의 [average_satisfaction|e]: -0.1~+0.1.\n\n나라의 노동 조건은 공장 지점들의 평균이며, 일자리 수로 가중합니다. 공장이 없는 나라는 0.5로 칩니다. $mapmode_tsin_labor_conditions_name$ 지도 모드에서 공장 지점마다 볼 수 있고, 툴팁은 그 지점 노동자 가운데 공장에서 일하는 비율도 보여 줍니다."
 game_concept_tsin_labor_grievance_concept: "노동 불만"
 game_concept_tsin_labor_grievance_concept_desc: "노동 불만은 공장 노동자들의 분노를 0~100으로 나타냅니다. 산업국에서만 의미가 있습니다. 나쁜 [tsin_labor_conditions_concept|e]은 인구 가운데 공장에서 일하는 비율만큼만 반영되고, 그 비율이 10분의 1에 이르면 온전히 반영됩니다.\n\n#T 움직이는 방식#!\n노동 불만은 해마다 목표값과의 차이의 4분의 1만큼 다가갑니다. 목표값은 (1 - 노동 조건) × 100에 공장 비중을 곱한 뒤 다음을 더합니다.\n$BULLET$[ShowSituationName('tsin_long_depression')]의 공황이나 침체 중 +10.\n$BULLET$[ShowPolicyName('tsin_free_association_policy')] -5, [ShowEstatePrivilegeName('tsin_union_recognition')] -10, [ShowModifier('tsin_ten_hour_day')] -5, [ShowPolicyName('tsin_antitrust_policy')] -3.\n여러 이벤트 선택지와 의회 안건도 노동 불만을 바로 더하거나 뺍니다.\n\n#T 불러오는 것#!\n$BULLET$노동 운동을 키우고, 50부터는 사회주의도 키웁니다([tsin_movements_concept|e]).\n$BULLET$30부터 [ShowEstateTypeName('peasants_estate')] 계층이 [parliament|e]에 [ShowParliamentAgendaTypeName('pa_tsin_factory_inspection')] 안건을 낼 수 있습니다(불만 -10, 10년 보정치). 40부터는 노동조합이 승인된 경우 [ShowParliamentAgendaTypeName('pa_tsin_ten_hour_day')]를 요구할 수 있습니다(불만 -15, [production_efficiency|e]을 깎는 영구 보정치).\n$BULLET$노동 운동과 함께 노동·복지 [tsin_bills_concept|e]이 통과될 확률을 높입니다.\n$BULLET$[tsin_working_class_events_concept|e]을 엽니다. 신경 쇠약(30), 노동절 시위와 개척지로 떠나는 노동자(50), 무정부주의자의 공격(60).\n$BULLET$60 이상이면 기업 주가를 끌어내립니다([tsin_stock_index_concept|e]).\n\n#T 파업과 사회주의 세포#!\n노동 운동이 40에 이르면 공장 도시에서 파업이 일어날 수 있습니다. 노동조합을 인정하거나 중재하면 노동 운동이 누그러지지만, 무력으로 진압하면 노동 운동과 사회주의가 커지고 그 지점의 노동 조건이 10년 동안 나빠집니다.\n1885년부터는 공장 일자리가 많고 노동 조건이 0.35 미만인 공장 지점에 해마다 10% 확률로 사회주의 세포가 생깁니다. 세포는 해마다 5% 확률로 같은 [market|e]의 다른 공장 도시(조건 0.5 미만)로 번집니다. 세포 3개마다 사회주의의 연간 증가량이 1씩 늘고(최대 2), 세포는 \"사회주의 독서회\" 이벤트를 일으킬 수 있으며 그 이벤트에서 급습해 없앨 수 있습니다.\n\n$mapmode_tsin_labor_unrest_name$ 지도 모드는 최근의 파업과 시가전을 표시하고 툴팁에 노동 불만을 보여 줍니다. 노동 불만이 50에 이르면 힌트가 나타납니다."
 game_concept_tsin_housing_concept: "주거와 과밀"
 game_concept_tsin_housing_concept_desc: "공장 도시는 집보다 빨리 자랍니다. [population|e]가 [population_capacity|e]의 80%를 넘는 [location|e]은 과밀 상태입니다. 과밀은 [tsin_labor_conditions_concept|e]을 최대 0.2 깎고, [ShowBuildingTypeName('tsin_waterworks')]이 없는 과밀한 읍과 도시는 [ShowDisasterName('tsin_cholera')]가 덮치는 곳이며([tsin_public_health_concept|e]), $tsin_steam_port$이 있는 과밀 지점에서는 이민선이 떠날 수 있습니다.\n\n#T 건물#!\n$BULLET$[ShowBuildingTypeName('tsin_tenement')]([ShowAdvanceName('tsin_urban_planning_advance')]로 해금): 레벨마다 인구 한도 +4%, [migration_attraction|e] +0.03, [disease_resistance|e] -0.02. 유지비는 목재와 석재입니다.\n$BULLET$[ShowBuildingTypeName('tsin_model_dwellings')]([ShowAdvanceName('tsin_housing_reform_advance')]로 해금): 연립주택을 대신합니다. 레벨마다 인구 한도 +5%, 이주 매력도 +0.03, 질병 저항력 +0.03, [unrest|e] -0.02이고, 그 지점 공장의 노동 조건이 +0.1 오릅니다. 유지비는 석조 자재, 목재, 도구입니다.\n두 건물 모두 읍, 도시, 대도시에 지을 수 있고 [ShowPopTypeName('laborers')]를 조금 고용합니다. 최대 레벨은 1이고, 도시 +1, 대도시 +2, [ShowAdvanceName('tsin_modern_sewerage_advance')] +1, [ShowAdvanceName('tsin_public_works')] +1입니다.\n\n#T 그 밖의 도움#!\n$BULLET$[ShowAdvanceName('tsin_urban_planning_advance')]: 모든 곳의 인구 한도 +10%.\n$BULLET$[cabinet_action|e] [ShowCabinetActionName('tsin_urban_renewal')]: 고른 [province|e]의 인구 한도를 늘리고 불안도를 낮춥니다.\n\n$mapmode_tsin_housing_name$ 지도 모드는 모범 주택, 연립주택, 과밀, 심한 과밀 지점을 보여 주고, 툴팁은 인구 한도 대비 인구를 보여 줍니다."
 game_concept_tsin_urbanization_concept: "도시화"
 game_concept_tsin_urbanization_concept_desc: "도시화는 [location|e] 인구 가운데 [ShowPopTypeName('burghers')]과 [ShowPopTypeName('laborers')]의 비율입니다. 따로 계산되는 값이 아니라, 산업이 사람들을 땅에서 얼마나 끌어냈는지 보여 주는 그림입니다. 도시의 [pops|e]은 공장과 학교를 채우고, [tsin_movements_concept|e]에 뛰어드는 것도 바로 이들입니다.\n\n도시화를 이끄는 것:\n$BULLET$새 일자리가 생길 때 일어나는 농민의 [promotion|e]. [ShowAdvanceName('tsin_labor_movement_advance')] 발전과 중등교육([tsin_education_ladder_concept|e])이 이를 빠르게 합니다.\n$BULLET$도시로 향하는 [migration|e]. [ShowAdvanceName('tsin_urban_planning_advance')](비농촌 이주 매력도 +0.25, [population_capacity|e] +10%), [ShowLawName('tsin_land_reform_law')]의 [ShowPolicyName('tsin_redemption_payments_policy')](+0.1)과 [ShowPolicyName('tsin_full_emancipation_policy')](+0.25), 노동자 주택([tsin_housing_concept|e]).\n$BULLET$일자리를 만드는 공장([tsin_industrial_economy_concept|e]).\n\n$mapmode_tsin_urbanization_name$ 지도 모드는 지점마다 이 비율을 보여 주며, 50%부터 가장 진한 색이 됩니다. 도시와 대도시는 언제나 가장 진한 색입니다. 공장 노동자가 늘면 노동 조건이 나쁠 때 [tsin_labor_grievance_concept|e]도 함께 는다는 점을 기억하십시오."
 game_concept_tsin_education_ladder_concept: "교육 단계"
 game_concept_tsin_education_ladder_concept_desc: "이 시대에는 거의 모두가 글을 배우므로 문해력만으로는 나라 사이의 차이가 드러나지 않습니다. $tsin_mass_society$ 제도를 받아들이면 교육을 세 단계로 재며, 이미 있던 교육받은 엘리트층에서 출발합니다(중등 = 문해력의 15%, 고등 = 중등의 20%).\n$BULLET$초등: 바닐라 [literacy|e] 그대로입니다.\n$BULLET$중등교육률(0~90): $tsin_public_school$ 정원, 교육 정책, 공장 비중에서 나옵니다.\n$BULLET$고등교육률(0~60): $tsin_research_university$와 $university$의 정원에서 나옵니다.\n\n#T 목표값#!\n중등 목표값은 인구 대비 학교 정원에 [ShowPolicyName('secular_education')] +5, [ShowPolicyName('basic_religious_education')] 또는 [ShowPolicyName('scottish_presbyterian_education')] +2, [ShowPolicyName('uneducated_masses_education')] -5를 더하고, 공장 비중 × 20을 더한 값입니다. 고등 목표값은 인구 대비 대학 정원이며, [ShowGovernmentReformName('tsin_national_laboratory')]가 있으면 +1.5입니다.\n위 단계는 아래 단계를 넘지 못합니다(중등 ≤ 문해력 × 0.9, 고등 ≤ 중등 × 0.6). 해마다 목표값과의 차이의 10%씩, 중등은 최대 3, 고등은 최대 2씩 움직입니다.\n\n#T 효과#!\n단계마다 하나씩 [country_modifier|e]를 받습니다.\n$BULLET$중등 10 / 25 / 45 / 70: 생산 효율 +1 / +2 / +3.5 / +5%, 건물 건설 효율 +2 / +4 / +6 / +8%, 더 빠른 [promotion|e].\n$BULLET$고등 2 / 6 / 15 / 30: 연구 속도 +2 / +4 / +7 / +10%, 제도 성장 +5 / +10 / +15 / +20%.\n중등교육은 공장의 [tsin_labor_conditions_concept|e]도 최대 +0.09 높이고, 고등교육 2단계부터는 과학자들이 발명을 더 내놓을 수 있습니다.\n\n단계가 바뀔 때마다 교육 보고서 이벤트가 알려 줍니다. $mapmode_tsin_education_name$ 지도 모드는 나라를 고등교육률로 칠하고 툴팁에서 세 단계를 모두 보여 줍니다. 건물은 [tsin_schools_and_universities_concept|e]을 참고하십시오."
 game_concept_tsin_schools_and_universities_concept: "학교와 대학"
 game_concept_tsin_schools_and_universities_concept_desc: "두 건물이 [tsin_education_ladder_concept|e]의 정원을 채웁니다. 나라 전체 인구에 견주어 레벨 수만 셈하므로, 큰 나라일수록 많이 지어야 합니다.\n\n#T $tsin_public_school$#!\n[ShowAdvanceName('tsin_universal_education_advance')]로 해금합니다. 읍, 도시, 대도시에 짓는 새 건물로, [ShowPopTypeName('burghers')]을 고용합니다. 지점의 최대 [literacy|e], 문해력 증가, [promotion|e]을 높이며, 유지비는 종이와 책입니다.\n$BULLET$최대 레벨: 1, 도시 +1, 대도시 +2, [ShowAdvanceName('tsin_vocational_education_advance')] +1, [ShowAdvanceName('tsin_national_education')] +1.\n$BULLET$과정: $tsin_public_school_basic$에서 $tsin_public_school_vocational$([ShowAdvanceName('tsin_vocational_education_advance')], 도구도 씀), $tsin_public_school_comprehensive$([ShowAdvanceName('tsin_engineering_education_advance')], 유리도 씀)으로 올라갑니다. 이 두 발전은 각각 모든 학교 레벨의 정원을 50%씩 늘립니다.\n\n#T $tsin_research_university$#!\n[ShowAdvanceName('tsin_humboldt_university_advance')]로 해금합니다. 바닐라 $university$를 대신하며 그 효과(지점 제도 성장, 도시민과 귀족의 문해력, 문화 영향력)를 그대로 가집니다. [core|e] 지점에만 지을 수 있고, 대학 건설을 막는 특권이 있으면 지을 수 없습니다.\n$BULLET$최대 레벨: 1, [ShowAdvanceName('tsin_experimental_science_advance')] +1, [ShowAdvanceName('tsin_engineering_education_advance')] +1.\n$BULLET$생산 방식: $tsin_research_university_lectures$, $tsin_research_university_laboratory$, $tsin_research_university_institute$([ShowGoodsName('tsin_electricity')] 사용). 같은 두 발전이 각각 모든 대학 레벨의 정원을 50%씩 늘립니다.\n\n옛 대학교도 고등교육 정원에 들어갑니다. [ShowAdvanceName('tsin_experimental_science_advance')]는 [government_reform|e] [ShowGovernmentReformName('tsin_national_laboratory')]도 엽니다. 연구 속도와 제도 성장이 오르고 고등교육 목표값이 1.5 높아지지만, 성직자 만족도가 조금 떨어집니다."
 game_concept_tsin_public_health_concept: "공중보건"
 game_concept_tsin_public_health_concept_desc: "붐비는 산업 도시는 [diseases|e]의 온상입니다. 공중보건은 하나의 수치가 아니라 [disease_resistance|e]과 기대 수명을 높이고 전염병을 짧게 끝내는 수단들의 묶음입니다.\n\n#T 위협#!\n$BULLET$[ShowDisasterName('tsin_cholera')](1830~1875년): 과밀한 읍이나 도시 두 곳 이상에 [ShowBuildingTypeName('tsin_waterworks')]가 없으면 시작될 수 있는 [disaster|e]입니다. 발병할 때마다 그런 도시 인구의 일부가 죽으며, 횟수에는 한도가 있습니다. 진행도가 충분히 쌓이면 끝나는데, 수도의 $tsin_waterworks$와 높은 질병 저항력이 이를 앞당깁니다.\n$BULLET$나라에 발진티푸스나 독감이 돌면 \"빈민가의 전염병\" 이벤트가 일어날 수 있습니다. 위생 개혁이나 격리를 고를 수 있습니다.\n$BULLET$과밀([tsin_housing_concept|e]): $tsin_tenement$은 질병 저항력을 낮추고 $tsin_model_dwellings$은 높입니다.\n\n#T 수단#!\n$BULLET$[cabinet_action|e] [ShowCabinetActionName('tsin_public_health_campaign')]([ShowAdvanceName('tsin_anesthesia_advance')]로 해금): 실시하는 동안 나라 전체의 질병 저항력 +0.1, 기대 수명 +1, 인구 증가가 조금 빨라집니다.\n$BULLET$내각 행동 [ShowCabinetActionName('tsin_urban_renewal')]([ShowAdvanceName('tsin_urban_planning_advance')]로 해금): 고른 [province|e]에 [population_capacity|e] +5%, [unrest|e] -0.5, 질병 저항력 +0.1, 건설 속도 +15%. 여러 지방에서 동시에 실시할 수 있습니다.\n$BULLET$발전: [ShowAdvanceName('tsin_modern_sewerage_advance')], [ShowAdvanceName('tsin_anesthesia_advance')], [ShowAdvanceName('tsin_antiseptic_surgery_advance')], [ShowAdvanceName('tsin_vaccination_campaigns_advance')], [ShowAdvanceName('tsin_housing_reform_advance')], [ShowAdvanceName('tsin_social_insurance_advance')]가 질병 저항력이나 기대 수명을 높입니다.\n$BULLET$정책과 특권: [ShowPolicyName('tsin_poor_law_policy')](+1), [ShowPolicyName('tsin_social_insurance_policy')](+2), [ShowEstatePrivilegeName('tsin_mutual_aid_societies')](+1)가 기대 수명을 높입니다.\n$BULLET$\"대악취\", \"펌프 손잡이\", \"도시의 허파\", \"종두 반대 폭동\" 같은 이벤트는 오래가는 보건 보정치를 남길 수 있습니다([tsin_social_modifiers_concept|e])."
 game_concept_tsin_estate_privileges_concept: "산업 시대의 특권과 요구"
 game_concept_tsin_estate_privileges_concept_desc: "산업 시대부터 각 [estate|e]에 새 [estate_privilege|e]을 하나씩 줄 수 있습니다. 다른 특권처럼 그 계층의 만족도와 권력을 올리는 대신 효과를 줍니다.\n$BULLET$[ShowEstatePrivilegeName('tsin_chambers_of_commerce')]([ShowEstateTypeName('burghers_estate')]): [ShowModifierTypeName('global_mills_build_buildings_efficiency')] +10%, 금권정 쪽으로 이동.\n$BULLET$[ShowEstatePrivilegeName('tsin_officer_corps_monopoly')]([ShowEstateTypeName('nobles_estate')]): 육군 사기 +5%, 귀족정 쪽으로 이동.\n$BULLET$[ShowEstatePrivilegeName('tsin_church_school_network')]([ShowEstateTypeName('clergy_estate')]): [literacy|e] 증가가 빨라지고 영성주의 쪽으로 이동. [ShowPolicyName('tsin_separation_of_church_and_state_policy')] 정책 아래에서는 나타나지 않습니다.\n$BULLET$[ShowEstatePrivilegeName('tsin_mutual_aid_societies')]([ShowEstateTypeName('peasants_estate')], [ShowAdvanceName('tsin_labor_movement_advance')] 발전 필요): 기대 수명 +1, 공동체 쪽으로 이동.\n$BULLET$[ShowEstatePrivilegeName('tsin_union_recognition')]([ShowEstateTypeName('peasants_estate')], 같은 발전과 [ShowEstatePrivilegeName('tsin_mutual_aid_societies')] 필요): [production_efficiency|e] -2%, 공동체 쪽으로 이동. 대신 [tsin_labor_grievance_concept|e]의 목표값이 10 낮아지고, 평민이 10시간 노동제를 요구할 수 있게 됩니다.\n\n#T 계층의 요구#!\n계층들은 새 [parliament_agendas|e]도 내놓습니다. 그 가운데 많은 안건은 정책을 바로 시행하지 않고 [tsin_bills_concept|e]으로 상정합니다.\n$BULLET$[ShowEstateTypeName('peasants_estate')]: [ShowParliamentAgendaTypeName('pa_tsin_factory_acts')](규제 없는 노동일 때), [ShowParliamentAgendaTypeName('pa_tsin_social_insurance')], [ShowParliamentAgendaTypeName('pa_tsin_factory_inspection')], [ShowParliamentAgendaTypeName('pa_tsin_ten_hour_day')].\n$BULLET$[ShowEstateTypeName('burghers_estate')]: [ShowParliamentAgendaTypeName('pa_tsin_freedom_of_association')], [ShowParliamentAgendaTypeName('pa_tsin_railway_charters')], [ShowParliamentAgendaTypeName('pa_tsin_repeal_corn_laws')].\n$BULLET$[ShowEstateTypeName('nobles_estate')]: [ShowParliamentAgendaTypeName('pa_tsin_restore_landlord_rights')], [ShowParliamentAgendaTypeName('pa_tsin_protect_grain')].\n$BULLET$[ShowEstateTypeName('clergy_estate')]: [ShowParliamentAgendaTypeName('pa_tsin_restore_concordat')], [ShowParliamentAgendaTypeName('pa_tsin_abolish_slavery')]."
 game_concept_tsin_society_advances_concept: "대중사회 발전"
 game_concept_tsin_society_advances_concept_desc: "대중사회 갈래의 [advances|e]은 [ShowAdvanceName('tsin_mass_society_advance')] 뒤에 이어집니다. 대부분 [laws|e], 건물, [cabinet_actions|e]을 열 뿐이고, 어떤 정책을 시행할지는 우리와 [parliament|e], [estates|e]에 달려 있습니다.\n\n#T 도시#!\n$BULLET$[ShowAdvanceName('tsin_urban_planning_advance')]: [population_capacity|e] +10%, 도시로의 이주, $tsin_tenement$, [ShowCabinetActionName('tsin_urban_renewal')].\n$BULLET$[ShowAdvanceName('tsin_modern_sewerage_advance')]: [disease_resistance|e], 기대 수명, $tsin_waterworks$, 주택 레벨 +1.\n$BULLET$[ShowAdvanceName('tsin_gas_lighting_advance')]: $tsin_electric_lighting$.\n$BULLET$[ShowAdvanceName('tsin_mass_consumption_advance')]: 가구와 종이 수요 증가, 도시민 만족.\n$BULLET$[ShowAdvanceName('tsin_housing_reform_advance')]: 기대 수명, $tsin_model_dwellings$.\n\n#T 교육#!\n$BULLET$[ShowAdvanceName('tsin_universal_education_advance')]: 최대 [literacy|e] 증가, 문해력 증가 가속, $tsin_public_school$, [ShowLawName('tsin_church_state_law')].\n$BULLET$[ShowAdvanceName('tsin_vocational_education_advance')]: 노동자 문해력, 생산 효율, 실업 과정, 학교 레벨 +1.\n$BULLET$[ShowAdvanceName('tsin_humboldt_university_advance')]: $tsin_research_university$.\n$BULLET$[ShowAdvanceName('tsin_experimental_science_advance')]: 연구 속도, 실험실, [ShowGovernmentReformName('tsin_national_laboratory')].\n$BULLET$[ShowAdvanceName('tsin_engineering_education_advance')]: 생산 효율, 공학 연구소, 종합 과정.\n\n#T 노동과 여론#!\n$BULLET$[ShowAdvanceName('tsin_mass_communication_advance')]: 문해력, 내각 효율, [ShowLawName('tsin_assembly_law')].\n$BULLET$[ShowAdvanceName('tsin_labor_movement_advance')]: [promotion|e] 속도, [ShowLawName('tsin_labor_law')], 평민의 새 특권.\n$BULLET$[ShowAdvanceName('tsin_social_insurance_advance')]: 기대 수명, 평민 만족, [ShowLawName('tsin_welfare_law')].\n\n#T 국민 국가#!\n$BULLET$[ShowAdvanceName('tsin_nation_state_advance')]: 통합 속도.\n$BULLET$[ShowAdvanceName('tsin_mass_politics_advance')]: 정부 개혁 슬롯 +1, [ShowLawName('tsin_trust_law')].\n$BULLET$[ShowAdvanceName('tsin_citizenship_advance')]: 내각 효율.\n$BULLET$[ShowAdvanceName('tsin_popular_press_advance')]: 문화 영향력.\n$BULLET$[ShowAdvanceName('tsin_national_census_advance')]: 세수."
 game_concept_tsin_working_class_events_concept: "사회 이벤트"
 game_concept_tsin_working_class_events_concept_desc: "산업 사회는 고유한 [events|e]을 불러옵니다. 대부분은 플레이버 이벤트로, 나라마다 한 해에 몇 개만 받습니다(기본 3개, 게임 규칙 $rule_tsin_flavor_event_frequency$에서 정함). 대부분은 나라마다 한 번만 나오거나, 나온 뒤 몇 년 동안 쉽니다. 이벤트에서 고른 선택지가 [tsin_movements_concept|e], [tsin_labor_grievance_concept|e], [tsin_labor_conditions_concept|e]을 움직이거나 [tsin_social_modifiers_concept|e]를 줍니다.\n\n#T 사회와 운동#!\n\"인민헌장\"(자유주의 40, 의회 필요), \"파업\"(노동 운동 40), \"공교육법\", \"사회 보험\"(사회주의 30), \"공장의 아이들\"(규제 없는 노동), \"빈민가의 전염병\", \"여성에게 투표권을\"(여성 참정권 50), \"공장 사고\", \"사회주의 독서회\", \"노동절 시위\"(1886년부터), \"국제 노동자 협회\"(세계에서 한 번), \"무정부주의자의 암살\", 패전 뒤의 \"수도의 코뮌\".\n\n#T 도시의 삶#!\n해당 발전 뒤에 한 번씩: \"대악취\", \"도시의 허파\", \"노동자 야학\", \"너무 많이 묻는 국세 조사\", \"종두 반대 폭동\".\n\n#T 모던 타임즈#!\n공장이 있는 나라에서만: \"공장 시계\"(표준시 채택 뒤), \"컨베이어 벨트\", \"급식 기계\", \"신경 쇠약\"(노동 불만 30), \"붉은 깃발\"(사회주의 10), \"감옥이 더 배부르다\"([ShowSituationName('tsin_long_depression')] 중), \"밤의 백화점\", \"떠나는 길\"(노동 불만 50).\n\n#T 시민 생활#!\n새 업그레이드 건물을 둘러싼 이벤트입니다. 연구 대학(개혁, 실험실 폭발, 바리케이드 위의 학생들, 여학생, 국제 학술상), 증기선 항만(정기 기선 항로, 항만 노동자 파업, 이민선), 상하수도(대악취, 펌프 손잡이), 도청(도시 자치 논쟁), 첫 무인 공정.\n\n#T 대기근#!\n농민이 대부분인 나라에서는 병충해가 [disaster|e] [ShowDisasterName('tsin_great_hunger')]을 불러올 수 있습니다. 평민이 불만스러울 때만이며, 굶주리는 지방도 같은 재난을 일으킬 수 있습니다. 그 이벤트들(기근, 이민선, 퇴거와 식량 폭동)은 플레이버 이벤트 한도에 들어가지 않습니다."
 game_concept_tsin_social_modifiers_concept: "사회 보정치"
 game_concept_tsin_social_modifiers_concept_desc: "[tsin_industrial_society_concept|e]의 체계와 이벤트에서 생기는 [modifiers|e]입니다. 이름 위에 마우스를 올리면 효과를 볼 수 있습니다.\n\n#T 체계#!\n$BULLET$교육 단계([tsin_education_ladder_concept|e]): [ShowModifier('tsin_secondary_education_1')]~IV, [ShowModifier('tsin_higher_education_1')]~IV.\n$BULLET$선동([tsin_movements_concept|e]): [ShowModifier('tsin_liberalism_agitation')], [ShowModifier('tsin_nationalism_agitation')], [ShowModifier('tsin_labor_unionism_agitation')], [ShowModifier('tsin_socialism_agitation')], [ShowModifier('tsin_womens_suffrage_agitation')].\n$BULLET$노동 안건([tsin_labor_grievance_concept|e]): [ShowModifier('tsin_factory_inspection_agenda')](10년), [ShowModifier('tsin_ten_hour_day')](영구).\n$BULLET$노예제 폐지: [ShowModifier('tsin_abolitionists_suppressed')], [ShowModifier('tsin_emancipation_shock')], [ShowModifier('tsin_apprenticeship_system')].\n\n#T 사회 이벤트#!\n[ShowModifier('tsin_strike_broken')], [ShowModifier('tsin_state_schools')], [ShowModifier('tsin_sanitary_reform')], [ShowModifier('tsin_quarantine')], [ShowModifier('tsin_anti_anarchist_laws')], 수도에 붙는 [ShowModifier('tsin_bloody_week')] 또는 [ShowModifier('tsin_municipal_commune')].\n\n#T 도시의 삶#!\n[ShowModifier('tsin_intercepting_sewers')], [ShowModifier('tsin_public_parks')], [ShowModifier('tsin_night_schools')], [ShowModifier('tsin_detailed_census')], [ShowModifier('tsin_compulsory_vaccination')], [ShowModifier('tsin_voluntary_vaccination')].\n\n#T 모던 타임즈#!\n[ShowModifier('tsin_sealed_factory_clocks')], [ShowModifier('tsin_stolen_minutes')], [ShowModifier('tsin_assembly_line_speedup')], [ShowModifier('tsin_feeding_machine')], [ShowModifier('tsin_factory_doctors')], [ShowModifier('tsin_poor_relief')], [ShowModifier('tsin_workhouses')], [ShowModifier('tsin_consumer_credit')].\n\n#T 시민 생활#!\n[ShowModifier('tsin_humboldt_reform')], [ShowModifier('tsin_state_curriculum')], [ShowModifier('tsin_laboratory_safety')], [ShowModifier('tsin_laboratory_fear')], [ShowModifier('tsin_women_students')], [ShowModifier('tsin_research_institute')], [ShowModifier('tsin_steamship_line')], [ShowModifier('tsin_dock_strike')], [ShowModifier('tsin_assisted_passage')], [ShowModifier('tsin_emigrant_port')], [ShowModifier('tsin_great_stink')], [ShowModifier('tsin_water_theory')], [ShowModifier('tsin_municipal_self_government')], [ShowModifier('tsin_prefectoral_centralism')], [ShowModifier('tsin_automation_showcase')].\n\n#T 대기근#!\n[ShowModifier('tsin_crop_blight')], [ShowModifier('tsin_famine_relief')], [ShowModifier('tsin_food_exports_continue')], [ShowModifier('tsin_mass_emigration')], [ShowModifier('tsin_agricultural_reform')].\n\n최근의 공장 사고, 무력으로 진압한 파업, 최근의 파업, 사회주의 세포는 보정치가 아니라 [location|e]에 남는 숨은 표시입니다. 사고와 진압된 파업은 $mapmode_tsin_labor_conditions_name$ 지도 모드에서 나빠진 노동 조건으로 보이고, 최근의 파업은 $mapmode_tsin_labor_unrest_name$ 지도 모드에 표시됩니다."
