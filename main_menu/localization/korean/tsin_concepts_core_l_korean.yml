l_korean:
 game_concept_tsin_singularity_concept: "The Singularity is Near"
 game_concept_tsin_singularity_concept_desc: "The Singularity is Near는 게임을 1836년 너머 일곱 번째 [age|e]인 [ShowAgeName('age_7_industrialization')]로 이어 갑니다. 이 시대는 1837년에 시작됩니다. 모드가 없으면 게임은 1836년 마지막 날에 끝나지만, 모드를 켜면 2337년 말까지 계속됩니다. 모드가 더하는 모든 체계에는 각각 항목이 있으며, 이 항목에서 모두 찾아갈 수 있습니다.\n\n1837년에 달라지는 것:\n$BULLET$[tsin_age_of_industry_concept|e]: 고유한 보정치, 팝 수요, 건물 가격을 가진 새 시대입니다.\n$BULLET$[tsin_industrial_institutions_concept|e]: [ShowInstitutionName('tsin_industrial_capitalism')], [ShowInstitutionName('tsin_mass_society')], [ShowInstitutionName('tsin_electrification')]라는 세 가지 새 [institutions|e]가 나타납니다.\n$BULLET$[tsin_age7_advances_concept|e]: 약 160개의 새 [advances|e]이 추가되며, 세 가지 시대 특화를 모두 연구할 수 있습니다.\n$BULLET$[tsin_age7_military_concept|e]: 예비군, 소총, 철갑함을 비롯한 17가지 새 부대 유형이 추가됩니다.\n$BULLET$[tsin_time_compression_concept|e]과 [tsin_population_governor_concept|e]: 한 해에 더 많은 일이 일어나고, 세계 인구는 역사적 곡선에 맞춰 조절됩니다.\n\n모드의 네 분야:\n$BULLET$[tsin_industrial_economy_concept|e]: 산업 재화, 공장, 전력, 자동화, 투자, 농업 혁명을 다룹니다.\n$BULLET$[tsin_industrial_society_concept|e]: 정치 운동, 교육 단계, 노동 조건, 커져 가는 도시의 삶을 다룹니다.\n$BULLET$[tsin_mass_politics_concept|e]: 의회의 법안, 기업, 주가 지수, 추정 GDP를 다룹니다.\n$BULLET$[tsin_industrial_world_concept|e]: 이 시대의 상황, 열강, 조약항을 다룹니다.\n\n처음 할 일:\n$BULLET$시대가 시작될 때 나오는 안내를 읽으십시오. 지금 열린 특화 발전과 나중에 열릴 특화 발전을 알려 줍니다.\n$BULLET$[ShowAdvanceName('tsin_steam_age_advance')]부터 연구하십시오. 모든 나라에 열려 있는 발전 트리 전체의 뿌리입니다.\n$BULLET$$mapmode_tsin_industrial_institutions_name$ 지도 모드를 열어 새 제도가 어디에 나타났는지 확인하고, 되도록 빨리 수용하십시오.\n$BULLET$[ShowAdvanceName('tsin_reserve_system_advance')]를 연구해 [levies|e]이 이웃 나라에 뒤처지지 않게 하십시오.\n$BULLET$산업을 일으키십시오. [ShowAdvanceName('tsin_machine_works_advance')] 발전이 이 시대의 첫 공장을 해금하고, 많은 옛 건물을 업그레이드할 수 있습니다([tsin_replaced_buildings_concept|e]).\n$BULLET$나라의 [modifiers|e]에서 $STATIC_MODIFIER_NAME_tsin_industrial_acceleration_1$와 그 위 단계를 확인하십시오. 산업화로 얼마나 빨라졌는지 보여 줍니다.\n\n함께 보면 좋은 항목: [tsin_age6_continuity_concept|e] 항목은 [ShowAgeName('age_6_revolutions')]의 어떤 콘텐츠가 이어지는지, [tsin_replaced_buildings_concept|e] 항목은 어떤 옛 건물이 새 건물로 바뀌는지, [tsin_flavor_events_concept|e] 항목은 모드의 이벤트를, [tsin_game_rules_concept|e] 항목은 새 게임을 시작할 때 고를 수 있는 선택지를 설명합니다. 이 시대에는 새 [works_of_art|e]($tsin_romantic_painting$, $tsin_photograph$, $tsin_opera$, $tsin_realist_novel$, [tsin_culture_science_concept|e] 항목 참고)과 세 가지 [expeditions|e]($tsin_source_of_the_nile_expedition$, $tsin_northwest_passage_expedition$, $tsin_polar_expedition$, [tsin_expeditions_concept|e] 항목 참고)도 있습니다. [tsin_map_modes_concept|e] 항목과 [tsin_hints_concept|e] 항목도 길잡이가 됩니다."

 game_concept_tsin_age_of_industry_concept: "산업 시대"
 game_concept_tsin_age_of_industry_concept_desc: "[ShowAgeName('age_7_industrialization')]는 일곱 번째이자 마지막 [age|e]입니다. [ShowAgeName('age_6_revolutions')] 바로 다음인 1837년에 시작되며, 뒤따르는 시대가 없어 게임은 2337년 12월 31일까지 이 시대에 머뭅니다. 역사적 콘텐츠는 대부분 1837년부터 1900년 사이에 일어나며, 그 뒤에도 이 시대의 체계는 계속 돌아갑니다.\n\n혁명 시대와 비교하면 이 시대에는:\n$BULLET$변화가 빨라집니다. 연구와 건설 +10%, 팝 [promotion|e] +20%, [migration|e] +25%, 제도 확산 +20%이며 인구도 조금 더 빨리 늘어납니다([tsin_time_compression_concept|e] 항목 참고).\n$BULLET$기대 군대 규모가 두 배가 되고 [mercenaries|e]이 더 귀해집니다.\n$BULLET$[goods|e] 가격이 상한에 이르기 전까지 더 높이 오를 수 있습니다.\n$BULLET$탐험 정보가 더 빨리 퍼지고, 도시민이 더 먼 곳까지 교역합니다.\n$BULLET$[subject_loyalty|e]가 낮아지고, 문화와 [societal_values|e]이 다를 때 생기는 [antagonism|e]이 커집니다.\n$BULLET$팝 수요가 바뀝니다. 설탕, 차, 커피 수요가 늘고 술 수요는 이전보다 조금 줄며, 석탄, 직물, 유리 수요가 새로 생깁니다.\n$BULLET$$p_building_age_7_industrialization$, $p_expensive_building_age_7_industrialization$이라는 고유한 건물 가격 분류가 있습니다.\n\n[hegemons|e]와 [victory_cards|e]는 이전 시대처럼 이어지며, 철도를 놓는 데에는 이제 석탄과 공구도 듭니다.\n\n시대가 시작되면 평소의 시대 이벤트에서 특화를 고릅니다. 모드는 안내 두 개를 더합니다. 하나는 새 [institutions|e]를 소개하고([tsin_industrial_institutions_concept|e]), 다른 하나는 어떤 특화 발전이 열려 있는지 설명합니다([tsin_age7_advances_concept|e]). 이미 이 시대에 들어선 저장 파일에 모드를 추가하면, 1년 안에 모드가 조용히 스스로를 준비합니다."

 game_concept_tsin_industrial_institutions_concept: "산업 시대의 제도"
 game_concept_tsin_industrial_institutions_concept_desc: "[ShowAgeName('age_7_industrialization')]에는 고유한 [institutions|e] 세 가지가 있습니다. 바닐라 제도처럼 한 [location|e]에서 나타나 이웃, 교역, [markets|e]을 따라 지도 위로 퍼지며, 나라 인구의 충분한 몫이 그 제도가 있는 곳에 살면 수용할 수 있습니다. 제도를 수용하면 그 제도의 [advances|e] 갈래와 모드의 많은 콘텐츠가 열리고, 산업 가속 점수 1점을 얻습니다([tsin_time_compression_concept|e]).\n\n[ShowInstitutionName('tsin_industrial_capitalism')]는 1840년부터 나타날 수 있습니다. [ShowInstitutionName('industrialization')]가 이미 있고, 직물·제철·제강 공장이 있으며, [ShowPopTypeName('laborers')]가 20명보다 많고 건물 레벨이 150을 넘는 지점 가운데, 소유국이 [ShowSocietyDirectionName('capital_economy')] 쪽으로 기운 곳에서 나타납니다. 발상지는 생산 효율과 건설 효율을 얻습니다. 수용하면 [ShowAdvanceName('tsin_industrial_capitalism_advance')] 발전이 열려 $tsin_industrial_investment_law$ 법률과 $tsin_encourage_industry$ 내각 행동을 얻습니다. 또한 외교 특화 발전이 열리고, $tsin_customs_union$을 세울 수 있으며, [ShowSituationName('tsin_long_depression')]과 (왕국과 제국이라면) [ShowSituationName('tsin_scramble_for_colonies')]에 휘말립니다.\n\n[ShowInstitutionName('tsin_mass_society')]는 1845년부터 나타날 수 있습니다. [ShowInstitutionName('enlightenment')]이 이미 있고, 문해력이 40을 넘으며 노동자가 30명보다 많은 도시에서 나타납니다. 발상지는 최대 문해력과 승격 속도를 얻습니다. 수용하면 [ShowAdvanceName('tsin_mass_society_advance')] 발전이 열려 $tsin_taxation_law$, $tsin_land_reform_law$ 법률을 얻습니다. 또한 행정 특화 발전이 열리고, [tsin_education_ladder_concept|e]가 시작되며, [tsin_movements_concept|e]이 더 빨리 자라고, 의회가 있는 나라에서는 정책 변경이 [tsin_bills_concept|e]을 거치게 됩니다.\n\n[ShowInstitutionName('tsin_electrification')]는 1870년부터 나타날 수 있습니다. [ShowInstitutionName('tsin_industrial_capitalism')]와 대학이 있고, 문해력이 50을 넘으며 건물 레벨이 200을 넘는 지점 가운데, 소유국이 [ShowSocietyDirectionName('innovative')] 쪽으로 기울어 있고 [ShowAdvanceName('tsin_machine_tools_advance')] 발전을 연구한 곳에서 나타납니다. 발상지는 건설 효율이 크게 오르고 번영이 늘어납니다. 수용하면 [ShowAdvanceName('tsin_electrification_advance')] 발전(생산 효율, 건물 유지비 절감)과 군사 특화 발전이 열립니다. [tsin_electric_power_concept|e] 항목도 참고하십시오.\n\n바닐라의 제도 출현 게임 규칙도 그대로 적용됩니다. 역사 반영이면 세 제도가 [ShowLocationName('manchester')], [ShowLocationName('paris')], [ShowLocationName('berlin')]에서 나타나고(베를린은 1875년 이후), 무작위 도시면 앞선 제도가 이미 있는 무작위 도시에서 나타납니다. 게임 규칙 $rule_tsin_electrification_timing$ 규칙으로 1870년 제한을 풀 수 있습니다([tsin_game_rules_concept|e]).\n\n각 제도가 나타나면 안내가 뜹니다. $mapmode_tsin_industrial_institutions_name$ 지도 모드는 각 지점을 그곳에 있는 세 제도 가운데 가장 발전한 제도에 따라 색칠합니다. 제도가 우리나라에 늦게 퍼진다면 바닐라처럼 [ShowCabinetActionName('study_institutions')]가 도움이 됩니다."

 game_concept_tsin_age7_advances_concept: "산업 시대의 발전"
 game_concept_tsin_age7_advances_concept_desc: "[ShowAgeName('age_7_industrialization')]에는 약 160개의 [advances|e]으로 이루어진 고유한 트리가 있으며, 바닐라 발전처럼 연구합니다. 뒤따르는 시대가 없으므로 게임의 마지막 트리입니다.\n\n트리는 바닐라와 같은 방식으로 짜여 있습니다.\n$BULLET$무료 트리는 [ShowAdvanceName('tsin_steam_age_advance')]에서 시작하며, 1837년부터 모든 나라에 열려 있습니다. 행정, 건설, 의학, 외교의 일반 발전, 첫 공장과 업그레이드 해금, 농업 혁명의 시작, 요새·보급 한도, 군사 트리가 여기에 있습니다.\n$BULLET$시대의 각 [institution|e]에는 갈래가 있으며, 그 뿌리는 제도를 수용해야 연구할 수 있습니다. [ShowAdvanceName('tsin_industrial_capitalism_advance')](강철, 공작 기계, 철도, 화학, 금융, 자동화), [ShowAdvanceName('tsin_mass_society_advance')](도시, 위생, 학교와 대학, 노동, 대중 정치), [ShowAdvanceName('tsin_electrification_advance')](발전소, 전동기, 전신과 전화, 내연 기관)입니다. [tsin_industrial_institutions_concept|e] 항목을 참고하십시오.\n$BULLET$행정, 외교, 군사 특화 발전이 10개씩 모두 30개 있습니다. 이전 시대와 달리 세 묶음을 모두 연구할 수 있습니다. 시대가 시작될 때 고른 특화는 바로 열리고, 나머지는 짝이 되는 제도를 수용하면 열립니다(행정은 [ShowInstitutionName('tsin_mass_society')], 외교는 [ShowInstitutionName('tsin_industrial_capitalism')], 군사는 [ShowInstitutionName('tsin_electrification')]). 시대가 시작될 때 안내에서도 알려 줍니다.\n$BULLET$정부 유형 발전 4개(군주정, 공화정, 신정, 유목 국가)와 종교 발전 13개가 있으며, 해당 정부 유형이나 종교의 나라에만 보입니다.\n\n군사 발전과 새 부대는 시대 특화와 관계없이 모든 나라가 연구할 수 있습니다([tsin_age7_military_concept|e]).\n\n속사포, 전노급 전함, 질소 고정 같은 늦은 발명에는 연도 조건이 없습니다. 대신 긴 선행 사슬 뒤에 있고 다른 갈래의 강철이나 전기 발전을 요구하므로 자연히 늦게 나오며, 여러 제도를 수용해야 하는 것도 많습니다. 앞선 나라도 1900년까지 트리를 다 열지는 못하는 것이 정상입니다. 이 시대에는 연구가 빨라지고, 산업화한 나라는 더 빨라집니다([tsin_time_compression_concept|e])."

 game_concept_tsin_age7_military_concept: "산업 시대의 전쟁"
 game_concept_tsin_age7_military_concept_desc: "[ShowAgeName('age_7_industrialization')]의 군대는 철도로 모이고 공장에서 무장합니다. 이 시대에는 기대 군대 규모가 두 배가 되고 [mercenaries|e]이 귀해지며, 29개 [advances|e]의 군사 트리와 17가지 새 [unit_types|e]이 추가됩니다. 군사 발전은 시대 특화와 관계없이 모든 나라가 연구할 수 있습니다.\n\n트리는 [ShowAdvanceName('tsin_steam_age_advance')] 바로 다음인 [ShowAdvanceName('tsin_reserve_system_advance')]에서 시작합니다. 이 발전은 새 [levies|e] 두 가지를 해금합니다. 징집군은 언제나 쓸 수 있는 가장 강한 유형을 쓰므로 이전 시대의 징집군을 대신합니다.\n$BULLET$[ShowUnitDefinitionName('a_tsin_reservists')]: [ShowPopTypeName('peasants')], [ShowPopTypeName('laborers')], [ShowPopTypeName('soldiers')], [ShowPopTypeName('burghers')]에게서 징집하는 보병입니다.\n$BULLET$[ShowUnitDefinitionName('a_tsin_mounted_constabulary')]: [ShowPopTypeName('nobles')]에게서 징집하는 기병이며, 병력 피해를 25% 덜 받습니다.\n\n육군 부대(괄호 안은 해금 발전):\n$BULLET$[ShowUnitDefinitionName('a_tsin_line_riflemen')]([ShowAdvanceName('tsin_percussion_cap_advance')]): 군대의 중심인 중보병입니다.\n$BULLET$[ShowUnitDefinitionName('a_tsin_rifle_skirmishers')]([ShowAdvanceName('tsin_rifling_advance')]): 주도권과 측면 공격이 좋은 경보병입니다.\n$BULLET$[ShowUnitDefinitionName('a_tsin_breech_loading_battery')]([ShowAdvanceName('tsin_breech_loading_artillery_advance')]): 포격이 더 강한 포병이며, 강철과 폭약 포탄을 씁니다.\n$BULLET$[ShowUnitDefinitionName('a_tsin_mounted_rifles')]([ShowAdvanceName('tsin_repeating_rifle_advance')]): 빠른 경기병입니다.\n$BULLET$[ShowUnitDefinitionName('a_tsin_lancers')]([ShowAdvanceName('tsin_lancers_advance')]): 중기병입니다.\n$BULLET$[ShowUnitDefinitionName('a_tsin_railway_supply_corps')]([ShowAdvanceName('tsin_railway_supply_corps_advance')]): 기관이 필요하고 석탄을 때는 지원 부대입니다.\n$BULLET$[ShowUnitDefinitionName('a_tsin_machine_gun_detachment')]([ShowAdvanceName('tsin_maxim_gun_advance')]): 다른 지원 부대보다 전투력이 훨씬 높은 지원 부대입니다.\n$BULLET$[ShowUnitDefinitionName('a_tsin_bolt_action_infantry')]([ShowAdvanceName('tsin_smokeless_powder_advance')]): 폭약을 쓰는 후기 중보병입니다.\n$BULLET$[ShowUnitDefinitionName('a_tsin_jaegers')]([ShowAdvanceName('tsin_jaeger_advance')]): 후기 정예 경보병입니다.\n$BULLET$[ShowUnitDefinitionName('a_tsin_quick_firing_battery')]([ShowAdvanceName('tsin_quick_firing_artillery_advance')]): 이 시대에서 가장 강한 포병입니다.\n\n함선:\n$BULLET$[ShowUnitDefinitionName('n_tsin_ironclad')]([ShowAdvanceName('tsin_ironclad_advance')]): 석탄을 때는 증기 장갑 중함입니다.\n$BULLET$[ShowUnitDefinitionName('n_tsin_monitor')]([ShowAdvanceName('tsin_monitor_advance')]): 갤리 분류의 느린 포탑함으로, 연안에서 강합니다.\n$BULLET$[ShowUnitDefinitionName('n_tsin_torpedo_boat')]([ShowAdvanceName('tsin_torpedo_advance')]): 폭약을 쓰는 빠른 경함입니다.\n$BULLET$[ShowUnitDefinitionName('n_tsin_steam_transport')]([ShowAdvanceName('tsin_steam_transport_advance')]): 석탄을 때는 수송선입니다.\n$BULLET$[ShowUnitDefinitionName('n_tsin_protected_cruiser')]([ShowAdvanceName('tsin_protected_cruiser_advance')]): 선체가 큰 빠른 경함입니다.\n$BULLET$[ShowUnitDefinitionName('n_tsin_destroyer')]([ShowAdvanceName('tsin_destroyer_advance')]): 가장 빠른 경함입니다.\n$BULLET$[ShowUnitDefinitionName('n_tsin_pre_dreadnought')]([ShowAdvanceName('tsin_pre_dreadnought_advance')]): 이 시대에서 가장 강한 중함이며, 건조에 전력이 듭니다.\n\n후기 부대는 [ShowInstitutionName('tsin_industrial_capitalism')] 갈래의 제강과 다이너마이트 발전도 요구하므로 시대 후반에 나옵니다. 나머지 군사 발전은 전술, 규율, 인력, 공성과 강습, 철도 이동과 모집, 해군 사기, 해상 수리, 사상자를 개선합니다.\n\n근대 부대는 산업 [goods|e]에 대한 [goods_demand|e]를 만듭니다. [ShowGoodsName('steel')], [ShowGoodsName('tsin_engines')], [ShowGoodsName('tsin_explosives')], [ShowGoodsName('coal')], 그리고 전노급 전함에는 [ShowGoodsName('tsin_electricity')]이 듭니다. 강철과 기관 산업이 없는 나라는 [market|e]에서 사들여야 합니다. 새 부대를 연구하기 전까지는 이전 시대의 부대를 계속 쓸 수 있습니다."

 game_concept_tsin_age6_continuity_concept: "혁명 시대의 유산"
 game_concept_tsin_age6_continuity_concept_desc: "바닐라 콘텐츠 가운데 상당수는 기본 게임의 마지막 시대인 [ShowAgeName('age_6_revolutions')]를 위해 쓰여 있어, 그 뒤의 시대에서는 꺼지게 되어 있습니다. 모드는 이런 콘텐츠를 [ShowAgeName('age_7_industrialization')]에도 계속 돌아가게 합니다.\n$BULLET$[casus_belli|e]: [ShowCasusBelliName('cb_imperialism')], [ShowCasusBelliName('cb_nationalist')]\n$BULLET$[disasters|e]: [ShowDisasterName('revolution_disaster')], [ShowDisasterName('revolutionary_chaos')], [ShowDisasterName('aspiration_for_liberty')], [ShowDisasterName('court_and_country')], [ShowDisasterName('decline_of_empire')]\n$BULLET$[situations|e]: [ShowSituationName('the_revolution')], [ShowSituationName('colonial_revolution')]. 1837년 전에 시작된 혁명은 계속 이어집니다.\n$BULLET$시대에 따라 정책이 바뀌는 [laws|e]: [ShowLawName('recruitment_law')], [ShowLawName('battle_leadership_law')], [ShowLawName('distribution_of_power_law')], [ShowLawName('legitimization_of_power_law')], [ShowLawName('royal_court_customs_law')] 등. 혁명 시대의 정책을 계속 고를 수 있습니다.\n$BULLET$계층의 [parliament_issues|e]와 [parliament_agendas|e]: $grant_city_rights$, 건물을 확장하는 쟁점 등\n$BULLET$혁명 시대 이후를 요구하는 [decisions|e], [ShowFormableCountryName('GER_f')]와 [ShowFormableCountryName('ITA_f')] 같은 [formable_countries|e], 강화 조건\n$BULLET$교향곡 같은 [works_of_art|e], 사회 가치관과 의회에 관한 이벤트, 후기 초상화와 문장\n$BULLET$[hegemons|e]와 [victory_cards|e]\n\n중세 의회 쟁점처럼 이른 시대 전용 콘텐츠는 계속 꺼져 있습니다. 혁명 시대의 부대는 후속 부대를 연구할 때까지 그대로 쓸 수 있고([tsin_age7_military_concept|e]), 옛 건물은 업그레이드할 수 있습니다([tsin_replaced_buildings_concept|e]).\n\n모드는 해당 바닐라 객체를 하나씩 다시 정의하는 방식으로 이를 처리합니다. 다른 모드가 같은 객체를 바꾸면 나중에 불러온 쪽이 적용됩니다. 다른 모드가 적용되면 그 객체는 바닐라처럼 동작해 1837년에 꺼질 수 있습니다."

 game_concept_tsin_replaced_buildings_concept: "대체되는 건물"
 game_concept_tsin_replaced_buildings_concept_desc: "[ShowAgeName('age_7_industrialization')]의 건물 가운데 몇몇은 옛 [buildings|e]을 대신합니다. 이 항목은 각 건물을 어떤 발전이 해금하는지, 바닐라 콘텐츠가 그 건물을 어떻게 다루는지 정리합니다. 새 건물이 무엇을 생산하는지는 [tsin_building_upgrades_concept|e] 항목에서 설명합니다. 해금 [advance|e]을 연구하면 옛 건물을 그 자리에서 업그레이드할 수 있고, 새 건물이 그 [location|e]에서 옛 건물을 대신합니다. 업그레이드할 수 있는 건물은 바닐라의 건물 업그레이드 알림에 나옵니다.\n$BULLET$[ShowBuildingTypeName('university')] → [ShowBuildingTypeName('tsin_research_university')]([ShowAdvanceName('tsin_humboldt_university_advance')])\n$BULLET$[ShowBuildingTypeName('naval_base')] → [ShowBuildingTypeName('tsin_steam_port')]([ShowAdvanceName('tsin_steam_merchant_marine_advance')])\n$BULLET$[ShowBuildingTypeName('aqueduct_system')] → [ShowBuildingTypeName('tsin_waterworks')]([ShowAdvanceName('tsin_modern_sewerage_advance')])\n$BULLET$[ShowBuildingTypeName('provincial_chancery')] → [ShowBuildingTypeName('tsin_prefecture')]([ShowAdvanceName('tsin_professional_bureaucracy_advance')])\n$BULLET$[ShowBuildingTypeName('textile_mill')] → [ShowBuildingTypeName('tsin_mechanized_textile_mill')]([ShowAdvanceName('tsin_mechanized_textile_mill_advance')])\n$BULLET$[ShowBuildingTypeName('lumber_mill')] → [ShowBuildingTypeName('tsin_steam_sawmill')]([ShowAdvanceName('tsin_steam_sawmill_advance')])\n$BULLET$[ShowBuildingTypeName('iron_mill')] → [ShowBuildingTypeName('tsin_automated_iron_mill')], [ShowBuildingTypeName('furniture_mill')] → [ShowBuildingTypeName('tsin_automated_furniture_mill')]([ShowAdvanceName('tsin_interchangeable_parts_advance')])\n$BULLET$[ShowBuildingTypeName('glass_mill')] → [ShowBuildingTypeName('tsin_automated_glass_mill')], [ShowBuildingTypeName('paper_mill')] → [ShowBuildingTypeName('tsin_automated_paper_mill')]([ShowAdvanceName('tsin_continuous_process_advance')])\n$BULLET$[ShowBuildingTypeName('printing_mill')] → [ShowBuildingTypeName('tsin_automated_printing_mill')]([ShowAdvanceName('tsin_rotary_press_advance')])\n$BULLET$[ShowBuildingTypeName('fine_cloth_mill')] → [ShowBuildingTypeName('tsin_automated_fine_cloth_mill')]([ShowAdvanceName('tsin_power_jacquard_advance')])\n\n모드의 건물 세 가지도 같은 방식으로 업그레이드됩니다. [ShowBuildingTypeName('tsin_tenement')] → [ShowBuildingTypeName('tsin_model_dwellings')], [ShowBuildingTypeName('tsin_fertilized_fields')] → [ShowBuildingTypeName('tsin_mechanized_farm')], [ShowBuildingTypeName('tsin_fertilizer_plant')] → [ShowBuildingTypeName('tsin_nitrogen_fixation_plant')]입니다. 자동화 공장은 [tsin_automation_concept|e] 항목에서 설명합니다.\n\n업그레이드해도 다른 곳에서 손해를 보지 않습니다. 옛 건물을 묻는 바닐라 조건은 업그레이드된 건물도 인정합니다. 항만 시설과 그것이 필요한 함선, [ShowLawName('education_elites_law')] 법률, [ShowEstatePrivilegeName('clergy_lecture_oaths')] 특권, 대학 후원과 항구 확장 의회 쟁점, 진보와 문해력 임무, 몇몇 종교 수도회와 마을 권리가 여기에 해당합니다. 일부 바닐라 이벤트는 여전히 옛 건물만 찾아 업그레이드된 지점을 건너뛰는데, 그 몫은 연구 대학, 증기선 항만, 상하수도, 도청, 자동화 공장에 관한 새 이벤트가 채웁니다([tsin_flavor_events_concept|e])."

 game_concept_tsin_game_rules_concept: "산업 시대 게임 규칙"
 game_concept_tsin_game_rules_concept_desc: "모드는 게임 규칙 여섯 가지를 더하며, 새 게임을 시작할 때 게임 규칙 화면에서 고릅니다. 보통의 게임에는 기본값이 알맞습니다.\n$BULLET$$rule_tsin_flavor_event_frequency$: $setting_tsin_flavor_events_normal$(기본, 나라마다 1년에 플레이버 이벤트 최대 3개), $setting_tsin_flavor_events_low$(1개), $setting_tsin_flavor_events_high$(5개), $setting_tsin_flavor_events_off$(0개). [tsin_flavor_events_concept|e] 항목을 참고하십시오.\n$BULLET$$rule_tsin_electrification_timing$: $setting_tsin_electrification_historical$(기본, [ShowInstitutionName('tsin_electrification')]는 1870년 전에, 역사 반영 출현이면 베를린에서 1875년 전에 나타나지 않음) 또는 $setting_tsin_electrification_free$(날짜 제한 없이 조건을 갖춘 지점이 생기면 바로 나타남). [tsin_industrial_institutions_concept|e] 항목을 참고하십시오.\n$BULLET$$rule_tsin_population_governor$: $setting_tsin_population_governor_on$(기본) 또는 $setting_tsin_population_governor_off$. 끄면 [tsin_population_governor_concept|e]의 제동이 사라집니다. 시험용이며 인구가 비현실적으로 늘어날 수 있습니다.\n$BULLET$$rule_tsin_bill_system$: $setting_tsin_bill_system_on$(기본) 또는 $setting_tsin_bill_system_off$. 끄면 정책이 [tsin_bills_concept|e]을 거치지 않고 바닐라처럼 바로 바뀝니다.\n$BULLET$$rule_tsin_economy_log$: $setting_tsin_economy_log_off$(기본) 또는 $setting_tsin_economy_log_on$. 켜면 1년에 한 번 플레이어, 열강, 주식시장이 있는 나라의 [tsin_estimated_gdp_concept|e]와 경제 지표를 게임 로그에 남깁니다.\n$BULLET$$rule_tsin_observer_log$: $setting_tsin_observer_log_off$(기본) 또는 $setting_tsin_observer_log_on$. 켜면 1년에 한 번 세계 통계를 게임 로그에 남깁니다. 밸런스 시험 전용입니다.\n\n바닐라의 제도 출현 규칙도 세 가지 새 제도가 나타날 곳을 정합니다. 이름이 TSIN DEBUG로 시작하는 결단은 개발용 도구이며 디버그 모드에서만 보입니다."

 game_concept_tsin_time_compression_concept: "시간 압축"
 game_concept_tsin_time_compression_concept_desc: "하루의 길이는 그대로지만, [ShowAgeName('age_7_industrialization')]에는 같은 1년 동안 훨씬 많은 일이 일어납니다. 시대 자체가 연구와 건설을 10%, 팝 [promotion|e]을 20%, [migration|e]를 25%, 제도 확산을 20% 빠르게 합니다.\n\n산업화하는 나라는 더 빨라집니다. 나라마다 1년에 한 번 산업 가속 점수를 셉니다.\n$BULLET$수용한 이 시대의 [institution|e] 하나마다 1점([tsin_industrial_institutions_concept|e])\n$BULLET$공장 일자리가 인구의 8% 이상이면 1점, 20% 이상이면 1점 더\n$BULLET$[decision|e] [ShowDecisionName('tsin_standard_time_decision')]을 내리면 1점. 이 결단은 [ShowAdvanceName('tsin_railway_network_advance')] 발전과 함께 보이며, [ShowAdvanceName('tsin_telegraph_telephone_advance')] 발전, [ShowBuildingTypeName('tsin_railway_station')]이 있는 지점 3곳, 중등교육률 10 이상이 필요합니다.\n\n2점, 3점, 5점이 되면 다음 보정치를 받습니다.\n$BULLET$$STATIC_MODIFIER_NAME_tsin_industrial_acceleration_1$: 연구와 건설 +5%, 승격 +10%\n$BULLET$$STATIC_MODIFIER_NAME_tsin_industrial_acceleration_2$: 연구와 건설 +10%, 승격 +20%, [production_efficiency|e] +3%\n$BULLET$$STATIC_MODIFIER_NAME_tsin_industrial_acceleration_3$: 연구와 건설 +15%, 승격 +30%, 생산 효율 +5%\n\n2단계 이상인 나라는 [tsin_population_governor_concept|e]가 세계에 제동을 걸지 않는 동안 $STATIC_MODIFIER_NAME_tsin_industrial_population_boom$도 받아 [population_growth|e]이 조금 늘어납니다. 단계는 해마다 다시 계산되며, 나라의 [modifiers|e]에서 확인할 수 있습니다."

 game_concept_tsin_population_governor_concept: "인구 조절기"
 game_concept_tsin_population_governor_concept_desc: "빨라진 산업 세계가 비현실적인 크기로 불어나지 않도록, 1년에 한 번 세계 인구를 역사적 목표와 견줍니다. 기준은 [ShowAgeName('age_7_industrialization')]가 시작될 때의 세계 인구입니다. 목표는 1900년에 그 1.6배, 1950년에 2.4배, 2000년에 5.5배이며, 2100년 이후에도 7배를 넘지 않습니다.\n\n세계 인구가 목표를 넘으면 조절기가 제동을 겁니다.\n$BULLET$$STATIC_MODIFIER_NAME_tsin_population_brake_1$(목표 이상), $STATIC_MODIFIER_NAME_tsin_population_brake_2$(목표보다 10% 이상 많음): [population_growth|e]이 줄고 [food_consumption|e]이 늘며, (중) 단계는 [population_capacity|e]도 줄입니다. 지난 1년 동안 인구가 1%보다 많이 늘어난 나라에만 걸립니다.\n$BULLET$$STATIC_MODIFIER_NAME_tsin_population_brake_3$(목표보다 25% 이상 많거나 기준의 7배): 모든 나라에 걸리는 더 강한 제동입니다.\n\n나라마다 따로 작동하는 한도도 두 가지 있습니다.\n$BULLET$$STATIC_MODIFIER_NAME_tsin_population_pressure$: 한 해에 인구가 3%보다 많이 늘어난 나라는 다음 1년 동안 인구가 더디게 늘고 이주민을 더 많이 내보냅니다.\n$BULLET$$STATIC_MODIFIER_NAME_tsin_demographic_transition_1$, $STATIC_MODIFIER_NAME_tsin_demographic_transition_2$: 문해력이 높고 도시화된 나라는 출생이 줄어듭니다. 앞의 것은 평균 [literacy|e] 50과 인구의 4분의 1이 마을과 도시에 살 것을, 뒤의 것은 문해력 75와 40%를 요구합니다.\n\n[ShowDisasterName('tsin_cholera')]과 [ShowSituationName('tsin_great_migration')]도 인구 압력을 덜어 줍니다. 조절기는 게임 규칙 $rule_tsin_population_governor$로 끌 수 있습니다([tsin_game_rules_concept|e])."
