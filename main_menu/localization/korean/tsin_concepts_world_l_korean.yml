l_korean:
 game_concept_tsin_industrial_world_concept: "산업 시대의 세계"
 game_concept_tsin_industrial_world_concept_desc: "[ShowAgeName('age_7_industrialization')] 시대는 공장만의 시대가 아닙니다. 금융 위기, 혁명, 민족 통일, 식민 제국, 전염병, 대규모 이주가 세계를 바꿉니다. 이 콘텐츠는 국가 태그에 묶여 있지 않습니다. 모든 [situation|e], [disaster|e], 이벤트는 [country|e]의 상태(제도, 운동, 인구, 항구, 공장)를 보므로, 그 상태에 이른 나라라면 어디서든 일어날 수 있습니다.\n\n#T 상황과 재난#!\n$BULLET$[tsin_industrial_age_situations|e]: 여러 나라가 한꺼번에 얽히는 [situations|e] 8가지.\n$BULLET$[tsin_industrial_disasters_concept|e]: 한 나라를 덮치는 [disasters|e] 4가지.\n\n#T 목표와 외교#!\n$BULLET$[tsin_industrial_missions_concept|e]: 산업화하는 나라와 근대화하는 나라를 위한 [mission|e] 묶음 2가지.\n$BULLET$[tsin_expeditions_concept|e]: 나일강의 수원, 북서항로, 북극점.\n$BULLET$[tsin_great_power_politics_concept|e]: 열강 회의, 제네바 협약, 해군 군비 경쟁, 이중 제국.\n$BULLET$[tsin_treaty_port_concept|e]: 뒤처진 나라에 항구를 열게 하는 [peace_treaty|e] 조건.\n\n#T 사회와 문화#!\n$BULLET$[tsin_frontier_concept|e]: 골드러시와 자영농 개척지.\n$BULLET$[tsin_culture_science_concept|e]: 새 예술품, 발명, 과학, 운하.\n$BULLET$[tsin_late_century_concept|e]: 무정부주의자, 제1인터내셔널, 코뮌.\n$BULLET$[tsin_flavor_events_concept|e]: 모드 이벤트의 갈래와 빈도.\n\n#T 길잡이#!\n$BULLET$[tsin_map_modes_concept|e]: 새 지도 모드가 보여 주는 것.\n$BULLET$[tsin_hints_concept|e]: 주의가 필요할 때 나타나는 힌트.\n\n이전 시대의 콘텐츠도 꺼지지 않습니다. [ShowSituationName('the_revolution')], [ShowSituationName('colonial_revolution')], 혁명 [disasters|e], 제국주의·민족주의 [casus_belli|e], [formable|e] 국가는 모두 이 시대에도 그대로 이용할 수 있습니다."

 game_concept_tsin_treaty_port_concept: "조약항"
 game_concept_tsin_treaty_port_concept_desc: "조약항은 패전한 [country|e]가 승전국의 교역에 열어야 하는 항구입니다. [ShowAgeName('age_7_industrialization')] 시대의 [peace_treaty|e] 조건 [ShowPeaceTreatyTypeName('tsin_open_treaty_port')]으로 요구하며, 패전국보다 연구한 [advances|e]이 많은 승전국만 쓸 수 있습니다.\n\n승전국은 패전국의 항구 [location|e] 가운데 [capital|e]가 아니고, 농촌 정착지가 아니며, 이미 조약항이 아닌 곳 하나를 고릅니다. 값진 항구일수록 전쟁 점수가 더 들고, [antagonism|e]을 일으킵니다. 30년 동안:\n$BULLET$그 항구는 [ShowModifier('tsin_treaty_port')]을 받습니다. [market_access|e]과 [migration_attraction|e]가 오르지만, [control|e]가 낮아지고 [unrest|e]가 커집니다.\n$BULLET$패전국은 [ShowModifier('tsin_unequal_treaty')]을 받습니다.\n$BULLET$승전국은 [ShowModifier('tsin_treaty_port_concessions')]을 얻습니다.\n\n항구를 강제로 연 나라는 개항 압력을 받습니다. 이 압력은 [tsin_defensive_modernization_concept|e]를 일으키고, 마지막 과업에서 불평등 조약을 개정하는 [ShowMissionName('tsin_modernization')] [mission|e]를 열며, [tsin_millenarian_rebellion_concept|e]의 압박 요인이 됩니다. 항구의 포함 이벤트에서 협상으로 항구를 열어도 같은 압력을 받습니다."

 game_concept_tsin_industrial_age_situations: "산업 시대의 상황"
 game_concept_tsin_industrial_age_situations_desc: "[ShowAgeName('age_7_industrialization')] 시대에는 [situations|e] 8가지가 있습니다. 정해진 날짜가 아니라 세계가 어떤 상태에 이르면 시작합니다. 7가지는 한 판에 한 번만 일어나고, 만국박람회는 여러 번 열릴 수 있습니다. 상황이 진행되는 동안 상황 화면과 상황 지도 모드가 참여국을 보여 주고, 힌트가 할 일을 알려 줍니다.\n$BULLET$[tsin_defensive_modernization_concept|e]: 1840년부터, 항구를 강제로 연 나라들이 근대화를 시도합니다.\n$BULLET$[tsin_great_migration_concept|e]: 1845년부터, 과밀하고 굶주린 나라가 아메리카와 오세아니아로 이민을 보냅니다.\n$BULLET$[tsin_national_unification_concept|e]: 1848년부터, 나뉜 문화군에서 가장 큰 나라가 통일을 이끕니다.\n$BULLET$[tsin_springtime_of_nations_concept|e]: 자유주의·민족주의·사회주의 운동이 강한 나라에 혁명의 물결이 일어납니다.\n$BULLET$[tsin_world_exhibition_concept|e]: 기술 선두국이 [decision|e]으로 박람회를 열고, 다른 나라가 그로부터 배웁니다.\n$BULLET$[tsin_long_depression_concept|e]: 1865년부터, 산업국에 금융 공황과 불황이 닥칩니다.\n$BULLET$[tsin_scramble_for_colonies_concept|e]: 1870년부터, 산업 열강이 남은 땅을 두고 경쟁합니다.\n$BULLET$[tsin_grain_invasion_concept|e]: 1873년부터, 값싼 해외 곡물이 오래된 농업국을 무너뜨립니다."

 game_concept_tsin_long_depression_concept: "대불황"
 game_concept_tsin_long_depression_concept_desc: "[ShowSituationName('tsin_long_depression')]은 산업국 전체를 덮치는 경제 위기입니다. [ShowInstitutionName('tsin_industrial_capitalism')]를 수용한 나라가 6곳 이상이면 1865년부터(최근 주식 시장이 폭락했다면 1850년부터, [tsin_stock_index_concept|e] 참고) 시작할 수 있습니다. 한 판에 한 번 일어납니다.\n\n#T 단계#!\n$BULLET$그 [institution|e]를 수용한 모든 나라가 참여합니다. 처음 2년은 공황입니다: [ShowModifier('tsin_depression_panic')]. 금본위제를 쓰는 나라는 5년 동안 [ShowModifier('tsin_gold_standard_deflation')]도 받습니다. 시작할 때 은행 구제, 방치, 화폐 발행 가운데 하나를 고릅니다.\n$BULLET$2년이 지나면 공황은 불황으로 바뀝니다: [ShowModifier('tsin_depression_slump')].\n$BULLET$매달 은행 도산이 일어날 수 있습니다. 불황 중에는 회복 정책 이벤트로 먼저 빠져나올 수 있습니다. 관세를 올리거나 공공사업에 돈을 쓰면 불황이 사라지고 [ShowModifier('tsin_depression_recovered')]을 얻습니다.\n\n#T 끝#!\n8년이 지난 뒤 불황에 빠진 나라가 하나도 없으면 바로 끝나고, 20년이 지나면 어떤 경우에도 끝나며 관련 보정치가 모두 사라집니다. 대불황 동안에는 [tsin_grain_invasion_concept|e]이 더 거세집니다.\n\n상황 지도 모드는 공황, 불황, 회복한 나라를 보여 줍니다."

 game_concept_tsin_grain_invasion_concept: "곡물 침공"
 game_concept_tsin_grain_invasion_concept_desc: "[ShowSituationName('tsin_grain_invasion')]: 철도와 증기선이 신대륙의 값싼 곡물을 오래된 농업국으로 실어 나릅니다. 1873년부터, [ShowAdvanceName('tsin_steam_merchant_marine_advance')]를 가진 나라가 3곳 이상이면 시작할 수 있습니다. 한 판에 한 번 일어납니다.\n\n시작할 때 [ShowAdvanceName('tsin_railway_network_advance')]을 가진 모든 나라가 [ShowModifier('tsin_grain_invasion_crisis')]에 빠집니다. 다만 공장 일자리가 이미 인구의 20% 이상인 나라는 피해를 입지 않습니다.\n\n위기에 빠진 나라는 매달 농업 정책 이벤트를 받을 수 있고, [tsin_long_depression_concept|e] 중에는 두 배로 자주 받습니다. 정책을 고르면 그 나라의 위기가 끝납니다.\n$BULLET$보호 관세: [ShowModifier('tsin_grain_tariffs')], 지주가 만족합니다.\n$BULLET$도시에 값싼 빵을: [ShowModifier('tsin_cheap_bread')].\n$BULLET$농업 근대화: [ShowModifier('tsin_farm_modernization')], [ShowAdvanceName('tsin_steam_threshing_advance')]이 있어야 합니다.\n\n5년이 지난 뒤 위기에 빠진 나라가 없으면 끝나고, 아니면 15년 뒤에 끝납니다. 그때까지 위기에 남은 나라는 보정치를 잃습니다. [tsin_agricultural_revolution_concept|e]도 참고하십시오."

 game_concept_tsin_great_migration_concept: "대이주"
 game_concept_tsin_great_migration_concept_desc: "[ShowSituationName('tsin_great_migration')]: 수백만 명이 증기선을 타고 바다를 건넙니다. 1845년부터, 인구 압력을 받는 나라가 2곳 이상이면 시작할 수 있습니다. 한 판에 한 번 일어납니다.\n\n보내는 나라와 받는 나라는 해마다 새로 정해집니다.\n$BULLET$#T 보내는 나라:#! 과밀한 [locations|e](인구가 [population_capacity|e]의 80% 초과)이 3곳 이상인 독립국, 또는 [tsin_great_hunger_concept|e], [tsin_cholera_concept|e], [tsin_grain_invasion_concept|e]의 곡물 위기를 겪는 나라. [ShowModifier('tsin_emigration_wave')]과 이민선 이벤트를 받습니다.\n$BULLET$#T 받는 나라:#! [capital|e]가 아메리카나 오세아니아에 있고 보내는 나라가 아닌 나라. [ShowModifier('tsin_immigrant_nation')]를 받고, 문을 열지 정합니다.\n\n사람은 바닐라 [migration|e]로 움직입니다. $tsin_waterworks$과 노동자 주택으로 과밀을 풀면 인구 유출이 멈춥니다. 대이주는 [tsin_population_governor_concept|e]의 배출구 가운데 하나이기도 합니다.\n\n10년이 지난 뒤 보내는 나라가 없으면 끝나고, 아니면 40년 뒤에 끝납니다."

 game_concept_tsin_springtime_of_nations_concept: "국민의 봄"
 game_concept_tsin_springtime_of_nations_concept_desc: "[ShowSituationName('tsin_springtime_of_nations')]은 1848년과 같은 짧은 혁명의 물결입니다. [ShowAgeName('age_7_industrialization')] 시대에, 강한 운동(자유주의나 민족주의 50 이상, 또는 사회주의 40 이상, [tsin_movements_concept|e] 참고)을 가진 나라가 3곳 이상이고 [ShowSituationName('the_revolution')]가 진행 중이 아니면 시작할 수 있습니다. 한 판에 한 번 일어납니다.\n\n그런 나라는 모두 [ShowModifier('tsin_springtime_barricades')]를 받고 곧바로 선택해야 합니다.\n$BULLET$헌법 수여: 자유주의와 민족주의가 크게 줄고 [ShowModifier('tsin_springtime_constitution')]을 얻지만, 귀족이 분노합니다.\n$BULLET$무력 진압: [ShowModifier('tsin_springtime_reaction')], 귀족이 만족하지만 [stability|e]가 떨어집니다.\n$BULLET$관망.\n물결이 이어지는 동안 수도에서 시가전이 벌어질 수 있습니다. 협상하면 금이 들고 자유주의가 줄며, 진압하면 안정도가 떨어지고 자유주의가 커집니다.\n\n3년 뒤 물결이 가라앉습니다. 마지막 이벤트는 첫 선택을 따릅니다. 헌법을 주었다면 자유주의가 더 가라앉고, 진압했다면 자유주의와 사회주의가 더 강해져 돌아옵니다.\n\n상황 지도 모드는 혁명 중인 나라와 운동이 강한 나라를 보여 줍니다."

 game_concept_tsin_national_unification_concept: "민족 통일"
 game_concept_tsin_national_unification_concept_desc: "[ShowSituationName('tsin_national_unification')]은 이탈리아와 독일처럼 여러 나라로 나뉜 민족을 하나로 묶습니다. 국가 태그가 아니라 [culture_groups|e]을 기준으로 합니다. 1848년부터, 민족주의 30 이상인 독립국([tsin_movements_concept|e])이 있으면 시작할 수 있습니다. 한 판에 한 번 일어납니다.\n\n#T 선도국#!\n해마다 평화 중이고 민족주의가 30 이상인 독립국을 살핍니다. 같은 [culture_group|e]의 다른 독립국이 2곳 이상이고, 그 가운데 더 큰 나라나 이미 선도국인 나라가 없으면 민족의 대의를 이끌지 제안을 받습니다. 수락하면 [ShowModifier('tsin_unification_drive')]과, 같은 문화군의 독립국에 쓰는 [ShowCasusBelliName('cb_tsin_national_unification')] [casus_belli|e]을 얻습니다. 거절하면 10년 동안 다시 제안받지 못합니다.\n\n#T 국민 투표와 전쟁#!\n선도국은 해마다 15% 확률로, 자기보다 작고 [great_power|e]이 아닌 동족 국가 하나에 국민 투표를 제안합니다. 수락하면 평화롭게 합병되고, 거부하면 10년 동안 다시 제안할 수 없습니다. 나머지는 전쟁으로 얻어야 합니다.\n\n#T 통일 선포#!\n그 문화군의 독립국이 하나도 남지 않으면 통일이 선포됩니다. 20년 동안 [ShowModifier('tsin_national_unity')]을 얻고 [stability|e]가 오릅니다. 독일이나 이탈리아 같은 바닐라 [formable|e] 국가의 조건을 채우면 그 나라를 형성할 수 있습니다.\n\n1871년 이후 통일국이 생기고 남은 선도국이 없으면 끝나고, 아니면 1900년에 끝납니다."

 game_concept_tsin_defensive_modernization_concept: "방어적 근대화"
 game_concept_tsin_defensive_modernization_concept_desc: "[ShowSituationName('tsin_defensive_modernization')]는 탄지마트, 메이지 유신, 양무운동 같은 개혁을 다룹니다. 개항 압력을 받는 나라, 곧 [tsin_treaty_port_concept|e]을 강제로 열었거나 항구의 포함 이벤트에서 협상으로 항구를 연 나라가 대상입니다. 1840년부터 그런 나라가 생기면 시작할 수 있습니다. 한 판에 한 번 일어납니다.\n\n압력을 받는 나라는 단계를 밟습니다. 이벤트는 해마다 굴리는 확률로 나오며, 플레이버 이벤트 예산을 쓰지 않습니다.\n$BULLET$#T 1. 근대화 칙령:#! 국가 전체를 개편하거나, 자강(외국의 기계와 우리의 제도)을 택합니다. 거부하면 10년 뒤 칙령이 다시 오고, 두 번째 거부는 좌절로 이어집니다.\n$BULLET$#T 2. 구세력의 반동:#! 몇 해 뒤에 옵니다. 신식 군대로 진압하거나([ShowModifier('tsin_modernization_new_army')]), 관직과 연금으로 매수하거나, 굴복합니다. 굴복하면 좌절입니다.\n$BULLET$#T 3. 성공:#! 대기 기간이 끝나고, 공장이 1곳 이상 있으며, [stability|e]가 0 이상이면 30년 동안 [ShowModifier('tsin_modernized_state')]를 얻습니다.\n$BULLET$#T 좌절:#! 15년 동안 [ShowModifier('tsin_failed_modernization')]. 20년 뒤 새 칙령이 가능해집니다.\n\n[ShowMissionName('tsin_modernization')] [mission|e]도 같은 길을 따라가며 불평등 조약을 개정합니다([tsin_industrial_missions_concept|e]).\n\n1880년 이후 개혁 중인 나라가 없으면 끝나고, 아니면 1900년에 끝납니다."

 game_concept_tsin_scramble_for_colonies_concept: "식민지 쟁탈전"
 game_concept_tsin_scramble_for_colonies_concept_desc: "[ShowSituationName('tsin_scramble_for_colonies')]: 증기선과 철도로 무장한 산업 열강이 아직 주인 없는 땅을 두고 경쟁합니다. 1870년부터, [ShowInstitutionName('tsin_industrial_capitalism')]를 수용한 왕국·제국 등급(또는 황제)의 독립국이 4곳 이상이면 시작할 수 있습니다. 한 판에 한 번 일어나며 30년 동안 이어집니다.\n\n그런 나라는 모두 참여하고 [ShowModifier('tsin_scramble_colonial_drive')]을 받습니다. 참여국은 두 길로 넓힙니다. 주인 없는 땅의 [colonization|e], 그리고 이 시대에도 쓸 수 있는 [ShowCasusBelliName('cb_imperialism')] [casus_belli|e]입니다.\n\n10년 뒤 식민 회의에서 참여국마다 세력권을 받아들이거나([ShowModifier('tsin_scramble_spheres')]) 모든 권리를 주장합니다([ShowModifier('tsin_scramble_rivalry')]). 식민지 저항은 언제든 일어날 수 있습니다. 금을 들여 토벌대를 보내거나, 정착민을 물려 식민 이주를 늦춥니다.\n\n30년 뒤 분할이 끝나고 식민 열기가 사라집니다. 상황 지도 모드는 참여국과 아직 주인 없는 땅을 보여 줍니다."

 game_concept_tsin_world_exhibition_concept: "만국박람회"
 game_concept_tsin_world_exhibition_concept_desc: "[ShowSituationName('tsin_world_exhibition')]는 세계의 기계와 발명품을 한 전시관에 모으고, 널리 퍼뜨립니다. 이 시대의 상황 가운데 유일하게 [decision|e]으로 시작하며 여러 번 열릴 수 있습니다.\n\n#T 개최#!\n[ShowDecisionName('tsin_hold_world_exhibition_decision')] 결단에는 평화, 도시나 대도시 등급의 [capital|e], 기술 선두국의 지위(연구한 [advances|e]이 더 많은 나라가 8곳 미만), 그리고 큰돈이 필요합니다. 개최국은 [ShowModifier('tsin_exhibition_hosting')]를 받고, 다음 달에 박람회가 열립니다.\n\n#T 개막#!\n개최국보다 연구한 발전이 적은 모든 나라가 6년 동안 [ShowModifier('tsin_exhibition_visitors')]을 얻습니다. 기술이 선두국에서 나머지로 퍼지는 것입니다. 개최국은 기계관, 과학 궁전, 국가의 영광 가운데 박람회의 주제를 고릅니다.\n\n#T 폐막#!\n1년 뒤 박람회가 닫히고 개최국은 많은 [prestige|e]을 얻습니다. 그 뒤 5년 동안은 박람회를 열 수 없고, 그다음 다른 선두국이 다음 박람회를 열 수 있습니다."

 game_concept_tsin_industrial_disasters_concept: "산업 시대의 재난"
 game_concept_tsin_industrial_disasters_concept_desc: "[ShowAgeName('age_7_industrialization')] 시대에는 새 [disasters|e] 4가지가 있습니다. 바닐라 재난처럼 한 [country|e]를 덮치고, 끝나는 조건을 채울 때까지 이어지며, 고유한 이벤트를 띄웁니다. 국가 태그가 필요 없고, 이미 다른 재난을 겪고 있는 나라에는 시작하지 않습니다.\n$BULLET$[tsin_cholera_concept|e]: 1830~1875년, 상하수도 없는 과밀 도시.\n$BULLET$[tsin_great_hunger_concept|e]: 농민 국가의 병충해와 기근.\n$BULLET$[tsin_millenarian_rebellion_concept|e]: 공장 없는 큰 농업 제국의 대규모 농민 반란.\n$BULLET$[tsin_secession_crisis_concept|e]: 노예제 공화국의 분열.\n\n이전 시대의 바닐라 재난도 이 시대에 이어집니다. [ShowDisasterName('revolution_disaster')], [ShowDisasterName('revolutionary_chaos')], [ShowDisasterName('aspiration_for_liberty')], [ShowDisasterName('court_and_country')], [ShowDisasterName('decline_of_empire')]."

 game_concept_tsin_cholera_concept: "콜레라 대유행"
 game_concept_tsin_cholera_concept_desc: "[ShowDisasterName('tsin_cholera')]은 증기선과 철도를 따라 퍼집니다. 1830년부터 1875년 사이에, [ShowBuildingTypeName('tsin_waterworks')] 없는 과밀한 읍이나 도시(인구가 [population_capacity|e]의 80% 초과)를 2곳 이상 가진 나라를 덮칠 수 있습니다. 대유행이 지나간 나라는 20년 동안 안전합니다.\n\n#T 효과#!\n인구 증가와 도시 번영이 떨어지고 이주가 늘어납니다. 발병 이벤트는 상하수도 없는 가장 큰 과밀 도시를 덮쳐 주민의 3%를 앗아 갑니다(임시 병원을 열면 절반). 대유행 한 번에 최대 6번입니다.\n\n#T 끝내기#!\n진행도가 60에 이르면 대유행이 끝납니다. 진행도는 매달 1씩 오르고, [capital|e]에 상하수도가 있으면 1, 질병 저항이 10% 이상이면(예: 항구 검역, [ShowCabinetActionName('tsin_public_health_campaign')] [cabinet_action|e]) 1이 더 오릅니다. 아무 대책이 없으면 5년, 모두 갖추면 약 20개월이 걸립니다.\n\n시작할 때 항구를 검역하거나([ShowModifier('tsin_cholera_quarantine')]) 교역을 계속할 수 있는데, 교역을 계속하면 대유행이 길어집니다. 한 의사가 사망자를 우물 펌프 하나로 추적하면 대유행을 줄이고 [ShowModifier('tsin_sanitary_science')]을 얻을 수 있습니다. 끝날 때 하수도를 지으면 [ShowModifier('tsin_sewer_movement')]을 얻습니다. 콜레라를 겪는 나라는 [tsin_great_migration_concept|e]의 보내는 나라가 됩니다."

 game_concept_tsin_great_hunger_concept: "대기근"
 game_concept_tsin_great_hunger_concept_desc: "[ShowDisasterName('tsin_great_hunger')]은 1840년대 아일랜드와 같은 기근입니다.\n\n#T 시작#!\n인구의 60% 넘게 농민인 나라는 해마다 낮은 확률로 병충해를 겪습니다. 3년 동안 [ShowModifier('tsin_crop_blight')]가 걸리며, 나라마다 한 번입니다. 기근은 [ShowAgeName('age_7_industrialization')] 시대에, 평화로울 때, 농민 [estate_satisfaction|e]가 50% 미만이고 병충해가 있거나 굶주리는 지방의 지점이 3곳 이상이면 시작할 수 있습니다. 나라마다 한 번 일어납니다.\n\n#T 효과#!\n농민 만족도가 떨어지고, 이주가 빨라지며, 식민 이주가 늘고, 이주민을 덜 끌어들입니다. 사람들이 바닐라 [migration|e]로 떠나고, 그 나라는 [tsin_great_migration_concept|e]의 보내는 나라가 됩니다.\n\n시작할 때 해외 곡물 수입(금), 식량 수출 지속(민족주의 상승), 굶주린 이들을 위한 공공사업 가운데 하나를 고릅니다. 이어서 이민선, 퇴거, 식량 폭동 이벤트가 나옵니다.\n\n#T 끝#!\n4년이 지나고 병충해가 사라지면 기근이 끝납니다. 그 뒤 [stability|e]를 되찾거나 농업 개혁에 돈을 쓸 수 있습니다."

 game_concept_tsin_millenarian_rebellion_concept: "천년왕국 대반란"
 game_concept_tsin_millenarian_rebellion_concept_desc: "[ShowDisasterName('tsin_millenarian_rebellion')]은 태평천국이나 마흐디 봉기 같은 거대한 종교 농민 반란입니다.\n\n#T 시작#!\n[ShowAgeName('age_7_industrialization')] 시대에 다른 재난이나 [civil_war|e]이 없는 나라에서 나라마다 한 번 일어날 수 있습니다. 나라가 크고(1837년 세계 인구의 3% 이상), 공장이 하나도 없으며, 압박 점수가 2 이상이어야 합니다. 점수는 병충해, 강제 개항의 압력([tsin_treaty_port_concept|e]), 농민 만족도 40% 미만, 음수 [stability|e], 종교가 [state_religion|e]와 다른 지점 20곳 이상에 각각 1점입니다.\n\n#T 봉기#!\n수도에서 떨어진, 인구가 많고 불만이 큰 지방 최대 8곳의 팝이 천년왕국 [rebels|e]에 가담합니다. 제국군 토벌(금, [ShowModifier('tsin_suppression_campaign')]) 또는 향신 의용군([ShowModifier('tsin_gentry_armies')], 15년)으로 맞섭니다. 재난이 이어지는 동안 팝이 반란군에 더 쉽게 가담하고, 반란군이 더 빨리 자라며, [war_exhaustion|e]가 오르고 농민 만족도가 떨어집니다. 천경(天京), 외국인 장교의 군대, 전선 뒤의 기근 이벤트가 이어집니다.\n\n#T 끝#!\n최소 3년이 지나고 천년왕국 반란군이 모두 사라지면 끝나며, 15년 동안 [ShowModifier('tsin_rebellion_devastation')]를 남깁니다. 공장이 하나라도 있으면 시작하지 않습니다."

 game_concept_tsin_secession_crisis_concept: "연방 분열 위기"
 game_concept_tsin_secession_crisis_concept_desc: "[ShowDisasterName('tsin_secession_crisis')]는 1861년 미국과 같은 내전으로 가는 길입니다.\n\n#T 시작#!\n나라마다 한 번 일어날 수 있습니다. [ShowAgeName('age_7_industrialization')] 시대의 공화국에 [slavery|e]가 남아 있고, 노예제 폐지 운동이 50 이상([tsin_movements_concept|e])이며, 평화롭고 다른 재난이 없어야 합니다. 그리고 나라가 갈라진 집이어야 합니다. 노예가 주민의 20% 이상인 지점이 8곳 이상, 노예가 없는 지점이 8곳 이상입니다.\n\n#T 위기#!\n적어도 3년 동안 변경의 유혈 사태와 대타협 제안이 나올 수 있습니다. 대타협을 받아들이면 재난이 끝나고, 폐지 운동이 30 줄며, 20년 동안 [ShowModifier('tsin_rotten_compromise')]이 남습니다. 거절하면 다시 제안되지 않습니다.\n\n#T 분리#!\n3년이 지나도록 타협이 없으면 노예 지역이 분리를 선언합니다. 무력으로 연방을 지키면 노예 지역(수도 제외)의 팝이 분리주의 [rebels|e]으로 일어납니다. 마지막 타협을 하면 [stability|e]를 잃고 30년 동안 썩은 타협이 남습니다. 재난 동안 팝이 반란군에 더 쉽게 가담하고 [war_exhaustion|e]가 오릅니다.\n\n#T 재통합#!\n반란군을 물리치면 해방과 재건(노예제 폐지, 15년 동안 [ShowModifier('tsin_reconstruction')]) 또는 옛 질서 복원(안정도, 폐지 운동 감소)을 고릅니다."

 game_concept_tsin_industrial_missions_concept: "산업 시대의 임무"
 game_concept_tsin_industrial_missions_concept_desc: "이 시대에는 [mission|e] 묶음 2가지가 더해집니다. 바닐라 임무처럼 고를 수 있고, 국가 태그가 필요 없으며, 반복되지 않고, [task|e]마다 기간이 정해진 보정치를 보상으로 줍니다.\n\n#T [ShowMissionName('tsin_industrialization')]#!\n[ShowAgeName('age_7_industrialization')] 시대에 읍이나 도시가 1곳 이상인 나라가 받을 수 있습니다.\n$BULLET$[ShowMissionTaskName('tsin_mission_first_factories')]: 공장이 있는 지점 3곳.\n$BULLET$이어서 [ShowMissionTaskName('tsin_mission_machine_works')]($tsin_machine_works$), [ShowMissionTaskName('tsin_mission_urban_growth')](읍·도시 4곳), [ShowMissionTaskName('tsin_mission_rail_link')](수도까지 철도), 그다음 [ShowMissionTaskName('tsin_mission_railway_boom')]($tsin_railway_station$ 3곳).\n$BULLET$최종 과업 [ShowMissionTaskName('tsin_mission_industrial_nation')]: 공장이 있는 지점 8곳. 오래가는 보상을 줍니다.\n$BULLET$곁가지 과업: [ShowMissionTaskName('tsin_mission_automation')], [ShowMissionTaskName('tsin_mission_housing_relief')], [ShowMissionTaskName('tsin_mission_pass_bill')]([tsin_bills_concept|e]), [ShowMissionTaskName('tsin_mission_stock_index')]([tsin_stock_index_concept|e]), [ShowMissionTaskName('tsin_mission_mechanized_farms')]. 최종 과업에는 필요하지 않습니다.\n\n#T [ShowMissionName('tsin_modernization')]#!\n[tsin_treaty_port_concept|e]을 강제로 열었거나, 1850년 이후에도 공장이 하나도 없는 나라가 받을 수 있습니다.\n$BULLET$[ShowMissionTaskName('tsin_mission_foreign_advisors')], 이어서 [ShowMissionTaskName('tsin_mission_army_reform')], [ShowMissionTaskName('tsin_mission_modern_schools')], [ShowMissionTaskName('tsin_mission_state_arsenal')], 그다음 [ShowMissionTaskName('tsin_mission_modern_communications')].\n$BULLET$최종 과업 [ShowMissionTaskName('tsin_mission_treaty_revision')]: 공장이 있는 지점 3곳과 평화. [ShowModifier('tsin_unequal_treaty')]을 없앱니다.\n\n바닐라 임무 [ShowMissionName('generic_capital_economy')]과 [ShowMissionName('progress_and_literacy')]도 이 시대에 그대로 이용할 수 있습니다."

 game_concept_tsin_expeditions_concept: "산업 시대의 원정"
 game_concept_tsin_expeditions_concept_desc: "탐험 [expeditions|e] 3가지가 지리학의 마지막 큰 물음에 답합니다. 모두 [explorer|e]가 이끌고, 금이 들며, 평화로울 때만 보낼 수 있습니다.\n$BULLET$#T $tsin_source_of_the_nile_expedition$:#! 동아프리카 해안에서 큰 호수들을 지나 육로로 갑니다. 세계에서 처음으로 부간다에 닿은 나라가 나일강의 수원을 찾고, [prestige|e]과 지리학회([ShowModifier('tsin_expedition_geographical_society')]) 가운데 하나를 고릅니다. 여정을 마치면 위상과 [ShowModifier('tsin_expedition_geographic_fame')]을 얻습니다. 수원이 발견된 뒤에는 아무도 다시 시작할 수 없습니다.\n$BULLET$#T $tsin_northwest_passage_expedition$:#! 읍이나 도시의 항구에서 북극 얼음의 가장자리까지 바다로 갑니다. 35% 확률로 항로를 찾고(위상과 지리적 명성), 아니면 얼음에 막혀 약간의 위상만 얻고 돌아옵니다. 누군가 항로를 찾을 때까지 다시 도전할 수 있습니다.\n$BULLET$#T $tsin_polar_expedition$:#! 1870년부터, [ShowAdvanceName('tsin_ironclad_advance')]이 있으면 바렌츠해의 유빙까지 바다로 갑니다. 30% 확률로 극점에 닿습니다. 누군가 성공할 때까지 다시 도전할 수 있습니다.\n\n도중에 실패한 원정은 위상을 잃게 합니다. 바닐라 성유물 원정도 이 시대에 그대로 이용할 수 있습니다."

 game_concept_tsin_great_power_politics_concept: "열강 협조 체제"
 game_concept_tsin_great_power_politics_concept_desc: "이 시대의 [great_powers|e]은 회의와 조약으로 문제를 풉니다. 이 이벤트는 평화 중인 열강에게 해마다 굴리는 확률로 나오며, 플레이버 이벤트 예산을 쓰지 않습니다. 국가 태그는 쓰지 않습니다.\n$BULLET$#T 열강 회의:#! 큰 전쟁 뒤([war_exhaustion|e] 2 이상), 세계에서 15년에 한 번까지. 세력 균형을 택하면 전쟁 피로가 줄고, [prestige|e]과 다른 모든 열강과의 상호 [opinion|e]($tsin_congress_concert_opinion$, +25)을 얻습니다. 조건을 강요하면 위상을 더 얻지만 다른 열강의 호감이 떨어집니다($tsin_congress_dictated_opinion$, -25).\n$BULLET$#T 제네바 협약:#! 1860년부터, 나라마다 한 번. 서명하면 [ShowModifier('tsin_geneva_convention')]을 영구히 얻고 자유주의가 오릅니다. 거부하면 위상을 잃습니다.\n$BULLET$#T 해군 군비 경쟁:#! 1880년부터, 항구가 있는 열강에게 10년에 한 번까지. 건조하면 금이 들고 10년 동안 [ShowModifier('tsin_naval_race')]을 얻지만, 다른 열강이 반감을 품습니다($tsin_naval_rivalry_opinion$, -15). 거부하면 위상을 잃습니다.\n$BULLET$#T [ShowDecisionName('tsin_dual_monarchy_decision')]:#! 인구의 30% 이상이 주 문화나 [accepted_culture|e]가 아닌 군주정의 [decision|e]입니다. 평화, 민족주의 30 이상, [stability|e] 0 이상이 필요합니다. 인구가 가장 많은 소수 문화 지점의 문화가 수용 문화가 되고, 민족주의가 25 줄며, 귀족이 만족하고, [ShowModifier('tsin_dual_monarchy')]을 영구히 얻습니다. 한 번만 할 수 있습니다.\n$BULLET$#T [tsin_treaty_port_concept|e]:#! 기술이 앞선 승전국은 패전국에 항구를 열게 할 수 있습니다. 이는 [antagonism|e]을 일으킵니다.\n\n이 호감은 해가 갈수록 옅어집니다. 같은 관세 동맹의 회원국끼리도 서로 호감을 가집니다($io_opinion_tsin_customs_union$)."

 game_concept_tsin_frontier_concept: "골드러시와 개척지"
 game_concept_tsin_frontier_concept_desc: "캘리포니아, 오스트레일리아, 남아프리카, 클론다이크 같은 골드러시와 자영농지법이 빈 땅을 정착민으로 채웁니다. 이 이벤트는 해마다 굴리는 확률로 나오며 플레이버 이벤트 예산을 쓰지 않습니다.\n\n#T 골드러시#!\n$BULLET$#T 개울의 금:#! [raw_material|e]가 금이고 인구가 수용력의 절반 미만인 지점을 가지고 있으면 그곳에서 금이 발견될 수 있습니다(최대 15년에 한 번). 모두에게 열면 10년 동안 [ShowModifier('tsin_gold_rush_boom')]로 이주민과 시장 접근도를 끌어들입니다. 면허를 팔면 [ShowModifier('tsin_gold_rush_licensed')]과 금을 바로 얻습니다.\n$BULLET$#T 신흥 도시:#! 골드러시를 열었을 때, 신흥 도시를 편입하거나(금, 20년 동안 [ShowModifier('tsin_boomtown')]) 자치에 맡깁니다(농민 만족).\n$BULLET$#T 금이 시장에 넘치다:#! 금을 주조하거나(금을 얻지만 5년 동안 [ShowModifier('tsin_gold_inflation')]) 훗날 금본위제를 위한 준비금으로 남깁니다.\n\n#T 개척지 토지#!\n[ShowAdvanceName('tsin_railway_network_advance')]으로 열리는 [ShowLawName('tsin_frontier_land_law')] 법은 빈 땅을 나누는 방식을 정합니다. [ShowPolicyName('tsin_crown_land_sales_policy')]은 귀족을 만족시킵니다. [ShowPolicyName('tsin_homestead_policy')]는 농민을 만족시키고, 해마다 인구가 수용력의 30% 미만인 핵심 [location|e]을 정착민을 끌어들이는 자영농 개척지([ShowModifier('tsin_homestead_frontier')])로 만듭니다."

 game_concept_tsin_culture_science_concept: "문화와 과학"
 game_concept_tsin_culture_science_concept_desc: "증기의 시대는 소설과 오페라, 사진과 위대한 발견의 시대이기도 합니다.\n\n#T 예술품#!\n[ShowAgeName('age_7_industrialization')] 시대에는 새 [works_of_art|e] 4종을 만들 수 있습니다. 화가의 [ShowWorkOfArtTypeName('tsin_romantic_painting')]와 [ShowWorkOfArtTypeName('tsin_photograph')], 작곡가의 [ShowWorkOfArtTypeName('tsin_opera')], 작가의 [ShowWorkOfArtTypeName('tsin_realist_novel')]입니다. 낭만주의 회화는 [cultural_tradition|e]에 가장 크게 보탬이 되고, 오페라와 사실주의 소설은 [cultural_influence|e]을 가장 많이 퍼뜨리며, 사진은 가치가 가장 낮습니다. 바닐라의 모테트와 교향곡도 이어집니다. 예술 이벤트는 낭만주의, 사실주의, 사진술을 다룹니다.\n\n#T 발명#!\n발명 이벤트 10가지는 해당 [advance|e]을 연구한 뒤 나라마다 한 번씩 나옵니다. 베서머 전로, 다이너마이트, 냉동선, 발전기, 전화, 백열등, 수도의 전등, 가황 고무, 내연 기관, 무선 전신입니다. 각각 국가가 맡을지 민간에 맡길지, 어디에 쓸지를 묻습니다. 고등교육이 발달한 나라([tsin_education_ladder_concept|e])는 해마다 한 번 더 굴립니다.\n\n#T 과학과 사회#!\n플레이버 예산을 쓰지 않는 드문 이벤트입니다. 종의 기원(1859년부터, [ShowInstitutionName('tsin_mass_society')] 수용), 교회와 국가의 문화 투쟁(1870년부터, 가톨릭 국가), 해저 전신(1858년부터, 전신과 항구), 근대 올림픽(1896년부터, 세계에서 4년에 한 번).\n\n#T 박람회와 운하#!\n기술 선두국은 [tsin_world_exhibition_concept|e]를 열 수 있습니다. 다이너마이트와 증기 건설 기술이 있으면 [ShowDecisionName('tsin_build_suez_canal_industrial')]과 [ShowDecisionName('tsin_build_panama_canal_industrial')]으로 바닐라 결단보다 40% 싸게 운하를 지을 수 있습니다."

 game_concept_tsin_late_century_concept: "다음 시대의 씨앗"
 game_concept_tsin_late_century_concept_desc: "세기 말에 드문 이벤트 몇 가지가 다가오는 시대의 갈등을 예고합니다. 플레이버 이벤트 예산을 씁니다.\n$BULLET$#T 국제 노동자 협회:#! 1864년부터, 온 세계에서 한 번, 사회주의가 30 이상이고 공장이 1곳 이상인 나라에서 일어납니다. 금지해도 사회주의가 조금 커지고, 토론 모임으로 묵인하면 사회주의와 노동 운동이 더 커집니다.\n$BULLET$#T 무정부주의자의 암살:#! 1881년부터, 노동 불만이 60 이상인 나라([tsin_labor_conditions_concept|e])에서 20년에 한 번까지. 비상법을 만들면 10년 동안 [ShowModifier('tsin_anti_anarchist_laws')], 사회주의는 줄지만 노동 불만이 오릅니다. 법을 바꾸지 않고 애도하면 [stability|e]가 떨어지고 자유주의가 오릅니다.\n$BULLET$#T 수도의 코뮌:#! 1860년부터, 평화 중이지만 전쟁에 지친([war_exhaustion|e] 5 이상) 나라, 사회주의 40 이상, 도시 등급의 [capital|e]. 나라마다 한 번. 바리케이드를 공격하면 수도에 10년 동안 [ShowModifier('tsin_bloody_week')], 사회주의가 줄고 노동 불만이 크게 오릅니다. 자치를 허락하면 [ShowModifier('tsin_municipal_commune')], 사회주의와 자유주의가 오르고 안정도가 떨어집니다. 코뮌이 새 정부가 되지는 않습니다.\n\n이 이벤트의 바탕이 되는 운동은 [tsin_movements_concept|e]에서 설명합니다."

 game_concept_tsin_map_modes_concept: "산업 시대의 지도 모드"
 game_concept_tsin_map_modes_concept_desc: "모드는 지도 모드 16가지를 더하며, 같은 갈래의 바닐라 지도 모드 뒤에 놓입니다. 색이 진할수록 값이 큽니다.\n$BULLET$#T $mapmode_tsin_industrial_institutions_name$:#! 지점에 있는 이 시대의 가장 앞선 제도. $tsin_electrification$, $tsin_mass_society$, $tsin_industrial_capitalism$, 없음.\n$BULLET$#T $mapmode_tsin_industrialization_name$:#! 공장 건물이 고용할 수 있는 인구 비중. 25% 이상이 가장 진합니다.\n$BULLET$#T $mapmode_tsin_industrial_investment_name$:#! 산업에 돈을 댄 쪽. 외국 자본, 외국 소유 건물, 국가 주도, 국내 산업([tsin_industrial_investment_concept|e]).\n$BULLET$#T $mapmode_tsin_urbanization_name$:#! 도시민과 노동자의 비중(50% 이상이 가장 진함). 도시와 대도시는 따로 표시합니다.\n$BULLET$#T $mapmode_tsin_labor_unrest_name$:#! 무력으로 깨진 파업, 최근의 파업, 소유국 노동 운동의 세기에 따른 공장 지점.\n$BULLET$#T $mapmode_tsin_radicalism_name$:#! 소유국에서 가장 강한 운동 × 지점의 불만([tsin_movements_concept|e]).\n$BULLET$#T $mapmode_tsin_electrification_name$:#! 시장의 전력 공급이 수요를 채우는지. 충분, 부족, 미연결([tsin_electric_power_concept|e]).\n$BULLET$#T $mapmode_tsin_education_name$:#! 소유국의 고등교육률. 연구 대학이 있는 지점은 강조합니다([tsin_education_ladder_concept|e]).\n$BULLET$#T $mapmode_tsin_automation_name$:#! 공장 레벨 가운데 자동화 업그레이드의 비중([tsin_automation_concept|e]).\n$BULLET$#T $mapmode_tsin_industrial_siting_name$:#! 공장 입지로서의 좋음. 시장 접근도, 석탄이나 철, 철도역, 도시 등급.\n$BULLET$#T $mapmode_tsin_infrastructure_name$:#! 철도역, 상하수도, 증기선 항만, 도시 조명망, 도청 가운데 갖춘 수.\n$BULLET$#T $mapmode_tsin_labor_conditions_name$:#! 공장 지점의 노동 조건. 0.3 미만은 열악합니다([tsin_labor_conditions_concept|e]).\n$BULLET$#T $mapmode_tsin_housing_name$:#! 모범 주택, 연립주택, 혼잡, 과밀(수용력의 80% 초과).\n$BULLET$#T $mapmode_tsin_gdp_per_capita_name$:#! 지난해 세계 최고값에 견준 소유국의 1인당 추정 GDP([tsin_estimated_gdp_concept|e]).\n$BULLET$#T $mapmode_tsin_corporations_name$:#! 기업 본사와 사업장([tsin_corporations_concept|e]).\n$BULLET$#T $mapmode_tsin_agriculture_name$:#! 기계화 농장, 농업 단계, 시장의 식량 부족([tsin_agricultural_revolution_concept|e]).\n\n이 시대의 [situation|e]도 저마다 상황 지도 모드로 지도를 칠하며, 각 항목에서 설명합니다."

 game_concept_tsin_hints_concept: "산업 시대의 힌트"
 game_concept_tsin_hints_concept_desc: "바닐라 힌트처럼 모드의 힌트도 조건이 맞는 동안 힌트 목록에 나타나고, 조건이 풀리면 사라집니다. 무슨 일이 벌어지는지 설명하고 할 일을 제안합니다.\n$BULLET$[tsin_industrial_age_situations|e] 8가지마다 하나씩, 그 상황이 진행되는 동안.\n$BULLET$[tsin_electric_power_concept|e]: 발전소를 지을 수 있지만 아직 하나도 없음.\n$BULLET$[tsin_treaty_port_concept|e]: [ShowModifier('tsin_unequal_treaty')]을 받고 있음.\n$BULLET$[tsin_movements_concept|e]: 가장 강한 운동이 60에 이르러 선동 중.\n$BULLET$[tsin_labor_conditions_concept|e]: 노동 불만이 50 초과.\n$BULLET$[tsin_bills_concept|e]: 이제 법은 법안으로만 바뀌는데, 아직 통과시킨 법안이 없음.\n$BULLET$[tsin_stock_index_concept|e]: 주식 시장이 폭락함."

 game_concept_tsin_flavor_events_concept: "산업 시대의 이벤트"
 game_concept_tsin_flavor_events_concept_desc: "모드는 많은 [events|e]를 더합니다. 다른 콘텐츠처럼 나라의 상태(제도, 발전, 건물, 법, 운동, 문해력)를 보며, 국가 태그나 정해진 날짜에 묶이지 않습니다.\n\n#T 플레이버 이벤트#!\n해마다 굴리는 확률로 나오며 예산을 나눠 씁니다. 나라마다 1년에 받을 수 있는 수가 정해져 있습니다. 게임 규칙 $rule_tsin_flavor_event_frequency$이 그 수를 정합니다. 보통 3, 적게 1, 많이 5, 또는 끔.\n$BULLET$경제: 공장 사고, 원료 부족, 금융 공황, 철도 투기 열풍, 산업 스파이, 고무 붐, 곡물법.\n$BULLET$발명과 농업 혁명: 핵심 발전마다 이벤트 하나.\n$BULLET$사회와 노동 계급: 인민헌장, 파업, 학교, 사회 보험, 아동 노동, 참정권, 도시 생활.\n$BULLET$시민 생활, 기업, 군사 기술, 예술, 항구의 포함, 농노 해방.\n\n#T 예산 밖의 이벤트#!\n[situations|e], [disasters|e], [expeditions|e]의 이벤트, [tsin_defensive_modernization_concept|e]와 [tsin_national_unification_concept|e]의 단계, [tsin_great_power_politics_concept|e], [tsin_frontier_concept|e], [tsin_culture_science_concept|e]의 과학 이벤트, 노예제 폐지, 시스템 알림은 플레이버 이벤트를 꺼도 언제나 나옵니다."
