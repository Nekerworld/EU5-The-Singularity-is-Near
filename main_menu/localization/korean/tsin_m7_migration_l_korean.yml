l_korean:

 # The Great Migration (in_game/common/situations/tsin_great_migration.txt)
 tsin_great_migration: "대이주"
 tsin_great_migration_desc: "과밀한 도시와 굶주린 농촌, 역병과 곡물 위기를 피해 수백만 명이 증기선을 타고 바다를 건넙니다. 이민자를 보내는 나라는 인구 압력을 덜고, 아메리카와 오세아니아의 나라는 새 일손을 얻습니다."
 tsin_great_migration_closes: "이민의 문이 닫히다"
 tsin_great_migration_ebbs: "이주의 물결이 잦아들다"
 tsin_great_migration_sender_tt: "이 [country|e]에서 이민자들이 바다를 건너 떠나고 있습니다."
 tsin_great_migration_receiver_tt: "이 [country|e]로 이민자들이 들어오고 있습니다."
 hint_tsin_great_migration: "[GetSituationByKey('tsin_great_migration').GetNameWithNoTooltip]"
 hint_tsin_great_migration_hint_text: "[GetSituationByKey('tsin_great_migration').GetName]에서는 해마다 한 번 보내는 나라와 받는 나라가 정해집니다.\n\n#T 보내는 나라:#! 과밀한 도시·마을이 3곳 이상이거나, 대기근·콜레라 재난 또는 곡물 위기를 겪는 독립국.\n#T 받는 나라:#! 수도가 아메리카나 오세아니아에 있고 보내는 나라가 아닌 나라.\n\n#T 권장 행동:#!\n@arrow_bonus_tier_3! 상하수도와 주거를 늘리면 과밀이 풀려 이민 행렬이 멈춥니다.\n@arrow_bonus_tier_2! 받는 나라는 문을 열어 인구를 빠르게 늘릴 수 있습니다."
 hint_tsin_great_migration_diplomatic: "\"향수병은 낡은 나라의 병이고, 기회는 새 나라의 약이다.\""
 hint_tsin_great_migration_administrative: "\"떠난 이들이 보내는 돈이 남은 이들을 먹여 살린다.\""
 hint_tsin_great_migration_military: "\"이민선마다 내일의 병사가 타고 있다.\""
 STATIC_MODIFIER_NAME_tsin_emigration_wave: "이민 행렬"
 STATIC_MODIFIER_NAME_tsin_immigrant_nation: "이민자의 나라"
 STATIC_MODIFIER_NAME_tsin_emigrant_remittances: "이민자 송금"
 STATIC_MODIFIER_NAME_tsin_emigration_restricted: "이민 제한"
 STATIC_MODIFIER_NAME_tsin_open_door: "열린 문"
 STATIC_MODIFIER_NAME_tsin_nativist_laws: "토박이 우선법"
 tsin_migration.1.title: "이민선"
 tsin_migration.1.desc: "항구마다 보따리를 진 가족들이 증기선 표를 사려고 줄을 섭니다. 마을은 비어 가지만, 바다 건너에서 보내올 돈을 기다리는 사람도 많습니다."
 tsin_migration.1.a: "보내 주고, 송금을 기다린다."
 tsin_migration.1.b: "우리 백성은 여기서 필요하다."
 tsin_migration.2.title: "지친 사람들의 무리"
 tsin_migration.2.desc: "이민선이 들어올 때마다 낯선 말을 하는 사람들이 부두에 내립니다. 공장과 농장은 일손을 반기지만, 토박이 노동자들은 임금이 깎일까 두려워합니다."
 tsin_migration.2.a: "문을 연다."
 tsin_migration.2.b: "토박이가 먼저다."
