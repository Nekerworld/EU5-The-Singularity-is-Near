l_korean:

 tsin_frontier_land_law: "개척지 토지"
 tsin_frontier_land_law_desc: "나라 안의 빈 땅을 누구에게 줄지 정합니다. 국유지 매각은 지주와 국고를, 자영농지 분배는 이주민을 돕습니다."
 tsin_frontier_land_law_CATEGORY: "SOCIOECONOMIC_LAW_CATEGORY"
 tsin_crown_land_sales_policy: "국유지 매각"
 tsin_crown_land_sales_policy_desc: "빈 땅은 경매로 팔리고, 대개 큰 지주와 투기꾼의 손에 들어갑니다."
 tsin_homestead_policy: "자영농지 분배"
 tsin_homestead_policy_desc: "몇 년 동안 땅을 일군 정착민에게 그 땅을 무상으로 줍니다. 인구가 적은 핵심 [location|e]이 이주민을 끌어들입니다."
 STATIC_MODIFIER_NAME_tsin_homestead_frontier: "자영농 개척지"
 STATIC_MODIFIER_NAME_tsin_gold_rush_boom: "골드러시"
 STATIC_MODIFIER_NAME_tsin_gold_rush_licensed: "면허 금광"
 STATIC_MODIFIER_NAME_tsin_boomtown: "신흥 도시"
 STATIC_MODIFIER_NAME_tsin_gold_inflation: "금 인플레이션"
 tsin_frontier.10.title: "개울의 금"
 tsin_frontier.10.desc: "[tsin_gold_field.GetName]의 제재소 일꾼이 개울에서 반짝이는 알갱이를 건져 올렸습니다. 소문은 몇 주 만에 항구마다 퍼졌고, 배와 마차가 금을 찾는 사람들로 가득합니다."
 tsin_frontier.10.a: "누구든 와서 캐게 한다."
 tsin_frontier.10.b: "금광에 왕실 면허를 매긴다."
 tsin_frontier.20.title: "신흥 도시"
 tsin_frontier.20.desc: "천막촌이던 [tsin_gold_field.GetName]에 술집과 은행, 신문사가 들어섰습니다. 그러나 법은 아직 총잡이와 자경단의 손에 있습니다."
 tsin_frontier.20.a: "도시로 편입해 법원과 조폐소를 세운다."
 tsin_frontier.20.b: "광부들이 스스로 다스리게 둔다."
 tsin_frontier.30.title: "금이 시장에 넘치다"
 tsin_frontier.30.desc: "새로 캔 금이 쏟아져 들어오면서 물가가 오르고 있습니다. 상인들은 반기지만, 고정된 임금과 지대로 사는 사람들은 살림이 빠듯해졌습니다."
 tsin_frontier.30.a: "모두 주조해 쓴다."
 tsin_frontier.30.b: "금고에 준비금으로 쌓아 둔다."
 tsin_frontier.30.b.tt: "금 준비금은 금본위제 도입에 도움이 됩니다."
