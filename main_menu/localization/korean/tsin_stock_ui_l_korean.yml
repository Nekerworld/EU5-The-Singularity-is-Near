 TSIN_CAP_INDUSTRIAL: "산업 기업"
 TSIN_CAP_CHART_NOTE: "과거 → 최근 관측값. 통상 분기별이며 거래소 폐쇄 시 간격이 늘어납니다. 국고 금액이 아닌 지수입니다."
 TSIN_CAP_NO_HISTORY: "아직 주가 관측 기록이 없습니다. 기업 설립 후 분기 갱신부터 기록됩니다."
 TSIN_CAP_HELP: "일반 업종에는 여러 민간 기업이 속할 수 있고 역사적 고유 조직은 하나입니다. 초기 상단의 지수는 기업 평가의 추상화이며 중세에 현대 주식거래소가 존재했다는 뜻은 아닙니다. 가치는 저장된 영업 기반을 사용합니다."
