 TSIN_CAP_RISK_HELP: "과잉공급: 수도 시장 표본 중 상품 2종 이상이 수요 대비 공급 150%·기준가 65% 이하로 4분기 지속. 과잉 진입: 기업 6개 이상이고 추정 영업 기반의 150%를 초과한 상태가 3분기 지속. 세계 전염에는 1900년 이후의 다국가·다시장 조건이 추가로 필요합니다."
