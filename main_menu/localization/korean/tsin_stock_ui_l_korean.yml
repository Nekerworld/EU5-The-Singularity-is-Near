l_korean:
 TSIN_STOCK_TAB: "주식"
 TSIN_STOCK_TITLE: "주식시장"
 TSIN_STOCK_CURRENT: "종합 주가 지수"
 TSIN_STOCK_CHART: "주가 지수 추이 · 분기별 관측"
 TSIN_STOCK_CHART_NOTE: "과거 → 최근 · 공통 눈금, 0 기준선. 설립 주가: 100. 통상 분기마다 관측하며 거래소 폐쇄 시 간격이 늘어납니다. 즉시 발생한 주가 충격은 과거 기록을 바꾸지 않습니다."
 TSIN_STOCK_NO_HISTORY: "아직 관측 기록이 없습니다. 첫 기업 설립 후 분기별 주가 갱신부터 이력이 표시됩니다."
 TSIN_STOCK_NO_MARKET: "상장 기업이 없습니다. 필요한 기술과 비용을 갖춘 뒤 기존 결단으로 기업을 설립하세요."
