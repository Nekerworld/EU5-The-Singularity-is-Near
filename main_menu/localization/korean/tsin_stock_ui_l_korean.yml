 TSIN_STOCK_HELP: "주가와 지수는 기존 분기별 시뮬레이션을 따릅니다. 건물 레벨은 연간 통계이며 기업 가치는 현재 주가 × 기록된 건물 레벨인 추정치입니다. 국고나 현실의 시가총액을 뜻하지 않습니다. 설립·특허장·해산은 기존 결단을 이용합니다."
