l_korean:

 tsin_union_recognition: "노동조합 승인"
 tsin_union_recognition_desc: "공장 노동자의 노동조합이 법적 단체로 인정받아 고용주와 단체 교섭을 합니다. [ShowEstatePrivilegeName('tsin_mutual_aid_societies')]이 있어야 하며, 노동 불만의 목표값을 10 낮춥니다."
 pa_tsin_factory_inspection: "공장 감독 강화"
 pa_tsin_factory_inspection_desc: "평민 대표들이 공장 사고와 아동 노동을 조사할 감독관을 늘리라고 요구합니다. 노동 불만이 10 줄어듭니다."
 pa_tsin_ten_hour_day: "10시간 노동제"
 pa_tsin_ten_hour_day_desc: "노동조합이 하루 노동 시간을 10시간으로 묶는 법을 요구합니다. 노동 불만이 15 줄고, 생산 효율이 조금 떨어집니다."
 STATIC_MODIFIER_NAME_tsin_factory_inspection_agenda: "공장 감독 강화"
 STATIC_MODIFIER_NAME_tsin_ten_hour_day: "10시간 노동제"
 tsin_society.80.title: "공장 사고"
 tsin_society.80.desc: "[tsin_accident_location.GetName]의 공장에서 보일러가 터져 노동자 여럿이 목숨을 잃었습니다. 유족들은 보상을 요구하고, 신문들은 공장 안의 열악한 환경을 앞다투어 보도합니다."
 tsin_society.80.a: "유족에게 보상한다."
 tsin_society.80.b: "공개 조사를 연다."
 tsin_society.80.c: "노동자들의 부주의였다."
 tsin_society.90.title: "사회주의 독서회"
 tsin_society.90.desc: "경찰 보고에 따르면 [tsin_cell_location.GetName]의 노동자들이 밤마다 모여 사회주의 소책자를 돌려 읽고 있습니다. 아직은 조용한 모임이지만, 이들은 공장 바깥까지 연락망을 넓히고 있습니다."
 tsin_society.90.a: "독서회를 급습한다."
 tsin_society.90.b: "읽게 내버려 둔다."
 tsin_society.90.c: "노동조합으로 끌어들인다."
 tsin_society.100.title: "노동절 시위"
 tsin_society.100.desc: "5월 1일, [tsin_demonstration_location.GetName]의 거리가 8시간 노동제를 외치는 노동자들로 가득 찼습니다. 붉은 깃발이 공장 굴뚝 사이로 휘날리고, 공장주들은 군대를 불러 달라고 요구합니다."
 tsin_society.100.a: "노동 시간 단축을 약속한다."
 tsin_society.100.b: "군중을 해산한다."
 tsin_society.100.c: "행진하게 둔다."
 STATIC_MODIFIER_NAME_tsin_anti_anarchist_laws: "무정부주의자 단속법"
 STATIC_MODIFIER_NAME_tsin_bloody_week: "피의 주간"
 STATIC_MODIFIER_NAME_tsin_municipal_commune: "자치 코뮌"
 tsin_society.110.title: "국제 노동자 협회"
 tsin_society.110.desc: "여러 나라의 노동자 대표들이 런던의 한 회관에 모여 국경을 넘는 노동자 협회를 세웠습니다. 우리 나라의 노조 지도자들도 그 창립 선언에 이름을 올렸습니다."
 tsin_society.110.a: "협회를 금지한다."
 tsin_society.110.b: "토론 모임으로 눈감아 준다."
 tsin_society.120.title: "무정부주의자의 암살"
 tsin_society.120.desc: "한 무정부주의자가 대신의 마차에 폭탄을 던졌습니다. 그는 법정에서 \"행동에 의한 선전\"이라고 외쳤고, 신문들은 비밀 결사의 음모를 떠들고 있습니다."
 tsin_society.120.a: "무정부주의자 단속법을 만든다."
 tsin_society.120.b: "애도하되 법은 바꾸지 않는다."
 tsin_society.125.title: "수도의 코뮌"
 tsin_society.125.desc: "패전의 굴욕 속에 [tsin_commune_location.GetName]의 국민방위대와 노동자들이 바리케이드를 세우고 자치 코뮌을 선포했습니다. 정부군은 도시 밖에서 명령을 기다리고 있습니다."
 tsin_society.125.a: "바리케이드를 돌파한다."
 tsin_society.125.b: "도시에 자치를 허락한다."
