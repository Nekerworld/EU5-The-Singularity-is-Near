l_korean:
 tsin_lucky_nations: "TSIN 역사적 럭키네이션"
 tsin_lucky_nations_desc: "러시아 시제품입니다. 필수 도시 하나라도 인간 세력권이 소유·점령하면 스크립트 형성을 막습니다. 지원 모드는 영토를 이전하지 않으며 저장된 HEX 역할 보유국은 1700년 이전 HEX에 맡깁니다."
 tsin_lucky_nations_assisted: "형성 지원"
 tsin_lucky_nations_assisted_desc: "적합한 러시아권 AI를 지원하고 바닐라 핵심 도시 네 곳을 보유하면 러시아를 형성합니다. 영토는 이전하지 않습니다. 기존 세이브의 기본 동작입니다."
 tsin_lucky_nations_force: "지원 및 영토 보완"
 tsin_lucky_nations_force_desc: "1700년 이후 조건을 통과한 러시아권 AI에 핵심 도시를 이전할 수 있습니다. 수도·인간 세력권·점령지·소유국이 사라지는 이전은 제외합니다."
 tsin_lucky_nations_off: "끔"
 tsin_lucky_nations_off_desc: "러시아 지원과 스크립트 형성을 끕니다. 기존 TSIN 지원은 점검 시 제거합니다."
 tsin_lucky_russia.1.title: "러시아의 통합"
 tsin_lucky_russia.1.desc: "역사 진행 규칙에 따라 지연된 통합을 처리합니다. 이전 직전에 인간의 소유·점령, 전쟁, 수도, 이전 이후 소유국의 존속을 다시 확인합니다."
 tsin_lucky_russia.1.a: "새로운 러시아 국가로."
 tsin_lucky_russia_formed_log: "TSIN_LUCKY_RUSSIA (러시아 형성) [ROOT.GetCountry.GetName]"
 STATIC_MODIFIER_NAME_tsin_lucky_russia_support: "러시아 통합 지원"
 STATIC_MODIFIER_DESC_tsin_lucky_russia_support: "지연된 러시아 통합을 위한 임시 지원입니다. 형성·인간과의 전쟁·인간의 보호 도시 소유나 점령·시제품 기간 종료 시 정리합니다."
 STATIC_MODIFIER_NAME_tsin_lucky_russia_support_strong: "러시아 통합 집중 지원"
 STATIC_MODIFIER_DESC_tsin_lucky_russia_support_strong: "지원 연간 점검 15회 이후의 강화된 임시 지원입니다. 영구적인 국가 특혜가 아닙니다."
