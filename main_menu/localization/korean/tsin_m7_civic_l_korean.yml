 # tsin_civic events (docs/replaced_buildings.md)
 tsin_civic.10.title: "훔볼트식 대학 개혁"
 tsin_civic.10.desc: "새 연구 대학의 교수들이 강의만 하던 옛 대학과 결별하자고 한다. 연구와 교육을 한 지붕 아래 두고, 학생도 실험실과 세미나에서 직접 지식을 만들어야 한다는 것이다. 문제는 누가 무엇을 가르칠지 정하느냐다."
 tsin_civic.10.a: "가르치고 배울 자유를 준다"
 tsin_civic.10.b: "교육부가 교과 과정을 정한다"
 tsin_civic.20.title: "실험실 폭발"
 tsin_civic.20.desc: "[tsin_civic_location.GetName]의 대학 화학 실험실에서 폭발이 일어나 조교 둘이 다쳤다. 이웃 주민들은 시내 한복판에서 무엇을 끓이고 있느냐며 항의한다."
 tsin_civic.20.a: "새 안전 규정에 예산을 쓴다"
 tsin_civic.20.b: "과학에는 대가가 따른다"
 tsin_civic.30.title: "바리케이드 위의 학생들"
 tsin_civic.30.desc: "[tsin_civic_location.GetName]의 대학생들이 강의실을 비우고 거리로 나섰다. 헌법, 언론 자유, 징병 면제까지 요구가 끝없이 늘어난다. 교수 몇 명도 그들 편에 섰다."
 tsin_civic.30.a: "한 학기 동안 대학을 닫는다"
 tsin_civic.30.b: "학생들의 말을 들어 본다"
 tsin_civic.40.title: "강의실 문 앞의 여성들"
 tsin_civic.40.desc: "여성 몇 명이 의학과 자연과학 강의를 들을 수 있게 해 달라고 청원했다. 교수회는 둘로 갈렸고, 교회는 가정의 질서가 무너진다고 경고한다."
 tsin_civic.40.a: "대학을 여성에게 연다"
 tsin_civic.40.b: "여자 대학은 따로 둔다"
 tsin_civic.50.title: "국제 학술상"
 tsin_civic.50.desc: "우리 대학의 교수가 외국 학회가 주는 큰 상을 받았다. 신문은 국가의 영광이라며 들떠 있다. 교수 본인은 상금보다 연구소를 바란다고 말한다."
 tsin_civic.50.a: "국가 과학의 승리를 기린다"
 tsin_civic.50.b: "수상자의 이름을 딴 연구소를 세운다"
 tsin_civic.60.title: "정기 기선 항로"
 tsin_civic.60.desc: "[tsin_civic_location.GetName]의 증기선 항만에서 정해진 날짜에 떠나는 정기 기선 항로가 열린다. 해운 회사는 우편 운송 보조금을 주면 항로를 늘리겠다고 한다."
 tsin_civic.60.a: "우편 보조금을 준다"
 tsin_civic.60.b: "해운 회사에 맡긴다"
 tsin_civic.70.title: "항만 노동자 파업"
 tsin_civic.70.desc: "[tsin_civic_location.GetName]의 부두 노동자들이 시간당 1페니 인상을 요구하며 일손을 놓았다. 화물선이 앞바다에 줄지어 서 있다."
 tsin_civic.70.a: "시간당 1페니를 더 준다"
 tsin_civic.70.b: "파업 대체 인력을 들인다"
 tsin_civic.80.title: "이민선"
 tsin_civic.80.desc: "북적이는 [tsin_civic_location.GetName]의 부두에 바다 건너 새 삶을 찾는 가족들이 몰려든다. 기선 덕분에 몇 달 걸리던 항해가 몇 주로 줄었다."
 tsin_civic.80.a: "우리 식민지로 가는 뱃삯을 보조한다"
 tsin_civic.80.b: "원하는 곳으로 가게 둔다"
 tsin_civic.90.title: "대악취"
 tsin_civic.90.desc: "여름 더위에 수도의 강이 거대한 하수구로 변했다. 의원들은 석회에 적신 커튼 뒤에서 회의를 한다. 공학자들은 강을 따라 차집 하수도를 놓자는 설계도를 들고 왔다."
 tsin_civic.90.a: "당장 차집 하수도를 놓는다"
 tsin_civic.90.b: "비가 오기를 기다린다"
 tsin_civic.100.title: "펌프 손잡이"
 tsin_civic.100.desc: "한 의사가 사망자의 집을 지도에 찍어 보니 모두 우물 하나 둘레에 모여 있었다. 그는 병이 나쁜 공기가 아니라 물로 옮는다고 주장한다. 보건 위원회는 아직 그 말을 믿지 않는다."
 tsin_civic.100.a: "물이 병을 옮긴다: 여과하고 소독한다"
 tsin_civic.100.b: "보건 위원회 말대로 나쁜 공기 탓이다"
 tsin_civic.110.title: "도시 자치 논쟁"
 tsin_civic.110.desc: "도청이 들어선 도시들에서 시민들이 선출된 시의회를 요구한다. 중앙에서 보낸 도지사는 그러면 국가 행정이 쪼개진다고 반대한다."
 tsin_civic.110.a: "선출 시의회를 허용한다"
 tsin_civic.110.b: "도지사는 중앙 부처에 책임을 진다"
 tsin_civic.120.title: "첫 무인 공정"
 tsin_civic.120.desc: "[tsin_civic_location.GetName]의 공장이 사람 손을 거의 거치지 않고 하루 종일 돌아가는 생산 공정을 시연했다. 손님들은 감탄했지만, 공장 밖의 노동자들은 다음은 자기 차례냐고 묻는다."
 tsin_civic.120.a: "세계에 보여 준다"
 tsin_civic.120.b: "해고는 없다고 약속한다"
