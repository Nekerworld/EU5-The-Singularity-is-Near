l_korean:
 tsin_water_treatment_works: "폐수 처리시설"
 tsin_water_treatment_works_desc: "실제 가동·고용 수준에 따라 산업·광산 수질 오염원 추정치를 낮춥니다. 정상 가동 1단계당 30%, 최대 60% 저감입니다. 대기 매연을 제거하지 않으며 기존 오염은 연간 조사마다 점차 줄어듭니다."
 tsin_water_treatment_steam: "증기 펌프 처리시설"
 tsin_water_treatment_electric: "전동 펌프 처리시설"
 tsin_environment_inspectorate: "환경 감독소"
 tsin_environment_inspectorate_desc: "환경법을 현장에서 집행합니다. 고용·투입재가 갖춰진 비율만큼 집행하며 감독소나 인력이 없으면 법만으로 배출이 줄지 않습니다. 최대 효과: 검사법 대기 10%·수질 5%, 배출기준법 대기 20%·수질 10% 저감."
 tsin_environment_inspectorate_maintenance: "환경 감독소 유지"
 tsin_environment_law: "환경 감독과 배출 규제"
 tsin_environment_law_desc: "실제 감독소를 통한 집행과 환경 설비 투자를 정합니다. 법률의 채택은 모든 시설을 즉시 개조하거나 기존 오염을 없애지 않습니다."
 tsin_environment_unregulated_policy: "자율 처리"
 tsin_environment_unregulated_policy_desc: "환경 감독소의 규제 효과가 없습니다. 처리시설과 별도 여과 지원은 계속 이용할 수 있습니다."
 tsin_environment_inspections_policy: "공해 검사 제도"
 tsin_environment_inspections_policy_desc: "감독소의 실효 인력 비율에 따라 대기 최대 10%, 수질 최대 5%의 오염원 감축을 유도합니다."
 tsin_environment_standards_policy: "배출 기준과 감독"
 tsin_environment_standards_policy_desc: "감독소의 실효 인력 비율에 따라 대기 최대 20%, 수질 최대 10%의 오염원 감축을 유도합니다."
 AUTO_MODIFIER_NAME_tsin_water_pollution_health: "수질 오염 노출"
 mapmode_tsin_water_pollution_name: "수질 오염"
 MAPMODE_TSIN_WATER_POLLUTION: "도시·광산의 연간 수질 오염 위험 지수입니다. 실제 농도 단위가 아니며 미조사 농촌을 깨끗하다고 판정하지 않습니다."
 LEGEND_TSIN_WATER_HIGH: "높은 수질 위험"
 LEGEND_TSIN_WATER_LOW: "낮은 수질 위험"
 LEGEND_TSIN_WATER_UNKNOWN: "자료 없음"
 tsin_environment.1.title: "하천에 대한 주민 청원"
 tsin_environment.1.desc: "오염된 물에 대한 주민 민원이 여러 해 이어졌습니다. 당국은 임시 정화 서비스를 조달할 수 있지만 장기적인 개선에는 처리시설과 현장 감독이 필요합니다."
 tsin_environment.1.a: "250두캇으로 정화 서비스를 조달한다"
 tsin_environment.1.b: "추가 예산을 배정하지 않는다"
