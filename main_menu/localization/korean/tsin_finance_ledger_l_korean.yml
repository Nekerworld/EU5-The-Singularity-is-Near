 TSIN_LEDGER_FUNDS: "보험·연금"
 TSIN_LEDGER_TECH_HELP: "신규 은행업은 은행업, 증권 발행은 증권거래소, 통화정책은 중앙은행, 보험·연금은 해당 기술을 요구합니다. 기존 장부 조회·상환·영업 정리는 계속 가능합니다."
 TSIN_LEDGER_NOTE: "모든 장부는 기준 두캇으로 결제됩니다. 통화 환산은 표시 체계이며 기존 교역·대출의 단위는 유지됩니다. 기금은 실제 자금을 출연한 통합 장부입니다. 준비금은 별도 보관한 현금이며 광물 금 생산량이 아닙니다. 기업 수입은 실제 지급된 계약금으로 GDP·주가 추정치에서 현금을 생성하지 않습니다."
