l_korean:
 TSIN_LEDGER_MONEY: "통화정책"
 TSIN_LEDGER_BANK: "은행 출자"
 TSIN_LEDGER_FUNDS: "보험·연금"
 TSIN_LEDGER_NOTE: "모든 장부는 기준 두캇으로 결제됩니다. 통화 환산은 표시 체계이며 기존 교역·대출의 단위는 유지됩니다. 기금은 실제 자금을 출연한 통합 장부입니다. 준비금은 별도 보관한 현금이며 광물 금 생산량이 아닙니다. 기업 수입은 실제 지급된 계약금으로 GDP·주가 추정치에서 현금을 생성하지 않습니다."
 TSIN_LEDGER_FX: "기준 두캇당 자국 화폐 단위"
 TSIN_LEDGER_LOCAL: "자국 단위 국고"
 TSIN_LEDGER_RATE: "기업 신용창구 연 금리 (%)"
 TSIN_LEDGER_RESERVE: "준비 현금 적립"
 TSIN_LEDGER_LIQUID: "은행 현금"
 TSIN_LEDGER_LOANS: "은행 대출자산 = 기업 원금채무"
 TSIN_LEDGER_FIRM: "기업 현금"
 TSIN_LEDGER_INTEREST: "최근 월 실제 이자 지급"
 TSIN_LEDGER_ARREARS: "이자 미지급 연속 개월"
 TSIN_LEDGER_INSURANCE: "보험기금 출연"
 TSIN_LEDGER_PENSION: "연금 출연"
 TSIN_LEDGER_BENEFITS: "최근 월 연금 급여"
 TSIN_LEDGER_RELEASE: "준비 현금 인출"
 TSIN_LEDGER_RATE_UP: "금리 +1%p"
 TSIN_LEDGER_RATE_DOWN: "금리 -1%p"
 TSIN_LEDGER_DEVALUE: "10% 평가절하"
 TSIN_LEDGER_REDENOMINATE: "10:1 화폐개혁"
 TSIN_LEDGER_CONTRACT: "기업에 유상 계약 발주"
 TSIN_LEDGER_LEND: "기업 대출 실행"
 TSIN_LEDGER_REPAY: "기업 원금 상환"
 TSIN_LEDGER_DIVIDEND: "현금 배당 지급"
 TSIN_LEDGER_PENSION_ON: "매월 급여 지급 시작"
 TSIN_LEDGER_PENSION_OFF: "향후 급여 지급 중단"
 TSIN_LEDGER_REFORM_NOTE: "화폐개혁·평가절하는 표시 환산만 변경하며 국고·준비금·기존 부채를 늘리지 않습니다. 이 금리는 TSIN 기업 대출에만 적용되며 기존 국가 대출을 중복 청구하지 않습니다."
 TSIN_LEDGER_FUND_NOTE: "연금은 적립금에서 농민 계층에 지급하며 실제 고령 인구를 추정하지 않습니다. 보험은 이자 미지급 6개월 지속 시 준비기금의 최대 25%를 해당 연체기에 한 번만 지급합니다. 가용 기금 이상으로 지급하지 않습니다."
