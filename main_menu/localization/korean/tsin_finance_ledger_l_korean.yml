 TSIN_LEDGER_AUDIT_BANK: "은행 감사 의뢰 (12개월)"
 TSIN_LEDGER_AUDIT_FIRM: "기업 공시 감사 의뢰 (12개월)"
 TSIN_LEDGER_BANK_LOSS_GRANT: "은행 자본 결손 보전 (국고 보조금)"
 TSIN_LEDGER_AUDIT_NOTE: "건전성·엄격 감독에서는 신규 대출에 유료 은행 감사가 필요합니다. 의무 공시에서는 신규 대출·회사채·증자에 기업 감사가 필요합니다. 유효기간은 12개월이며 은행은 자산의 1%, 기업은 거래 단위의 1%(최소 0.01두캇)를 각자 현금에서 지불합니다. 기존 이자·원금·예금 인출·영업 정리는 유지됩니다. 결손 보전은 상환 청구권·국가 지분이 없는 보조금입니다."
