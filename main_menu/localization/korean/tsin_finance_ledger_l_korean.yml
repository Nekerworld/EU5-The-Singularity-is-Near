 TSIN_LEDGER_ENTITY_REPAY: "선택 기업 원금 상환"
 TSIN_LEDGER_ENTITY_LIQUIDATE: "선택 부실 기업 청산"
 TSIN_LEDGER_ENTITY_NOTE: "시범 법인은 새로 납입한 현금을 영구 ID로 보관합니다. 기존 합산 자산·채무를 임의 배분하지 않으며 기존 기업 유형별 개수에 중복 합산하지 않습니다. 국가마다 가동 시범 은행·기업 한 곳씩 출자할 수 있고 합병으로 받은 법인은 보존합니다. 조회는 기준일의 스냅샷입니다. 유상증자는 지분을 만들지만 유상 공공계약은 기업 수입이며 국가 지분이 아닙니다. 청산은 가용 현금을 채권액에 비례해 지급하고 미지급 채권을 한 번 상각한 뒤 기업을 닫습니다. 이 법인은 재무 계정 시제품이며 자율 생산·완전한 기업 모형이 아닙니다."
