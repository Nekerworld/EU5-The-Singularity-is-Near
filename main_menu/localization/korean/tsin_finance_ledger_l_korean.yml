 TSIN_LEDGER_FOREIGN_LONG: "60개월 해외 기업 신용 · 금리 +2%p"
 TSIN_LEDGER_BANK_NOTE: "예금 영업은 별도로 개시해야 합니다. 예금은 시민 현금을 차감하고 은행의 채무로 기록하며 미지급 인출은 채권으로 남습니다. 준비금 대출은 상환해야 합니다. 해외 신용은 독립 AI의 기업 현금 계정에 계약별로 제공하며 금리·만기·통화 원금을 따로 보존합니다. 신규 계약은 현재 신용 금리를 고정하고 60개월 계약에는 2%p를 가산합니다. 계약 체결은 12개월 간격입니다. 평가절하는 해당 통화 채권의 기준 가액을 줄입니다. 기존 국가 대출과는 별도 계약입니다."
