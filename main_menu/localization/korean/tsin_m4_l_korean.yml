l_korean:

 tsin_urban_planning_advance: "도시 계획"
 tsin_urban_planning_advance_desc: "넓은 대로와 공원, 정비된 구획이 낡은 성벽과 골목을 대신하면서 도시는 더 많은 사람을 받아들일 수 있게 됩니다."
 tsin_modern_sewerage_advance: "근대 하수도"
 tsin_modern_sewerage_advance_desc: "벽돌로 쌓은 하수관이 오물을 도시 밖으로 내보내자 콜레라와 장티푸스가 눈에 띄게 줄었습니다."
 tsin_mass_consumption_advance: "대중 소비"
 tsin_mass_consumption_advance_desc: "백화점과 광고, 정찰제가 등장하면서 가구와 신문, 잡지 같은 물건이 중간 계층의 일상이 되었습니다."
 tsin_universal_education_advance: "보통 교육"
 tsin_universal_education_advance_desc: "국가가 마을마다 학교를 세우고 아이들에게 읽기와 셈을 가르칩니다."
 tsin_vocational_education_advance: "직업 교육"
 tsin_vocational_education_advance_desc: "공업 학교와 기술 학교가 기계를 다룰 줄 아는 노동자를 길러 냅니다."
 tsin_mass_communication_advance: "대중 통신"
 tsin_mass_communication_advance_desc: "값싼 신문과 전신이 소식을 하루 만에 온 나라에 퍼뜨립니다."
 tsin_labor_movement_advance: "노동 운동"
 tsin_labor_movement_advance_desc: "노동자들이 공제 조합과 노동조합을 만들어 임금과 노동 시간을 두고 고용주와 협상하기 시작합니다."
 tsin_social_insurance_advance: "사회 보험"
 tsin_social_insurance_advance_desc: "질병과 사고, 노령에 대비한 보험이 노동자의 삶을 덜 위태롭게 만듭니다."

 tsin_labor_law: "노동법"
 tsin_labor_law_desc: "공장 노동자의 나이, 노동 시간, 작업장 안전을 누가 어떻게 정할지 결정합니다."
 tsin_labor_law_CATEGORY: "SOCIOECONOMIC_LAW_CATEGORY"
 tsin_unregulated_labor_policy: "규제 없는 노동"
 tsin_unregulated_labor_policy_desc: "고용 조건은 고용주와 노동자가 정합니다. 공장은 싸게 돌아가지만 노동자의 불만이 쌓입니다."
 tsin_factory_acts_policy: "공장법"
 tsin_factory_acts_policy_desc: "아동 노동을 제한하고 하루 노동 시간에 상한을 둡니다."
 tsin_labor_protection_policy: "노동 보호"
 tsin_labor_protection_policy_desc: "공장 감독관이 안전을 점검하고 노동조합이 교섭권을 가집니다. [ShowAdvanceName('tsin_social_insurance_advance')]이 필요합니다."
 tsin_welfare_law: "복지법"
 tsin_welfare_law_desc: "가난하고 병든 사람을 누가 돌볼지 정합니다."
 tsin_welfare_law_CATEGORY: "SOCIOECONOMIC_LAW_CATEGORY"
 tsin_charity_relief_policy: "자선 구호"
 tsin_charity_relief_policy_desc: "구호는 교회와 자선 단체의 몫입니다."
 tsin_poor_law_policy: "구빈법"
 tsin_poor_law_policy_desc: "교구와 구빈원이 세금으로 최소한의 구호를 합니다."
 tsin_social_insurance_policy: "사회 보험"
 tsin_social_insurance_policy_desc: "국가가 질병·사고·노령 보험을 운영합니다."
 tsin_taxation_law: "직접세"
 tsin_taxation_law_desc: "국가 재정을 간접세에 기댈지, 소득에 직접 세금을 매길지 정합니다."
 tsin_taxation_law_CATEGORY: "SOCIOECONOMIC_LAW_CATEGORY"
 tsin_indirect_taxation_policy: "간접세 중심"
 tsin_indirect_taxation_policy_desc: "관세와 소비세가 재정의 대부분을 채웁니다."
 tsin_income_tax_policy: "소득세"
 tsin_income_tax_policy_desc: "일정 소득 이상에 같은 세율의 소득세를 매깁니다."
 tsin_progressive_taxation_policy: "누진세"
 tsin_progressive_taxation_policy_desc: "소득이 높을수록 높은 세율을 매깁니다. [ShowAdvanceName('tsin_mass_communication_advance')]이 필요합니다."
 tsin_assembly_law: "결사·집회법"
 tsin_assembly_law_desc: "시민이 모임과 단체, 정당을 만들 수 있는지 정합니다."
 tsin_assembly_law_CATEGORY: "SOCIOECONOMIC_LAW_CATEGORY"
 tsin_assembly_banned_policy: "집회 금지"
 tsin_assembly_banned_policy_desc: "허가 없는 모임은 모두 금지됩니다."
 tsin_licensed_associations_policy: "허가제 결사"
 tsin_licensed_associations_policy_desc: "경찰의 허가를 받은 단체만 활동할 수 있습니다."
 tsin_free_association_policy: "결사의 자유"
 tsin_free_association_policy_desc: "누구나 단체와 정당을 만들 수 있습니다. [ShowAdvanceName('tsin_labor_movement_advance')]이 필요합니다."
 tsin_land_reform_law: "토지 개혁"
 tsin_land_reform_law_desc: "농노제를 유지할지, 농민을 해방할지 정합니다."
 tsin_land_reform_law_CATEGORY: "SOCIOECONOMIC_LAW_CATEGORY"
 tsin_serfdom_retained_policy: "농노제 유지"
 tsin_serfdom_retained_policy_desc: "농민은 영주의 땅에 묶여 부역을 계속합니다."
 tsin_redemption_payments_policy: "유상 해방"
 tsin_redemption_payments_policy_desc: "농민은 자유를 얻지만 땅값을 오랫동안 갚아야 합니다."
 tsin_full_emancipation_policy: "완전 해방"
 tsin_full_emancipation_policy_desc: "농민은 보상 없이 자유와 땅을 얻습니다. 귀족의 힘이 크게 줄어듭니다."
 tsin_church_state_law: "교회와 국가"
 tsin_church_state_law_desc: "국가와 교회의 관계를 정합니다."
 tsin_church_state_law_CATEGORY: "SOCIOECONOMIC_LAW_CATEGORY"
 tsin_established_church_policy: "국교"
 tsin_established_church_policy_desc: "국교회가 교육과 혼인을 맡고 국가의 보호를 받습니다."
 tsin_concordat_policy: "정교 협약"
 tsin_concordat_policy_desc: "국가와 교회가 협약으로 서로의 권한을 나눕니다."
 tsin_separation_of_church_and_state_policy: "정교 분리"
 tsin_separation_of_church_and_state_policy_desc: "국가는 종교에 중립을 지키고 교육은 세속화됩니다."
