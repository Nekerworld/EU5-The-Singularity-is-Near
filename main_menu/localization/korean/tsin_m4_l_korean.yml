l_korean:

 tsin_urban_planning_advance: "도시 계획"
 tsin_urban_planning_advance_desc: "넓은 대로와 공원, 정비된 구획이 낡은 성벽과 골목을 대신하면서 도시는 더 많은 사람을 받아들일 수 있게 됩니다."
 tsin_modern_sewerage_advance: "근대 하수도"
 tsin_modern_sewerage_advance_desc: "벽돌로 쌓은 하수관이 오물을 도시 밖으로 내보내자 콜레라와 장티푸스가 눈에 띄게 줄었습니다."
 tsin_mass_consumption_advance: "대중 소비"
 tsin_mass_consumption_advance_desc: "백화점과 광고, 정찰제가 등장하면서 가구와 신문, 잡지 같은 물건이 중간 계층의 일상이 되었습니다."
 tsin_universal_education_advance: "보통 교육"
 tsin_universal_education_advance_desc: "국가가 마을마다 학교를 세우고 아이들에게 읽기와 셈을 가르칩니다."
 tsin_vocational_education_advance: "직업 교육"
 tsin_vocational_education_advance_desc: "공업 학교와 기술 학교가 기계를 다룰 줄 아는 노동자를 길러 냅니다."
 tsin_mass_communication_advance: "대중 통신"
 tsin_mass_communication_advance_desc: "값싼 신문과 전신이 소식을 하루 만에 온 나라에 퍼뜨립니다."
 tsin_labor_movement_advance: "노동 운동"
 tsin_labor_movement_advance_desc: "노동자들이 공제 조합과 노동조합을 만들어 임금과 노동 시간을 두고 고용주와 협상하기 시작합니다."
 tsin_social_insurance_advance: "사회 보험"
 tsin_social_insurance_advance_desc: "질병과 사고, 노령에 대비한 보험이 노동자의 삶을 덜 위태롭게 만듭니다."

 tsin_labor_law: "노동법"
 tsin_labor_law_desc: "공장 노동자의 나이, 노동 시간, 작업장 안전을 누가 어떻게 정할지 결정합니다."
 tsin_labor_law_CATEGORY: "SOCIOECONOMIC_LAW_CATEGORY"
 tsin_unregulated_labor_policy: "규제 없는 노동"
 tsin_unregulated_labor_policy_desc: "고용 조건은 고용주와 노동자가 정합니다. 공장은 싸게 돌아가지만 노동자의 불만이 쌓입니다."
 tsin_factory_acts_policy: "공장법"
 tsin_factory_acts_policy_desc: "아동 노동을 제한하고 하루 노동 시간에 상한을 둡니다."
 tsin_labor_protection_policy: "노동 보호"
 tsin_labor_protection_policy_desc: "공장 감독관이 안전을 점검하고 노동조합이 교섭권을 가집니다. [ShowAdvanceName('tsin_social_insurance_advance')]이 필요합니다."
 tsin_welfare_law: "복지법"
 tsin_welfare_law_desc: "가난하고 병든 사람을 누가 돌볼지 정합니다."
 tsin_welfare_law_CATEGORY: "SOCIOECONOMIC_LAW_CATEGORY"
 tsin_charity_relief_policy: "자선 구호"
 tsin_charity_relief_policy_desc: "구호는 교회와 자선 단체의 몫입니다."
 tsin_poor_law_policy: "구빈법"
 tsin_poor_law_policy_desc: "교구와 구빈원이 세금으로 최소한의 구호를 합니다."
 tsin_social_insurance_policy: "사회 보험"
 tsin_social_insurance_policy_desc: "국가가 질병·사고·노령 보험을 운영합니다."
 tsin_taxation_law: "직접세"
 tsin_taxation_law_desc: "국가 재정을 간접세에 기댈지, 소득에 직접 세금을 매길지 정합니다."
 tsin_taxation_law_CATEGORY: "SOCIOECONOMIC_LAW_CATEGORY"
 tsin_indirect_taxation_policy: "간접세 중심"
 tsin_indirect_taxation_policy_desc: "관세와 소비세가 재정의 대부분을 채웁니다."
 tsin_income_tax_policy: "소득세"
 tsin_income_tax_policy_desc: "일정 소득 이상에 같은 세율의 소득세를 매깁니다."
 tsin_progressive_taxation_policy: "누진세"
 tsin_progressive_taxation_policy_desc: "소득이 높을수록 높은 세율을 매깁니다. [ShowAdvanceName('tsin_mass_communication_advance')]이 필요합니다."
 tsin_assembly_law: "결사·집회법"
 tsin_assembly_law_desc: "시민이 모임과 단체, 정당을 만들 수 있는지 정합니다."
 tsin_assembly_law_CATEGORY: "SOCIOECONOMIC_LAW_CATEGORY"
 tsin_assembly_banned_policy: "집회 금지"
 tsin_assembly_banned_policy_desc: "허가 없는 모임은 모두 금지됩니다."
 tsin_licensed_associations_policy: "허가제 결사"
 tsin_licensed_associations_policy_desc: "경찰의 허가를 받은 단체만 활동할 수 있습니다."
 tsin_free_association_policy: "결사의 자유"
 tsin_free_association_policy_desc: "누구나 단체와 정당을 만들 수 있습니다. [ShowAdvanceName('tsin_labor_movement_advance')]이 필요합니다."
 tsin_land_reform_law: "토지 개혁"
 tsin_land_reform_law_desc: "농노제를 유지할지, 농민을 해방할지 정합니다."
 tsin_land_reform_law_CATEGORY: "SOCIOECONOMIC_LAW_CATEGORY"
 tsin_serfdom_retained_policy: "농노제 유지"
 tsin_serfdom_retained_policy_desc: "농민은 영주의 땅에 묶여 부역을 계속합니다."
 tsin_redemption_payments_policy: "유상 해방"
 tsin_redemption_payments_policy_desc: "농민은 자유를 얻지만 땅값을 오랫동안 갚아야 합니다."
 tsin_full_emancipation_policy: "완전 해방"
 tsin_full_emancipation_policy_desc: "농민은 보상 없이 자유와 땅을 얻습니다. 귀족의 힘이 크게 줄어듭니다."
 tsin_church_state_law: "교회와 국가"
 tsin_church_state_law_desc: "국가와 교회의 관계를 정합니다."
 tsin_church_state_law_CATEGORY: "SOCIOECONOMIC_LAW_CATEGORY"
 tsin_established_church_policy: "국교"
 tsin_established_church_policy_desc: "국교회가 교육과 혼인을 맡고 국가의 보호를 받습니다."
 tsin_concordat_policy: "정교 협약"
 tsin_concordat_policy_desc: "국가와 교회가 협약으로 서로의 권한을 나눕니다."
 tsin_separation_of_church_and_state_policy: "정교 분리"
 tsin_separation_of_church_and_state_policy_desc: "국가는 종교에 중립을 지키고 교육은 세속화됩니다."

 tsin_slave_trade_law: "노예무역"
 tsin_slave_trade_law_desc: "노예제 자체와 별도로 노예를 사고파는 무역을 허용할지 정합니다. 노예제가 폐지되면 이 법은 사라집니다."
 tsin_slave_trade_law_CATEGORY: "SOCIOECONOMIC_LAW_CATEGORY"
 tsin_slave_trade_tolerated_policy: "노예무역 용인"
 tsin_slave_trade_tolerated_policy_desc: "노예무역은 다른 무역과 다르지 않게 취급됩니다."
 tsin_slave_trade_suppressed_policy: "노예무역 금지"
 tsin_slave_trade_suppressed_policy_desc: "노예의 수입과 수출을 금지하고 해군이 노예선을 단속합니다. 이미 있는 노예는 그대로 남습니다."
 pa_tsin_abolish_slavery: "노예제 폐지"
 pa_tsin_abolish_slavery_simple: "노예제 폐지"
 pa_tsin_abolish_slavery_desc: "노예 소유를 법으로 금지합니다. 폐지 운동이 강할 때만 상정됩니다."
 STATIC_MODIFIER_NAME_tsin_abolitionists_suppressed: "폐지론자 탄압"
 STATIC_MODIFIER_NAME_tsin_emancipation_shock: "해방의 충격"
 STATIC_MODIFIER_NAME_tsin_apprenticeship_system: "도제 기간"
 tsin_abolition.emancipate_tt: "우리 나라의 모든 노예 인구가 농민이 됩니다."
 tsin_abolition.1.title: "폐지론자들의 청원"
 tsin_abolition.1.desc: "수만 명이 서명한 청원서가 도착했습니다. 노예무역과 노예제를 끝내라는 요구가 교회와 신문을 통해 퍼지고 있습니다."
 tsin_abolition.1.a: "청원인들을 맞아들인다."
 tsin_abolition.1.b: "해군에 노예선을 단속하게 한다."
 tsin_abolition.1.c: "선동가들의 입을 막는다."
 tsin_abolition.2.title: "해방"
 tsin_abolition.2.desc: "노예제는 법으로 폐지되었지만 농장과 저택에는 아직 노예들이 남아 있습니다. 그들을 어떻게 풀어 줄지 정해야 합니다."
 tsin_abolition.2.a: "즉시 해방한다."
 tsin_abolition.2.b: "소유주에게 보상하고 해방한다."
 tsin_abolition.2.c: "먼저 도제 기간을 둔다."
 tsin_abolition.2.c.tt: "6년 뒤 모든 노예 인구가 농민이 됩니다."
 tsin_abolition.3.title: "도제 기간의 끝"
 tsin_abolition.3.desc: "약속한 도제 기간이 끝났습니다. 남아 있던 모든 노예가 오늘부터 자유인입니다."
 tsin_abolition.3.a: "자유의 날이다."
 tsin_abolition.4.title: "해안의 노예 요새"
 tsin_abolition.4.desc: "노예무역을 금지했는데도 우리 해안에는 여전히 외국 상인의 노예 요새가 서 있습니다."
 tsin_abolition.4.a: "요새를 처리한다."
 tsin_abolition.4.b: "못 본 척한다."
 tsin_factory_inspectorate: "공장 감독관"
 tsin_factory_inspectorate_desc: "국가가 감독관을 보내 공장의 노동 시간과 안전을 점검합니다. 공장주들은 불평하지만 노동자들은 처음으로 법의 보호를 느낍니다."
 tsin_civil_service_examinations: "공무원 시험제"
 tsin_civil_service_examinations_desc: "관직은 이제 가문이 아니라 시험으로 얻습니다. 행정은 유능해지지만 귀족은 오래된 특권을 잃습니다."
 tsin_universal_conscription: "국민 개병제"
 tsin_universal_conscription_desc: "모든 성인 남성이 일정 기간 군에 복무하고 예비군으로 남습니다."
 tsin_railway_nationalization: "철도 국유화"
 tsin_railway_nationalization_desc: "간선 철도를 국가가 소유하고 운영합니다. 민간 철도 회사들은 이 결정을 반기지 않습니다."
 tsin_chambers_of_commerce: "상공회의소"
 tsin_chambers_of_commerce_desc: "상공업자들이 법적으로 인정된 회의소를 통해 정부에 의견을 내고 공장 설립을 조정합니다."
 tsin_officer_corps_monopoly: "장교단 독점"
 tsin_officer_corps_monopoly_desc: "고위 장교직은 귀족 가문 출신에게만 열려 있습니다."
 tsin_church_school_network: "교회 학교망"
 tsin_church_school_network_desc: "초등 교육은 교회가 맡습니다. 정교 분리 정책을 시행하면 이 특권은 나타나지 않습니다."
 tsin_mutual_aid_societies: "공제 조합"
 tsin_mutual_aid_societies_desc: "노동자들이 회비를 모아 질병과 사고에 대비하는 조합을 국가가 인정합니다."
 pa_tsin_factory_acts: "공장법 제정"
 pa_tsin_factory_acts_simple: "공장법 제정"
 pa_tsin_factory_acts_desc: "노동 규제 없음 정책을 공장법 정책으로 바꿉니다."
 pa_tsin_restore_landlord_rights: "지주 권리 회복"
 pa_tsin_restore_landlord_rights_desc: "유상 해방을 되돌리고 농노제 유지 정책으로 돌아갑니다."
 pa_tsin_restore_landlord_rights_simple: "지주 권리 회복"
 pa_tsin_railway_charters: "철도 회사 특허"
 pa_tsin_railway_charters_simple: "철도 회사 특허"
 pa_tsin_railway_charters_desc: "민간 철도 회사에 10년 동안 부설 특허를 줍니다. 철도를 국유화했다면 상정되지 않습니다."
 pa_tsin_restore_concordat: "정교 협약 회복"
 pa_tsin_restore_concordat_simple: "정교 협약 회복"
 pa_tsin_restore_concordat_desc: "정교 분리를 되돌리고 정교 협약 정책으로 돌아갑니다."
 STATIC_MODIFIER_NAME_tsin_railway_charters_granted: "철도 회사 특허"
 STATIC_MODIFIER_NAME_tsin_liberalism_agitation: "자유주의 선동"
 STATIC_MODIFIER_NAME_tsin_nationalism_agitation: "민족주의 열기"
 STATIC_MODIFIER_NAME_tsin_labor_unionism_agitation: "노동 운동 선동"
 STATIC_MODIFIER_NAME_tsin_socialism_agitation: "사회주의 선동"
 STATIC_MODIFIER_NAME_tsin_womens_suffrage_agitation: "여성 참정권 운동"
 pa_tsin_freedom_of_association: "결사의 자유"
 pa_tsin_freedom_of_association_simple: "결사의 자유"
 pa_tsin_freedom_of_association_desc: "자유주의자들의 요구에 따라 결사의 자유 정책을 시행합니다. 자유주의 운동이 누그러집니다."
 pa_tsin_social_insurance: "사회 보험 도입"
 pa_tsin_social_insurance_simple: "사회 보험 도입"
 pa_tsin_social_insurance_desc: "노동자들의 요구에 따라 사회 보험 정책을 시행합니다. 사회주의 운동이 누그러집니다."
