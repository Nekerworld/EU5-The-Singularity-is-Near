l_korean:

 tsin_urban_planning_advance: "도시 계획"
 tsin_urban_planning_advance_desc: "넓은 대로와 공원, 정비된 구획이 낡은 성벽과 골목을 대신하면서 도시는 더 많은 사람을 받아들일 수 있게 됩니다([population_capacity|e], [tsin_housing_concept|e])."
 tsin_modern_sewerage_advance: "근대 하수도"
 tsin_modern_sewerage_advance_desc: "벽돌로 쌓은 하수관이 오물을 도시 밖으로 내보내자 콜레라와 장티푸스 같은 [diseases|e]이 눈에 띄게 줄었습니다([tsin_public_health_concept|e])."
 tsin_mass_consumption_advance: "대중 소비"
 tsin_mass_consumption_advance_desc: "백화점과 광고, 정찰제가 등장하면서 가구와 신문, 잡지 같은 물건이 중간 계층의 일상이 되었습니다."
 tsin_universal_education_advance: "보통 교육"
 tsin_universal_education_advance_desc: "국가가 마을마다 학교를 세우고 아이들에게 읽기와 셈을 가르쳐, [tsin_education_ladder_concept|e]의 첫 단계인 [literacy|e]을 높입니다."
 tsin_vocational_education_advance: "직업 교육"
 tsin_vocational_education_advance_desc: "공업 학교와 기술 학교가 기계를 다룰 줄 아는 노동자를 길러 냅니다."
 tsin_mass_communication_advance: "대중 통신"
 tsin_mass_communication_advance_desc: "값싼 신문과 전신이 소식을 하루 만에 온 나라에 퍼뜨립니다."
 tsin_labor_movement_advance: "노동 운동"
 tsin_labor_movement_advance_desc: "노동자들이 공제 조합과 노동조합을 만들어 임금과 노동 시간을 두고 고용주와 협상하기 시작합니다. 이제부터 [tsin_movements_concept|e] 가운데 노동 운동이 더 빨리 자랍니다."
 tsin_social_insurance_advance: "사회 보험"
 tsin_social_insurance_advance_desc: "질병과 사고, 노령에 대비한 보험이 노동자의 삶을 덜 위태롭게 만듭니다."

 tsin_labor_law: "노동법"
 tsin_labor_law_desc: "공장 노동자의 나이, 노동 시간, 작업장 안전을 누가 어떻게 정할지 결정합니다. [tsin_social_laws_concept|e] 가운데 하나이며, [parliament|e]가 있는 대중사회에서는 [policies|e]을 [tsin_bills_concept|e]으로만 바꿀 수 있습니다."
 tsin_labor_law_CATEGORY: "SOCIOECONOMIC_LAW_CATEGORY"
 tsin_unregulated_labor_policy: "규제 없는 노동"
 tsin_unregulated_labor_policy_desc: "고용 조건은 고용주와 노동자가 정합니다. 공장은 싸게 돌아가지만 노동자의 불만이 쌓입니다."
 tsin_factory_acts_policy: "공장법"
 tsin_factory_acts_policy_desc: "아동 노동을 제한하고 하루 노동 시간에 상한을 둡니다."
 tsin_labor_protection_policy: "노동 보호"
 tsin_labor_protection_policy_desc: "공장 감독관이 안전을 점검하고 노동조합이 교섭권을 가집니다. [ShowAdvanceName('tsin_social_insurance_advance')]이 필요합니다."
 tsin_welfare_law: "복지법"
 tsin_welfare_law_desc: "가난하고 병든 사람을 누가 돌볼지 정합니다. [tsin_social_laws_concept|e] 가운데 하나이며, [parliament|e]가 있는 대중사회에서는 [policies|e]을 [tsin_bills_concept|e]으로만 바꿀 수 있습니다."
 tsin_welfare_law_CATEGORY: "SOCIOECONOMIC_LAW_CATEGORY"
 tsin_charity_relief_policy: "자선 구호"
 tsin_charity_relief_policy_desc: "구호는 교회와 자선 단체의 몫입니다."
 tsin_poor_law_policy: "구빈법"
 tsin_poor_law_policy_desc: "교구와 구빈원이 세금으로 최소한의 구호를 합니다."
 tsin_social_insurance_policy: "사회 보험"
 tsin_social_insurance_policy_desc: "국가가 질병·사고·노령 보험을 운영합니다."
 tsin_taxation_law: "직접세"
 tsin_taxation_law_desc: "국가 재정을 간접세에 기댈지, 소득에 직접 세금을 매길지 정합니다. [tsin_social_laws_concept|e] 가운데 하나이며, [parliament|e]가 있는 대중사회에서는 [policies|e]을 [tsin_bills_concept|e]으로만 바꿀 수 있습니다."
 tsin_taxation_law_CATEGORY: "SOCIOECONOMIC_LAW_CATEGORY"
 tsin_indirect_taxation_policy: "간접세 중심"
 tsin_indirect_taxation_policy_desc: "관세와 소비세가 재정의 대부분을 채웁니다."
 tsin_income_tax_policy: "소득세"
 tsin_income_tax_policy_desc: "일정 소득 이상에 같은 세율의 소득세를 매깁니다."
 tsin_progressive_taxation_policy: "누진세"
 tsin_progressive_taxation_policy_desc: "소득이 높을수록 높은 세율을 매깁니다. [ShowAdvanceName('tsin_mass_communication_advance')]이 필요합니다."
 tsin_assembly_law: "결사·집회법"
 tsin_assembly_law_desc: "시민이 모임과 단체, 정당을 만들 수 있는지 정합니다. [tsin_social_laws_concept|e] 가운데 하나이며, [parliament|e]가 있는 대중사회에서는 [policies|e]을 [tsin_bills_concept|e]으로만 바꿀 수 있습니다."
 tsin_assembly_law_CATEGORY: "SOCIOECONOMIC_LAW_CATEGORY"
 tsin_assembly_banned_policy: "집회 금지"
 tsin_assembly_banned_policy_desc: "허가 없는 모임은 모두 금지됩니다."
 tsin_licensed_associations_policy: "허가제 결사"
 tsin_licensed_associations_policy_desc: "경찰의 허가를 받은 단체만 활동할 수 있습니다."
 tsin_free_association_policy: "결사의 자유"
 tsin_free_association_policy_desc: "누구나 단체와 정당을 만들 수 있습니다. [ShowAdvanceName('tsin_labor_movement_advance')]이 필요합니다."
 tsin_land_reform_law: "토지 개혁"
 tsin_land_reform_law_desc: "농노제를 유지할지, 농민을 해방할지 정합니다. [tsin_social_laws_concept|e] 가운데 하나이며, [parliament|e]가 있는 대중사회에서는 [policies|e]을 [tsin_bills_concept|e]으로만 바꿀 수 있습니다."
 tsin_land_reform_law_CATEGORY: "SOCIOECONOMIC_LAW_CATEGORY"
 tsin_serfdom_retained_policy: "농노제 유지"
 tsin_serfdom_retained_policy_desc: "농민은 영주의 땅에 묶여 부역을 계속합니다."
 tsin_redemption_payments_policy: "유상 해방"
 tsin_redemption_payments_policy_desc: "농민은 자유를 얻지만 땅값을 오랫동안 갚아야 합니다."
 tsin_full_emancipation_policy: "완전 해방"
 tsin_full_emancipation_policy_desc: "농민은 보상 없이 자유와 땅을 얻습니다. 귀족의 [estate_power|e]이 크게 줄어듭니다."
 tsin_church_state_law: "교회와 국가"
 tsin_church_state_law_desc: "국가와 교회의 관계를 정합니다. [tsin_social_laws_concept|e] 가운데 하나이며, [parliament|e]가 있는 대중사회에서는 [policies|e]을 [tsin_bills_concept|e]으로만 바꿀 수 있습니다."
 tsin_church_state_law_CATEGORY: "SOCIOECONOMIC_LAW_CATEGORY"
 tsin_established_church_policy: "국교"
 tsin_established_church_policy_desc: "국교회가 교육과 혼인을 맡고 국가의 보호를 받습니다."
 tsin_concordat_policy: "정교 협약"
 tsin_concordat_policy_desc: "국가와 교회가 협약으로 서로의 권한을 나눕니다."
 tsin_separation_of_church_and_state_policy: "정교 분리"
 tsin_separation_of_church_and_state_policy_desc: "국가는 종교에 중립을 지키고 교육은 세속화됩니다."

 tsin_slave_trade_law: "노예무역"
 tsin_slave_trade_law_desc: "노예제([slavery|e]) 자체와 별도로 노예를 사고파는 무역을 허용할지 정합니다. 노예제가 폐지되면 이 법은 사라집니다([tsin_abolition_concept|e]). [parliament|e]가 있는 대중사회에서는 [policies|e]을 [tsin_bills_concept|e]으로만 바꿀 수 있습니다."
 tsin_slave_trade_law_CATEGORY: "SOCIOECONOMIC_LAW_CATEGORY"
 tsin_slave_trade_tolerated_policy: "노예무역 용인"
 tsin_slave_trade_tolerated_policy_desc: "노예무역은 다른 무역과 다르지 않게 취급됩니다."
 tsin_slave_trade_suppressed_policy: "노예무역 금지"
 tsin_slave_trade_suppressed_policy_desc: "노예의 수입과 수출을 금지하고 해군이 노예선을 단속합니다. 이미 있는 노예는 그대로 남습니다."
 pa_tsin_abolish_slavery: "노예제 폐지"
 pa_tsin_abolish_slavery_simple: "노예제 폐지"
 pa_tsin_abolish_slavery_desc: "노예 소유를 법으로 금지합니다. 폐지 운동이 강할 때만 상정됩니다."
 STATIC_MODIFIER_NAME_tsin_abolitionists_suppressed: "폐지론자 탄압"
 STATIC_MODIFIER_NAME_tsin_emancipation_shock: "해방의 충격"
 STATIC_MODIFIER_NAME_tsin_apprenticeship_system: "도제 기간"
 tsin_abolition.emancipate_tt: "우리 나라의 모든 노예 인구가 농민이 됩니다."
 tsin_abolition.1.title: "폐지론자들의 청원"
 tsin_abolition.1.desc: "수만 명이 서명한 청원서가 도착했습니다. 노예무역과 노예제를 끝내라는 요구가 교회와 신문을 통해 퍼지고 있습니다."
 tsin_abolition.1.a: "청원인들을 맞아들인다."
 tsin_abolition.1.b: "해군에 노예선을 단속하게 한다."
 tsin_abolition.1.c: "선동가들의 입을 막는다."
 tsin_abolition.2.title: "해방"
 tsin_abolition.2.desc: "노예제는 법으로 폐지되었지만 농장과 저택에는 아직 노예들이 남아 있습니다. 그들을 어떻게 풀어 줄지 정해야 합니다."
 tsin_abolition.2.a: "즉시 해방한다."
 tsin_abolition.2.b: "소유주에게 보상하고 해방한다."
 tsin_abolition.2.c: "먼저 도제 기간을 둔다."
 tsin_abolition.2.c.tt: "6년 뒤 모든 노예 인구가 농민이 됩니다."
 tsin_abolition.3.title: "도제 기간의 끝"
 tsin_abolition.3.desc: "약속한 도제 기간이 끝났습니다. 남아 있던 모든 노예가 오늘부터 자유인입니다."
 tsin_abolition.3.a: "자유의 날이다."
 tsin_abolition.4.title: "해안의 노예 요새"
 tsin_abolition.4.desc: "노예무역을 금지했는데도 우리 해안에는 여전히 외국 상인의 노예 요새가 서 있습니다."
 tsin_abolition.4.a: "요새를 처리한다."
 tsin_abolition.4.b: "못 본 척한다."
 tsin_factory_inspectorate: "공장 감독관"
 tsin_factory_inspectorate_desc: "국가가 감독관을 보내 공장의 노동 시간과 안전을 점검합니다. 공장주들은 불평하지만 노동자들은 처음으로 법의 보호를 느낍니다."
 tsin_civil_service_examinations: "공무원 시험제"
 tsin_civil_service_examinations_desc: "관직은 이제 가문이 아니라 시험으로 얻습니다. 행정은 유능해지지만 귀족은 오래된 특권을 잃습니다."
 tsin_universal_conscription: "국민 개병제"
 tsin_universal_conscription_desc: "모든 성인 남성이 일정 기간 군에 복무하고 예비군으로 남습니다."
 tsin_railway_nationalization: "철도 국유화"
 tsin_railway_nationalization_desc: "간선 철도를 국가가 소유하고 운영합니다. 민간 철도 회사들은 이 결정을 반기지 않습니다."
 tsin_chambers_of_commerce: "상공회의소"
 tsin_chambers_of_commerce_desc: "상공업자들이 법적으로 인정된 회의소를 통해 정부에 의견을 내고 공장 설립을 조정합니다."
 tsin_officer_corps_monopoly: "장교단 독점"
 tsin_officer_corps_monopoly_desc: "고위 장교직은 귀족 가문 출신에게만 열려 있습니다."
 tsin_church_school_network: "교회 학교망"
 tsin_church_school_network_desc: "초등 교육과 그에 따른 [literacy|e]은 교회가 맡습니다. [ShowPolicyName('tsin_separation_of_church_and_state_policy')] 정책을 시행하면 이 특권은 나타나지 않습니다."
 tsin_mutual_aid_societies: "공제 조합"
 tsin_mutual_aid_societies_desc: "노동자들이 회비를 모아 질병과 사고에 대비하는 조합을 국가가 인정합니다. [ShowEstatePrivilegeName('tsin_union_recognition')]으로 가는 첫걸음입니다([tsin_estate_privileges_concept|e])."
 pa_tsin_factory_acts: "공장법 제정"
 pa_tsin_factory_acts_simple: "공장법 제정"
 pa_tsin_factory_acts_desc: "노동 규제 없음 정책을 공장법 정책으로 바꿉니다."
 pa_tsin_restore_landlord_rights: "지주 권리 회복"
 pa_tsin_restore_landlord_rights_desc: "유상 해방을 되돌리고 농노제 유지 정책으로 돌아갑니다."
 pa_tsin_restore_landlord_rights_simple: "지주 권리 회복"
 pa_tsin_railway_charters: "철도 회사 특허"
 pa_tsin_railway_charters_simple: "철도 회사 특허"
 pa_tsin_railway_charters_desc: "민간 철도 회사에 10년 동안 부설 특허를 줍니다. 철도를 국유화했다면 상정되지 않습니다."
 pa_tsin_restore_concordat: "정교 협약 회복"
 pa_tsin_restore_concordat_simple: "정교 협약 회복"
 pa_tsin_restore_concordat_desc: "정교 분리를 되돌리고 정교 협약 정책으로 돌아갑니다."
 STATIC_MODIFIER_NAME_tsin_railway_charters_granted: "철도 회사 특허"
 STATIC_MODIFIER_NAME_tsin_liberalism_agitation: "자유주의 선동"
 STATIC_MODIFIER_NAME_tsin_nationalism_agitation: "민족주의 열기"
 STATIC_MODIFIER_NAME_tsin_labor_unionism_agitation: "노동 운동 선동"
 STATIC_MODIFIER_NAME_tsin_socialism_agitation: "사회주의 선동"
 STATIC_MODIFIER_NAME_tsin_womens_suffrage_agitation: "여성 참정권 운동"
 pa_tsin_freedom_of_association: "결사의 자유"
 pa_tsin_freedom_of_association_simple: "결사의 자유"
 pa_tsin_freedom_of_association_desc: "자유주의자들의 요구에 따라 결사의 자유 정책을 시행합니다. 자유주의 운동이 누그러집니다."
 pa_tsin_social_insurance: "사회 보험 도입"
 pa_tsin_social_insurance_simple: "사회 보험 도입"
 pa_tsin_social_insurance_desc: "노동자들의 요구에 따라 사회 보험 정책을 시행합니다. 사회주의 운동이 누그러집니다."
 tsin_springtime_of_nations: "국민의 봄"
 tsin_springtime_of_nations_desc: "자유주의자, 민족주의자, 사회주의자들이 여러 나라의 수도에서 동시에 바리케이드를 쌓았습니다. 각국 정부는 헌법을 내어 줄지, 무력으로 질서를 되찾을지 정해야 합니다. 이 물결은 3년 뒤 잦아듭니다.\n\n참고: [tsin_springtime_of_nations_concept|e]"
 tsin_springtime_of_nations_wave_spent: "물결이 잦아듦"
 tsin_springtime_of_nations_affected_tt: "이 [location|e]의 소유국에서 혁명이 벌어지고 있습니다."
 LEGEND_KEY_TSIN_SPRINGTIME_AFFECTED: "혁명이 벌어지는 나라"
 LEGEND_KEY_TSIN_SPRINGTIME_RESTLESS: "운동이 강한 나라"
 hint_tsin_springtime_of_nations: "[GetSituationByKey('tsin_springtime_of_nations').GetNameWithNoTooltip]"
 hint_tsin_springtime_of_nations_hint_text: "[GetSituationByKey('tsin_springtime_of_nations').GetName]이 시작되었습니다. 자유주의·민족주의·사회주의 운동이 강한 나라에 바리케이드가 섰습니다.\n\n#T 권장 행동:#!\n@arrow_bonus_tier_3! 헌법을 내어 주면 운동이 누그러지지만 귀족이 불만을 품습니다.\n@arrow_bonus_tier_2! 무력 진압은 왕권을 지키지만 물결이 끝난 뒤 운동이 더 거세집니다."
 hint_tsin_springtime_of_nations_diplomatic: "\"이웃 나라의 혁명은 국경을 넘어 번집니다.\""
 hint_tsin_springtime_of_nations_administrative: "\"양보는 한 번으로 끝나지 않습니다.\""
 hint_tsin_springtime_of_nations_military: "\"군대가 시민에게 총을 겨누기를 거부할 수도 있습니다.\""
 STATIC_MODIFIER_NAME_tsin_springtime_barricades: "바리케이드"
 STATIC_MODIFIER_NAME_tsin_springtime_constitution: "3월 헌법"
 STATIC_MODIFIER_NAME_tsin_springtime_reaction: "반동"
 tsin_springtime.1.title: "바리케이드"
 tsin_springtime.1.desc: "수도의 거리마다 바리케이드가 세워졌습니다. 군중은 헌법, 언론의 자유, 민족의 권리를 외치고 있습니다. 이웃 나라들에서도 같은 일이 벌어지고 있습니다."
 tsin_springtime.1.a: "헌법을 내어 준다."
 tsin_springtime.1.b: "무력으로 질서를 되찾는다."
 tsin_springtime.1.c: "사태를 지켜본다."
 tsin_springtime.2.title: "수도의 시가전"
 tsin_springtime.2.desc: "시민 위원회가 수도의 몇 구역을 장악했습니다. 그들은 협상을 원하지만, 장교들은 진압 명령을 기다리고 있습니다."
 tsin_springtime.2.a: "위원회와 협상한다."
 tsin_springtime.2.b: "군대를 보낸다."
 tsin_springtime.10.title: "봄의 끝"
 tsin_springtime.10.desc: "혁명의 물결이 잦아들었습니다. 바리케이드는 치워졌지만, 그 시절의 약속과 상처는 남아 있습니다."
 tsin_springtime.10.a: "헌법은 지켜졌다."
 tsin_springtime.10.b: "질서는 회복되었지만 원한은 남았다."
 tsin_springtime.10.c: "폭풍은 지나갔다."
 tsin_great_hunger: "대기근"
 tsin_great_hunger_desc: "병충해가 들판을 휩쓸었고, 굶주린 농민들이 마을을 떠나고 있습니다. 항구마다 이민선을 기다리는 사람들이 줄을 섰습니다. 기근은 적어도 4년 동안 이어지며, 병충해가 사라져야 끝납니다.\n\n참고: [tsin_great_hunger_concept|e]"
 STATIC_MODIFIER_NAME_tsin_crop_blight: "병충해"
 STATIC_MODIFIER_NAME_tsin_famine_relief: "기근 구호"
 STATIC_MODIFIER_NAME_tsin_food_exports_continue: "식량 수출 지속"
 STATIC_MODIFIER_NAME_tsin_mass_emigration: "대이민"
 STATIC_MODIFIER_NAME_tsin_agricultural_reform: "농업 개혁"
 tsin_hunger.1.title: "들판의 병충해"
 tsin_hunger.1.desc: "주식 작물의 잎이 검게 시들고 땅속의 열매가 썩어 가고 있습니다. 농민들은 올해 수확이 절반도 안 될 것이라고 말합니다."
 tsin_hunger.1.a: "하늘이 무심하구나."
 tsin_hunger.2.title: "기근"
 tsin_hunger.2.desc: "흉작이 이어지면서 농촌에 굶주림이 퍼졌습니다. 그런데도 지주와 상인들은 곡물을 외국에 내다 팔고 있습니다."
 tsin_hunger.2.a: "외국 곡물을 사들인다."
 tsin_hunger.2.b: "시장에 손대지 않는다."
 tsin_hunger.2.c: "굶주린 이들에게 공공 사업을 준다."
 tsin_hunger.3.title: "이민선"
 tsin_hunger.3.desc: "수많은 가족이 마지막 재산을 팔아 바다 건너로 가는 배표를 사고 있습니다."
 tsin_hunger.3.a: "떠나게 둔다."
 tsin_hunger.3.b: "우리 식민지로 가는 뱃삯을 대 준다."
 tsin_hunger.4.title: "퇴거와 식량 폭동"
 tsin_hunger.4.desc: "지대를 내지 못한 소작농들이 쫓겨나고 있습니다. 성난 군중이 곡물 창고를 습격했습니다."
 tsin_hunger.4.a: "소작농 편에 선다."
 tsin_hunger.4.b: "지주의 권리를 지킨다."
 tsin_hunger.10.title: "기근 이후"
 tsin_hunger.10.desc: "기근은 끝났지만 마을은 텅 비었습니다. 남은 이들은 이 일을 오래 기억할 것입니다."
 tsin_hunger.10.a: "다시는 이런 일이 없도록."
 tsin_hunger.10.b: "농업을 개혁한다."
 STATIC_MODIFIER_NAME_tsin_strike_broken: "파업 진압"
 STATIC_MODIFIER_NAME_tsin_state_schools: "공립 학교"
 STATIC_MODIFIER_NAME_tsin_sanitary_reform: "위생 개혁"
 STATIC_MODIFIER_NAME_tsin_quarantine: "격리"
 tsin_society.10.title: "인민헌장"
 tsin_society.10.desc: "모든 성인 남성의 투표권, 비밀 투표, 매년 선거를 요구하는 청원서에 수백만 명이 서명했습니다. 청원서를 실은 수레가 의사당 앞에 멈춰 섰습니다."
 tsin_society.10.a: "의회가 논의하게 한다."
 tsin_society.10.b: "청원을 기각한다."
 tsin_society.10.c: "주동자들을 체포한다."
 tsin_society.20.title: "파업"
 tsin_society.20.desc: "[tsin_strike_location.GetName]의 공장 노동자들이 임금 인상과 노동 시간 단축을 요구하며 일손을 놓았습니다. 공장주들은 정부의 개입을 요구하고 있습니다."
 tsin_society.20.a: "노동조합을 인정한다."
 tsin_society.20.b: "파업을 진압한다."
 tsin_society.20.c: "중재를 맡는다."
 tsin_society.30.title: "공교육법"
 tsin_society.30.desc: "모든 아이가 글을 읽을 줄 알아야 한다는 목소리가 커지고 있습니다. 국가가 학교를 세울지, 지금처럼 교회에 맡길지 정해야 합니다."
 tsin_society.30.a: "모든 교구에 공립 학교를 세운다."
 tsin_society.30.b: "교회에 맡긴다."
 tsin_society.40.title: "사회 보험"
 tsin_society.40.desc: "재상은 노동자들이 사회주의자에게 넘어가기 전에 국가가 먼저 질병과 노령에 대한 보험을 마련해야 한다고 말합니다."
 tsin_society.40.a: "사회주의자들의 기세를 꺾는다."
 tsin_society.40.b: "자선으로 충분하다."
 tsin_society.50.title: "공장의 아이들"
 tsin_society.50.desc: "조사관의 보고서에 따르면 방적 공장에서 여덟 살 아이들이 하루 열두 시간씩 일하고 있습니다. 신문들이 보고서를 앞다투어 싣고 있습니다."
 tsin_society.50.a: "공장법을 제정한다."
 tsin_society.50.b: "공장에는 일손이 필요하다."
 tsin_society.60.title: "빈민가의 전염병"
 tsin_society.60.desc: "비좁은 셋방과 오염된 우물을 따라 전염병이 번지고 있습니다. 의사들은 하수도와 깨끗한 물이 필요하다고 말합니다."
 tsin_society.60.a: "하수도와 상수도를 놓는다."
 tsin_society.60.b: "구역을 격리한다."
 tsin_society.60.c: "나쁜 공기 때문이다."
 tsin_society.70.title: "여성에게 투표권을"
 tsin_society.70.desc: "여성 참정권 운동가들이 거리 행진을 벌이고 있습니다. 그들은 적어도 지방 선거에서라도 투표할 권리를 달라고 요구합니다."
 tsin_society.70.a: "지방 선거 투표권을 준다."
 tsin_society.70.b: "우리 세대에는 안 된다."
 mapmode_tsin_urbanization_name: "도시화"
 MAPMODE_TSIN_URBANIZATION: "#T $mapmode_tsin_urbanization_name$#!\n각 [location|e] 인구 가운데 시민과 노동자의 비중을 색으로 표시합니다. 50% 이상이면 가장 진한 색이고, 도시와 대도시는 따로 표시합니다."
 TSIN_URBANIZATION_MAPMODE_TT: "[ROOT.GetLocation.GetName]의 인구 가운데 시민과 노동자는 [ROOT.ScriptValue('tsin_location_urban_share')|%0]입니다."
 LEGEND_KEY_TSIN_CITY: "도시, 대도시"
 LEGEND_KEY_TSIN_URBAN_SHARE_HIGH: "시민·노동자 50% 이상"
 LEGEND_KEY_TSIN_URBAN_SHARE_LOW: "시민·노동자 없음"
 mapmode_tsin_labor_unrest_name: "노동 불안"
 MAPMODE_TSIN_LABOR_UNREST: "#T $mapmode_tsin_labor_unrest_name$#!\n최근 5년 안에 파업이나 시가전이 벌어진 [locations|e]을 표시합니다. 그 밖의 공장 지점은 소유국의 노동 운동 세기에 따라 칠합니다."
 TSIN_LABOR_UNREST_MAPMODE_TT: "[ROOT.GetLocation.GetName] 소유국의 노동 운동 세기는 [ROOT.ScriptValue('tsin_location_labor_pressure')|%0]입니다. 노동 불만은 [ROOT.ScriptValue('tsin_location_owner_labor_grievance')|0]/100입니다."
 LEGEND_KEY_TSIN_STRIKE_BROKEN: "파업이 진압된 곳"
 LEGEND_KEY_TSIN_RECENT_STRIKE: "최근 파업이 있었던 곳"
 LEGEND_KEY_TSIN_LABOR_PRESSURE: "노동 운동이 강한 나라의 공장 지점"
 mapmode_tsin_radicalism_name: "급진성"
 MAPMODE_TSIN_RADICALISM: "#T $mapmode_tsin_radicalism_name$#!\n소유국에서 가장 강한 사회 운동의 세기에 각 [location|e]의 불만을 곱해 표시합니다. 생활수준 자체는 바닐라 만족도 지도 모드를 보십시오."
 TSIN_RADICALISM_MAPMODE_TT: "[ROOT.GetLocation.GetName]의 급진성은 [ROOT.ScriptValue('tsin_location_radicalism')|%0]입니다."
 LEGEND_KEY_TSIN_RADICAL: "운동이 강하고 불만이 큰 곳"
 LEGEND_KEY_TSIN_CALM: "조용한 곳"
