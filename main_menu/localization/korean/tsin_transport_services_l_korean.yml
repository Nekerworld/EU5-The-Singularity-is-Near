l_korean:
 tsin_macadam_services: "마카담 도로 관리소"
 tsin_macadam_services_desc: "바닐라 도로·철도를 보존하는 거점 시설입니다. 별도 선로·도로를 지도에 그리거나 실제 부대·교역 이동 경로를 바꾸지 않습니다. 휴업·투입 부족·적국 점령 시 보정이 없고, 부분 고용에 비례합니다. 단절되어도 시설은 철거하지 않습니다."
