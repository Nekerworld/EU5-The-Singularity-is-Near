l_korean:

 # Stock market, charters, chairman (docs/corporations.md)
 tsin_found_farm_machinery_company_decision.title: "농기계 회사 설립"
 tsin_found_farm_machinery_company_decision.desc: "수확기와 탈곡기를 대량으로 만드는 농기계 회사를 세웁니다. 농기계 생산이 늘고 밀 수확도 조금 늘지만, [buildings|e] 유지비가 조금 오릅니다. 보유 한도: [ROOT.ScriptValue('tsin_company_limit')|0]개, 현재 [ROOT.ScriptValue('tsin_company_count')|0]개."
 tsin_found_farm_machinery_company_decision.a: "회사를 세운다."
 STATIC_MODIFIER_NAME_tsin_company_farm_machinery: "농기계 회사"
 tsin_charter_monopoly_decision.title: "독점 특허장"
 tsin_charter_monopoly_decision.desc: "우리 기업들에 국내 시장의 독점권을 내줍니다. 생산 효율과 시민 신분의 힘이 오르고 주가가 10% 뛰지만, 농민은 비싼 값에 불만을 품습니다. 독점 금지법 아래에서는 쓸 수 없습니다. 특허장 한도: [ROOT.ScriptValue('tsin_charter_limit')|0]개, 현재 [ROOT.ScriptValue('tsin_charter_count')|0]개."
 tsin_charter_monopoly_decision.a: "독점권을 내준다."
 tsin_charter_investment_decision.title: "투자 특허장"
 tsin_charter_investment_decision.desc: "기업이 국가 보증으로 채권을 발행하도록 허가합니다. 공장 건설이 빨라지고 이자가 내려가며, 주가가 오를 확률이 높아집니다. 특허장 한도: [ROOT.ScriptValue('tsin_charter_limit')|0]개, 현재 [ROOT.ScriptValue('tsin_charter_count')|0]개."
 tsin_charter_investment_decision.a: "채권 발행을 허가한다."
 tsin_charter_expansion_decision.title: "산업 확장 특허장"
 tsin_charter_expansion_decision.desc: "기업이 새 업종으로 뻗어 나가도록 허가합니다. 보유할 수 있는 회사가 하나 늘고 시민 신분의 힘이 오르지만, [buildings|e] 유지비가 조금 오릅니다. 증권 거래소가 있어야 합니다. 특허장 한도: [ROOT.ScriptValue('tsin_charter_limit')|0]개, 현재 [ROOT.ScriptValue('tsin_charter_count')|0]개."
 tsin_charter_expansion_decision.a: "확장을 허가한다."
 tsin_revoke_charters_decision.title: "기업 특허장 회수"
 tsin_revoke_charters_decision.desc: "독점·투자·산업 확장 특허장을 모두 거둬들입니다. 주가가 5% 내립니다. 기업을 해산하면 특허장도 함께 사라집니다."
 tsin_revoke_charters_decision.a: "특허장을 거둬들인다."
 tsin_stock_report_decision.title: "증권 보고서"
 tsin_stock_report_decision.desc: "증권 거래소에서 우리 기업들의 주가와 종합지수를 보고받습니다."
 tsin_stock_report_decision.a: "보고서를 펼친다."
 STATIC_MODIFIER_NAME_tsin_charter_monopoly: "독점 특허장"
 STATIC_MODIFIER_NAME_tsin_charter_investment: "투자 특허장"
 STATIC_MODIFIER_NAME_tsin_charter_expansion: "산업 확장 특허장"
 STATIC_MODIFIER_NAME_tsin_speculative_boom: "투기 과열"
 STATIC_MODIFIER_NAME_tsin_stock_crash: "주가 폭락"
 STATIC_MODIFIER_NAME_tsin_corporate_loan: "기업 차관"
 STATIC_MODIFIER_NAME_tsin_corporate_endowment: "기업 기부 강좌"
 STATIC_MODIFIER_NAME_tsin_corporate_cover_up: "기업 비리 은폐"
 STATIC_MODIFIER_NAME_tsin_corporate_lobby: "기업 로비"
 tsin_economy.140.title: "투기 과열"
 tsin_economy.140.desc: "증권 거래소가 들끓습니다. 종합지수가 최근 2년 평균보다 50% 넘게 올랐고, 하녀와 마부까지 주식을 사려고 줄을 섭니다. 냉정한 은행가들은 거품이 언제 터질지 수군거립니다."
 tsin_economy.140.a: "시장이 하는 대로 둔다."
 tsin_economy.140.b: "할인율을 올려 열기를 식힌다."
 tsin_economy.150.title: "증시 폭락"
 tsin_economy.150.desc: "하룻밤 사이에 주가가 무너졌습니다. 거래소 앞에는 겁에 질린 투자자들이 몰려들고, 은행들은 서로를 믿지 못해 돈줄을 죄고 있습니다. 공황이 세계로 번지면 장기 불황이 일찍 찾아올 수 있습니다."
 tsin_economy.150.a: "은행을 구제한다."
 tsin_economy.150.b: "약한 회사는 망하게 둔다."
 tsin_economy.150.c: "거래소를 1년 동안 닫는다."
 tsin_corporate.10.title: "새 회장"
 tsin_corporate.10.desc: "우리 기업들의 이사회가 [tsin_chairman.GetName]을(를) 새 회장으로 뽑았습니다. 공장과 철도, 은행을 아우르는 그의 결정은 이제 주가와 나라 살림을 함께 움직일 것입니다."
 tsin_corporate.10.a: "이사회의 선택을 인정한다."
 tsin_corporate.10.b: "이사회에 국가 감독관을 앉힌다."
 tsin_corporate.20.title: "작위를 원하는 회장"
 tsin_corporate.20.desc: "[tsin_chairman.GetName]은(는) 돈으로 살 수 있는 것은 다 가졌습니다. 이제 그는 귀족의 작위를 원합니다. 옛 가문들은 장사꾼이 귀족이 된다며 코웃음을 칩니다."
 tsin_corporate.20.a: "작위를 내린다."
 tsin_corporate.20.b: "작위는 파는 것이 아니다."
 tsin_corporate.30.title: "회사의 차관 제안"
 tsin_corporate.30.desc: "[tsin_chairman.GetName]이(가) 국고에 거액을 빌려주겠다고 합니다. 이자는 적지 않고, 정부가 회사에 빚을 지게 된다는 것은 모두가 압니다."
 tsin_corporate.30.a: "차관을 받는다."
 tsin_corporate.30.b: "국고는 호의가 필요 없다."
 tsin_corporate.40.title: "대학 강좌 기부"
 tsin_corporate.40.desc: "[tsin_chairman.GetName]이(가) 대학에 공학과 화학 강좌를 세울 기금을 내놓았습니다. 다만 강좌에 자기 이름을 붙여 달라고 합니다."
 tsin_corporate.40.a: "그의 이름을 붙인다."
 tsin_corporate.40.b: "기부 대신 세금을 걷는다."
 tsin_corporate.50.title: "뇌물 추문"
 tsin_corporate.50.desc: "신문이 [tsin_chairman.GetName]이(가) 관리들에게 뇌물을 주고 철도 노선과 정부 계약을 따냈다고 폭로했습니다. 주가가 10% 떨어졌고, 의원들은 수사를 요구합니다."
 tsin_corporate.50.a: "기소한다. 이사회는 새 회장을 뽑아야 한다."
 tsin_corporate.50.b: "덮어 둔다."
 tsin_corporate.60.title: "의회로 가는 회장"
 tsin_corporate.60.desc: "[tsin_chairman.GetName]이(가) 의원 선거에 나섰습니다. 그의 돈이면 당선은 따 놓은 당상이고, 의회에는 기업의 목소리가 커질 것입니다."
 tsin_corporate.60.a: "기업도 정치에 참여할 수 있다."
 tsin_corporate.60.b: "이사회는 의회 밖에 머물러야 한다."
 tsin_corporate.100.title: "증권 보고서"
 tsin_corporate.100.desc: "증권 거래소가 분기 보고서를 올렸습니다.\n\n$BULLET$제철 회사: [ROOT.ScriptValue('tsin_stock_price_steel')|0]\n$BULLET$기계 회사: [ROOT.ScriptValue('tsin_stock_price_machinery')|0]\n$BULLET$방직 회사: [ROOT.ScriptValue('tsin_stock_price_textile')|0]\n$BULLET$화학 회사: [ROOT.ScriptValue('tsin_stock_price_chemical')|0]\n$BULLET$철도 회사: [ROOT.ScriptValue('tsin_stock_price_railway')|0]\n$BULLET$농기계 회사: [ROOT.ScriptValue('tsin_stock_price_farm_machinery')|0]\n\n종합지수: [ROOT.ScriptValue('tsin_stock_index_report')|0] (최근 2년 평균 [ROOT.ScriptValue('tsin_stock_index_history_mean')|0])\n세계 지수: [ROOT.ScriptValue('tsin_world_stock_index_report')|0]\n기업 가치 합계: [ROOT.ScriptValue('tsin_company_total_value')|0]\n\n주가는 100에서 시작해 분기마다 움직입니다. 0은 그 회사가 없다는 뜻입니다. 회사가 만드는 재화의 시장 가격이 오르면 주가도 오를 가능성이 높습니다."
 tsin_corporate.100.a: "알겠다."
