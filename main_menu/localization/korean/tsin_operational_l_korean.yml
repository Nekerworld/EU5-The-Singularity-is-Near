 TSIN_OPS_TITLE: "국가 운영 현황"
 TSIN_OPS_EMPTY: "표시하도록 설정한 운영 경고가 없습니다."
 TSIN_OPS_REFRESH: "상세 점검 갱신"
 TSIN_OPS_RESTORE: "숨긴 유형 복원"
 TSIN_OPS_HIDE: "이 유형 숨기기 · 이번 실행"
 TSIN_OPS_VIEW: "확인하기"
 TSIN_OPS_MARKET: "최고가 시장 보기"
 TSIN_OPS_NOT_READY: "상세 점검 전입니다."
 TSIN_OPS_DATE: "상세 점검 기준: [GetPlayer.MakeScope.GetVariable('tsin_ops_year').GetValue|0]년 [GetPlayer.MakeScope.GetVariable('tsin_ops_month').GetValue|0]월"
 TSIN_OPS_HELP: "숫자는 표시 중인 경고 종류 수입니다. 기본 경고는 실시간, 상세는 3개월마다 갱신합니다. 수동 점검은 게임 1일 1회입니다. 우클릭하면 이번 실행 동안 유형을 숨깁니다. 상단 리본은 유지합니다."
 TSIN_OPS_ATTENTION: "주의"
 TSIN_OPS_CRITICAL: "긴급"
 TSIN_OPS_RULE_INPUTS: "건물 투입재 부족"
 TSIN_OPS_DETAIL_INPUTS: "기본 게임이 건물 투입재 부족을 판정했습니다. 생산 화면에서 원료와 시장 공급을 확인하십시오."
 TSIN_OPS_RULE_ARMY_FOOD: "군대 식량 부족"
 TSIN_OPS_DETAIL_ARMY_FOOD: "기본 게임의 군대 식량 경고가 활성화됐습니다. 군대별 식량·보급 한계·충원을 확인하십시오. 별도의 탄약 보급 체계를 가정하지 않습니다."
 TSIN_OPS_RULE_NAVAL_LOSS: "함대 소모 발생"
 TSIN_OPS_DETAIL_NAVAL_LOSS: "기본 게임이 함대 소모를 감지했습니다. 위치·작전 범위·수리 접근성을 확인하십시오."
 TSIN_OPS_RULE_FOOD: "식량 부족·굶주리는 주"
 TSIN_OPS_DETAIL_FOOD: "기본 게임의 기아 주·식량 비축 부족 경고입니다. 해당 시장과 주의 식량 수지를 확인하십시오. 대기근 재앙 항목 자체를 중복 표시하지 않습니다."
 TSIN_OPS_RULE_PRICES: "핵심 상품 가격 상승"
 TSIN_OPS_DETAIL_PRICES: "수요가 있는 시장·상품 조합 [GetPlayer.MakeScope.GetVariable('tsin_ops_expensive_count').GetValue|0]개가 설정 기준가의 150% 이상입니다. 공유 시장의 가격 경고이며 자국 공장의 투입 부족과는 별도입니다."
 TSIN_OPS_RULE_POWER: "전력 공급·수요 불균형"
 TSIN_OPS_DETAIL_POWER: "자국 영토가 속한 시장 [GetPlayer.MakeScope.GetVariable('tsin_ops_power_markets').GetValue|0]곳의 전력 공급이 수요의 90% 미만입니다. 발전량과 함께 교역·재고도 확인하십시오."
 TSIN_OPS_RULE_LOSS: "적자 건물 점검"
 TSIN_OPS_DETAIL_LOSS: "기본 적자 건물 경고 또는 두 차례 연속 상세 점검의 적자 판정입니다. 신설·정책 지원 시설의 초기 적자는 정상일 수 있습니다."
 TSIN_OPS_RULE_EMPLOYMENT: "건물 고용 부족"
 TSIN_OPS_DETAIL_EMPLOYMENT: "기본 고용 경고 또는 상세 점검에서 고용 인원이 정원의 50% 미만인 자국 영토 내 건물이 있습니다. 노동력·임금·수익성을 함께 확인하십시오."
 TSIN_OPS_RULE_ACCESS: "산업 지점 시장 접근성 저하"
 TSIN_OPS_DETAIL_ACCESS: "산업 지점 [GetPlayer.MakeScope.GetVariable('tsin_ops_poor_access').GetValue|0]곳의 시장 접근성이 75% 미만입니다. 도로·철도·통제력·교역 단절을 확인하십시오."
 TSIN_OPS_RULE_RESERVE: "병력 충원 여력 부족"
 TSIN_OPS_DETAIL_RESERVE: "군대가 있는 상태에서 가용 인력이 최대치의 10% 미만입니다. 예비 인력 경고이며 특정 부대의 충원 중단을 단정하지 않습니다."
 TSIN_OPS_RULE_MAINTENANCE: "군사 유지 수준 저하"
 TSIN_OPS_DETAIL_MAINTENANCE: "기본 게임의 육군·해군 유지 수준 경고입니다. 평시에는 의도적인 절감일 수 있습니다."
 TSIN_OPS_RULE_CROWDING: "도시·지점 과밀 위험"
 TSIN_OPS_DETAIL_CROWDING: "자국 지점 [GetPlayer.MakeScope.GetVariable('tsin_ops_overcrowded').GetValue|0]곳의 인구가 수용력의 90%를 넘었습니다. 한도 초과 전의 사전 경고입니다."
 TSIN_OPS_RULE_EDUCATION: "교육 보급률 하락 압력"
 TSIN_OPS_DETAIL_EDUCATION: "문해율·하위 교육 상한에 막히지 않았는데 중등·고등교육 목표치가 현재보다 1%p 넘게 낮습니다. 정원과 정책을 확인하십시오."
 TSIN_OPS_RULE_SUBSIDY: "보조금 지원 적자 건물 지속"
 TSIN_OPS_DETAIL_SUBSIDY: "최근 점검에 보조금 지원 중인 적자 건물 [GetPlayer.MakeScope.GetVariable('tsin_ops_subsidized_loss_count').GetValue|0]개가 있으며 두 차례 연속 확인됐습니다. 실제 보조금 지출액과 동일한 값은 아닙니다. 정확한 지출은 경제 화면에서 확인하십시오."
 TSIN_OPS_RULE_BUDGET: "지속 적자·차입 부담"
 TSIN_OPS_DETAIL_BUDGET: "최근 월 수지 [GetPlayer.MakeScope.GetVariable('tsin_ops_balance').GetValue|0] · 대출 [GetPlayer.MakeScope.GetVariable('tsin_ops_loans').GetValue|0]건. 두 차례 연속 적자 표본 또는 대출 3건 이상인 적자 상태를 점검합니다."
 TSIN_OPS_RULE_STOCKS: "주가지수 급락"
 TSIN_OPS_DETAIL_STOCKS: "현재 지수가 기존 최근 기록 평균의 60% 미만입니다. 모드의 급락 비교 기준을 사용합니다. 기업·금융 탭을 확인하십시오."
