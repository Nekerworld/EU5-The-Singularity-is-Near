 MODIFIER_TYPE_DESC_ban_exports_of_tsin_electricity: "[country|e] 소유의 모든 [markets|e]에서 [ShowGoodsName('tsin_electricity')] [export|e]을 막습니다."
 MODIFIER_TYPE_NAME_ban_imports_of_tsin_electricity: "$tsin_electricity$ 수입 금지"
 MODIFIER_TYPE_DESC_ban_imports_of_tsin_electricity: "[country|e] 소유의 모든 [markets|e]에서 [ShowGoodsName('tsin_electricity')] [import|e]을 막습니다."
 MODIFIER_TYPE_NAME_local_tsin_electricity_output_modifier: "현지 $tsin_electricity$ 생산량"
 MODIFIER_TYPE_DESC_local_tsin_electricity_output_modifier: "이 [location|e]의 [ShowGoodsName('tsin_electricity')] [output|e]을 조정합니다."
 MODIFIER_TYPE_NAME_local_tsin_electricity_establishment_speed: "현지 $tsin_electricity$ 생산 건물 정착 속도"
 MODIFIER_TYPE_DESC_local_tsin_electricity_establishment_speed: "이 [location|e]에 새로 건설된 [ShowGoodsName('tsin_electricity')] 생산 [buildings|e]이 최대 [production_efficiency|e]에 도달하는 속도입니다."
 MODIFIER_TYPE_NAME_global_tsin_electricity_output_modifier: "$tsin_electricity$ 생산량"
 MODIFIER_TYPE_DESC_global_tsin_electricity_output_modifier: "[country|e] 전체의 [ShowGoodsName('tsin_electricity')] [output|e]을 조정합니다."
 MODIFIER_TYPE_NAME_global_tsin_electricity_establishment_speed: "$tsin_electricity$ 생산 건물 정착 속도"
 MODIFIER_TYPE_DESC_global_tsin_electricity_establishment_speed: "[country|e] 전체에서 새로 건설된 [ShowGoodsName('tsin_electricity')] 생산 [buildings|e]이 최대 [production_efficiency|e]에 도달하는 속도입니다."
 MODIFIER_TYPE_NAME_global_tsin_electricity_pop_demand: "전역 [ShowGoodsNameWithNoTooltip('tsin_electricity')] 수요"
 MODIFIER_TYPE_DESC_global_tsin_electricity_pop_demand: "[ShowGoodsName('tsin_electricity')] [produced_good|e]에 대한 [pop_needs|e]를 조정합니다."
 MODIFIER_TYPE_NAME_tsin_electricity_impacts_inflation: "전력 인플레이션 영향치"
 MODIFIER_TYPE_DESC_tsin_electricity_impacts_inflation: "[ShowGoodsName('tsin_electricity')] 생산이 [country|e]의 [inflation|e]에 기여하는 정도를 결정합니다."
 MODIFIER_TYPE_NAME_tsin_electricity_used_for_minting: "전력을 화폐로 사용"
 MODIFIER_TYPE_DESC_tsin_electricity_used_for_minting: "[ShowGoodsName('tsin_electricity')]이 해당 [country|e] 내에서 화폐로 사용되는지를 결정합니다."
 tsin_electricity_desc: "발전기가 만들어 전선으로 보내는 전력은 공장의 전동기를 돌리고 거리의 등불을 밝힙니다. 멀리 보내기 어려워 대부분 만들어진 시장 안에서 쓰입니다."

 tsin_practical_electrical_engineering_advance: "실용 전기공학"
 tsin_practical_electrical_engineering_advance_desc: "실험실의 전기 현상이 공학자의 계산 대상이 되었습니다. 전류와 저항을 다루는 법을 익히면 구리선 하나가 새로운 산업을 엽니다."
 tsin_dynamo_advance: "발전기"
 tsin_dynamo_advance_desc: "자석 사이에서 코일을 돌리면 전류가 흐릅니다. 증기기관의 회전을 전기로 바꾸는 $tsin_power_station$을 지을 수 있게 됩니다."
 tsin_central_power_station_advance: "중앙 발전소"
 tsin_central_power_station_advance_desc: "공장마다 작은 발전기를 두는 대신, 큰 발전소 하나가 도시 전체에 전기를 보냅니다. 수력과 석유로 전기를 만드는 방식이 열립니다."
 tsin_distribution_grid_advance: "배전망"
 tsin_distribution_grid_advance_desc: "변압기와 송전선이 발전소와 공장, 거리를 하나의 망으로 묶습니다. 같은 발전소에서 더 많은 전기를 쓸 수 있게 됩니다."
 tsin_electric_motor_advance: "전동기"
 tsin_electric_motor_advance_desc: "벨트와 축으로 이어진 증기기관 대신, 기계마다 작은 전동기가 붙습니다. $tsin_mechanized_textile_mill$이 전기로 움직일 수 있게 됩니다."
 tsin_electric_lighting_advance: "전기 조명"
 tsin_electric_lighting_advance_desc: "가스등보다 밝고 안전한 전등이 거리와 공장을 밝힙니다. 도시에 $tsin_electric_lighting$을 설치할 수 있게 됩니다."
 tsin_telegraph_telephone_advance: "전신과 전화"
 tsin_telegraph_telephone_advance_desc: "며칠 걸리던 소식이 몇 분 만에 전해집니다. 정부는 지방을 더 가까이 다스리고, 상인과 외교관은 먼 곳의 사정을 곧바로 압니다."
 tsin_industrial_electrification_advance: "산업 전동화"
 tsin_industrial_electrification_advance_desc: "전기는 이제 공장의 기본 동력입니다. 전기분해로 화학 원료를 만드는 방식이 열리고, 산업 전반의 효율이 오릅니다."

 tsin_power_station: "발전소"
 tsin_power_station_desc: "$tsin_power_station$은 석탄이나 물, 석유의 힘으로 발전기를 돌려 $tsin_electricity$을 만듭니다. 전기는 멀리 보내기 어려워 주로 같은 시장에서 쓰입니다."
 tsin_power_station_slot_0: "발전 방식"
 tsin_power_station_coal: "석탄 화력"
 tsin_power_station_hydro: "수력"
 tsin_power_station_oil: "석유 화력"
 tsin_electric_lighting: "전기 조명망"
 tsin_electric_lighting_desc: "거리와 집을 밝히는 $tsin_electric_lighting$은 밤을 짧게 만들고 도시를 더 살기 좋은 곳으로 바꿉니다. $tsin_electricity$을 꾸준히 소비합니다."
 tsin_electric_lighting_slot_0: "유지"
 tsin_electric_lighting_maintenance: "조명망 운영"
 tsin_mechanized_electric_drive: "전동기"
 tsin_fertilizer_electrochemical: "전기화학 비료"

 mapmode_tsin_electrification_name: "전력"
 MAPMODE_TSIN_ELECTRIFICATION: "#T $mapmode_tsin_electrification_name$#!\n각 [locations|e]이 속한 [market|e]에서 $tsin_electricity$ 공급이 수요를 채우는지 표시합니다. 부족할수록 색이 옅어지며, 전력이 전혀 없는 시장은 미연결로 칠합니다."
 TSIN_ELECTRIFICATION_MAPMODE_TT: "[ROOT.GetLocation.GetName]의 시장 전력 공급 [ROOT.ScriptValue('tsin_location_power_supply')|1], 수요 [ROOT.ScriptValue('tsin_location_power_demand')|1], 충족률 [ROOT.ScriptValue('tsin_location_power_ratio')|%0]."
