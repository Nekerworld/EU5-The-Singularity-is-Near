 tsin_invention.40.title: "발전기"
 tsin_invention.40.desc: "우리 기술자들이 증기기관에 연결한 발전기가 공장 하나를 밝힐 만큼의 전기를 꾸준히 만들어 냈습니다. 이 새 산업을 누가 키울지 정해야 합니다."
 tsin_invention.40.a: "민간 전기 회사에 설립 허가를 내준다."
 tsin_invention.40.b: "국영 발전 사업을 시작한다."
 tsin_invention.50.title: "전화"
 tsin_invention.50.desc: "전선 너머에서 사람의 목소리가 그대로 들립니다. 도시마다 교환국을 세우려는 신청이 들어오고 있습니다."
 tsin_invention.50.a: "교환국을 국영 우편국 아래에 둔다."
 tsin_invention.50.b: "민간 전화 회사에 면허를 준다."
 tsin_invention.60.title: "백열등"
 tsin_invention.60.desc: "유리구 안의 가는 필라멘트가 가스등보다 밝고 깨끗한 빛을 냅니다. 이 빛을 어디에 먼저 쓸지 정해야 합니다."
 tsin_invention.60.a: "공장을 밝혀 밤에도 기계를 돌린다."
 tsin_invention.60.b: "학교와 도서관, 열람실을 밝힌다."
 tsin_invention.70.title: "수도의 전등"
 tsin_invention.70.desc: "[SCOPE.sLocation('tsin_lit_capital').GetName]의 큰 거리에 전등을 세우자는 안이 시 의회에 올라왔습니다. 가스 회사는 반대하고, 전기 회사들은 서로 사업권을 따내려 합니다."
 tsin_invention.70.a: "시가 직접 발전과 조명을 맡는다."
 tsin_invention.70.b: "민간 회사에 조명 특허를 준다."
 tsin_invention.70.c: "당분간 가스등을 유지한다."

 tsin_hold_world_exhibition_decision.title: "만국박람회 개최"
 tsin_hold_world_exhibition_decision.desc: "수도에 유리와 철로 된 거대한 전시관을 세우고, 세계 각국의 기계와 발명품, 물산을 한자리에 모읍니다. 평화로운 때에, 기술이 앞선 여덟 나라 안에 들고, 수도가 도시 이상이어야 개최할 수 있습니다. 박람회는 1년 동안 열리며, 끝난 뒤 5년이 지나야 다음 박람회를 열 수 있습니다."
 tsin_hold_world_exhibition_decision.a: "박람회를 연다."

 tsin_world_exhibition: "만국박람회"
 tsin_world_exhibition_desc: "세계의 기계와 발명품이 한 전시관에 모였습니다. 개최국보다 기술이 뒤진 나라들은 관람객과 기술자를 보내 새 기법을 배워 갑니다. 박람회는 1년 동안 열립니다."
 tsin_world_exhibition_closed: "박람회 폐막"
 tsin_world_exhibition_host_tt: "이 [location|e]의 소유국이 만국박람회를 열고 있습니다."
 LEGEND_KEY_TSIN_EXHIBITION_HOST: "개최국"
 LEGEND_KEY_TSIN_EXHIBITION_VISITORS: "기술을 배워 가는 나라"
 hint_tsin_world_exhibition: "[GetSituationByKey('tsin_world_exhibition').GetNameWithNoTooltip]"
 hint_tsin_world_exhibition_hint_text: "[GetSituationByKey('tsin_world_exhibition').GetName]가 열렸습니다. 개최국보다 연구한 기술이 적은 나라는 6년 동안 연구 속도가 오릅니다.\n\n#T 권장 행동:#!\n@arrow_bonus_tier_3! 기술 선두국이라면 박람회가 끝난 뒤 직접 개최해 위신을 얻으십시오.\n@arrow_bonus_tier_2! 뒤처진 나라라면 이 기간에 연구를 서두르십시오."
 hint_tsin_world_exhibition_diplomatic: "\"박람회는 대포 없이 국력을 보여 주는 자리입니다.\""
 hint_tsin_world_exhibition_administrative: "\"전시된 기계는 몇 년 안에 모든 나라의 공장에 들어섭니다.\""
 hint_tsin_world_exhibition_military: "\"오늘 전시된 강철이 내일의 포신이 됩니다.\""

 STATIC_MODIFIER_NAME_tsin_exhibition_hosting: "만국박람회 개최"
 STATIC_MODIFIER_NAME_tsin_exhibition_visitors: "박람회에서 배운 기술"
 STATIC_MODIFIER_NAME_tsin_exhibition_machine_hall: "기계관의 명성"
 STATIC_MODIFIER_NAME_tsin_exhibition_science_palace: "과학 궁전의 유산"

 tsin_exhibition.1.title: "박람회 개막"
 tsin_exhibition.1.desc: "유리 지붕 아래로 각국의 깃발이 걸리고, 첫날부터 관람객이 줄을 섰습니다. 전시관 한가운데에 무엇을 둘지 정해야 합니다."
 tsin_exhibition.1.a: "우리 공장의 기계를 한가운데에 둔다."
 tsin_exhibition.1.b: "과학과 교육의 성과를 내세운다."
 tsin_exhibition.1.c: "나라의 영광을 화려하게 보여 준다."
 tsin_exhibition.10.title: "박람회 폐막"
 tsin_exhibition.10.desc: "1년 동안 수백만 명이 전시관을 찾았습니다. 각국 신문은 우리 박람회를 이 시대의 상징으로 기록했습니다."
 tsin_exhibition.10.a: "성공적인 박람회였다."
