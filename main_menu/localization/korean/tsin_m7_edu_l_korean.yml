l_korean:

 tsin_research_university: "연구 대학"
 tsin_research_university_desc: "강의만 하던 대학이 실험실과 연구소를 갖춘 연구 기관이 됩니다. $university$를 대신하며 바닐라 대학의 효과를 그대로 유지하고, 레벨마다 [tsin_education_ladder_concept|e]의 고등교육 정원을 더합니다."
 tsin_research_university_slot_0: "연구 대학"
 tsin_research_university_lectures: "강의 중심"
 tsin_research_university_laboratory: "실험실"
 tsin_research_university_institute: "공학 연구소"
 tsin_humboldt_university_advance: "훔볼트식 대학 개혁"
 tsin_humboldt_university_advance_desc: "교수는 가르치면서 연구하고, 학생은 스스로 배울 자유를 누립니다. $tsin_research_university$를 해금합니다."
 tsin_experimental_science_advance: "실험 과학"
 tsin_experimental_science_advance_desc: "대학 실험실이 화학과 물리학의 새 발견을 쏟아 냅니다. $tsin_research_university$의 실험실 단계와 두 번째 레벨을 엽니다."
 tsin_engineering_education_advance: "공학 교육"
 tsin_engineering_education_advance_desc: "공과 대학과 공업 학교가 기계와 전기를 설계할 기술자를 길러 냅니다. $tsin_research_university$의 공학 연구소 단계와 세 번째 레벨, $tsin_public_school$의 종합 과정을 엽니다."
 TSIN_BUILDING_LEVEL_EXPERIMENTAL_SCIENCE: "$tsin_experimental_science_advance$"
 TSIN_BUILDING_LEVEL_ENGINEERING_EDUCATION: "$tsin_engineering_education_advance$"
 STATIC_MODIFIER_NAME_tsin_secondary_education_1: "중등교육 1단계"
 STATIC_MODIFIER_NAME_tsin_secondary_education_2: "중등교육 2단계"
 STATIC_MODIFIER_NAME_tsin_secondary_education_3: "중등교육 3단계"
 STATIC_MODIFIER_NAME_tsin_secondary_education_4: "중등교육 4단계"
 STATIC_MODIFIER_NAME_tsin_higher_education_1: "고등교육 1단계"
 STATIC_MODIFIER_NAME_tsin_higher_education_2: "고등교육 2단계"
 STATIC_MODIFIER_NAME_tsin_higher_education_3: "고등교육 3단계"
 STATIC_MODIFIER_NAME_tsin_higher_education_4: "고등교육 4단계"
 tsin_system.20.title: "교육 보고서"
 tsin_system.20.desc: "교육부가 국민 교육의 현황을 보고합니다.\n\n$BULLET$문해율: [ROOT.ScriptValue('tsin_country_literacy')|0]\n$BULLET$중등교육률: [ROOT.ScriptValue('tsin_country_secondary_education')|1] (목표 [ROOT.ScriptValue('tsin_country_secondary_education_target')|1])\n$BULLET$고등교육률: [ROOT.ScriptValue('tsin_country_higher_education')|1] (목표 [ROOT.ScriptValue('tsin_country_higher_education_target')|1])\n$BULLET$$tsin_public_school$ 레벨: [ROOT.ScriptValue('tsin_country_school_levels')|0]\n$BULLET$대학 레벨: [ROOT.ScriptValue('tsin_country_university_levels')|0]\n\n중등교육은 문해율의 90%를, 고등교육은 중등교육의 60%를 넘을 수 없습니다. 목표값은 학교와 대학의 정원에서 나오고, 해마다 그 차이의 10%씩 다가갑니다."
 tsin_system.20.a: "교육에 더 힘써야겠군."
 mapmode_tsin_education_name: "교육 단계"
 MAPMODE_TSIN_EDUCATION: "#T $mapmode_tsin_education_name$#!\n$mapmode_common_start$ 소유국의 고등교육률로 [locations|e]을 칠합니다. $tsin_research_university$가 있는 곳은 강조합니다."
 TSIN_EDUCATION_MAPMODE_TT: "문해율 [ROOT.ScriptValue('tsin_location_owner_literacy')|0], 중등교육 [ROOT.ScriptValue('tsin_location_owner_secondary_education')|1], 고등교육 [ROOT.ScriptValue('tsin_location_owner_higher_education')|1]"
 LEGEND_KEY_TSIN_RESEARCH_UNIVERSITY: "$tsin_research_university$"
 LEGEND_KEY_TSIN_HIGHER_EDUCATION: "고등교육률(높을수록 진함)"
 LEGEND_KEY_TSIN_NO_EDUCATION_LADDER: "교육 단계 시작 전"
