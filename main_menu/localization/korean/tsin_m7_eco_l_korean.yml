l_korean:

 TSIN_BUILDING_LEVEL_AUTOMATION_MARKET_ACCESS: "자동화 설비의 낮은 [market_access|e]"
 tsin_automated_iron_mill: "자동화 제철 공구 공장"
 tsin_automated_iron_mill_desc: "공작 기계가 표준 규격 부품을 찍어 내 더 적은 노동자로 더 많은 $tools$를 만듭니다. 기존 $iron_mill$을 개축하여 세웁니다([tsin_automation_concept|e])."
 tsin_automated_iron_mill_slot_0: "동력 방식"
 tsin_automated_iron_mill_steam: "증기 동력"
 tsin_automated_iron_mill_electric: "전동기"
 tsin_automated_glass_mill: "자동화 유리 공장"
 tsin_automated_glass_mill_desc: "연속 가동 탱크로와 기계식 압연기가 $glass$를 끊임없이 뽑아냅니다. 기존 $glass_mill$을 개축하여 세웁니다([tsin_automation_concept|e])."
 tsin_automated_glass_mill_slot_0: "동력 방식"
 tsin_automated_glass_mill_steam: "증기 동력"
 tsin_automated_glass_mill_electric: "전동기"
 tsin_automated_paper_mill: "연속식 제지 공장"
 tsin_automated_paper_mill_desc: "푸어드리니어 초지기가 목재 펄프를 끝없는 $paper$ 띠로 바꿉니다. 기존 $paper_mill$을 개축하여 세웁니다([tsin_automation_concept|e])."
 tsin_automated_paper_mill_slot_0: "동력 방식"
 tsin_automated_paper_mill_steam: "증기 동력"
 tsin_automated_paper_mill_electric: "전동기"
 tsin_automated_furniture_mill: "기계화 가구 공장"
 tsin_automated_furniture_mill_desc: "증기 톱과 선반이 같은 의자를 수천 개씩 깎아 냅니다. 기존 $furniture_mill$을 개축하여 세웁니다([tsin_automation_concept|e])."
 tsin_automated_furniture_mill_slot_0: "동력 방식"
 tsin_automated_furniture_mill_steam: "증기 동력"
 tsin_automated_furniture_mill_electric: "전동기"
 tsin_automated_printing_mill: "윤전 인쇄소"
 tsin_automated_printing_mill_desc: "원통형 윤전기가 한 시간에 수만 장을 찍어 값싼 $books$와 신문을 쏟아 냅니다. 기존 $printing_mill$을 개축하여 세웁니다([tsin_automation_concept|e])."
 tsin_automated_printing_mill_slot_0: "동력 방식"
 tsin_automated_printing_mill_steam: "증기 동력"
 tsin_automated_printing_mill_electric: "전동기"
 tsin_automated_fine_cloth_mill: "역직 자카드 공장"
 tsin_automated_fine_cloth_mill_desc: "천공 카드로 무늬를 짜는 동력 자카드 직기가 장인의 손을 대신합니다. 기존 $fine_cloth_mill$을 개축하여 세웁니다([tsin_automation_concept|e])."
 tsin_automated_fine_cloth_mill_slot_0: "동력 방식"
 tsin_automated_fine_cloth_mill_steam: "증기 동력"
 tsin_automated_fine_cloth_mill_electric: "전동기"
 tsin_interchangeable_parts_advance: "호환 부품"
 tsin_interchangeable_parts_advance_desc: "규격대로 깎은 부품은 어느 기계에나 맞습니다. $tsin_automated_iron_mill$과 $tsin_automated_furniture_mill$으로 개축할 수 있게 됩니다([tsin_automation_concept|e])."
 tsin_continuous_process_advance: "연속 공정"
 tsin_continuous_process_advance_desc: "원료가 한쪽으로 들어가 제품이 반대쪽으로 쉬지 않고 나옵니다. $tsin_automated_paper_mill$과 $tsin_automated_glass_mill$으로 개축할 수 있게 됩니다."
 tsin_rotary_press_advance: "윤전기"
 tsin_rotary_press_advance_desc: "활자를 원통에 감은 인쇄기가 신문의 시대를 엽니다. $tsin_automated_printing_mill$로 개축할 수 있게 됩니다."
 tsin_power_jacquard_advance: "동력 자카드 직기"
 tsin_power_jacquard_advance_desc: "천공 카드와 증기 동력이 만나 무늬 직물을 대량으로 짭니다. $tsin_automated_fine_cloth_mill$으로 개축할 수 있게 됩니다."
