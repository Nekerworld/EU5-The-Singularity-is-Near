 TSIN_UI_RESEARCH_HELP: "시대관 수용은 뿌리 기술의 연구 조건을 엽니다. 기술 자체를 지급하지 않습니다. 선행 관계와 개별 해금은 기본 기술 화면에서 확인하십시오."
 TSIN_UI_HISTORY_NOTE: "오래된 관측치부터 같은 척도로 비교합니다. 기록한 관측치만 표시하며 과거를 복원하지 않습니다. K=천 · M=백만 · B=십억 · T=조."
