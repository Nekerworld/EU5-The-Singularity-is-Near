 tsin_economy.80.title: "고무 붐"
 tsin_economy.80.desc: "가황 고무가 벨트와 호스, 방수포로 쓰이면서 값이 치솟고 있습니다. 우리 열대 밀림의 고무나무를 노리는 회사들이 특허를 달라고 몰려왔습니다."
 tsin_economy.80.a: "고무 회사에 특허권을 준다."
 tsin_economy.80.b: "국가 감독 아래 고무를 심는다."
 tsin_economy.80.c: "숲은 그대로 둔다."
