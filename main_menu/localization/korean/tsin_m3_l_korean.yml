 tsin_customs_union_desc: "관세 동맹은 서로의 [market|e]에 들어오는 상품에 관세를 매기지 않기로 한 [countries|e]의 모임입니다. 가입하면 다른 모든 회원국과 서로 관세 면제를 맺고, 탈퇴하면 그 면제가 사라집니다."
