 tsin_invention.10.title: "베서머 전로"
 tsin_invention.10.desc: "녹은 선철에 공기를 불어 넣어 순식간에 강철로 바꾸는 전로가 우리 제철소에서도 시험에 성공했습니다. 이 기술을 누구에게 맡길지 정해야 합니다."
 tsin_invention.10.a: "민간 제철업자에게 사용권을 판다."
 tsin_invention.10.b: "레일과 대포를 위한 국영 제강소를 세운다."
 tsin_invention.20.title: "다이너마이트"
 tsin_invention.20.desc: "니트로글리세린을 규조토에 흡수시켜 안전하게 다룰 수 있는 폭약이 나왔습니다. 광산주와 철도 기술자 모두 이 폭약을 원합니다."
 tsin_invention.20.a: "새 광산을 연다."
 tsin_invention.20.b: "철도 터널과 절개지를 뚫는다."
 tsin_invention.20.c: "사고가 두려우니 사용을 제한한다."
 tsin_invention.30.title: "냉동선"
 tsin_invention.30.desc: "얼음과 냉동기를 실은 배가 먼 항구까지 고기와 생선을 상하지 않게 실어 나를 수 있게 되었습니다."
 tsin_invention.30.a: "목장의 냉동육을 수출한다."
 tsin_invention.30.b: "냉장 어선단을 꾸린다."
 tsin_invention.30.c: "해운 회사들에 맡긴다."

