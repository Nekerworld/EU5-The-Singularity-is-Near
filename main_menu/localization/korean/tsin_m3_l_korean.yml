 tsin_economy.50.title: "금융 공황"
 tsin_economy.50.desc: "큰 어음 할인 회사 하나가 지급을 멈추자 예금자들이 은행 창구로 몰려들고 있습니다. 증권 거래소의 시세는 하루 만에 폭락했습니다."
 tsin_economy.50.a: "국고로 은행을 구제한다."
 tsin_economy.50.b: "금 태환을 정지한다."
 tsin_economy.50.c: "약한 회사들은 망하게 둔다."
 tsin_economy.60.title: "철도 투기 열풍"
 tsin_economy.60.desc: "새 철도 회사의 주식이 나오기가 무섭게 팔려 나갑니다. 노선이 놓일 곳이 어디인지도 모르는 사람들까지 돈을 쏟아붓고 있습니다."
 tsin_economy.60.a: "주가가 오르게 내버려 둔다."
 tsin_economy.60.a.tt: "열풍이 끝나면 거품이 꺼질 수 있습니다."
 tsin_economy.60.b: "설립 인가와 자본 준비금을 요구한다."
 tsin_economy.61.title: "철도 거품 붕괴"
 tsin_economy.61.desc: "약속된 배당이 나오지 않자 철도 주식이 일제히 폭락했습니다. 반쯤 놓인 노선과 파산한 회사들이 남았습니다."
 tsin_economy.61.a: "파산한 노선을 국가가 인수한다."
 tsin_economy.61.b: "손실은 투자자들의 몫이다."
 tsin_economy.70.title: "산업 스파이"
 tsin_economy.70.desc: "[SCOPE.sCountry('tsin_espionage_target').GetName]의 공작 기계 공장이 우리보다 훨씬 앞서 있습니다. 그 설계도를 손에 넣을 방법이 있다는 제안이 들어왔습니다."
 tsin_economy.70.a: "요원에게 돈을 주어 도면을 베끼게 한다."
 tsin_economy.70.b: "그 나라를 떠난 기술자들을 고용한다."
 tsin_economy.70.c: "우리 힘으로 만든다."

