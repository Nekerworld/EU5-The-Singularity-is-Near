 tsin_long_depression: "대불황"
 tsin_long_depression_desc: "주식 시장의 붕괴가 은행과 철도 회사를 잇달아 무너뜨렸습니다. 산업 국가들은 투자가 멈추고 일자리가 사라지는 긴 불황에 빠졌습니다. 각국은 관세나 공공사업으로 먼저 빠져나올 수도 있지만, 그러지 않으면 불황은 20년 가까이 이어질 수 있습니다."
 tsin_long_depression_recovery: "회복"
 tsin_long_depression_runs_its_course: "긴 불황의 끝"
 tsin_long_depression_panic_tt: "이 [country|e]는 금융 공황을 겪고 있습니다."
 tsin_long_depression_slump_tt: "이 [country|e]는 불황 속에 있습니다."
 tsin_long_depression_recovered_tt: "이 [country|e]는 불황에서 회복했습니다."
 hint_tsin_long_depression: "[GetSituationByKey('tsin_long_depression').GetNameWithNoTooltip]"
 hint_tsin_long_depression_hint_text: "[GetSituationByKey('tsin_long_depression').GetName]이 산업 국가들을 덮쳤습니다. 처음 2년은 공황, 그 뒤는 불황 단계입니다.\n\n#T 권장 행동:#!\n@arrow_bonus_tier_3! 불황 단계에서 회복 정책 이벤트가 오면 관세 인상이나 공공사업으로 먼저 빠져나올 수 있습니다.\n@arrow_bonus_tier_2! 모든 국가가 회복하면 8년 뒤 상황이 일찍 끝납니다."
 hint_tsin_long_depression_diplomatic: "\"돈이 돌지 않으면 공장도 돌지 않습니다.\""
 hint_tsin_long_depression_administrative: "\"공황은 지나가지만, 불황은 정책으로 끝내야 합니다.\""
 hint_tsin_long_depression_military: "\"굶주린 노동자는 좋은 병사가 되지 못합니다.\""
 STATIC_MODIFIER_NAME_tsin_depression_panic: "금융 공황"
 STATIC_MODIFIER_NAME_tsin_depression_slump: "불황"
 STATIC_MODIFIER_NAME_tsin_depression_recovered: "불황 회복"
 STATIC_MODIFIER_NAME_tsin_bank_rescue: "은행 구제"
 STATIC_MODIFIER_NAME_tsin_protectionist_recovery: "보호 관세"
 tsin_depression.1.title: "공황"
 tsin_depression.1.desc: "증권 거래소의 폭락이 하루 만에 수많은 재산을 날려 버렸습니다. 예금자들이 은행 앞에 줄을 서고, 철도 회사들이 지급을 멈추고 있습니다."
 tsin_depression.1.a: "은행을 구제한다."
 tsin_depression.1.b: "무너지게 둔다."
 tsin_depression.1.c: "화폐를 찍어 낸다."
 tsin_depression.2.title: "은행 도산"
 tsin_depression.2.desc: "또 하나의 은행이 문을 닫았습니다. 평생 모은 돈을 잃은 예금자들이 정부에 도움을 호소하고 있습니다."
 tsin_depression.2.a: "예금을 보전해 준다."
 tsin_depression.2.b: "손실은 예금자의 몫이다."
 tsin_depression.3.title: "회복 정책"
 tsin_depression.3.desc: "각료들이 불황에서 벗어날 방안을 내놓았습니다. 외국 상품에 관세를 매겨 국내 산업을 지키자는 쪽과, 국가가 공공사업으로 일자리를 만들자는 쪽이 맞서고 있습니다."
 tsin_depression.3.a: "관세를 올린다."
 tsin_depression.3.b: "공공사업을 벌인다."
 tsin_depression.3.c: "때를 기다린다."
 tsin_depression.10.title: "불황의 끝"
 tsin_depression.10.desc: "길었던 불황이 마침내 끝났습니다. 공장 굴뚝에 다시 연기가 오르고 투자자들이 돌아오고 있습니다."
 tsin_depression.10.a: "드디어."

 tsin_scramble_for_colonies: "식민지 쟁탈전"
 tsin_scramble_for_colonies_desc: "증기선과 철도, 기관총을 손에 넣은 산업 강국들이 아직 주인 없는 땅을 차지하려고 앞다투어 나섰습니다. 10년 뒤 열릴 식민 회의에서 각국은 세력권을 나눌지, 공공연히 경쟁할지를 정하게 됩니다."
 tsin_scramble_for_colonies_partition_complete: "분할 완료"
 tsin_scramble_for_colonies_participant_tt: "이 [location|e]의 소유국은 식민지 쟁탈전에 참여하고 있습니다."
 tsin_scramble_for_colonies_unclaimed_tt: "이 [location|e]는 아직 주인이 없습니다."
 LEGEND_KEY_TSIN_SCRAMBLE_PARTICIPANT: "쟁탈전 참여국"
 LEGEND_KEY_TSIN_SCRAMBLE_UNCLAIMED: "주인 없는 땅"
 hint_tsin_scramble_for_colonies: "[GetSituationByKey('tsin_scramble_for_colonies').GetNameWithNoTooltip]"
 hint_tsin_scramble_for_colonies_hint_text: "[GetSituationByKey('tsin_scramble_for_colonies').GetName]이 시작되었습니다. 참여국은 식민 범위와 이주 규모가 늘어납니다.\n\n#T 권장 행동:#!\n@arrow_bonus_tier_3! 주인 없는 땅을 서둘러 식민하십시오.\n@arrow_bonus_tier_2! 제국주의 [casus_belli|e]로 약한 나라의 땅을 노릴 수도 있습니다."
 hint_tsin_scramble_for_colonies_diplomatic: "\"지도 위의 빈칸은 오래 남아 있지 않을 것입니다.\""
 hint_tsin_scramble_for_colonies_administrative: "\"식민지는 얻는 것보다 다스리는 것이 더 어렵습니다.\""
 hint_tsin_scramble_for_colonies_military: "\"원정군은 멀리 갈수록 보급이 어려워집니다.\""
 STATIC_MODIFIER_NAME_tsin_scramble_colonial_drive: "식민지 쟁탈"
 STATIC_MODIFIER_NAME_tsin_scramble_spheres: "합의된 세력권"
 STATIC_MODIFIER_NAME_tsin_scramble_rivalry: "식민 경쟁"
 STATIC_MODIFIER_NAME_tsin_colonial_resistance: "식민지 저항"
 tsin_scramble.1.title: "식민지 쟁탈전"
 tsin_scramble.1.desc: "열강들이 남은 땅을 향해 탐험대와 군대를 보내고 있습니다. 우리도 이 경쟁에서 뒤처질 수 없습니다."
 tsin_scramble.1.a: "깃발을 꽂으러 가자."
 tsin_scramble.2.title: "식민 회의"
 tsin_scramble.2.desc: "열강의 대표들이 한자리에 모여 남은 땅을 어떻게 나눌지 논의하고 있습니다. 세력권을 인정하면 충돌은 줄겠지만, 우리의 몫도 정해져 버립니다."
 tsin_scramble.2.a: "세력권을 받아들인다."
 tsin_scramble.2.b: "모든 권리를 주장한다."
 tsin_scramble.3.title: "식민지의 저항"
 tsin_scramble.3.desc: "새 식민지의 주민들이 무기를 들고 정착민과 교역소를 공격했습니다."
 tsin_scramble.3.a: "징벌 원정대를 보낸다."
 tsin_scramble.3.b: "정착민을 물린다."
 tsin_scramble.10.title: "분할의 끝"
 tsin_scramble.10.desc: "지도 위의 빈칸이 거의 사라졌습니다. 이제 열강의 경쟁은 이미 나뉜 땅을 두고 벌어질 것입니다."
 tsin_scramble.10.a: "새로운 시대다."

