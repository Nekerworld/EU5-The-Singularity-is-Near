 tsin_prospect_for_oil.title: "석유 탐사"
 tsin_prospect_for_oil.desc: "땅에서 스며 나오는 검은 기름은 오래전부터 알려져 있었지만, 이제 증기 굴착기로 깊이 뚫으면 등유와 윤활유를 얼마든지 얻을 수 있습니다. [political_influence|e]를 들여 유망한 땅을 조사합시다."
 tsin_prospect_for_oil.a: "시추를 시작한다."
