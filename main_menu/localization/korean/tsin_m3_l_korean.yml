l_korean:
 tsin_industrial_investment_law: "산업 투자법"
 tsin_industrial_investment_law_desc: "새 공장과 철도를 누가 짓고 누가 돈을 대는지를 정합니다."
 tsin_industrial_investment_law_CATEGORY: "SOCIOECONOMIC_LAW_CATEGORY"
 tsin_state_industry_policy: "국가 주도 산업화"
 tsin_state_industry_policy_desc: "국가가 직접 공장을 세우고 자본을 배분합니다. 정부 사업은 빨라지지만, 계층이 스스로 짓는 건물은 비싸집니다."
 tsin_mixed_investment_policy: "혼합 투자"
 tsin_mixed_investment_policy_desc: "국가와 민간 자본이 함께 산업에 투자합니다. 시민 계층도 도로를 놓을 수 있습니다."
 tsin_private_enterprise_policy: "민간 기업 주도"
 tsin_private_enterprise_policy_desc: "산업 투자를 민간 자본에 맡깁니다. 계층의 건설 비용이 줄고, 시민 계층이 도로와 원자재 생산 건물을 지을 수 있습니다. [employment_system|e]이 자본주의여야 합니다."

 tsin_encourage_industry: "산업 장려"
 tsin_encourage_industry_desc: "선택한 [province|e]에 공장 건설 보조금과 세제 혜택을 줍니다. 공장 건설이 빨라지고 [production_efficiency|e]가 오릅니다."
 tsin_encourage_industry_action: "[SCOPE.sProvince('target').GetNameWithNoTooltip]의 산업 장려"
 tsin_encourage_industry_select_province: "산업을 장려할 [province|e]를 고르십시오:"
 tsin_encourage_industry_active: "[SCOPE.sProvince('target').GetNameWithHighlightOnly]의 산업 장려 중"
 tsin_encourage_industry_no_provinces: "$no_valid_provinces$"
 tsin_promote_railway_construction: "철도 건설 촉진"
 tsin_promote_railway_construction_desc: "내각이 철도 회사에 토지 수용권과 보조금을 내주어 철도와 도로 건설을 앞당깁니다."
 tsin_promote_railway_construction_action: "철도 건설 촉진"
 tsin_promote_railway_construction_active: "철도 건설 촉진 중"

 STATIC_MODIFIER_NAME_tsin_company_steel: "제철 회사"
 STATIC_MODIFIER_NAME_tsin_company_machinery: "기계 회사"
 STATIC_MODIFIER_NAME_tsin_company_textile: "방직 회사"
 STATIC_MODIFIER_NAME_tsin_company_chemical: "화학 회사"
 STATIC_MODIFIER_NAME_tsin_company_railway: "철도 회사"
 tsin_found_steel_company_decision.title: "제철 회사 설립"
 tsin_found_steel_company_decision.desc: "제강소와 광산을 하나로 묶은 거대 제철 회사를 세웁니다. 강철과 철 생산이 늘지만, 회사 운영에 드는 비용으로 [buildings|e] 유지비가 오릅니다. 보유할 수 있는 회사 수는 [ROOT.ScriptValue('tsin_company_limit')|0]개이며, 지금 [ROOT.ScriptValue('tsin_company_count')|0]개를 보유하고 있습니다."
 tsin_found_steel_company_decision.a: "회사를 세운다."
 tsin_found_machinery_company_decision.title: "기계 회사 설립"
 tsin_found_machinery_company_decision.desc: "기관과 공구를 전문으로 만드는 기계 회사를 세웁니다. [buildings|e] 유지비가 조금 오릅니다. 보유 한도: [ROOT.ScriptValue('tsin_company_limit')|0]개, 현재 [ROOT.ScriptValue('tsin_company_count')|0]개."
 tsin_found_machinery_company_decision.a: "회사를 세운다."
 tsin_found_textile_company_decision.title: "방직 회사 설립"
 tsin_found_textile_company_decision.desc: "여러 방직 공장을 거느린 방직 회사를 세웁니다. [buildings|e] 유지비가 조금 오릅니다. 보유 한도: [ROOT.ScriptValue('tsin_company_limit')|0]개, 현재 [ROOT.ScriptValue('tsin_company_count')|0]개."
 tsin_found_textile_company_decision.a: "회사를 세운다."
 tsin_found_chemical_company_decision.title: "화학 회사 설립"
 tsin_found_chemical_company_decision.desc: "비료와 폭약을 만드는 화학 회사를 세웁니다. [buildings|e] 유지비가 조금 오릅니다. 보유 한도: [ROOT.ScriptValue('tsin_company_limit')|0]개, 현재 [ROOT.ScriptValue('tsin_company_count')|0]개."
 tsin_found_chemical_company_decision.a: "회사를 세운다."
 tsin_found_railway_company_decision.title: "철도 회사 설립"
 tsin_found_railway_company_decision.desc: "철도를 놓고 운영하는 철도 회사를 세웁니다. [buildings|e] 유지비가 조금 오릅니다. 보유 한도: [ROOT.ScriptValue('tsin_company_limit')|0]개, 현재 [ROOT.ScriptValue('tsin_company_count')|0]개."
 tsin_found_railway_company_decision.a: "회사를 세운다."
 tsin_dissolve_companies_decision.title: "산업 회사 해산"
 tsin_dissolve_companies_decision.desc: "보유한 산업 회사를 모두 해산합니다. 회사의 생산 보너스와 유지비가 함께 사라집니다."
 tsin_dissolve_companies_decision.a: "모두 해산한다."

 pa_tsin_repeal_corn_laws: "곡물법 폐지"
 pa_tsin_repeal_corn_laws_simple: "곡물법 폐지"
 pa_tsin_repeal_corn_laws_desc: "곡물 관세를 없애 빵값을 낮추고, 공장 노동자의 임금 부담을 덜어 줍니다. 지주들은 반발할 것입니다."
 pa_tsin_protect_grain: "곡물 관세 보호"
 pa_tsin_protect_grain_simple: "곡물 관세 보호"
 pa_tsin_protect_grain_desc: "값싼 외국 곡물에 관세를 매겨 국내 지주와 농업을 보호합니다. 도시의 빵값은 비싸집니다."
 STATIC_MODIFIER_NAME_tsin_corn_laws_protection: "곡물 관세 보호"
 STATIC_MODIFIER_NAME_tsin_corn_laws_repealed: "곡물법 폐지"
 STATIC_MODIFIER_NAME_tsin_bread_riots: "빵 폭동"
 STATIC_MODIFIER_NAME_tsin_landowner_compensation: "지주 보상"

 tsin_corn_laws.1.title: "반곡물법 연맹"
 tsin_corn_laws.1.desc: "공장주와 상인들이 연맹을 꾸려 곡물 관세 폐지를 요구하고 있습니다. 전국을 도는 연설회와 값싼 팸플릿이 '값싼 빵'을 외치고, 지주들은 이것이 농촌을 무너뜨릴 것이라며 맞서고 있습니다."
 tsin_corn_laws.1.a: "연맹을 지지한다."
 tsin_corn_laws.1.b: "집회를 금지한다."
 tsin_corn_laws.1.c: "논쟁이 흘러가게 둔다."
 tsin_corn_laws.2.title: "곡물법 폐지"
 tsin_corn_laws.2.desc: "의회가 곡물 관세를 폐지했습니다. 외국 곡물이 항구로 밀려들고 빵값이 내려가지만, 땅에서 수입을 얻던 지주들은 크게 분노하고 있습니다."
 tsin_corn_laws.2.a: "지주들에게 보상한다."
 tsin_corn_laws.2.b: "시장이 정하게 둔다."
 tsin_corn_laws.3.title: "빵 폭동"
 tsin_corn_laws.3.desc: "흉년에 곡물 관세까지 겹쳐 빵값이 치솟자, 굶주린 군중이 빵집과 곡물 창고를 습격하고 있습니다."
 tsin_corn_laws.3.a: "외국 곡물을 사들인다."
 tsin_corn_laws.3.b: "질서를 회복한다."
 tsin_corn_laws.3.c: "곡물 관세를 중단한다."

 tsin_industrialization: "산업 국가로"
 tsin_industrialization_DESCRIPTION: "증기와 강철의 시대에 뒤처지지 않으려면 농촌 경제를 공장과 철도의 경제로 바꾸어야 합니다."
 tsin_industrialization_CRITERIA_DESCRIPTION: "공장과 도시, 철도망을 갖춘 산업 국가가 되었습니다."
 tsin_industrialization_BUTTON_TOOLTIP: "농장에서 공장으로, 마을에서 도시로. 철도가 이 모든 것을 하나로 묶을 것입니다."
 tsin_industrialization_BUTTON_DETAILS: "$tsin_industrialization_BUTTON_TOOLTIP$"
 tsin_mission_first_factories: "농장에서 공장으로"
 tsin_mission_first_factories_desc: "공장 단계 [buildings|e]이 있는 [locations|e]을 3곳 이상 갖추십시오."
 tsin_mission_machine_works: "기계를 만드는 기계"
 tsin_mission_machine_works_desc: "$tsin_machine_works$을 한 곳 이상 세우십시오."
 tsin_mission_urban_growth: "도시의 성장"
 tsin_mission_urban_growth_desc: "읍 이상인 [locations|e]을 4곳 이상 갖추십시오."
 tsin_mission_rail_link: "첫 철도"
 tsin_mission_rail_link_desc: "수도와 다른 [location|e]을 철도로 이으십시오."
 tsin_mission_railway_boom: "철도 붐"
 tsin_mission_railway_boom_desc: "$tsin_railway_station$을 3곳 이상 세우십시오."
 tsin_mission_industrial_nation: "산업 국가"
 tsin_mission_industrial_nation_desc: "공장 단계 [buildings|e]이 있는 [locations|e]을 8곳 이상 갖추십시오."
