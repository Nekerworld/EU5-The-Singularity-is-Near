l_korean:
 tsin_engines: "기관"
 tsin_engines_desc: "증기기관과 그 부품은 공장, 기선, 기관차를 움직이는 산업 시대의 심장입니다. 철이나 강철 틀에 정밀하게 깎은 구리 부속을 맞추어야 하므로, 숙련된 기계 공장만이 이를 만들어 낼 수 있습니다."

