 tsin_machinery: "기계 공업"
 tsin_machinery_desc: "증기기관과 그 부품을 만드는 공업입니다. 공장, 기선, 철도가 모두 이 산업의 생산물에 기대고 있습니다."

 tsin_machine_works_advance: "기계 공장"
