l_korean:

 # 0.7 encyclopedia concepts and hints
 hint_tsin_labor_grievance: "[tsin_labor_grievance_concept|e]"
 hint_tsin_labor_grievance_hint_text: "노동 불만이 50을 넘었다. 노동법과 사회 보험, 모범 주택이 공장의 노동 조건을 올린다."
 hint_tsin_labor_grievance_diplomatic: "\"굶주린 노동자는 국경을 가리지 않는다.\""
 hint_tsin_labor_grievance_administrative: "\"공장 감독관 한 명이 경찰 열 명보다 싸다.\""
 hint_tsin_labor_grievance_military: "\"파업을 총으로 깨면 다음 파업은 바리케이드가 된다.\""
 hint_tsin_first_bill: "[tsin_bills_concept|e]"
 hint_tsin_first_bill_hint_text: "이제 법 정책은 의회의 법안으로만 바뀐다. 결단으로 법안을 발의하고, 계층과 운동의 지지를 모으자."
 hint_tsin_first_bill_diplomatic: "\"법은 협상의 결과다.\""
 hint_tsin_first_bill_administrative: "\"세 번 읽어야 법이 된다.\""
 hint_tsin_first_bill_military: "\"의회는 포위전처럼 서두르면 진다.\""
 hint_tsin_stock_crash: "[tsin_stock_index_concept|e]"
 hint_tsin_stock_crash_hint_text: "증시가 폭락했다. 주가는 다시 오르겠지만, 폭락 뒤 몇 년은 장기 불황이 시작되기 쉽다."
 hint_tsin_stock_crash_diplomatic: "\"런던이 기침하면 세계가 감기에 걸린다.\""
 hint_tsin_stock_crash_administrative: "\"은행가를 구하는 일은 은행을 구하는 일과 다르다.\""
 hint_tsin_stock_crash_military: "\"전쟁 공채는 폭락장에서 팔리지 않는다.\""
