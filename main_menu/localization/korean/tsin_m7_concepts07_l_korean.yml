l_korean:

 # 0.7 encyclopedia concepts and hints
 game_concept_tsin_time_compression_concept: "시간 압축"
 game_concept_tsin_time_compression_concept_desc: "하루의 길이는 그대로지만, 산업 시대에는 같은 1년 동안 훨씬 많은 일이 일어난다. [ShowAgeName('age_7_industrialization')] 시대에는 연구, 건설, 승급, 이주, 제도 확산이 빨라진다.\n\n산업화가 진행된 나라는 산업 가속 단계를 얻는다. 시대 제도를 수용할 때마다, 공장 일자리 비중이 8%와 20%를 넘을 때, 표준시를 채택할 때 점수가 오르고, 2점·3점·5점에서 1~3단계가 된다. 단계가 오를수록 연구, 건설, 승급이 더 빨라진다.\n\n빨라진 만큼 [tsin_population_governor_concept|e]가 인구를 붙잡는다."
 game_concept_tsin_population_governor_concept: "인구 조절기"
 game_concept_tsin_population_governor_concept_desc: "빠른 성장이 세계를 터뜨리지 않도록, 1년에 한 번 세계 인구를 시대 첫해의 인구와 견준다. 목표 배율은 1900년 ×1.6, 1950년 ×2.4, 2000년 ×5.5이다.\n\n세계 인구가 목표를 넘으면 모든 나라가 제동 1~3단계를 받아 인구 증가가 줄고 식량 소비가 는다. 한 나라의 인구가 한 해에 3% 넘게 늘면 그 나라에 따로 제동이 걸린다. 문해율과 도시화가 높은 나라는 출생이 줄어든다(인구 변천).\n\n콜레라 대유행과 대이주는 인구 압력의 배출구다."
 game_concept_tsin_agricultural_revolution_concept: "농업 혁명"
 game_concept_tsin_agricultural_revolution_concept_desc: "농예 화학, 기계 수확기, 통조림, 증기 탈곡, 냉동 운송, 집약 농업, 질소 고정의 일곱 기술이 농업 단계를 이룬다. 단계마다 식량이 늘고 썩는 양이 준다.\n\n시비 농지는 $tsin_mechanized_farm$으로 개축할 수 있다. 기계화 농장은 비료와 농기계를 쓰는 대신 원자재와 식량을 크게 늘린다.\n\n남는 식량은 바닐라 규칙대로 인구 증가로 이어진다. 1870년대에는 값싼 신대륙 곡물이 밀려드는 곡물 침공이 시작될 수 있다."
 game_concept_tsin_automation_concept: "자동화"
 game_concept_tsin_automation_concept_desc: "공장은 자동화 업그레이드로 개축할 수 있다. 자동화 공장은 더 적은 노동자로 더 많이 생산하지만, 기관과 도구를 소모하고 큰 시장이 필요하다.\n\n[market_access|e]이 0.75보다 낮으면 자동화 공장의 최대 레벨이 한 번 더 줄어든다. 철도역으로 시장 접근도를 올리는 것이 자동화의 전제 조건이다.\n\n자동화 지도 모드는 공장 단계 중 자동화의 비중을 보여 준다."
 game_concept_tsin_labor_conditions_concept: "노동 조건"
 game_concept_tsin_labor_conditions_concept_desc: "공장이 있는 [location|e]마다 노동 조건(0~1)이 있다. 노동법, 사회 보험, 과밀, 모범 주택, 최근 사고와 파업 진압, 숙련도(중등교육), 평민 만족도가 조건을 정한다.\n\n나라의 노동 불만(0~100)은 해마다 공장 노동자 비중과 나쁜 노동 조건을 따라 움직인다. 불만이 높으면 파업, 노동절 시위, 사회주의 세포 같은 사건이 늘고, 노동법 법안이 통과되기 쉬워진다."
 game_concept_tsin_bills_concept: "법안"
 game_concept_tsin_bills_concept_desc: "$tsin_mass_society$를 수용하고 의회가 있는 나라는 법 정책을 법안으로만 바꾼다. 법안을 발의하면 3개월마다 심의가 열리고, 성공 3번이면 통과, 정체 3번이면 폐기된다.\n\n성공 확률은 계층 권력과 선호, 관련 정치 운동, 의회 유형, 논쟁 결과로 정해진다. 심의 중에는 양보, 강행, 여론전, 철회를 고르는 논쟁 이벤트가 나온다.\n\n게임 규칙으로 이 제도를 끄면 정책을 바로 바꾼다."
 game_concept_tsin_corporations_concept: "기업"
 game_concept_tsin_corporations_concept_desc: "관련 기술과 공장이 있으면 결단으로 기업(강철, 기계, 직물, 화학, 철도, 농기계)을 세울 수 있다. 기업마다 본사 [location|e], 주가, 회장이 있다.\n\n특허장(독점, 투자, 확장, 식민 특허 회사)은 기업에 특권을 준다. 회장은 대출, 기부, 스캔들, 정계 진출 같은 사건을 일으킨다.\n\n기업 지도 모드는 본사와 기업 공장을 보여 준다."
 game_concept_tsin_stock_index_concept: "주가 종합지수"
 game_concept_tsin_stock_index_concept_desc: "기업 주가는 분기마다 무작위로 움직인다. 공황, 불황, 노동 불만은 주가를 끌어내리고, 고등교육, 호황, 투자 특허장, 유능한 회장은 끌어올린다. $tsin_monetary_standard_law$의 금본위제는 변동폭을 줄인다.\n\n종합지수는 주가를 기업 건물 레벨로 가중한 평균이다. 지수가 최근 평균의 1.5배를 넘으면 투기 과열이 오고, 과열 끝에, 또는 평균의 60% 아래로 떨어지면 증시 폭락이 온다. 폭락은 장기 불황을 앞당길 수 있다.\n\n결단 \"증권 보고서\"로 지수를 볼 수 있다."
 game_concept_tsin_estimated_gdp_concept: "추정 GDP"
 game_concept_tsin_estimated_gdp_concept_desc: "게임에는 GDP가 없어서 해마다 추정한다. 도시 세원, 교역·세금 수입, 인구에서 나오는 자급 생산을 더하고, 중등·고등교육률로 생산성을 곱한다.\n\n1인당 GDP와 성장률을 함께 기록한다. 1인당 GDP 지도 모드는 지난해 세계 최고값과 견주어 나라를 칠한다. 게임 규칙을 켜면 해마다 게임 로그에 경제 통계가 남고, 외부 도구로 그래프를 그릴 수 있다."
 hint_tsin_labor_grievance: "[tsin_labor_conditions_concept|e]"
 hint_tsin_labor_grievance_hint_text: "노동 불만이 50을 넘었다. 노동법과 사회 보험, 모범 주택이 공장의 노동 조건을 올린다."
 hint_tsin_labor_grievance_diplomatic: "\"굶주린 노동자는 국경을 가리지 않는다.\""
 hint_tsin_labor_grievance_administrative: "\"공장 감독관 한 명이 경찰 열 명보다 싸다.\""
 hint_tsin_labor_grievance_military: "\"파업을 총으로 깨면 다음 파업은 바리케이드가 된다.\""
 hint_tsin_first_bill: "[tsin_bills_concept|e]"
 hint_tsin_first_bill_hint_text: "이제 법 정책은 의회의 법안으로만 바뀐다. 결단으로 법안을 발의하고, 계층과 운동의 지지를 모으자."
 hint_tsin_first_bill_diplomatic: "\"법은 협상의 결과다.\""
 hint_tsin_first_bill_administrative: "\"세 번 읽어야 법이 된다.\""
 hint_tsin_first_bill_military: "\"의회는 포위전처럼 서두르면 진다.\""
 hint_tsin_stock_crash: "[tsin_stock_index_concept|e]"
 hint_tsin_stock_crash_hint_text: "증시가 폭락했다. 주가는 다시 오르겠지만, 폭락 뒤 몇 년은 장기 불황이 시작되기 쉽다."
 hint_tsin_stock_crash_diplomatic: "\"런던이 기침하면 세계가 감기에 걸린다.\""
 hint_tsin_stock_crash_administrative: "\"은행가를 구하는 일은 은행을 구하는 일과 다르다.\""
 hint_tsin_stock_crash_military: "\"전쟁 공채는 폭락장에서 팔리지 않는다.\""
