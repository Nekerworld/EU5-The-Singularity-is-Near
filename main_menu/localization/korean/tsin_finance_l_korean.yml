 TSIN_FINANCE_CAPACITY: "차입 여력"
 TSIN_FINANCE_CAPACITY_NA: "자료 없음. 네이티브 차입 한도 조회가 확인되지 않아 연간 수입을 대출 가능액으로 쓰지 않습니다."
 TSIN_FINANCE_CAPACITY_NOTE: "국고 현금과 차입 여력은 별개의 수치입니다. 준비금·은행·연금·GDP는 국고 현금에 더하지 않습니다."
 TSIN_FINANCE_DEBT: "차입 원금"
 TSIN_FINANCE_COST: "월간 차입 지급액"
 TSIN_FINANCE_INFLATION: "인플레이션"
 TSIN_FINANCE_FIRMS: "설립 기업 수"
 TSIN_FINANCE_ENTRY: "과잉 진입 연속 분기 / 3"
 TSIN_FINANCE_SUPPLY: "심각한 과잉공급 연속 분기 / 4"
 TSIN_FINANCE_MISSING: "—"
 TSIN_FINANCE_BOND_PRINCIPAL: "국채 · 잔여 원금"
 TSIN_FINANCE_DUE_12: "향후 1~12개월 만기 대출"
 TSIN_FINANCE_DUE_NOW: "만기 도래·경과 대출"
 TSIN_FINANCE_TAX_TRADE_ANNUAL: "조세·교역 수입 · 연율 환산"
 TSIN_FINANCE_DEBT_INCOME_RATIO: "부채 / 연율 수입 · %"
 TSIN_FINANCE_PROFILE_NOTE: "부채 요약은 매월 관측한 기준 두캇 값이며 TSIN 기업 대출은 제외합니다. 국채는 만기 대출과 구분합니다. 만기 경과가 곧 채무불이행을 뜻하지 않으며 기본 차환·결제 규칙을 따릅니다. 연율 수입은 현재 월 조세·교역 수입×12로 실제 연간 결산이 아닙니다. 양수 수입 표본이 없으면 비율은 미관측으로 표시합니다."
 TSIN_FINANCE_NOTE: "국고와 부채는 게임의 실제 장부이며 증시는 평가 지수입니다. 위험 지속치는 저장된 분기 관측값으로 은행의 지급 능력·유동성 전체를 나타내지 않습니다. 대출·채권·상환·파산은 신용에서 조작합니다."
 TSIN_FINANCE_MONEY: "통화"
 TSIN_FINANCE_BANK: "은행"
 TSIN_FINANCE_FUNDS: "기금"
 TSIN_FINANCE_OVERVIEW_HINT: "국고·부채 요약·경기 지표를 한눈에 봅니다. 카드에 마우스를 올리면 설명이 나옵니다."
 TSIN_FINANCE_CREDIT_HINT: "받은 대출·빌려준 대출·국채·상환·파산은 이 탭의 기본 대출 화면입니다."
