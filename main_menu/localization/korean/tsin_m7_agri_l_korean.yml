 STATIC_MODIFIER_NAME_tsin_agriculture_reefer_cars: "냉동 화차"
 STATIC_MODIFIER_NAME_tsin_agriculture_rural_exodus: "농촌 이탈"
 STATIC_MODIFIER_NAME_tsin_agriculture_village_ties: "마을 공동체 유지"
