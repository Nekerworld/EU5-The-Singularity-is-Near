 MODIFIER_TYPE_NAME_tsin_farm_machinery_used_for_minting: "농기계를 화폐로 사용"
 MODIFIER_TYPE_DESC_tsin_farm_machinery_used_for_minting: "[ShowGoodsName('tsin_farm_machinery')]가 해당 [country|e] 내에서 화폐로 사용되는지를 결정합니다."
 TSIN_BUILDING_LEVEL_INTENSIVE_FARMING: "$tsin_intensive_farming_advance$"
 TSIN_BUILDING_LEVEL_NITROGEN_FIXATION: "$tsin_nitrogen_fixation_advance$"
 tsin_farm_machinery_works: "농기계 공장"
 tsin_farm_machinery_works_desc: "수확기, 탈곡기, 쟁기를 만들어 농촌에 $tsin_farm_machinery$를 공급합니다. $tsin_mechanized_farm$의 유지에 꼭 필요합니다([tsin_agricultural_revolution_concept|e])."
 tsin_farm_machinery_works_slot_0: "제작 방식"
 tsin_farm_machinery_works_iron: "철제 농기구"
 tsin_farm_machinery_works_steel: "강철 농기계"
 tsin_farm_machinery_works_steam_traction: "증기 견인기"
 tsin_mechanized_farm: "기계화 농장"
 tsin_mechanized_farm_desc: "기계 수확기와 증기 탈곡기, 화학 비료가 같은 땅에서 몇 배의 곡물을 거둡니다. 레벨마다 $tsin_fertilizer$와 $tsin_farm_machinery$를 소비합니다. 기존 $tsin_fertilized_fields$를 개축하여 세웁니다([tsin_agricultural_revolution_concept|e])."
 tsin_mechanized_farm_slot_0: "유지 방식"
 tsin_mechanized_farm_maintenance: "비료와 농기계"
 tsin_nitrogen_fixation_plant: "질소 고정 공장"
 tsin_nitrogen_fixation_plant_desc: "공기 중의 질소를 붙잡아 초석 광산 없이도 $tsin_fertilizer$를 만듭니다. 기존 $tsin_fertilizer_plant$을 개축하여 세웁니다([tsin_chemical_industry_concept|e])."
 tsin_nitrogen_fixation_plant_slot_0: "합성 방식"
 tsin_nitrogen_fixation_cyanamide: "석회질소법"
 tsin_nitrogen_fixation_ammonia: "암모니아 합성"
 tsin_agricultural_chemistry_advance: "농예 화학"
 tsin_agricultural_chemistry_advance_desc: "식물이 흙에서 무엇을 먹는지 밝혀지자, 농부는 거름을 어림이 아니라 계산으로 줍니다."
 tsin_mechanical_reaper_advance: "기계 수확기"
 tsin_mechanical_reaper_advance_desc: "말이 끄는 수확기 한 대가 일꾼 열 명의 일을 합니다. $tsin_farm_machinery_works$을 지을 수 있게 됩니다."
 tsin_canning_advance: "통조림"
 tsin_canning_advance_desc: "밀봉한 깡통 속 음식은 몇 해가 지나도 썩지 않습니다."
 tsin_steam_threshing_advance: "증기 탈곡"
 tsin_steam_threshing_advance_desc: "증기 탈곡기가 겨우내 걸리던 일을 며칠 만에 끝냅니다. $tsin_mechanized_farm$으로 개축할 수 있고, 농기계 공장이 강철을 쓸 수 있게 됩니다."
 tsin_refrigerated_transport_advance: "냉동 운송"
 tsin_refrigerated_transport_advance_desc: "냉동 화차와 냉동선이 고기와 곡물을 지구 반대편까지 신선하게 나릅니다."
 tsin_intensive_farming_advance: "집약 농업"
 tsin_intensive_farming_advance_desc: "윤작과 배수, 증기 견인기로 같은 땅을 더 깊이 갈아 더 많이 거둡니다. $tsin_mechanized_farm$을 2레벨까지 지을 수 있게 됩니다."
 tsin_nitrogen_fixation_advance: "질소 고정"
 tsin_nitrogen_fixation_advance_desc: "공기에서 질소를 뽑아내 칠레 초석에 대한 의존이 끝납니다. $tsin_nitrogen_fixation_plant$으로 개축할 수 있고, $tsin_mechanized_farm$을 3레벨까지 지을 수 있게 됩니다."
 tsin_ammonia_synthesis_advance: "암모니아 합성"
 tsin_ammonia_synthesis_advance_desc: "고압 촉매 반응기가 질소와 수소를 암모니아로 결합합니다. 인류를 먹여 살릴 비료가 공장에서 쏟아집니다."
 tsin_agriculture.10.title: "구아노 붐"
 tsin_agriculture.10.desc: "태평양의 섬에서 실어 온 바닷새 똥이 기적의 비료로 팔립니다. 값은 비싸지만, 써 본 농부들은 수확이 두 배가 되었다고 말합니다."
 tsin_agriculture.10.a: "배째로 사들인다."
 tsin_agriculture.10.b: "국내에서 초석을 찾는다."
 tsin_agriculture.20.title: "수확기 시연회"
 tsin_agriculture.20.desc: "외국 기술자가 말이 끄는 수확기로 밀밭 한 뙈기를 순식간에 베어 냅니다. 구경하던 지주들은 놀라고, 일꾼들은 불안한 눈길을 주고받습니다."
 tsin_agriculture.20.a: "국내 제조업자에게 면허를 준다."
 tsin_agriculture.20.b: "대농장용으로 사들인다."
 tsin_agriculture.30.title: "농업 협회"
 tsin_agriculture.30.desc: "새 농법을 연구하고 품평회를 여는 농업 협회를 세우자는 청원이 올라왔습니다. 누가 협회를 이끌지가 문제입니다."
 tsin_agriculture.30.a: "지주 협회에 왕실 헌장을 준다."
 tsin_agriculture.30.b: "마을 협동조합을 지원한다."
 tsin_agriculture.40.title: "품종 개량"
 tsin_agriculture.40.desc: "육종가들이 더 살찐 가축과 병에 강한 밀을 내놓았습니다. 두 사업 모두 지원을 바랍니다."
 tsin_agriculture.40.a: "가축을 개량한다."
 tsin_agriculture.40.b: "곡물을 개량한다."
 tsin_agriculture.50.title: "첫 냉동 화차"
 tsin_agriculture.50.desc: "얼음을 채운 화차가 먼 목장의 고기를 도시 시장까지 상하지 않고 실어 왔습니다. 도시의 정육점 조합은 반발합니다."
 tsin_agriculture.50.a: "먼 농촌이 도시를 먹이게 한다."
 tsin_agriculture.50.b: "지역 정육점을 보호한다."
 tsin_agriculture.60.title: "농촌 인구 유출"
 tsin_agriculture.60.desc: "기계가 일손을 대신하자 젊은이들이 마을을 떠나 공장 도시로 향합니다. 지주들은 일꾼이 모자란다고 호소합니다."
 tsin_agriculture.60.a: "공장으로 가게 둔다."
 tsin_agriculture.60.b: "땅에 묶어 둔다."
 tsin_agriculture.70.title: "공기로 만든 빵"
 tsin_agriculture.70.desc: "화학자들이 공기 중의 질소를 붙잡는 데 성공했습니다. 같은 공정이 비료도, 폭약의 원료도 만듭니다."
 tsin_agriculture.70.a: "들판에 비료를 보낸다."
 tsin_agriculture.70.b: "병기창에 질산염을 보낸다."
 tsin_agriculture.80.title: "값싼 곡물의 홍수"
 tsin_agriculture.80.desc: "신대륙의 밀이 철도와 증기선을 타고 우리 항구로 쏟아져 들어옵니다. 빵값은 내려가지만 곡물 값이 무너져 농장들이 하나둘 문을 닫습니다."
 tsin_agriculture.80.a: "이 사태를 어떻게 할 것인가."
 tsin_agriculture.81.title: "농업 문제"
 tsin_agriculture.81.desc: "의회는 곡물 위기에 대한 답을 요구합니다. 지주는 관세를, 도시민은 값싼 빵을, 개혁가는 농장의 근대화를 외칩니다."
 tsin_agriculture.81.a: "곡물 보호 관세를 매긴다."
 tsin_agriculture.81.b: "도시에 값싼 빵을."
 tsin_agriculture.81.c: "농장을 근대화한다."
 tsin_agriculture.90.title: "곡물 위기가 지나가다"
 tsin_agriculture.90.desc: "세계 곡물 시장에 새로운 균형이 자리 잡았습니다. 살아남은 농장은 더 크고 더 기계화되었습니다."
 tsin_agriculture.90.a: "땅은 남는다."
