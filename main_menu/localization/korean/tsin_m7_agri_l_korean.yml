 STATIC_MODIFIER_NAME_tsin_farm_modernization: "농장 근대화"
 tsin_grain_invasion: "곡물 침공"
 tsin_grain_invasion_desc: "철도와 증기선이 신대륙의 값싼 곡물을 구대륙 시장으로 실어 나릅니다. 빵은 싸졌지만 곡물을 키우는 농장과 지주는 무너지고 있습니다. 위기를 겪는 나라는 [tariffs|e], 값싼 빵, 농장 근대화 가운데 하나를 골라 빠져나옵니다.\n\n참고: [tsin_grain_invasion_concept|e]"
 tsin_grain_invasion_adjusted: "새로운 균형"
 tsin_grain_invasion_runs_its_course: "위기가 지나가다"
 tsin_grain_invasion_crisis_tt: "이 [country|e]는 곡물 위기를 겪고 있습니다."
 tsin_grain_invasion_policy_tt: "이 [country|e]는 곡물 위기에 대한 정책을 정했습니다."
 tsin_grain_invasion_open_market_legend: "값싼 빵 또는 농장 근대화"
 hint_tsin_grain_invasion: "[GetSituationByKey('tsin_grain_invasion').GetNameWithNoTooltip]"
 hint_tsin_grain_invasion_hint_text: "[GetSituationByKey('tsin_grain_invasion').GetName]이 철도를 가진 농업국들을 덮쳤습니다. 공장 노동자 비중이 20% 이상인 나라는 피해를 입지 않습니다.\n\n#T 권장 행동:#!\n@arrow_bonus_tier_3! 농업 문제 이벤트에서 정책을 고르면 위기가 끝납니다. $tsin_steam_threshing_advance$이 있으면 농장 근대화를 고를 수 있습니다.\n@arrow_bonus_tier_2! [GetSituationByKey('tsin_long_depression').GetName] 중에는 정책 이벤트가 두 배로 자주 옵니다."
 hint_tsin_grain_invasion_diplomatic: "\"빵이 싸면 도시는 웃고 마을은 웁니다.\""
 hint_tsin_grain_invasion_administrative: "\"관세는 지주를 살리고, 기계는 농장을 살립니다.\""
 hint_tsin_grain_invasion_military: "\"농촌의 아들들이 떠나면 연대도 비게 됩니다.\""
