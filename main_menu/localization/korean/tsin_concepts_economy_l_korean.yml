l_korean:
 game_concept_tsin_industrial_economy_concept: "산업 경제"
 game_concept_tsin_industrial_economy_concept_desc: "[ShowAgeName('age_7_industrialization')] 시대에는 공방이 공장으로 바뀝니다. 새 [goods|e]와 [buildings|e]은 하나로 이어진 사슬을 이룹니다. 석탄, 철, 강철이 [ShowBuildingTypeName('tsin_machine_works')]으로 들어가고, 여기서 나온 [ShowGoodsName('tsin_engines')]은 거의 모든 새 건물과 제7시대 함선, 새 공장의 건설에 쓰입니다. 철도는 [market|e]을 넓히고, 화학과 기계는 농장과 광산을 옛 한계 너머로 밀어 올리며, 마침내 전기가 증기를 대신합니다.\n\n산업 경제의 구성:\n$BULLET$[tsin_new_goods_concept|e]: 기관에서 전력까지, 새 재화 일곱 가지.\n$BULLET$[tsin_factories_concept|e]: 새 공장과 그 [production_methods|e].\n$BULLET$[tsin_building_upgrades_concept|e]: 옛 건물을 근대 건물로 개축하기.\n$BULLET$[tsin_chemical_industry_concept|e]: 농장과 광산을 위한 비료와 폭약.\n$BULLET$[tsin_extraction_tiers_concept|e]: 더 깊은 광산과 증기 제재소.\n$BULLET$[tsin_agricultural_revolution_concept|e]: 기계화 농장과 늘어나는 식량.\n$BULLET$[tsin_automation_concept|e]: 큰 시장이 필요한 자동화 공장.\n$BULLET$[tsin_electric_power_concept|e]: 발전소와 전기 생산 방식.\n$BULLET$[tsin_railways_concept|e]: 철도역, [market_access|e], 표준시, 운하.\n$BULLET$[tsin_infrastructure_concept|e]: 상하수도, 증기선 항만, 도청, 도시 조명망.\n$BULLET$[tsin_oil_prospecting_concept|e]: 석유와 고무를 얻는 방법.\n$BULLET$[tsin_industrial_investment_concept|e]: 공장에 누가 돈을 대는가.\n$BULLET$[tsin_customs_union_concept|e]: 산업국 사이의 무관세 교역.\n\n시작하는 법: 이 시대의 [advances|e]을 연구하고, 시장 접근성이 좋은 읍에 [ShowBuildingTypeName('tsin_machine_works')]을 세우십시오. 읍들을 [ShowRoadTypeName('railroad')]로 [capital|e]와 이어 철도역을 짓고, 새 발전이 나올 때마다 옛 공장을 개축하십시오. 첫 공장은 시대가 시작되자마자 [ShowAdvanceName('tsin_machine_works_advance')]으로 열리고, 나머지 대부분은 [institutions|e] [ShowInstitutionName('tsin_industrial_capitalism')]와, 나중에는 [ShowInstitutionName('tsin_electrification')]를 [embraced|e]한 뒤에 열리는 발전이 해금합니다.\n\n지도 모드: $mapmode_tsin_industrialization_name$(공장 일자리), $mapmode_tsin_industrial_siting_name$(공장 입지), $mapmode_tsin_automation_name$, $mapmode_tsin_electrification_name$, $mapmode_tsin_infrastructure_name$, $mapmode_tsin_agriculture_name$, $mapmode_tsin_industrial_investment_name$."
 game_concept_tsin_new_goods_concept: "산업 재화"
 game_concept_tsin_new_goods_concept_desc: "이 시대에는 [goods|e] 일곱 가지가 새로 생깁니다. 어느 것도 [pops|e]이 직접 사지 않습니다. 모두 새 [buildings|e]이 소비하는 투입재이므로, 산업화가 진행될수록 수요가 늘어납니다.\n\n$BULLET$[ShowGoodsName('tsin_engines')](기본 가격 6): [ShowBuildingTypeName('tsin_machine_works')]만 만듭니다. 제7시대 건물 대부분, 제7시대 공장의 건설, 제7시대 함선의 건조와 수리에 쓰입니다. [industry_promotion|e] $tsin_machinery$가 생산을 늘립니다.\n$BULLET$[ShowGoodsName('tsin_fertilizer')](2.5): [ShowBuildingTypeName('tsin_fertilizer_plant')]과 [ShowBuildingTypeName('tsin_nitrogen_fixation_plant')]이 만들고, [ShowBuildingTypeName('tsin_fertilized_fields')]와 [ShowBuildingTypeName('tsin_mechanized_farm')]이 씁니다.\n$BULLET$[ShowGoodsName('tsin_explosives')](5): [ShowBuildingTypeName('tsin_explosives_plant')]이 만들고, 광산의 [ShowBuildingTypeName('tsin_blasting_works')]이 씁니다.\n$BULLET$[ShowGoodsName('tsin_farm_machinery')](5): [ShowBuildingTypeName('tsin_farm_machinery_works')]이 만들고, 기계화 농장이 씁니다.\n$BULLET$[ShowGoodsName('tsin_electricity')](3): [ShowBuildingTypeName('tsin_power_station')]가 만듭니다. 운송비가 매우 높아 대부분 만들어진 [market|e] 안에서 쓰입니다. [tsin_electric_power_concept|e] 항목을 보십시오.\n$BULLET$[ShowGoodsName('tsin_rubber')](4): 열대 밀림에서 채집하는 [raw_material|e]입니다. [ShowBuildingTypeName('tsin_mechanized_textile_mill')]의 구동 벨트가 됩니다.\n$BULLET$[ShowGoodsName('tsin_oil')](4): 채굴하는 [raw_material|e]입니다. 기계 공장의 윤활유와 석유 화력 발전소의 연료가 됩니다.\n\n고무나 석유를 가진 채로 시작하는 [location|e]은 없습니다. [tsin_oil_prospecting_concept|e] 항목을 보십시오.\n\n재화가 모자라면 [market_price|e]이 오르고 그 재화에 기대는 생산이 줄어듭니다. 만드는 건물과 쓰는 건물을 같은 시장에 두십시오."
 game_concept_tsin_factories_concept: "산업 공장"
 game_concept_tsin_factories_concept_desc: "제7시대 공장은 원자재를 새 [goods|e]로 바꾸는 읍과 도시의 [buildings|e]입니다. 바닐라 공장처럼 [production_methods|e]이 있어, 기본 방식은 처음부터 쓸 수 있고 더 나은 방식은 [advances|e]이 해금합니다. 투입재 가격은 바닐라 공장처럼 산출 가치가 투입 비용보다 3분의 1가량 높게 맞춰져 있습니다. 새 공장을 지을 때는 도구와 석재 외에 강철과 [ShowGoodsName('tsin_engines')]도 필요합니다.\n\n새 공장:\n$BULLET$[ShowBuildingTypeName('tsin_machine_works')]([ShowAdvanceName('tsin_machine_works_advance')]): 철([ShowAdvanceName('tsin_steel_frame_engines_advance')] 이후에는 강철)과 석탄, 도구로 기관을 만듭니다. 둘째 칸에서 구리 부속, 유리 계기, 석유 윤활 중 하나를 고릅니다.\n$BULLET$[ShowBuildingTypeName('tsin_fertilizer_plant')], [ShowBuildingTypeName('tsin_explosives_plant')]: [tsin_chemical_industry_concept|e] 항목을 보십시오.\n$BULLET$[ShowBuildingTypeName('tsin_farm_machinery_works')]: 철제, 강철제, 증기 견인 순으로 농장용 기계를 만듭니다.\n$BULLET$[ShowBuildingTypeName('tsin_power_station')]: 석탄, 수력, 석유로 전력을 만듭니다. [tsin_electric_power_concept|e] 항목을 보십시오.\n\n개축하는 공장([tsin_building_upgrades_concept|e]):\n$BULLET$[ShowBuildingTypeName('tsin_mechanized_textile_mill')]([ShowAdvanceName('tsin_mechanized_textile_mill_advance')]): 목화, 양모, 섬유 작물로 직물을 짜며, 둘째 칸에서 증기 동력, 고무 벨트, 수력, 전동기 중 하나를 고릅니다.\n$BULLET$[ShowBuildingTypeName('tsin_nitrogen_fixation_plant')]: 석탄, 전력, 석재로 비료를 만듭니다.\n$BULLET$자동화 공장 여섯 종: [tsin_automation_concept|e] 항목을 보십시오.\n\n개축한 공장은 레벨당 노동자가 바닐라 공장보다 약 40% 적습니다. [estates|e]도 자기 돈으로 이 공장들을 모두 지을 수 있습니다([tsin_industrial_investment_concept|e]).\n\n국가의 지원: [cabinet_action|e] [ShowCabinetActionName('tsin_encourage_industry')]은 선택한 [province|e]의 공장 건설 효율을 25% 올리고 [production_efficiency|e]를 높입니다. 여러 지방을 동시에 지원할 수 있습니다. [ShowAdvanceName('tsin_industrial_capitalism_advance')] 자체도 공장 건설 효율을 25% 올리고 생산 효율을 높이며, [ShowAdvanceName('tsin_shift_work_advance')]는 생산 효율을 더 올리는 대신 농민의 불만을 삽니다. [industry_promotion|e] $tsin_machinery$는 기관 생산을 장려합니다.\n\n$mapmode_tsin_industrialization_name$ 지도 모드는 공장 일자리가 각 지점 인구의 몇 할을 고용할 수 있는지, $mapmode_tsin_industrial_siting_name$ 지도 모드는 시장 접근성, 석탄·철광, 철도역, 도시 등급으로 매긴 입지 점수를 보여 줍니다."
 game_concept_tsin_building_upgrades_concept: "건물 개축"
 game_concept_tsin_building_upgrades_concept_desc: "제7시대 건물 상당수는 새 칸이 아니라 옛 [buildings|e]의 업그레이드입니다. 해금 [advance|e]을 연구하면 기존 건물을 그 자리에서 개축할 수 있고, 지점은 그대로 유지됩니다. 개축한 건물은 대개 노동자가 적게 들고, 기관이나 전력 같은 제7시대 재화를 씁니다.\n\n산업 경제의 개축:\n$BULLET$[ShowBuildingTypeName('textile_mill')] → [ShowBuildingTypeName('tsin_mechanized_textile_mill')]\n$BULLET$[ShowBuildingTypeName('lumber_mill')] → [ShowBuildingTypeName('tsin_steam_sawmill')]\n$BULLET$[ShowBuildingTypeName('iron_mill')], [ShowBuildingTypeName('glass_mill')], [ShowBuildingTypeName('paper_mill')], [ShowBuildingTypeName('furniture_mill')], [ShowBuildingTypeName('printing_mill')], [ShowBuildingTypeName('fine_cloth_mill')] → 자동화 공장 여섯 종([tsin_automation_concept|e])\n$BULLET$[ShowBuildingTypeName('tsin_fertilized_fields')] → [ShowBuildingTypeName('tsin_mechanized_farm')]\n$BULLET$[ShowBuildingTypeName('tsin_fertilizer_plant')] → [ShowBuildingTypeName('tsin_nitrogen_fixation_plant')]\n$BULLET$[ShowBuildingTypeName('aqueduct_system')] → [ShowBuildingTypeName('tsin_waterworks')]\n$BULLET$[ShowBuildingTypeName('naval_base')] → [ShowBuildingTypeName('tsin_steam_port')]\n$BULLET$[ShowBuildingTypeName('provincial_chancery')] → [ShowBuildingTypeName('tsin_prefecture')]\n\n대학에서 개축하는 [ShowBuildingTypeName('tsin_research_university')]와 노동자 연립주택에서 개축하는 [ShowBuildingTypeName('tsin_model_dwellings')]은 [tsin_industrial_society_concept|e]에 속합니다.\n\n옛 건물을 요구하는 주요 바닐라 법률, 특권, 임무, 부대 조건은 업그레이드한 건물도 인정하므로, 개축해도 이를 잃지 않습니다. 일부 바닐라 이벤트는 여전히 옛 건물만 찾지만, 모드가 새 건물을 위한 이벤트를 따로 더합니다. 상하수도는 몇몇 수도에 있는 이름난 수도교의 특별 보너스를 이어받지 않습니다."
 game_concept_tsin_chemical_industry_concept: "화학 공업"
 game_concept_tsin_chemical_industry_concept_desc: "화학은 농장과 광산을 옛 한계 너머로 키웁니다. 공장 두 곳이 새 재화를 만들고, 농촌 [buildings|e] 두 곳이 이를 소비합니다. [ShowAdvanceName('tsin_improved_fertilizer_advance')]가 비료 쪽 두 건물을, [ShowAdvanceName('tsin_dynamite_advance')]가 폭약 쪽 두 건물을 해금합니다.\n\n$BULLET$[ShowBuildingTypeName('tsin_fertilizer_plant')]: 초석, 백반, 석탄(광물 비료) 또는 생선, 가축, 석탄(유기 비료)으로 [ShowGoodsName('tsin_fertilizer')]를 만듭니다. [ShowAdvanceName('tsin_industrial_electrification_advance')]가 전력을 쓰는 전기화학 방식을 더합니다.\n$BULLET$[ShowBuildingTypeName('tsin_explosives_plant')]: 초석, 석탄, 목재(흑색화약, 이윤이 낮음) 또는 초석, 가축, 백반(니트로글리세린)으로 [ShowGoodsName('tsin_explosives')]을 만듭니다.\n$BULLET$[ShowBuildingTypeName('tsin_fertilized_fields')]: 밀, 옥수수, 쌀, 기장, 콩, 감자를 생산하는 농촌 [location|e]에 1레벨까지 짓습니다. 원자재 [output|e] +15%, 식량 증가.\n$BULLET$[ShowBuildingTypeName('tsin_blasting_works')]: 석탄, 철, 구리, 주석, 납, 석재, 대리석, 백반, 초석, 은, 금, 보석, 수은, 소금 광산에 짓습니다. 원자재 생산량 +15%. [tsin_extraction_tiers_concept|e] 항목을 보십시오.\n\n두 농촌 건물은 바닐라 풍차와 같은 방식입니다. 스스로는 아무것도 생산하지 않지만, [building_maintenance|e]로 비료나 폭약(과 약간의 도구)을 쓰고, 건물 보정치가 [rgo|e]의 생산량을 올립니다.\n\n나중에는 [ShowBuildingTypeName('tsin_nitrogen_fixation_plant')]이 비료 공장을 대신해 초석 대신 석탄, 전력, 석재로 비료를 만들고, 시비 농지는 기계화 농장으로 개축할 수 있습니다([tsin_agricultural_revolution_concept|e]). [ShowAdvanceName('tsin_electrochemistry_advance')]은 백반과 초석 생산량을 올립니다."
 game_concept_tsin_extraction_tiers_concept: "광업과 임업"
 game_concept_tsin_extraction_tiers_concept_desc: "광산과 숲도 단계적으로 근대화되며, 단계마다 [advance|e]이 해금합니다.\n\n$BULLET$[ShowAdvanceName('tsin_dynamite_advance')]: [ShowBuildingTypeName('tsin_blasting_works')](1레벨, 원자재 [output|e] +15%)을 해금하고, 광산 [rgo|e] 확장 비용을 20% 줄입니다.\n$BULLET$[ShowAdvanceName('tsin_deep_coal_mining_advance')]: 석탄 생산량 +15%, 최대 RGO 규모 +5%. 발파 채굴장을 2레벨까지 지을 수 있고, 폭약을 덜 쓰는 대신 석탄과 약간의 기관을 쓰는 증기 양수 방식이 생깁니다.\n$BULLET$[ShowAdvanceName('tsin_iron_ore_beneficiation_advance')]: 철 생산량 +15%, 최대 RGO 규모 +5%.\n$BULLET$[ShowBuildingTypeName('tsin_steam_sawmill')]([ShowAdvanceName('tsin_steam_sawmill_advance')]): [ShowBuildingTypeName('lumber_mill')]를 개축합니다. 증기 톱은 도구, 석탄, 약간의 기관으로 더 적은 노동자가 더 많은 목재를 만들고, [ShowAdvanceName('tsin_electric_motor_advance')]가 석탄 대신 전력을 쓰며 더 많이 만드는 전기 톱을 더합니다.\n\n이 시대의 다른 생산량 보너스: [ShowAdvanceName('tsin_bessemer_process_advance')]과 [ShowAdvanceName('tsin_open_hearth_advance')](강철, 철), [ShowAdvanceName('tsin_synthetic_dyes_advance')](염료), [ShowAdvanceName('tsin_practical_electrical_engineering_advance')](구리), [ShowAdvanceName('tsin_electrochemistry_advance')](백반, 초석), [ShowAdvanceName('tsin_vulcanization_advance')](고무), [ShowAdvanceName('tsin_oil_refining_advance')](석유).\n\n고무 산지와 유전 자체는 [tsin_oil_prospecting_concept|e] 항목에서 설명합니다."
 game_concept_tsin_railways_concept: "철도"
 game_concept_tsin_railways_concept_desc: "철도는 산업 경제의 뼈대입니다. 선로는 이전 시대의 바닐라 [ShowRoadTypeName('railroad')] [road|e]를 그대로 쓰며, 이 시대에는 선로를 [market_access|e]으로 바꾸는 철도역이 더해지고 철도 부설 비용이 내려갑니다.\n\n$BULLET$[ShowBuildingTypeName('tsin_railway_station')]([ShowAdvanceName('tsin_railway_network_advance')]): [capital|e]와, 수도까지 끊김 없는 철도로 이어진 읍·도시에 지을 수 있습니다. 레벨마다 지역 시장 접근성 +7.5%이며, [ShowAdvanceName('tsin_steel_rolling_stock_advance')]이 2레벨을 엽니다. 유지비는 석탄, 도구, 기관입니다. [ShowAdvanceName('tsin_telegraph_telephone_advance')]가 약간의 전력으로 석탄과 기관을 아끼는 전신 방식을 더합니다. 수도와의 연결이 끊기면 철도역이 철거되지만, 전쟁 중에는 철거되지 않습니다.\n$BULLET$이제 철도를 놓을 때 목재, 석재, 모래, 강철 외에 석탄과 도구도 들고, 유지에도 석탄이 조금 듭니다.\n$BULLET$철도 비용 절감: 철도망 -10%, 강철 차량 -20%와 도로 건설 시간 단축, [cabinet_action|e] [ShowCabinetActionName('tsin_promote_railway_construction')] 비용 -25%, 도로 건설 시간 -15%. [ShowAdvanceName('tsin_macadam_roads_advance')]는 근대 도로를 20% 싸고 빠르게 놓게 합니다.\n\n중요한 이유: 시장 접근성은 건물의 생산량을 올리고, 0.75를 넘기면 [tsin_automation_concept|e]에 붙는 추가 레벨 상한이 사라집니다. $mapmode_tsin_industrial_siting_name$ 지도 모드도 철도역을 입지 요소로 셉니다.\n\n[ShowDecisionName('tsin_standard_time_decision')]: 철도역 3곳, [ShowAdvanceName('tsin_telegraph_telephone_advance')], 중등교육률 10 이상([tsin_education_ladder_concept|e])을 갖추면 [gold|e]를 내고 나라 전체를 하나의 철도 시간으로 묶을 수 있습니다. 영구히 [production_efficiency|e] +2%, [cabinet_efficiency|e] +3%와 산업 가속 점수 1점([tsin_time_compression_concept|e])을 얻고, 농민이 조금 불만을 품으며, \"공장 시계\" 이벤트가 일어날 수 있게 됩니다.\n\n산업 운하: [ShowAdvanceName('tsin_dynamite_advance')]와 [ShowAdvanceName('tsin_steam_construction_advance')]이 있으면 바닐라 운하 [decisions|e] 옆에 [ShowDecisionName('tsin_build_suez_canal_industrial')]과 [ShowDecisionName('tsin_build_panama_canal_industrial')]이 나타납니다. 필요한 영토와 운하 발전은 같지만, 비용이 200,000 대신 120,000 두카트입니다.\n\n철도망이 퍼지면서 철도 투기 열풍, 궤간 전쟁 같은 이벤트가 따라옵니다."
 game_concept_tsin_infrastructure_concept: "근대 기반 시설"
 game_concept_tsin_infrastructure_concept_desc: "근대 기반 시설은 읍과 도시의 공공 시설을 업그레이드합니다. 이 [buildings|e]은 유지비로 석탄, 도구, 기관을 쓰므로, 뒤에서 받쳐 줄 산업이 있어야 합니다.\n\n$BULLET$[ShowBuildingTypeName('tsin_waterworks')]([ShowAdvanceName('tsin_modern_sewerage_advance')]): [ShowBuildingTypeName('aqueduct_system')]를 개축하거나, 어느 읍에든 새로 짓습니다. [disease_resistance|e] 향상, [population_capacity|e] +5%, 식량과 [prosperity|e] 증가.\n$BULLET$[ShowBuildingTypeName('tsin_steam_port')]([ShowAdvanceName('tsin_steam_merchant_marine_advance')]): 항구의 [ShowBuildingTypeName('naval_base')]를 개축합니다. 함선을 동시에 14척까지 건조하고, [sailors|e] 증가, 수리 속도 향상, [market_access|e] +5%, [migration_attraction|e] 증가. 유지비에 강철도 듭니다.\n$BULLET$[ShowBuildingTypeName('tsin_prefecture')]([ShowAdvanceName('tsin_professional_bureaucracy_advance')]): [core|e] 지점의 [ShowBuildingTypeName('provincial_chancery')]을 개축합니다. 상서원에 필요한 정부 개혁 없이 어느 나라든 지을 수 있습니다. 도시민과 귀족의 [literacy|e] 상한 증가, [control|e] 증가, 팝이 반란에 덜 가담합니다.\n$BULLET$[ShowBuildingTypeName('tsin_electric_lighting')]([ShowAdvanceName('tsin_gas_lighting_advance')]): 읍·도시마다 1레벨입니다. 처음에는 석탄 가스를 쓰고, [ShowAdvanceName('tsin_electric_lighting_advance')]가 전력 방식을 엽니다. [unrest|e] 감소, 문해력 상한 증가, 이주 매력도 증가.\n$BULLET$[ShowBuildingTypeName('tsin_railway_station')]: [tsin_railways_concept|e] 항목을 보십시오.\n\n상하수도, 증기선 항만, 도시 조명망은 [estates|e]이 아니라 국가만 지을 수 있습니다. 이 건물들에는 대악취, 정기 기선 항로 같은 고유 이벤트가 있습니다.\n\n$mapmode_tsin_infrastructure_name$ 지도 모드는 다섯 건물 중 몇 개를 갖췄는지로 지점을 칠합니다."
 game_concept_tsin_oil_prospecting_concept: "석유와 고무"
 game_concept_tsin_oil_prospecting_concept_desc: "[ShowGoodsName('tsin_rubber')]나 [ShowGoodsName('tsin_oil')]를 가진 채로 시작하는 [location|e]은 없습니다. 둘 다 이 시대에 새로 나타납니다.\n\n석유: [ShowAdvanceName('tsin_machine_tools_advance')]가 석유 채굴을 허용하고, [ShowScriptedGeographyName('tsin_potential_oil')]의 농촌 지점을 소유하고 있으면 [decision|e] [ShowDecisionName('tsin_prospect_for_oil')]를 쓸 수 있게 합니다. 바닐라 석탄 탐사처럼 [political_influence|e]을 쓰며, 그 지점들 가운데 현재 [raw_material|e]가 가장 싼 곳 하나를 작은 유전으로 바꿉니다. 여러 번 써서 유전을 늘릴 수 있습니다. 석유 매장지는 19세기의 역사적 유전입니다. 바쿠 일대의 압셰론, 테레크와 쿠반, 왈라키아, 갈리치아, 펜실베이니아, 카나와, 수마트라, 버마, 보르네오가 있습니다.\n\n고무: [ShowAdvanceName('tsin_industrial_capitalism_advance')]가 고무 채집을 허용합니다. 1870년부터 이 발전을 가진 나라가 농촌 열대 밀림을 소유하면 \"고무 붐\" 이벤트가 한 번 일어날 수 있습니다.\n$BULLET$고무 회사에 특허권을 주면 최대 세 지점이 고무 산지가 되고 오랫동안 고무 생산량이 25% 오르지만, 그 지점에 [unrest|e]가 생기고 [control|e]가 떨어집니다.\n$BULLET$국가 감독 농장은 [gold|e]를 들여 한 지점을 바꿉니다.\n$BULLET$숲을 그대로 둘 수도 있습니다.\n\n쓰임새: 석유는 [ShowBuildingTypeName('tsin_machine_works')]의 윤활유와 [ShowBuildingTypeName('tsin_power_station')] 석유 화력 방식의 연료가 되고, 고무는 [ShowBuildingTypeName('tsin_mechanized_textile_mill')]의 구동 벨트가 됩니다. [ShowAdvanceName('tsin_oil_refining_advance')]와 [ShowAdvanceName('tsin_vulcanization_advance')]가 각각 생산량을 20% 올립니다."
 game_concept_tsin_customs_union_concept: "관세 동맹"
 game_concept_tsin_customs_union_concept_desc: "[ShowInternationalOrganizationType('tsin_customs_union')]은 회원국끼리 [import_tariffs|e]를 매기지 않는 산업국의 [international_organization|e]입니다. 시장을 하나로 합칠 수는 없으므로, 회원국 사이마다 양방향 [tariff_exemption|e]를 맺어 줍니다.\n\n창설: [ShowAgeName('age_7_industrialization')] 시대에 자기 [market|e]을 가진 독립국이 [ShowInstitutionName('tsin_industrial_capitalism')]를 [embraced|e]했다면 만들 수 있습니다. 다른 나라는 [subject|e]이나 반란국이 아니고, 다른 관세 동맹에 속하지 않으며, 어느 회원국과도 [rivals|e], 적대, 조약 차단 관계가 아니면 가입할 수 있습니다.\n\n회원국이 얻는 것:\n$BULLET$다른 모든 회원국과의 관세 면제.\n$BULLET$최대 관세 -5%, [merchant_power|e] +5%. 맹주는 교역 우위 +10%를 얻으며, 맹주는 10년마다 점수로 다시 정해집니다.\n$BULLET$회원국끼리 [opinion|e]가 오릅니다.\n$BULLET$[diplomatic_capacity|e]을 회원국 하나당 0.25씩 씁니다.\n\n회원국끼리 전쟁하면 축출되고, 종속국이 되거나 다른 회원국의 경쟁국이 된 나라는 탈퇴하며, 회원국이 둘보다 적어지면 동맹이 해산됩니다. 탈퇴하면 남은 회원국과의 관세 면제가 모두 사라지며, 가입 전에 따로 맺은 면제도 함께 사라집니다."
 game_concept_tsin_electric_power_concept: "전력"
 game_concept_tsin_electric_power_concept_desc: "[ShowGoodsName('tsin_electricity')]은 다른 [goods|e]와 똑같습니다. [ShowBuildingTypeName('tsin_power_station')]가 만들어 [market|e]에서 팔고, 전기 [production_methods|e]이 사들입니다. 운송비가 매우 높아 대부분 만들어진 시장 안에서 쓰입니다.\n\n전력에는 [institution|e] [ShowInstitutionName('tsin_electrification')]가 필요하며, 기본 게임 규칙에서는 1870년 전에 나타나지 않습니다. 관련 [advances|e]:\n$BULLET$[ShowAdvanceName('tsin_dynamo_advance')]: 석탄 화력 발전소를 해금합니다.\n$BULLET$[ShowAdvanceName('tsin_central_power_station_advance')]: 수력과 석유 화력 방식, 전력 생산량 +10%.\n$BULLET$[ShowAdvanceName('tsin_distribution_grid_advance')]: 전력 생산량 +15%.\n$BULLET$[ShowAdvanceName('tsin_electric_motor_advance')], [ShowAdvanceName('tsin_electric_lighting_advance')], [ShowAdvanceName('tsin_telegraph_telephone_advance')], [ShowAdvanceName('tsin_industrial_electrification_advance')]: 아래의 전기 방식을 해금합니다.\n\n발전소 방식: 석탄(석탄, 기관, 도구), 수력(기관, 구리, 도구. 연료가 없는 대신 생산량이 낮음), 석유(석유, 기관, 도구).\n\n전력을 쓰는 곳:\n$BULLET$[ShowBuildingTypeName('tsin_mechanized_textile_mill')]과 자동화 공장 여섯 종([tsin_automation_concept|e])의 전동기 방식.\n$BULLET$[ShowBuildingTypeName('tsin_steam_sawmill')]의 전기 톱.\n$BULLET$[ShowBuildingTypeName('tsin_fertilizer_plant')]의 전기화학 방식과 [ShowBuildingTypeName('tsin_nitrogen_fixation_plant')]의 두 방식.\n$BULLET$[ShowBuildingTypeName('tsin_electric_lighting')]의 전기 방식과 [ShowBuildingTypeName('tsin_railway_station')]의 전신 방식.\n\n시장에 전력이 모자라면 이 건물들의 생산이 줄어듭니다. 방식을 바꾸기 전에 발전소부터 지으십시오. $mapmode_tsin_electrification_name$ 지도 모드는 시장마다 공급이 수요를 채우는지 보여 주며, 첫 발전소를 지을 수 있게 되면 힌트가 알려 줍니다."
 game_concept_tsin_industrial_investment_concept: "산업 투자"
 game_concept_tsin_industrial_investment_concept_desc: "이 시대에는 국가뿐 아니라 [estates|e]도 자기 돈으로 공장을 짓습니다. 계층은 제7시대 공장과 철도역을 모두 지을 수 있으며, 상하수도, 증기선 항만, 도시 조명망은 국가의 몫입니다.\n\n[ShowAdvanceName('tsin_industrial_capitalism_advance')]가 해금하는 [ShowLawName('tsin_industrial_investment_law')]이 누가 앞장설지를 정합니다.\n$BULLET$[ShowPolicyName('tsin_state_industry_policy')]: 국가의 공장 건설 효율이 10% 오르지만, 계층의 건설비가 10%(비싼 건물은 25%) 오릅니다. 사회가 조금씩 절대주의 쪽으로 움직입니다. 왕실이 선호합니다.\n$BULLET$[ShowPolicyName('tsin_mixed_investment_policy')]: 공장 건설 효율이 5% 오르고, 도시민이 도로를 놓을 수 있습니다. 왕실과 도시민이 선호합니다.\n$BULLET$[ShowPolicyName('tsin_private_enterprise_policy')]: 계층의 건설비가 15% 줄고, 도시민이 도로와 [rgo|e]를 지을 수 있습니다. 사회가 자본 경제 쪽으로 움직입니다. 자본주의 [employment_system|e]가 필요합니다. 도시민이 선호합니다.\n\n혼합 투자와 민간 기업 주도 정책은 보유할 수 있는 [tsin_corporations_concept|e]의 수도 하나 늘립니다. 법안 제도가 활성화된 뒤에는 정책을 바꾸려면 [tsin_bills_concept|e]이 필요합니다.\n\n산업을 앞당기는 다른 수단: [cabinet_action|e] [ShowCabinetActionName('tsin_encourage_industry')]([province|e]마다 공장 건설 효율 +25%, [production_efficiency|e] 상승), [ShowAdvanceName('tsin_stock_exchange_advance')]와 [ShowAdvanceName('tsin_limited_liability_advance')](전국의 공장 건설 효율 상승). [ShowAdvanceName('tsin_commercial_banking_advance')]은 인플레이션을 낮추고, 증권 거래소처럼 더 많은 채권을 발행하게 해 줍니다.\n\n$mapmode_tsin_industrial_investment_name$ 지도 모드에서 외국 소유 건물과 나라별 투자 정책을 볼 수 있습니다."
 game_concept_tsin_agricultural_revolution_concept: "농업 혁명"
 game_concept_tsin_agricultural_revolution_concept_desc: "농업 혁명은 식량 잉여를 인구 증가로 바꿉니다. [ShowAdvanceName('tsin_steam_age_advance')]에서 시작하는 [advances|e] 여덟 개로 이루어집니다.\n$BULLET$[ShowAdvanceName('tsin_agricultural_chemistry_advance')]: [monthly_food|e] 증가.\n$BULLET$[ShowAdvanceName('tsin_mechanical_reaper_advance')]: [ShowBuildingTypeName('tsin_farm_machinery_works')] 해금.\n$BULLET$[ShowAdvanceName('tsin_canning_advance')]: [food_decay|e] 감소.\n$BULLET$[ShowAdvanceName('tsin_steam_threshing_advance')]: [ShowBuildingTypeName('tsin_mechanized_farm')]과 강철 농기계 해금.\n$BULLET$[ShowAdvanceName('tsin_refrigerated_transport_advance')]: [food_capacity|e] +15%, 식량 부패 감소.\n$BULLET$[ShowAdvanceName('tsin_intensive_farming_advance')]: 기계화 농장 2레벨, 증기 견인 농기계, 식량 증가.\n$BULLET$[ShowAdvanceName('tsin_nitrogen_fixation_advance')]: [ShowBuildingTypeName('tsin_nitrogen_fixation_plant')] 해금, 기계화 농장 3레벨.\n$BULLET$[ShowAdvanceName('tsin_ammonia_synthesis_advance')]: 암모니아 합성 방식, 비료 생산량 +10%.\n\n기계화 농장은 밀, 옥수수, 쌀, 기장, 콩, 감자 산지의 [ShowBuildingTypeName('tsin_fertilized_fields')]를 개축해 짓습니다. 레벨마다 원자재 [output|e] +20%와 식량을 더하고, [building_maintenance|e]로 비료, 농기계, 약간의 도구를 씁니다. 3레벨이면 시비 농지 보너스의 약 4배이므로, 농업국이라면 비료 공장과 농기계 공장도 함께 갖춰야 합니다.\n\n남는 식량은 바닐라 규칙대로 [population_growth|e]을 높이고, [tsin_population_governor_concept|e]가 폭증을 억제합니다. 1873년부터는 값싼 해외 곡물이 철도는 있지만 공장 노동자가 적은 나라에 [ShowSituationName('tsin_grain_invasion')]을 일으킬 수 있습니다([tsin_industrial_age_situations|e]). 구아노 붐, 농촌 인구 유출, 공기로 만든 빵 같은 이벤트가 단계마다 따라옵니다.\n\n$mapmode_tsin_agriculture_name$ 지도 모드는 소유국의 농업 단계와 시장의 식량 잉여를 보여 줍니다."
 game_concept_tsin_automation_concept: "자동화"
 game_concept_tsin_automation_concept_desc: "자동화는 바닐라 공장 여섯 종을 자동화 공장으로 개축합니다. 각 공장은 예전과 같은 재화 하나를 더 적은 노동자와 단위당 더 적은 원료로 만들지만, 기관이나 전력이 추가로 필요합니다.\n\n$BULLET$[ShowBuildingTypeName('tsin_automated_iron_mill')](도구), [ShowBuildingTypeName('tsin_automated_furniture_mill')](가구): [ShowAdvanceName('tsin_interchangeable_parts_advance')].\n$BULLET$[ShowBuildingTypeName('tsin_automated_paper_mill')](종이), [ShowBuildingTypeName('tsin_automated_glass_mill')](유리): [ShowAdvanceName('tsin_continuous_process_advance')].\n$BULLET$[ShowBuildingTypeName('tsin_automated_printing_mill')](서적): [ShowAdvanceName('tsin_rotary_press_advance')].\n$BULLET$[ShowBuildingTypeName('tsin_automated_fine_cloth_mill')](고급 직물): [ShowAdvanceName('tsin_power_jacquard_advance')].\n\n모든 자동화 공장에는 [production_methods|e]이 둘 있습니다. 증기 동력(기관, 석탄)과, [ShowAdvanceName('tsin_electric_motor_advance')] 이후의 전동기(전력, 약간의 기관)입니다. 전동기 방식은 약 6분의 1을 더 생산합니다.\n\n자동화 공장에는 큰 시장이 필요합니다. 바닐라 공장처럼 [market_access|e]이 0.75보다 낮으면 최대 레벨이 줄어드는데, 자동화 공장은 이 감소가 한 번 더 적용됩니다. 시장 접근성이 0.5이면 바닐라 공장은 레벨 상한의 75%를, 자동화 공장은 약 56%만 유지합니다. 보통은 철도역([tsin_railways_concept|e])으로 시장 접근성을 0.75 위로 올립니다.\n\n$mapmode_tsin_automation_name$ 지도 모드는 공장 레벨 중 자동화 공장의 비중을 보여 주며, [ShowBuildingTypeName('tsin_mechanized_textile_mill')]과 [ShowBuildingTypeName('tsin_nitrogen_fixation_plant')]도 함께 셉니다."
