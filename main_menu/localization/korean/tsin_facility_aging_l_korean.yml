l_korean:
 AUTO_MODIFIER_NAME_tsin_facility_industry_wear: "산업 설비 마모"
 AUTO_MODIFIER_NAME_tsin_facility_industry_gap: "산업 설비 기술 격차"
 tsin_facility_repair_industry: "산업 설비 보수"
 tsin_facility_repair_industry_desc: "등록 지방을 선택합니다. 비용 100두캇 × max(해당 시설 규모/25, 1). 보수는 마모만 회복하고 현대화는 해당 묶음의 연령·국가 기술 대비 설비 기준을 갱신합니다. 다른 묶음을 초기화하지 않습니다. 정비비는 정부 지원금이며 건물 유지 투입과 다릅니다. 고령 자체는 운영 손실이 아니고 마모·기술 격차만 가동 보정에 씁니다. 화학 유출 정지 중 산업 묶음 보정은 중복 적용하지 않습니다. 지원되는 보정 키만 쓰며 전체 지점 생산량을 직접 깎지 않습니다."
 tsin_facility_modernize_industry: "산업 설비 현대화"
