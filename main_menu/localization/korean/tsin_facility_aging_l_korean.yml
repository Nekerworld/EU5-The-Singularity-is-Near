 tsin_facility_budget_on: "지방 설비 정비 지원 예산 켜기"
 tsin_facility_budget_on_desc: "등록 산업 지방의 5~7년 검사 때 시설 규모 × 경과 연수 × 0.25두캇을 묶음별로 지불해 마모를 회복합니다. 국고가 부족하면 지불하지 않고 마모가 진행됩니다. 플레이어는 기본 꺼짐이고 AI는 비용 4배 이상의 현금이 있을 때만 지원합니다. 기존 건물 재화 유지비와 별도의 정부 정비 지원입니다. 기술 현대화는 자동으로 하지 않습니다."
 tsin_facility_budget_off: "지방 설비 정비 지원 예산 끄기"
 tsin_facility_budget_off_desc: "등록 산업 지방의 5~7년 검사 때 시설 규모 × 경과 연수 × 0.25두캇을 묶음별로 지불해 마모를 회복합니다. 국고가 부족하면 지불하지 않고 마모가 진행됩니다. 플레이어는 기본 꺼짐이고 AI는 비용 4배 이상의 현금이 있을 때만 지원합니다. 기존 건물 재화 유지비와 별도의 정부 정비 지원입니다. 기술 현대화는 자동으로 하지 않습니다."
 tsin_facility_inspect: "지방 설비 상태 조사"
 tsin_facility_inspect_desc: "등록된 산업 지방을 선택해 마지막 검사 상태를 TSIN 경제 보고서에 표시합니다. 열람은 마모 진행·보수·현대화·추가 지출을 실행하지 않습니다."
