 tsin_metro_create_desc: "중심도시 10만 이상. 같은 국가의 도로 연결 지점만 최대 24곳까지 묶습니다. 지방 선택 시 조건에 맞는 지점만 편입됩니다. 연결은 분기별 또는 수동으로 재검사하며 실제 인구·식량·노동력을 공유하지 않습니다."
