l_korean:

 tsin_percussion_cap_advance: "뇌관식 소총"
 tsin_percussion_cap_advance_desc: "부싯돌 대신 뇌관으로 점화하는 소총은 비가 와도 불발이 적습니다. 전열 보병은 이 소총을 들고 $a_tsin_line_riflemen$이 됩니다."
 tsin_rifling_advance: "강선"
 tsin_rifling_advance_desc: "총열 안에 새긴 나선 홈이 탄환을 회전시켜 사거리와 정확도를 크게 늘립니다. 흩어져 싸우는 $a_tsin_rifle_skirmishers$을 모집할 수 있게 됩니다."
 tsin_breech_loading_artillery_advance: "후장포"
 tsin_breech_loading_artillery_advance_desc: "포신 뒤쪽에서 포탄을 넣는 강철 대포는 더 빨리, 더 멀리 쏩니다. $a_tsin_breech_loading_battery$를 편성할 수 있게 됩니다."
 tsin_repeating_rifle_advance: "연발총"
 tsin_repeating_rifle_advance_desc: "탄창에 여러 발을 넣어 재장전 없이 연달아 쏘는 소총입니다. 말을 타고 이동해 내려서 싸우는 $a_tsin_mounted_rifles$이 등장합니다."
 tsin_hand_cranked_machine_gun_advance: "수동 기관총"
 tsin_hand_cranked_machine_gun_advance_desc: "손잡이를 돌리면 여러 총열이 차례로 불을 뿜습니다. 방어하는 보병 앞에서 돌격은 점점 더 비싼 대가를 치릅니다."
 tsin_general_staff_advance: "참모본부"
 tsin_general_staff_advance_desc: "철도 시간표와 전신, 지도를 다루는 전문 장교단이 동원과 작전을 미리 계획합니다. 군대는 더 질서 있게 싸우고 더 빨리 보충됩니다."
 tsin_ironclad_advance: "철갑함"
 tsin_ironclad_advance_desc: "증기로 움직이고 쇠판으로 덮인 군함 앞에서 목조 전열함은 시대에 뒤처졌습니다. $n_tsin_ironclad$을 건조할 수 있게 됩니다."
 tsin_monitor_advance: "모니터함"
 tsin_monitor_advance_desc: "낮은 선체 위에 회전 포탑을 얹은 연안 전투함입니다. 먼바다로는 나가기 어렵지만 항구와 해안을 지키는 데 뛰어납니다. $n_tsin_monitor$을 건조할 수 있게 됩니다."
 tsin_torpedo_advance: "어뢰"
 tsin_torpedo_advance_desc: "스스로 물속을 달려가 터지는 어뢰는 작은 배도 거함을 가라앉힐 수 있게 만듭니다. 빠른 $n_tsin_torpedo_boat$을 건조할 수 있게 됩니다."

 a_tsin_line_riflemen: "전열 소총병"
 a_tsin_line_riflemen_desc: "뇌관식 소총으로 무장한 $a_tsin_line_riflemen$은 산업 시대 군대의 중심입니다. 공장에서 찍어 낸 소총과 탄약을 대량으로 소비합니다."
 a_tsin_rifle_skirmishers: "소총 산병"
 a_tsin_rifle_skirmishers_desc: "강선 소총을 든 $a_tsin_rifle_skirmishers$은 흩어져 엄폐물을 찾아 싸우며, 적의 대열을 멀리서 흔듭니다."
 a_tsin_breech_loading_battery: "후장포대"
 a_tsin_breech_loading_battery_desc: "강철 후장포로 무장한 $a_tsin_breech_loading_battery$는 폭약을 채운 포탄을 빠르게 쏟아붓습니다. 강철과 폭약을 소비합니다."
 a_tsin_mounted_rifles: "기마 소총병"
 a_tsin_mounted_rifles_desc: "$a_tsin_mounted_rifles$은 말로 빠르게 움직이고, 내려서 연발총으로 싸웁니다."
 n_tsin_ironclad: "철갑함"
 n_tsin_ironclad_desc: "증기기관과 철갑을 갖춘 $n_tsin_ironclad$은 목조 군함의 포격을 튕겨 냅니다. 강철과 기관, 석탄을 많이 소비합니다."
 n_tsin_monitor: "모니터함"
 n_tsin_monitor_desc: "회전 포탑을 얹은 $n_tsin_monitor$은 연안에서 큰 화력을 냅니다. 느리고 먼바다에 약합니다."
 n_tsin_torpedo_boat: "어뢰정"
 n_tsin_torpedo_boat_desc: "작고 빠른 $n_tsin_torpedo_boat$은 어뢰로 큰 군함을 위협합니다. 폭약을 소비합니다."

 STATIC_MODIFIER_NAME_tsin_military_full_rearmament: "전군 재무장"
 STATIC_MODIFIER_NAME_tsin_military_converted_muskets: "개조한 머스킷"
 STATIC_MODIFIER_NAME_tsin_military_ironclad_programme: "철갑함 건조 계획"
 STATIC_MODIFIER_NAME_tsin_military_coastal_defence: "연안 방어 우선"
 STATIC_MODIFIER_NAME_tsin_military_patriotic_press: "애국 언론"

 tsin_military.10.title: "후장식 소총"
 tsin_military.10.desc: "엎드린 채 뒤에서 탄을 넣는 소총은 서서 꽂을대를 쓰는 병사보다 몇 배 빨리 쏩니다. 장군들은 군 전체를 새로 무장해야 한다고 주장하지만, 무기고에는 아직 멀쩡한 머스킷이 가득합니다."
 tsin_military.10.a: "전군을 한꺼번에 새 소총으로 무장한다."
 tsin_military.10.b: "무기고의 머스킷을 후장식으로 개조한다."
 tsin_military.10.c: "옛 교범으로도 지금까지 모든 전쟁에서 이겼다."
 tsin_military.20.title: "철갑함의 등장"
 tsin_military.20.desc: "증기로 움직이고 쇠판을 두른 군함이 목조 전열함의 포탄을 튕겨 냈다는 소식이 해군성에 닿았습니다. 지금 가진 함대는 하룻밤 사이에 낡은 것이 되었습니다."
 tsin_military.20.a: "철갑함 건조 계획을 서두른다."
 tsin_military.20.b: "먼저 연안과 항구를 지킨다."
 tsin_military.20.c: "값비싼 실수는 다른 나라 해군이 하게 둔다."
 tsin_military.30.title: "종군 기자"
 tsin_military.30.desc: "전신 덕분에 전선의 소식이 다음 날 아침 신문에 실립니다. 기자들의 기사는 승리의 환호뿐 아니라 야전병원의 참상까지 전합니다. 정부는 이 보도를 어떻게 다룰지 정해야 합니다."
 tsin_military.30.a: "전보를 검열한다."
 tsin_military.30.b: "애국적인 신문에 소식을 먼저 준다."
 tsin_military.30.c: "기자들이 자유롭게 보도하게 둔다."

 tsin_romantic_painting: "낭만주의 회화"
 tsin_romantic_painting_desc: "폭풍이 이는 바다와 폐허, 민족의 전설을 그린 그림입니다. 이성보다 감정과 숭고함을 앞세웁니다."
 tsin_romantic_painting_name: "$ADJECTIVE|U$ $FIRST_NOUN|U$"
 tsin_photograph: "사진"
 tsin_photograph_desc: "빛과 화학 약품으로 한순간을 그대로 남긴 사진입니다. 초상, 풍경, 전쟁터가 처음으로 있는 그대로 기록됩니다."
 tsin_photograph_name: "$ADJECTIVE|U$ $FIRST_NOUN|U$"
 tsin_opera: "오페라"
 tsin_opera_desc: "노래와 관현악, 무대를 하나로 엮은 극음악입니다. 이 시대의 오페라는 민족의 영웅과 비극적 사랑을 노래합니다."
 tsin_opera_name: "$ADJECTIVE|U$ $FIRST_NOUN|U$"
 tsin_realist_novel: "사실주의 소설"
 tsin_realist_novel_desc: "공장과 빈민가, 평범한 사람들의 삶을 꾸밈없이 그린 소설입니다. 독자는 웃고 울면서 사회의 모순을 마주합니다."
 tsin_realist_novel_name: "$ADJECTIVE|U$ $FIRST_NOUN|U$"

 STATIC_MODIFIER_NAME_tsin_art_national_romanticism: "민족 낭만주의"
 STATIC_MODIFIER_NAME_tsin_art_realist_letters: "사실주의 문학"
 STATIC_MODIFIER_NAME_tsin_art_photographic_survey: "사진 측량 사업"

 tsin_art.10.title: "낭만주의"
 tsin_art.10.desc: "젊은 시인과 화가들이 고전의 규칙을 버리고 민족의 전설과 거친 자연, 격렬한 감정을 노래합니다. 살롱과 극장은 이 새 물결로 들끓고 있습니다."
 tsin_art.10.a: "민족의 시인들을 후원한다."
 tsin_art.10.b: "고전의 품격을 지킨다."
 tsin_art.20.title: "사실주의"
 tsin_art.20.desc: "공장 노동자와 빈민가의 삶을 그대로 그린 소설이 연재되자 도시가 떠들썩합니다. 성직자들은 외설스럽다며 판매 금지를 요구합니다."
 tsin_art.20.a: "소설이 빈민가를 이야기하게 둔다."
 tsin_art.20.b: "풍속을 해친다며 금서로 지정한다."
 tsin_art.30.title: "사진술"
 tsin_art.30.desc: "은판 위에 빛으로 그린 그림, 사진이 수도에 들어왔습니다. 초상 사진관 앞에 사람들이 줄을 서고, 관리들은 이것을 측량과 기록에 쓸 수 있지 않을까 궁리합니다."
 tsin_art.30.a: "나라 전체를 사진으로 측량하고 기록한다."
 tsin_art.30.b: "초상 사진관에 맡겨 둔다."

 tsin_source_of_the_nile_expedition: "나일강 수원 탐사"
 tsin_source_of_the_nile_expedition_desc: "동아프리카 해안에서 내륙으로 탐험대를 보내 대호수 지대를 지나, 지리학의 가장 오래된 질문인 나일강이 어디서 시작되는지를 밝힌다."
 tsin_source_of_the_nile_expedition_historical_info: "고대 지리학자들은 나일강의 수원을 '달의 산맥'에 두었고, 이천 년 동안 누구도 그 말이 옳은지 그른지 증명하지 못했다. 19세기 중반 잔지바르 해안에서 출발한 탐험대들이 내륙의 대호수에 닿았고, 어느 호수가 강의 원천인지를 두고 격렬한 공개 논쟁이 벌어졌다."
 tsin_source_of_the_nile_expedition_outcome_overview: "$BULLET$세계에서 처음으로 [ShowLocationName('buganda')]에 닿은 나라가 나일강 수원을 찾아내고, 다음 중 하나를 고른다.\n$BULLET_WITH_TAB$#G +15#! [prestige|e].\n$BULLET_WITH_TAB$#G +10#! [prestige|e]과 [ShowModifier('tsin_expedition_geographical_society')] [modifier|e].\n$BULLET$[ShowLocationName('gondokoro')]에 닿으면 탐험이 끝나고 #G +10#! [prestige|e]과 [ShowModifier('tsin_expedition_geographic_fame')] [modifier|e]를 얻는다.\n$BULLET$탐험이 실패하면 [prestige|e] #R -5#!."

 tsin_northwest_passage_expedition: "북서항로 탐사"
 tsin_northwest_passage_expedition_desc: "북극 얼음 가장자리까지 배를 보내, 아메리카 대륙 북쪽으로 대서양과 태평양을 잇는 바닷길을 찾는다."
 tsin_northwest_passage_expedition_historical_info: "항해자들은 16세기부터 아시아로 가는 북쪽 바닷길을 찾았다. 19세기에 이 탐색은 국가의 자존심이 걸린 일이 되었고, 탐험대 전체가 얼음 속에서 사라지기도 했다. 항로는 실제로 있었지만, 너무 얼어붙어 무역에는 쓸모가 없었다."
 tsin_northwest_passage_expedition_outcome_overview: "$BULLET$배가 얼음 가장자리에 닿으면 #Y 35%#! 확률로 항로를 찾는다.\n$BULLET_WITH_TAB$#G +15#! [prestige|e]과 [ShowModifier('tsin_expedition_geographic_fame')] [modifier|e].\n$BULLET$찾지 못하면 얼음에 막혀 돌아오며 #G +5#! [prestige|e]을 얻고, 탐험을 다시 보낼 수 있다.\n$BULLET$어느 나라든 항로를 찾으면 더는 이 탐험을 시작할 수 없다.\n$BULLET$탐험이 실패하면 [prestige|e] #R -5#!."

 tsin_polar_expedition: "북극점 도전"
 tsin_polar_expedition_desc: "증기 기관과 철판으로 보강한 배를 북극권 너머로 보내, 유빙을 뚫고 극점으로 나아간다."
 tsin_polar_expedition_historical_info: "19세기 후반 탐험대들은 배, 썰매, 심지어 기구로 북극점에 닿으려 했다. 일부러 배를 얼음에 얼려 붙여 해류에 실려 북쪽으로 떠내려가기도 했다. 수십 년 동안 유빙은 모든 시도를 막아 냈다."
 tsin_polar_expedition_outcome_overview: "$BULLET$배가 유빙에 닿으면 #Y 30%#! 확률로 극점에 이른다.\n$BULLET_WITH_TAB$#G +15#! [prestige|e]과 [ShowModifier('tsin_expedition_geographic_fame')] [modifier|e].\n$BULLET$이르지 못하면 얼음에 막혀 돌아오며 #G +5#! [prestige|e]을 얻고, 탐험을 다시 보낼 수 있다.\n$BULLET$어느 나라든 극점에 이르면 더는 이 탐험을 시작할 수 없다.\n$BULLET$탐험이 실패하면 [prestige|e] #R -5#!."

 STATIC_MODIFIER_NAME_tsin_expedition_geographic_fame: "지리학적 명성"
 STATIC_MODIFIER_NAME_tsin_expedition_geographical_society: "왕립 지리학회"

 tsin_expedition.1.title: "나일강의 수원"
 tsin_expedition.1.desc: "우리 탐험대가 거대한 내륙 호수에 닿았고, 그곳에서 큰 강이 북쪽으로 흘러 나간다. 탐험가는 이것이 고대부터 지리학자들을 피해 온 나일강의 수원이라고 확신한다."
 tsin_expedition.1.a: "호수에 군주의 이름을 붙이자."
 tsin_expedition.1.b: "지리학회에 발견을 보고하자."
 tsin_expedition.10.title: "북서항로"
 tsin_expedition.10.desc: "우리 배가 북극 섬들 사이를 헤쳐 나가 서쪽으로 이어지는 열린 바다를 찾았다. 두 대양을 잇는 항로는 정말로 있었다."
 tsin_expedition.10.a: "온 세계가 보도록 해도에 그려 넣자."
 tsin_expedition.11.title: "얼음에 막혀 돌아오다"
 tsin_expedition.11.desc: "서쪽 길을 찾기 전에 얼음이 배를 에워쌌다. 선장은 배가 부서지기 전에 뱃머리를 돌렸고, 얼음 가장자리의 해도만 가지고 돌아왔다."
 tsin_expedition.11.a: "다시 도전하자."
 tsin_expedition.20.title: "극점에 이르다"
 tsin_expedition.20.desc: "몇 달 동안 얼음과 함께 떠내려가고 얼음 위를 걸은 끝에, 우리 탐험가들이 세계의 꼭대기에 깃발을 꽂았다."
 tsin_expedition.20.a: "국민의 승리다!"
 tsin_expedition.21.title: "유빙의 승리"
 tsin_expedition.21.desc: "철판으로 보강한 선체로도 유빙은 뚫리지 않았다. 배는 돌아왔지만 극점은 여전히 닿을 수 없는 곳에 있다."
 tsin_expedition.21.a: "얼음이 영원히 버티지는 못한다."

 tsin_open_treaty_port: "조약항 개항"
 tsin_open_treaty_port_desc: "그들의 항구 도시 하나를 우리 상인에게 연다. 조건은 그들이 정할 수 없다."
 tsin_open_treaty_port_entry: "[target.GetOwner.GetFlagIcon] [target.GetName] 조약항 개항"
 tsin_open_treaty_port_entry_short: "[target.GetOwner.GetFlagIconWithNoTooltip] [target.GetNameWithNoTooltip] 조약항"
 tsin_open_treaty_port_select_location: "개항할 항구 [location|e]을 고르십시오:"
 tsin_open_treaty_port_no_locations: "$no_valid_locations$"
 DIPLOREASON_TSIN_PORT_VALUE: "항구의 가치"
 antagonism_tsin_treaty_port: "[peace_treaty|e]으로 조약항을 강제로 열었음"

 STATIC_MODIFIER_NAME_tsin_treaty_port: "조약항"
 STATIC_MODIFIER_NAME_tsin_unequal_treaty: "불평등 조약"
 STATIC_MODIFIER_NAME_tsin_treaty_port_concessions: "조약항 이권"

 tsin_modernization: "근대화 개혁"
 tsin_modernization_DESCRIPTION: "외국 포함과 불평등 조약은 우리가 얼마나 뒤처졌는지 보여 주었습니다. 산업 강국의 방식을 배워야만 그들에게 맞설 수 있습니다."
 tsin_modernization_CRITERIA_DESCRIPTION: "근대식 군대와 학교, 공장과 철도를 갖추고 불평등 조약을 개정했습니다."
