 game_concept_tsin_electric_power_concept: "전력"
 game_concept_tsin_electric_power_concept_desc: "[ShowGoodsName('tsin_electricity')]은 [ShowBuildingTypeName('tsin_power_station')]가 석탄, 물의 낙차, 석유로 만들어 내며, 다른 [goods|e]처럼 [market|e]에서 거래된다.\n\n전력을 쓰는 곳:\n$BULLET$전동기 방식을 쓰는 [ShowBuildingTypeName('tsin_mechanized_textile_mill')].\n$BULLET$전기화학 방식을 쓰는 [ShowBuildingTypeName('tsin_fertilizer_plant')].\n$BULLET$읍과 도시의 [ShowBuildingTypeName('tsin_electric_lighting')].\n\n시장에 전력이 모자라면 이 건물들의 생산이 줄어든다. $mapmode_tsin_electrification_name$ 지도 모드에서 시장마다 수요가 얼마나 채워지는지 볼 수 있다."
 game_concept_tsin_industrial_investment_concept: "산업 투자"
 game_concept_tsin_industrial_investment_concept_desc: "이 시대에는 국가뿐 아니라 [estates|e]도 자기 돈으로 공장을 짓는다. 누가 앞장설지는 [ShowLawName('tsin_industrial_investment_law')]이 정한다.\n$BULLET$국가 주도 산업화: 국가의 공장 건설 효율이 오르지만 계층의 건설비가 비싸진다.\n$BULLET$혼합 투자: 둘 사이의 균형을 잡는다.\n$BULLET$민간 기업 주도: 계층의 건설비가 싸진다. 자본주의 [employment_system|e]가 필요하다.\n\n$mapmode_tsin_industrial_investment_name$ 지도 모드에서 외국 소유 건물과 나라별 투자 정책을 볼 수 있다."
 game_concept_tsin_movements_concept: "정치 운동"
 game_concept_tsin_movements_concept_desc: "이 시대에는 사상이 군대보다 빨리 퍼진다. 나라마다 정치 운동의 세기를 0~100으로 기록한다. 노예제 폐지 운동(노예제가 있는 나라만), 자유주의, 민족주의, 노동 운동, 사회주의, 여성 참정권이다.\n\n운동은 매년 법, 정책, [societal_values|e], [advances|e]에 따라 자라고, 요구가 받아들여지면 줄어든다. 60 이상이 된 운동은 선동을 시작해 50 아래로 떨어질 때까지 불이익을 준다.\n\n가장 강한 운동의 세기가 그 나라의 급진성이며, $mapmode_tsin_radicalism_name$ 지도 모드에서 볼 수 있다."
 game_concept_tsin_treaty_port_concept: "조약항"
 game_concept_tsin_treaty_port_concept_desc: "패전국보다 [advances|e]이 많은 나라는 [peace_treaty|e]에서 상대의 항구 도시 하나를 조약항으로 열라고 요구할 수 있다. 30년 동안:\n$BULLET$그 항구는 [market_access|e]과 이주 매력이 오르지만, 통제가 낮아지고 불안이 커진다.\n$BULLET$패전국은 [ShowModifier('tsin_unequal_treaty')]을 받는다.\n$BULLET$승전국은 [ShowModifier('tsin_treaty_port_concessions')]을 얻는다.\n\n항구를 강제로 연 나라는 근대화 개혁 임무를 받을 수 있고, 이를 마치면 불평등 조약을 개정한다."
 game_concept_tsin_industrial_age_situations: "산업 시대의 상황"
 game_concept_tsin_industrial_age_situations_desc: "[ShowAgeName('age_7_industrialization')] 시대의 [situations|e]:\n$BULLET$[ShowSituationName('tsin_long_depression')]\n$BULLET$[ShowSituationName('tsin_scramble_for_colonies')]\n$BULLET$[ShowSituationName('tsin_springtime_of_nations')]\n$BULLET$[ShowSituationName('tsin_world_exhibition')]"

 hint_tsin_electric_power: "[tsin_electric_power_concept|e]"
 hint_tsin_electric_power_hint_text: "[ShowBuildingTypeName('tsin_power_station')]를 지을 줄 알지만 아직 하나도 없다. [ShowGoodsName('tsin_electricity')]이 없으면 우리 [market|e]에서 전기 기계와 조명이 돌아가지 않는다."
 hint_tsin_electric_power_diplomatic: "\"밤에도 불 밝힌 도시는 근대 국가의 가장 좋은 광고다.\""
 hint_tsin_electric_power_administrative: "\"발전소를 먼저 지어라. 공장은 따라온다.\""
 hint_tsin_electric_power_military: "\"오늘은 발전기, 내일은 탐조등과 무선이다.\""
 hint_tsin_unequal_treaty: "[tsin_treaty_port_concept|e]"
 hint_tsin_unequal_treaty_hint_text: "우리는 조약항을 강제로 열어야 했다. 근대화로 조약을 개정하지 않으면 [ShowModifier('tsin_unequal_treaty')]은 수십 년 동안 이어진다."
 hint_tsin_unequal_treaty_diplomatic: "\"대포 앞에서 맺은 조약은 대포의 주인이 바뀔 때 개정된다.\""
 hint_tsin_unequal_treaty_administrative: "\"공장, 학교, 철도가 조약 개정으로 가는 길이다.\""
 hint_tsin_unequal_treaty_military: "\"근대식 군대는 협상 테이블에서 가장 강한 논거다.\""
 hint_tsin_radical_movements: "[tsin_movements_concept|e]"
 hint_tsin_radical_movements_hint_text: "우리 정치 운동 가운데 하나가 급진화했다. 법과 정책으로 요구를 들어주는 것이 가장 확실한 진정책이다."
 hint_tsin_radical_movements_diplomatic: "\"혁명은 국경을 넘는다.\""
 hint_tsin_radical_movements_administrative: "\"때맞춰 내준 개혁이 바리케이드보다 싸다.\""
 hint_tsin_radical_movements_military: "\"총검은 군중을 흩을 수 있어도 사상은 흩을 수 없다.\""

