 tsin_flavor.10.title: "항구의 포함"
 tsin_flavor.10.desc: "외국 깃발을 단 증기 군함들이 우리 항구 앞바다에 닻을 내렸다. 그들의 사절은 항구를 자국 상인에게 열어 달라고 정중하게 요청한다. 도시를 겨눈 대포를 보고 그것을 정중함이라 여기는 사람은 없다."
 tsin_flavor.10.a: "아직 협상할 수 있을 때 항구를 연다."
 tsin_flavor.10.b: "우리 항구는 닫힌 채로 둔다."
 tsin_flavor.20.title: "농노 해방"
 tsin_flavor.20.desc: "백성의 절반이 아직 영주의 땅에 묶여 있다. 개혁가들은 농노의 나라로는 공장을 채울 수도, 근대식 군대를 꾸릴 수도 없다고 경고한다. 지주들은 자유가 파멸과 반란을 부를 것이라고 경고한다."
 tsin_flavor.20.a: "토지와 함께 해방하고, 상환금으로 값을 치르게 한다."
 tsin_flavor.20.b: "해방하되 토지는 영주에게 남긴다."
 tsin_flavor.20.c: "옛 질서는 지금까지 우리에게 충분했다."
 tsin_flavor.30.title: "근대화 칙령"
 tsin_flavor.30.desc: "외국에 굴욕을 당한 궁정이 개혁을 어디까지 할지 논쟁하고 있다. 어떤 이들은 국가를 위에서 아래까지 새로 짜려 하고, 어떤 이들은 외국의 총포와 기계만 들여오고 나머지는 그대로 두려 한다."
 tsin_flavor.30.a: "국가 전체의 개편을 선포한다."
 tsin_flavor.30.b: "기계는 외국의 것을, 제도는 우리의 것을."
 tsin_flavor.30.c: "조상의 법도를 버리지 않는다."

