l_korean:

 tsin_percussion_cap_advance: "뇌관식 소총"
 tsin_percussion_cap_advance_desc: "부싯돌 대신 뇌관으로 점화하는 소총은 비가 와도 불발이 적습니다. 전열 보병은 이 소총을 들고 $a_tsin_line_riflemen$이 됩니다."
 tsin_rifling_advance: "강선"
 tsin_rifling_advance_desc: "총열 안에 새긴 나선 홈이 탄환을 회전시켜 사거리와 정확도를 크게 늘립니다. 흩어져 싸우는 $a_tsin_rifle_skirmishers$을 모집할 수 있게 됩니다."
 tsin_breech_loading_artillery_advance: "후장포"
 tsin_breech_loading_artillery_advance_desc: "포신 뒤쪽에서 포탄을 넣는 강철 대포는 더 빨리, 더 멀리 쏩니다. $a_tsin_breech_loading_battery$를 편성할 수 있게 됩니다."
 tsin_repeating_rifle_advance: "연발총"
 tsin_repeating_rifle_advance_desc: "탄창에 여러 발을 넣어 재장전 없이 연달아 쏘는 소총입니다. 말을 타고 이동해 내려서 싸우는 $a_tsin_mounted_rifles$이 등장합니다."
 tsin_hand_cranked_machine_gun_advance: "수동 기관총"
 tsin_hand_cranked_machine_gun_advance_desc: "손잡이를 돌리면 여러 총열이 차례로 불을 뿜습니다. 방어하는 보병 앞에서 돌격은 점점 더 비싼 대가를 치릅니다."
 tsin_general_staff_advance: "참모본부"
 tsin_general_staff_advance_desc: "철도 시간표와 전신, 지도를 다루는 전문 장교단이 동원과 작전을 미리 계획합니다. 군대는 더 질서 있게 싸우고 더 빨리 보충됩니다."
 tsin_ironclad_advance: "철갑함"
 tsin_ironclad_advance_desc: "증기로 움직이고 쇠판으로 덮인 군함 앞에서 목조 전열함은 시대에 뒤처졌습니다. $n_tsin_ironclad$을 건조할 수 있게 됩니다."
 tsin_monitor_advance: "모니터함"
 tsin_monitor_advance_desc: "낮은 선체 위에 회전 포탑을 얹은 연안 전투함입니다. 먼바다로는 나가기 어렵지만 항구와 해안을 지키는 데 뛰어납니다. $n_tsin_monitor$을 건조할 수 있게 됩니다."
 tsin_torpedo_advance: "어뢰"
 tsin_torpedo_advance_desc: "스스로 물속을 달려가 터지는 어뢰는 작은 배도 거함을 가라앉힐 수 있게 만듭니다. 빠른 $n_tsin_torpedo_boat$을 건조할 수 있게 됩니다."

 a_tsin_line_riflemen: "전열 소총병"
 a_tsin_line_riflemen_desc: "뇌관식 소총으로 무장한 $a_tsin_line_riflemen$은 산업 시대 군대의 중심입니다. 공장에서 찍어 낸 소총과 탄약을 대량으로 소비합니다."
 a_tsin_rifle_skirmishers: "소총 산병"
 a_tsin_rifle_skirmishers_desc: "강선 소총을 든 $a_tsin_rifle_skirmishers$은 흩어져 엄폐물을 찾아 싸우며, 적의 대열을 멀리서 흔듭니다."
 a_tsin_breech_loading_battery: "후장포대"
 a_tsin_breech_loading_battery_desc: "강철 후장포로 무장한 $a_tsin_breech_loading_battery$는 폭약을 채운 포탄을 빠르게 쏟아붓습니다. 강철과 폭약을 소비합니다."
 a_tsin_mounted_rifles: "기마 소총병"
 a_tsin_mounted_rifles_desc: "$a_tsin_mounted_rifles$은 말로 빠르게 움직이고, 내려서 연발총으로 싸웁니다."
 n_tsin_ironclad: "철갑함"
 n_tsin_ironclad_desc: "증기기관과 철갑을 갖춘 $n_tsin_ironclad$은 목조 군함의 포격을 튕겨 냅니다. 강철과 기관, 석탄을 많이 소비합니다."
 n_tsin_monitor: "모니터함"
 n_tsin_monitor_desc: "회전 포탑을 얹은 $n_tsin_monitor$은 연안에서 큰 화력을 냅니다. 느리고 먼바다에 약합니다."
 n_tsin_torpedo_boat: "어뢰정"
 n_tsin_torpedo_boat_desc: "작고 빠른 $n_tsin_torpedo_boat$은 어뢰로 큰 군함을 위협합니다. 폭약을 소비합니다."
