l_korean:

 # Cholera pandemic (in_game/common/disasters/tsin_cholera.txt)
 tsin_cholera: "콜레라 대유행"
 tsin_cholera_desc: "아시아에서 시작된 콜레라가 증기선과 철도를 타고 세계로 퍼집니다. 상하수도 없이 사람이 몰린 도시가 가장 먼저 쓰러집니다. [capital|e]에 상하수도를 놓고 공중보건 운동을 벌이면 더 빨리 끝납니다.\n\n참고: [tsin_cholera_concept|e]"
 STATIC_MODIFIER_NAME_tsin_cholera_quarantine: "항구 검역"
 STATIC_MODIFIER_NAME_tsin_sanitary_science: "위생학"
 STATIC_MODIFIER_NAME_tsin_sewer_movement: "하수도 운동"
 tsin_cholera.1.title: "콜레라가 왔다"
 tsin_cholera.1.desc: "항구 도시에서 병자들이 하룻밤 사이에 쓰러지고 있습니다. 심한 설사와 탈수 끝에 피부가 푸르게 변하는 무서운 병입니다. 의사들은 나쁜 공기 탓이라 하고, 상인들은 검역으로 교역을 막지 말라고 합니다."
 tsin_cholera.1.a: "항구를 검역한다."
 tsin_cholera.1.b: "교역은 멈출 수 없다."
 tsin_cholera.2.title: "[tsin_cholera_city.GetName]의 콜레라"
 tsin_cholera.2.desc: "빽빽한 공동 주택과 오물이 흐르는 골목에서 콜레라가 번졌습니다. [tsin_cholera_city.GetName]의 묘지가 모자랄 지경입니다."
 tsin_cholera.2.a: "죽은 이들을 묻는다."
 tsin_cholera.2.b: "임시 병원을 연다."
 tsin_cholera.3.title: "펌프 손잡이"
 tsin_cholera.3.desc: "한 의사가 사망자의 집을 지도에 찍어 보니, 모두 한 우물 펌프 주변에 몰려 있었습니다. 병은 나쁜 공기가 아니라 더러운 물로 옮는다는 것입니다. 그는 펌프 손잡이를 떼어 내자고 합니다."
 tsin_cholera.3.a: "펌프 손잡이를 떼어 낸다."
 tsin_cholera.3.b: "나쁜 공기 탓이라는 건 다 아는 일이다."
 tsin_cholera.10.title: "대유행이 지나가다"
 tsin_cholera.10.desc: "콜레라가 마침내 물러갔습니다. 살아남은 사람들은 깨끗한 물과 하수도를 요구합니다."
 tsin_cholera.10.a: "다시는 돌아오지 못하게 하수도를 놓는다."
 tsin_cholera.10.b: "감사드리고 일상으로 돌아간다."

 TSIN_CHOLERA_PANEL_PROGRESS: "종식 진행도"
 TSIN_CHOLERA_PANEL_OUTBREAKS: "도시 발병 횟수"
 TSIN_CHOLERA_PANEL_HELP: "진행도는 매달 증가합니다. 수도에 상하수도를 건설하고 질병 저항력을 높이면 더 빨리 끝납니다. 공중보건 운동은 해금 후 내각 화면에서 배정할 수 있습니다. 자세한 종료 조건은 종료 요건 탭에서 확인하십시오."
