l_korean:

 # National unification
 tsin_national_unification: "민족 통일"
 tsin_national_unification_desc: "한 [culture_group|e]이 여러 독립국으로 나뉘어 있습니다. 그중 가장 큰 나라가 민족 운동을 등에 업고 통일을 이끌 수 있습니다. 작은 나라는 국민 투표로 합류하거나, 통일 전쟁으로 합쳐집니다.\n\n참고: [tsin_national_unification_concept|e]"
 tsin_national_unification_nations_made: "민족 국가의 탄생"
 tsin_national_unification_age_passes: "통일의 시대가 지나가다"
 tsin_national_unification_unifier_tt: "이 [country|e]가 민족 통일을 이끌고 있습니다."
 tsin_national_unification_unified_tt: "이 [country|e]는 민족 통일을 이루었습니다."
 tsin_national_unification_kin_tt: "이 [country|e]는 통일 운동의 대상입니다."
 tsin_national_unification_unified_legend: "통일을 이룬 나라"
 tsin_national_unification_unifier_legend: "통일을 이끄는 나라"
 tsin_national_unification_kin_legend: "같은 문화 집단의 독립국"
 hint_tsin_national_unification: "[GetSituationByKey('tsin_national_unification').GetNameWithNoTooltip]"
 hint_tsin_national_unification_hint_text: "[GetSituationByKey('tsin_national_unification').GetName]은 1848년 이후 민족 운동이 강한 나라에서 시작됩니다. 같은 문화 집단의 독립국이 둘 이상 남아 있고 그중 가장 큰 나라라면 통일을 이끌 수 있습니다.\n\n#T 권장 행동:#!\n@arrow_bonus_tier_3! 통일을 이끌면 해마다 작은 나라에 국민 투표를 제안하고, $cb_tsin_national_unification$ 전쟁 명분을 얻습니다.\n@arrow_bonus_tier_2! 같은 문화 집단의 독립국이 모두 사라지면 통일이 선포됩니다. 바닐라 형성 국가 조건을 채웠다면 그때 형성할 수 있습니다."
 hint_tsin_national_unification_diplomatic: "\"모든 민족은 하나의 나라를 이룰 권리가 있습니다.\""
 hint_tsin_national_unification_administrative: "\"이탈리아는 만들어졌다. 이제 이탈리아인을 만들어야 한다.\""
 hint_tsin_national_unification_military: "\"오늘의 큰 문제는 연설과 다수결이 아니라 피와 철로 결정된다.\""
 cb_tsin_national_unification: "민족 통일"
 cb_tsin_national_unification_desc: "같은 민족이 다른 나라의 지배 아래 나뉘어 있습니다!"
 STATIC_MODIFIER_NAME_tsin_unification_drive: "통일 운동"
 STATIC_MODIFIER_NAME_tsin_national_unity: "민족 통합"
 tsin_unification.1.title: "민족 문제"
 tsin_unification.1.desc: "같은 말을 쓰고 같은 노래를 부르는 사람들이 여러 나라로 갈라져 있습니다. 신문과 합창단, 체육회가 하나의 조국을 외치고, 그들은 우리 [country|e]가 앞장서기를 기다립니다."
 tsin_unification.1.a: "민족의 대의를 이끈다."
 tsin_unification.1.a.tt: "해마다 같은 문화 집단의 작은 독립국에 국민 투표를 제안하고, 그들에게 $cb_tsin_national_unification$ 전쟁 명분을 쓸 수 있습니다."
 tsin_unification.1.b: "지금은 때가 아니다."
 tsin_unification.10.title: "국민 투표 제안"
 tsin_unification.10.desc: "[tsin_plebiscite_target.GetName]의 민족주의자들이 우리 나라와의 합병을 묻는 국민 투표를 요구하고 있습니다. 우리가 공식으로 제안하면 그 정부도 외면하기 어려울 것입니다."
 tsin_unification.10.a: "국민 투표를 제안한다."
 tsin_unification.11.title: "합병 국민 투표"
 tsin_unification.11.desc: "[tsin_unifier.GetName] 정부가 하나의 민족 국가로 합치자며 국민 투표를 제안했습니다. 거리에는 통일을 외치는 깃발이 걸렸지만, 궁정과 관료들은 독립을 잃는 것을 두려워합니다."
 tsin_unification.11.a: "민족 국가에 합류한다."
 tsin_unification.11.b: "독립을 지킨다."
 tsin_unification.12.title: "국민 투표 가결"
 tsin_unification.12.desc: "압도적인 찬성으로 국민 투표가 가결되었습니다. 또 하나의 형제 나라가 조국에 합류합니다."
 tsin_unification.12.a: "민족이 하나가 되어 간다."
 tsin_unification.13.title: "국민 투표 거부"
 tsin_unification.13.desc: "상대 정부가 국민 투표를 거부했습니다. 이제 남은 길은 협상을 기다리거나, 칼로 통일을 이루는 것뿐입니다."
 tsin_unification.13.a: "언젠가는 하나가 될 것이다."
 tsin_unification.13.a.tt: "그 나라에는 10년 동안 다시 국민 투표를 제안할 수 없지만, $cb_tsin_national_unification$ 전쟁 명분은 그대로 쓸 수 있습니다."
 tsin_unification.20.title: "통일 선포"
 tsin_unification.20.desc: "같은 문화 집단의 독립국이 더는 남아 있지 않습니다. 수도의 궁전에서 하나의 민족 국가가 선포되고, 종소리가 온 나라에 울려 퍼집니다."
 tsin_unification.20.a: "하나의 민족, 하나의 나라!"
 tsin_unification.20.a.tt: "바닐라 형성 국가의 조건을 채웠다면 이제 형성할 수 있습니다."
 # Defensive modernization
 tsin_defensive_modernization: "방어적 근대화"
 tsin_defensive_modernization_desc: "외국 포함 앞에서 항구를 연 나라들이 살아남으려 서양식 제도와 기계를 들여옵니다. 근대화 칙령, 구세력의 반동, 그리고 성공이나 좌절의 단계를 거칩니다.\n\n참고: [tsin_defensive_modernization_concept|e]"
 tsin_defensive_modernization_settled: "근대화의 판가름"
 tsin_defensive_modernization_age_passes: "개항의 시대가 지나가다"
 tsin_defensive_modernization_modernized_tt: "이 [country|e]는 근대화에 성공했습니다."
 tsin_defensive_modernization_failed_tt: "이 [country|e]의 근대화는 좌절되었습니다."
 tsin_defensive_modernization_reforming_tt: "이 [country|e]는 근대화 개혁을 진행하고 있습니다."
 tsin_defensive_modernization_pressured_tt: "이 [country|e]는 개항 압력을 받고 있습니다."
 tsin_defensive_modernization_modernized_legend: "근대화 성공"
 tsin_defensive_modernization_reforming_legend: "개혁 진행 중"
 tsin_defensive_modernization_pressured_legend: "개항 압력"
 tsin_defensive_modernization_failed_legend: "근대화 좌절"
 hint_tsin_defensive_modernization: "[GetSituationByKey('tsin_defensive_modernization').GetNameWithNoTooltip]"
 hint_tsin_defensive_modernization_hint_text: "[GetSituationByKey('tsin_defensive_modernization').GetName]은 조약항 강화나 포함 이벤트로 항구를 연 나라에 열립니다.\n\n#T 권장 행동:#!\n@arrow_bonus_tier_3! 근대화 칙령을 내리면 몇 년 뒤 구세력의 반동이 옵니다. 반동을 누르거나 매수하면 개혁이 이어집니다.\n@arrow_bonus_tier_2! 공장을 하나 이상 갖고 [stability|e]가 0 이상이면 근대화가 완성됩니다. 칙령을 두 번 거부하거나 반동에 굴복하면 좌절합니다."
 hint_tsin_defensive_modernization_diplomatic: "\"지식을 온 세계에서 구하라.\""
 hint_tsin_defensive_modernization_administrative: "\"중국의 학문을 몸으로 삼고, 서양의 학문을 쓰임으로 삼는다.\""
 hint_tsin_defensive_modernization_military: "\"부국강병.\""
 STATIC_MODIFIER_NAME_tsin_modernization_new_army: "신식 군대"
 STATIC_MODIFIER_NAME_tsin_modernized_state: "근대 국가"
 STATIC_MODIFIER_NAME_tsin_failed_modernization: "좌절된 근대화"
 tsin_modernization.10.title: "구세력의 반동"
 tsin_modernization.10.desc: "칙령으로 녹봉과 특권을 잃은 옛 무사와 관리들이 들고일어났습니다. 그들은 외국 오랑캐를 몰아내고 옛 법도를 되살리라고 외칩니다."
 tsin_modernization.10.a: "신식 군대로 진압한다."
 tsin_modernization.10.b: "관직과 연금으로 달랜다."
 tsin_modernization.10.c: "반동에 굴복한다."
 tsin_modernization.20.title: "개혁의 결실"
 tsin_modernization.20.desc: "공장 굴뚝에서 연기가 오르고, 신식 학교와 군대가 자리를 잡았습니다. 한때 포함 앞에 무릎 꿇었던 나라가 이제 열강과 어깨를 나란히 하려 합니다."
 tsin_modernization.20.a: "문명개화!"
 tsin_modernization.30.title: "좌절된 개혁"
 tsin_modernization.30.desc: "개혁파 대신들이 물러나고 칙령은 휴지가 되었습니다. 조정은 옛 질서로 돌아갔지만, 외국 상인과 포함은 떠나지 않았습니다."
 tsin_modernization.30.a: "옛 법도를 지킨다."
 tsin_modernization.30.a.tt: "20년 동안 근대화 칙령이 다시 오지 않습니다."
 # Secession crisis
 tsin_secession_crisis: "연방 분열 위기"
 tsin_secession_crisis_desc: "노예제를 둘러싸고 공화국이 둘로 갈라졌습니다. 자유 지역의 폐지 운동과 노예 지역의 농장주들이 더는 타협하지 않으려 합니다. 위기는 적어도 3년 이어지며, 타협이 없으면 노예 지역이 분리를 선언합니다.\n\n참고: [tsin_secession_crisis_concept|e]"
 tsin_secessionist_rebels: "분리주의자"
 STATIC_MODIFIER_NAME_tsin_rotten_compromise: "썩은 타협"
 STATIC_MODIFIER_NAME_tsin_reconstruction: "재건"
 tsin_secession.1.title: "분열된 집"
 tsin_secession.1.desc: "\"스스로 분열된 집은 설 수 없습니다.\" 의회의 논쟁은 주먹다짐으로 번지고, 신문은 서로를 반역자라 부릅니다. 노예 지역의 농장주들은 공화국을 떠나겠다고 위협합니다."
 tsin_secession.1.a: "공화국은 하나다."
 tsin_secession.1.a.tt: "3년 안에 타협하지 못하면 노예 지역이 분리를 선언합니다."
 tsin_secession.2.title: "피 흘리는 변경"
 tsin_secession.2.desc: "새 영토를 노예 주로 할지 자유 주로 할지를 두고 무장한 정착민들이 서로를 습격하고 있습니다."
 tsin_secession.2.a: "연방군을 보내 질서를 지킨다."
 tsin_secession.2.b: "정착민들이 정하게 둔다."
 tsin_secession.3.title: "대타협 제안"
 tsin_secession.3.desc: "원로 의원들이 새 영토를 나누고 도망 노예 송환을 강화하는 타협안을 내놓았습니다. 받아들이면 분열은 미뤄지지만, 노예제는 그대로 남습니다."
 tsin_secession.3.a: "타협을 받아들인다."
 tsin_secession.3.b: "노예제와는 더 타협하지 않는다."
 tsin_secession.10.title: "분리 선언"
 tsin_secession.10.desc: "노예 지역의 의회들이 잇달아 공화국 탈퇴를 선언하고, 항구의 요새에 새 깃발을 올렸습니다. 연방을 지킬 것인지 지금 결정해야 합니다."
 tsin_secession.10.a: "연방을 무력으로 지킨다."
 tsin_secession.10.a.tt: "노예 지역의 [population|e]이 분리주의 반란에 가담합니다. 반란군이 사라지면 연방이 재건됩니다."
 tsin_secession.10.b: "마지막 타협을 한다."
 tsin_secession.20.title: "연방의 회복"
 tsin_secession.20.desc: "분리주의자들의 마지막 군대가 항복했습니다. 전쟁터는 묘지가 되었고, 이제 이 나라를 어떻게 다시 하나로 묶을지 정해야 합니다."
 tsin_secession.20.a: "해방과 재건."
 tsin_secession.20.b: "상처를 덮기 위해 옛 질서를 되돌린다."
 # Millenarian rebellion
 tsin_millenarian_rebellion: "천년왕국 대반란"
 tsin_millenarian_rebellion_desc: "기근과 외세, 이교의 설교가 정체된 농업 제국을 뒤흔듭니다. 스스로 하늘의 아들이라 칭하는 예언자가 수십만 농민을 이끌고 지상 천국을 세우겠다고 나섰습니다. [rebels|e]을 모두 진압해야 끝나며, 적어도 3년 이어집니다.\n\n참고: [tsin_millenarian_rebellion_concept|e]"
 tsin_millenarian_rebels: "천년왕국 반란군"
 STATIC_MODIFIER_NAME_tsin_suppression_campaign: "토벌전"
 STATIC_MODIFIER_NAME_tsin_gentry_armies: "향신 의용군"
 STATIC_MODIFIER_NAME_tsin_ever_victorious_army: "상승군"
 STATIC_MODIFIER_NAME_tsin_rebellion_devastation: "대반란의 상처"
 tsin_millenarian.1.title: "지상 천국"
 tsin_millenarian.1.desc: "과거에 낙방한 한 서생이 환상 속에서 하늘의 명을 받았다고 주장합니다. 그의 신도들은 우상을 부수고 토지를 나누며, 굶주린 농민들이 수만 명씩 그 깃발 아래 모여들고 있습니다."
 tsin_millenarian.1.tt: "여러 주의 [population|e]이 천년왕국 반란군에 가담합니다."
 tsin_millenarian.1.a: "제국군으로 이단을 토벌한다."
 tsin_millenarian.1.b: "지방 향신이 의용군을 일으키게 한다."
 tsin_millenarian.2.title: "천경"
 tsin_millenarian.2.desc: "반란군이 큰 도시를 차지하고 자기들의 궁정과 관직을 세웠습니다. 남쪽의 세금이 끊겨 국고가 바닥나고 있습니다."
 tsin_millenarian.2.a: "전쟁세를 새로 거둔다."
 tsin_millenarian.2.b: "무기를 내려놓는 자는 용서한다."
 tsin_millenarian.3.title: "외국인 장교의 군대"
 tsin_millenarian.3.desc: "항구의 외국 상인들이 서양식 소총과 장교를 갖춘 용병대를 보내겠다고 제안합니다. 값은 비싸고, 조정의 체면도 걸려 있습니다."
 tsin_millenarian.3.a: "고용한다."
 tsin_millenarian.3.b: "우리 군대에 외국인은 필요 없다."
 tsin_millenarian.4.title: "전선 뒤의 기근"
 tsin_millenarian.4.desc: "양쪽 군대가 곡식을 빼앗아 가면서 전쟁터가 된 지방에 기근이 들었습니다."
 tsin_millenarian.4.a: "곡창을 연다."
 tsin_millenarian.4.b: "군대가 먼저 먹는다."
 tsin_millenarian.10.title: "대반란 이후"
 tsin_millenarian.10.desc: "반란은 끝났지만 수많은 마을이 사라졌고, 논밭은 잡초로 덮였습니다. 제국은 살아남았으나 예전과 같지 않습니다."
 tsin_millenarian.10.a: "폐허에서 다시 시작한다."
 # Millenarian rebellion
