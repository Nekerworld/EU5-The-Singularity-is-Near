l_korean:
 tsin_oil_storage: "석유 저장고"
 tsin_oil_storage_maintenance: "석유 저장고 유지"
 tsin_oil_storage_desc: "고용 0. 단계당 저장 용량 100, 월 최대 10을 실제 시장에서 입출고합니다. 관리 창에서 재화와 자동운전을 설정해야 합니다. 저장 재화는 일반 생산 방식으로 복제하지 않습니다."
 tsin_strategic_storage: "전략자원 비축고"
 tsin_strategic_storage_maintenance: "전략자원 비축고 유지"
 tsin_strategic_storage_desc: "고용 0. 단계당 저장 용량 100, 월 최대 10을 실제 시장에서 입출고합니다. 관리 창에서 재화와 자동운전을 설정해야 합니다. 저장 재화는 일반 생산 방식으로 복제하지 않습니다."
 tsin_storage_oil: "석유 비축 자동운전 설정"
 tsin_storage_coal: "석탄 비축 자동운전 설정"
 tsin_storage_steel: "강철 비축 자동운전 설정"
 tsin_storage_pause: "정지 비축 자동운전"
 tsin_storage_resume: "비축 자동운전 재개"
 tsin_storage_release: "비상 방출 예약"
 tsin_storage_inspect: "선택 저장고 조사"
 tsin_storage_oil_desc: "정부 관리 저장고의 운전을 설정합니다. 기준가 85% 이하 매입, 115% 이상 방출, 중간에는 대기합니다. 월 10·국고의 5% 이내 매입, 최소 비축 25%를 유지합니다. 비상 방출은 하한을 무시해 다음 월에 1회 처리합니다. 검사 실패 후에는 자동운전을 재개할 수 없습니다."
