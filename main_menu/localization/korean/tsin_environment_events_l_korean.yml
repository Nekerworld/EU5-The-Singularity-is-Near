l_korean:
 tsin_envx.1.title: "검게 변한 하천"
 tsin_envx.1.desc: "정화 청원 이후에도 하천 오염이 이어져 강변 주민들이 다시 항의하고 있습니다. 임시 정화 서비스는 물의 위험을 낮추지만 처리시설을 대신하지는 못합니다."
 tsin_envx.1.a: "정화 사업에 300두캇을 쓴다"
 tsin_envx.1.b: "이번에는 조치하지 않는다"
 tsin_envx.2.title: "광산 분진"
 tsin_envx.2.desc: "광산 주변 주민들이 분진과 갱내 배출을 호소합니다. 분진 억제 설비는 노출을 줄이지만 광산 산출은 줄이지 않습니다."
 tsin_envx.2.a: "분진 억제 설비에 200두캇을 쓴다"
 tsin_envx.2.b: "지금은 두고 본다"
 tsin_envx.3.title: "지하철 환기 문제"
 tsin_envx.3.desc: "증기 지하철의 연기가 승강장과 인근 거리에 고입니다. 환기 설비로 노출을 줄일 수 있습니다."
 tsin_envx.3.a: "환기 설비에 250두캇을 쓴다"
 tsin_envx.3.b: "운행을 그대로 유지한다"
 tsin_envx.4.title: "공업 도시의 연무"
 tsin_envx.4.desc: "고농도 매연이 여러 해 이어져 도시가 뒤덮였습니다. 게임에는 기상 자료가 없어 고노출이 지속된 기간을 연무의 지표로 씁니다. 대기 경보는 배출을 잠시 줄입니다."
 tsin_envx.4.a: "대기 경보와 연무 통제에 150두캇을 쓴다"
 tsin_envx.4.b: "경보를 발령하지 않는다"
 tsin_envx.5.title: "산업 위생 조사단"
 tsin_envx.5.desc: "의사와 공무원으로 구성된 조사단이 공장 지구의 식수와 배수로를 점검하려 합니다. 임시 점검은 수질 위험을 3년간 낮추지만 하수도 투자를 대신하지 않습니다."
 tsin_envx.5.a: "조사단 파견에 120두캇을 쓴다"
 tsin_envx.5.b: "조사단을 보내지 않는다"
 tsin_envx.6.title: "여과 설비의 운영비"
 tsin_envx.6.desc: "지원으로 설치된 여과 설비에 운영비가 다시 필요해졌습니다. 운영비를 내면 설비가 5년 더 유지되고, 중단하면 설비가 철거되어 배출이 원래대로 돌아갑니다."
 tsin_envx.6.a: "운영비 80두캇을 내고 5년 더 유지한다"
 tsin_envx.6.b: "설비를 철거한다"
 tsin_envx.7.title: "공장 이전 논쟁"
 tsin_envx.7.desc: "공해가 심한 공장을 도시 밖으로 옮기자는 논쟁이 벌어졌습니다. 이 게임은 건물을 옮기지 않으므로, 옮기는 대신 설비 전환을 지원합니다."
 tsin_envx.7.a: "설비 전환에 400두캇을 지원한다"
 tsin_envx.7.b: "논쟁을 그대로 둔다"
 tsin_envx.8.title: "맑아진 하늘"
 tsin_envx.8.desc: "오랜 매연 끝에 도시의 하늘이 맑아졌습니다. 시민들은 정화 사업을 기념합니다."
 tsin_envx.8.a: "기념식을 연다 (위신 +5)"
 tsin_envx.8.b: "과거를 잊지 않는다"
