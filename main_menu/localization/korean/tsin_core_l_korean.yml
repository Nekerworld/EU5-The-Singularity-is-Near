 MODIFIER_TYPE_DESC_p_expensive_building_age_7_industrialization_cost_modifier: "[ShowAgeName('age_7_industrialization')] 시대에 활성화된 [buildings|e]을 건설하는 데 드는 [costs|e]에 영향을 줍니다."

