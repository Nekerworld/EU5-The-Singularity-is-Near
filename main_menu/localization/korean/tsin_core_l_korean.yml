 # 개발용 결단 (디버그 모드 전용)
 tsin_debug_rerun_init_decision.title: "(TSIN 디버그) 초기화 재실행"
 tsin_debug_rerun_init_decision.desc: "모드의 전역 설정 변수를 지우고 이전용 이벤트를 다시 실행합니다."
 tsin_debug_rerun_init_decision.a: "재실행"
 tsin_debug_reset_notices_decision.title: "(TSIN 디버그) 제도 알림 초기화"
 tsin_debug_reset_notices_decision.desc: "이 국가의 제도 알림 표시를 지워 알림이 다시 뜨게 합니다."
 tsin_debug_reset_notices_decision.a: "초기화"
 tsin_debug_institution_progress_decision.title: "(TSIN 디버그) 수도 제도 진척"
 tsin_debug_institution_progress_decision.desc: "수도에서 제7시대 제도마다 진척도를 25 올립니다. 이미 등장한 제도에만 효과가 있습니다."
 tsin_debug_institution_progress_decision.a: "진척 추가"

 # 지도 모드
 mapmode_tsin_industrial_institutions_name: "산업 시대 제도"
 MAPMODE_TSIN_INDUSTRIAL_INSTITUTIONS: "#T $mapmode_tsin_industrial_institutions_name$#!\n각 [location|e]에 자리 잡은 [ShowAgeName('age_7_industrialization')]의 가장 발전한 [institution|e]에 따라 [locations|e]을 색상으로 표시합니다."
 LEGEND_KEY_TSIN_ELECTRIFICATION: "$tsin_electrification$"
 LEGEND_KEY_TSIN_MASS_SOCIETY: "$tsin_mass_society$"
 LEGEND_KEY_TSIN_INDUSTRIAL_CAPITALISM: "$tsin_industrial_capitalism$"
 LEGEND_KEY_TSIN_NO_INSTITUTION: "없음"

 # 시스템 이벤트
 tsin_system.2.title: "산업 시대"
 tsin_system.2.desc: "세계가 [ShowAgeName('age_7_industrialization')]에 들어섰습니다. 앞으로 수십 년에 걸쳐 $tsin_industrial_capitalism$, $tsin_mass_society$, $tsin_electrification$라는 세 가지 새로운 [institutions|e]가 나타날 것입니다([tsin_industrial_institutions_concept|e] 참고). 각 제도를 수용하면 새로운 [advances|e]가 열립니다.\n\n이 시대에는 정해진 끝이 없으며, 게임은 2337년까지 계속됩니다. 이 시대가 더하는 모든 것은 백과사전의 [tsin_singularity_concept|e] 항목에서 설명합니다."
 tsin_system.2.a: "전속력으로 전진하라."
 tsin_system.10.title: "$tsin_industrial_capitalism$의 등장"
 tsin_system.10.desc: "한 사람의 장인이 아닌 주주들의 자금으로 세운 공장, 그리고 더 큰 공장에 다시 투입되는 이윤에 관한 소식이 들려옵니다. 새로운 [institution|e]인 $tsin_industrial_capitalism$가 세계에 나타났습니다."
 tsin_system.10.a: "자본이 가는 곳에 우리도 가야 한다."
 tsin_system.11.title: "$tsin_mass_society$의 등장"
 tsin_system.11.desc: "값싼 신문과 붐비는 도시, 아이들로 가득한 교실이 사람들이 통치자를 바라보는 방식을 바꾸고 있습니다. 새로운 [institution|e]인 $tsin_mass_society$가 세계에 나타났습니다."
 tsin_system.11.a: "대중이 목소리를 찾았다."
 tsin_system.12.title: "$tsin_electrification$의 등장"
 tsin_system.12.desc: "외국의 기술자들이 구리선을 따라 흐르는 전류로 거리를 밝히고 기계를 돌리기 시작했습니다. 새로운 [institution|e]인 $tsin_electrification$가 세계에 나타났습니다."
 tsin_system.12.a: "빛이 있으라."
