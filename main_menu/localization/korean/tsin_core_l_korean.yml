 n_age_7_industrialization_heavy_ship_desc: "$unit_template_desc$"

 # 징집군 유닛
 a_tsin_reservists: "예비군"
 a_tsin_reservists_desc: "복무를 마치고 민간인으로 돌아갔지만 철도와 전신으로 며칠 안에 다시 소집될 수 있는 옛 징집병입니다. $a_tsin_reservists$은 훈련을 받았고 국영 병기창에서 장비를 지급받으므로, 갓 소집된 [levies|e]보다 훨씬 믿음직합니다."
 a_tsin_mounted_constabulary: "기마 경찰대"
 a_tsin_mounted_constabulary_desc: "말을 탄 신사 의용병과 농촌 경찰입니다. $a_tsin_mounted_constabulary$는 평시에는 시골의 질서를 지키고, 전시에는 예비군에 앞서 정찰을 맡습니다."

