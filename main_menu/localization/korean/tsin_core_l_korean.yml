l_korean:
 # 시대
 age_7_industrialization: "산업"
 age_7_industrialization_desc: "석탄과 철, 증기가 사람과 물레방아의 힘이 지녔던 오래된 한계를 깨뜨렸습니다. 공장은 농촌의 가난한 이들을 굉음이 울리는 도시로 끌어모으고, 철도는 멀리 떨어진 시장들을 하나로 묶으며, 국가의 부는 이제 강철의 톤수로 측정됩니다. 새로운 기계를 다스리는 자는 이 세기를 지배할 것이며, 그러지 못한 자는 그 기계를 섬기게 될 것입니다."
 age_format_age_7_industrialization: "$age_7_industrialization$ 시대"
 current_age_at_least_7_tt: "현재 [age|e]가 [ShowAgeName('age_7_industrialization')] 또는 그 이후임"

 # 제도
 tsin_industrial_capitalism: "산업자본주의"
 tsin_industrial_capitalism_desc: "주식회사와 공장주, 은행은 이제 어떤 길드나 상가도 상상하지 못한 규모로 자본을 모읍니다. 이윤은 토지가 아닌 기계에 재투자되고, 산업의 소유주들은 부와 영향력에서 옛 귀족과 겨루기 시작합니다."
 tsin_mass_society: "대중사회"
 tsin_mass_society_desc: "값싼 신문과 공립학교, 붐비는 도시의 거리가 새로운 것을 만들어 냈습니다. 바로 글을 읽고, 논쟁하고, 조직하는 대중입니다. 수도에서 일어난 일을 다음 날 아침이면 알게 되는 수백만 명의 의견을 통치자들은 더 이상 무시할 수 없습니다."
 tsin_electrification: "전기화"
 tsin_electrification_desc: "발전기와 구리선이 발전소에서 공장 바닥과 도시의 거리로 동력을 실어 나릅니다. 빛은 더 이상 해나 촛불에 의존하지 않으며, 기계는 더 이상 자신을 움직이는 보일러 옆에 서 있을 필요가 없습니다."

 # 발전
 tsin_steam_age_advance: "증기의 시대"
 tsin_steam_age_advance_desc: "증기 기관이 광산과 방앗간을 벗어나 경제 생활의 구석구석으로 퍼졌습니다. 더 깨끗한 물과 더 나은 식량 공급, 최초의 공중 보건 조치 덕분에 도시는 제 주민을 소모하지 않고도 성장할 수 있게 되었습니다."
 tsin_industrial_capitalism_advance: "산업자본주의"
 tsin_industrial_capitalism_advance_desc: "주식회사와 공장제를 받아들임으로써 자본은 가장 높은 수익을 내는 곳으로 흘러가고, 우리의 공장도 그에 따라 늘어납니다."
 tsin_mass_society_advance: "대중사회"
 tsin_mass_society_advance_desc: "공교육과 값싼 신문, 성장하는 도시가 평범한 사람들을 좋든 나쁘든 국가의 삶 속으로 끌어들입니다."
 tsin_electrification_advance: "전기화"
 tsin_electrification_advance_desc: "전력 덕분에 작업장은 더 오래, 더 정밀하게 돌아가며, 낡은 기계를 교체하면서 산업의 유지비도 줄어듭니다."

 # 공통 해금
 tsin_reserve_system_advance: "예비군 제도"
 tsin_reserve_system_advance_desc: "짧은 현역 복무 뒤 여러 해 동안 예비군에 편입하면, 평시에 비용을 들이는 군대보다 몇 배 큰 훈련된 병력을 얻을 수 있습니다."
 tsin_fort_limit_7_advance: "다각형 요새"
 tsin_fort_limit_7_advance_desc: "깊은 해자를 두른 낮고 분산된 보루가 옛 별 모양 요새를 대신하여, 더 적은 시설로 더 넓은 땅을 지킬 수 있게 합니다."
 tsin_supply_limit_7_advance: "통조림 식량"
 tsin_supply_limit_7_advance_desc: "깡통에 밀봉한 식량은 몇 달씩 보존되므로, 주변 시골만으로는 먹일 수 없는 곳에도 군대를 모을 수 있습니다."

 # 선택 발전 - 행정
 tsin_civil_service_exams: "공무원 시험"
 tsin_civil_service_exams_desc: "연줄이 아닌 시험으로 관리를 뽑으면 실제로 셈을 할 줄 아는 서기를 얻게 됩니다."
 tsin_statistical_bureau: "통계국"
 tsin_statistical_bureau_desc: "정기 인구 조사와 공표된 통계표가 국가가 무엇을 소유하고 누가 사는지 알려 줍니다."
 tsin_income_tax: "소득세"
 tsin_income_tax_desc: "토지 대신 소득에 세금을 매기면 공장과 사무소에서 나오는 새로운 부에 닿을 수 있습니다."
 tsin_central_banking: "중앙은행"
 tsin_central_banking_desc: "국가에 돈을 빌려주고 금융 시장을 안정시키는 발권 은행이 우리 부채의 비용을 낮춥니다."
 tsin_public_works: "공공사업국"
 tsin_public_works_desc: "국가가 고용한 기술자들이 전국의 건설을 계획하고 감독합니다."
 tsin_scientific_agriculture: "과학적 농업"
 tsin_scientific_agriculture_desc: "윤작과 배수, 비료 덕분에 더 적은 땅으로 더 많은 사람을 먹일 수 있습니다."
 tsin_mining_engineering: "광산 공학"
 tsin_mining_engineering_desc: "광산 학교와 증기 펌프 덕분에 더 깊고 저렴한 갱도를 팔 수 있습니다."
 tsin_national_education: "국민 교육"
 tsin_national_education_desc: "모든 교구에 세운 학교가 읽기와 셈, 그리고 국가에 대한 충성을 가르칩니다."
 tsin_modern_police: "근대 경찰"
 tsin_modern_police_desc: "제복을 입은 경관이 야경꾼과 수비대를 대신해 치안을 유지합니다."
 tsin_parliamentary_procedure: "의사 규칙"
 tsin_parliamentary_procedure_desc: "의사 규칙과 위원회, 기록 표결 덕분에 의회는 끝없는 다툼 없이 법을 통과시킬 수 있습니다."

 # 선택 발전 - 외교
 tsin_telegraph_diplomacy: "전신 외교"
 tsin_telegraph_diplomacy_desc: "대사관에 닿기까지 몇 주가 걸리던 훈령이 이제 몇 시간 만에 도착합니다."
 tsin_consular_service: "영사 제도"
 tsin_consular_service_desc: "주요 항구마다 머무는 영사가 우리 상인을 돌보고 외국 시장 소식을 보고합니다."
 tsin_free_trade_doctrine: "자유무역론"
 tsin_free_trade_doctrine_desc: "낮은 관세와 호혜 조약이 우리 상인의 활동 무대를 넓힙니다."
 tsin_steamship_lines: "증기선 항로"
 tsin_steamship_lines_desc: "정기 증기선은 바람과 관계없이 운항하며 우리 상품을 먼 시장까지 실어 나릅니다."
 tsin_trading_houses: "무역 상사"
 tsin_trading_houses_desc: "해외 지점을 둔 대형 상사가 교역을 우리 손에 모읍니다."
 tsin_protectorates: "보호령"
 tsin_protectorates_desc: "외국 궁정에 머무는 주재관과 고문이 공공연한 지배 없이도 종속국을 단속합니다."
 tsin_colonial_office: "식민성"
 tsin_colonial_office_desc: "전담 부처가 이민자를 위한 정착과 해운, 토지 불하를 조직합니다."
 tsin_great_power_diplomacy: "열강 외교"
 tsin_great_power_diplomacy_desc: "한때 전쟁으로만 풀리던 문제를 열강 회의가 해결하며, 그 자리에서 우리의 말은 무게를 가집니다."
 tsin_coaling_stations: "급탄항"
 tsin_coaling_stations_desc: "급탄항을 잇따라 확보하면 증기 함대가 본국에서 멀리 떨어진 바다에 머물 수 있습니다."
 tsin_ironclad_yards: "철갑함 조선소"
 tsin_ironclad_yards_desc: "철제 골격과 증기 해머, 건선거 덕분에 군함 건조가 빨라집니다."

 # 선택 발전 - 군사
 tsin_general_staff: "참모본부"
 tsin_general_staff_desc: "상설 참모 조직이 전쟁이 시작되기 훨씬 전부터 작전과 철도 시간표, 지도를 준비합니다."
 tsin_breech_loading_rifles: "후장식 소총"
 tsin_breech_loading_rifles_desc: "엎드린 채로 장전할 수 있는 병사는 더 빨리 쏘고 더 오래 살아남습니다."
 tsin_rifled_artillery: "강선포"
 tsin_rifled_artillery_desc: "나선형 강선이 활강포로는 얻을 수 없던 사거리와 정확도를 포탄에 부여합니다."
 tsin_military_railways: "군용 철도"
 tsin_military_railways_desc: "신병이 걸어서가 아니라 기차로 보충대에 도착합니다."
 tsin_field_medicine: "야전 의료"
 tsin_field_medicine_desc: "구급차와 야전 병원, 깨끗한 물이 원정 중 질병으로 인한 손실을 줄입니다."
 tsin_mass_mobilization: "총동원"
 tsin_mass_mobilization_desc: "징병 연령의 모든 건장한 남성을 등록해 두면 훨씬 많은 인구를 소집할 수 있습니다."
 tsin_officer_schools: "사관 학교"
 tsin_officer_schools_desc: "참모 대학이 출신이 아닌 교육으로 지휘관을 수백 명씩 길러 냅니다."
 tsin_canned_rations: "야전 배식"
 tsin_canned_rations_desc: "규칙적인 따뜻한 식사와 보존 식품이 휴식 중인 병사들의 사기를 회복시킵니다."
 tsin_steam_navy_doctrine: "증기 해군 교리"
 tsin_steam_navy_doctrine_desc: "증기선과 작렬탄에 맞춰 훈련받은 수병은 자신의 배와 전술을 신뢰합니다."
 tsin_coastal_batteries: "해안 포대"
 tsin_coastal_batteries_desc: "포곽 속 중포가 우리 항구와 그곳을 지키는 수비대를 보호합니다."

 # 건설 가격
 p_building_age_7_industrialization: "[ShowAgeNameWithNoTooltip('age_7_industrialization')] 건물"
 p_expensive_building_age_7_industrialization: "값비싼 [ShowAgeNameWithNoTooltip('age_7_industrialization')] 건물"
