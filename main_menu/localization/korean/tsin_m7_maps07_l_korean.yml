 TSIN_AUTOMATION_MAPMODE_TT: "공장 단계 [ROOT.ScriptValue('tsin_location_mill_levels')|0], 자동화 단계 [ROOT.ScriptValue('tsin_location_automated_mill_levels')|0] ([ROOT.ScriptValue('tsin_location_automation_share')|%0])"
