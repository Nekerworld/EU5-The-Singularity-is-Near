l_korean:
 TSIN_NEWS_LINE_0_10: "#T [ROOT.ScriptValue('tsin_news_0_year')|0].[ROOT.ScriptValue('tsin_news_0_month')|0] — 국제 규격 논의에 참여#!\n국가가 도량형·철도·산업 부품·전기 설비 가운데 한 분야의 규격을 선택했습니다. 다른 분야의 독자 규격은 그대로 유지할 수 있습니다."
 TSIN_NEWS_LINE_0_20: "#T [ROOT.ScriptValue('tsin_news_0_year')|0].[ROOT.ScriptValue('tsin_news_0_month')|0] — 굴뚝 아래에서 온 청원#!\n산업 도시 주민들이 여러 해 지속된 매연에 대해 관청에 청원했습니다. 여과 설비 지원 여부를 둘러싼 논의가 이어지고 있습니다."
 TSIN_NEWS_LINE_0_21: "#T [ROOT.ScriptValue('tsin_news_0_year')|0].[ROOT.ScriptValue('tsin_news_0_month')|0] — 콜레라 발생 보고#!\n도시에서 콜레라 발생이 보고되었습니다. 방역 당국은 위생 개선과 감염 대응에 나서고 있습니다."
 TSIN_NEWS_LINE_0_30: "#T [ROOT.ScriptValue('tsin_news_0_year')|0].[ROOT.ScriptValue('tsin_news_0_month')|0] — 지방 설비 정비 지원 집행#!\n정부가 산업 지방의 시설 정비에 자금을 집행했습니다. 설비 상태를 유지하는 지원과 새로운 기술을 도입하는 현대화 투자는 구분됩니다."
 TSIN_NEWS_LINE_0_40: "#T [ROOT.ScriptValue('tsin_news_0_year')|0].[ROOT.ScriptValue('tsin_news_0_month')|0] — 기업 이자 연체 장기화#!\n기업 신용 또는 회사채의 이자 지급 지연이 반년 이상 이어졌습니다. 금융권은 유동성 부족과 채무 상환 능력을 주시하고 있습니다."
