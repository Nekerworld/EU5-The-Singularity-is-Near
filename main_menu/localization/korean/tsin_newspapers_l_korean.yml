 tsin_read_newspaper: "신문·최근 기사 열람"
 tsin_read_newspaper_desc: "인쇄술 이후 최근 기사 최대 6건을 읽습니다. 실제로 발생한 사건의 기록이며 열람으로 원래의 비용·효과·확률 판정을 다시 실행하지 않습니다. 주요호 팝업은 연 1회 이내입니다."
