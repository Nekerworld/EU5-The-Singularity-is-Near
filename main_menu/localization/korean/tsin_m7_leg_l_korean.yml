l_korean:

 # probabilistic legislation (docs/legislation.md)
 rule_tsin_bill_system: "확률 입법"
 setting_tsin_bill_system_on: "켬"
 setting_tsin_bill_system_on_desc: "대중사회를 수용하고 의회가 있는 나라는 산업 시대 법과 언론·대중 교육·이민·노예제 법의 정책을 [tsin_bills_concept|e]으로만 바꿀 수 있습니다. 법안은 3개월마다 심의되며, 세 번 통과하면 시행되고 세 번 막히면 폐기됩니다."
 setting_tsin_bill_system_off: "끔"
 setting_tsin_bill_system_off_desc: "정책을 바닐라처럼 바로 바꿉니다."
 tsin_policy_needs_bill_tt: "이 정책은 [parliament|e]에서 법안([tsin_bills_concept|e])으로 통과되어야 합니다(결단 \"$tsin_propose_bill_decision$\")."
 tsin_propose_bill_decision: "법안 발의"
 tsin_propose_bill_decision.title: "법안 발의"
 tsin_propose_bill_decision.desc: "정부가 [parliament|e]에 법안([tsin_bills_concept|e])을 냅니다. 법안은 3개월마다 심의되고, 성공 확률은 [estates|e]의 지지, 대중의 [tsin_movements_concept|e], 정부 형태, [legislative_efficiency|e], 논쟁 결과([tsin_bill_readings_concept|e])에 따라 달라집니다."
 tsin_propose_bill_decision.a: "법안을 고른다"
 tsin_withdraw_bill_decision: "법안 철회"
 tsin_withdraw_bill_decision.title: "법안 철회"
 tsin_withdraw_bill_decision.desc: "[parliament|e]에 걸린 법안([tsin_bills_concept|e])을 거둬들입니다. 2년 동안 새 법안을 낼 수 없습니다. 현재 한 번 심의의 성공 확률([tsin_bill_readings_concept|e])은 [ROOT.ScriptValue('tsin_bill_success_percent')|0]%입니다."
 tsin_withdraw_bill_decision.a: "법안을 거둬들인다"
 tsin_withdraw_bill_decision.tt: "법안을 폐기하고 2년 동안 새 법안을 내지 않습니다."
 tsin_bill_factor_base: "기본"
 tsin_bill_factor_support_nobles_estate: "귀족 지지"
 tsin_bill_factor_support_clergy_estate: "성직자 지지"
 tsin_bill_factor_support_burghers_estate: "시민 지지"
 tsin_bill_factor_support_peasants_estate: "평민 지지"
 tsin_bill_factor_support_crown_estate: "왕실 지지"
 tsin_bill_factor_oppose_nobles_estate: "귀족 반대"
 tsin_bill_factor_oppose_clergy_estate: "성직자 반대"
 tsin_bill_factor_oppose_burghers_estate: "시민 반대"
 tsin_bill_factor_oppose_peasants_estate: "평민 반대"
 tsin_bill_factor_oppose_crown_estate: "왕실 반대"
 tsin_bill_factor_labor: "노동 불만과 노동조합 운동"
 tsin_bill_factor_abolition: "노예제 폐지 운동"
 tsin_bill_factor_liberalism: "자유주의 운동"
 tsin_bill_factor_republic: "공화정"
 tsin_bill_factor_legislative_efficiency: "입법 효율"
 tsin_bill_factor_debate: "논쟁 결과"
 tsin_legislation.2.title: "법안 통과"
 tsin_legislation.2.desc: "세 번째 심의 끝에 의회가 '[tsin_bill.GetName]' 법안을 통과시켰다. 정책은 오늘부터 시행에 들어간다."
 tsin_legislation.2.a: "공포한다"
 tsin_legislation.3.title: "법안 폐기"
 tsin_legislation.3.desc: "'[tsin_bill.GetName]' 법안이 세 번째로 막혔다. 정부는 법안을 거둬들였고, 2년 동안은 새 법안을 내기 어렵다."
 tsin_legislation.3.a: "다음 회기를 기약한다"
 tsin_legislation.10.title: "위원회의 수정안"
 tsin_legislation.10.desc: "'[tsin_bill.GetName]' 법안을 맡은 위원회가 수정안을 받아들이면 지지하겠다고 한다. 법안의 날은 무뎌지지만 표는 늘어난다."
 tsin_legislation.10.a: "수정안을 받아들인다"
 tsin_legislation.10.b: "쉼표 하나도 바꿀 수 없다"
 tsin_legislation.20.title: "당론 강행"
 tsin_legislation.20.desc: "'[tsin_bill.GetName]' 법안의 표결이 박빙이다. 원내 총무는 정부 편에 서지 않는 의원은 다음 선거에서 공천을 받지 못하게 하자고 한다."
 tsin_legislation.20.a: "모든 의원은 정부 편에 선다"
 tsin_legislation.20.b: "양심에 따라 표결하게 둔다"
 tsin_legislation.30.title: "여론전"
 tsin_legislation.30.desc: "'[tsin_bill.GetName]' 법안을 두고 의회 밖에서도 논쟁이 붙었다. 우호적인 신문과 집회로 여론을 움직이면 망설이는 의원들이 따라올 것이다."
 tsin_legislation.30.a: "소책자, 집회, 우호적인 신문"
 tsin_legislation.30.b: "의회는 거리의 자리가 아니다"
 tsin_legislation.40.title: "철회 요구"
 tsin_legislation.40.desc: "야당이 '[tsin_bill.GetName]' 법안의 철회를 요구하며 의사 진행을 막고 있다. 법안을 거둬들이면 정국은 진정되겠지만 2년 동안은 새 법안을 내기 어렵다."
 tsin_legislation.40.a: "법안을 거둬들인다"
 tsin_legislation.40.b: "법안은 의사일정에 남는다"
 tsin_legislation.100.title: "법안 발의"
 tsin_legislation.100.desc: "내각이 다음 회기에 낼 법안을 의논한다. 어느 분야의 법을 바꿀 것인가?"
 tsin_legislation.100.c110: "노동과 복지"
 tsin_legislation.100.c120: "조세·화폐·결사"
 tsin_legislation.100.c130: "토지와 교회"
 tsin_legislation.100.c140: "산업·기업·환경"
 tsin_legislation.100.c150: "노예제"
 tsin_legislation.100.c160: "언론과 이민"
 tsin_legislation.100.c170: "대중 교육"
 tsin_legislation.100.z: "이번 회기에는 내지 않는다"
 tsin_legislation.110.title: "노동·복지 법안"
 tsin_legislation.110.desc: "노동 시간, 공장 안전, 빈민 구호와 사회 보험 가운데 무엇을 법안으로 낼 것인가?"
 tsin_legislation.110.z: "다른 분야를 고른다"
 tsin_legislation.120.title: "조세·화폐·결사 법안"
 tsin_legislation.120.desc: "세금을 누구에게 물릴지, 화폐를 무엇에 묶을지, 국민이 어디까지 모일 수 있을지를 법안으로 정한다."
 tsin_legislation.120.z: "다른 분야를 고른다"
 tsin_legislation.130.title: "토지·교회 법안"
 tsin_legislation.130.desc: "농노의 해방, 국유지의 처분, 교회와 국가의 관계를 법안으로 정한다."
 tsin_legislation.130.z: "다른 분야를 고른다"
 tsin_legislation.140.title: "산업·기업·환경 법안"
 tsin_legislation.140.desc: "산업 투자와 기업 규제, 환경 감독의 방향을 법안으로 정한다."
 tsin_legislation.140.z: "다른 분야를 고른다"
 tsin_legislation.150.title: "노예제 법안"
 tsin_legislation.150.desc: "노예무역과 노예제 자체를 두고 의회가 다시 갈라선다."
 tsin_legislation.150.z: "다른 분야를 고른다"
 tsin_legislation.160.title: "언론·이민 법안"
 tsin_legislation.160.desc: "신문을 얼마나 자유롭게 둘지, 국경을 얼마나 열지를 법안으로 정한다."
 tsin_legislation.160.z: "다른 분야를 고른다"
 tsin_legislation.170.title: "대중 교육 법안"
 tsin_legislation.170.desc: "누가 민중을 가르칠 것인가: 교회, 장인, 아니면 국가?"
 tsin_legislation.170.z: "다른 분야를 고른다"
 tsin_legislative_session: "입법 회기"
 tsin_legislative_session_desc: "이번 회기를 [parliament|e]에 걸린 법안([tsin_bills_concept|e]) 심의에 바칩니다. 통과하면 법안이 한 번 더 심의를 통과한 것으로 치고 논쟁에서도 유리해집니다([tsin_bill_readings_concept|e]). 실패하면 법안이 뒤로 밀립니다."
