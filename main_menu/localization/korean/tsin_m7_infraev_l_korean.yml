l_korean:

 # Infrastructure, finance, city life and late invention events
 tsin_economy.90.title: "궤간 전쟁"
 tsin_economy.90.desc: "철도 회사마다 선로 폭을 제멋대로 깔았습니다. 두 노선이 만나는 역에서는 짐을 모두 내려 다른 열차에 옮겨 실어야 합니다. 상인들은 짐꾼에게 주는 돈이 운임보다 많다고 불평합니다."
 tsin_economy.90.a: "법으로 표준 궤간을 정한다."
 tsin_economy.90.b: "회사들끼리 정하게 둔다."
 tsin_economy.100.title: "가스 공장 폭발"
 tsin_economy.100.desc: "한밤중에 시내 가스 공장의 가스 탱크가 터져 한 구역이 불탔습니다. 거리를 밝히던 가스등이 이제는 시민들의 두려움이 되었습니다. 시의회는 가스 공장을 시가 직접 운영해야 한다고 주장합니다."
 tsin_economy.100.a: "시가 가스 공장을 사들인다."
 tsin_economy.100.b: "민간 회사에 안전 규정을 둔다."
 tsin_economy.110.title: "급탄 기지"
 tsin_economy.110.desc: "증기 상선은 바람을 기다리지 않지만 석탄 없이는 한 걸음도 가지 못합니다. 항로를 따라 석탄을 쌓아 둘 기지가 있어야 먼 바다까지 정기 노선을 열 수 있습니다."
 tsin_economy.110.a: "항로를 따라 급탄 기지를 짓는다."
 tsin_economy.110.b: "대신 우편 증기선에 보조금을 준다."
 tsin_economy.120.title: "사라진 주식회사"
 tsin_economy.120.desc: "유한 책임 회사를 세운 한 사업가가 주주들의 돈을 들고 사라졌습니다. 그 회사에는 공장도 광산도 없었고 오직 화려한 설립 취지서만 있었습니다. 투자자들은 정부가 회사 장부를 들여다봐야 한다고 요구합니다."
 tsin_economy.120.a: "회사 등기소를 두고 회계를 공개하게 한다."
 tsin_economy.120.b: "산 사람이 조심할 일이다."
 tsin_economy.130.title: "은행 앞의 줄"
 tsin_economy.130.desc: "한 상업 은행이 위험하다는 소문이 돌자 예금자들이 새벽부터 은행 앞에 줄을 섰습니다. 금고가 비면 은행은 문을 닫고, 그 은행에 돈을 맡긴 공장들도 임금을 줄 수 없습니다."
 tsin_economy.130.a: "최종 대부자로 은행에 돈을 빌려준다."
 tsin_economy.130.b: "망하게 둔다."
 tsin_society.130.title: "대악취"
 tsin_society.130.desc: "여름 더위에 수도를 흐르는 강이 썩는 냄새를 풍겨 의회가 회의를 열 수 없습니다. 의원들은 석회에 적신 커튼 뒤에서 하수도 예산을 논의합니다. 냄새가 병을 옮긴다고 믿는 이도, 물이 옮긴다고 믿는 이도 이제는 같은 결론에 이릅니다."
 tsin_society.130.a: "강둑을 따라 차집 하수도를 놓는다."
 tsin_society.130.b: "커튼을 석회에 적시고 비를 기다린다."
 tsin_society.140.title: "도시의 허파"
 tsin_society.140.desc: "공장 굴뚝과 셋집으로 빽빽한 도시에 마지막 빈 땅이 남았습니다. 개혁가들은 노동자 가족이 일요일에 숨을 쉴 공원을 만들자고 하고, 건축업자들은 셋집을 더 짓겠다고 합니다."
 tsin_society.140.a: "시민 공원을 만든다."
 tsin_society.140.b: "건축업자에게 땅을 판다."
 tsin_society.150.title: "노동자 야학"
 tsin_society.150.desc: "공장 일을 마친 직공들이 등불 아래에서 글자와 셈을 배우겠다고 모입니다. 숙련공이 되면 임금이 오르고 공장도 이득을 봅니다. 교구는 자기들이 가르치겠다고 나섭니다."
 tsin_society.150.a: "국가가 야간 강좌를 연다."
 tsin_society.150.b: "교구에 맡긴다."
 tsin_society.160.title: "너무 많이 묻는 국세 조사"
 tsin_society.160.desc: "새 국세 조사표에는 이름과 나이뿐 아니라 언어, 신앙, 직업까지 묻는 칸이 있습니다. 통계가들은 나라를 알려면 그만큼 알아야 한다고 하고, 반대파는 정부가 집 안까지 들어온다고 항의합니다."
 tsin_society.160.a: "언어·신앙·직업까지 묻는다."
 tsin_society.160.b: "머릿수만 센다."
 tsin_society.170.title: "종두 반대 폭동"
 tsin_society.170.desc: "아이들에게 종두를 의무화하자 거리에 반대 시위대가 몰려나왔습니다. 그들은 국가가 아이의 팔에 칼을 댈 권리가 없다고 외칩니다. 의사들은 천연두가 돌아오는 것이 더 무섭다고 말합니다."
 tsin_society.170.a: "종두는 의무로 남는다."
 tsin_society.170.b: "양심적 거부 조항을 둔다."
 tsin_invention.80.title: "가황 고무"
 tsin_invention.80.desc: "생고무에 유황을 섞어 가열하자 여름에도 녹지 않고 겨울에도 굳지 않는 고무가 나왔습니다. 공장의 구동 벨트, 증기 호스, 방수 장화가 모두 이 새 재료로 만들어질 수 있습니다."
 tsin_invention.80.a: "고무 공장에 특허를 내준다."
 tsin_invention.80.b: "국영 공장의 벨트와 호스에 쓴다."
 tsin_invention.90.title: "내연 기관"
 tsin_invention.90.desc: "보일러도 석탄 더미도 없이 실린더 안에서 연료를 태워 움직이는 기관이 시연되었습니다. 작고 가벼워서 공장뿐 아니라 마차와 배에도 실을 수 있습니다."
 tsin_invention.90.a: "민간 공장에 특허를 내준다."
 tsin_invention.90.b: "국립 기관 연구소를 세운다."
 tsin_invention.100.title: "무선 전신"
 tsin_invention.100.desc: "전선 없이 공중으로 신호를 보내는 장치가 바다 건너편까지 모스 부호를 전했습니다. 항구를 떠난 배도 이제 육지와 이야기할 수 있습니다."
 tsin_invention.100.a: "상선 항로에 무선을 단다."
 tsin_invention.100.b: "함대에 무선을 단다."
