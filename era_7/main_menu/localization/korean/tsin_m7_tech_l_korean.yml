l_korean:

 tsin_system.4.title: "산업 시대의 특화"
 tsin_system.4.desc: "산업 시대에는 모든 특화의 [advances|e]를 연구할 수 있습니다.\n\n시대가 시작될 때 고른 특화의 발전은 바로 연구할 수 있습니다. 나머지 두 특화는 짝이 되는 [institution|e]을 수용하면 열립니다.\n- 행정: $tsin_mass_society$ 수용\n- 외교: $tsin_industrial_capitalism$ 수용\n- 군사: $tsin_electrification$ 수용\n\n군사 발전과 새 유닛은 특화와 관계없이 모든 나라가 연구할 수 있습니다."
 tsin_system.4.a: "알겠습니다."
 tsin_professional_bureaucracy_advance: "전문 관료제"
 tsin_professional_bureaucracy_advance_desc: "시험으로 뽑고 연공으로 승진하는 상설 관료 조직이 국가 행정을 떠맡습니다."
 tsin_ministerial_government_advance: "내각 책임제"
 tsin_ministerial_government_advance_desc: "부처마다 장관이 책임지는 근대 정부는 더 넓은 영토를 다스릴 수 있습니다."
 tsin_municipal_charters_advance: "지방 자치 헌장"
 tsin_municipal_charters_advance_desc: "선출된 시의회가 도시의 도로, 조명, 시장을 직접 관리합니다."
 tsin_steam_construction_advance: "증기 건설"
 tsin_steam_construction_advance_desc: "증기 크레인과 증기 해머가 공사 현장의 속도를 바꿔 놓습니다."
 tsin_macadam_roads_advance: "머캐덤 도로"
 tsin_macadam_roads_advance_desc: "다진 쇄석을 층층이 깐 도로는 비가 와도 무너지지 않습니다."
 tsin_anesthesia_advance: "마취"
 tsin_anesthesia_advance_desc: "에테르와 클로로포름 덕분에 외과 의사는 서두르지 않고 수술할 수 있습니다."
 tsin_antiseptic_surgery_advance: "소독 수술"
 tsin_antiseptic_surgery_advance_desc: "석탄산으로 손과 도구를 씻자 수술 뒤 감염으로 죽는 환자가 크게 줄었습니다."
 tsin_vaccination_campaigns_advance: "예방 접종 운동"
 tsin_vaccination_campaigns_advance_desc: "국가가 아이들에게 천연두 예방 접종을 의무로 지웁니다."
 tsin_quinine_prophylaxis_advance: "키니네 예방법"
 tsin_quinine_prophylaxis_advance_desc: "매일 먹는 키니네가 열대의 말라리아로부터 병사와 개척민을 지켜 줍니다."
 tsin_steam_packet_diplomacy_advance: "증기 우편선 외교"
 tsin_steam_packet_diplomacy_advance_desc: "정기 증기 우편선이 외교 문서를 몇 달이 아니라 몇 주 만에 실어 나릅니다."
 tsin_gunboat_diplomacy_advance: "포함 외교"
 tsin_gunboat_diplomacy_advance_desc: "항구 앞에 나타난 포함 한 척이 길고 긴 협상보다 빠릅니다."
 tsin_concert_of_powers_advance: "열강 협조 체제"
 tsin_concert_of_powers_advance_desc: "열강이 정기 회의로 분쟁을 조정해 큰 전쟁을 피합니다."
 tsin_international_law_advance: "국제법"
 tsin_international_law_advance_desc: "조약과 관례가 법전으로 정리되어 강화 조건을 다투기 쉬워집니다."
 tsin_informal_empire_advance: "비공식 제국"
 tsin_informal_empire_advance_desc: "차관과 상업 조약이 깃발 없이도 다른 나라를 묶어 둡니다."
 tsin_intelligence_service_advance: "정보기관"
 tsin_intelligence_service_advance_desc: "상설 정보기관이 전신과 신문을 읽고 해외 첩보망을 관리합니다."
 tsin_colonial_frontier_advance: "식민 변경"
 tsin_colonial_frontier_advance_desc: "증기선과 키니네가 내륙 깊숙한 땅까지 식민을 가능하게 합니다."
 tsin_steam_merchant_marine_advance: "증기 상선대"
 tsin_steam_merchant_marine_advance_desc: "정기 증기 화물선이 바람과 관계없이 바다를 오갑니다."
 tsin_limited_liability_advance: "유한 책임 회사"
 tsin_limited_liability_advance_desc: "투자자의 손실을 출자금으로 한정하자 공장과 철도에 돈이 몰립니다."
 tsin_commercial_banking_advance: "상업 은행"
 tsin_commercial_banking_advance_desc: "예금을 모아 산업에 빌려주는 은행이 통화를 안정시킵니다."
 tsin_deep_coal_mining_advance: "심부 탄광"
 tsin_deep_coal_mining_advance_desc: "증기 양수기와 환기 갱도로 더 깊은 탄층까지 캘 수 있습니다. $tsin_blasting_works$을 2레벨까지 짓고 증기 양수 방식을 쓸 수 있게 됩니다([tsin_extraction_tiers_concept|e])."
 tsin_iron_ore_beneficiation_advance: "철광석 선광"
 tsin_iron_ore_beneficiation_advance_desc: "빈광을 부수고 골라내 제철소가 쓸 수 있는 광석으로 만듭니다."
 tsin_synthetic_dyes_advance: "합성 염료"
 tsin_synthetic_dyes_advance_desc: "콜타르에서 뽑아낸 보라색이 식물 염료의 시대를 끝냅니다."
 tsin_vulcanization_advance: "가황 고무"
 tsin_vulcanization_advance_desc: "황을 섞어 가열한 고무는 더위에도 녹지 않고 추위에도 굳지 않습니다."
 tsin_oil_refining_advance: "석유 정제"
 tsin_oil_refining_advance_desc: "증류탑에서 등유와 윤활유를 걸러 내 석유가 새로운 산업이 됩니다."
 tsin_nation_state_advance: "국민 국가"
 tsin_nation_state_advance_desc: "하나의 언어, 하나의 학교, 하나의 국기가 지방을 국민으로 묶습니다."
 tsin_mass_politics_advance: "대중 정치"
 tsin_mass_politics_advance_desc: "정당과 집회, 신문이 정치를 소수의 일에서 다수의 일로 바꿉니다."
 tsin_citizenship_advance: "시민권"
 tsin_citizenship_advance_desc: "신민이 아니라 권리와 의무를 지닌 시민이 국가를 이룹니다."
 tsin_popular_press_advance: "대중 신문"
 tsin_popular_press_advance_desc: "한 푼짜리 신문이 수십만 부씩 팔리며 여론을 만듭니다."
 tsin_national_census_advance: "국세 조사"
 tsin_national_census_advance_desc: "모든 가구를 세고 기록하는 국가는 세금도 정확히 걷습니다."
 tsin_electrochemistry_advance: "전기 화학"
 tsin_electrochemistry_advance_desc: "값싼 전기로 알루미늄과 화학 원료를 전기 분해합니다."
 tsin_internal_combustion_advance: "내연 기관"
 tsin_internal_combustion_advance_desc: "실린더 안에서 연료를 태우는 작은 기관이 증기기관이 못 가는 곳으로 갑니다."
 tsin_wireless_telegraphy_advance: "무선 전신"
 tsin_wireless_telegraphy_advance_desc: "전파는 전선 없이 바다 위의 함대에 명령을 전합니다."
 tsin_modern_tactics_advance: "근대 전술"
 tsin_modern_tactics_advance_desc: "산개 대형과 엄폐 사격이 밀집 대형을 대신합니다."
 tsin_railway_mobilization_advance: "철도 동원"
 tsin_railway_mobilization_advance_desc: "시간표대로 움직이는 군용 열차가 며칠 만에 군단을 국경으로 옮깁니다."
 tsin_field_fortification_advance: "야전 축성"
 tsin_field_fortification_advance_desc: "소총 사거리가 늘자 병사들은 삽을 들고 참호를 팝니다."
 tsin_conscription_reserves_advance: "징병 예비군"
 tsin_conscription_reserves_advance_desc: "복무를 마친 병사가 예비군 명부에 남아 전시에 다시 소집됩니다."
 tsin_siege_engineering_advance: "공성 공학"
 tsin_siege_engineering_advance_desc: "철도로 실어 온 중포와 공병대가 요새를 체계적으로 무너뜨립니다."
 tsin_assault_doctrine_advance: "강습 교리"
 tsin_assault_doctrine_advance_desc: "포격 직후 돌격하는 훈련된 강습 부대가 성벽을 넘습니다."
 tsin_rifled_siege_guns_advance: "강선 공성포"
 tsin_rifled_siege_guns_advance_desc: "강선 포탄은 낡은 성벽을 몇 시간 만에 부숩니다."
 tsin_naval_gunnery_advance: "해군 포술"
 tsin_naval_gunnery_advance_desc: "사격 통제와 정밀한 조준이 먼 거리의 포격전을 결정합니다."
 tsin_steam_repair_advance: "증기 수리"
 tsin_steam_repair_advance_desc: "함상 공작실과 수리선이 함대를 바다 위에서 고칩니다."
 tsin_military_medicine_advance: "군 의학"
 tsin_military_medicine_advance_desc: "야전 병원과 들것 부대가 부상병을 살려 냅니다."
 tsin_lancers_advance: "창기병"
 tsin_lancers_advance_desc: "기병은 창을 다시 들고 충격 돌격 부대로 남습니다. $a_tsin_lancers$을 모집할 수 있게 됩니다."
 tsin_railway_supply_corps_advance: "철도 보급대"
 tsin_railway_supply_corps_advance_desc: "철도를 깔고 운영하는 전문 부대가 군대를 먹여 살립니다. $a_tsin_railway_supply_corps$를 모집할 수 있게 됩니다."
 tsin_maxim_gun_advance: "맥심 기관총"
 tsin_maxim_gun_advance_desc: "반동으로 다음 탄을 장전하는 기관총은 한 정이 한 중대의 화력을 냅니다. $a_tsin_machine_gun_detachment$를 모집할 수 있게 됩니다."
 tsin_smokeless_powder_advance: "무연 화약"
 tsin_smokeless_powder_advance_desc: "연기가 없는 화약과 볼트액션 소총이 전장을 보이지 않게 만듭니다. $a_tsin_bolt_action_infantry$을 모집할 수 있게 됩니다."
 tsin_jaeger_advance: "엽병"
 tsin_jaeger_advance_desc: "사냥꾼과 산악민 출신의 정예 경보병이 지형을 무기로 씁니다. $a_tsin_jaegers$을 모집할 수 있게 됩니다."
 tsin_quick_firing_artillery_advance: "속사포"
 tsin_quick_firing_artillery_advance_desc: "주퇴복좌기가 반동을 흡수해 포는 조준을 다시 하지 않고 계속 쏩니다. $a_tsin_quick_firing_battery$를 모집할 수 있게 됩니다."
 tsin_steam_transport_advance: "증기 수송선"
 tsin_steam_transport_advance_desc: "증기 수송선은 바람을 기다리지 않고 군대를 바다 건너로 실어 나릅니다. $n_tsin_steam_transport$을 건조할 수 있게 됩니다."
 tsin_protected_cruiser_advance: "방호 순양함"
 tsin_protected_cruiser_advance_desc: "장갑 갑판으로 기관을 지키는 빠른 순양함이 통상로를 지배합니다. $n_tsin_protected_cruiser$을 건조할 수 있게 됩니다."
 tsin_destroyer_advance: "구축함"
 tsin_destroyer_advance_desc: "어뢰정을 사냥하려고 만든 배가 스스로 어뢰를 싣습니다. $n_tsin_destroyer$을 건조할 수 있게 됩니다."
 tsin_pre_dreadnought_advance: "전노급 전함"
 tsin_pre_dreadnought_advance_desc: "강철 장갑과 회전 포탑을 갖춘 전함이 열강 해군의 척도가 됩니다. $n_tsin_pre_dreadnought$을 건조할 수 있게 됩니다."
 a_tsin_lancers: "창기병"
 a_tsin_lancers_desc: "창과 군도를 든 창기병은 소총의 시대에도 추격과 돌격을 맡습니다."
 a_tsin_railway_supply_corps: "철도 보급대"
 a_tsin_railway_supply_corps_desc: "철도를 고치고 열차를 운행해 군대의 보급을 맡습니다."
 a_tsin_machine_gun_detachment: "기관총 분견대"
 a_tsin_machine_gun_detachment_desc: "몇 명이 운용하는 기관총이 보병 대대 하나의 화력을 냅니다."
 a_tsin_bolt_action_infantry: "볼트액션 보병"
 a_tsin_bolt_action_infantry_desc: "무연 화약 볼트액션 소총으로 무장한 세기말 군대의 주력입니다."
 a_tsin_jaegers: "엽병"
 a_tsin_jaegers_desc: "엄폐와 정밀 사격으로 적의 측면을 무너뜨리는 정예 경보병입니다."
 a_tsin_quick_firing_battery: "속사 포대"
 a_tsin_quick_firing_battery_desc: "분당 열 발 넘게 쏘며 폭약 포탄을 대량으로 소비합니다."
 n_tsin_steam_transport: "증기 수송선"
 n_tsin_steam_transport_desc: "석탄을 때며 병력과 말을 바다 건너로 실어 나릅니다."
 n_tsin_protected_cruiser: "방호 순양함"
 n_tsin_protected_cruiser_desc: "빠르고 멀리 가며 장갑 갑판 아래 기관을 숨깁니다."
 n_tsin_destroyer: "구축함"
 n_tsin_destroyer_desc: "함대를 어뢰정으로부터 지키고 직접 어뢰 공격도 합니다."
 n_tsin_pre_dreadnought: "전노급 전함"
 n_tsin_pre_dreadnought_desc: "강철 장갑과 대구경 포탑을 갖춘 세기말 해군의 주력함입니다."
 tsin_constitutional_monarchy_advance: "입헌 군주정"
 tsin_constitutional_monarchy_advance_desc: "군주는 헌법 아래에서 통치하고, 내각이 의회에 책임을 집니다."
 tsin_merit_civil_service_advance: "실적제 공무원"
 tsin_merit_civil_service_advance_desc: "엽관제 대신 시험과 실적으로 공무원을 뽑습니다."
 tsin_ultramontanism_advance: "교황 지상주의"
 tsin_ultramontanism_advance_desc: "신앙의 권위가 국경을 넘어 하나의 중심으로 모입니다."
 tsin_steppe_modernization_advance: "초원 근대화"
 tsin_steppe_modernization_advance_desc: "유목 군주가 소총과 전신을 받아들여 부족 연합을 다잡습니다."
 tsin_social_catholicism_advance: "사회 가톨릭주의"
 tsin_social_catholicism_advance_desc: "교회가 노동자의 정당한 임금과 결사의 권리를 말합니다."
 tsin_catholic_revival_advance: "가톨릭 부흥"
 tsin_catholic_revival_advance_desc: "순례와 새 수도회, 대중 신심이 교회를 되살립니다."
 tsin_social_gospel_advance: "사회 복음"
 tsin_social_gospel_advance_desc: "교회가 빈민가에 학교와 진료소를 세웁니다."
 tsin_higher_criticism_advance: "성서 고등 비평"
 tsin_higher_criticism_advance_desc: "성서를 역사 문헌으로 읽는 학문이 대학을 흔듭니다."
 tsin_slavophile_revival_advance: "슬라브주의 부흥"
 tsin_slavophile_revival_advance_desc: "정교회 전통이 민족 문화의 뿌리로 다시 주목받습니다."
 tsin_synodal_reform_advance: "시노드 개혁"
 tsin_synodal_reform_advance_desc: "교구 학교가 늘고 성직자 교육이 개혁됩니다."
 tsin_islamic_modernism_advance: "이슬람 근대주의"
 tsin_islamic_modernism_advance_desc: "학자들이 이성과 과학이 신앙과 맞선다는 주장을 반박합니다."
 tsin_pan_islamism_advance: "범이슬람주의"
 tsin_pan_islamism_advance_desc: "제국주의에 맞서 이슬람 세계의 연대를 부르짖습니다."
 tsin_buddhist_revival_advance: "불교 부흥 운동"
 tsin_buddhist_revival_advance_desc: "사원 학교와 경전 인쇄가 불교를 대중에게 다시 엽니다."
 tsin_hindu_reform_movement_advance: "힌두 개혁 운동"
 tsin_hindu_reform_movement_advance_desc: "개혁 결사가 교육과 사회 관습의 개혁을 이끕니다."
 tsin_jewish_reform_movement_advance: "유대교 개혁 운동"
 tsin_jewish_reform_movement_advance_desc: "하스칼라의 학문 정신이 회당과 대학을 잇습니다."
 tsin_state_shinto_advance: "국가 신도"
 tsin_state_shinto_advance_desc: "국가가 신사 제사를 국민 통합의 의례로 삼습니다."
 tsin_miaphysite_schools_advance: "교회 학교 부흥"
