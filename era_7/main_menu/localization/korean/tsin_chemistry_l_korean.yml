 tsin_oil: "석유"
 tsin_oil_desc: "처음 뚫은 유정에서 나온 석유는 공작 기계의 윤활유가 되고, 뒤에는 발전소의 연료가 됩니다. 석유를 가진 채로 시작하는 [location|e]은 없으며, 유전은 [decision|e] [ShowDecisionName('tsin_prospect_for_oil')]로 엽니다([tsin_oil_prospecting_concept|e])."
