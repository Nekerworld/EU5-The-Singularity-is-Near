 tsin_fertilizer_desc: "초석과 백반, 생선 찌꺼기와 가축 부산물을 가공해 만든 비료는 지친 땅의 힘을 되살립니다. 같은 밭에서 더 많은 곡식을 거두려는 농장들이 이를 사들입니다([tsin_chemical_industry_concept|e])."
 tsin_explosives_desc: "흑색화약에서 니트로글리세린에 이르는 폭약은 광산의 암반을 부수고 철도가 지나갈 길을 뚫습니다. 다루기 위험하지만, 산업 시대의 토목과 채굴은 이것 없이는 나아가지 못합니다([tsin_chemical_industry_concept|e])."

 tsin_fertilizer_plant: "비료 공장"
 tsin_fertilizer_plant_desc: "$tsin_fertilizer_plant$에서는 광물이나 생선, 가축 부산물을 갈고 처리해 $tsin_fertilizer$를 만듭니다([tsin_chemical_industry_concept|e])."
 tsin_fertilizer_plant_slot_0: "원료"
 tsin_fertilizer_mineral: "광물 비료"
 tsin_fertilizer_organic: "유기 비료"
 tsin_explosives_plant: "폭약 공장"
 tsin_explosives_plant_desc: "$tsin_explosives_plant$에서는 초석을 원료로 $tsin_explosives$을 만듭니다([tsin_chemical_industry_concept|e]). 사고 한 번이면 공장 전체가 날아갈 수 있습니다."
 tsin_explosives_plant_slot_0: "배합"
 tsin_explosives_black_powder: "흑색화약"
 tsin_explosives_nitroglycerin: "니트로글리세린"
 tsin_fertilized_fields: "시비 농지"
 tsin_fertilized_fields_desc: "$tsin_fertilizer$를 뿌려 지력을 유지하는 농지입니다. 곡물 [output|e]과 [food|e]이 늘어납니다([tsin_chemical_industry_concept|e])."
 tsin_fertilized_fields_slot_0: "유지"
 tsin_fertilized_fields_maintenance: "비료 시비"
 tsin_blasting_works: "발파 채굴장"
 tsin_blasting_works_desc: "$tsin_explosives$으로 암반을 깨뜨려 더 깊은 광맥까지 파고드는 채굴장입니다. 광물 [output|e]이 늘어납니다([tsin_extraction_tiers_concept|e])."
 tsin_blasting_works_slot_0: "유지"
 tsin_blasting_works_maintenance: "발파"

 tsin_bessemer_process_advance: "전로 제강법"
 tsin_bessemer_process_advance_desc: "녹은 선철에 공기를 불어 넣어 불순물을 태워 없애면, 몇 시간 걸리던 제강이 몇 분 만에 끝납니다. 강철은 더 이상 귀한 재료가 아닙니다."
 tsin_open_hearth_advance: "평로 제강법"
 tsin_open_hearth_advance_desc: "폐열을 되살려 쓰는 평로는 고철까지 녹여 품질을 고르게 맞춘 강철을 대량으로 만들어 냅니다."
 tsin_machine_tools_advance: "공작 기계"
 tsin_machine_tools_advance_desc: "정밀한 선반과 평삭반이 기계로 기계를 만들게 해 줍니다. 호환되는 부품은 $tsin_engines$과 공구 생산을 크게 앞당깁니다."
 tsin_shift_work_advance: "교대 근무"
 tsin_shift_work_advance_desc: "공장의 기계는 밤에도 멈추지 않습니다. 교대 근무는 생산을 늘리지만, 노동자들의 불만도 함께 쌓입니다."
 tsin_steel_rolling_stock_advance: "강철 궤도와 차량"
 tsin_steel_rolling_stock_advance_desc: "강철 레일과 차륜은 쇠보다 오래 견디고 더 무거운 짐을 실어 나릅니다. 철도와 도로를 놓는 비용과 시간이 줄어듭니다."
 tsin_railway_network_advance: "철도망"
 tsin_railway_network_advance_desc: "수도에서 뻗어 나간 철도가 지방 도시를 하나로 묶습니다. 철도로 수도와 이어진 도시에 $tsin_railway_station$을 지을 수 있게 됩니다([tsin_railways_concept|e])."
 tsin_railway_station: "철도역"
 tsin_railway_station_desc: "기관차가 석탄과 물을 채우고 화물을 싣는 $tsin_railway_station$은 이 도시를 넓은 [market|e]에 이어 줍니다. 철도로 수도와 이어져 있어야 하며, 연결이 끊기면 사라집니다([tsin_railways_concept|e])."
 tsin_railway_station_slot_0: "유지"
 tsin_railway_station_maintenance: "역 운영"

 tsin_improved_fertilizer_advance: "개량 비료"
 tsin_improved_fertilizer_advance_desc: "농화학의 발전으로 작물이 무엇을 필요로 하는지 알게 되었습니다. $tsin_fertilizer_plant$과 $tsin_fertilized_fields$를 지을 수 있게 됩니다([tsin_chemical_industry_concept|e])."
 tsin_dynamite_advance: "다이너마이트"
 tsin_dynamite_advance_desc: "니트로글리세린을 안정시킨 다이너마이트는 광산과 토목 현장을 바꾸어 놓습니다. $tsin_explosives_plant$과 $tsin_blasting_works$을 지을 수 있게 됩니다([tsin_chemical_industry_concept|e])."
 tsin_stock_exchange_advance: "증권 거래소"
 tsin_stock_exchange_advance_desc: "주식과 채권이 매일 거래되는 증권 거래소는 흩어진 자본을 모아 공장과 철도로 보냅니다."

 tsin_rubber: "고무"
 tsin_rubber_desc: "열대 나무에서 받아 굳힌 고무는 기계 시대의 구동 벨트와 호스, 밀봉재가 됩니다. 고무를 가진 채로 시작하는 [location|e]은 없으며, 밀림은 \"고무 붐\" 이벤트로 고무 산지가 됩니다([tsin_oil_prospecting_concept|e])."
