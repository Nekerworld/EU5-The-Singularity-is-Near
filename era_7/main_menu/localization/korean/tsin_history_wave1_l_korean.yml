l_korean:
 tsin_history_wave1.1.title: "편지를 보내기 전에"
 tsin_history_wave1.1.desc: "관리들이 선불 우표와 통일 요금을 제안했습니다. 영국의 1840년 우편 개혁처럼 장부를 단순하게 하고 부유층 이외에도 편지를 보낼 길을 넓히자는 구상입니다."
 tsin_history_wave1.1.a: "제한된 우편 시범사업에 예산을 배정하라."
 tsin_history_wave1.1.b: "기존 방식을 유지하라."
 tsin_history_wave1.2.title: "선불 편지가 가득한 자루"
 tsin_history_wave1.2.desc: "시범사업으로 편지는 늘었지만 선불 우편의 기록 방식은 제각각입니다. 공통 장부를 도입하려면 서기 교육과 시간이 필요합니다."
 tsin_history_wave1.2.a: "우편 서기를 교육하라."
 tsin_history_wave1.2.b: "시범사업은 여기까지다."
 tsin_history_wave1.3.title: "가짜 우표 한 장"
 tsin_history_wave1.3.desc: "우편 분류소에 모조 우표가 들어왔습니다. 소인을 표준화하고 안내를 배포할지, 각 서기의 판단에 맡길지 논쟁이 일었습니다."
 tsin_history_wave1.3.a: "공통 확인 규칙을 공표하라."
 tsin_history_wave1.3.b: "각 우체국의 판단에 맡겨라."
 tsin_history_wave1.4.title: "우편 시범사업의 결산"
 tsin_history_wave1.4.desc: "우편 관서들이 경험을 보고했습니다. 오래갈 제도에는 첫 우표를 기념하는 행사보다 신뢰할 수 있는 회계가 필요합니다."
 tsin_history_wave1.4.a: "검증된 행정 표준을 채택하라."
 tsin_history_wave1.4.b: "작은 지역 사업으로 남겨라."
 tsin_history_wave1.5.title: "실험실에서 나온 보라색"
 tsin_history_wave1.5.desc: "퍼킨은 1856년 보랏빛 합성 염료를 얻었습니다. 이미 합성 염료를 아는 국내 제조업자들은 실험 시료를 균일한 상품으로 만들 지원을 요청했습니다."
 tsin_history_wave1.5.a: "감독하에 시험 생산 비용을 지원하라."
 tsin_history_wave1.5.b: "국가 지원 없이 기업이 진행하게 하라."
 tsin_history_wave1.6.title: "색이 바랜 견본"
 tsin_history_wave1.6.desc: "같은 제품인데도 어떤 묶음은 색이 빨리 바랩니다. 생산 자체는 가능하지만 구매자들은 일정한 규격을 원합니다."
 tsin_history_wave1.6.a: "독립적인 시험을 의뢰하라."
 tsin_history_wave1.6.b: "공공 시범사업을 마쳐라."
 tsin_history_wave1.7.title: "염색업자들의 청원"
 tsin_history_wave1.7.desc: "기존 염색업자들은 거래처를 잃을까 걱정합니다. 제조업자들은 독점 특혜를, 상인들은 누구나 충족할 수 있는 규격을 요구합니다."
 tsin_history_wave1.7.a: "공개 규격을 발표하라."
 tsin_history_wave1.7.b: "개별 계약은 상인에게 맡겨라."
 tsin_history_wave1.8.title: "상품으로 자리 잡은 색"
 tsin_history_wave1.8.desc: "시범사업이 끝났습니다. 기적 같은 색이라는 광고보다 균일한 품질과 안전, 정직한 표시가 중요하다는 결론입니다."
 tsin_history_wave1.8.a: "검증 체계를 유지하라."
 tsin_history_wave1.8.b: "결과를 공개하고 사업을 종료하라."
 tsin_history_wave1.9.title: "주머니에 박은 리벳"
 tsin_history_wave1.9.desc: "1873년 리벳 작업복 특허는 국내 의류 작업장에도 실용적인 사례가 되었습니다. 구매자들은 고된 작업에도 견디는 주머니를 원합니다."
 tsin_history_wave1.9.a: "공공 조달용 견본을 시험하라."
 tsin_history_wave1.9.b: "주문은 민간 구매자에게 맡겨라."
 tsin_history_wave1.10.title: "작업복 납품 입찰"
 tsin_history_wave1.10.desc: "납품업자들이 서로 다른 천과 고정 방식을 제시했습니다. 가장 싼 입찰이 가장 튼튼한 제품은 아닙니다."
 tsin_history_wave1.10.a: "실제 내구성 시험을 요구하라."
 tsin_history_wave1.10.b: "조달 시범사업을 마쳐라."
 tsin_history_wave1.11.title: "작업장의 납품 계약"
 tsin_history_wave1.11.desc: "선정된 작업장들이 예측 가능한 검수와 지급 일정을 요구합니다. 모든 민간 거래에 개입하지 않고도 공공 계약 조건을 표준화할 수 있습니다."
 tsin_history_wave1.11.a: "공공 계약 조건을 표준화하라."
 tsin_history_wave1.11.b: "주문마다 따로 협상하라."
 tsin_history_wave1.12.title: "수선한 주머니"
 tsin_history_wave1.12.desc: "사용자들이 보고서와 손상된 견본을 돌려보냈습니다. 바느질과 수선 같은 사소한 정보가 다음 입찰의 기준을 개선했습니다."
 tsin_history_wave1.12.a: "향후 조달에 결과를 활용하라."
 tsin_history_wave1.12.b: "일반 표준 없이 보고서만 보관하라."
 tsin_history_wave1.13.title: "움직이는 사진"
 tsin_history_wave1.13.desc: "1895년 뤼미에르의 상업 상영이 시작되었습니다. 흥행업자가 도시의 적합한 회관을 빌려 상영회를 열겠다고 제안했습니다."
 tsin_history_wave1.13.a: "작은 공개 시연회를 후원하라."
 tsin_history_wave1.13.b: "민간 시연만 허용하라."
 tsin_history_wave1.14.title: "관객으로 가득 찬 회관"
 tsin_history_wave1.14.desc: "새로운 구경거리에 관객이 몰렸습니다. 다음 상영 전에는 출입과 기본 운영 규칙을 정해야 합니다."
 tsin_history_wave1.14.a: "정원과 출입구 규칙을 협의하라."
 tsin_history_wave1.14.b: "공공 후원을 끝내라."
 tsin_history_wave1.15.title: "검토를 위해 제출된 상영 목록"
 tsin_history_wave1.15.desc: "흥행업자가 어떤 소재를 상영할 수 있는지 물었습니다. 안전만 살피는 검토와 광범위한 정치 검열은 다른 결과를 낳을 것입니다."
 tsin_history_wave1.15.a: "명확한 운영 규칙으로 검토 범위를 한정하라."
 tsin_history_wave1.15.b: "개별 관리에게 승인을 맡겨라."
 tsin_history_wave1.16.title: "도시 오락의 한 자리를 차지하다"
 tsin_history_wave1.16.desc: "시범사업이 끝났습니다. 활동사진은 관객을 찾았지만 이 새로운 업종의 미래 수익을 보장할 수는 없습니다."
 tsin_history_wave1.16.a: "시범 결과와 공통 규칙을 공개하라."
 tsin_history_wave1.16.b: "공공 사업을 종료하라."
 tsin_history_wave1.17.title: "큰 종에 생긴 균열"
 tsin_history_wave1.17.desc: "런던의 큰 종은 1858년 다시 주조된 뒤에도 균열을 겪었습니다. 국내 도시의 시계 관리인들도 손상된 종과 보수 계약 분쟁을 보고했습니다."
 tsin_history_wave1.17.a: "제한된 독립 검토에 예산을 배정하라."
 tsin_history_wave1.17.b: "민간의 자율에 맡겨라."
 tsin_history_wave1.18.title: "돌이 되었다는 거인"
 tsin_history_wave1.18.desc: "1869년 카디프 거인 사기는 놀라운 발견에 대한 대중의 수요를 보여 주었습니다. 한 흥행업자가 독립 감정 전에 고대 거인이라는 전시물을 당국이 인정해 달라고 요청했습니다."
 tsin_history_wave1.18.a: "제한된 독립 검토에 예산을 배정하라."
 tsin_history_wave1.18.b: "민간의 자율에 맡겨라."
 tsin_history_wave1.19.title: "비둘기가 나르는 편지"
 tsin_history_wave1.19.desc: "1870~1871년 파리 포위에서는 비둘기 우편으로 축소 촬영한 소식을 전달했습니다. 전시 연락 담당자들은 모든 통신을 대체하려는 대신 작은 시험을 제안했습니다."
 tsin_history_wave1.19.a: "제한된 독립 검토에 예산을 배정하라."
 tsin_history_wave1.19.b: "민간의 자율에 맡겨라."
 tsin_history_wave1.20.title: "자동차와 속도 제한"
 tsin_history_wave1.20.desc: "1896년 영국의 과속 기소는 낡은 도로 규칙을 자동차에 적용할 때의 문제를 보여 줍니다. 국내 관리들은 주민들의 신고를 처리할 명확한 절차를 요구합니다."
 tsin_history_wave1.20.a: "제한된 독립 검토에 예산을 배정하라."
 tsin_history_wave1.20.b: "민간의 자율에 맡겨라."
 tsin_history_wave1.21.title: "고통 없는 수술 시연"
 tsin_history_wave1.21.desc: "1846년의 공개 에테르 마취 시연은 수술을 둘러싼 논의를 바꾸었습니다. 근대 의학을 공부하던 국내 의사들이 감독하의 시연과 투명한 보고를 요청했습니다."
 tsin_history_wave1.21.a: "제한된 독립 검토에 예산을 배정하라."
 tsin_history_wave1.21.b: "민간의 자율에 맡겨라."
 tsin_history_wave1.22.title: "하늘과 전신선"
 tsin_history_wave1.22.desc: "1859년의 큰 오로라와 전신 장비 이상에 관한 보고가 도착했습니다. 운영자들은 완전한 설명을 내세우기보다 이상 현상을 기록하고 장비를 점검하자고 제안했습니다."
 tsin_history_wave1.22.a: "제한된 독립 검토에 예산을 배정하라."
 tsin_history_wave1.22.b: "민간의 자율에 맡겨라."
 tsin_history_wave1.23.title: "기계에서 나오는 목소리"
 tsin_history_wave1.23.desc: "1870년대 후반에는 축음기 시연이 이루어졌습니다. 전기 통신에 익숙한 흥행업자가 학자와 시민에게 녹음된 소리를 들려주는 시연을 제안했습니다."
 tsin_history_wave1.23.a: "제한된 독립 검토에 예산을 배정하라."
 tsin_history_wave1.23.b: "민간의 자율에 맡겨라."
 tsin_history_wave1.24.title: "광견병 연구실에서 온 보고"
 tsin_history_wave1.24.desc: "1885년 광견병 치료에 관한 소식이 국내 의학계에 도착했습니다. 의사들은 모든 실험 치료를 검증됐다고 선언하기보다 보고서 번역과 독립 검토를 요청했습니다."
 tsin_history_wave1.24.a: "제한된 독립 검토에 예산을 배정하라."
 tsin_history_wave1.24.b: "민간의 자율에 맡겨라."
 tsin_historical_events: "TSIN 추가 역사 사건"
 tsin_historical_events_desc: "추가 역사 사건 제작분을 제한적으로 추첨합니다. 인간 국가는 연 최대 3개, 고밀도에서는 최대 6개 추가 사건을 받으며 기존 풍미 예산은 별도로 유지됩니다."
 tsin_historical_events_normal: "기본 추가 사건"
 tsin_historical_events_normal_desc: "제작분 전체에서 인간 국가는 연 최대 3번, AI는 최대 1번 추첨합니다. 기존 TSIN 풍미 사건은 별도로 유지됩니다."
 tsin_historical_events_dense: "고밀도 추가 사건"
 tsin_historical_events_dense_desc: "인간 국가는 연 최대 6번, AI는 최대 2번 추첨하며 같은 사건열은 한 해에 두 단계 진행하지 않습니다."
 tsin_historical_events_off: "끔"
 tsin_historical_events_off_desc: "첫 제작분의 역사 사건을 추첨하지 않습니다. 과거 선택은 유지됩니다."
 STATIC_MODIFIER_NAME_tsin_history_verified_practice: "검증된 공공 실무"
 STATIC_MODIFIER_DESC_tsin_history_verified_practice: "독립 검토와 공통 공공 절차에서 얻은 작은 임시 효과입니다. 중복 누적하지 않고 기간만 갱신합니다."
