l_korean:
 tsin_history2.1.title: "공장의 벌금 장부"
 tsin_history2.1.desc: "화학 작업장의 노동자들이 임의 벌금과 위험한 작업을 고발했습니다. 대표들은 급료에서 공제한 내역이 담긴 장부를 관청에 제출했습니다."
 tsin_history2.1.a: "임금과 안전 장부를 감사하라."
 tsin_history2.1.b: "먼저 사업주의 답변을 받아라."
 tsin_history2.2.title: "신문에 실린 고발"
 tsin_history2.2.desc: "신문에 고발 내용이 실렸습니다. 편집자는 당국이 조사 결과를 공개할지, 엇갈리는 소문만 남길지 답변을 요구합니다."
 tsin_history2.2.a: "확인된 조사 결과를 공개하라."
 tsin_history2.2.b: "조사는 비공개로 유지하라."
 tsin_history2.3.title: "공장 문 앞의 노동자들"
 tsin_history2.3.desc: "노동자들이 공장 앞에 모여 대표를 선출했습니다. 현지 합의로 조업 중단이 확대되기 전에 사태를 끝낼 수 있습니다."
 tsin_history2.3.a: "구속력 있는 현지 합의에 비용을 지불하라."
 tsin_history2.3.b: "구체적인 요구 목록을 받아라."
 tsin_history2.4.title: "세 가지 요구와 각자의 비용"
 tsin_history2.4.desc: "대표들은 벌금, 해고, 보호 장비를 구분해 요구했습니다. 각 요구의 비용과 지지 세력이 서로 다릅니다."
 tsin_history2.4.a: "안전 장비를 우선 지원하라."
 tsin_history2.4.b: "먼저 벌금 규정을 협상하라."
 tsin_history2.5.title: "사업주의 답변"
 tsin_history2.5.desc: "사업주가 합의 이행을 위한 시간을 요청했습니다. 점검관은 현실적인 일정인지 작업을 미루려는 것인지 판단해야 합니다."
 tsin_history2.5.a: "단기 독립 점검에 예산을 배정하라."
 tsin_history2.5.b: "서면 이행 일정을 받아라."
 tsin_history2.6.title: "약속의 이행 점검"
 tsin_history2.6.desc: "대표들이 약속한 개선을 점검하러 돌아왔습니다. 일부 장비는 도착했지만 남은 작업을 어떻게 마칠지 결정해야 합니다."
 tsin_history2.6.a: "마지막 시정 작업에 비용을 지불하라."
 tsin_history2.6.b: "추가 공금 없이 사건을 종결하라."
 tsin_history2.7.title: "협상의 선례"
 tsin_history2.7.desc: "합의 이행이 마무리되었습니다. 관리들은 다음 분쟁이 더 빨리 협상에 이르도록 이번 절차를 남기자고 제안합니다."
 tsin_history2.7.a: "합의한 절차를 기록하라."
 tsin_history2.7.b: "다음에는 각 사업장의 판단에 맡겨라."
 tsin_history2.11.title: "새 제복과 오래된 급료 장부"
 tsin_history2.11.desc: "새로 편성한 부대에 관심이 쏠리는 동안 기존 병력은 자신들의 필요가 무시당한다고 항의합니다. 빠듯한 예산 탓에 배분 하나하나가 논쟁거리입니다."
 tsin_history2.11.a: "배분 장부를 점검하라."
 tsin_history2.11.b: "기존 부대의 보고를 받아라."
 tsin_history2.12.title: "문제가 된 군량 배분"
 tsin_history2.12.desc: "장교들이 군량 배분을 놓고 다투고 있습니다. 일부는 예산을 탓하고 다른 이들은 장부를 결재한 관리에 대한 조사를 요구합니다."
 tsin_history2.12.a: "한정된 조정 비용을 지급하라."
 tsin_history2.12.b: "지급 전에 감사를 계속하라."
 tsin_history2.13.title: "빠진 결재 서명"
 tsin_history2.13.desc: "핵심 명령서에 책임자의 결재가 빠져 있습니다. 돈의 문제가 군정의 책임 소재에 관한 문제로 번졌습니다."
 tsin_history2.13.a: "독립 감사관을 임명하라."
 tsin_history2.13.b: "지휘부의 해명을 요구하라."
 tsin_history2.14.title: "기존 병력의 집회"
 tsin_history2.14.desc: "기존 부대의 대표들이 청문을 요구하며 모였습니다. 예산을 갖춘 일정이 제시된다면 대립이 굳어지기 전에 해결할 수 있습니다."
 tsin_history2.14.a: "예산을 갖춘 일정으로 청원을 해결하라."
 tsin_history2.14.b: "추가 청문을 열어라."
 tsin_history2.15.title: "수도에 전해진 항의"
 tsin_history2.15.desc: "항의가 수도에 전해졌습니다. 문관들과 군사 회의는 누가 해결을 위한 협상을 맡아야 하는지 다투고 있습니다."
 tsin_history2.15.a: "민간 중재에 예산을 배정하라."
 tsin_history2.15.b: "군사 회의에 책임을 남겨라."
 tsin_history2.16.title: "군정 재편"
 tsin_history2.16.desc: "조사단이 명확한 배분 절차와 책임 기록을 권고했습니다. 이를 채택하면 다음 개혁의 집행이 수월해질 것입니다."
 tsin_history2.16.a: "감사한 절차를 채택하라."
 tsin_history2.16.b: "개혁 없이 조사를 끝내라."
 tsin_history2.21.title: "악취의 여름이 지난 뒤"
 tsin_history2.21.desc: "악취의 여름은 지났지만 도시 당국은 약속한 조치의 이행을 설명해야 합니다. 기술자들은 작업을 계속하기 전에 배수 경로를 조사하고자 합니다."
 tsin_history2.21.a: "배수 조사를 지시하라."
 tsin_history2.21.b: "도시의 장부를 요구하라."
 tsin_history2.22.title: "커튼은 하수도가 아니다"
 tsin_history2.22.desc: "석회로 처리한 커튼이 일시적인 위안을 주었습니다. 기술자들은 물 관리 체계에 단순한 방취 이상의 대책이 필요하다고 주장합니다."
 tsin_history2.22.a: "기술 점검에 예산을 배정하라."
 tsin_history2.22.b: "임시 조치를 재검토하라."
 tsin_history2.23.title: "위생 사업의 예산"
 tsin_history2.23.desc: "계획한 사업에는 용지, 노동, 유지비가 필요합니다. 재무 당국은 점검 가능한 장부를 갖춘 한정된 예산을 요구합니다."
 tsin_history2.23.a: "제한된 검토 예산을 승인하라."
 tsin_history2.23.b: "계획을 축소하고 계속하라."
 tsin_history2.24.title: "거리 아래의 경로"
 tsin_history2.24.desc: "기술자들이 지하 경로와 지상의 보상 청구를 비교하고 있습니다. 공개적인 조사는 나중의 분쟁을 줄일 수 있습니다."
 tsin_history2.24.a: "공개적인 경로 평가를 지원하라."
 tsin_history2.24.b: "공공 도로 안의 경로를 유지하라."
 tsin_history2.25.title: "공사 지연과 점검 장부"
 tsin_history2.25.desc: "점검 장부에 완료된 작업과 지연된 계약이 뒤섞여 있습니다. 의회는 추가 검토 비용을 낼지, 공사의 진척을 기다릴지 결정해야 합니다."
 tsin_history2.25.a: "마지막 독립 점검 비용을 지불하라."
 tsin_history2.25.b: "기존 건설 계획의 진척을 기다려라."
 tsin_history2.26.title: "깨끗한 물과 오수의 분리"
 tsin_history2.26.desc: "관리들이 상수와 오수를 분리하는 지침을 준비합니다. 기술자들은 대상 도시의 상하수도가 운영되면 체계를 인증할 예정입니다."
 tsin_history2.26.a: "운영 지침을 공개하라."
 tsin_history2.26.b: "현지 담당자에게 지침을 맡겨라."
 tsin_history2.27.title: "운영 중인 상하수도"
 tsin_history2.27.desc: "대상 도시의 상하수도가 운영에 들어가 검토를 마칠 수 있게 되었습니다. 남은 문제는 운영 절차를 공통 기준으로 삼을지 여부입니다."
 tsin_history2.27.a: "운영 절차를 인증하라."
 tsin_history2.27.b: "국가 인증 없이 절차를 마쳐라."
 tsin_history2.31.title: "경계 너머의 가축"
 tsin_history2.31.desc: "가축을 둘러싼 다툼이 국경 양측의 관리에게 전해졌습니다. 피해는 작지만 양측의 경계 설명은 서로 다릅니다."
 tsin_history2.31.a: "피해 청구를 받아라."
 tsin_history2.31.b: "현지 관리들이 장부를 대조하게 하라."
 tsin_history2.32.title: "배상 요구"
 tsin_history2.32.desc: "인접국 정부가 배상을 요구합니다. 현지 관리들은 합의에 서명하기 전에 피해 내역을 기록해야 한다고 주장합니다."
 tsin_history2.32.a: "문서에 근거한 해결을 추진하라."
 tsin_history2.32.b: "피해의 증거를 요구하라."
 tsin_history2.33.title: "엇갈리는 관할권 설명"
 tsin_history2.33.desc: "양국 정부가 서로 다른 관할권 규정을 제시합니다. 공동 사실 검토라면 모든 주권 문제를 결정하지 않고도 피해 청구를 해결할 수 있습니다."
 tsin_history2.33.a: "공동 사실 검토의 비용을 지불하라."
 tsin_history2.33.b: "서면 설명을 교환하라."
 tsin_history2.34.title: "침착함을 유지하라는 명령"
 tsin_history2.34.desc: "오가는 공문의 어조가 날카로워졌습니다. 현지 관리들은 분쟁이 통제 범위를 벗어나기 전에 명확한 지시를 요구합니다."
 tsin_history2.34.a: "민간 교섭 창구를 유지하라."
 tsin_history2.34.b: "공문을 통해 협의를 계속하라."
 tsin_history2.35.title: "중립적인 사실 정리"
 tsin_history2.35.desc: "중재자들이 물질적 피해와 경계 분쟁을 구분했습니다. 작은 배상금을 지급하고 더 큰 문제는 일반 외교에 남기자고 제안합니다."
 tsin_history2.35.a: "현금 배상안을 준비하라."
 tsin_history2.35.b: "합의 없이 중재를 끝내라."
 tsin_history2.36.title: "작은 합의"
 tsin_history2.36.desc: "인접국 정부가 합의한 배상을 받을 준비를 마쳤습니다. 배상금을 지불하면 현 국경을 유지한 채 물질적 피해 청구를 끝낼 수 있습니다."
 tsin_history2.36.a: "기록된 인접국에 배상금을 지불하라."
 tsin_history2.36.b: "현금 배상을 거절하라."
 tsin_history2.41.title: "빽빽한 주식 청약 명부"
 tsin_history2.41.desc: "신규 회사의 증가와 영업 여건의 약화로 청약 명부에 관심이 쏠렸습니다. 투자자들이 사업 추진자의 약속 뒤에 무엇이 있는지 묻고 있습니다."
 tsin_history2.41.a: "공시 점검을 의뢰하라."
 tsin_history2.41.b: "발행사 자체 보고를 받아라."
 tsin_history2.42.title: "수주와 실제 사업"
 tsin_history2.42.desc: "발행사들이 많은 수주를 보고했습니다. 검토자들은 완료된 사업과 이행되지 않을 수도 있는 계약을 구분하고자 합니다."
 tsin_history2.42.a: "독립적인 대조에 예산을 배정하라."
 tsin_history2.42.b: "확보한 보고서를 공개하라."
 tsin_history2.43.title: "회계에 대한 의혹"
 tsin_history2.43.desc: "회계에 대한 의문이 최초 청약자 밖으로 퍼졌습니다. 신중한 조사는 신뢰할 만한 정보가 소문에 밀려나는 것을 막을 수 있습니다."
 tsin_history2.43.a: "현금과 채무 장부를 검토하라."
 tsin_history2.43.b: "기업 자체 조사로 남겨라."
 tsin_history2.44.title: "협의에 나선 채권자들"
 tsin_history2.44.desc: "은행가와 회사채 보유자가 협의에 나서기로 했습니다. 계약 조건이 다르고 기업의 남은 현금에 대한 청구도 다릅니다."
 tsin_history2.44.a: "질서 있는 협의에 예산을 배정하라."
 tsin_history2.44.b: "기존 계약의 처리를 따르라."
 tsin_history2.45.title: "위험 보고서"
 tsin_history2.45.desc: "보고서는 반복된 과잉 진입과 과잉공급의 징후를 비교합니다. 근거를 공개하면 투자자들이 일시적인 약세와 지속적인 부실을 구분하는 데 도움이 될 수 있습니다."
 tsin_history2.45.a: "기록된 근거를 공개하라."
 tsin_history2.45.b: "검토 담당자에게만 보고하라."
 tsin_history2.46.title: "업종마다 다른 손실"
 tsin_history2.46.desc: "농업과 산업이 서로 다른 손실을 보고합니다. 관리들은 공통 보고서로 충분한지, 더 자세한 평가가 비용을 들일 만한지 판단해야 합니다."
 tsin_history2.46.a: "업종별 평가에 예산을 배정하라."
 tsin_history2.46.b: "조정은 기존 정책에 맡겨라."
 tsin_history2.47.title: "회복 보고"
 tsin_history2.47.desc: "특별 위원회가 종료를 준비합니다. 회복이 고르지 않더라도 이번 공시 절차는 다음 경기 국면에 유용할 수 있습니다."
 tsin_history2.47.a: "공시 절차를 유지하라."
 tsin_history2.47.b: "특별 위원회를 종료하라."
 tsin_history2.51.title: "목적을 정하는 시찰단"
 tsin_history2.51.desc: "관리들이 산업 국가를 시찰할 사절단의 파견을 제안했습니다. 예산과 함께 일행을 받아들일 정부가 필요합니다."
 tsin_history2.51.a: "방문 요청과 시찰단 비용을 지불하라."
 tsin_history2.51.b: "시찰단을 연기하라."
 tsin_history2.52.title: "수락된 방문"
 tsin_history2.52.desc: "방문국 정부가 제한된 시찰을 수락했습니다. 사절단은 예산 안에서 마칠 수 있는 일정을 정해야 합니다."
 tsin_history2.52.a: "한정된 시찰 일정을 정하라."
 tsin_history2.52.b: "시찰단을 철회하라."
 tsin_history2.53.title: "산업 시찰 보고"
 tsin_history2.53.desc: "사절들이 방문국의 산업 제도와 국내 사정을 비교합니다. 기록을 번역하고 대조하는 정도에 따라 내각이 활용할 수 있는 내용도 달라질 것입니다."
 tsin_history2.53.a: "보고서 번역 비용을 지불하라."
 tsin_history2.53.b: "확보한 기록을 요약하라."
 tsin_history2.54.title: "교육과 숙련 노동"
 tsin_history2.54.desc: "논의가 교육과 숙련 노동으로 옮겨갔습니다. 사절들은 국내 체계를 전부 새로 만들지 않고도 어떤 실무를 도입할 수 있을지 의견을 달리합니다."
 tsin_history2.54.a: "교육 보고서 작성에 예산을 배정하라."
 tsin_history2.54.b: "참고용 비교로 남겨라."
 tsin_history2.55.title: "군제 관련 각서"
 tsin_history2.55.desc: "군사 각서는 임무와 책임의 배분을 설명합니다. 내각은 어떤 관찰 내용을 보고서에 남길지 결정해야 합니다."
 tsin_history2.55.a: "참고할 조직을 기록하라."
 tsin_history2.55.b: "군사 실무는 유지하라."
 tsin_history2.56.title: "해외 체류 비용"
 tsin_history2.56.desc: "마지막 방문 일정을 진행하면 체류가 길어집니다. 정보가 더 유용할 수 있지만 숙박·통역·교통에는 계속 비용이 듭니다."
 tsin_history2.56.a: "마지막 방문 일정의 비용을 지불하라."
 tsin_history2.56.b: "일정을 앞당겨 끝내라."
 tsin_history2.57.title: "내각에 올라온 보고서"
 tsin_history2.57.desc: "보고서가 내각에 올라왔습니다. 관리들은 외국의 실무를 도입하기 전에 실행 가능성을 검토하자고 요청합니다."
 tsin_history2.57.a: "실행 가능성 검토를 의뢰하라."
 tsin_history2.57.b: "보고서를 보관소에 남겨라."
 tsin_history2.58.title: "견학 성과의 활용"
 tsin_history2.58.desc: "시찰단이 대조를 마친 보고서를 가지고 귀환했습니다. 이제 그 성과를 활용할지는 국내 관리들의 의지에 달렸습니다."
 tsin_history2.58.a: "검토한 실무를 적용하라."
 tsin_history2.58.b: "채택 없이 시찰을 마쳐라."
 tsin_history2.99.title: "시찰단의 방문 요청"
 tsin_history2.99.desc: "다른 정부가 우리 산업 제도와 시설을 시찰하고자 합니다. 시찰단의 일정을 수락할지 거절할지 결정해야 합니다."
 tsin_history2.99.a: "제한된 시찰단을 받아들여라."
 tsin_history2.99.b: "이번 방문은 거절하라."
 tsin_history2.100.title: "시찰 일정의 중단"
 tsin_history2.100.desc: "예정한 방문을 진행할 수 없게 되었습니다. 시찰단은 추가 비용이 발생하기 전에 귀환할 것입니다."
 tsin_history2.100.a: "시찰단을 귀환시켜라."
