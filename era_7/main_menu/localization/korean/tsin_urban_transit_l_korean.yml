l_korean:
 tsin_steam_metro: "증기 지하철 시범선"
 tsin_electric_metro: "전기 지하철"
 tsin_steam_metro_desc: "인구 10만 이상 도시의 고비용 시범선입니다. 최대 1단계, 지역 수용력 +1%로 전기 지하철 1단계의 20% 효율입니다. 도시간 철도를 연결하지 않습니다. 시범선 제한은 게임 밸런스입니다."
 tsin_electric_metro_desc: "인구 10만 이상 도시의 전력 기반 교통시설입니다. 단계당 지역 수용력 +5%, 최대 3단계입니다. 증기 시범선을 대체하며 별도 도시 간 철도 연결을 만들지 않습니다."
 AUTO_MODIFIER_NAME_tsin_connected_railway_station: "수도 연결 철도역"
