l_korean:
 TSIN_GREAT_HUNGER_PANEL_GUIDANCE: "기근은 시작 후 최소 4년 동안 이어지며, 병충해 보정치도 사라져야 끝납니다. 식량 생산과 시장 공급을 점검하고 진행 중에 나타나는 구호·이주 이벤트에 대응하십시오. 정확한 종료 상태는 종료 요건 탭에서 확인할 수 있습니다."
 TSIN_MILLENARIAN_REBELLION_PANEL_GUIDANCE: "반란은 시작 후 최소 3년 동안 이어지며, 천년왕국 반란군이 남아 있으면 끝나지 않습니다. 반란군을 진압하고 반란으로 피해를 입은 지방을 회복하십시오. 정확한 종료 상태는 종료 요건 탭에서 확인할 수 있습니다."
 TSIN_SECESSION_CRISIS_PANEL_GUIDANCE: "위기는 협상과 분열 이벤트를 통해 진행됩니다. 타협으로 해결하지 못하면 준비 기간 뒤 분리주의 반란이 시작될 수 있습니다. 분리주의 반란을 진압하면 재통합 이벤트로 위기가 해결됩니다. 정확한 종료 상태는 종료 요건 탭에서 확인할 수 있습니다."
