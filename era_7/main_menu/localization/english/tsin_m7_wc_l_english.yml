l_english:

 # Modern Times events tsin_working_class.20-.80
 tsin_working_class.20.title: "The Assembly Line"
 tsin_working_class.20.desc: "The efficiency men walk the shop floor with their stopwatches. Run the belt a little faster, they reckon, and the same hands will turn out a tenth more each day. The men at the belt already feel their wrists ache from tightening the same bolt."
 tsin_working_class.20.a: "Speed up the line."
 tsin_working_class.20.b: "A man is not a bolt."
 tsin_working_class.30.title: "The Feeding Machine"
 tsin_working_class.30.desc: "An inventor has brought a remarkable device. It lets a worker eat his lunch without leaving his station: it spoons the soup, turns the corn on the cob, and even wipes his mouth. Abolish the lunch hour, he says, and the works will never stop."
 tsin_working_class.30.a: "Buy it for the state works."
 tsin_working_class.30.b: "Lunch is not a waste of time."
 tsin_working_class.40.title: "Nervous Breakdown"
 tsin_working_class.40.desc: "A worker who tightened the same bolt twelve hours a day could not stop his hands after the belt halted. He ran into the street trying to tighten buttons and noses like bolts, and was caught. The factory doctors call it a new disease."
 tsin_working_class.40.a: "Pay for factory doctors."
 tsin_working_class.40.b: "Send him to the asylum."
 tsin_working_class.50.title: "The Red Flag"
 tsin_working_class.50.desc: "An unemployed man picked up a red warning flag that fell from a lorry and waved it to give it back. A march came round the corner just then and fell in behind him, and the police arrested him as its ringleader. The newspapers already have his face on the front page."
 tsin_working_class.50.a: "Try him as a ringleader."
 tsin_working_class.50.b: "Let the poor fellow go."
 tsin_working_class.60.title: "Better Fed in Jail"
 tsin_working_class.60.desc: "As the slump drags on, prisoners due for release petition to stay a little longer. The cells have a stove and three meals a day; outside the factory gates there is nothing. The poor law board calls it a national disgrace."
 tsin_working_class.60.a: "Open the poor relief."
 tsin_working_class.60.b: "The workhouse, not the dole."
 tsin_working_class.70.title: "The Department Store at Night"
 tsin_working_class.70.desc: "A story goes round of the night watchman at the new department store who roller-skates through the closed floors and dreams. By day the clerks sell goods they could never afford; by night they are masters among them for an hour. The merchants propose to sell the dream on credit."
 tsin_working_class.70.a: "Sell on credit and stay open late."
 tsin_working_class.70.b: "Close the shops on Sunday."
 tsin_working_class.80.title: "The Road Out"
 tsin_working_class.80.desc: "At dawn two figures were seen on the dusty road out of the factory town. They have lost their work and their home, yet they smile at each other as they walk. Every year more workers turn their backs on the chimneys and set off somewhere."
 tsin_working_class.80.a: "Fund homestead colonies for the unemployed."
 tsin_working_class.80.b: "Let them go."
