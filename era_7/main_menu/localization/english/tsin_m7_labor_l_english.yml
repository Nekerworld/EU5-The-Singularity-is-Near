l_english:

 tsin_union_recognition: "Union Recognition"
 tsin_union_recognition_desc: "Factory workers' unions are recognized as lawful bodies and bargain collectively with employers. Requires [ShowEstatePrivilegeName('tsin_mutual_aid_societies')] and lowers the [tsin_labor_grievance_concept|e] target by 10."
 pa_tsin_factory_inspection: "Stronger Factory Inspection"
 pa_tsin_factory_inspection_desc: "The commons demand more inspectors to look into factory accidents and child labor. [tsin_labor_grievance_concept|e] falls by 10."
 pa_tsin_ten_hour_day: "The Ten-Hour Day"
 pa_tsin_ten_hour_day_desc: "The unions demand a law limiting the working day to ten hours. [tsin_labor_grievance_concept|e] falls by 15 and [production_efficiency|e] drops slightly."
 STATIC_MODIFIER_NAME_tsin_factory_inspection_agenda: "Stronger Factory Inspection"
 STATIC_MODIFIER_NAME_tsin_ten_hour_day: "The Ten-Hour Day"
 tsin_society.80.title: "A Factory Accident"
 tsin_society.80.desc: "A boiler has burst in a factory at [tsin_accident_location.GetName], killing several workers. The families demand compensation, and the newspapers race to report the wretched conditions inside the mills."
 tsin_society.80.a: "Compensate the families."
 tsin_society.80.b: "Open a public inquiry."
 tsin_society.80.c: "The workers were careless."
 tsin_society.90.title: "A Socialist Reading Circle"
 tsin_society.90.desc: "Police reports say the workers of [tsin_cell_location.GetName] meet every night to pass socialist pamphlets around. The circle is quiet for now, but it is spreading its contacts beyond the factory gates."
 tsin_society.90.a: "Raid the circle."
 tsin_society.90.b: "Let them read."
 tsin_society.90.c: "Draw them into the unions."
 tsin_society.100.title: "A May Day Demonstration"
 tsin_society.100.desc: "On the first of May, the streets of [tsin_demonstration_location.GetName] fill with workers demanding the eight-hour day. Red flags wave between the factory chimneys, and the owners demand that the army be called out."
 tsin_society.100.a: "Promise shorter hours."
 tsin_society.100.b: "Disperse the crowd."
 tsin_society.100.c: "Let them march."
 STATIC_MODIFIER_NAME_tsin_anti_anarchist_laws: "Anti-Anarchist Laws"
 STATIC_MODIFIER_NAME_tsin_bloody_week: "The Bloody Week"
 STATIC_MODIFIER_NAME_tsin_municipal_commune: "Municipal Commune"
 tsin_society.110.title: "The International Workingmen's Association"
 tsin_society.110.desc: "Workers' delegates from many countries have met in a London hall and founded an association that crosses borders. Union leaders from our own country have signed its founding address."
 tsin_society.110.a: "Ban the association."
 tsin_society.110.b: "Tolerate it as a debating club."
 tsin_society.120.title: "An Anarchist Assassination"
 tsin_society.120.desc: "An anarchist has thrown a bomb at a minister's carriage. In court he cried \"propaganda of the deed\", and the newspapers speak of secret societies and conspiracies."
 tsin_society.120.a: "Pass emergency laws against the anarchists."
 tsin_society.120.b: "Mourn, but do not change the law."
 tsin_society.125.title: "A Commune in the Capital"
 tsin_society.125.desc: "Amid the humiliation of defeat, the national guard and workers of [tsin_commune_location.GetName] have raised barricades and proclaimed a self-governing commune. Government troops wait outside the city for orders."
 tsin_society.125.a: "Storm the barricades."
 tsin_society.125.b: "Grant the city self-government."
