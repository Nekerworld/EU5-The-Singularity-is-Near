 tsin_powers.10.title: "A Congress of the Powers"
 tsin_powers.10.desc: "After a long war, the diplomats of the powers have gathered in our capital. Borders, straits and the fate of smaller states lie on the conference table."
 tsin_powers.10.a: "A balance of power: settle the questions together."
 tsin_powers.10.b: "We dictate the terms."
 tsin_powers.20.title: "The Geneva Convention"
 tsin_powers.20.desc: "A merchant who witnessed the horrors of a battlefield proposes an international convention to care for the wounded of friend and foe alike. Medics under a flag with a red cross on white would be spared from attack."
 tsin_powers.20.a: "Sign the convention."
 tsin_powers.20.b: "War has no rules."
 tsin_powers.30.title: "The Naval Arms Race"
 tsin_powers.30.desc: "A rival has launched bigger and faster steel battleships. The newspapers cry that our fleet is already obsolete, and the admirals demand funds for new battleships."
 tsin_powers.30.a: "Lay down new battleships."
 tsin_powers.30.b: "Our strength lies on land."
 tsin_dual_monarchy_decision: "The Dual Monarchy Compromise"
 tsin_dual_monarchy_decision.title: "The Dual Monarchy Compromise"
 tsin_dual_monarchy_decision.desc: "Grant the largest minority its own parliament and government, sharing only the monarch, foreign affairs and the army. Its culture becomes an [accepted_culture|e].\n\nSee also: [tsin_great_power_politics_concept|e]"
 tsin_dual_monarchy_decision.a: "Two crowns, one monarch."
