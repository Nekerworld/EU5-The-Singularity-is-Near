l_english:
 TSIN_GREAT_HUNGER_PANEL_GUIDANCE: "The famine lasts at least four years, and the crop blight must also have ended. Check food production and market supply, and respond to relief and migration events. Check the end requirements tab for the current conditions."
 TSIN_MILLENARIAN_REBELLION_PANEL_GUIDANCE: "The rebellion lasts at least three years and cannot end while the millenarian rebels remain. Defeat the rebels and restore the devastated provinces. Check the end requirements tab for the current conditions."
 TSIN_SECESSION_CRISIS_PANEL_GUIDANCE: "Negotiation and division events advance the crisis. Without a compromise, secessionist rebels may rise after the crisis period. Defeating them leads to the reunion event. Check the end requirements tab for the current conditions."
