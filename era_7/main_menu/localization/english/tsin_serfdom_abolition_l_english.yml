l_english:
 tsin_serfdom.1.title: "Emancipation Decree"
 tsin_serfdom.1.desc: "Industrial and legal pressure has given the crown a chance to end serfdom. The situation resembles royal emancipation edicts such as Russia's 1861 decree. Noble resistance is expected."
 tsin_serfdom.1.a: "Free them with land, paid in redemption dues"
 tsin_serfdom.1.b: "Free them without land"
 tsin_serfdom.1.c: "Full emancipation without dues"
 tsin_serfdom.2.title: "Parliamentary Emancipation Bill"
 tsin_serfdom.2.desc: "Parliament has brought the end of serfdom to a vote. Burgher and peasant support is outweighing noble resistance."
 tsin_serfdom.2.a: "Pass redemption emancipation"
 tsin_serfdom.2.b: "Pass full emancipation"
 tsin_serfdom.2.c: "Pass landless emancipation"
 tsin_serfdom.3.title: "Pressure to End Serfdom"
 tsin_serfdom.3.desc: "Industry, defeat or failed modernization has made serfdom untenable. Emancipation is debated regardless of government form."
 tsin_serfdom.3.a: "Proclaim full emancipation"
 tsin_serfdom.3.b: "Proclaim redemption emancipation"
 tsin_serfdom.3.c: "Proclaim landless emancipation"
 STATIC_MODIFIER_NAME_tsin_land_reform_redeemed: "Land reform (redemption)"
 STATIC_MODIFIER_NAME_tsin_land_reform_landless: "Land reform (landless)"
 STATIC_MODIFIER_NAME_tsin_land_reform_full: "Land reform (full)"
