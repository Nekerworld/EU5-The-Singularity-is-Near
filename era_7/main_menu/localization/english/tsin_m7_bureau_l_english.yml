l_english:

 # National statistics bureau (docs/economic_statistics.md)
 tsin_national_statistics_bureau: "National Statistics Bureau"
 tsin_national_statistics_bureau_desc: "A permanent office for the census and industrial statistics. Numbers come before any change of policy. The economic statistics report ([tsin_estimated_gdp_concept|e]) becomes detailed."
 tsin_system.30.desc_bureau: "The National Statistics Bureau's yearly report.\n\n$BULLET$Estimated national product: [ROOT.ScriptValue('tsin_gdp')|0]\n$BULLET$Output per head: [ROOT.ScriptValue('tsin_gdp_per_capita')|3]\n$BULLET$Growth over last year: [ROOT.ScriptValue('tsin_gdp_growth')|2]%\n$BULLET$Population: [ROOT.ScriptValue('tsin_econ_population')|0]\n$BULLET$Productivity multiplier: [ROOT.ScriptValue('tsin_gdp_productivity')|2]\n$BULLET$Literacy: [ROOT.ScriptValue('tsin_country_literacy')|0], secondary education: [ROOT.ScriptValue('tsin_country_secondary_education')|1], higher education: [ROOT.ScriptValue('tsin_country_higher_education')|1]\n$BULLET$Factory worker share: [ROOT.ScriptValue('tsin_econ_factory_share')|%1]\n$BULLET$Labor grievance: [ROOT.ScriptValue('tsin_econ_labor_grievance')|0]\n$BULLET$Stock index: [ROOT.ScriptValue('tsin_stock_index_report')|0] (two-year mean [ROOT.ScriptValue('tsin_stock_index_history_mean')|0], world [ROOT.ScriptValue('tsin_world_stock_index_report')|0])\n$BULLET$Total company value: [ROOT.ScriptValue('tsin_company_total_value')|0]\n\nThe estimate adds the tax base of cities and towns, trade and tax income and the subsistence output of the population, then adjusts productivity for education."
